oductResponse&gt; \u003cspan class=\"hljs-title function_\">findAll\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> productService.findAll();\n    }\n\n    \u003cspan class=\"hljs-meta\">@GetMapping(&quot;/{id}&quot;)\u003c/span>                 \u003cspan class=\"hljs-comment\">// GET /api/products/42\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">ProductResponse\u003c/span> \u003cspan class=\"hljs-title function_\">findById\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@PathVariable\u003c/span> Long id)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> productService.findById(id);\n    }\n\n    \u003cspan class=\"hljs-meta\">@PostMapping\u003c/span>                        \u003cspan class=\"hljs-comment\">// POST /api/products\u003c/span>\n    \u003cspan class=\"hljs-meta\">@ResponseStatus(HttpStatus.CREATED)\u003c/span>  \u003cspan class=\"hljs-comment\">// вернём 201, а не 200\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">ProductResponse\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@RequestBody\u003c/span> CreateProductRequest request)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> productService.create(request);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Как запрос находит метод:\u003c/p>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant C as Клиент\n    participant W as Spring (DispatcherServlet)\n    participant K as ProductController\n    participant S as ProductService\n    C-&gt;&gt;W: GET /api/products/42\n    W-&gt;&gt;W: смотрит путь+метод → findById(42)\n    W-&gt;&gt;K: вызвать метод, конвертировать аргументы\n    K-&gt;&gt;S: findById(42)\n    S--&gt;&gt;K: ProductResponse\n    K--&gt;&gt;W: объект\n    W--&gt;&gt;C: 200 OK + JSON\u003c/div>\u003cp>Разбор аннотаций-переводчиков:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Аннотация\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>@RestController\u003c/code>\u003c/td>\n\u003ctd>«этот класс — REST-endpoint»: методы возвращают объекты, Spring сериализует их в JSON\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@GetMapping\u003c/code> / \u003ccode>@PostMapping\u003c/code> / \u003ccode>@PutMapping\u003c/code> / \u003ccode>@DeleteMapping\u003c/code>\u003c/td>\n\u003ctd>какой HTTP-метод и путь обрабатывает метод\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@PathVariable\u003c/code>\u003c/td>\n\u003ctd>кусочек пути (\u003ccode>42\u003c/code> из \u003ccode>/api/products/42\u003c/code>) → аргумент метода\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@RequestBody\u003c/code>\u003c/td>\n\u003ctd>тело запроса (JSON) → Java-объект\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@ResponseStatus\u003c/code>\u003c/td>\n\u003ctd>какой статус вернуть при успехе\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> \u003ccode>@GetMapping(&quot;/api/products&quot;)\u003c/code> ≈ маршрут вашего роутера, \u003ccode>@RequestBody\u003c/code> ≈ \u003ccode>JSON.parse\u003c/code> + zod-схема: Spring сам распарсит тело и сложит его в объект. Вы пишете обработчик — фреймворк вызывает.\u003c/p>\n\u003c/blockquote>\n\u003ch2>DTO: контракт обмена, а не внутренности\u003c/h2>\n\u003cp>Класс для ответа API — отдельный. Это \u003cstrong>DTO\u003c/strong> (Data Transfer Object):\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">record\u003c/span> \u003cspan class=\"hljs-title class_\">ProductResponse\u003c/span>\u003cspan class=\"hljs-params\">(          // record: неизменяемый класс данных\n        Long id,\n        String title,\n        BigDecimal price\n)\u003c/span> {}\n\u003c/code>\u003c/pre>\n\u003cp>Зачем не отдавать «настоящий» объект из базы напрямую?\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Стабильный контракт\u003c/strong>: поменяли поле в хранилище — API не дрогнул; фронтенд не падает от лишних внутренних полей.\u003c/li>\n\u003cli>\u003cstrong>Безопасность\u003c/strong>: не утечет \u003ccode>passwordHash\u003c/code> или себестоимость.\u003c/li>\n\u003cli>\u003cstrong>Понятно, чтоAPI\u003c/strong>: DTO — это и есть описание API: поля запроса и ответа.\u003c/li>\n\u003c/ul>\n\u003cp>Для запросов — то же самое: \u003ccode>CreateProductRequest(String title, BigDecimal price)\u003c/code>. Spring превратит \u003ccode>{&quot;title&quot;: &quot;Кроссовки&quot;, &quot;price&quot;: 5990}\u003c/code> в этот объект, а на ошибку валидации вернёт \u003ccode>400\u003c/code>.\u003c/p>\n\u003ch2>MapStruct: переливание полей без боли\u003c/h2>\n\u003cp>Внутри приложения — свои объекты (entity, о них в уроке 5), снаружи — DTO. Между ними нужен «переливальщик». \u003cstrong>MapStruct\u003c/strong> генерирует его сам:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Mapper(componentModel = &quot;spring&quot;)\u003c/span>      \u003cspan class=\"hljs-comment\">// реализацию соберёт Spring\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">ProductMapper\u003c/span> {\n    \u003cspan class=\"hljs-type\">ProductResponse\u003c/span> \u003cspan class=\"hljs-title function_\">toResponse\u003c/span>\u003cspan class=\"hljs-params\">(Product product)\u003c/span>;      \u003cspan class=\"hljs-comment\">// entity → DTO\u003c/span>\n    \u003cspan class=\"hljs-type\">Product\u003c/span> \u003cspan class=\"hljs-title function_\">toEntity\u003c/span>\u003cspan class=\"hljs-params\">(CreateProductRequest request)\u003c/span>;   \u003cspan class=\"hljs-comment\">// DTO → entity\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Одна строчка на преобразование — MapStruct сгенерирует класс с честным \u003ccode>new ProductResponse(product.getId(), product.getTitle(), ...)\u003c/code>. Скучные присваивания полей больше не пишут руками.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> MapStruct-мапперы — любимое место коварных багов: поле забыли замапить — в ответе будет \u003ccode>null\u003c/code>. Проверяйте не только статус 200, но и значения всех полей DTO.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Код-first и API-First: два подхода к дизайну API\u003c/h2>\n\u003cp>Мы писали код — и API получался каким вышел (это \u003cstrong>code-first\u003c/strong>). Есть и обратный путь — \u003cstrong>API-First\u003c/strong>:\u003c/p>\n\u003col>\n\u003cli>Сначала \u003cstrong>контракт\u003c/strong>: OpenAPI-файл (YAML), где описаны пути, запросы, ответы, коды ошибок.\u003c/li>\n\u003cli>Из контракта \u003cstrong>генерируется\u003c/strong> код: заготовки контроллеров на бэкенде и типизированные клиенты на фронтенд.\u003c/li>\n\u003cli>Контракт — предмет договора: фронтендер, QA и аналитик читают его до того, как код написан.\u003c/li>\n\u003c/ol>\n\u003cp>API-First особенно силён, когда API много и их потребляют другие команды. Погружение в контрактный подход и сравнение с GraphQL (альтернативный стиль API, где клиент сам просит нужные поля) — тема отдельного модуля «Проектирование API».\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Контроллер = класс с \u003ccode>@RestController\u003c/code>; аннотации маппинга связывают метод+путь с HTTP\u003c/li>\n\u003cli>\u003ccode>@PathVariable\u003c/code> — из пути, \u003ccode>@RequestBody\u003c/code> — из тела; Spring сам конвертирует JSON ↔ объекты\u003c/li>\n\u003cli>API принимает и возвращает \u003cstrong>DTO\u003c/strong> — стабильный контракт, а не внутренние объекты\u003c/li>\n\u003cli>\u003cstrong>MapStruct\u003c/strong> генерирует перевод entity ↔ DTO\u003c/li>\n\u003cli>Есть два мира: code-first (пишем код — API получается) и \u003cstrong>API-First\u003c/strong> (сначала контракт OpenAPI, потом генерация)\u003c/li>\n\u003c/ul>\n\u003cp>Осталось собрать последний слой пазла: что происходит в сервисе и репозитории, причём тут Hibernate и Kafka — урок 5. А пока — первая настоящая кодовая практика.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","codeLang":"java","code":"@RestController\n@RequestMapping(\"/api/orders\")\npublic class OrderController {\n\n    @GetMapping(\"/{id}\")\n    public OrderResponse findById(@PathVariable Long id) { ... }\n}\n","question":"Какой запрос обработает метод findById?","options":["GET /api/orders/42","POST /api/orders/42","GET /api/orders?id=42","GET /findById/42"],"correct":0,"explanation":"Префикс класса + путь метода: /api/orders + /{id}. {id} — переменная кусок пути, её значение попадает в аргумент через @PathVariable. Метод задан @GetMapping — значит HTTP GET.","codeHtml":"\u003cspan class=\"hljs-meta\">@RestController\u003c/span>\n\u003cspan class=\"hljs-meta\">@RequestMapping(&quot;/api/orders&quot;)\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderController\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@GetMapping(&quot;/{id}&quot;)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderResponse\u003c/span> \u003cspan class=\"hljs-title function_\">findById\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@PathVariable\u003c/span> Long id)\u003c/span> { ... }\n}\n"},{"type":"single","question":"Метод контроллера помечен @RequestBody CreateProductRequest request. Что делает Spring с телом запроса?","options":["Распарсит JSON тела и соберёт из него объект CreateProductRequest","Передаст тело как сырую строку","Проигнорирует тело — оно недоступно в Spring","Сохранит тело сразу в базу данных"],"correct":0,"explanation":"@RequestBody = «тело запроса → объект»: Spring десериализует JSON в ваш класс. Если JSON не соответствует — клиент получит 400 Bad Request."},{"type":"multi","question":"Зачем API принимает и возвращает DTO, а не внутренние объекты приложения? (несколько ответов)","options":["API-контракт стабилен: внутренние refactor'ы не ломают клиентов","Не утекут внутренние и секретные поля (себестоимость, passwordHash)","DTO ускоряют запросы к базе данных","DTO обязательны по стандарту языка Java"],"correct":[0,1],"explanation":"DTO — про контракт и безопасность. Скорость базы они сами по себе не добавляют, и это не требование языка — это архитектурная привычка."},{"type":"match","question":"Сопоставь аннотацию и её роль.","pairs":[{"left":"@RestController","right":"Класс принимает HTTP и возвращает JSON"},{"left":"@RequestBody","right":"Тело запроса → Java-объект"},{"left":"@PathVariable","right":"Кусочек пути → аргумент метода"},{"left":"@ResponseStatus","right":"Статус-код успешного ответа"}]},{"type":"blank","question":"Какая аннотация Spring превращает обычный класс в REST-контроллер? Напиши её с собакой.","answers":["@RestController"],"explanation":"@RestController = @Controller + @ResponseBody: методы возвращают объекты, которые Spring сериализует в JSON."},{"type":"single","codeLang":"java","code":"@Mapper(componentModel = \"spring\")\npublic interface ProductMapper {\n    ProductResponse toResponse(Product product);\n}\n","question":"Что делает MapStruct с этим интерфейсом?","options":["Генерирует реализацию, которая перекладывает поля Product в поля ProductResponse","Ничего: интерфейс без реализации нерабочий, код упадёт при старте","Превращает ProductResponse в JSON в базе данных","Создаёт REST-endpoint /api/mapper"],"correct":0,"explanation":"MapStruct на этапе компиляции генерирует класс-реализацию с присваиванием одноимённых полей. Руками эти присваивания писать не нужно; отличия имён настраиваются аннотациями @Mapping.","codeHtml":"\u003cspan class=\"hljs-meta\">@Mapper(componentModel = &quot;spring&quot;)\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">ProductMapper\u003c/span> {\n    \u003cspan class=\"hljs-type\">ProductResponse\u003c/span> \u003cspan class=\"hljs-title function_\">toResponse\u003c/span>\u003cspan class=\"hljs-params\">(Product product)\u003c/span>;\n}\n"},{"type":"single","question":"Команда работает по API-First. Продакт просит новое поле в ответе заказа. С чего правильно начать?","options":["С правки контракта OpenAPI и согласования с потребителями API, потом генерация и код","С добавления поля в Java-класс ответа — контракт догонит потом","С изменения базы данных, остальное приложится","С письма фронтендерам: «поле уже есть, проверьте»"],"correct":0,"explanation":"API-First = контракт сначала: OpenAPI — источник правды. Сначала правим и согласуем специкацию с теми, кто API потребляет, затем генерируем/пишем код под неё. Добавить поле «сразу в класс» — путь code-first, он ломает саму идею договора."}]],"cases":[]},{"id":"lesson-05","title":"Слои приложения и Kafka","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":5,"baseOrder":null,"lab":{"title":"Лаба 2. Финальный срез","description":"Полный срез своими руками: контроллер → сервис → репозиторий (H2). С автотестами: mvn test зелёный — лаба сдана. Решение — для сверки «как красиво».","branch":"lab-2","branchSolution":"lab-2-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 5. Слои приложения и Kafka\u003c/h1>\n\u003cp>Последний пазл пилота: как слои работают вместе, что именно делает Hibernate в репозитории, куда в этой картине встаивает Kafka — и как понять, что живой сервис жив.\u003c/p>\n\u003ch2>Сервисный слой: бизнес-сердце\u003c/h2>\n\u003cp>Всё «что можно и почём» — здесь:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Service\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> OrderRepository orderRepository;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> OrderMapper orderMapper;\n\n    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">OrderService\u003c/span>\u003cspan class=\"hljs-params\">(OrderRepository orderRepository, OrderMapper orderMapper)\u003c/span> {\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.orderRepository = orderRepository;\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.orderMapper = orderMapper;\n    }\n\n    \u003cspan class=\"hljs-meta\">@Transactional\u003c/span>                       \u003cspan class=\"hljs-comment\">// метод = транзакция: всё или ничего\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderResponse\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest request)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">if\u003c/span> (request.items().isEmpty())                       \u003cspan class=\"hljs-comment\">// бизнес-правило\u003c/span>\n            \u003cspan class=\"hljs-keyword\">throw\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">EmptyOrderException\u003c/span>();\n\n        \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderMapper.toEntity(request);\n        order.setStatus(\u003cspan class=\"hljs-string\">&quot;NEW&quot;\u003c/span>);\n        \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">saved\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderRepository.save(order);           \u003cspan class=\"hljs-comment\">// в базу\u003c/span>\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> orderMapper.toResponse(saved);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>@Transactional\u003c/code> — «всё или ничего»: если после сохранения заказа что-то упадёт, база останется как была. Половинчатых заказов не бывает.\u003c/p>\n\u003ch2>Репозиторий и Hibernate: база без SQL\u003c/h2>\n\u003cp>Самая большая магия Spring Data. Репозиторий — просто интерфейс:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">OrderRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Order, Long&gt; {\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-title function_\">findByCustomerIdAndStatus\u003c/span>\u003cspan class=\"hljs-params\">(Long customerId, String status)\u003c/span>;\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>JpaRepository\u003c/code> дарит готовые \u003ccode>save\u003c/code>, \u003ccode>findById\u003c/code>, \u003ccode>deleteById\u003c/code> и умеет \u003cstrong>сам генерировать SQL по имени метода\u003c/strong>: \u003ccode>findByCustomerIdAndStatus\u003c/code> превратится в \u003ccode>WHERE customer_id = ? AND status = ?\u003c/code>. SQL вы увидите в логах, но писать руками — почти никогда.\u003c/p>\n\u003cp>А \u003ccode>Order\u003c/code> — это \u003cstrong>entity\u003c/strong>: Java-класс, отображённый на таблицу:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Entity\u003c/span>\n\u003cspan class=\"hljs-meta\">@Table(name = &quot;orders&quot;)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Builder\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Order\u003c/span> {\n    \u003cspan class=\"hljs-meta\">@Id\u003c/span> \u003cspan class=\"hljs-meta\">@GeneratedValue(strategy = GenerationType.IDENTITY)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long id;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long customerId;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String status;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> BigDecimal amount;\n}\n\u003c/code>\u003c/pre>\n\u003cp>Это и есть \u003cstrong>Hibernate/JPA\u003c/strong>: аннотациями мы говорим «класс = таблица, поле = колонка», а фреймворк переводит объекты в SQL-запросы и обратно. В лабах база — H2, in-memory: поднялась с приложением, умерла с ним. Боевая СУБД (PostgreSQL) — тот же код, другой \u003ccode>datasource.url\u003c/code> в конфиге.\u003c/p>\n\u003cp>Схема таблиц меняется не «руками в базе», а \u003cstrong>миграциями\u003c/strong> (Liquibase): файл в репо = шаг изменения схемы, применяется автоматически при старте.\u003c/p>\n\u003cp>Вся картина вместе:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart TD\n    C[&quot;Клиент&quot;] --&gt;|&quot;HTTP + JSON&quot;| K[&quot;Контроллер&lt;br/&gt;(DTO, валидация)&quot;]\n    K --&gt; S[&quot;Сервис&lt;br/&gt;(бизнес-логика, @Transactional)&quot;]\n    S --&gt; M[&quot;MapStruct&lt;br/&gt;entity ↔ DTO&quot;]\n    S --&gt; R[&quot;Репозиторий&lt;br/&gt;(JpaRepository)&quot;]\n    R --&gt; DB[(&quot;База данных&lt;br/&gt;(H2 / PostgreSQL)&quot;]\n    S --&gt; P[&quot;KafkaTemplate&lt;br/&gt;(публикация событий)&quot;]\n    P --&gt; T[&quot;Kafka: topic orders.created&quot;]\n    T --&gt; N[&quot;Другие сервисы:&lt;br/&gt;уведомления, аналитика&quot;]\u003c/div>\u003ch2>Куда встаивает Kafka\u003c/h2>\n\u003cp>HTTP хорош, когда caller'у нужен ответ \u003cem>сейчас\u003c/em>. Но часть работы — фоновая: отправить письмо, посчитать аналитику, синхронизовать поиск. Держать запрос пользователя пока отправляется письмо — расточительно.\u003c/p>\n\u003cp>Паттерн: сервис сделал свою работу → опубликовал \u003cstrong>событие\u003c/strong> в Kafka → пошёл дальше. Кто хотел — прочитал и отработал:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(order.getId()));\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant O as order-service\n    participant K as Kafka (topic orders.created)\n    participant N as notification-service\n    O-&gt;&gt;O: сохранил заказ (транзакция)\n    O-&gt;&gt;K: опубликовал OrderCreatedEvent\n    O--&gt;&gt;Клиенту: 201 Created (не ждёт писем!)\n    K-&gt;&gt;N: событие доставлено консюмеру\n    N-&gt;&gt;N: отправил письмо\u003c/div>\u003cp>Ключевые слова: \u003cstrong>продюсер\u003c/strong> публикует, \u003cstrong>консюмер\u003c/strong> подписан, \u003cstrong>topic\u003c/strong> — именованный канал событий. События в Kafka сохраняются и могут быть перечитаны — этим она отличается от «просто почтового ящика». Вглубь — в отдельном модуле.\u003c/p>\n\u003ch2>Наблюдаемость: Actuator и Micrometer\u003c/h2>\n\u003cp>Сервис в проде — как самолёт: нужно, чтобы он сам сообщал о своём состоянии. В Spring Boot за это отвечают два инструмента.\u003c/p>\n\u003cp>\u003cstrong>Actuator\u003c/strong> — встроенные эксплуатационные endpoints:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Endpoint\u003c/th>\n\u003cth>Что показывает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/health\u003c/code>\u003c/td>\n\u003ctd>Жив ли сервис: \u003ccode>{&quot;status&quot;: &quot;UP&quot;}\u003c/code>; включает проверки базы, Kafka и др.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/metrics\u003c/code>\u003c/td>\n\u003ctd>Числовые метрики: память, время ответов, счётчики\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/info\u003c/code>\u003c/td>\n\u003ctd>Информация о сборке\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>/actuator/health\u003c/code> — рабочая лошадка деплоя: балансировщик и Kubernetes-пробы опрашивают его и решают, направлять ли трафик на инстанс или перезапустить его.\u003c/p>\n\u003cp>\u003cstrong>Micrometer\u003c/strong> — «фасад метрик»: единый API для счётчиков и таймеров, который экспортирует данные в системы мониторинга (Prometheus и другие). Один раз написали метрику — увидели её на дашборде команды:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Counter\u003c/span> \u003cspan class=\"hljs-variable\">created\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> meterRegistry.counter(\u003cspan class=\"hljs-string\">&quot;orders.created.total&quot;\u003c/span>);\ncreated.increment();     \u003cspan class=\"hljs-comment\">// +1 заказ — график на дашборде пополз вверх\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> \u003ccode>/actuator/health\u003c/code> — ваш первый инструмент при «а сервис вообще жив?»: UP/DOWN и причина, без доступа к серверу. А метрики — готовые данные для проверки нечерного-box поведения.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> события Kafka (\u003ccode>orders.created\u003c/code>) и метрики (\u003ccode>orders.created.total\u003c/code>) — это то, из чего строятся продуктовые дашборды в реальном времени. Требование «видеть конверсию заказов онлайн» — это требование к событию и метрике.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Сервис держит бизнес-правила; \u003ccode>@Transactional\u003c/code> даёт «всё или ничего»\u003c/li>\n\u003cli>Репозиторий — интерфейс: Spring Data генерирует SQL; entity = таблица, миграции — через Liquibase\u003c/li>\n\u003cli>Kafka: опубликовал событие → пошёл дальше; фоновые потребители дочитают\u003c/li>\n\u003cli>Actuator даёт \u003ccode>/actuator/health\u003c/code> и метрики; Micrometer — единый API для дашбордов\u003c/li>\n\u003c/ul>\n\u003cp>Пилот собран: вы прошли путь от HTTP-запроса до живого сервиса со слоями, базой, событиями и метриками. Дальше — экзамен и кейс, проверяющие весь модуль целиком.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","codeLang":"java","code":"public interface OrderRepository extends JpaRepository\u003cOrder, Long> {\n    List\u003cOrder> findByCustomerIdAndStatus(Long customerId, String status);\n}\n","question":"Что верно про этот репозиторий?","options":["Spring Data сам сгенерирует реализацию и SQL по имени метода — писать нечего","Это нерабочий код: у интерфейса нет реализации","Метод нужно вручную реализовать в классе OrderRepositoryImpl","Метод сработает только если написать SQL в аннотации"],"correct":0,"explanation":"JpaRepository даёт готовые save/findById/deleteById, а по имени findByCustomerIdAndStatus Spring Data выводит WHERE customer_id = ? AND status = ?. Реализация генерируется при старте приложения.","codeHtml":"\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">OrderRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Order, Long&gt; {\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-title function_\">findByCustomerIdAndStatus\u003c/span>\u003cspan class=\"hljs-params\">(Long customerId, String status)\u003c/span>;\n}\n"},{"type":"single","question":"Метод сервиса помечен @Transactional. Что это гарантирует?","options":["Либо все записи в базу внутри метода применятся, либо ни одна","Метод выполнится быстрее — в отдельном потоке","Ответ метода всегда со статусом 200","Метод нельзя вызвать дважды одновременно"],"correct":0,"explanation":"Транзакция = атомарность: ошибка на середине откатывает всё сделанное ранее в методе. Половина заказа не сохранится никогда. Про потоки и статусы аннотация ничего не обещает."},{"type":"match","question":"Сопоставь понятие и его смысл.","pairs":[{"left":"Entity","right":"Java-класс, отображённый на таблицу"},{"left":"Kafka topic","right":"Именованный канал событий"},{"left":"@Service","right":"Слой бизнес-правил"},{"left":"Liquibase","right":"Версионирование схемы базы миграциями"}]},{"type":"multi","question":"Какие утверждения про Kafka в этой архитектуре верны? (несколько ответов)","options":["Продюсер публикует событие в topic и не ждёт фоновой обработки","Консюмеры подписываются на topic и обрабатывают события сами","Kafka заменяет базу данных: заказы хранятся только в topic","Тяжёлую фоновую работу выносят в консюмеры, чтобы API отвечал быстро"],"correct":[0,1,3],"explanation":"Kafka — транспорт и буфер событий, а не хранилище записей заказа: источником правды остаётся база. Остальное — суть паттерна: событие опубликовано, фоновые потребители отработали в своём темпе."},{"type":"blank","question":"Какой endpoint Actuator'а возвращает статус живости сервиса (UP/DOWN)? Ответ начни с /actuator/","answers":["/actuator/health"],"explanation":"GET /actuator/health — стандартная точка проверки: её опрашивают балансировщики и Kubernetes-пробы, чтобы решать, жив ли инстанс."},{"type":"single","question":"Мониторинг показывает: /actuator/health отвечает {\"status\": \"DOWN\", \"components\": {\"db\": {\"status\": \"DOWN\"}}}. Что случилось?","options":["Сервис работает, но не может подключиться к базе данных — трафик на него направлять нельзя","Упало всё приложение: процесс мёртв, health отвечает последний раз","Ничего страшного: DOWN бывает при обновлении схемы базы","Ошибка в коде контроллера: вернуть 500 клиенту"],"correct":0,"explanation":"Health-проверка сама жива (она ответила!) и сообщает причину: база недоступна. Приложение поднимают заново, только если падает liveness-проба, а здесь задача — чинить подключение к БД."},{"type":"single","question":"Зачем в проекте Micrometer, если метрики можно писать в логи?","options":["Micrometer — единый API метрик (счётчики, таймеры) с экспортом в системы мониторинга и дашборды","Micrometer заменяет логирование: логи больше не нужны","Micrometer ускоряет работу базы данных","Это требование Spring Boot: без него приложение не стартует"],"correct":0,"explanation":"Метрики — это числа с именами и тегами, которые должны попасть в Prometheus/графики, а не в текст логов. Micrometer даёт один API и разные экспорты; логи при этом остаются для другого — контекста происшествий."}]],"cases":[]},{"id":"module-1-exam","title":"Экзамен модуля и кейс","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":6,"baseOrder":null,"lab":null,"html":"\u003ch1>Экзамен модуля «Spring Boot: бэкенд с нуля»\u003c/h1>\n\u003cp>Вы прошли пять уроков: HTTP, устройство сервиса, Java-шпаргалка, REST-контроллер, слои с Kafka и наблюдаемостью. Финальная проверка — в двух частях:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Кейс\u003c/strong> — спроектировать API своими словами (сначала пишете своё решение, потом сверяетесь с эталоном)\u003c/li>\n\u003cli>\u003cstrong>Экзамен\u003c/strong> — 18 вопросов по всему модулю, порог 80%, пересдача не ограничена\u003c/li>\n\u003c/ol>\n\u003cp>Сначала кейс, потом экзамен. Поехали.\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","topic":"lesson-01","codeLang":"http","code":"POST /api/projects/7/tasks HTTP/1.1\nHost: tasks.example.com\nContent-Type: text/plain\nAccept: application/json\n\n{\"title\":\"Сверить отчёт\"}\n\nHTTP/1.1 415 Unsupported Media Type\n","question":"Клиент отправил форму создания задачи. Какую проверку сделать первой по этому обмену?","options":["Повторить запрос с Content-Type: application/json и посмотреть, изменится ли статус","Поменять Accept на text/plain и проверить, сможет ли клиент прочитать ответ","Добавить в тело поле deadline и проверить, проходит ли валидация задачи","Проверить через GET, существует ли проект 7 и доступны ли его задачи"],"correct":0,"explanation":"Код 415 указывает на формат входных данных. Тело выглядит как JSON, но Content-Type объявляет обычный текст. При повторе меняем только этот заголовок. Если 415 исчез, нашли причину первого отказа. Accept описывает желаемый формат ответа.","codeHtml":"\u003cspan class=\"hljs-keyword\">POST\u003c/span> \u003cspan class=\"hljs-string\">/api/projects/7/tasks\u003c/span> \u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span>\n\u003cspan class=\"hljs-attribute\">Host\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>tasks.example.com\n\u003cspan class=\"hljs-attribute\">Content-Type\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>text/plain\n\u003cspan class=\"hljs-attribute\">Accept\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>application/json\n\n\u003cspan class=\"language-dart\">{\u003cspan class=\"hljs-string\">&quot;title&quot;\u003c/span>:\u003cspan class=\"hljs-string\">&quot;Сверить отчёт&quot;\u003c/span>}\n\nHTTP/\u003cspan class=\"hljs-number\">1.1\u003c/span> \u003cspan class=\"hljs-number\">415\u003c/span> \u003cspan class=\"hljs-title class_\">Unsupported\u003c/span> \u003cspan class=\"hljs-title class_\">Media\u003c/span> \u003cspan class=\"hljs-title class_\">Type\u003c/span>\n\u003c/span>"},{"type":"single","topic":"lesson-01","question":"Сервер вернул 403 Forbidden. Что это значит по сравнению с 401 Unauthorized?","options":["Сервер понял запрос и отказался выполнять действие из-за прав доступа","Токен не приложен или истёк — сервер не знает, кто вы","Такого ресурса не существует","Сервер перегружен, попробуйте позже"],"correct":0,"explanation":"При 401 нужны действительные данные аутентификации. При 403 сервер понял запрос и отказывает в доступе. API также может скрывать недоступный ресурс через 404."},{"type":"multi","topic":"lesson-01","question":"Какие утверждения о статус-кодах верны? (несколько ответов)","options":["204 — успешный ответ без тела","4xx — класс ошибок на стороне клиента","301 и 404 — это одно и то же: ресурс не найден","500 — ошибка на стороне сервера"],"correct":[0,1,3],"explanation":"301 — редирект (ресурс переехал, вот новый адрес), а не «не найдено». Остальное — прямая расшифровка классов."},{"type":"single","topic":"lesson-01","codeLang":"http","code":"HTTP/1.1 204 No Content\n","question":"Клиент отправил DELETE /api/tasks/7 и получил такой ответ. Как оценишь результат?","options":["Успех: задача удалена, тела ответа не требуется","Ошибка: сервер не понял, что удалять","Ошибка: задача не найдена","Частичный успех: удаление произойдёт позже"],"correct":0,"explanation":"204 — успех без тела. Удалённому ресурсу нечего возвращать. Ошибки здесь были бы 404 (нет такой) или 500 (сломалось).","codeHtml":"\u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span> \u003cspan class=\"hljs-number\">204\u003c/span> No Content\n"},{"type":"blank","topic":"lesson-01","question":"Какой заголовок ответа сообщает клиенту, что тело — это JSON? (формат: Имя-Заголовка, как он пишется в HTTP)","answers":["Content-Type"],"correct_note":"","explanation":"Content-Type: application/json. Он есть и в запросе, и в ответе — всегда описывает формат именно тела."},{"type":"single","topic":"lesson-02","question":"Требование гласит: «email в заказе обязателен, максимум один @». Где это правило должно сработать первым?","options":["В контроллере — на валидации входных данных, до бизнес-логики","В сервисном слое — это бизнес-правило","В репозитории — при сохранении в базу","В Kafka — при публикации события"],"correct":0,"explanation":"Формат и обязательность поля — валидация входа, зона контроллера: кривой запрос не должен попадать в сервис. Бизнес-правила («скидка не больше 50%») — сервис. Грубая проверка на уровне БД (not null) — страховка, не замена."},{"type":"match","topic":"lesson-02","question":"Сопоставь симптом и слой, где ищем причину.","pairs":[{"left":"400: «поле title обязательно»","right":"Контроллер / валидация"},{"left":"200 OK, но сумма заказа посчитана неверно","right":"Сервисный слой"},{"left":"500, в логе ошибка SQL","right":"Репозиторий / база"},{"left":"Приложение не стартует: порт уже занят","right":"Конфигурация"}]},{"type":"single","topic":"lesson-02","question":"Почему пароль от базы не хранят в application.yml в git?","options":["Секреты передают через переменные окружения или секрет-хранилище — файл в git видит вся команда и история навсегда","YAML не поддерживает пароли","Spring запрещает секреты в конфигах","Пароль нужен только тестам, прод работает без него"],"correct":0,"explanation":"Git-история неистребима: попал секрет в коммит — считай, утёк. Поэтому секреты — в переменных окружения (или Vault-подобных хранилищах), а в конфиге — только ссылки на них."},{"type":"single","topic":"lesson-03","codeLang":"java","code":"Optional\u003cOrder> order = orderRepository.findByNumber(\"A-42\");\nOrder result = order.orElseThrow(() -> new OrderNotFoundException(\"A-42\"));\n","question":"Заказа A-42 в базе нет. Что произойдёт при выполнении второй строки?","options":["Выбросится OrderNotFoundException — его обработает глобальный обработчик и вернёт клиенту 404","result станет null, программа продолжится","Вернётся пустой заказ со статусом NOT_FOUND","Компилятор запретит такой код"],"correct":0,"explanation":"orElseThrow на пустом Optional бросает исключение-поставщика. В Spring его перехватит @ExceptionHandler/статус-аннотация и клиент получит осмысленный 404. null тут не появится никогда.","codeHtml":"\u003cspan class=\"hljs-type\">Optional\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderRepository.findByNumber(\u003cspan class=\"hljs-string\">&quot;A-42&quot;\u003c/span>);\n\u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">result\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> order.orElseThrow(() -&gt; \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderNotFoundException\u003c/span>(\u003cspan class=\"hljs-string\">&quot;A-42&quot;\u003c/span>));\n"},{"type":"single","topic":"lesson-03","codeLang":"java","code":"@Getter @Builder\npublic class CreateOrderRequest {\n    private final String customer;\n    private final BigDecimal amount;\n}\n\n// использование:\nCreateOrderRequest req = CreateOrderRequest.builder()\n    .customer(\"ann\")\n    .amount(new BigDecimal(\"990\"))\n    .build();\n","question":"Что делает builder()…build() в этом коде?","options":["Собирает объект CreateOrderRequest, сгенерированный Lombok, задавая поля по цепочке","Создаёт SQL-запрос INSERT","Отправляет запрос в Kafka","Валидирует customer и amount по аннотациям @Valid"],"correct":0,"explanation":"@Builder (Lombok) генерирует фабрику-строитель: поля задаются по имени, imмутабельно и читабельно. Это альтернатива конструктора с десятью аргументами.","codeHtml":"\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Builder\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">CreateOrderRequest\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> String customer;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> BigDecimal amount;\n}\n\n\u003cspan class=\"hljs-comment\">// использование:\u003c/span>\n\u003cspan class=\"hljs-type\">CreateOrderRequest\u003c/span> \u003cspan class=\"hljs-variable\">req\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> CreateOrderRequest.builder()\n    .customer(\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>)\n    .amount(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;990&quot;\u003c/span>))\n    .build();\n"},{"type":"single","topic":"lesson-04","question":"Клиент отправил POST /api/tasks с телом, где вместо JSON — сломанный текст. Что ответит Spring Boot-контроллер с @RequestBody?","options":["400 Bad Request — тело не разобрать","201 Created с пустой задачей","500 — ошибка на стороне сервера","404 — такого эндпоинта нет"],"correct":0,"explanation":"Неразборчивое тело — вина клиента: 400. Эндпоинт существует (иначе 404), а серверная ошибка была бы, если бы сломался сам код обработки."},{"type":"multi","topic":"lesson-04","question":"Что входит в обязанности контроллера? (несколько ответов)","options":["Принять запрос и разобрать параметры/тело","Провалидировать входные данные","Вызвать сервисный слой и сформировать ответ/статус","Хранить бизнес-правила и считать скидки"],"correct":[0,1,2],"explanation":"Контроллер — «переводчик» HTTP ↔ Java: принять, проверить, делегировать, ответить. Правила и расчёты — зона сервиса: иначе слой перестаёт быть тонким."},{"type":"single","topic":"lesson-04","question":"Команда работает по API-First, и фронтендер спрашивает, каким будет ответ создания заказа. Что показать?","options":["Контракт OpenAPI — источник правды, код и клиенты генерируются из него","Java-класс OrderResponse — фронт разберётся","Скриншот рабочего ответа из Postman","Таблицу из базы данных orders"],"correct":0,"explanation":"В API-First источник правды — контракт. Скриншот и класс — следствия; таблица БД вообще не контракт API."},{"type":"single","topic":"lesson-05","codeLang":"java","code":"public interface TaskRepository extends JpaRepository\u003cTask, Long> {\n    List\u003cTask> findByProjectIdAndDone(Long projectId, boolean done);\n}\n","question":"Какой запрос сгенерирует Spring Data для этого метода?","options":["SELECT ... WHERE project_id = ? AND done = ?","SELECT ... WHERE id = ?","Метод не сработает: нужен @Query с SQL","UPDATE ... SET done = ?"],"correct":0,"explanation":"Имя метода разбирается по camelCase: findBy → SELECT, ProjectIdAndDone → условия WHERE. SQL вручную нужен только для сложных случаев.","codeHtml":"\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">TaskRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Task, Long&gt; {\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-title function_\">findByProjectIdAndDone\u003c/span>\u003cspan class=\"hljs-params\">(Long projectId, \u003cspan class=\"hljs-type\">boolean\u003c/span> done)\u003c/span>;\n}\n"},{"type":"single","topic":"lesson-05","question":"Внутри @Transactional-метода сервис сохранил заказ, потом упал на отправке чека. Что увидит база?","options":["Ничего: транзакция откатилась, заказа нет","Заказ сохранился, чек просто не ушёл","Заказ сохранился с флагом «без чека»","База заблокируется до перезапуска"],"correct":0,"explanation":"@Transactional — атомарность: исключение внутри откатывает все изменения метода. «Полусделанных» состояний не бывает — в этом смысл."},{"type":"single","topic":"lesson-05","question":"Почему после создания заказа API не ждёт отправки письма, а публикует событие в Kafka?","options":["Ответ клиенту не должен блокироваться фоновыми задачами — их доотработают подписчики","Kafka отправляет письма сама и быстрее SMTP","Без Kafka заказ не сохранится в базу","Так писали раньше, новая версия Spring требует"],"correct":0,"explanation":"Паттерн: сделал основное → опубликовал событие → ответил 201. Медленные задачи (письма, аналитика) — у консюмеров. Kafka не отправляет письма и не заменяет базу — она развязывает участников по времени."},{"type":"single","topic":"lesson-05","question":"Дашборд показывает: /actuator/health = UP, но компонент db = DOWN. Какое действие правильное?","options":["Трафик на инстанс не направлять и разбираться с подключением к базе","Пересобрать фронтенд — у него ошибка","Ничего: общий статус UP — значит всё хорошо","Удалить метрики компонента db из health"],"correct":0,"explanation":"Составной health падает по самому больному компоненту: база недоступна — сервис фактически неработоспособен. Прячут проблему не удалением метрики, а починкой подключения."},{"type":"blank","topic":"lesson-05","question":"Как называется Java-класс, помеченный @Entity и отображённый на таблицу базы данных? (одно слово)","answers":["entity","сущность"],"explanation":"Entity (сущность) — «таблица, живущая как объект»: @Id — первичный ключ, поля — колонки. Hibernate переводит entity в SQL и обратно."}]],"cases":[{"title":"Спроектируй API для списка задач","task":"Команда хочет внутренний таск-трекер. Известно: есть проекты; в проекте — задачи; у задачи — название, дедлайн и признак «сделано». Фронтендер просит: «скажи, что вызывать». Опиши API: какие endpoints (метод + путь), какие статусы ждать, как выглядят основные DTO. Форма свободная — как писали бы в чате команды. Подсказка: вспомните урок 1 (методы и статусы) и урок 4 (DTO и коды создания).","placeholder":"Например:\nGET /api/projects — список проектов\nPOST /api/tasks — создать задачу, 201 + ...","referenceHtml":"\u003cp>Один из возможных ответов (не единственно верный — важна логика).\u003c/p>\n\u003ch2>Endpoints\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Метод и путь\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003cth>Успех\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/projects\u003c/code>\u003c/td>\n\u003ctd>Список проектов\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code> + \u003ccode>[{id, title}]\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/projects\u003c/code>\u003c/td>\n\u003ctd>Создать проект\u003c/td>\n\u003ctd>\u003ccode>201\u003c/code> + \u003ccode>Location: /api/projects/{id}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/projects/{id}/tasks\u003c/code>\u003c/td>\n\u003ctd>Задачи проекта (можно фильтр \u003ccode>?status=done\u003c/code>)\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code> + список\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/projects/{id}/tasks\u003c/code>\u003c/td>\n\u003ctd>Создать задачу в проекте\u003c/td>\n\u003ctd>\u003ccode>201\u003c/code> + \u003ccode>Location\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PATCH /api/tasks/{id}\u003c/code>\u003c/td>\n\u003ctd>Частичное изменение: «сделано», дедлайн\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DELETE /api/tasks/{id}\u003c/code>\u003c/td>\n\u003ctd>Удалить задачу\u003c/td>\n\u003ctd>\u003ccode>204\u003c/code> (без тела)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Ключевые решения\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>PATCH, а не PUT\u003c/strong> для «сделано»: меняем одно поле, а не всю задачу целиком.\u003c/li>\n\u003cli>\u003cstrong>201 + Location\u003c/strong> при создании — сервер говорит, где лежит новое (урок 1).\u003c/li>\n\u003cli>\u003cstrong>204 без тела\u003c/strong> при удалении — удалять больше нечего, рассказывать нечего.\u003c/li>\n\u003cli>Ошибки: \u003ccode>400\u003c/code> — кривой JSON/валидация, \u003ccode>404\u003c/code> — проекта или задачи нет.\u003c/li>\n\u003c/ul>\n\u003ch2>DTO\u003c/h2>\n\u003cpre>\u003ccode>record TaskResponse(Long id, String title, LocalDate deadline, boolean done)\nrecord CreateTaskRequest(String title, LocalDate deadline)\n\u003c/code>\u003c/pre>\n\u003cp>Внутри — entity \u003ccode>Task\u003c/code> с \u003ccode>@Entity\u003c/code>; наружу — DTO без лишних полей (урок 4). Между ними — MapStruct.\u003c/p>\n\u003ch2>Продвинутый уровень (не обязателен)\u003c/h2>\n\u003cp>Пометка «сделано» — событие \u003ccode>tasks.completed\u003c/code> в Kafka: уведомления и статистика дочитают сами, а API не ждёт рассылки писем (урок 5). Метрику \u003ccode>tasks.completed.total\u003c/code> через Micrometer — и на дашборд.\u003c/p>\n"}]},{"id":"m1-cheatsheet","title":"Шпаргалка модуля","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":7,"baseOrder":null,"lab":null,"html":"\u003ch1>Шпаргалка: Spring Boot с нуля\u003c/h1>\n\u003ch2>HTTP за 30 секунд\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Метод\u003c/th>\n\u003cth>Семантика\u003c/th>\n\u003cth>Тело\u003c/th>\n\u003cth>Успех\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>GET\u003c/td>\n\u003ctd>Прочитать\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>POST\u003c/td>\n\u003ctd>Создать\u003c/td>\n\u003ctd>JSON\u003c/td>\n\u003ctd>\u003cstrong>201 + Location\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PUT\u003c/td>\n\u003ctd>Заменить целиком\u003c/td>\n\u003ctd>JSON\u003c/td>\n\u003ctd>200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PATCH\u003c/td>\n\u003ctd>Изменить часть\u003c/td>\n\u003ctd>JSON\u003c/td>\n\u003ctd>200\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DELETE\u003c/td>\n\u003ctd>Удалить\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>\u003cstrong>204\u003c/strong> (без тела)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Код\u003c/th>\n\u003cth>Значение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>200 / 201 / 204\u003c/td>\n\u003ctd>OK / создано / без содержимого\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>301\u003c/td>\n\u003ctd>Редирект\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>400 / 401 / 403 / 404\u003c/td>\n\u003ctd>Некорректный запрос / нужны действительные учётные данные / запрос запрещён / ресурс отсутствует или скрыт\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5xx\u003c/td>\n\u003ctd>Вина сервера (в логи!)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>Content-Type: application/json\u003c/code> — и в запросе, и в ответе. Query-параметры после \u003ccode>?\u003c/code> — фильтры и пагинация.\u003c/p>\n\u003ch2>Слои приложения\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Слой\u003c/th>\n\u003cth>Делает\u003c/th>\n\u003cth>Не делает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Контроллер\u003c/td>\n\u003ctd>HTTP ↔ Java, валидация, статусы\u003c/td>\n\u003ctd>Бизнес-правила, SQL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Сервис\u003c/td>\n\u003ctd>Бизнес-логика, \u003ccode>@Transactional\u003c/code>\u003c/td>\n\u003ctd>Не знает про HTTP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Репозиторий\u003c/td>\n\u003ctd>Чтение/запись данных\u003c/td>\n\u003ctd>Не решает бизнес\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>БД\u003c/td>\n\u003ctd>Хранит\u003c/td>\n\u003ctd>Не считает скидки\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Аннотации контроллера\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@RestController\u003c/span> \u003cspan class=\"hljs-meta\">@RequestMapping(&quot;/api/products&quot;)\u003c/span>\n\u003cspan class=\"hljs-meta\">@GetMapping\u003c/span> \u003cspan class=\"hljs-meta\">@PostMapping\u003c/span> \u003cspan class=\"hljs-meta\">@PatchMapping\u003c/span> \u003cspan class=\"hljs-meta\">@DeleteMapping\u003c/span>\n\u003cspan class=\"hljs-meta\">@PathVariable\u003c/span> Long id            \u003cspan class=\"hljs-comment\">// из пути /{id}\u003c/span>\n\u003cspan class=\"hljs-meta\">@RequestBody\u003c/span> CreateProductRequest \u003cspan class=\"hljs-comment\">// JSON-тело → объект\u003c/span>\n\u003cspan class=\"hljs-meta\">@Valid\u003c/span> \u003cspan class=\"hljs-meta\">@NotBlank\u003c/span> \u003cspan class=\"hljs-meta\">@NotNull\u003c/span>         \u003cspan class=\"hljs-comment\">// валидация → 400\u003c/span>\n\u003cspan class=\"hljs-meta\">@ResponseStatus(HttpStatus.CREATED)\u003c/span>\n\u003c/code>\u003c/pre>\n\u003ch2>Java одним взглядом\u003c/h2>\n\u003cul>\n\u003cli>Деньги — \u003ccode>BigDecimal\u003c/code>, не \u003ccode>double\u003c/code>\u003c/li>\n\u003cli>\u003ccode>Optional&lt;T&gt;\u003c/code> = «может не быть»: \u003ccode>map()\u003c/code>, \u003ccode>orElse()\u003c/code>, \u003ccode>orElseThrow()\u003c/code>\u003c/li>\n\u003cli>\u003ccode>@Аннотации\u003c/code> — метки для фреймворков; Lombok (\u003ccode>@Getter\u003c/code>, \u003ccode>@Builder\u003c/code>) генерирует код\u003c/li>\n\u003cli>\u003ccode>interface\u003c/code> = контракт, \u003ccode>Impl\u003c/code> = реализация; связывает Spring (DI)\u003c/li>\n\u003cli>Чтение чужого файла: аннотации → поля → публичные методы\u003c/li>\n\u003c/ul>\n\u003ch2>Наблюдаемость (касанием)\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>/actuator/health\u003c/code> — жив ли (UP/DOWN), его опрашивают пробы\u003c/li>\n\u003cli>\u003ccode>/actuator/metrics\u003c/code> — числа; Micrometer — фасад метрик\u003c/li>\n\u003c/ul>\n\u003ch2>Конфиг\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">server.port:\u003c/span> \u003cspan class=\"hljs-number\">8080\u003c/span>            \u003cspan class=\"hljs-comment\"># дефолтный порт\u003c/span>\n\u003cspan class=\"hljs-attr\">spring.datasource.url:\u003c/span> \u003cspan class=\"hljs-string\">...\u003c/span>   \u003cspan class=\"hljs-comment\"># база\u003c/span>\n\u003cspan class=\"hljs-attr\">profiles:\u003c/span> \u003cspan class=\"hljs-string\">dev\u003c/span> \u003cspan class=\"hljs-string\">/\u003c/span> \u003cspan class=\"hljs-string\">prod\u003c/span>         \u003cspan class=\"hljs-comment\"># один код, разные окружения\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Секреты — в переменных окружения, не в git.\u003c/p>\n","quizzes":[],"cases":[]},{"id":"m2-lesson-01","title":"API как договор","module":2,"moduleTitle":"Проектирование API","order":1,"baseOrder":3,"lab":null,"html":"\u003ch1>Урок 1. API как договор\u003c/h1>\n\u003cp>В модуле 1 мы читали запросы и ответы. Один и тот же API могут использовать фронтенд, мобильное приложение и другие сервисы. Им нужно заранее знать, как отправлять запросы и чего ждать в ответ. В этом модуле описываем этот договор до реализации.\u003c/p>\n\u003ch2>API — это интерфейс, а не «код, который случайно наружу»\u003c/h2>\n\u003cp>\u003cstrong>API\u003c/strong> (Application Programming Interface) — граница, через которую одна программа говорит с другой. Для бэкенда это набор эндпоинтов: пути, методы, запросы, ответы, ошибки, форматы.\u003c/p>\n\u003cp>Ключевая мысль: \u003cstrong>API — это договор между вами и потребителями\u003c/strong>. Как только договор подписан (кто-то начал его использовать), одностороннее изменение условий — нарушение. Бэкендер может рефакторить внутренности сколько угодно; контракт — только по правилам.\u003c/p>\n\u003cp>Кто потребители вашего API на самом деле:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Фронтенд\u003c/strong> — веб-приложение\u003c/li>\n\u003cli>\u003cstrong>Мобильные приложения\u003c/strong> — их нельзя «обновить всех сразу»: у пользователей старые версии живут месяцами\u003c/li>\n\u003cli>\u003cstrong>Другие сервисы\u003c/strong> — внутренние и внешние интеграции\u003c/li>\n\u003cli>\u003cstrong>QA-автотесты\u003c/strong> — тоже потребитель: тесты завязаны на контракт\u003c/li>\n\u003cli>\u003cstrong>Аналитики\u003c/strong> — если API отдаёт данные для дашбордов\u003c/li>\n\u003c/ul>\n\u003ch2>Цена сломанного контракта\u003c/h2>\n\u003cp>Классика жанра:\u003c/p>\n\u003col>\n\u003cli>Бэкенд переименовал поле \u003ccode>name\u003c/code> в \u003ccode>fullName\u003c/code> — «так правильнее»\u003c/li>\n\u003cli>Фронт собирался на старом контракте и уже уехал в прод\u003c/li>\n\u003cli>Везде, где было имя пользователя, — пустота\u003c/li>\n\u003cli>Почти у всех сторон «работало у меня локально»\u003c/li>\n\u003c/ol>\n\u003cp>Ошибка не в переименовании, а в том, что оно произошло \u003cstrong>молча\u003c/strong>. Договор меняют открыто: предупредить, версионировать, дать время на переезд.\u003c/p>\n\u003ch2>Два подхода: code-first и API-First\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Code-first\u003c/th>\n\u003cth>API-First\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Что сначала\u003c/td>\n\u003ctd>Код контроллера\u003c/td>\n\u003ctd>Контракт (OpenAPI-спека)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Документация\u003c/td>\n\u003ctd>Побочный продукт (генерится из кода, если повезёт)\u003c/td>\n\u003ctd>Первична и всегда актуальна\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ревью\u003c/td>\n\u003ctd>Ревью кода — контракт уже «случился»\u003c/td>\n\u003ctd>Ревью контракта — до написания кода\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Потребители узнают о API\u003c/td>\n\u003ctd>Когда задеплоено\u003c/td>\n\u003ctd>По спеке — ещё до реализации\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Скорость старта\u003c/td>\n\u003ctd>Быстро на старте\u003c/td>\n\u003ctd>Чуть медленнее на старте\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Цена изменения потом\u003c/td>\n\u003ctd>Дорого (кто-то уже завязался)\u003c/td>\n\u003ctd>Дёшево на этапе договора\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Code-first не «неправильный» — для маленького внутреннего сервиса или прототипа он разумен. API-First выигрывает, когда потребителей больше одного (или они появятся), когда фронт и бэк работают параллельно, когда API живёт годами.\u003c/p>\n\u003ch2>OpenAPI: договор, который исполняется\u003c/h2>\n\u003cp>\u003cstrong>OpenAPI\u003c/strong> — стандарт описания REST API: YAML- или JSON-файл, в котором формально записаны все пути, параметры, схемы запросов/ответов и ошибки. Та же идея, что TypeScript-типы, только для HTTP-границы между командами.\u003c/p>\n\u003cp>Из этого файла вырастает вся инфраструктура договора:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Swagger UI\u003c/strong> — интерактивная документация: читаем и пробуем запросы прямо из браузера\u003c/li>\n\u003cli>\u003cstrong>Генерация кода\u003c/strong> — типизированные клиенты для фронта (TS) и заготовки интерфейсов для бэкенда (Java)\u003c/li>\n\u003cli>\u003cstrong>Мок-сервер\u003c/strong> — фронтенд работает с «фейковым» API по спеке, пока бэкенд реализует\u003c/li>\n\u003cli>\u003cstrong>Контрактные тесты\u003c/strong> — проверка, что живой API не разошёлся с договором\u003c/li>\n\u003c/ul>\n\u003cp>Формат спеки — тема урока 2. Пока важно: договор существует в машиночитаемом виде, а не «в голове у бэкендера и в устаревшей Confluence-странице».\u003c/p>\n\u003ch2>Как выглядит цикл API-First\u003c/h2>\n\u003cdiv class=\"mermaid\">flowchart LR\n    A[&quot;Черновик спеки&quot;] --&gt; B[&quot;Ревью с потребителями&lt;br/&gt;(фронт, QA, аналитик)&quot;]\n    B --&gt; C[&quot;Спека согласована —&lt;br/&gt;фиксирована версия&quot;]\n    C --&gt; D[&quot;Фронт: мок-сервер +&lt;br/&gt;генерация клиента&quot;]\n    C --&gt; E[&quot;Бэк: реализация&lt;br/&gt;по контракту&quot;]\n    D --&gt; F[&quot;Контрактные тесты:&lt;br/&gt;код соответствует спеке&quot;]\n    E --&gt; F\u003c/div>\u003cp>Заметьте: фронтенд не ждёт бэкенд. Обе стороны работают параллельно против одного договора — это главный выигрыш API-First по срокам.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> вы уже живёте в контрактном мире: TS-интерфейсы между модулями, типы из бэкенда. OpenAPI — тот же интерфейс, только на границе HTTP, и из него генерится ваш API-клиент с типами. Больше не нужен слой ручных обёрток над fetch.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> спека — готовая основа тест-анализа: каждый путь и код ответа из неё — кейс в матрице. Примеры из спеки (examples) — готовые тест-данные. А контрактные тесты в CI — это ваш «регресс контракта» бесплатно.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> вы — соавтор договора. Поля, их семантика, коды ошибок, сценарии — всё это фиксируется в спеке до кода. Ваше «а добавьте поле» в мире API-First — это правка контракта с ревью, а не просьба «по-тихому поправить в коде».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>API — договор; после появления потребителей менять его можно только открыто и по правилам\u003c/li>\n\u003cli>Потребителей больше, чем кажется: фронт, мобилки, сервисы, автотесты, аналитика\u003c/li>\n\u003cli>Code-first — норм для прототипов; API-First — для API, которые живут и у которых есть потребители\u003c/li>\n\u003cli>OpenAPI — машиночитаемый договор: документация, генерация клиентов, моки, контрактные тесты\u003c/li>\n\u003cli>В API-First фронт и бэк работают параллельно против спеки\u003c/li>\n\u003c/ul>\n\u003cp>В следующем уроке откроем реальную OpenAPI-спеку и научимся её читать и писать.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Бэкенд переименовал поле name в fullName и задеплоил в пятницу вечером. Фронтенд узнал об этом в понедельник из падения продакшена. Что было нарушено?","options":["Договор: изменение контракта прошло без предупреждения и без переходного периода","Ничего: внутренние поля бэкенда — его дело","Соглашение об именовании Java-полей","Процесс деплоя: нельзя деплоить по пятницам"],"correct":0,"explanation":"Поле name было частью контракта — фронт на него завязался. Договор меняют открыто: предупредить потребителей, поддержать оба поля переходный период, объявить deprecation старого."},{"type":"multi","question":"Кто является потребителями API интернет-магазина? (несколько ответов)","options":["Веб-фронтенд","Мобильное приложение, которое пользователи обновляют с задержкой","QA-автотесты, завязанные на запросы и ответы","Разработчик, который написал контроллер"],"correct":[0,1,2],"explanation":"Потребитель — тот, кто завязан на контракт снаружи. Автор контроллера — не потребитель: он может рефакторить внутренности, контракт меняется по другим правилам."},{"type":"single","question":"В чём главное преимущество API-First по срокам разработки фичи?","options":["Фронтенд и бэкенд работают параллельно: фронт — против мок-сервера по спеке, бэк — реализует контракт","Код пишется быстрее, потому что OpenAPI ускоряет Java","QA начинает тестирование до постановки задачи","Не нужно писать код контроллера вообще"],"correct":0,"explanation":"Спека + мок-сервер развязывают команды по времени. Код писать всё равно нужно — генерация даёт заготовки и клиентов, а не реализацию."},{"type":"match","question":"Сопоставь артефакт OpenAPI и то, что из него получается.","pairs":[{"left":"Swagger UI","right":"Интерактивная документация с возможностью попробовать запросы"},{"left":"Генерация клиента","right":"Типизированный код для вызова API (например, на TypeScript)"},{"left":"Мок-сервер","right":"Фейковый API, отвечающий по спеке без реализации"},{"left":"Контрактные тесты","right":"Проверка, что живой API соответствует договору"}]},{"type":"blank","question":"Как называется стандарт машиночитаемого описания REST API в YAML/JSON? (одно слово, имя собственное)","answers":["OpenAPI"],"explanation":"OpenAPI Specification. Swagger — имя инструментария вокруг стандарта (UI, Codegen); сам формат называется OpenAPI."},{"type":"single","question":"Какой проект разумно вести в code-first, а не в API-First?","options":["Прототип внутреннего сервиса, у которого пока один потребитель — команда-автор","Публичное API для внешних партнёров","API, по которому фронт и мобильная команда работают параллельно с бэкендом","API, которое живёт третий год и у него пять интеграций"],"correct":0,"explanation":"Чем больше потребителей и дольше жизнь API, тем дороже «случайный» контракт. Прототип для себя — законная зона code-first: договор ещё не подписан."},{"type":"single","codeLang":"yaml","code":"# фрагмент OpenAPI-спеки\npaths:\n  /api/tasks/{id}:\n    get:\n      responses:\n        \"200\":\n          description: Задача найдена\n","question":"Что можно сказать об этом API, глядя на фрагмент спеки?","options":["Описан GET-запрос /api/tasks/{id}, где id — параметр пути","Описано создание задачи POST-запросом","Это GraphQL-схема","Спека описывает базу данных: таблицу tasks"],"correct":0,"explanation":"Раздел paths описывает эндпоинты: путь с параметром {id}, метод get, ожидаемый ответ 200. Спека — про контракт HTTP, а не про базу: как хранится — её не волнует.","codeHtml":"\u003cspan class=\"hljs-comment\"># фрагмент OpenAPI-спеки\u003c/span>\n\u003cspan class=\"hljs-attr\">paths:\u003c/span>\n  \u003cspan class=\"hljs-string\">/api/tasks/{id}:\u003c/span>\n    \u003cspan class=\"hljs-attr\">get:\u003c/span>\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;200&quot;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Задача\u003c/span> \u003cspan class=\"hljs-string\">найдена\u003c/span>\n"}]],"cases":[]},{"id":"m2-lesson-02","title":"OpenAPI: читаем и пишем","module":2,"moduleTitle":"Проектирование API","order":2,"baseOrder":4,"lab":{"title":"Лаба 3. OpenAPI-контракт","description":"Дописать openapi.yaml бронирования переговорок по требованиям. Проверка — автотесты контракта: mvn test зелёный = договор описан верно.","branch":"lab-3","branchSolution":"lab-3-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 2. OpenAPI: читаем и пишем\u003c/h1>\n\u003cp>Спека OpenAPI — это обычный YAML-файл со стандартной структурой. Научиться её читать — навык на один вечер; уметь писать — вопрос практики. Разберём живой пример: API списка задач из кейса модуля 1.\u003c/p>\n\u003ch2>Анатомия спеки\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">openapi:\u003c/span> \u003cspan class=\"hljs-number\">3.1\u003c/span>\u003cspan class=\"hljs-number\">.0\u003c/span>                      \u003cspan class=\"hljs-comment\"># версия стандарта\u003c/span>\n\u003cspan class=\"hljs-attr\">info:\u003c/span>                               \u003cspan class=\"hljs-comment\"># метаданные договора\u003c/span>\n  \u003cspan class=\"hljs-attr\">title:\u003c/span> \u003cspan class=\"hljs-string\">Task\u003c/span> \u003cspan class=\"hljs-string\">API\u003c/span>\n  \u003cspan class=\"hljs-attr\">version:\u003c/span> \u003cspan class=\"hljs-number\">1.0\u003c/span>\u003cspan class=\"hljs-number\">.0\u003c/span>\n  \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">API\u003c/span> \u003cspan class=\"hljs-string\">списка\u003c/span> \u003cspan class=\"hljs-string\">задач\u003c/span> \u003cspan class=\"hljs-string\">(модуль\u003c/span> \u003cspan class=\"hljs-string\">BE-101)\u003c/span>\n\u003cspan class=\"hljs-attr\">servers:\u003c/span>\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">url:\u003c/span> \u003cspan class=\"hljs-string\">https://tasks.example.com\u003c/span>  \u003cspan class=\"hljs-comment\"># где живёт\u003c/span>\n\u003cspan class=\"hljs-attr\">paths:\u003c/span>                              \u003cspan class=\"hljs-comment\"># ЭНДПОИНТЫ — сердце спеки\u003c/span>\n  \u003cspan class=\"hljs-string\">/api/projects/{projectId}/tasks:\u003c/span>\n    \u003cspan class=\"hljs-attr\">get:\u003c/span>\n      \u003cspan class=\"hljs-attr\">summary:\u003c/span> \u003cspan class=\"hljs-string\">Задачи\u003c/span> \u003cspan class=\"hljs-string\">проекта\u003c/span>\n      \u003cspan class=\"hljs-attr\">parameters:\u003c/span>\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">projectId\u003c/span>\n          \u003cspan class=\"hljs-attr\">in:\u003c/span> \u003cspan class=\"hljs-string\">path\u003c/span>\n          \u003cspan class=\"hljs-attr\">required:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n          \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n            \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">integer\u003c/span>\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;200&quot;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Список\u003c/span> \u003cspan class=\"hljs-string\">задач\u003c/span>\n          \u003cspan class=\"hljs-attr\">content:\u003c/span>\n            \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n              \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n                \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">array\u003c/span>\n                \u003cspan class=\"hljs-attr\">items:\u003c/span>\n                  \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/TaskResponse&quot;\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Читается сверху вниз: \u003cstrong>info\u003c/strong> — что это за API и какая версия, \u003cstrong>servers\u003c/strong> — адрес, \u003cstrong>paths\u003c/strong> — эндпоинты. Внутри пути — операции по HTTP-методам (\u003ccode>get\u003c/code>, \u003ccode>post\u003c/code>, \u003ccode>patch\u003c/code>, \u003ccode>delete\u003c/code>), у каждой — параметры и ответы.\u003c/p>\n\u003ch2>Схемы: словарь договора\u003c/h2>\n\u003cp>Повторяющиеся структуры выносятся в \u003cstrong>components/schemas\u003c/strong> — это DTO контракта:\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">components:\u003c/span>\n  \u003cspan class=\"hljs-attr\">schemas:\u003c/span>\n    \u003cspan class=\"hljs-attr\">TaskResponse:\u003c/span>\n      \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">object\u003c/span>\n      \u003cspan class=\"hljs-attr\">required:\u003c/span> [\u003cspan class=\"hljs-string\">id\u003c/span>, \u003cspan class=\"hljs-string\">title\u003c/span>, \u003cspan class=\"hljs-string\">done\u003c/span>]\n      \u003cspan class=\"hljs-attr\">properties:\u003c/span>\n        \u003cspan class=\"hljs-attr\">id:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">integer\u003c/span>\n          \u003cspan class=\"hljs-attr\">format:\u003c/span> \u003cspan class=\"hljs-string\">int64\u003c/span>\n        \u003cspan class=\"hljs-attr\">title:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n          \u003cspan class=\"hljs-attr\">example:\u003c/span> \u003cspan class=\"hljs-string\">Купить\u003c/span> \u003cspan class=\"hljs-string\">молоко\u003c/span>\n        \u003cspan class=\"hljs-attr\">deadline:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n          \u003cspan class=\"hljs-attr\">format:\u003c/span> \u003cspan class=\"hljs-string\">date\u003c/span>\n          \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n        \u003cspan class=\"hljs-attr\">done:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">boolean\u003c/span>\n    \u003cspan class=\"hljs-attr\">CreateTaskRequest:\u003c/span>\n      \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">object\u003c/span>\n      \u003cspan class=\"hljs-attr\">required:\u003c/span> [\u003cspan class=\"hljs-string\">title\u003c/span>]\n      \u003cspan class=\"hljs-attr\">properties:\u003c/span>\n        \u003cspan class=\"hljs-attr\">title:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n          \u003cspan class=\"hljs-attr\">minLength:\u003c/span> \u003cspan class=\"hljs-number\">1\u003c/span>\n        \u003cspan class=\"hljs-attr\">deadline:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n          \u003cspan class=\"hljs-attr\">format:\u003c/span> \u003cspan class=\"hljs-string\">date\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>На схемы ссылаются по \u003ccode>$ref\u003c/code> — один раз описали \u003ccode>TaskResponse\u003c/code>, переиспользуем в списке, в ответе создания, где угодно. Схемы — это те же \u003ccode>record TaskResponse(...)\u003c/code> из урока 4 модуля 1, только на языке контракта.\u003c/p>\n\u003cp>Обратите внимание, как валидация из кода переезжает в договор: \u003ccode>required\u003c/code>, \u003ccode>minLength\u003c/code>, \u003ccode>format: date\u003c/code> — потребитель видит правила \u003cstrong>до\u003c/strong> отправки первого запроса.\u003c/p>\n\u003ch2>Примеры: документация, которая ездит\u003c/h2>\n\u003cp>В каждую схему и ответ можно вписать \u003ccode>example\u003c/code> — и они попадают в Swagger UI и в тест-данные QA:\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">  \u003cspan class=\"hljs-attr\">&quot;404&quot;:\u003c/span>\n    \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Задача\u003c/span> \u003cspan class=\"hljs-string\">не\u003c/span> \u003cspan class=\"hljs-string\">найдена\u003c/span>\n    \u003cspan class=\"hljs-attr\">content:\u003c/span>\n      \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n        \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n          \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/Error&quot;\u003c/span>\n        \u003cspan class=\"hljs-attr\">example:\u003c/span>\n          \u003cspan class=\"hljs-attr\">code:\u003c/span> \u003cspan class=\"hljs-string\">TASK_NOT_FOUND\u003c/span>\n          \u003cspan class=\"hljs-attr\">message:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Задача 42 не найдена&quot;\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Хороший тон: примеры есть у каждого ответа, включая ошибки. Разработчик фронта пишет обработку ошибок по примерам, QA берёт их в тесты — не нужно никого спрашивать в чате.\u003c/p>\n\u003ch2>POST-запрос в спеке\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">  \u003cspan class=\"hljs-string\">/api/projects/{projectId}/tasks:\u003c/span>\n    \u003cspan class=\"hljs-attr\">post:\u003c/span>\n      \u003cspan class=\"hljs-attr\">summary:\u003c/span> \u003cspan class=\"hljs-string\">Создать\u003c/span> \u003cspan class=\"hljs-string\">задачу\u003c/span>\n      \u003cspan class=\"hljs-attr\">requestBody:\u003c/span>\n        \u003cspan class=\"hljs-attr\">required:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n        \u003cspan class=\"hljs-attr\">content:\u003c/span>\n          \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n            \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n              \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/CreateTaskRequest&quot;\u003c/span>\n            \u003cspan class=\"hljs-attr\">example:\u003c/span>\n              \u003cspan class=\"hljs-attr\">title:\u003c/span> \u003cspan class=\"hljs-string\">Купить\u003c/span> \u003cspan class=\"hljs-string\">молоко\u003c/span>\n              \u003cspan class=\"hljs-attr\">deadline:\u003c/span> \u003cspan class=\"hljs-number\">2026-12-01\u003c/span>\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;201&quot;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Задача\u003c/span> \u003cspan class=\"hljs-string\">создана\u003c/span>\n          \u003cspan class=\"hljs-attr\">headers:\u003c/span>\n            \u003cspan class=\"hljs-attr\">Location:\u003c/span>\n              \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n                \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n              \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">&quot;/api/tasks/{id} созданной задачи&quot;\u003c/span>\n          \u003cspan class=\"hljs-attr\">content:\u003c/span>\n            \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n              \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n                \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/TaskResponse&quot;\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;400&quot;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Ошибки валидации (например, пустой title)&quot;\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Сравните с уроком 4 модуля 1: \u003ccode>201\u003c/code> + \u003ccode>Location\u003c/code> + DTO + \u003ccode>400\u003c/code> — всё, что мы делали в коде, здесь описано как договор. В API-First эта спека пишется \u003cstrong>раньше\u003c/strong> кода.\u003c/p>\n\u003ch2>Что из спеки генерируется\u003c/h2>\n\u003cp>Инструменты (openapi-generator, встроенная поддержка в фреймворках):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Клиенты\u003c/strong>: TypeScript, Java, Python… — типизированные обёртки над HTTP\u003c/li>\n\u003cli>\u003cstrong>Заготовки сервера\u003c/strong>: Java-интерфейсы и DTO, которые бэкенд имплементирует\u003c/li>\n\u003cli>\u003cstrong>Swagger UI\u003c/strong>: страница «попробовать» — запросы прямо из документации\u003c/li>\n\u003cli>\u003cstrong>Мок-сервер\u003c/strong>: отвечает примерами из спеки — фронт работает до готовности бэка\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> сгенерированный TS-клиент — это типы запросов/ответов из спеки. Поменялся контракт — перегенерили клиент — и компилятор сам показал все места, которые надо поправить. Ручные интерфейсы и обёртки больше не нужны.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> Swagger UI — готовый «Postman по спеке»: смотрите структуру, отправляете запросы, сверяете ответы. А examples из спеки — согласованное с бэкендом множество тест-данных.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Спека = \u003ccode>info\u003c/code> + \u003ccode>servers\u003c/code> + \u003ccode>paths\u003c/code> + \u003ccode>components/schemas\u003c/code>\u003c/li>\n\u003cli>Схемы — переиспользуемые DTO контракта; \u003ccode>$ref\u003c/code> — ссылка на них\u003c/li>\n\u003cli>\u003ccode>required\u003c/code>/\u003ccode>minLength\u003c/code>/\u003ccode>format\u003c/code> — валидация, видимая потребителю заранее\u003c/li>\n\u003cli>Примеры (\u003ccode>example\u003c/code>) едут в документацию и тесты — заполняйте их всегда\u003c/li>\n\u003cli>Из спеки генерятся клиенты, заготовки сервера, Swagger UI и моки\u003c/li>\n\u003c/ul>\n\u003cp>Дальше — правила хорошего тона REST: как называть ресурсы, отдавать ошибки и версионировать API.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"В спеке у поля id указано format: int64, а у deadline — format: date и nullable: true. Что это сообщает потребителю?","options":["id — целое 64-битное число; deadline — дата, которая может отсутствовать","id и deadline обязательны всегда","deadline хранится в базе как DATE","id генерируется автоматически бэкендом"],"correct":0,"explanation":"Спека описывает контракт, а не хранение: format — тип формата данных по стандарту, nullable — «значения может не быть». Обязательность задаётся отдельно (required), автогенерация id из спеки не следует."},{"type":"single","codeLang":"yaml","code":"paths:\n  /api/tasks/{id}:\n    patch:\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: \"#/components/schemas/PatchTaskRequest\"\n      responses:\n        \"200\": { description: Обновлено }\n        \"404\": { description: Не найдено }\n","question":"Что не так с этим фрагментом спеки с точки зрения полноты договора?","options":["Не указано, что requestBody обязательно (required: true) — договор допускает PATCH без тела","YAML с отступами всё сломает","PATCH нельзя описывать в OpenAPI","Ссылка $ref ведёт на файл в интернете"],"correct":0,"explanation":"Без required: true тело формально опционально — и потребитель вправе отправить PATCH без него. Хороший договор двусмысленностей не допускает.","codeHtml":"\u003cspan class=\"hljs-attr\">paths:\u003c/span>\n  \u003cspan class=\"hljs-string\">/api/tasks/{id}:\u003c/span>\n    \u003cspan class=\"hljs-attr\">patch:\u003c/span>\n      \u003cspan class=\"hljs-attr\">requestBody:\u003c/span>\n        \u003cspan class=\"hljs-attr\">content:\u003c/span>\n          \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n            \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n              \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/PatchTaskRequest&quot;\u003c/span>\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;200&quot;:\u003c/span> { \u003cspan cla
