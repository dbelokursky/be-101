c/strong>: \u003ccode>findByCustomerIdAndStatus\u003c/code> превратится в \u003ccode>WHERE customer_id = ? AND status = ?\u003c/code>. SQL вы увидите в логах, но писать руками — почти никогда.\u003c/p>\n\u003cp>А \u003ccode>Order\u003c/code> — это \u003cstrong>entity\u003c/strong>: Java-класс, отображённый на таблицу:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Entity\u003c/span>\n\u003cspan class=\"hljs-meta\">@Table(name = &quot;orders&quot;)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Builder\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Order\u003c/span> {\n    \u003cspan class=\"hljs-meta\">@Id\u003c/span> \u003cspan class=\"hljs-meta\">@GeneratedValue(strategy = GenerationType.IDENTITY)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long id;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long customerId;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String status;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> BigDecimal amount;\n}\n\u003c/code>\u003c/pre>\n\u003cp>Это и есть \u003cstrong>Hibernate/JPA\u003c/strong>: аннотациями мы говорим «класс = таблица, поле = колонка», а фреймворк переводит объекты в SQL-запросы и обратно. В лабах база — H2, in-memory: поднялась с приложением, умерла с ним. Боевая СУБД (PostgreSQL) — тот же код, другой \u003ccode>datasource.url\u003c/code> в конфиге.\u003c/p>\n\u003cp>Схема таблиц меняется не «руками в базе», а \u003cstrong>миграциями\u003c/strong> (Liquibase): файл в репо = шаг изменения схемы, применяется автоматически при старте.\u003c/p>\n\u003cp>Вся картина вместе:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart TD\n    C[&quot;Клиент&quot;] --&gt;|&quot;HTTP + JSON&quot;| K[&quot;Контроллер&lt;br/&gt;(DTO, валидация)&quot;]\n    K --&gt; S[&quot;Сервис&lt;br/&gt;(бизнес-логика, @Transactional)&quot;]\n    S --&gt; M[&quot;MapStruct&lt;br/&gt;entity ↔ DTO&quot;]\n    S --&gt; R[&quot;Репозиторий&lt;br/&gt;(JpaRepository)&quot;]\n    R --&gt; DB[(&quot;База данных&lt;br/&gt;(H2 / PostgreSQL)&quot;]\n    S --&gt; P[&quot;KafkaTemplate&lt;br/&gt;(публикация событий)&quot;]\n    P --&gt; T[&quot;Kafka: topic orders.created&quot;]\n    T --&gt; N[&quot;Другие сервисы:&lt;br/&gt;уведомления, аналитика&quot;]\u003c/div>\u003ch2>Куда встаивает Kafka\u003c/h2>\n\u003cp>HTTP хорош, когда caller'у нужен ответ \u003cem>сейчас\u003c/em>. Но часть работы — фоновая: отправить письмо, посчитать аналитику, синхронизовать поиск. Держать запрос пользователя пока отправляется письмо — расточительно.\u003c/p>\n\u003cp>Паттерн: сервис сделал свою работу → опубликовал \u003cstrong>событие\u003c/strong> в Kafka → пошёл дальше. Кто хотел — прочитал и отработал:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(order.getId()));\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant O as order-service\n    participant K as Kafka (topic orders.created)\n    participant N as notification-service\n    O-&gt;&gt;O: сохранил заказ (транзакция)\n    O-&gt;&gt;K: опубликовал OrderCreatedEvent\n    O--&gt;&gt;Клиенту: 201 Created (не ждёт писем!)\n    K-&gt;&gt;N: событие доставлено консюмеру\n    N-&gt;&gt;N: отправил письмо\u003c/div>\u003cp>Ключевые слова: \u003cstrong>продюсер\u003c/strong> публикует, \u003cstrong>консюмер\u003c/strong> подписан, \u003cstrong>topic\u003c/strong> — именованный канал событий. События в Kafka сохраняются и могут быть перечитаны — этим она отличается от «просто почтового ящика». Вглубь — в отдельном модуле.\u003c/p>\n\u003ch2>Наблюдаемость: Actuator и Micrometer\u003c/h2>\n\u003cp>Сервис в проде — как самолёт: нужно, чтобы он сам сообщал о своём состоянии. В Spring Boot за это отвечают два инструмента.\u003c/p>\n\u003cp>\u003cstrong>Actuator\u003c/strong> — встроенные эксплуатационные endpoints:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Endpoint\u003c/th>\n\u003cth>Что показывает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/health\u003c/code>\u003c/td>\n\u003ctd>Жив ли сервис: \u003ccode>{&quot;status&quot;: &quot;UP&quot;}\u003c/code>; включает проверки базы, Kafka и др.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/metrics\u003c/code>\u003c/td>\n\u003ctd>Числовые метрики: память, время ответов, счётчики\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/info\u003c/code>\u003c/td>\n\u003ctd>Информация о сборке\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>/actuator/health\u003c/code> — рабочая лошадка деплоя: балансировщик и Kubernetes-пробы опрашивают его и решают, направлять ли трафик на инстанс или перезапустить его.\u003c/p>\n\u003cp>\u003cstrong>Micrometer\u003c/strong> — «фасад метрик»: единый API для счётчиков и таймеров, который экспортирует данные в системы мониторинга (Prometheus и другие). Один раз написали метрику — увидели её на дашборде команды:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Counter\u003c/span> \u003cspan class=\"hljs-variable\">created\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> meterRegistry.counter(\u003cspan class=\"hljs-string\">&quot;orders.created.total&quot;\u003c/span>);\ncreated.increment();     \u003cspan class=\"hljs-comment\">// +1 заказ — график на дашборде пополз вверх\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> \u003ccode>/actuator/health\u003c/code> — ваш первый инструмент при «а сервис вообще жив?»: UP/DOWN и причина, без доступа к серверу. А метрики — готовые данные для проверки нечерного-box поведения.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> события Kafka (\u003ccode>orders.created\u003c/code>) и метрики (\u003ccode>orders.created.total\u003c/code>) — это то, из чего строятся продуктовые дашборды в реальном времени. Требование «видеть конверсию заказов онлайн» — это требование к событию и метрике.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Сервис держит бизнес-правила; \u003ccode>@Transactional\u003c/code> даёт «всё или ничего»\u003c/li>\n\u003cli>Репозиторий — интерфейс: Spring Data генерирует SQL; entity = таблица, миграции — через Liquibase\u003c/li>\n\u003cli>Kafka: опубликовал событие → пошёл дальше; фоновые потребители дочитают\u003c/li>\n\u003cli>Actuator даёт \u003ccode>/actuator/health\u003c/code> и метрики; Micrometer — единый API для дашбордов\u003c/li>\n\u003c/ul>\n\u003cp>Пилот собран: вы прошли путь от HTTP-запроса до живого сервиса со слоями, базой, событиями и метриками. Дальше — экзамен и кейс, проверяющие весь модуль целиком.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","codeLang":"java","code":"public interface OrderRepository extends JpaRepository\u003cOrder, Long> {\n    List\u003cOrder> findByCustomerIdAndStatus(Long customerId, String status);\n}\n","question":"Что верно про этот репозиторий?","options":["Spring Data сам сгенерирует реализацию и SQL по имени метода — писать нечего","Это нерабочий код: у интерфейса нет реализации","Метод нужно вручную реализовать в классе OrderRepositoryImpl","Метод сработает только если написать SQL в аннотации"],"correct":0,"explanation":"JpaRepository даёт готовые save/findById/deleteById, а по имени findByCustomerIdAndStatus Spring Data выводит WHERE customer_id = ? AND status = ?. Реализация генерируется при старте приложения.","codeHtml":"\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">OrderRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Order, Long&gt; {\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-title function_\">findByCustomerIdAndStatus\u003c/span>\u003cspan class=\"hljs-params\">(Long customerId, String status)\u003c/span>;\n}\n"},{"type":"single","question":"Метод сервиса помечен @Transactional. Что это гарантирует?","options":["Либо все записи в базу внутри метода применятся, либо ни одна","Метод выполнится быстрее — в отдельном потоке","Ответ метода всегда со статусом 200","Метод нельзя вызвать дважды одновременно"],"correct":0,"explanation":"Транзакция = атомарность: ошибка на середине откатывает всё сделанное ранее в методе. Половина заказа не сохранится никогда. Про потоки и статусы аннотация ничего не обещает."},{"type":"match","question":"Сопоставь понятие и его смысл.","pairs":[{"left":"Entity","right":"Java-класс, отображённый на таблицу"},{"left":"Kafka topic","right":"Именованный канал событий"},{"left":"@Service","right":"Слой бизнес-правил"},{"left":"Liquibase","right":"Версионирование схемы базы миграциями"}]},{"type":"multi","question":"Какие утверждения про Kafka в этой архитектуре верны? (несколько ответов)","options":["Продюсер публикует событие в topic и не ждёт фоновой обработки","Консюмеры подписываются на topic и обрабатывают события сами","Kafka заменяет базу данных: заказы хранятся только в topic","Тяжёлую фоновую работу выносят в консюмеры, чтобы API отвечал быстро"],"correct":[0,1,3],"explanation":"Kafka — транспорт и буфер событий, а не хранилище записей заказа: источником правды остаётся база. Остальное — суть паттерна: событие опубликовано, фоновые потребители отработали в своём темпе."},{"type":"blank","question":"Какой endpoint Actuator'а возвращает статус живости сервиса (UP/DOWN)? Ответ начни с /actuator/","answers":["/actuator/health"],"explanation":"GET /actuator/health — стандартная точка проверки: её опрашивают балансировщики и Kubernetes-пробы, чтобы решать, жив ли инстанс."},{"type":"single","question":"Мониторинг показывает: /actuator/health отвечает {\"status\": \"DOWN\", \"components\": {\"db\": {\"status\": \"DOWN\"}}}. Что случилось?","options":["Сервис работает, но не может подключиться к базе данных — трафик на него направлять нельзя","Упало всё приложение: процесс мёртв, health отвечает последний раз","Ничего страшного: DOWN бывает при обновлении схемы базы","Ошибка в коде контроллера: вернуть 500 клиенту"],"correct":0,"explanation":"Health-проверка сама жива (она ответила!) и сообщает причину: база недоступна. Приложение поднимают заново, только если падает liveness-проба, а здесь задача — чинить подключение к БД."},{"type":"single","question":"Зачем в проекте Micrometer, если метрики можно писать в логи?","options":["Micrometer — единый API метрик (счётчики, таймеры) с экспортом в системы мониторинга и дашборды","Micrometer заменяет логирование: логи больше не нужны","Micrometer ускоряет работу базы данных","Это требование Spring Boot: без него приложение не стартует"],"correct":0,"explanation":"Метрики — это числа с именами и тегами, которые должны попасть в Prometheus/графики, а не в текст логов. Micrometer даёт один API и разные экспорты; логи при этом остаются для другого — контекста происшествий."}]],"cases":[]},{"id":"module-1-exam","title":"Экзамен модуля и кейс","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":6,"lab":null,"html":"\u003ch1>Экзамен модуля «Spring Boot: бэкенд с нуля»\u003c/h1>\n\u003cp>Вы прошли пять уроков: HTTP, устройство сервиса, Java-шпаргалка, REST-контроллер, слои с Kafka и наблюдаемостью. Финальная проверка — в двух частях:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Кейс\u003c/strong> — спроектировать API своими словами (сначала пишете своё решение, потом сверяетесь с эталоном)\u003c/li>\n\u003cli>\u003cstrong>Экзамен\u003c/strong> — 18 вопросов по всему модулю, порог 80%, пересдача не ограничена\u003c/li>\n\u003c/ol>\n\u003cp>Сначала кейс, потом экзамен. Поехали.\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Запрос GET /api/users?page=2 пришёл на сервер. Что такое page=2?","options":["Query-параметр: просит вторую страницу списка пользователей","Часть пути: обращение к ресурсу users/2","Заголовок запроса","Тело запроса"],"correct":0,"explanation":"Всё после ? — query-параметры: фильтры, пагинация, сортировка. Они не меняют «какой ресурс», а уточняют «какую его часть»."},{"type":"single","question":"Сервер вернул 403 Forbidden. Что это значит по сравнению с 401 Unauthorized?","options":["Сервер понял, кто вы, но этому роли действие запрещено","Токен не приложен или истёк — сервер не знает, кто вы","Такого ресурса не существует","Сервер перегружен, попробуйте позже"],"correct":0,"explanation":"401 — «не знаю, кто ты» (нет/невалиден токен), 403 — «знаю, но нельзя» (нет прав). 404 — «ресурса нет», перегрузка — это 5xx (например, 503)."},{"type":"multi","question":"Какие утверждения о статус-кодах верны? (несколько ответов)","options":["204 — успешный ответ без тела","4xx — класс ошибок на стороне клиента","301 и 404 — это одно и то же: ресурс не найден","500 — ошибка на стороне сервера"],"correct":[0,1,3],"explanation":"301 — редирект (ресурс переехал, вот новый адрес), а не «не найдено». Остальное — прямая расшифровка классов."},{"type":"single","codeLang":"http","code":"HTTP/1.1 204 No Content\n","question":"Клиент отправил DELETE /api/tasks/7 и получил такой ответ. Как оценишь результат?","options":["Успех: задача удалена, тела ответа не требуется","Ошибка: сервер не понял, что удалять","Ошибка: задача не найдена","Частичный успех: удаление произойдёт позже"],"correct":0,"explanation":"204 — успех без тела. Удалённому ресурсу нечего возвращать. Ошибки здесь были бы 404 (нет такой) или 500 (сломалось).","codeHtml":"\u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span> \u003cspan class=\"hljs-number\">204\u003c/span> No Content\n"},{"type":"blank","question":"Какой заголовок ответа сообщает клиенту, что тело — это JSON? (формат: Имя-Заголовка, как он пишется в HTTP)","answers":["Content-Type"],"correct_note":"","explanation":"Content-Type: application/json. Он есть и в запросе, и в ответе — всегда описывает формат именно тела."},{"type":"single","question":"Требование гласит: «email в заказе обязателен, максимум один @». Где это правило должно сработать первым?","options":["В контроллере — на валидации входных данных, до бизнес-логики","В сервисном слое — это бизнес-правило","В репозитории — при сохранении в базу","В Kafka — при публикации события"],"correct":0,"explanation":"Формат и обязательность поля — валидация входа, зона контроллера: кривой запрос не должен попадать в сервис. Бизнес-правила («скидка не больше 50%») — сервис. Грубая проверка на уровне БД (not null) — страховка, не замена."},{"type":"match","question":"Сопоставь симптом и слой, где ищем причину.","pairs":[{"left":"400: «поле title обязательно»","right":"Контроллер / валидация"},{"left":"200 OK, но сумма заказа посчитана неверно","right":"Сервисный слой"},{"left":"500, в логе ошибка SQL","right":"Репозиторий / база"},{"left":"Приложение не стартует: порт уже занят","right":"Конфигурация"}]},{"type":"single","question":"Почему пароль от базы не хранят в application.yml в git?","options":["Секреты передают через переменные окружения или секрет-хранилище — файл в git видит вся команда и история навсегда","YAML не поддерживает пароли","Spring запрещает секреты в конфигах","Пароль нужен только тестам, прод работает без него"],"correct":0,"explanation":"Git-история неистребима: попал секрет в коммит — считай, утёк. Поэтому секреты — в переменных окружения (или Vault-подобных хранилищах), а в конфиге — только ссылки на них."},{"type":"single","codeLang":"java","code":"Optional\u003cOrder> order = orderRepository.findByNumber(\"A-42\");\nOrder result = order.orElseThrow(() -> new OrderNotFoundException(\"A-42\"));\n","question":"Заказа A-42 в базе нет. Что произойдёт при выполнении второй строки?","options":["Выбросится OrderNotFoundException — его обработает глобальный обработчик и вернёт клиенту 404","result станет null, программа продолжится","Вернётся пустой заказ со статусом NOT_FOUND","Компилятор запретит такой код"],"correct":0,"explanation":"orElseThrow на пустом Optional бросает исключение-поставщика. В Spring его перехватит @ExceptionHandler/статус-аннотация и клиент получит осмысленный 404. null тут не появится никогда.","codeHtml":"\u003cspan class=\"hljs-type\">Optional\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderRepository.findByNumber(\u003cspan class=\"hljs-string\">&quot;A-42&quot;\u003c/span>);\n\u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">result\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> order.orElseThrow(() -&gt; \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderNotFoundException\u003c/span>(\u003cspan class=\"hljs-string\">&quot;A-42&quot;\u003c/span>));\n"},{"type":"single","codeLang":"java","code":"@Getter @Builder\npublic class CreateOrderRequest {\n    private final String customer;\n    private final BigDecimal amount;\n}\n\n// использование:\nCreateOrderRequest req = CreateOrderRequest.builder()\n    .customer(\"ann\")\n    .amount(new BigDecimal(\"990\"))\n    .build();\n","question":"Что делает builder()…build() в этом коде?","options":["Собирает объект CreateOrderRequest, сгенерированный Lombok, задавая поля по цепочке","Создаёт SQL-запрос INSERT","Отправляет запрос в Kafka","Валидирует customer и amount по аннотациям @Valid"],"correct":0,"explanation":"@Builder (Lombok) генерирует фабрику-строитель: поля задаются по имени, imмутабельно и читабельно. Это альтернатива конструктора с десятью аргументами.","codeHtml":"\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Builder\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">CreateOrderRequest\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> String customer;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> BigDecimal amount;\n}\n\n\u003cspan class=\"hljs-comment\">// использование:\u003c/span>\n\u003cspan class=\"hljs-type\">CreateOrderRequest\u003c/span> \u003cspan class=\"hljs-variable\">req\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> CreateOrderRequest.builder()\n    .customer(\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>)\n    .amount(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;990&quot;\u003c/span>))\n    .build();\n"},{"type":"single","question":"Клиент отправил POST /api/tasks с телом, где вместо JSON — сломанный текст. Что ответит Spring Boot-контроллер с @RequestBody?","options":["400 Bad Request — тело не разобрать","201 Created с пустой задачей","500 — ошибка на стороне сервера","404 — такого эндпоинта нет"],"correct":0,"explanation":"Неразборчивое тело — вина клиента: 400. Эндпоинт существует (иначе 404), а серверная ошибка была бы, если бы сломался сам код обработки."},{"type":"multi","question":"Что входит в обязанности контроллера? (несколько ответов)","options":["Принять запрос и разобрать параметры/тело","Провалидировать входные данные","Вызвать сервисный слой и сформировать ответ/статус","Хранить бизнес-правила и считать скидки"],"correct":[0,1,2],"explanation":"Контроллер — «переводчик» HTTP ↔ Java: принять, проверить, делегировать, ответить. Правила и расчёты — зона сервиса: иначе слой перестаёт быть тонким."},{"type":"single","question":"Команда работает по API-First, и фронтендер спрашивает, каким будет ответ создания заказа. Что показать?","options":["Контракт OpenAPI — источник правды, код и клиенты генерируются из него","Java-класс OrderResponse — фронт разберётся","Скриншот рабочего ответа из Postman","Таблицу из базы данных orders"],"correct":0,"explanation":"В API-First источник правды — контракт. Скриншот и класс — следствия; таблица БД вообще не контракт API."},{"type":"single","codeLang":"java","code":"public interface TaskRepository extends JpaRepository\u003cTask, Long> {\n    List\u003cTask> findByProjectIdAndDone(Long projectId, boolean done);\n}\n","question":"Какой запрос сгенерирует Spring Data для этого метода?","options":["SELECT ... WHERE project_id = ? AND done = ?","SELECT ... WHERE id = ?","Метод не сработает: нужен @Query с SQL","UPDATE ... SET done = ?"],"correct":0,"explanation":"Имя метода разбирается по camelCase: findBy → SELECT, ProjectIdAndDone → условия WHERE. SQL вручную нужен только для сложных случаев.","codeHtml":"\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">TaskRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Task, Long&gt; {\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-title function_\">findByProjectIdAndDone\u003c/span>\u003cspan class=\"hljs-params\">(Long projectId, \u003cspan class=\"hljs-type\">boolean\u003c/span> done)\u003c/span>;\n}\n"},{"type":"single","question":"Внутри @Transactional-метода сервис сохранил заказ, потом упал на отправке чека. Что увидит база?","options":["Ничего: транзакция откатилась, заказа нет","Заказ сохранился, чек просто не ушёл","Заказ сохранился с флагом «без чека»","База заблокируется до перезапуска"],"correct":0,"explanation":"@Transactional — атомарность: исключение внутри откатывает все изменения метода. «Полусделанных» состояний не бывает — в этом смысл."},{"type":"single","question":"Почему после создания заказа API не ждёт отправки письма, а публикует событие в Kafka?","options":["Ответ клиенту не должен блокироваться фоновыми задачами — их доотработают подписчики","Kafka отправляет письма сама и быстрее SMTP","Без Kafka заказ не сохранится в базу","Так писали раньше, новая версия Spring требует"],"correct":0,"explanation":"Паттерн: сделал основное → опубликовал событие → ответил 201. Медленные задачи (письма, аналитика) — у консюмеров. Kafka не отправляет письма и не заменяет базу — она развязывает участников по времени."},{"type":"single","question":"Дашборд показывает: /actuator/health = UP, но компонент db = DOWN. Какое действие правильное?","options":["Трафик на инстанс не направлять и разбираться с подключением к базе","Пересобрать фронтенд — у него ошибка","Ничего: общий статус UP — значит всё хорошо","Удалить метрики компонента db из health"],"correct":0,"explanation":"Составной health падает по самому больному компоненту: база недоступна — сервис фактически неработоспособен. Прячут проблему не удалением метрики, а починкой подключения."},{"type":"blank","question":"Как называется Java-класс, помеченный @Entity и отображённый на таблицу базы данных? (одно слово)","answers":["entity","сущность"],"explanation":"Entity (сущность) — «таблица, живущая как объект»: @Id — первичный ключ, поля — колонки. Hibernate переводит entity в SQL и обратно."}]],"cases":[{"title":"Спроектируй API для списка задач","task":"Команда хочет внутренний таск-трекер. Известно: есть проекты; в проекте — задачи; у задачи — название, дедлайн и признак «сделано». Фронтендер просит: «скажи, что вызывать». Опиши API: какие endpoints (метод + путь), какие статусы ждать, как выглядят основные DTO. Форма свободная — как писали бы в чате команды. Подсказка: вспомните урок 1 (методы и статусы) и урок 4 (DTO и коды создания).","placeholder":"Например:\nGET /api/projects — список проектов\nPOST /api/tasks — создать задачу, 201 + ...","referenceHtml":"\u003cp>Один из возможных ответов (не единственно верный — важна логика).\u003c/p>\n\u003ch2>Endpoints\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Метод и путь\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003cth>Успех\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/projects\u003c/code>\u003c/td>\n\u003ctd>Список проектов\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code> + \u003ccode>[{id, title}]\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/projects\u003c/code>\u003c/td>\n\u003ctd>Создать проект\u003c/td>\n\u003ctd>\u003ccode>201\u003c/code> + \u003ccode>Location: /api/projects/{id}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/projects/{id}/tasks\u003c/code>\u003c/td>\n\u003ctd>Задачи проекта (можно фильтр \u003ccode>?status=done\u003c/code>)\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code> + список\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/projects/{id}/tasks\u003c/code>\u003c/td>\n\u003ctd>Создать задачу в проекте\u003c/td>\n\u003ctd>\u003ccode>201\u003c/code> + \u003ccode>Location\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PATCH /api/tasks/{id}\u003c/code>\u003c/td>\n\u003ctd>Частичное изменение: «сделано», дедлайн\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DELETE /api/tasks/{id}\u003c/code>\u003c/td>\n\u003ctd>Удалить задачу\u003c/td>\n\u003ctd>\u003ccode>204\u003c/code> (без тела)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Ключевые решения\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>PATCH, а не PUT\u003c/strong> для «сделано»: меняем одно поле, а не всю задачу целиком.\u003c/li>\n\u003cli>\u003cstrong>201 + Location\u003c/strong> при создании — сервер говорит, где лежит новое (урок 1).\u003c/li>\n\u003cli>\u003cstrong>204 без тела\u003c/strong> при удалении — удалять больше нечего, рассказывать нечего.\u003c/li>\n\u003cli>Ошибки: \u003ccode>400\u003c/code> — кривой JSON/валидация, \u003ccode>404\u003c/code> — проекта или задачи нет.\u003c/li>\n\u003c/ul>\n\u003ch2>DTO\u003c/h2>\n\u003cpre>\u003ccode>record TaskResponse(Long id, String title, LocalDate deadline, boolean done)\nrecord CreateTaskRequest(String title, LocalDate deadline)\n\u003c/code>\u003c/pre>\n\u003cp>Внутри — entity \u003ccode>Task\u003c/code> с \u003ccode>@Entity\u003c/code>; наружу — DTO без лишних полей (урок 4). Между ними — MapStruct.\u003c/p>\n\u003ch2>Продвинутый уровень (не обязателен)\u003c/h2>\n\u003cp>Пометка «сделано» — событие \u003ccode>tasks.completed\u003c/code> в Kafka: уведомления и статистика дочитают сами, а API не ждёт рассылки писем (урок 5). Метрику \u003ccode>tasks.completed.total\u003c/code> через Micrometer — и на дашборд.\u003c/p>\n"}]},{"id":"m2-lesson-01","title":"API как договор","module":2,"moduleTitle":"Проектирование API","order":1,"lab":null,"html":"\u003ch1>Урок 1. API как договор\u003c/h1>\n\u003cp>В модуле 1 мы писали код — и API «получался». Работает, пока потребителей мало. Как только ваш API кто-то использует — фронтенд, мобильное приложение, другой сервис — каждое изменение становится чужой проблемой. Этот модуль про то, как проектировать API осознанно: сначала договор, потом код.\u003c/p>\n\u003ch2>API — это интерфейс, а не «код, который случайно наружу»\u003c/h2>\n\u003cp>\u003cstrong>API\u003c/strong> (Application Programming Interface) — граница, через которую одна программа говорит с другой. Для бэкенда это набор эндпоинтов: пути, методы, запросы, ответы, ошибки, форматы.\u003c/p>\n\u003cp>Ключевая мысль: \u003cstrong>API — это договор между вами и потребителями\u003c/strong>. Как только договор подписан (кто-то начал его использовать), одностороннее изменение условий — нарушение. Бэкендер может рефакторить внутренности сколько угодно; контракт — только по правилам.\u003c/p>\n\u003cp>Кто потребители вашего API на самом деле:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Фронтенд\u003c/strong> — веб-приложение\u003c/li>\n\u003cli>\u003cstrong>Мобильные приложения\u003c/strong> — их нельзя «обновить всех сразу»: у пользователей старые версии живут месяцами\u003c/li>\n\u003cli>\u003cstrong>Другие сервисы\u003c/strong> — внутренние и внешние интеграции\u003c/li>\n\u003cli>\u003cstrong>QA-автотесты\u003c/strong> — тоже потребитель: тесты завязаны на контракт\u003c/li>\n\u003cli>\u003cstrong>Аналитики\u003c/strong> — если API отдаёт данные для дашбордов\u003c/li>\n\u003c/ul>\n\u003ch2>Цена сломанного контракта\u003c/h2>\n\u003cp>Классика жанра:\u003c/p>\n\u003col>\n\u003cli>Бэкенд переименовал поле \u003ccode>name\u003c/code> в \u003ccode>fullName\u003c/code> — «так правильнее»\u003c/li>\n\u003cli>Фронт собирался на старом контракте и уже уехал в прод\u003c/li>\n\u003cli>Везде, где было имя пользователя, — пустота\u003c/li>\n\u003cli>Почти у всех сторон «работало у меня локально»\u003c/li>\n\u003c/ol>\n\u003cp>Ошибка не в переименовании, а в том, что оно произошло \u003cstrong>молча\u003c/strong>. Договор меняют открыто: предупредить, версионировать, дать время на переезд.\u003c/p>\n\u003ch2>Два подхода: code-first и API-First\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Code-first\u003c/th>\n\u003cth>API-First\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Что сначала\u003c/td>\n\u003ctd>Код контроллера\u003c/td>\n\u003ctd>Контракт (OpenAPI-спека)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Документация\u003c/td>\n\u003ctd>Побочный продукт (генерится из кода, если повезёт)\u003c/td>\n\u003ctd>Первична и всегда актуальна\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ревью\u003c/td>\n\u003ctd>Ревью кода — контракт уже «случился»\u003c/td>\n\u003ctd>Ревью контракта — до написания кода\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Потребители узнают о API\u003c/td>\n\u003ctd>Когда задеплоено\u003c/td>\n\u003ctd>По спеке — ещё до реализации\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Скорость старта\u003c/td>\n\u003ctd>Быстро на старте\u003c/td>\n\u003ctd>Чуть медленнее на старте\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Цена изменения потом\u003c/td>\n\u003ctd>Дорого (кто-то уже завязался)\u003c/td>\n\u003ctd>Дёшево на этапе договора\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Code-first не «неправильный» — для маленького внутреннего сервиса или прототипа он разумен. API-First выигрывает, когда потребителей больше одного (или они появятся), когда фронт и бэк работают параллельно, когда API живёт годами.\u003c/p>\n\u003ch2>OpenAPI: договор, который исполняется\u003c/h2>\n\u003cp>\u003cstrong>OpenAPI\u003c/strong> — стандарт описания REST API: YAML- или JSON-файл, в котором формально записаны все пути, параметры, схемы запросов/ответов и ошибки. Та же идея, что TypeScript-типы, только для HTTP-границы между командами.\u003c/p>\n\u003cp>Из этого файла вырастает вся инфраструктура договора:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Swagger UI\u003c/strong> — интерактивная документация: читаем и пробуем запросы прямо из браузера\u003c/li>\n\u003cli>\u003cstrong>Генерация кода\u003c/strong> — типизированные клиенты для фронта (TS) и заготовки интерфейсов для бэкенда (Java)\u003c/li>\n\u003cli>\u003cstrong>Мок-сервер\u003c/strong> — фронтенд работает с «фейковым» API по спеке, пока бэкенд реализует\u003c/li>\n\u003cli>\u003cstrong>Контрактные тесты\u003c/strong> — проверка, что живой API не разошёлся с договором\u003c/li>\n\u003c/ul>\n\u003cp>Формат спеки — тема урока 2. Пока важно: договор существует в машиночитаемом виде, а не «в голове у бэкендера и в устаревшей Confluence-странице».\u003c/p>\n\u003ch2>Как выглядит цикл API-First\u003c/h2>\n\u003cdiv class=\"mermaid\">flowchart LR\n    A[&quot;Черновик спеки&quot;] --&gt; B[&quot;Ревью с потребителями&lt;br/&gt;(фронт, QA, аналитик)&quot;]\n    B --&gt; C[&quot;Спека согласована —&lt;br/&gt;фиксирована версия&quot;]\n    C --&gt; D[&quot;Фронт: мок-сервер +&lt;br/&gt;генерация клиента&quot;]\n    C --&gt; E[&quot;Бэк: реализация&lt;br/&gt;по контракту&quot;]\n    D --&gt; F[&quot;Контрактные тесты:&lt;br/&gt;код соответствует спеке&quot;]\n    E --&gt; F\u003c/div>\u003cp>Заметьте: фронтенд не ждёт бэкенд. Обе стороны работают параллельно против одного договора — это главный выигрыш API-First по срокам.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> вы уже живёте в контрактном мире: TS-интерфейсы между модулями, типы из бэкенда. OpenAPI — тот же интерфейс, только на границе HTTP, и из него генерится ваш API-клиент с типами. Больше не нужен слой ручных обёрток над fetch.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> спека — готовая основа тест-анализа: каждый путь и код ответа из неё — кейс в матрице. Примеры из спеки (examples) — готовые тест-данные. А контрактные тесты в CI — это ваш «регресс контракта» бесплатно.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> вы — соавтор договора. Поля, их семантика, коды ошибок, сценарии — всё это фиксируется в спеке до кода. Ваше «а добавьте поле» в мире API-First — это правка контракта с ревью, а не просьба «по-тихому поправить в коде».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>API — договор; после появления потребителей менять его можно только открыто и по правилам\u003c/li>\n\u003cli>Потребителей больше, чем кажется: фронт, мобилки, сервисы, автотесты, аналитика\u003c/li>\n\u003cli>Code-first — норм для прототипов; API-First — для API, которые живут и у которых есть потребители\u003c/li>\n\u003cli>OpenAPI — машиночитаемый договор: документация, генерация клиентов, моки, контрактные тесты\u003c/li>\n\u003cli>В API-First фронт и бэк работают параллельно против спеки\u003c/li>\n\u003c/ul>\n\u003cp>В следующем уроке откроем реальную OpenAPI-спеку и научимся её читать и писать.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Бэкенд переименовал поле name в fullName и задеплоил в пятницу вечером. Фронтенд узнал об этом в понедельник из падения продакшена. Что было нарушено?","options":["Договор: изменение контракта прошло без предупреждения и без переходного периода","Ничего: внутренние поля бэкенда — его дело","Соглашение об именовании Java-полей","Процесс деплоя: нельзя деплоить по пятницам"],"correct":0,"explanation":"Поле name было частью контракта — фронт на него завязался. Договор меняют открыто: предупредить потребителей, поддержать оба поля переходный период, объявить deprecation старого."},{"type":"multi","question":"Кто является потребителями API интернет-магазина? (несколько ответов)","options":["Веб-фронтенд","Мобильное приложение, которое пользователи обновляют с задержкой","QA-автотесты, завязанные на запросы и ответы","Разработчик, который написал контроллер"],"correct":[0,1,2],"explanation":"Потребитель — тот, кто завязан на контракт снаружи. Автор контроллера — не потребитель: он может рефакторить внутренности, контракт меняется по другим правилам."},{"type":"single","question":"В чём главное преимущество API-First по срокам разработки фичи?","options":["Фронтенд и бэкенд работают параллельно: фронт — против мок-сервера по спеке, бэк — реализует контракт","Код пишется быстрее, потому что OpenAPI ускоряет Java","QA начинает тестирование до постановки задачи","Не нужно писать код контроллера вообще"],"correct":0,"explanation":"Спека + мок-сервер развязывают команды по времени. Код писать всё равно нужно — генерация даёт заготовки и клиентов, а не реализацию."},{"type":"match","question":"Сопоставь артефакт OpenAPI и то, что из него получается.","pairs":[{"left":"Swagger UI","right":"Интерактивная документация с возможностью попробовать запросы"},{"left":"Генерация клиента","right":"Типизированный код для вызова API (например, на TypeScript)"},{"left":"Мок-сервер","right":"Фейковый API, отвечающий по спеке без реализации"},{"left":"Контрактные тесты","right":"Проверка, что живой API соответствует договору"}]},{"type":"blank","question":"Как называется стандарт машиночитаемого описания REST API в YAML/JSON? (одно слово, имя собственное)","answers":["OpenAPI"],"explanation":"OpenAPI Specification. Swagger — имя инструментария вокруг стандарта (UI, Codegen); сам формат называется OpenAPI."},{"type":"single","question":"Какой проект разумно вести в code-first, а не в API-First?","options":["Прототип внутреннего сервиса, у которого пока один потребитель — команда-автор","Публичное API для внешних партнёров","API, по которому фронт и мобильная команда работают параллельно с бэкендом","API, которое живёт третий год и у него пять интеграций"],"correct":0,"explanation":"Чем больше потребителей и дольше жизнь API, тем дороже «случайный» контракт. Прототип для себя — законная зона code-first: договор ещё не подписан."},{"type":"single","codeLang":"yaml","code":"# фрагмент OpenAPI-спеки\npaths:\n  /api/tasks/{id}:\n    get:\n      responses:\n        \"200\":\n          description: Задача найдена\n","question":"Что можно сказать об этом API, глядя на фрагмент спеки?","options":["Описан GET-запрос /api/tasks/{id}, где id — параметр пути","Описано создание задачи POST-запросом","Это GraphQL-схема","Спека описывает базу данных: таблицу tasks"],"correct":0,"explanation":"Раздел paths описывает эндпоинты: путь с параметром {id}, метод get, ожидаемый ответ 200. Спека — про контракт HTTP, а не про базу: как хранится — её не волнует.","codeHtml":"\u003cspan class=\"hljs-comment\"># фрагмент OpenAPI-спеки\u003c/span>\n\u003cspan class=\"hljs-attr\">paths:\u003c/span>\n  \u003cspan class=\"hljs-string\">/api/tasks/{id}:\u003c/span>\n    \u003cspan class=\"hljs-attr\">get:\u003c/span>\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;200&quot;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Задача\u003c/span> \u003cspan class=\"hljs-string\">найдена\u003c/span>\n"}]],"cases":[]},{"id":"m2-lesson-02","title":"OpenAPI: читаем и пишем","module":2,"moduleTitle":"Проектирование API","order":2,"lab":{"title":"Лаба 3. OpenAPI-контракт","description":"Дописать openapi.yaml бронирования переговорок по требованиям. Проверка — автотесты контракта: mvn test зелёный = договор описан верно.","branch":"lab-3","branchSolution":"lab-3-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 2. OpenAPI: читаем и пишем\u003c/h1>\n\u003cp>Спека OpenAPI — это обычный YAML-файл со стандартной структурой. Научиться её читать — навык на один вечер; уметь писать — вопрос практики. Разберём живой пример: API списка задач из кейса модуля 1.\u003c/p>\n\u003ch2>Анатомия спеки\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">openapi:\u003c/span> \u003cspan class=\"hljs-number\">3.1\u003c/span>\u003cspan class=\"hljs-number\">.0\u003c/span>                      \u003cspan class=\"hljs-comment\"># версия стандарта\u003c/span>\n\u003cspan class=\"hljs-attr\">info:\u003c/span>                               \u003cspan class=\"hljs-comment\"># метаданные договора\u003c/span>\n  \u003cspan class=\"hljs-attr\">title:\u003c/span> \u003cspan class=\"hljs-string\">Task\u003c/span> \u003cspan class=\"hljs-string\">API\u003c/span>\n  \u003cspan class=\"hljs-attr\">version:\u003c/span> \u003cspan class=\"hljs-number\">1.0\u003c/span>\u003cspan class=\"hljs-number\">.0\u003c/span>\n  \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">API\u003c/span> \u003cspan class=\"hljs-string\">списка\u003c/span> \u003cspan class=\"hljs-string\">задач\u003c/span> \u003cspan class=\"hljs-string\">(модуль\u003c/span> \u003cspan class=\"hljs-string\">BE-101)\u003c/span>\n\u003cspan class=\"hljs-attr\">servers:\u003c/span>\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">url:\u003c/span> \u003cspan class=\"hljs-string\">https://tasks.example.com\u003c/span>  \u003cspan class=\"hljs-comment\"># где живёт\u003c/span>\n\u003cspan class=\"hljs-attr\">paths:\u003c/span>                              \u003cspan class=\"hljs-comment\"># ЭНДПОИНТЫ — сердце спеки\u003c/span>\n  \u003cspan class=\"hljs-string\">/api/projects/{projectId}/tasks:\u003c/span>\n    \u003cspan class=\"hljs-attr\">get:\u003c/span>\n      \u003cspan class=\"hljs-attr\">summary:\u003c/span> \u003cspan class=\"hljs-string\">Задачи\u003c/span> \u003cspan class=\"hljs-string\">проекта\u003c/span>\n      \u003cspan class=\"hljs-attr\">parameters:\u003c/span>\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">projectId\u003c/span>\n          \u003cspan class=\"hljs-attr\">in:\u003c/span> \u003cspan class=\"hljs-string\">path\u003c/span>\n          \u003cspan class=\"hljs-attr\">required:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n          \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n            \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">integer\u003c/span>\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;200&quot;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Список\u003c/span> \u003cspan class=\"hljs-string\">задач\u003c/span>\n          \u003cspan class=\"hljs-attr\">content:\u003c/span>\n            \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n              \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n                \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">array\u003c/span>\n                \u003cspan class=\"hljs-attr\">items:\u003c/span>\n                  \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/TaskResponse&quot;\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Читается сверху вниз: \u003cstrong>info\u003c/strong> — что это за API и какая версия, \u003cstrong>servers\u003c/strong> — адрес, \u003cstrong>paths\u003c/strong> — эндпоинты. Внутри пути — операции по HTTP-методам (\u003ccode>get\u003c/code>, \u003ccode>post\u003c/code>, \u003ccode>patch\u003c/code>, \u003ccode>delete\u003c/code>), у каждой — параметры и ответы.\u003c/p>\n\u003ch2>Схемы: словарь договора\u003c/h2>\n\u003cp>Повторяющиеся структуры выносятся в \u003cstrong>components/schemas\u003c/strong> — это DTO контракта:\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">components:\u003c/span>\n  \u003cspan class=\"hljs-attr\">schemas:\u003c/span>\n    \u003cspan class=\"hljs-attr\">TaskResponse:\u003c/span>\n      \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">object\u003c/span>\n      \u003cspan class=\"hljs-attr\">required:\u003c/span> [\u003cspan class=\"hljs-string\">id\u003c/span>, \u003cspan class=\"hljs-string\">title\u003c/span>, \u003cspan class=\"hljs-string\">done\u003c/span>]\n      \u003cspan class=\"hljs-attr\">properties:\u003c/span>\n        \u003cspan class=\"hljs-attr\">id:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">integer\u003c/span>\n          \u003cspan class=\"hljs-attr\">format:\u003c/span> \u003cspan class=\"hljs-string\">int64\u003c/span>\n        \u003cspan class=\"hljs-attr\">title:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n          \u003cspan class=\"hljs-attr\">example:\u003c/span> \u003cspan class=\"hljs-string\">Купить\u003c/span> \u003cspan class=\"hljs-string\">молоко\u003c/span>\n        \u003cspan class=\"hljs-attr\">deadline:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n          \u003cspan class=\"hljs-attr\">format:\u003c/span> \u003cspan class=\"hljs-string\">date\u003c/span>\n          \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n        \u003cspan class=\"hljs-attr\">done:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">boolean\u003c/span>\n    \u003cspan class=\"hljs-attr\">CreateTaskRequest:\u003c/span>\n      \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">object\u003c/span>\n      \u003cspan class=\"hljs-attr\">required:\u003c/span> [\u003cspan class=\"hljs-string\">title\u003c/span>]\n      \u003cspan class=\"hljs-attr\">properties:\u003c/span>\n        \u003cspan class=\"hljs-attr\">title:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n          \u003cspan class=\"hljs-attr\">minLength:\u003c/span> \u003cspan class=\"hljs-number\">1\u003c/span>\n        \u003cspan class=\"hljs-attr\">deadline:\u003c/span>\n          \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n          \u003cspan class=\"hljs-attr\">format:\u003c/span> \u003cspan class=\"hljs-string\">date\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>На схемы ссылаются по \u003ccode>$ref\u003c/code> — один раз описали \u003ccode>TaskResponse\u003c/code>, переиспользуем в списке, в ответе создания, где угодно. Схемы — это те же \u003ccode>record TaskResponse(...)\u003c/code> из урока 4 модуля 1, только на языке контракта.\u003c/p>\n\u003cp>Обратите внимание, как валидация из кода переезжает в договор: \u003ccode>required\u003c/code>, \u003ccode>minLength\u003c/code>, \u003ccode>format: date\u003c/code> — потребитель видит правила \u003cstrong>до\u003c/strong> отправки первого запроса.\u003c/p>\n\u003ch2>Примеры: документация, которая ездит\u003c/h2>\n\u003cp>В каждую схему и ответ можно вписать \u003ccode>example\u003c/code> — и они попадают в Swagger UI и в тест-данные QA:\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">  \u003cspan class=\"hljs-attr\">&quot;404&quot;:\u003c/span>\n    \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Задача\u003c/span> \u003cspan class=\"hljs-string\">не\u003c/span> \u003cspan class=\"hljs-string\">найдена\u003c/span>\n    \u003cspan class=\"hljs-attr\">content:\u003c/span>\n      \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n        \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n          \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/Error&quot;\u003c/span>\n        \u003cspan class=\"hljs-attr\">example:\u003c/span>\n          \u003cspan class=\"hljs-attr\">code:\u003c/span> \u003cspan class=\"hljs-string\">TASK_NOT_FOUND\u003c/span>\n          \u003cspan class=\"hljs-attr\">message:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Задача 42 не найдена&quot;\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Хороший тон: примеры есть у каждого ответа, включая ошибки. Разработчик фронта пишет обработку ошибок по примерам, QA берёт их в тесты — не нужно никого спрашивать в чате.\u003c/p>\n\u003ch2>POST-запрос в спеке\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">  \u003cspan class=\"hljs-string\">/api/projects/{projectId}/tasks:\u003c/span>\n    \u003cspan class=\"hljs-attr\">post:\u003c/span>\n      \u003cspan class=\"hljs-attr\">summary:\u003c/span> \u003cspan class=\"hljs-string\">Создать\u003c/span> \u003cspan class=\"hljs-string\">задачу\u003c/span>\n      \u003cspan class=\"hljs-attr\">requestBody:\u003c/span>\n        \u003cspan class=\"hljs-attr\">required:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n        \u003cspan class=\"hljs-attr\">content:\u003c/span>\n          \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n            \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n              \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/CreateTaskRequest&quot;\u003c/span>\n            \u003cspan class=\"hljs-attr\">example:\u003c/span>\n              \u003cspan class=\"hljs-attr\">title:\u003c/span> \u003cspan class=\"hljs-string\">Купить\u003c/span> \u003cspan class=\"hljs-string\">молоко\u003c/span>\n              \u003cspan class=\"hljs-attr\">deadline:\u003c/span> \u003cspan class=\"hljs-number\">2026-12-01\u003c/span>\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;201&quot;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Задача\u003c/span> \u003cspan class=\"hljs-string\">создана\u003c/span>\n          \u003cspan class=\"hljs-attr\">headers:\u003c/span>\n            \u003cspan class=\"hljs-attr\">Location:\u003c/span>\n              \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n                \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n              \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">&quot;/api/tasks/{id} созданной задачи&quot;\u003c/span>\n          \u003cspan class=\"hljs-attr\">content:\u003c/span>\n            \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n              \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n                \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/TaskResponse&quot;\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;400&quot;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Ошибки валидации (например, пустой title)&quot;\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Сравните с уроком 4 модуля 1: \u003ccode>201\u003c/code> + \u003ccode>Location\u003c/code> + DTO + \u003ccode>400\u003c/code> — всё, что мы делали в коде, здесь описано как договор. В API-First эта спека пишется \u003cstrong>раньше\u003c/strong> кода.\u003c/p>\n\u003ch2>Что из спеки генерируется\u003c/h2>\n\u003cp>Инструменты (openapi-generator, встроенная поддержка в фреймворках):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Клиенты\u003c/strong>: TypeScript, Java, Python… — типизированные обёртки над HTTP\u003c/li>\n\u003cli>\u003cstrong>Заготовки сервера\u003c/strong>: Java-интерфейсы и DTO, которые бэкенд имплементирует\u003c/li>\n\u003cli>\u003cstrong>Swagger UI\u003c/strong>: страница «попробовать» — запросы прямо из документации\u003c/li>\n\u003cli>\u003cstrong>Мок-сервер\u003c/strong>: отвечает примерами из спеки — фронт работает до готовности бэка\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> сгенерированный TS-клиент — это типы запросов/ответов из спеки. Поменялся контракт — перегенерили клиент — и компилятор сам показал все места, которые надо поправить. Ручные интерфейсы и обёртки больше не нужны.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> Swagger UI — готовый «Postman по спеке»: смотрите структуру, отправляете запросы, сверяете ответы. А examples из спеки — согласованное с бэкендом множество тест-данных.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Спека = \u003ccode>info\u003c/code> + \u003ccode>servers\u003c/code> + \u003ccode>paths\u003c/code> + \u003ccode>components/schemas\u003c/code>\u003c/li>\n\u003cli>Схемы — переиспользуемые DTO контракта; \u003ccode>$ref\u003c/code> — ссылка на них\u003c/li>\n\u003cli>\u003ccode>required\u003c/code>/\u003ccode>minLength\u003c/code>/\u003ccode>format\u003c/code> — валидация, видимая потребителю заранее\u003c/li>\n\u003cli>Примеры (\u003ccode>example\u003c/code>) едут в документацию и тесты — заполняйте их всегда\u003c/li>\n\u003cli>Из спеки генерятся клиенты, заготовки сервера, Swagger UI и моки\u003c/li>\n\u003c/ul>\n\u003cp>Дальше — правила хорошего тона REST: как называть ресурсы, отдавать ошибки и версионировать API.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"В спеке у поля id указано format: int64, а у deadline — format: date и nullable: true. Что это сообщает потребителю?","options":["id — целое 64-битное число; deadline — дата, которая может отсутствовать","id и deadline обязательны всегда","deadline хранится в базе как DATE","id генерируется автоматически бэкендом"],"correct":0,"explanation":"Спека описывает контракт, а не хранение: format — тип формата данных по стандарту, nullable — «значения может не быть». Обязательность задаётся отдельно (required), автогенерация id из спеки не следует."},{"type":"single","codeLang":"yaml","code":"paths:\n  /api/tasks/{id}:\n    patch:\n      requestBody:\n        content:\n          application/json:\n            schema:\n              $ref: \"#/components/schemas/PatchTaskRequest\"\n      responses:\n        \"200\": { description: Обновлено }\n        \"404\": { description: Не найдено }\n","question":"Что не так с этим фрагментом спеки с точки зрения полноты договора?","options":["Не указано, что requestBody обязательно (required: true) — договор допускает PATCH без тела","YAML с отступами всё сломает","PATCH нельзя описывать в OpenAPI","Ссылка $ref ведёт на файл в интернете"],"correct":0,"explanation":"Без required: true тело формально опционально — и потребитель вправе отправить PATCH без него. Хороший договор двусмысленностей не допускает.","codeHtml":"\u003cspan class=\"hljs-attr\">paths:\u003c/span>\n  \u003cspan class=\"hljs-string\">/api/tasks/{id}:\u003c/span>\n    \u003cspan class=\"hljs-attr\">patch:\u003c/span>\n      \u003cspan class=\"hljs-attr\">requestBody:\u003c/span>\n        \u003cspan class=\"hljs-attr\">content:\u003c/span>\n          \u003cspan class=\"hljs-attr\">application/json:\u003c/span>\n            \u003cspan class=\"hljs-attr\">schema:\u003c/span>\n              \u003cspan class=\"hljs-string\">$ref:\u003c/span> \u003cspan class=\"hljs-string\">&quot;#/components/schemas/PatchTaskRequest&quot;\u003c/span>\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&quot;200&quot;:\u003c/span> { \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Обновлено\u003c/span> }\n        \u003cspan class=\"hljs-attr\">&quot;404&quot;:\u003c/span> { \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Не\u003c/span> \u003cspan class=\"hljs-string\">найдено\u003c/span> }\n"},{"type":"multi","question":"Зачем в схемах и ответах заполнять example? (несколько ответов)","options":["Swagger UI покажет живой пример — документация понятнее","QA использует примеры как согласованные тест-данные","Фронтендер пишет обработку ошибок по примерам, не спрашивая в чате","Примеры заменяют собой описание схем"],"correct":[0,1,2],"explanation":"Примеры — иллюстрации поверх формального описания, а не его замена. Схема остаётся источником правил, пример — образцом."},{"type":"match","question":"Сопоставь раздел спеки и его роль.","pairs":[{"left":"info","right":"Название, версия и описание API"},{"left":"paths","right":"Эндпоинты: методы, параметры, ответы"},{"left":"components/schemas","right":"Переиспользуемые структуры данных"},{"left":"servers","right":"Адреса, где живёт API"}]},{"type":"blank","question":"Каким ключевым словом ссылаются на переиспользуемую схему в другом месте спеки? (со значком $)","answers":["$ref"],"explanation":"$ref: \"#/components/schemas/Имя\" — ссылка на описанную схему. Описали один раз — используем во всех ответах и запросах."},{"type":"single","question":"Команда работает по API-First. Что появится раньше — Java-код контроллера или спека?","options":["Спека: её согласуют с потребителями, из неё сгенерят заготовки, код пишется под контракт","Код: спека генерируется из готового контроллера","Одновременно — это одно и то же","Зависит от дня недели"],"correct":0,"explanation":"В API-First источник правды — спека. Генерация спеки из кода — подход code-first с документацией; он не даёт ревью контракта до реализации."},{"type":"single","codeLang":"yaml","code":"CreateTaskRequest:\n  type: object\n  required: [title]\n  properties:\n    title:\n      type: string\n      minLength: 1\n","question":"Что произойдёт, если клиент отправит {\"title\": \"\"} против такой схемы?","options":["Запрос не соответствует контракту: пустой title нарушает minLength — сервер вправе ответить 400","Сервер обязан создать задачу с пустым названием","Спека автоматически подставит дефолтное значение","Ничего: minLength не влияет на валидацию"],"correct":0,"explanation":"minLength: 1 плюс required — правило контракта: пустая строка невалидна. В Spring то же правило выражается @NotBlank, и ответ — 400.","codeHtml":"\u003cspan class=\"hljs-attr\">CreateTaskRequest:\u003c/span>\n  \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">object\u003c/span>\n  \u003cspan class=\"hljs-attr\">required:\u003c/span> [\u003cspan class=\"hljs-string\">title\u003c/span>]\n  \u003cspan class=\"hljs-attr\">properties:\u003c/span>\n    \u003cspan class=\"hljs-attr\">title:\u003c/span>\n      \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n      \u003cspan class=\"hljs-attr\">minLength:\u003c/span> \u003cspan class=\"hljs-number\">1\u003c/span>\n"}]],"cases":[]},{"id":"m2-lesson-03","title":"REST-практики","module":2,"moduleTitle":"Проектирование API","order":3,"lab":null,"html":"\u003ch1>Урок 3. REST-практики: ресурсы, ошибки, версионирование\u003c/h1>\n\u003cp>Вы умеете описывать контракт. Теперь — правила хорошего тона: как называть ресурсы, как отдавать ошибки и как менять API, не подставляя потребителей. Эти правила не «буква стандарта», а выработанные сообществом привычки — следуя им, вы получаете предсказуемый API, который не надо объяснять каждому новичку.\u003c/p>\n\u003ch2>Ресурсный дизайн: существительные вместо глаголов\u003c/h2>\n\u003cp>REST строится вокруг \u003cstrong>ресурсов\u003c/strong> — сущностей, с которыми работают через пути. Путь — «что», HTTP-метод — «что сделать»:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Хорошо\u003c/th>\n\u003cth>Плохо\u003c/th>\n\u003cth>Почему\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/tasks\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>GET /api/getAllTasks\u003c/code>\u003c/td>\n\u003ctd>Метод уже говорит «получить»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/tasks\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>POST /api/createTask\u003c/code>\u003c/td>\n\u003ctd>POST = создать\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PATCH /api/tasks/42\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>POST /api/updateTask?id=42\u003c/code>\u003c/td>\n\u003ctd>PATCH = изменить\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DELETE /api/tasks/42\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>GET /api/deleteTask?id=42\u003c/code>\u003c/td>\n\u003ctd>DELETE = удалить; GET не меняет!\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Вложенность выражает принадлежность: \u003ccode>/api/projects/7/tasks\u003c/code> — задачи проекта 7. Глубже двух уровней обычно не опускаются.\u003c/p>\n\u003cp>\u003cstrong>А если действие — не CRUD?\u003c/strong> Бывают операции вне «создай-измени-удали»: «отправить на проверку», «отменить заказ». Два честных варианта:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>POST /api/orders/42/cancellations\u003c/code> — создайте «факт отмены» как ресурс (пуристично)\u003c/li>\n\u003cli>\u003ccode>POST /api/orders/42/cancel\u003c/code> — глагольный эндпоинт (прагматично, все поймут)\u003c/li>\n\u003c/ul>\n\u003cp>Главное — не прятать смену состояния в GET: «открой ссылку — заказ отменится» — путь к беде (краулеры, префетч браузера).\u003c/p>\n\u003ch2>Пагинация, фильтрация, сортировка\u003c/h2>\n\u003cp>Списки отдают порциями. Два основных способа:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>limit/offset\u003c/strong>: \u003ccode>GET /api/tasks?limit=20&amp;offset=40\u003c/code> — простые «страницы». Слабость: на живых данных элемент может «уехать» между страницами.\u003c/li>\n\u003cli>\u003cstrong>cursor\u003c/strong>: \u003ccode>GET /api/tasks?limit=20&amp;cursor=eyJpZCI6NDJ9\u003c/code> — «дай следующее после этого». Надёжнее для бесконечных лент, сложнее.\u003c/li>\n\u003c/ul>\n\u003cp>Фильтры и сортировка — query-параметрами: \u003ccode>?status=done&amp;assignee=ann&amp;sort=deadline,asc\u003c/code>. В спеке каждый параметр описан — и потребитель узнаёт о возможностях до первого запроса.\u003c/p>\n\u003ch2>Единый формат ошибок\u003c/h2>\n\u003cp>Плохой API на каждую ошибку отвечает по-разному. Хороший — в одном формате. Стандарт де-факто — \u003cstrong>RFC 7807 Problem Details\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;type&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;https://tasks.example.com/errors/validation&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Запрос не прошёл валидацию&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;status&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">400\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;detail&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;title: не должен быть пустым&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;instance&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;/api/projects/7/tasks&quot;\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Поля стабильны: \u003ccode>title\u003c/code> — что случилось (человеком), \u003ccode>detail\u003c/code> — подробности, \u003ccode>type\u003c/code> — ссылка на описание ошибки. В Spring Boot есть встроенная поддержка (ProblemDetail), а для бизнес-ошибок добавляют свой код: \u003ccode>&quot;code&quot;: &quot;TASK_ALREADY_DONE&quot;\u003c/code> — по нему фронт принимает решение, а не парсит текст.\u003c/p>\n\u003cp>Правило: \u003cstrong>машина — по коду/статусу, человек — по тексту\u003c/strong>. Никогда не завязывайтесь на \u003ccode>detail\u003c/code> как на контракт: это сообщение, оно может измениться.\u003c/p>\n\u003ch2>Идемпотентность: повторить без страха\u003c/h2>\n\u003cp>Запрос \u003cstrong>идемпотентен\u003c/strong>, если его повторение не меняет результат сверх первого выполнения:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>GET\u003c/code>, \u003ccode>PUT\u003c/code>, \u003ccode>DELETE\u003c/code> — идемпотентны (по духу): сколько ни повторяй — состояние то же\u003c/li>\n\u003cli>\u003ccode>POST\u003c/code> — нет: два одинаковых POST = два заказа\u003c/li>\n\u003c/ul>\n\u003cp>Проблема: сети падают, клиенты ретраят. Двойной POST «оформить заказ» — двойной платёж. Решения:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Идемпотентный ключ\u003c/strong>: клиент генерирует \u003ccode>Idempotency-Key: 7f3a...\u003c/code>, сервер запоминает: «этот ключ уже выполнял — верну тот же результат без повторного создания»\u003c/li>\n\u003cli>Дизайн API: \u003ccode>PUT /api/orders/{uuid}\u003c/code> (клиент придумал id заранее) вместо \u003ccode>POST /api/orders\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch2>Версионирование и обратная совместимость\u003c/h2>\n\u003cp>\u003cstrong>Обратно совместимое\u003c/strong> изменение — старые клиенты продолжают работать:\u003c/p>\n\u003cul>\n\u003cli>добавить новое поле в ответ ✓ (старый клиент его игнорирует)\u003c/li>\n\u003cli>добавить новый эндпоинт или необязательный параметр ✓\u003c/li>\n\u003cli>удалить поле, переименовать, изменить смысл ✗ (это breaking change)\u003c/li>\n\u003c/ul>\n\u003cp>Breaking changes unavoidable — тогда \u003cstrong>новая версия\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>в пути: \u003ccode>/api/v2/tasks\u003c/code> — просто и наглядно, стандарт де-факто\u003c/li>\n\u003cli>в заголовке: \u003ccode>Accept: application/vnd.tasks.v2+json\u003c/code> — чище идеологически, но менее заметен\u003c/li>\n\u003c/ul>\n\u003cp>Уходящая версия не выключается сразу: заголовок \u003ccode>Deprecation\u003c/code>/\u003ccode>Sunset\u003c/code>, письмо потребителям, период параллельной работы версий (месяцы!), мониторинг доли трафика на старой версии — выключаем, когда доля ≈ 0.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> обратная совместимость — это про ваш спокойный сон. Если бэкенд добавил поле — ваш код не сломается. Если переименовал без версии — упадёт в рантайме, возможно, только в одном rarely-используемом экране. Сгенерированный из спеки клиент ловит такие вещи на этапе компиляции.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> проверяйте не только «работает», но и совместимость: старый клиент против нового бэкенда — отдельный класс тестов. Идентичные повторные запросы (идемпотентность) — тоже ваш кейс: ретраи в проде будут.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> deprecation — это управляемое изменение, у которого есть владелец, срок и метрика доли старой версии. Когда просите «убрать поле» — уточняйте план переезда потребителей: это проект, а не коммит.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Ресурсы — существительные; действие — HTTP-метод; смену состояния не прячьте в GET\u003c/li>\n\u003cli>Списки — с пагинацией; фильтры и сортировка — query-параметры, описанные в спеке\u003c/li>\n\u003cli>Ошибки — единый формат (Problem Details): машина — по статусу и коду, человек — по тексту\u003c/li>\n\u003cli>POST не идемпотентен: идемпотентные ключи или клиентские uuid для критичных операций\u003c/li>\n\u003cli>Добавлять поля можно, удалять — только через новую версию с периодом deprecation\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — GraphQL: стиль API, где клиент сам говорит, какие поля ему нужны.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Продакт просит эндпоинт «закрыть все выполненные задачи квартала». Какой вариант лучше остальных?","options":["POST /api/projects/7/tasks:close-completed — массовая операция вне CRUD, глагол в подпути, состояние меняет только POST","GET /api/closeCompletedTasks?quarter=Q3 — короче и быстрее","DELETE /api/tasks?quarter=Q3 — закрытие похоже на удаление","PATCH /api/tasks — и пусть клиент сам перебирает задачи циклом"],"correct":0,"explanation":"Массовая операция — законный случай глагольного эндпоинта под POST. GET не должен менять состояние; перебор клиентом — N запросов и гонки вместо одной атомарной операции."},{"type":"multi","question":"Какие изменения API обратно совместимы? (несколько ответов)","options":["Новое необязательное поле в ответе","Новый эндпоинт","Переименование поля name в fullName","Новое необязательное query-параметр фильтрации"],"correct":[0,1,3],"explanation":"Старые клиенты игнорируют новые поля, параметры и эндпоинты. Переименование ломает всех, кто читал поле — это breaking change, требующий версии и deprecation."},{"type":"single","codeLang":"json","code":"{\n  \"status\": 400,\n  \"title\": \"Запрос не прошёл валидацию\",\n  \"detail\": \"title: не должен быть пустым\",\n  \"code\": \"VALIDATION_ERROR\"\n}\n","question":"По какому полю фронту стоит принимать решение «показать красное поле с текстом»?","options":["По code (и status) — стабильным машинным признакам","По detail — там человекочитаемое объяснение","По title — он короче","По порядку полей в JSON"],"correct":0,"explanation":"detail и title — тексты для людей, их формулировки меняются без предупреждения. Стабильный контракт для логики — статус и машинный код ошибки.","codeHtml":"\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;status&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">400\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Запрос не прошёл валидацию&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;detail&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;title: не должен быть пустым&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;code&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;VALIDATION_ERROR&quot;\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n"},{"type":"blank","question":"Как называется свойство запроса, когда его повторное выполнение не меняет результат сверх первого раза?","answers":["идемпотентность","идемпотентность"],"correct":0,"explanation":"Идемпотентность. GET/PUT/DELETE идемпотентны по духу, POST — нет; для критичных POST-операций вводят идемпотентные ключи."},{"type":"match","question":"Сопоставь требование и правильный дизайн эндпоинта.","pairs":[{"left":"Список задач со 2-й страницы по 20 штук","right":"GET /api/tasks?limit=20&offset=20"},{"left":"Создать задачу","right":"POST /api/tasks с телом запроса"},{"left":"Отметить задачу выполненной","right":"PATCH /api/tasks/42 с {\"done\":true}"},{"left":"Убрать задачу","right":"DELETE /api/tasks/42"}]},{"type":"single","question":"Команда перешла на /api/v2/tasks. Когда можно выключить /api/v1/tasks?","options":["Когда мониторинг покажет, что доля трафика на v1 практически нулевая, и потребители предупреждены","Сразу после релиза v2 — пусть переезжают","Через неделю — хватит всем","Никогда: v1 должна жить вечно"],"correct":0,"explanation":"Deprecation — управляемый процесс: предупреждение, переходный период, метрика реального использования. Чуть-чуть трафика на v1 может значить «забытый cron, который уронит прод»."},{"type":"single","question":"Клиент шлёт POST /api/payments, сеть падает на ответе, клиент ретраит — платёж проходит дважды. Что поможет?","options":["Идемпотентный ключ: клиент генерирует его один раз на операцию, сервер при повторе возвращает результат первого выполнения","Перейти на GET /api/payments","Увеличить таймаут на клиенте","Ничего: двойные платежи неизбежны"],"correct":0,"explanation":"Idempotency-Key — стандартное решение: сервер запоминает результат по ключу и на повтор отвечает тем же, не создавая второй платёж. GET для платежей — смена состояния через GET, запрещённый приём."}]],"cases":[]},{"id":"m2-lesson-04","title":"GraphQL","module":2,"moduleTitle":"Проектирование API","order":4,"lab":{"title":"Лаба 4. GraphQL","description":"Обслужить готовую GraphQL-схему задачника: @QueryMapping и @MutationMapping над готовым хранилищем. Проверка — 6 запросов-тестов и песочница GraphiQL.","branch":"lab-4","branchSolution":"lab-4-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 4. GraphQL: API, где клиент заказывает данные\u003c/h1>\n\u003cp>REST-контракт жёсток: сервер решил, какие поля отдать, — клиент получает их все. Обычно это ок. Но у фронтенда бывают экраны, где REST либо отдаёт лишнее, либо требует нескольких запросов. На этот случай есть другой стиль — GraphQL.\u003c/p>\n\u003ch2>Две боли REST\u003c/h2>\n\u003cp>\u003cstrong>Over-fetching (лишние данные).\u003c/strong> Экрану «список задач» нужно только \u003ccode>title\u003c/code> и \u003ccode>done\u003c/code>, а \u003ccode>GET /api/tasks\u003c/code> отдаёт ещё описание, автора, историю, вложения — тянет из базы, сериализует, гонит по сети.\u003c/p>\n\u003cp>\u003cstrong>Under-fetching (мало данных).\u003c/strong> Список задач получили. Теперь для каждой — имя проекта: \u003ccode>GET /api/projects/7\u003c/code>, \u003ccode>GET /api/projects/8\u003c/code>… Классический \u003cstrong>N+1\u003c/strong>: 1 запрос за списком + N запросов за деталями.\u003c/p>\n\u003cp>GraphQL отвечает на обе боли одним приёмом: клиент описывает в запросе, какие именно поля ему нужны.\u003c/p>\n\u003ch2>Схема и запрос\u003c/h2>\n\u003cp>Сначала сервер описывает \u003cstrong>схему\u003c/strong> — какие типы и поля существуют (файл \u003ccode>schema.graphqls\u003c/code> в Spring-проекте):\u003c/p>\n\u003cpre>\u003ccode class=\"language-graphql\">\u003cspan class=\"hljs-keyword\">type\u003c/span> Task \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    \u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> ID\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    \u003cspan class=\"hljs-symbol\">title\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> String\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    \u003cspan class=\"hljs-symbol\">done\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Boolean\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    \u003cspan class=\"hljs-symbol\">deadline\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> String\n    \u003cspan class=\"hljs-symbol\">project\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Project\u003cspan class=\"hljs-punctuation\">!\u003c/span>          \u003cspan class=\"hljs-comment\"># вложенный объект!\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\n\u003cspan class=\"hljs-keyword\">type\u003c/span> Project \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    \u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> ID\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    \u003cspan class=\"hljs-symbol\">name\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> String\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\n\u003cspan class=\"hljs-keyword\">type\u003c/span> \u003cspan class=\"hljs-keyword\">Query\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    tasks\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">done\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Boolean\u003cspan class=\"hljs-punctuation\">)\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">[\u003c/span>Task\u003cspan class=\"hljs-punctuation\">!\u003c/span>\u003cspan class=\"hljs-punctuation\">]\u003c/span>\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    task\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> ID\u003cspan class=\"hljs-punctuation\">!\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Task\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>!\u003c/code> — «не null». \u003ccode>[Task!]!\u003c/code> — «список не-null задач, сам список тоже не null». Читается как типы в TS.\u003c/p>\n\u003cp>Клиент отправляет \u003cstrong>запрос\u003c/strong> — заказывает ровно то, что нужно экрану:\u003c/p>\n\u003cpre>\u003ccode class=\"language-graphql\">\u003cspan class=\"hljs-keyword\">query\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    tasks\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">done\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n        title\n        done\n        project \u003cspan class=\"hljs-punctuation\">{\u003c/span> name \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n    \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>И получает \u003cstrong>ровно это\u003c/strong> — ни полем больше:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;data&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    \u003cspan class=\"hljs-attr\">&quot;tasks&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">[\u003c/span>\n      \u003cspan class=\"hljs-punctuation\">{\u003c/span> \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Купить молоко&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;done&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-literal\">\u003cspan class=\"hljs-keyword\">false\u003c/span>\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;project&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span> \u003cspan class=\"hljs-attr\">&quot;name&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Дом&quot;\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n      \u003cspan class=\"hljs-punctuation\">{\u003c/span> \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Ревью PR&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;done&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-literal\">\u003cspan class=\"hljs-keyword\">false\u003c/span>\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;project&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span> \u003cspan class=\"hljs-attr\">&quot;name&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Работа&quot;\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n    \u003cspan class=\"hljs-punctuation\">]\u003c/span>\n  \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Один эндпоинт (\u003ccode>POST /graphql\u003c/code>), один запрос,
