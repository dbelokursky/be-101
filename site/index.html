003ccode>Order\u003c/code> — это \u003cstrong>entity\u003c/strong>: Java-класс, отображённый на таблицу:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Entity\u003c/span>\n\u003cspan class=\"hljs-meta\">@Table(name = &quot;orders&quot;)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Builder\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Order\u003c/span> {\n    \u003cspan class=\"hljs-meta\">@Id\u003c/span> \u003cspan class=\"hljs-meta\">@GeneratedValue(strategy = GenerationType.IDENTITY)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long id;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long customerId;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String status;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> BigDecimal amount;\n}\n\u003c/code>\u003c/pre>\n\u003cp>Это и есть \u003cstrong>Hibernate/JPA\u003c/strong>: аннотациями мы говорим «класс = таблица, поле = колонка», а фреймворк переводит объекты в SQL-запросы и обратно. В лабах база — H2, in-memory: поднялась с приложением, умерла с ним. Боевая СУБД (PostgreSQL) — тот же код, другой \u003ccode>datasource.url\u003c/code> в конфиге.\u003c/p>\n\u003cp>Схема таблиц меняется не «руками в базе», а \u003cstrong>миграциями\u003c/strong> (Liquibase): файл в репо = шаг изменения схемы, применяется автоматически при старте.\u003c/p>\n\u003cp>Вся картина вместе:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart TD\n    C[&quot;Клиент&quot;] --&gt;|&quot;HTTP + JSON&quot;| K[&quot;Контроллер&lt;br/&gt;(DTO, валидация)&quot;]\n    K --&gt; S[&quot;Сервис&lt;br/&gt;(бизнес-логика, @Transactional)&quot;]\n    S --&gt; M[&quot;MapStruct&lt;br/&gt;entity ↔ DTO&quot;]\n    S --&gt; R[&quot;Репозиторий&lt;br/&gt;(JpaRepository)&quot;]\n    R --&gt; DB[(&quot;База данных&lt;br/&gt;(H2 / PostgreSQL)&quot;]\n    S --&gt; P[&quot;KafkaTemplate&lt;br/&gt;(публикация событий)&quot;]\n    P --&gt; T[&quot;Kafka: topic orders.created&quot;]\n    T --&gt; N[&quot;Другие сервисы:&lt;br/&gt;уведомления, аналитика&quot;]\u003c/div>\u003ch2>Куда встаивает Kafka\u003c/h2>\n\u003cp>HTTP хорош, когда caller'у нужен ответ \u003cem>сейчас\u003c/em>. Но часть работы — фоновая: отправить письмо, посчитать аналитику, синхронизовать поиск. Держать запрос пользователя пока отправляется письмо — расточительно.\u003c/p>\n\u003cp>Паттерн: сервис сделал свою работу → опубликовал \u003cstrong>событие\u003c/strong> в Kafka → пошёл дальше. Кто хотел — прочитал и отработал:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(order.getId()));\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant O as order-service\n    participant K as Kafka (topic orders.created)\n    participant N as notification-service\n    O-&gt;&gt;O: сохранил заказ (транзакция)\n    O-&gt;&gt;K: опубликовал OrderCreatedEvent\n    O--&gt;&gt;Клиенту: 201 Created (не ждёт писем!)\n    K-&gt;&gt;N: событие доставлено консюмеру\n    N-&gt;&gt;N: отправил письмо\u003c/div>\u003cp>Ключевые слова: \u003cstrong>продюсер\u003c/strong> публикует, \u003cstrong>консюмер\u003c/strong> подписан, \u003cstrong>topic\u003c/strong> — именованный канал событий. События в Kafka сохраняются и могут быть перечитаны — этим она отличается от «просто почтового ящика». Вглубь — в отдельном модуле.\u003c/p>\n\u003ch2>Наблюдаемость: Actuator и Micrometer\u003c/h2>\n\u003cp>Сервис в проде — как самолёт: нужно, чтобы он сам сообщал о своём состоянии. В Spring Boot за это отвечают два инструмента.\u003c/p>\n\u003cp>\u003cstrong>Actuator\u003c/strong> — встроенные эксплуатационные endpoints:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Endpoint\u003c/th>\n\u003cth>Что показывает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/health\u003c/code>\u003c/td>\n\u003ctd>Жив ли сервис: \u003ccode>{&quot;status&quot;: &quot;UP&quot;}\u003c/code>; включает проверки базы, Kafka и др.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/metrics\u003c/code>\u003c/td>\n\u003ctd>Числовые метрики: память, время ответов, счётчики\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/actuator/info\u003c/code>\u003c/td>\n\u003ctd>Информация о сборке\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>/actuator/health\u003c/code> — рабочая лошадка деплоя: балансировщик и Kubernetes-пробы опрашивают его и решают, направлять ли трафик на инстанс или перезапустить его.\u003c/p>\n\u003cp>\u003cstrong>Micrometer\u003c/strong> — «фасад метрик»: единый API для счётчиков и таймеров, который экспортирует данные в системы мониторинга (Prometheus и другие). Один раз написали метрику — увидели её на дашборде команды:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Counter\u003c/span> \u003cspan class=\"hljs-variable\">created\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> meterRegistry.counter(\u003cspan class=\"hljs-string\">&quot;orders.created.total&quot;\u003c/span>);\ncreated.increment();     \u003cspan class=\"hljs-comment\">// +1 заказ — график на дашборде пополз вверх\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> \u003ccode>/actuator/health\u003c/code> — ваш первый инструмент при «а сервис вообще жив?»: UP/DOWN и причина, без доступа к серверу. А метрики — готовые данные для проверки нечерного-box поведения.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> события Kafka (\u003ccode>orders.created\u003c/code>) и метрики (\u003ccode>orders.created.total\u003c/code>) — это то, из чего строятся продуктовые дашборды в реальном времени. Требование «видеть конверсию заказов онлайн» — это требование к событию и метрике.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Сервис держит бизнес-правила; \u003ccode>@Transactional\u003c/code> даёт «всё или ничего»\u003c/li>\n\u003cli>Репозиторий — интерфейс: Spring Data генерирует SQL; entity = таблица, миграции — через Liquibase\u003c/li>\n\u003cli>Kafka: опубликовал событие → пошёл дальше; фоновые потребители дочитают\u003c/li>\n\u003cli>Actuator даёт \u003ccode>/actuator/health\u003c/code> и метрики; Micrometer — единый API для дашбордов\u003c/li>\n\u003c/ul>\n\u003cp>Пилот собран: вы прошли путь от HTTP-запроса до живого сервиса со слоями, базой, событиями и метриками. Дальше — экзамен и кейс, проверяющие весь модуль целиком.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","codeLang":"java","code":"public interface OrderRepository extends JpaRepository\u003cOrder, Long> {\n    List\u003cOrder> findByCustomerIdAndStatus(Long customerId, String status);\n}\n","question":"Что верно про этот репозиторий?","options":["Spring Data сам сгенерирует реализацию и SQL по имени метода — писать нечего","Это нерабочий код: у интерфейса нет реализации","Метод нужно вручную реализовать в классе OrderRepositoryImpl","Метод сработает только если написать SQL в аннотации"],"correct":0,"explanation":"JpaRepository даёт готовые save/findById/deleteById, а по имени findByCustomerIdAndStatus Spring Data выводит WHERE customer_id = ? AND status = ?. Реализация генерируется при старте приложения.","codeHtml":"\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">OrderRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Order, Long&gt; {\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-title function_\">findByCustomerIdAndStatus\u003c/span>\u003cspan class=\"hljs-params\">(Long customerId, String status)\u003c/span>;\n}\n"},{"type":"single","question":"Метод сервиса помечен @Transactional. Что это гарантирует?","options":["Либо все записи в базу внутри метода применятся, либо ни одна","Метод выполнится быстрее — в отдельном потоке","Ответ метода всегда со статусом 200","Метод нельзя вызвать дважды одновременно"],"correct":0,"explanation":"Транзакция = атомарность: ошибка на середине откатывает всё сделанное ранее в методе. Половина заказа не сохранится никогда. Про потоки и статусы аннотация ничего не обещает."},{"type":"match","question":"Сопоставь понятие и его смысл.","pairs":[{"left":"Entity","right":"Java-класс, отображённый на таблицу"},{"left":"Kafka topic","right":"Именованный канал событий"},{"left":"@Service","right":"Слой бизнес-правил"},{"left":"Liquibase","right":"Версионирование схемы базы миграциями"}]},{"type":"multi","question":"Какие утверждения про Kafka в этой архитектуре верны? (несколько ответов)","options":["Продюсер публикует событие в topic и не ждёт фоновой обработки","Консюмеры подписываются на topic и обрабатывают события сами","Kafka заменяет базу данных: заказы хранятся только в topic","Тяжёлую фоновую работу выносят в консюмеры, чтобы API отвечал быстро"],"correct":[0,1,3],"explanation":"Kafka — транспорт и буфер событий, а не хранилище записей заказа: источником правды остаётся база. Остальное — суть паттерна: событие опубликовано, фоновые потребители отработали в своём темпе."},{"type":"blank","question":"Какой endpoint Actuator'а возвращает статус живости сервиса (UP/DOWN)? Ответ начни с /actuator/","answers":["/actuator/health"],"explanation":"GET /actuator/health — стандартная точка проверки: её опрашивают балансировщики и Kubernetes-пробы, чтобы решать, жив ли инстанс."},{"type":"single","question":"Мониторинг показывает: /actuator/health отвечает {\"status\": \"DOWN\", \"components\": {\"db\": {\"status\": \"DOWN\"}}}. Что случилось?","options":["Сервис работает, но не может подключиться к базе данных — трафик на него направлять нельзя","Упало всё приложение: процесс мёртв, health отвечает последний раз","Ничего страшного: DOWN бывает при обновлении схемы базы","Ошибка в коде контроллера: вернуть 500 клиенту"],"correct":0,"explanation":"Health-проверка сама жива (она ответила!) и сообщает причину: база недоступна. Приложение поднимают заново, только если падает liveness-проба, а здесь задача — чинить подключение к БД."},{"type":"single","question":"Зачем в проекте Micrometer, если метрики можно писать в логи?","options":["Micrometer — единый API метрик (счётчики, таймеры) с экспортом в системы мониторинга и дашборды","Micrometer заменяет логирование: логи больше не нужны","Micrometer ускоряет работу базы данных","Это требование Spring Boot: без него приложение не стартует"],"correct":0,"explanation":"Метрики — это числа с именами и тегами, которые должны попасть в Prometheus/графики, а не в текст логов. Micrometer даёт один API и разные экспорты; логи при этом остаются для другого — контекста происшествий."}]],"cases":[]},{"id":"module-1-exam","title":"Экзамен модуля и кейс","module":1,"order":6,"lab":null,"html":"\u003ch1>Экзамен модуля «Spring Boot: бэкенд с нуля»\u003c/h1>\n\u003cp>Вы прошли пять уроков: HTTP, устройство сервиса, Java-шпаргалка, REST-контроллер, слои с Kafka и наблюдаемостью. Финальная проверка — в двух частях:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Кейс\u003c/strong> — спроектировать API своими словами (сначала пишете своё решение, потом сверяетесь с эталоном)\u003c/li>\n\u003cli>\u003cstrong>Экзамен\u003c/strong> — 18 вопросов по всему модулю, порог 80%, пересдача не ограничена\u003c/li>\n\u003c/ol>\n\u003cp>Сначала кейс, потом экзамен. Поехали.\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Запрос GET /api/users?page=2 пришёл на сервер. Что такое page=2?","options":["Query-параметр: просит вторую страницу списка пользователей","Часть пути: обращение к ресурсу users/2","Заголовок запроса","Тело запроса"],"correct":0,"explanation":"Всё после ? — query-параметры: фильтры, пагинация, сортировка. Они не меняют «какой ресурс», а уточняют «какую его часть»."},{"type":"single","question":"Сервер вернул 403 Forbidden. Что это значит по сравнению с 401 Unauthorized?","options":["Сервер понял, кто вы, но этому роли действие запрещено","Токен не приложен или истёк — сервер не знает, кто вы","Такого ресурса не существует","Сервер перегружен, попробуйте позже"],"correct":0,"explanation":"401 — «не знаю, кто ты» (нет/невалиден токен), 403 — «знаю, но нельзя» (нет прав). 404 — «ресурса нет», перегрузка — это 5xx (например, 503)."},{"type":"multi","question":"Какие утверждения о статус-кодах верны? (несколько ответов)","options":["204 — успешный ответ без тела","4xx — класс ошибок на стороне клиента","301 и 404 — это одно и то же: ресурс не найден","500 — ошибка на стороне сервера"],"correct":[0,1,3],"explanation":"301 — редирект (ресурс переехал, вот новый адрес), а не «не найдено». Остальное — прямая расшифровка классов."},{"type":"single","codeLang":"http","code":"HTTP/1.1 204 No Content\n","question":"Клиент отправил DELETE /api/tasks/7 и получил такой ответ. Как оценишь результат?","options":["Успех: задача удалена, тела ответа не требуется","Ошибка: сервер не понял, что удалять","Ошибка: задача не найдена","Частичный успех: удаление произойдёт позже"],"correct":0,"explanation":"204 — успех без тела. Удалённому ресурсу нечего возвращать. Ошибки здесь были бы 404 (нет такой) или 500 (сломалось).","codeHtml":"\u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span> \u003cspan class=\"hljs-number\">204\u003c/span> No Content\n"},{"type":"blank","question":"Какой заголовок ответа сообщает клиенту, что тело — это JSON? (формат: Имя-Заголовка, как он пишется в HTTP)","answers":["Content-Type"],"correct_note":"","explanation":"Content-Type: application/json. Он есть и в запросе, и в ответе — всегда описывает формат именно тела."},{"type":"single","question":"Требование гласит: «email в заказе обязателен, максимум один @». Где это правило должно сработать первым?","options":["В контроллере — на валидации входных данных, до бизнес-логики","В сервисном слое — это бизнес-правило","В репозитории — при сохранении в базу","В Kafka — при публикации события"],"correct":0,"explanation":"Формат и обязательность поля — валидация входа, зона контроллера: кривой запрос не должен попадать в сервис. Бизнес-правила («скидка не больше 50%») — сервис. Грубая проверка на уровне БД (not null) — страховка, не замена."},{"type":"match","question":"Сопоставь симптом и слой, где ищем причину.","pairs":[{"left":"400: «поле title обязательно»","right":"Контроллер / валидация"},{"left":"200 OK, но сумма заказа посчитана неверно","right":"Сервисный слой"},{"left":"500, в логе ошибка SQL","right":"Репозиторий / база"},{"left":"Приложение не стартует: порт уже занят","right":"Конфигурация"}]},{"type":"single","question":"Почему пароль от базы не хранят в application.yml в git?","options":["Секреты передают через переменные окружения или секрет-хранилище — файл в git видит вся команда и история навсегда","YAML не поддерживает пароли","Spring запрещает секреты в конфигах","Пароль нужен только тестам, прод работает без него"],"correct":0,"explanation":"Git-история неистребима: попал секрет в коммит — считай, утёк. Поэтому секреты — в переменных окружения (или Vault-подобных хранилищах), а в конфиге — только ссылки на них."},{"type":"single","codeLang":"java","code":"Optional\u003cOrder> order = orderRepository.findByNumber(\"A-42\");\nOrder result = order.orElseThrow(() -> new OrderNotFoundException(\"A-42\"));\n","question":"Заказа A-42 в базе нет. Что произойдёт при выполнении второй строки?","options":["Выбросится OrderNotFoundException — его обработает глобальный обработчик и вернёт клиенту 404","result станет null, программа продолжится","Вернётся пустой заказ со статусом NOT_FOUND","Компилятор запретит такой код"],"correct":0,"explanation":"orElseThrow на пустом Optional бросает исключение-поставщика. В Spring его перехватит @ExceptionHandler/статус-аннотация и клиент получит осмысленный 404. null тут не появится никогда.","codeHtml":"\u003cspan class=\"hljs-type\">Optional\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderRepository.findByNumber(\u003cspan class=\"hljs-string\">&quot;A-42&quot;\u003c/span>);\n\u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">result\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> order.orElseThrow(() -&gt; \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderNotFoundException\u003c/span>(\u003cspan class=\"hljs-string\">&quot;A-42&quot;\u003c/span>));\n"},{"type":"single","codeLang":"java","code":"@Getter @Builder\npublic class CreateOrderRequest {\n    private final String customer;\n    private final BigDecimal amount;\n}\n\n// использование:\nCreateOrderRequest req = CreateOrderRequest.builder()\n    .customer(\"ann\")\n    .amount(new BigDecimal(\"990\"))\n    .build();\n","question":"Что делает builder()…build() в этом коде?","options":["Собирает объект CreateOrderRequest, сгенерированный Lombok, задавая поля по цепочке","Создаёт SQL-запрос INSERT","Отправляет запрос в Kafka","Валидирует customer и amount по аннотациям @Valid"],"correct":0,"explanation":"@Builder (Lombok) генерирует фабрику-строитель: поля задаются по имени, imмутабельно и читабельно. Это альтернатива конструктора с десятью аргументами.","codeHtml":"\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Builder\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">CreateOrderRequest\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> String customer;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> BigDecimal amount;\n}\n\n\u003cspan class=\"hljs-comment\">// использование:\u003c/span>\n\u003cspan class=\"hljs-type\">CreateOrderRequest\u003c/span> \u003cspan class=\"hljs-variable\">req\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> CreateOrderRequest.builder()\n    .customer(\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>)\n    .amount(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;990&quot;\u003c/span>))\n    .build();\n"},{"type":"single","question":"Клиент отправил POST /api/tasks с телом, где вместо JSON — сломанный текст. Что ответит Spring Boot-контроллер с @RequestBody?","options":["400 Bad Request — тело не разобрать","201 Created с пустой задачей","500 — ошибка на стороне сервера","404 — такого эндпоинта нет"],"correct":0,"explanation":"Неразборчивое тело — вина клиента: 400. Эндпоинт существует (иначе 404), а серверная ошибка была бы, если бы сломался сам код обработки."},{"type":"multi","question":"Что входит в обязанности контроллера? (несколько ответов)","options":["Принять запрос и разобрать параметры/тело","Провалидировать входные данные","Вызвать сервисный слой и сформировать ответ/статус","Хранить бизнес-правила и считать скидки"],"correct":[0,1,2],"explanation":"Контроллер — «переводчик» HTTP ↔ Java: принять, проверить, делегировать, ответить. Правила и расчёты — зона сервиса: иначе слой перестаёт быть тонким."},{"type":"single","question":"Команда работает по API-First, и фронтендер спрашивает, каким будет ответ создания заказа. Что показать?","options":["Контракт OpenAPI — источник правды, код и клиенты генерируются из него","Java-класс OrderResponse — фронт разберётся","Скриншот рабочего ответа из Postman","Таблицу из базы данных orders"],"correct":0,"explanation":"В API-First источник правды — контракт. Скриншот и класс — следствия; таблица БД вообще не контракт API."},{"type":"single","codeLang":"java","code":"public interface TaskRepository extends JpaRepository\u003cTask, Long> {\n    List\u003cTask> findByProjectIdAndDone(Long projectId, boolean done);\n}\n","question":"Какой запрос сгенерирует Spring Data для этого метода?","options":["SELECT ... WHERE project_id = ? AND done = ?","SELECT ... WHERE id = ?","Метод не сработает: нужен @Query с SQL","UPDATE ... SET done = ?"],"correct":0,"explanation":"Имя метода разбирается по camelCase: findBy → SELECT, ProjectIdAndDone → условия WHERE. SQL вручную нужен только для сложных случаев.","codeHtml":"\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">TaskRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Task, Long&gt; {\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-title function_\">findByProjectIdAndDone\u003c/span>\u003cspan class=\"hljs-params\">(Long projectId, \u003cspan class=\"hljs-type\">boolean\u003c/span> done)\u003c/span>;\n}\n"},{"type":"single","question":"Внутри @Transactional-метода сервис сохранил заказ, потом упал на отправке чека. Что увидит база?","options":["Ничего: транзакция откатилась, заказа нет","Заказ сохранился, чек просто не ушёл","Заказ сохранился с флагом «без чека»","База заблокируется до перезапуска"],"correct":0,"explanation":"@Transactional — атомарность: исключение внутри откатывает все изменения метода. «Полусделанных» состояний не бывает — в этом смысл."},{"type":"single","question":"Почему после создания заказа API не ждёт отправки письма, а публикует событие в Kafka?","options":["Ответ клиенту не должен блокироваться фоновыми задачами — их доотработают подписчики","Kafka отправляет письма сама и быстрее SMTP","Без Kafka заказ не сохранится в базу","Так писали раньше, новая версия Spring требует"],"correct":0,"explanation":"Паттерн: сделал основное → опубликовал событие → ответил 201. Медленные задачи (письма, аналитика) — у консюмеров. Kafka не отправляет письма и не заменяет базу — она развязывает участников по времени."},{"type":"single","question":"Дашборд показывает: /actuator/health = UP, но компонент db = DOWN. Какое действие правильное?","options":["Трафик на инстанс не направлять и разбираться с подключением к базе","Пересобрать фронтенд — у него ошибка","Ничего: общий статус UP — значит всё хорошо","Удалить метрики компонента db из health"],"correct":0,"explanation":"Составной health падает по самому больному компоненту: база недоступна — сервис фактически неработоспособен. Прячут проблему не удалением метрики, а починкой подключения."},{"type":"blank","question":"Как называется Java-класс, помеченный @Entity и отображённый на таблицу базы данных? (одно слово)","answers":["entity","сущность"],"explanation":"Entity (сущность) — «таблица, живущая как объект»: @Id — первичный ключ, поля — колонки. Hibernate переводит entity в SQL и обратно."}]],"cases":[{"title":"Спроектируй API для списка задач","task":"Команда хочет внутренний таск-трекер. Известно: есть проекты; в проекте — задачи; у задачи — название, дедлайн и признак «сделано». Фронтендер просит: «скажи, что вызывать». Опиши API: какие endpoints (метод + путь), какие статусы ждать, как выглядят основные DTO. Форма свободная — как писали бы в чате команды. Подсказка: вспомните урок 1 (методы и статусы) и урок 4 (DTO и коды создания).","placeholder":"Например:\nGET /api/projects — список проектов\nPOST /api/tasks — создать задачу, 201 + ...","referenceHtml":"\u003cp>Один из возможных ответов (не единственно верный — важна логика).\u003c/p>\n\u003ch2>Endpoints\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Метод и путь\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003cth>Успех\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/projects\u003c/code>\u003c/td>\n\u003ctd>Список проектов\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code> + \u003ccode>[{id, title}]\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/projects\u003c/code>\u003c/td>\n\u003ctd>Создать проект\u003c/td>\n\u003ctd>\u003ccode>201\u003c/code> + \u003ccode>Location: /api/projects/{id}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/projects/{id}/tasks\u003c/code>\u003c/td>\n\u003ctd>Задачи проекта (можно фильтр \u003ccode>?status=done\u003c/code>)\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code> + список\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/projects/{id}/tasks\u003c/code>\u003c/td>\n\u003ctd>Создать задачу в проекте\u003c/td>\n\u003ctd>\u003ccode>201\u003c/code> + \u003ccode>Location\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PATCH /api/tasks/{id}\u003c/code>\u003c/td>\n\u003ctd>Частичное изменение: «сделано», дедлайн\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DELETE /api/tasks/{id}\u003c/code>\u003c/td>\n\u003ctd>Удалить задачу\u003c/td>\n\u003ctd>\u003ccode>204\u003c/code> (без тела)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Ключевые решения\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>PATCH, а не PUT\u003c/strong> для «сделано»: меняем одно поле, а не всю задачу целиком.\u003c/li>\n\u003cli>\u003cstrong>201 + Location\u003c/strong> при создании — сервер говорит, где лежит новое (урок 1).\u003c/li>\n\u003cli>\u003cstrong>204 без тела\u003c/strong> при удалении — удалять больше нечего, рассказывать нечего.\u003c/li>\n\u003cli>Ошибки: \u003ccode>400\u003c/code> — кривой JSON/валидация, \u003ccode>404\u003c/code> — проекта или задачи нет.\u003c/li>\n\u003c/ul>\n\u003ch2>DTO\u003c/h2>\n\u003cpre>\u003ccode>record TaskResponse(Long id, String title, LocalDate deadline, boolean done)\nrecord CreateTaskRequest(String title, LocalDate deadline)\n\u003c/code>\u003c/pre>\n\u003cp>Внутри — entity \u003ccode>Task\u003c/code> с \u003ccode>@Entity\u003c/code>; наружу — DTO без лишних полей (урок 4). Между ними — MapStruct.\u003c/p>\n\u003ch2>Продвинутый уровень (не обязателен)\u003c/h2>\n\u003cp>Пометка «сделано» — событие \u003ccode>tasks.completed\u003c/code> в Kafka: уведомления и статистика дочитают сами, а API не ждёт рассылки писем (урок 5). Метрику \u003ccode>tasks.completed.total\u003c/code> через Micrometer — и на дашборд.\u003c/p>\n"}]}]};
</script>
<script>
/* BE-101 course engine: роутинг, прогресс, квиз-движок. Ванильный JS, без зависимостей. */
(function () {
  'use strict';

  var LESSONS = (window.BE101 && window.BE101.lessons) || [];
  var STORE_KEY = 'be101.progress.v1';
  var PASS_RATIO = 0.8; // порог сдачи квиза: 80%+

  // ---------- утилиты ----------

  function el(tag, cls, html) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html !== undefined) node.innerHTML = html;
    return node;
  }
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function normalizeText(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ');
  }

  // ---------- прогресс (localStorage) ----------
  // { lessonId: { quizPassed: {slotIndex: true}, labDone: bool } }

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var p = raw ? JSON.parse(raw) : {};
      return p && typeof p === 'object' ? p : {};
    } catch (_) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (_) {}
  }
  function getLessonProgress(id) {
    var p = loadProgress();
    var lp = p[id];
    if (!lp || typeof lp !== 'object') lp = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!lp.quizPassed) lp.quizPassed = {};
    if (!lp.caseDone) lp.caseDone = {};
    return lp;
  }
  function setQuizPassed(lessonId, slot, passed) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!p[lessonId].quizPassed) p[lessonId].quizPassed = {};
    p[lessonId].quizPassed[slot] = passed;
    saveProgress(p);
  }
  function setCaseDone(lessonId, slot, done) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!p[lessonId].caseDone) p[lessonId].caseDone = {};
    p[lessonId].caseDone[slot] = done;
    saveProgress(p);
  }
  function setLabDone(lessonId, done) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    p[lessonId].labDone = done;
    saveProgress(p);
  }

  function lessonUnits(l) { return l.quizzes.length + l.cases.length + (l.lab ? 1 : 0); }
  function lessonDoneUnits(l) {
    var lp = getLessonProgress(l.id);
    var q = 0, i;
    for (i = 0; i < l.quizzes.length; i++) if (lp.quizPassed[i]) q++;
    for (i = 0; i < l.cases.length; i++) if (lp.caseDone[i]) q++;
    return q + (l.lab && lp.labDone ? 1 : 0);
  }
  function moduleProgress() {
    var done = 0, total = 0;
    for (var i = 0; i < LESSONS.length; i++) {
      done += lessonDoneUnits(LESSONS[i]);
      total += lessonUnits(LESSONS[i]);
    }
    return total ? done / total : 0;
  }

  // ---------- роутинг ----------

  function currentLessonId() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    for (var i = 0; i < LESSONS.length; i++) {
      if (LESSONS[i].id === h) return h;
    }
    return LESSONS.length ? LESSONS[0].id : '';
  }

  // ---------- сайдбар ----------

  function renderSidebar(container, activeId) {
    var wrap = el('aside', 'sidebar');

    var brand = el('div', 'brand');
    brand.appendChild(el('div', 'brand-title', 'BE‑101'));
    brand.appendChild(el('div', 'brand-sub', 'Бэкенд для смежных специальностей'));
    wrap.appendChild(brand);

    var progWrap = el('div', 'module-progress');
    var pct = Math.round(moduleProgress() * 100);
    progWrap.appendChild(el('div', 'module-progress-label',
      'Прогресс модуля: <b>' + pct + '%</b>'));
    var bar = el('div', 'module-progress-bar');
    var fill = el('div', 'module-progress-fill');
    fill.style.width = pct + '%';
    bar.appendChild(fill);
    progWrap.appendChild(bar);
    wrap.appendChild(progWrap);

    var list = el('nav', 'lesson-list');
    LESSONS.forEach(function (l) {
      var done = lessonUnits(l) > 0 && lessonDoneUnits(l) === lessonUnits(l);
      var item = el('a',
        'lesson-item' + (l.id === activeId ? ' active' : ''),
        '<span class="lesson-status ' + (done ? 'done' : '') + '">' + (done ? '✓' : '') + '</span>' +
        '<span class="lesson-title">' + esc(l.order + '. ' + l.title) + '</span>');
      item.href = '#/' + l.id;
      list.appendChild(item);
    });
    wrap.appendChild(list);

    var footer = el('div', 'sidebar-footer',
      'Прогресс хранится только в твоём браузере');
    wrap.appendChild(footer);

    container.appendChild(wrap);
  }

  // обновить только сайдбар (галочки/прогресс), не трогая контент урока:
  // полный render() пересоздал бы DOM и сбрасывал незакрытую попытку квиза
  function updateSidebar(activeId) {
    var appEl = document.getElementById('app');
    var old = appEl && appEl.querySelector('.sidebar');
    if (!old) return;
    var holder = el('div');
    renderSidebar(holder, activeId || currentLessonId());
    old.parentNode.replaceChild(holder.firstChild, old);
  }

  // ---------- квиз-движок ----------

  var TYPE_LABELS = {
    single: 'один ответ',
    multi: 'несколько ответов',
    blank: 'впиши ответ',
    match: 'сопоставь',
  };

  function mountQuiz(slotEl, lesson, slotIndex) {
    var questions = lesson.quizzes[slotIndex];
    var lp = getLessonProgress(lesson.id);
    var alreadyPassed = !!lp.quizPassed[slotIndex];

    var root = el('div', 'quiz');
    root.appendChild(el('div', 'quiz-head',
      '<span class="quiz-badge">Квиз</span>' +
      '<span class="quiz-hint">Порог сдачи — ' + Math.round(PASS_RATIO * 100) + '%. Пересдача не ограничена.</span>' +
      (alreadyPassed ? '<span class="quiz-passed-badge">✓ уже сдан</span>' : '')));

    var body = el('div', 'quiz-body');
    root.appendChild(body);

    var result = el('div', 'quiz-result');
    root.appendChild(result);

    var order; // порядок вопросов текущей попытки

    function startAttempt() {
      body.innerHTML = '';
      result.innerHTML = '';
      result.className = 'quiz-result';
      order = shuffle(questions.map(function (_, i) { return i; }));
      var correctCount = 0;
      var answeredCount = 0;

      order.forEach(function (qi, pos) {
        var q = questions[qi];
        var qEl = el('div', 'question');
        qEl.appendChild(el('div', 'question-head',
          '<span class="question-num">' + (pos + 1) + '</span>' +
          '<span class="question-type">' + TYPE_LABELS[q.type] + '</span>'));
        qEl.appendChild(el('div', 'question-text', esc(q.question)));
        if (q.codeHtml) {
          qEl.appendChild(el('pre', 'question-code', '<code>' + q.codeHtml + '</code>'));
        }
        var area = el('div', 'question-area');
        qEl.appendChild(area);

        function finish(ok, detailsHtml) {
          correctCount += ok ? 1 : 0;
          answeredCount++;
          qEl.classList.add(ok ? 'ok' : 'fail');
          area.classList.add('locked');
          var fb = el('div', 'question-feedback ' + (ok ? 'ok' : 'fail'),
            '<b>' + (ok ? '✓ Верно' : '✗ Неверно') + '</b>' +
            (q.explanation ? '<div class="question-expl">' + esc(q.explanation) + '</div>' : '') +
            (detailsHtml || ''));
          qEl.appendChild(fb);
          if (answeredCount === questions.length) finishAttempt(correctCount);
        }

        if (q.type === 'single') {
          q.options.forEach(function (opt, oi) {
            var b = el('button', 'option', esc(opt));
            b.type = 'button';
            b.addEventListener('click', function () {
              if (area.classList.contains('locked')) return;
              var ok = oi === q.correct;
              area.querySelectorAll('.option').forEach(function (o, idx) {
                o.disabled = true;
                if (idx === q.correct) o.classList.add('correct');
              });
              if (!ok) b.classList.add('wrong');
              finish(ok);
            });
            area.appendChild(b);
          });
        }

        if (q.type === 'multi') {
          var boxes = [];
          q.options.forEach(function (opt, oi) {
            var lab = el('label', 'option check',
              '<input type="checkbox" data-i="' + oi + '"> <span>' + esc(opt) + '</span>');
            area.appendChild(lab);
            boxes.push(lab);
          });
          var submit = el('button', 'btn small', 'Ответить');
          submit.type = 'button';
          submit.addEventListener('click', function () {
            if (area.classList.contains('locked')) return;
            var chosen = [];
            boxes.forEach(function (l) {
              var cb = l.querySelector('input');
              if (cb.checked) chosen.push(Number(cb.dataset.i));
            });
            if (!chosen.length) return;
            var need = q.correct.slice().sort(function (a, b) { return a - b; });
            var got = chosen.slice().sort(function (a, b) { return a - b; });
            var ok = need.length === got.length && need.every(function (v, i) { return v === got[i]; });
            boxes.forEach(function (l) {
              var cb = l.querySelector('input');
              cb.disabled = true;
              var i = Number(cb.dataset.i);
              if (need.indexOf(i) >= 0) l.classList.add('correct');
              else if (cb.checked) l.classList.add('wrong');
            });
            finish(ok);
          });
          area.appendChild(submit);
        }

        if (q.type === 'blank') {
          var row = el('div', 'blank-row');
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'blank-input';
          input.placeholder = 'Твой ответ…';
          input.autocomplete = 'off';
          input.spellcheck = false;
          var b = el('button', 'btn small', 'Ответить');
          b.type = 'button';
          row.appendChild(input);
          row.appendChild(b);
          area.appendChild(row);
          function submitBlank() {
            if (area.classList.contains('locked')) return;
            var v = normalizeText(input.value);
            if (!v) return;
            var ok = q.answers.some(function (a) { return normalizeText(a) === v; });
            input.disabled = true;
            b.disabled = true;
            input.classList.add(ok ? 'correct' : 'wrong');
            finish(ok, ok ? '' : '<div class="correct-answer">Правильный ответ: <b>' +
              esc(q.answers[0]) + '</b></div>');
          }
          b.addEventListener('click', submitBlank);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') submitBlank();
          });
        }

        if (q.type === 'match') {
          var rights = shuffle(q.pairs.map(function (p) { return p.right; }));
          var selects = [];
          q.pairs.forEach(function (p) {
            var rowM = el('div', 'match-row');
            rowM.appendChild(el('div', 'match-left', esc(p.left)));
            var sel = document.createElement('select');
            sel.className = 'match-select';
            sel.appendChild(el('option', '', '— выбери —'));
            rights.forEach(function (r) {
              var o = el('option', '', esc(r));
              o.value = r;
              sel.appendChild(o);
            });
            rowM.appendChild(sel);
            area.appendChild(rowM);
            selects.push({ select: sel, right: p.right });
          });
          var submitM = el('button', 'btn small', 'Ответить');
          submitM.type = 'button';
          submitM.addEventListener('click', function () {
            if (area.classList.contains('locked')) return;
            if (selects.some(function (s) { return !s.select.value; })) return;
            var allOk = true;
            selects.forEach(function (s) {
              s.select.disabled = true;
              var ok = s.select.value === s.right;
              if (!ok) allOk = false;
              s.select.classList.add(ok ? 'correct' : 'wrong');
            });
            finish(allOk);
          });
          area.appendChild(submitM);
        }

        body.appendChild(qEl);
      });
    }

    function finishAttempt(correctCount) {
      var pct = Math.round((correctCount / questions.length) * 100);
      var passed = correctCount / questions.length >= PASS_RATIO;
      setQuizPassed(lesson.id, slotIndex, passed || getLessonProgress(lesson.id).quizPassed[slotIndex]);

      result.className = 'quiz-result show ' + (passed ? 'ok' : 'fail');
      result.innerHTML =
        '<div class="quiz-score">' +
        (passed ? '🎉 Квиз сдан!' : 'Пока не сдан') +
        ' — верно ' + correctCount + ' из ' + questions.length +
        ' (' + pct + '%)' +
        '</div>' +
        (passed
          ? '<div class="quiz-note">Урок отмечен пройденным ✓</div>'
          : '<div class="quiz-note">Нужно ' + Math.round(PASS_RATIO * 100) +
            '%+. Перечитай пояснения выше и попробуй ещё раз — вопросы перемешаются.</div>');

      var retake = el('button', 'btn small', 'Пройти заново');
      retake.type = 'button';
      retake.addEventListener('click', function () {
        startAttempt();
      });
      result.appendChild(retake);
      updateSidebar();
    }

    slotEl.innerHTML = '';
    slotEl.appendChild(root);
    startAttempt();
  }

  // ---------- кейс (textarea + эталонный разбор) ----------

  function mountCase(slotEl, lesson, caseIndex) {
    var c = lesson.cases[caseIndex];
    var lp = getLessonProgress(lesson.id);
    var done = !!lp.caseDone[caseIndex];

    var root = el('div', 'case');
    root.appendChild(el('div', 'case-head',
      '<span class="case-badge">Кейс</span>' +
      '<span class="case-title">' + esc(c.title) + '</span>' +
      (done ? '<span class="case-done-badge">✓ разобран</span>' : '')));
    root.appendChild(el('div', 'case-task', esc(c.task)));

    var area = document.createElement('textarea');
    area.className = 'case-input';
    area.placeholder = c.placeholder || 'Свой ответ…';
    area.spellcheck = false;
    root.appendChild(area);

    var btn = el('button', 'btn small', 'Показать эталонный разбор');
    btn.type = 'button';
    btn.disabled = true;
    area.addEventListener('input', function () {
      btn.disabled = !area.value.trim();
    });
    root.appendChild(btn);

    var ref = el('div', 'case-reference' + (done ? ' show' : ''), c.referenceHtml);
    root.appendChild(ref);

    var note = el('div', 'case-note',
      'Эталон — для самопроверки: сначала своё решение, потом сверка. Ответ никуда не отправляется.');
    root.appendChild(note);

    btn.addEventListener('click', function () {
      if (!area.value.trim()) return;
      setCaseDone(lesson.id, caseIndex, true);
      ref.classList.add('show');
      root.querySelector('.case-head').appendChild(
        el('span', 'case-done-badge', '✓ разобран'));
      btn.disabled = true;
      updateSidebar();
    });

    slotEl.innerHTML = '';
    slotEl.appendChild(root);
  }

  // ---------- карточка лабы ----------

  function mountLab(article, lesson) {
    var lab = lesson.lab;
    if (!lab) return;
    var card = el('div', 'lab-card');
    card.appendChild(el('div', 'lab-head', '<span class="lab-badge">Лабораторная</span> ' + esc(lab.title)));
    if (lab.description) card.appendChild(el('p', 'lab-desc', esc(lab.description)));
    if (lab.branch) {
      card.appendChild(el('div', 'lab-branches',
        'Ветка задания: <code>' + esc(lab.branch) + '</code>' +
        (lab.branchSolution ? ' · решение: <code>' + esc(lab.branchSolution) + '</code>' : '') +
        (lab.hasTests
          ? ' · проверка: <code>' + esc(lab.testCommand || 'mvn test') + '</code>'
          : (lab.branchSolution ? ' · сверяешься с решением' : ''))
      ));
    }
    var lp = getLessonProgress(lesson.id);
    var label = el('label', 'lab-check',
      '<input type="checkbox"' + (lp.labDone ? ' checked' : '') + '> Я сделал эту лабу');
    label.querySelector('input').addEventListener('change', function (e) {
      setLabDone(lesson.id, e.target.checked);
      updateSidebar(); // только галочки/прогресс, без сброса квиза
    });
    card.appendChild(label);
    article.appendChild(card);
  }

  // ---------- страница ----------

  var app;

  function render() {
    if (!app) app = document.getElementById('app');
    var id = currentLessonId();
    var lesson = LESSONS.filter(function (l) { return l.id === id; })[0];

    app.innerHTML = '';
    if (!lesson) {
      app.appendChild(el('div', 'empty', 'Уроки не найдены — запусти сборку (tools/generator)'));
      return;
    }

    renderSidebar(app, lesson.id);

    var main = el('main', 'content');
    var article = el('article', 'lesson');
    article.innerHTML = lesson.html;
    main.appendChild(article);
    app.appendChild(main);

    // лаба — в конец урока
    mountLab(article, lesson);

    // монтируем квизы и кейсы в слоты из markdown
    article.querySelectorAll('.quiz-slot').forEach(function (slot) {
      var idx = Number(slot.dataset.quiz);
      if (lesson.quizzes[idx]) mountQuiz(slot, lesson, idx);
    });
    article.querySelectorAll('.case-slot').forEach(function (slot) {
      var idx = Number(slot.dataset.case);
      if (lesson.cases[idx]) mountCase(slot, lesson, idx);
    });

    // mermaid-диаграммы
    if (window.mermaid) {
      try {
        window.mermaid.initialize({ startOnLoad: false, theme: 'neutral', locale: 'ru' });
        var nodes = article.querySelectorAll('.mermaid');
        if (nodes.length) window.mermaid.run({ nodes: nodes });
      } catch (_) { /* диаграммы не критичны */ }
    }

    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', render);
  if (document.readyState !== 'loading') render();
})();

</script>
</body>
