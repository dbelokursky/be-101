 вложенность на любую глубину схемы, форма ответа повторяет форму запроса. Over-fetching и N+1 с точки зрения клиента исчезли.\u003c/p>\n\u003cp>Изменения данных — \u003cstrong>мутации\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-graphql\">\u003cspan class=\"hljs-keyword\">mutation\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    completeTask\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n        id\n        done\n    \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003ch2>Как это выглядит в Spring Boot\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Controller\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">TaskGraphqlController\u003c/span> {\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> TaskService taskService;\n\n    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">TaskGraphqlController\u003c/span>\u003cspan class=\"hljs-params\">(TaskService taskService)\u003c/span> {\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.taskService = taskService;\n    }\n\n    \u003cspan class=\"hljs-meta\">@QueryMapping\u003c/span>                       \u003cspan class=\"hljs-comment\">// обслуживает поле tasks из схемы\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-title function_\">tasks\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Argument\u003c/span> Boolean done)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> taskService.find(done);\n    }\n\n    \u003cspan class=\"hljs-meta\">@MutationMapping\u003c/span>                    \u003cspan class=\"hljs-comment\">// обслуживает мутацию completeTask\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-title function_\">completeTask\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Argument\u003c/span> Long id)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> taskService.complete(id);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Тот же сервисный слой, те же сущности — меняется только «обвязка»: вместо \u003ccode>@GetMapping\u003c/code> — \u003ccode>@QueryMapping\u003c/code>. REST и GraphQL спокойно живут в одном приложении рядом: REST для простых интеграций, GraphQL для насыщенных фронтендов.\u003c/p>\n\u003ch2>GraphQL vs REST: что когда\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>REST\u003c/th>\n\u003cth>GraphQL\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Форма ответа\u003c/td>\n\u003ctd>Задаёт сервер\u003c/td>\n\u003ctd>Заказывает клиент\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Число эндпоинтов\u003c/td>\n\u003ctd>Много\u003c/td>\n\u003ctd>Один (\u003ccode>/graphql\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Кэширование HTTP\u003c/td>\n\u003ctd>Естественное (GET, CDN)\u003c/td>\n\u003ctd>Сложнее (всё через POST)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Инструменты\u003c/td>\n\u003ctd>Все привыкли\u003c/td>\n\u003ctd>GraphiQL, типизированные клиенты\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Валидация контракта\u003c/td>\n\u003ctd>OpenAPI-спека\u003c/td>\n\u003ctd>Схема — сама спека, валидируется рантаймом\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Хорош когда\u003c/td>\n\u003ctd>Простые CRUD-интеграции, кэш, публичные API\u003c/td>\n\u003ctd>Сложные экраны, много клиентов с разными потребностями\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>GraphQL — не «замена REST», а инструмент под конкретную боль. Внутри компании: мобильный клиент с медленной сетью и богатым UI — GraphQL; webhook для партнёра — REST.\u003c/p>\n\u003cp>Одно предостережение: гибкость GraphQL ложится на сервер. Клиент может заказать \u003ccode>project { tasks { project { tasks ... } } }\u003c/code> — и сервер должен отвечать быстро и не падать. В Spring это решается дозагрузкой данных пачками (batching), но это уже глубина для бэкенд-разработки.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> если вы работали с Apollo/Relay — вы уже писали эти запросы. Новое здесь — обратная сторона: как серверу жить с произвольными запросами, и почему бэкендеры иногда просят «не запрашивайте это поле в списке».\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> тестируя GraphQL, проверяйте не только форму «что попросили — то получили», но и границы: запросы огромной глубины, отсутствующие поля, ошибки в одном поле запроса (GraphQL не падает целиком — возвращает data и errors одновременно!).\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> в GraphQL сущности и связи схемы видны напрямую: \u003ccode>Task.project\u003c/code> — задача связана с проектом. Схема — почти ваша ER-диаграмма предметной области, и она же — исполняемый контракт.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>GraphQL лечит over-fetching и under-fetching: клиент заказывает ровно нужные поля одним запросом\u003c/li>\n\u003cli>Сервер описывает схему (типы, Query, Mutation); ответ повторяет форму запроса\u003c/li>\n\u003cli>В Spring: \u003ccode>@QueryMapping\u003c/code>/\u003ccode>@MutationMapping\u003c/code> поверх того же сервисного слоя; REST и GraphQL живут рядом\u003c/li>\n\u003cli>Выбор — не религия: REST — простота и кэш, GraphQL — гибкие богатые клиенты\u003c/li>\n\u003cli>Цена гибкости — сложность сервера: произвольные запросы надо уметь обслуживать быстро\u003c/li>\n\u003c/ul>\n\u003cp>Последний урок модуля — как контракт (любой: OpenAPI или GraphQL-схема) живёт в процессах команды.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Экрану нужны только title задач, а REST отдаёт 12 полей, включая тяжёлую историю изменений. Как называется эта боль?","options":["Over-fetching: клиент получает лишние данные","Under-fetching: клиенту не хватает данных","N+1: запросов слишком много","Блокировка: запросы идут последовательно"],"correct":0,"explanation":"Over-fetching — «слишком много дали». Сервер тянет из базы и сериализует поля, которые клиент выбросит."},{"type":"single","codeLang":"graphql","code":"query {\n    task(id: 42) {\n        title\n        project { name }\n    }\n}\n","question":"Что вернёт сервер на такой GraphQL-запрос (при валидной схеме из урока)?","options":["Объект с title задачи и name её проекта — только эти поля","Всю задачу целиком: GraphQL всегда отдаёт все поля","Только id — по нему клиент дорезолвит остальное","Ошибку: в одном запросе нельзя просить вложенные объекты"],"correct":0,"explanation":"Форма ответа повторяет форму запроса: попросили title и project.name — ровно их и получили. Вложенность — норма GraphQL.","codeHtml":"\u003cspan class=\"hljs-keyword\">query\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    task\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n        title\n        project \u003cspan class=\"hljs-punctuation\">{\u003c/span> name \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n    \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n"},{"type":"single","question":"Почему в GraphQL всё ходит через POST /graphql и с этим больно кэшировать на уровне HTTP?","options":["POST-тело не кэшируется стандартными HTTP-механизмами, в отличие от GET с его URL и CDN","GraphQL не работает по HTTP","POST медленнее GET в любом случае","Серверы запрещают кэшировать ответы GraphQL"],"correct":0,"explanation":"HTTP-кэширование завязано на GET и URL. Весь GraphQL — POST с телом-запросом, стандартные механизмы мимо. Кэш строят на уровне клиентов (Apollo cache и др.)."},{"type":"multi","question":"Что верно про схему GraphQL? (несколько ответов)","options":["type Task { ... } описывает тип и его поля — как интерфейс в TS","Восклицательный знак (String!) означает «не null»","Схему пишет клиент под каждый экран","Query и Mutation — корневые типы: входные точки чтения и изменения"],"correct":[0,1,3],"explanation":"Схему описывает сервер один раз — это контракт. Клиенты лишь выбирают подмножество полей в своих запросах."},{"type":"blank","question":"Как называется GraphQL-операция изменения данных (аналог POST/PATCH в REST)? (одно слово)","answers":["mutation","мутация"],"explanation":"Mutation. Чтение — query, изменение — mutation; в Spring их обслуживают @QueryMapping и @MutationMapping."},{"type":"single","question":"Вы проектируете API для партнёрского webhook-интегратора и для своего мобильного приложения с 20 экранами. Что разумно?","options":["Партнёру — простой REST (кэш, привычность, минимум движущихся частей); приложению — GraphQL под разные экраны","Всем GraphQL: зачем два стиля","Всем REST: GraphQL — хайп","Партнёру — GraphQL, приложению — REST"],"correct":0,"explanation":"Инструмент под потребителя. Партнёру важна предсказуемость и кэшируемость; своему приложению с богатыми экранами — гибкость заказов. Оба живут в одном Spring-приложении."},{"type":"single","codeLang":"java","code":"@QueryMapping\npublic List\u003cTask> tasks(@Argument Boolean done) {\n    return taskService.find(done);\n}\n","question":"Что делает этот код в Spring-приложении со схемой GraphQL?","options":["Обслуживает запросы к полю tasks схемы, передавая аргумент done в сервис","Создаёт REST-эндпоинт /tasks?done=...","Определяет новый тип в схеме GraphQL","Публикует событие в Kafka"],"correct":0,"explanation":"@QueryMapping связывает поле Query.tasks из schema.graphqls с методом. Схема описывает контракт, метод — его исполнение; @Argument достаёт аргументы запроса.","codeHtml":"\u003cspan class=\"hljs-meta\">@QueryMapping\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-title function_\">tasks\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Argument\u003c/span> Boolean done)\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">return\u003c/span> taskService.find(done);\n}\n"}]],"cases":[]},{"id":"m2-lesson-05","title":"Контракт в работе команды","module":2,"moduleTitle":"Проектирование API","order":5,"lab":null,"html":"\u003ch1>Урок 5. Контракт в работе команды\u003c/h1>\n\u003cp>Последний урок модуля — про процесс. Спека сама по себе не спасает: «OpenAPI-файл, который обновляют после кода раз в квартал» — это просто устаревшая документация. Ценность появляется, когда контракт встроен в ежедневную работу всех ролей.\u003c/p>\n\u003ch2>Жизненный цикл фичи в API-First\u003c/h2>\n\u003cp>Разберём типичную фичу — «просроченные задачи подсвечивать на дашборде»:\u003c/p>\n\u003cp>\u003cstrong>1. Черновик спеки (бэкенд + аналитик).\u003c/strong> В \u003ccode>openapi.yaml\u003c/code> появляется изменение: у \u003ccode>TaskResponse\u003c/code> новое вычисляемое поле \u003ccode>overdue: boolean\u003c/code>. Всё обсуждение предметики происходит здесь — на языке полей и типов.\u003c/p>\n\u003cp>\u003cstrong>2. Ревью контракта (все).\u003c/strong> PR со спекой смотрят: аналитик — семантика («overdue — это только дата прошла, или ещё и не done?»), фронтендер — достаточно ли полей для UI, QA — описаны ли ошибки. Код ещё не написан — правки бесплатны.\u003c/p>\n\u003cp>\u003cstrong>3. Фиксация версии.\u003c/strong> Спека смержена — теперь это договор. Из CI публикуется Swagger UI и генерятся клиенты.\u003c/p>\n\u003cp>\u003cstrong>4. Параллельная работа.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Фронтенд: перегенерил TS-клиент, поднял мок-сервер по спеке — верстает дашборд против мока.\u003c/li>\n\u003cli>Бэкенд: реализует \u003ccode>overdue\u003c/code> в сервисном слое.\u003c/li>\n\u003cli>QA: по спеке готовит тест-кейсы: \u003ccode>overdue=true\u003c/code> при прошедшем дедлайне и \u003ccode>done=false\u003c/code>, \u003ccode>overdue=false\u003c/code> у выполненной, формат даты.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>5. Контрактные тесты.\u003c/strong> CI гоняет проверку: живой API соответствует спеке — каждое поле, каждый статус. Расхождение — красный пайплайн, а не «у френта что-то падает».\u003c/p>\n\u003cp>\u003cstrong>6. Релиз.\u003c/strong> Фронт переключается с мока на реальный API (или уже жил против тестового стенда). Депрекаций нет — поле новое, обратная совместимость соблюдена.\u003c/p>\n\u003ch2>Что делает каждая роль\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Роль\u003c/th>\n\u003cth>Обязанности по контракту\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Аналитик\u003c/strong>\u003c/td>\n\u003ctd>Семантика полей, сценарии, коды ошибок. Участвует в ревью спеки до кода\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Бэкендер\u003c/strong>\u003c/td>\n\u003ctd>Пишет и поддерживает спеку, реализует код под контракт, держит контрактные тесты зелёными\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Фронтендер\u003c/strong>\u003c/td>\n\u003ctd>Читает спеку в Swagger UI, работает против мока, использует сгенерированный клиент, ревьюит изменения на «не сломают ли меня»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>QA\u003c/strong>\u003c/td>\n\u003ctd>Тест-кейсы и тест-данные из спеки (examples), контрактные тесты как регресс, проверка обратной совместимости и идемпотентности\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Ключевая смена оптики: \u003cstrong>обсуждаем контракт — до кода, изменения — через ревью спеки\u003c/strong>. Вопрос «а какое поле придёт?» решается не чтением чужого Java-кода, а открытием одного YAML-файла.\u003c/p>\n\u003ch2>Изменение контракта, который уже в проде\u003c/h2>\n\u003cp>Флоу для изменения живого API:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Предложение\u003c/strong>: PR в спеку с пометкой о типе изменения (совместимое / breaking)\u003c/li>\n\u003cli>\u003cstrong>Ревью потребителями\u003c/strong>: фронт, мобилки, интеграции — «не сломает ли вас»\u003c/li>\n\u003cli>Совместимое — мержим, деплоим, поле появляется. Breaking — новая версия (\u003ccode>/v2\u003c/code>) + \u003ccode>Deprecation\u003c/code>-заголовок старой + план переезда\u003c/li>\n\u003cli>\u003cstrong>Changelog\u003c/strong>: люди читают changelog, а не diff YAML\u003c/li>\n\u003c/ol>\n\u003ch2>Anti-patterns\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>«Спека потом»\u003c/strong> — код уже в проде, спеки нет. Долг растёт с каждым эндпоинтом.\u003c/li>\n\u003cli>\u003cstrong>«Тихие правки»\u003c/strong> — бэкенд поправил поле «по мелочи». Каждый такой раз — лотерея для потребителей.\u003c/li>\n\u003cli>\u003cstrong>«Спека для галочки»\u003c/strong> — файл лежит в репо, генерится из кода раз в квартал, никем не ревьюится.\u003c/li>\n\u003cli>\u003cstrong>«Диктат бэкенда»\u003c/strong> — спека не ревьюится потребителями: «мы знаем лучше». Потом узнают, как выглядели нужные поля, — по багрепортам.\u003c/li>\n\u003cli>\u003cstrong>«Всё в v1»\u003c/strong> — копят breaking changes годами, потом «v2» = переписывание всего. Мелкие версии дешевле больших.\u003c/li>\n\u003c/ul>\n\u003ch2>Экосистема инструментов (шпаргалка)\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Задача\u003c/th>\n\u003cth>Инструменты\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Редактирование спеки\u003c/td>\n\u003ctd>Ревью в PR, Swagger Editor, Redoc\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Просмотр\u003c/td>\n\u003ctd>Swagger UI (попробовать запросы), Redoc (читать)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Мок-сервер\u003c/td>\n\u003ctd>Prism, WireMock (по спеке)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Генерация\u003c/td>\n\u003ctd>openapi-generator: TS/Java/Python клиенты, заготовки сервера\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Контрактные тесты\u003c/td>\n\u003ctd>Schemathesis, Dredd, springdoc + Spring тесты\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Спецификация GraphQL\u003c/td>\n\u003ctd>GraphiQL (песочница), Apollo/Relay на клиенте\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> ваша суперсила в этом процессе — предметная точность. «Поле overdue» без определения — половина багов фичи. Формулировка «задача просрочена, если deadline &lt; сегодня И done = false» в ревью спеки стоит десять минут и экономит неделю споров на тестировании.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> контрактные тесты в CI — это «регресс контракта» без ручной работы: любое расхождение кода и спеки краснит пайплайн. А очередь к вам доходит уже с согласованным контрактом и тест-данными — время уходит на настоящее тестирование, а не на выяснение «а что должен возвращать этот эндпоинт».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Контракт ценен процессом: черновик → ревью всеми ролями → версия → параллельная работа → контрактные тесты → changelog\u003c/li>\n\u003cli>Фронт не ждёт бэк: мок-сервер и сгенерированный клиент\u003c/li>\n\u003cli>Изменения живого API — через PR в спеку; breaking — только новая версия с deprecation\u003c/li>\n\u003cli>Anti-patterns: «спека потом», тихие правки, спека для галочки\u003c/li>\n\u003cli>У каждой роли в контракте своя зона — и она не «в чужом коде», а в общем YAML\u003c/li>\n\u003c/ul>\n\u003cp>Модуль пройден: вы умеете читать и писать OpenAPI, знаете REST-практики и GraphQL, и понимаете, как контракт живёт в команде. Экзамен и кейс — впереди.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"В каком порядке строятся работы над фичей в API-First?","options":["Черновик спеки → ревью контракта потребителями → параллельная работа фронта (мок) и бэка (код) → контрактные тесты → релиз","Код контроллера → деплой → документация → сообщение фронту","Дизайн UI → вёрстка → «бэк, отдай нам такие же поля»","Тесты → код → спека из кода → релиз"],"correct":0,"explanation":"Суть API-First — договор раньше кода и параллельная работа сторон против него. Все остальные порядки — варианты code-first с его рисками."},{"type":"multi","question":"Что даёт мок-сервер по спеке? (несколько ответов)","options":["Фронтенд работает с API до готовности бэкенда","Мобильная команда тестирует клиент против стабильных ответов","Мок заменяет боевую базу данных в продакшене","QA может стартовать до реализации, отлаживая клиент против ожидаемых ответов"],"correct":[0,1,3],"explanation":"Мок — про разработку и тестирование против контракта. Прод-БД он не заменяет: это не про данные, а про форму ответов."},{"type":"match","question":"Сопоставь роль и её ответственность в контрактном процессе.","pairs":[{"left":"Аналитик","right":"Семантика полей и сценарии в ревью спеки"},{"left":"Фронтендер","right":"Сгенерированный клиент + работа против мока"},{"left":"QA","right":"Тест-кейсы из спеки, контрактные тесты как регресс"},{"left":"Бэкендер","right":"Спека и код под контракт, зелёные контрактные тесты"}]},{"type":"single","question":"Контрактный тест упал в CI: живой API отдаёт поле createdAt, которого нет в спеке. Что это значит?","options":["Код разошёлся с договором: либо добавить поле в спеку через ревью, либо убрать из ответа","Тест слишком строгий, его надо отключить","Ничего страшного: лишнее поле никому не мешает","Сломался CI-сервер"],"correct":0,"explanation":"Даже «безобидное» поле — расхождение: спека перестала быть источником правды. Решение — осознанное: править договор через ревью или код. Отключить тест — запретить датчику сигналить."},{"type":"single","question":"Какой anti-pattern описан: «Файл openapi.yaml лежит в репозитории, генерируется из кода постфактум, никто его не смотрит»?","options":["Спека для галочки: контракт без процесса не работает","API-First: так и задумано","Контрактное тестирование","Версионирование"],"correct":0,"explanation":"Ценность контракта — в ревью ДО кода и тестах ПОСЛЕ. Спека-архив ничем не лучше устаревшей страницы в Confluence."},{"type":"blank","question":"Как называется заголовок HTTP, которым сервер официально сообщает, что эндпоинт устарел и будет выключен? (английское слово)","answers":["Deprecation","deprecation"],"explanation":"Deprecation (и Sunset — с датой выключения). Стандартный способ объявить «переезжайте» вместо молчаливого выключения."},{"type":"single","question":"Фронтендер спрашивает в чате: «А что придёт в GET /api/tasks/42, если задача просрочена?». Лучший ответ команды, живущей по контракту:","options":["«Открой спеку: поле overdue описано в TaskResponse, пример есть в Swagger UI»","«Сейчас гляну код контроллера, секунду»","«Спроси у бэкендера, он в отпуске, вернётся через неделю»","«Покрути приложение в дев-окружении и посмотри вкладку Network»"],"correct":0,"explanation":"Ответ по контракту — мгновенный, точный и не зависит от отпусков. Чтение кода и эксперименты — путь дольше и с риском догадок."}]],"cases":[]},{"id":"m2-exam","title":"Экзамен модуля и кейс","module":2,"moduleTitle":"Проектирование API","order":6,"lab":null,"html":"\u003ch1>Экзамен модуля «Проектирование API»\u003c/h1>\n\u003cp>Пять уроков позади: контракт как договор, OpenAPI, REST-практики, GraphQL, командный процесс. Финал — как всегда, в двух частях: кейс своими словами, затем экзамен на 15 вопросов (порог 80%).\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Бэкенд удалил из ответа необязательное поле nickname, о котором никто не знал. Фронтенд упал. Что нарушено?","options":["Обратная совместимость: удаление поля — breaking change даже если «оно было необязательным»","Ничего: необязательные поля можно удалять свободно","Правила YAML","Идемпотентность"],"correct":0,"explanation":"Обязательность в схеме — про валидацию, а не про «можно удалять». Кто-то мог читать поле. Удаление — только через версию и deprecation."},{"type":"single","question":"Что означает $ref: \"#/components/schemas/Booking\" в спеке?","options":["Ссылку на схему Booking, описанную в components — переиспользование структуры","Ссылку на внешнюю базу данных","Запрос к сервису бронирования в рантайме","Обязательность всех полей Booking"],"correct":0,"explanation":"$ref — внутренняя ссылка на описанную схему: один источник правды для всех мест, где нужна структура."},{"type":"multi","question":"Какие утверждения о версионировании верны? (несколько ответов)","options":["Добавление нового эндпоинта обратно совместимо","Переименование поля — breaking change","/api/v2 в пути — самый распространённый способ версионирования","Старую версию выключают сразу после релиза новой"],"correct":[0,1,2],"explanation":"Старую версию выключают по метрике (доля трафика ≈ 0) после переходного периода, а не сразу: потребители переезжают с разной скоростью."},{"type":"single","codeLang":"json","code":"{\n  \"status\": 409,\n  \"code\": \"SLOT_TAKEN\",\n  \"title\": \"Слот уже занят\",\n  \"detail\": \"Переговорка 7 занята 14:00–15:00\"\n}\n","question":"Почему фронт должен ветвиться по code/status, а не по detail?","options":["detail — текст для человека: формулировка меняется без предупреждения, а code и статус стабильны","detail всегда пустой","По code нельзя ветвиться","Статус в теле не совпадает с HTTP-статусом"],"correct":0,"explanation":"Контракт для логики — статус и машинный код. Тексты (title, detail) — для людей, они локализуются и переформулируются.","codeHtml":"\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;status&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">409\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;code&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;SLOT_TAKEN&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Слот уже занят&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;detail&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Переговорка 7 занята 14:00–15:00&quot;\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n"},{"type":"single","question":"Мобильный клиент ретраит POST /api/bookings после таймаута. Без чего он может забронировать слот дважды?","options":["Без идемпотентного ключа: сервер не отличит повтор от нового запроса","Без пагинации","Без GraphQL","Без версионирования"],"correct":0,"explanation":"POST не идемпотентен. Idempotency-Key позволяет серверу вернуть результат первого выполнения вместо создания дубля."},{"type":"match","question":"Сопоставь элемент GraphQL и его смысл.","pairs":[{"left":"schema.graphqls","right":"Контракт: типы и поля, которые есть"},{"left":"query","right":"Заказ данных: клиент указывает поля"},{"left":"mutation","right":"Изменение данных"},{"left":"@QueryMapping","right":"Spring-метод, обслуживающий поле схемы"}]},{"type":"single","question":"GraphQL особенно уместен, когда…","options":["Много разных клиентов с разными потребностями в данных и богатые экраны: каждый заказывает ровно своё","Нужен публичный webhook с кэшированием на CDN","API состоит из трёх CRUD-эндпоинтов","Команда не хочет писать схемы"],"correct":0,"explanation":"Сила GraphQL — гибкость формы ответа. Для простых CRUD и кэшируемых публичных API она избыточна."},{"type":"single","question":"В спеке у POST /api/bookings не указан required у requestBody. Чем это грозит?","options":["Договор двусмыслен: клиент вправе отправить запрос без тела, а ожидания сервера не зафиксированы","Спека не пройдёт валидацию OpenAPI","POST автоматически станет GET","Ничем: required пишут только для GET"],"correct":0,"explanation":"Хороший контракт однозначен. Каждый параметр и тело — либо обязательны, либо нет, явно."},{"type":"single","question":"Что в первую очередь смотрит QA в PR со спекой?","options":["Описаны ли все ответы и ошибки с примерами — готовая основа тест-кейсов и тест-данных","Стиль Java-кода контроллера","Название ветки","Ничего: спека — не зона QA"],"correct":0,"explanation":"Спека — источник тест-анализа: каждая операция и код ответа — кейс, каждый example — тест-данные. Ревью спеки — самая дешёвая точка влияния QA."},{"type":"blank","question":"Как называется сервер, который отвечает на запросы примерами из спеки, без реальной реализации? (мок-…)","answers":["мок-сервер","мок","mock server"],"explanation":"Мок-сервер (Prism, WireMock): фронт и QA работают против контракта до готовности бэкенда."},{"type":"single","question":"Фронтендер обнаружил в ответе поле overdue, которого нет в спеке, и молча начал его использовать. Что должно произойти?","options":["Поле внести в спеку через ревью — либо убрать из ответа: код и договор не должны расходиться","Ничего: раз поле приходит — можно пользоваться","Фронтендеру запретить смотреть вкладку Network","Спеку удалить"],"correct":0,"explanation":"Поле вне контракта — случайность: его могут убрать без предупреждения. Контрактные тесты должны ловить такие расхождения в CI."},{"type":"single","question":"GET /api/rooms/{id}/slots?date=2026-12-01 — что говорит такой дизайн про слоты?","options":["Слоты — вычисляемый под-ресурс комнаты на дату: читаем расписание, ничего не меняем","Слоты хранятся в отдельной базе","Это GraphQL-запрос","Дизайн неверен: query-параметры нельзя использовать с path-параметрами"],"correct":0,"explanation":"Ресурс не обязан быть таблицей: «свободные слоты» — представление, вычисляемое по запросу. GET + path + query — классика чтения."},{"type":"multi","question":"Какие из этих изменений потребуют новой версии API? (несколько ответов)","options":["Переименование /api/bookings в /api/reservations","Новое поле roomName в ответе брони","Изменение типа поля capacity со строки на число","Новый эндпоинт статистики по броням"],"correct":[0,2],"explanation":"Новое поле и новый эндпоинт совместимы. Переименование пути и смена типа поля ломают существующих клиентов — v2 и deprecation."},{"type":"single","question":"Для чего заголовок Sunset в ответе устаревшего API?","options":["Сообщает дату планового выключения версии — у потребителей есть дедлайн переезда","Отменяет все активные брони","Включает тёмную тему Swagger UI","Ускоряет ответы сервера на закате"],"correct":0,"explanation":"Sunset — дата выключения, парная к Deprecation. Вместе они делают процесс переезда управляемым и наблюдаемым."},{"type":"single","question":"Итоговая мысль модуля. Как правильно относиться к OpenAPI-спеке?","options":["Это источник правды об API: ревьюится до кода, проверяется тестами после, им пользуются все роли","Это документация, которую пишут, когда всё готово","Это артефект для аудита, раз в год","Это то, что генерируется из кода автоматически и никому не нужно"],"correct":0,"explanation":"Контракт работает только в процессе: до кода — ревью и моки, после — контрактные тесты и генерация клиентов. Иначе это просто устаревающий YAML."}]],"cases":[{"title":"Спроектируйте контракт API бронирования переговорок","task":"Офис на 300 человек. Есть переговорки (номер, вместимость, проектор: да/нет). Нужно API: посмотреть свободные слоты, забронировать, отменить бронь, список своих броней. Известные конфликты: двойное бронирование, отмены в последний момент. Опишите контракт: основные эндпоинты (метод + путь), ключевые поля, важные ошибки (статус + код), где бы вы применили идемпотентный ключ. Форма свободная. Это задание уровня урока 1–3 модуля: ресурсы, статусы, ошибки.","placeholder":"Например:\nGET /api/rooms?capacity=8 — список переговорок\nPOST /api/bookings — бронь, 201...\n409 — конфликт слотов...","referenceHtml":"\u003cp>Один из возможных ответов.\u003c/p>\n\u003ch2>Эндпоинты\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Метод и путь\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003cth>Успех\u003c/th>\n\u003cth>Ошибки\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/rooms?capacity=8&amp;projector=true\u003c/code>\u003c/td>\n\u003ctd>Список переговорок с фильтрами\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/rooms/{id}/slots?date=2026-12-01\u003c/code>\u003c/td>\n\u003ctd>Свободные слоты на день\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>404\u003c/code> нет комнаты\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/bookings\u003c/code>\u003c/td>\n\u003ctd>Создать бронь\u003c/td>\n\u003ctd>\u003ccode>201\u003c/code> + \u003ccode>Location\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>409\u003c/code> слот занят, \u003ccode>400\u003c/code> валидация\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/bookings?mine=true\u003c/code>\u003c/td>\n\u003ctd>Мои брони\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DELETE /api/bookings/{id}\u003c/code>\u003c/td>\n\u003ctd>Отменить\u003c/td>\n\u003ctd>\u003ccode>204\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>404\u003c/code>, \u003ccode>409\u003c/code> слишком поздно отменять (правило можно смягчить)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Ключевые поля\u003c/h2>\n\u003cpre>\u003ccode>Booking: id, roomId, startsAt, endsAt, bookedBy, status (ACTIVE/CANCELLED), createdAt\nCreateBookingRequest: roomId, startsAt, endsAt\nSlots: startsAt, endsAt, available\n\u003c/code>\u003c/pre>\n\u003cp>Свободные слоты — вычисляемый ресурс: \u003ccode>GET /slots\u003c/code> читается как «расписание на день», а не «таблица в базе».\u003c/p>\n\u003ch2>Ошибки и семантика\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>409 SLOT_TAKEN\u003c/code> — бронирование в занятый слот: два человека жмут «забронировать» одновременно, второму честный конфликт, а не 500.\u003c/li>\n\u003cli>\u003ccode>400 VALIDATION_ERROR\u003c/code> — endsAt раньше startsAt, бронь в прошлом.\u003c/li>\n\u003cli>\u003ccode>403\u003c/code> — отменять чужую бронь нельзя (а 401 был бы «не знаю, кто ты»).\u003c/li>\n\u003c/ul>\n\u003ch2>Идемпотентный ключ\u003c/h2>\n\u003cp>На \u003ccode>POST /api/bookings\u003c/code>: клиент сгенерировал ключ, ретрай после обрыва сети не создаёт вторую бронь — сервер вернёт результат первого выполнения. Критично: двойное бронирование — наш главный бизнес-риск.\u003c/p>\n\u003ch2>Продвинутое (не обязательно)\u003c/h2>\n\u003cp>\u003ccode>POST /api/bookings/{id}/cancellations\u003c/code> — как «факт отмены»-ресурс; причина отмены становится телом, история — списком cancellations. GraphQL имел бы смысл, если бы появился дашборд с рейтингом комнат: один запрос возьмёт и брони, и комнаты, и участников.\u003c/p>\n"}]},{"id":"m3-lesson-01","title":"Реляционная база и SQL-минимум","module":3,"moduleTitle":"Данные","order":1,"lab":null,"html":"\u003ch1>Урок 1. Реляционная база и SQL-минимум\u003c/h1>\n\u003cp>До сих пор база была «чёрным ящиком»: репозиторий сам что-то делал. Модуль — про то, что внутри: таблицы, ключи, запросы, транзакции. Половина бэкенд-багов — это SQL-проблемы, надетые на Java. Начнём с фундамента — реляционной модели.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитики:\u003c/strong> этот урок — ваша территория: вы давно живёте в таблицах и JOIN'ах. Задача — освежить термины, потому что дальше весь модуль говорит на этом языке. А вот уроки 2–3 покажут вам, во что превращаются ваши таблицы в Java-кодe.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Таблицы, строки, колонки\u003c/h2>\n\u003cp>Реляционная база — набор \u003cstrong>таблиц\u003c/strong>. У таблицы фиксированные \u003cstrong>колонки\u003c/strong> (типизированные) и любое количество \u003cstrong>строк\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">CREATE TABLE\u003c/span> tasks (\n    id          \u003cspan class=\"hljs-type\">BIGINT\u003c/span> \u003cspan class=\"hljs-keyword\">PRIMARY KEY\u003c/span>,\n    project_id  \u003cspan class=\"hljs-type\">BIGINT\u003c/span> \u003cspan class=\"hljs-keyword\">NOT NULL\u003c/span>,\n    title       \u003cspan class=\"hljs-type\">VARCHAR\u003c/span>(\u003cspan class=\"hljs-number\">200\u003c/span>) \u003cspan class=\"hljs-keyword\">NOT NULL\u003c/span>,\n    done        \u003cspan class=\"hljs-type\">BOOLEAN\u003c/span> \u003cspan class=\"hljs-keyword\">NOT NULL\u003c/span> \u003cspan class=\"hljs-keyword\">DEFAULT\u003c/span> \u003cspan class=\"hljs-literal\">FALSE\u003c/span>,\n    deadline    \u003cspan class=\"hljs-type\">DATE\u003c/span>\n);\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>PRIMARY KEY\u003c/strong> — первичный ключ: значение, однозначно идентифицирующее строку. У нас — \u003ccode>id\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>NOT NULL\u003c/strong> — поле обязательно.\u003c/li>\n\u003cli>\u003cstrong>DEFAULT\u003c/strong> — значение по умолчанию.\u003c/li>\n\u003c/ul>\n\u003ch2>Связи: внешний ключ\u003c/h2>\n\u003cp>Таблицы связываются \u003cstrong>внешним ключом\u003c/strong> (FOREIGN KEY): колонка в одной таблице указывает на первичный ключ другой:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">CREATE TABLE\u003c/span> projects (\n    id   \u003cspan class=\"hljs-type\">BIGINT\u003c/span> \u003cspan class=\"hljs-keyword\">PRIMARY KEY\u003c/span>,\n    name \u003cspan class=\"hljs-type\">VARCHAR\u003c/span>(\u003cspan class=\"hljs-number\">100\u003c/span>) \u003cspan class=\"hljs-keyword\">NOT NULL\u003c/span>\n);\n\n\u003cspan class=\"hljs-keyword\">ALTER TABLE\u003c/span> tasks\n    \u003cspan class=\"hljs-keyword\">ADD CONSTRAINT\u003c/span> fk_tasks_project\n    \u003cspan class=\"hljs-keyword\">FOREIGN KEY\u003c/span> (project_id) \u003cspan class=\"hljs-keyword\">REFERENCES\u003c/span> projects (id);\n\u003c/code>\u003c/pre>\n\u003cp>Теперь \u003ccode>tasks.project_id\u003c/code> обязан существовать в \u003ccode>projects.id\u003c/code> — база не даст записать задачу «в никуда». Это \u003cstrong>ссылочная целостность\u003c/strong>: база охраняет связи, а не полагается на аккуратность кода.\u003c/p>\n\u003cp>Виды связей, которые встречаются постоянно:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Связь\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003cth>Как выражена\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>один-ко-многим\u003c/td>\n\u003ctd>проект → задачи\u003c/td>\n\u003ctd>FK на стороне «многих» (\u003ccode>tasks.project_id\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>один-к-одному\u003c/td>\n\u003ctd>пользователь → паспорт\u003c/td>\n\u003ctd>FK + уникальность\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>многие-ко-многим\u003c/td>\n\u003ctd>задачи ↔ исполнители\u003c/td>\n\u003ctd>отдельная таблица-связка \u003ccode>task_assignees(task_id, user_id)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>SQL: четыре главных глагола\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-comment\">-- прочитать\u003c/span>\n\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> id, title, done \u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> \u003cspan class=\"hljs-keyword\">ORDER\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> deadline;\n\n\u003cspan class=\"hljs-comment\">-- вставить\u003c/span>\n\u003cspan class=\"hljs-keyword\">INSERT INTO\u003c/span> tasks (project_id, title, done) \u003cspan class=\"hljs-keyword\">VALUES\u003c/span> (\u003cspan class=\"hljs-number\">7\u003c/span>, \u003cspan class=\"hljs-string\">&#x27;Купить молоко&#x27;\u003c/span>, \u003cspan class=\"hljs-literal\">false\u003c/span>);\n\n\u003cspan class=\"hljs-comment\">-- изменить\u003c/span>\n\u003cspan class=\"hljs-keyword\">UPDATE\u003c/span> tasks \u003cspan class=\"hljs-keyword\">SET\u003c/span> done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span> \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>;\n\n\u003cspan class=\"hljs-comment\">-- удалить\u003c/span>\n\u003cspan class=\"hljs-keyword\">DELETE\u003c/span> \u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cp>Джойн — соединение таблиц по связи:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name \u003cspan class=\"hljs-keyword\">AS\u003c/span> project, t.title\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks t\n\u003cspan class=\"hljs-keyword\">JOIN\u003c/span> projects p \u003cspan class=\"hljs-keyword\">ON\u003c/span> p.id \u003cspan class=\"hljs-operator\">=\u003c/span> t.project_id\n\u003cspan class=\"hljs-keyword\">WHERE\u003c/span> t.done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cp>Читается: возьми задачи, к каждой приклей её проект по \u003ccode>project_id = id\u003c/code>, оставь несделанные.\u003c/p>\n\u003cp>Агрегация — когда нужен не список, а число:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name, \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-keyword\">AS\u003c/span> open_tasks\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks t\n\u003cspan class=\"hljs-keyword\">JOIN\u003c/span> projects p \u003cspan class=\"hljs-keyword\">ON\u003c/span> p.id \u003cspan class=\"hljs-operator\">=\u003c/span> t.project_id\n\u003cspan class=\"hljs-keyword\">WHERE\u003c/span> t.done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>\n\u003cspan class=\"hljs-keyword\">GROUP\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> p.name\n\u003cspan class=\"hljs-keyword\">HAVING\u003c/span> \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-operator\">&gt;\u003c/span> \u003cspan class=\"hljs-number\">5\u003c/span>\n\u003cspan class=\"hljs-keyword\">ORDER\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> open_tasks \u003cspan class=\"hljs-keyword\">DESC\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003ch2>Индексы: почему одни запросы быстрые, а другие — вечные\u003c/h2>\n\u003cp>Без индекса \u003ccode>WHERE title = '...'\u003c/code> — \u003cstrong>полный перебор\u003c/strong> всех строк (full scan). Индекс — отсортированная структура (B-дерево) по колонке: поиск по ней — логарифмический, как в оглавлении книги.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">CREATE\u003c/span> INDEX idx_tasks_project \u003cspan class=\"hljs-keyword\">ON\u003c/span> tasks (project_id);\n\u003c/code>\u003c/pre>\n\u003cp>Правила выживания:\u003c/p>\n\u003cul>\n\u003cli>PK и FK индексируются (FK не всегда автоматически — зависит от БД, проверяйте)\u003c/li>\n\u003cli>Индекс ускоряет \u003ccode>WHERE\u003c/code>, \u003ccode>JOIN\u003c/code>, \u003ccode>ORDER BY\u003c/code> по этой колонке\u003c/li>\n\u003cli>Индекс не бесплатен: каждый INSERT/UPDATE чуть медленнее, индексы занимают место\u003c/li>\n\u003cli>«Запрос внезапно стал медленным» — почти всегда «данные выросли, а индекса нет»\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> если фича «тормозит на проде, а локально мгновенно» — классика: локально 100 строк (перебор незаметен), на проде 10 миллионов. Спросите про индекс и план запроса (EXPLAIN) — звучите как король багрэйтов.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Из Java это видно как…\u003c/h2>\n\u003cp>Всё, что вы узнали, напрямую отражается в коде:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>В базе\u003c/th>\n\u003cth>В Java (Spring)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Таблица \u003ccode>tasks\u003c/code>\u003c/td>\n\u003ctd>entity-класс \u003ccode>Task\u003c/code> с \u003ccode>@Entity\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Колонка \u003ccode>title\u003c/code>\u003c/td>\n\u003ctd>поле \u003ccode>title\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PK \u003ccode>id\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>@Id @GeneratedValue\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FK \u003ccode>project_id\u003c/code>\u003c/td>\n\u003ctd>поле связи \u003ccode>@ManyToOne Project project\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>SELECT ... WHERE done=false\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>findByDone(false)\u003c/code> репозитория\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Индекс\u003c/td>\n\u003ctd>\u003ccode>@Table(indexes = @Index(...))\u003c/code> или миграция\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Подробно это соответствие — урок 2. А пока зафиксируем язык.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Таблицы + строки/колонки; PK — идентичность строки, FK — связь и ссылочная целостность\u003c/li>\n\u003cli>Связи: один-ко-многим через FK у «многих», многие-ко-многим — через таблицу-связку\u003c/li>\n\u003cli>SQL: SELECT/INSERT/UPDATE/DELETE + JOIN + GROUP BY\u003c/li>\n\u003cli>Индексы ускоряют поиск по колонке, но стоят при записи; full scan на больших данных — источник «внезапных» тормозов\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Почему внешний ключ (FOREIGN KEY) — это защита, а не просто договорённость?","options":["База сама отклонит запись со значением project_id, которого нет в projects","Он автоматически создаёт индекс во всех СУБД","Он шифрует связь между таблицами","Он ускоряет все запросы к обеим таблицам"],"correct":0,"explanation":"Ссылочная целостность — гарантия СУБД: «задача из несуществующего проекта» не может существовать, какой бы баг ни был в Java. Индекс по FK создаётся не всегда — это отдельная забота."},{"type":"single","codeLang":"sql","code":"SELECT p.name, COUNT(*) AS cnt\nFROM tasks t\nJOIN projects p ON p.id = t.project_id\nGROUP BY p.name\nHAVING COUNT(*) > 5;\n","question":"Что вернёт этот запрос?","options":["Проекты, у которых больше пяти задач (всех), с количеством","Все проекты с их задачами построчно","Только пять задач на каждый проект","Проекты с более чем пятью невыполненными задачами"],"correct":0,"explanation":"JOIN соединяет, GROUP BY сворачивает по проекту, HAVING фильтрует уже агрегированные группы. Фильтра по done нет — считаются все задачи. Отфильтровать до агрегации мог бы WHERE.","codeHtml":"\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name, \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-keyword\">AS\u003c/span> cnt\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks t\n\u003cspan class=\"hljs-keyword\">JOIN\u003c/span> projects p \u003cspan class=\"hljs-keyword\">ON\u003c/span> p.id \u003cspan class=\"hljs-operator\">=\u003c/span> t.project_id\n\u003cspan class=\"hljs-keyword\">GROUP\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> p.name\n\u003cspan class=\"hljs-keyword\">HAVING\u003c/span> \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-operator\">&gt;\u003c/span> \u003cspan class=\"hljs-number\">5\u003c/span>;\n"},{"type":"multi","question":"Какие утверждения об индексах верны? (несколько ответов)","options":["Индекс ускоряет поиск и сортировку по проиндексированной колонке","Каждый индекс замедляет вставку и обновление строк","Индексы бесплатны и их надо ставить на все колонки","Запрос по непроиндексированной колонке на большой таблице — полный перебор"],"correct":[0,1,3],"explanation":"Индекс — компромисс: быстрые чтения ценой медленной записи и места. «Индексов много» — тоже антипаттерн: пишите только то, по чему ищут."},{"type":"match","question":"Сопоставь концепцию базы и её отражение в Java/Spring.","pairs":[{"left":"Таблица tasks","right":"@Entity класс Task"},{"left":"Колонка title","right":"Поле title"},{"left":"Внешний ключ project_id","right":"Поле @ManyToOne Project project"},{"left":"WHERE done = false","right":"findByDone(false) репозитория"}]},{"type":"blank","question":"Какой оператор SQL соединяет строки двух таблиц по условию связи? (одно слово, большими буквами)","answers":["JOIN"],"explanation":"JOIN ... ON условие. В Spring Data он прячется внутри связей entity и @Query, но под каждым — JOIN."},{"type":"single","question":"Фича на проде отвечает 30 секунд, локально — мгновенно. Первая гипотеза бэкендера?","options":["На проде данных на порядки больше и запрос идёт полным перебором без индекса","Прод-сервер слабее ноутбука","Java на проде другой версии","Сеть медленная между сервисами"],"correct":0,"explanation":"Классика масштабирования: full scan на 10 млн строк заметен, на 100 строках — нет. EXPLAIN и индекс — штатное лечение."},{"type":"single","question":"Задачи и исполнители: у задачи много исполнителей, у исполнителя много задач. Какая схема верна?","options":["Отдельная таблица task_assignees(task_id, user_id) с двумя FK","Колонка assignees в tasks со списком через запятую","Внешний ключ user_id прямо в tasks","Дублировать задачи для каждого исполнителя"],"correct":0,"explanation":"Многие-ко-многим — таблица-связка с FK на обе стороны. Список в колонке ломает целостность и поиск; FK в tasks дал бы только одного исполнителя."}]],"cases":[]},{"id":"m3-lesson-02","title":"JPA и Hibernate: объекты и таблицы","module":3,"moduleTitle":"Данные","order":2,"lab":null,"html":"\u003ch1>Урок 2. JPA и Hibernate: объекты и таблицы\u003c/h1>\n\u003cp>В пилоте entity была одной таблицей без связей. Реальные сущности связаны: у проекта — задачи, у задачи — комментарии. Разберём, как связи живут в Java, кто и когда ходит в базу, и почему «ленивость» — не оскорбление, а способ выжить.\u003c/p>\n\u003ch2>Entity со связью\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Entity\u003c/span>\n\u003cspan class=\"hljs-meta\">@Table(name = &quot;projects&quot;)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Setter\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Project\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Id\u003c/span>\n    \u003cspan class=\"hljs-meta\">@GeneratedValue(strategy = GenerationType.IDENTITY)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long id;\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String name;\n\n    \u003cspan class=\"hljs-comment\">// один проект — много задач\u003c/span>\n    \u003cspan class=\"hljs-meta\">@OneToMany(mappedBy = &quot;project&quot;, cascade = CascadeType.ALL, orphanRemoval = true)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-variable\">tasks\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ArrayList\u003c/span>&lt;&gt;();\n}\n\n\u003cspan class=\"hljs-meta\">@Entity\u003c/span>\n\u003cspan class=\"hljs-meta\">@Table(name = &quot;tasks&quot;)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Setter\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Task\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Id\u003c/span>\n    \u003cspan class=\"hljs-meta\">@GeneratedValue(strategy = GenerationType.IDENTITY)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long id;\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String title;\n\n    \u003cspan class=\"hljs-comment\">// много задач — один проект: ВЛАДЕЛЕЦ связи (колонка project_id в tasks)\u003c/span>\n    \u003cspan class=\"hljs-meta\">@ManyToOne(fetch = FetchType.LAZY)\u003c/span>\n    \u003cspan class=\"hljs-meta\">@JoinColumn(name = &quot;project_id&quot;)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Project project;\n}\n\u003c/code>\u003c/pre>\n\u003cp>Правило запоминания: \u003cstrong>владелец связи — сторона с внешним ключом\u003c/strong>. У нас FK в \u003ccode>tasks\u003c/code>, значит владелец — \u003ccode>Task.project\u003c/code>, а \u003ccode>Project.tasks\u003c/code> — «зеркальная» сторона (\u003ccode>mappedBy\u003c/code> говорит: «смотри колонцию на той стороне»).\u003c/p>\n\u003cp>Что даёт связь в коде:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>).orElseThrow();\n\u003cspan class=\"hljs-type\">String\u003c/span> \u003cspan class=\"hljs-variable\">projectName\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> task.getProject().getName();   \u003cspan class=\"hljs-comment\">// без ручного JOIN!\u003c/span>\n\u003c/code>\u003c/pre>\n\u003ch2>CascadeType: кто за кем тянет\u003c/h2>\n\u003cp>\u003ccode>cascade = ALL\u003c/code> на \u003ccode>Project.tasks\u003c/code> — операции передаются вниз по связи:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>persist(project)\u003c/code> — сохранился и проект, и его новые задачи\u003c/li>\n\u003cli>\u003ccode>remove(project)\u003c/code> — удалился проект \u003cstrong>и его задачи\u003c/strong> (плюс \u003ccode>orphanRemoval\u003c/code>: убрал задачу из списка — она удалилась)\u003c/li>\n\u003c/ul>\n\u003cp>Опасно и удобно одновременно: каскад \u003ccode>ALL\u003c/code> с \u003ccode>remove\u003c/code> может снести больше, чем хотелось. В командных проектах часто ставят точечно: \u003ccode>cascade = {PERSIST, MERGE}\u003c/code>.\u003c/p>\n\u003ch2>Lazy: не тянуть лишнее\u003c/h2>\n\u003cp>\u003ccode>@ManyToOne(fetch = LAZY)\u003c/code> — при загрузке задачи её проект \u003cstrong>не загружается\u003c/strong>: вместо объекта Hibernate кладёт прокси-заглушку. Настоящий SELECT за проектом случится только при первом обращении:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>).orElseThrow();  \u003cspan class=\"hljs-comment\">// SELECT из tasks\u003c/span>\ntask.getProject().getName();                              \u003cspan class=\"hljs-comment\">// SELECT из projects — вот сейчас\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>@OneToMany\u003c/code> по умолчанию ленив (и оставляйте так). \u003ccode>@ManyToOne\u003c/code>/\u003ccode>@OneToOne\u003c/code> по умолчанию жадные (\u003cstrong>EAGER\u003c/strong>) — и это худшее значение по умолчанию в JPA: кладёте \u003ccode>LAZY\u003c/code> руками почти всегда.\u003c/p>\n\u003cp>Почему ленивость важна: без неё чтение одной задачи тянуло бы проект, проект — все его задачи, каждая задача — комментарии… «Взял один объект — загрузил полбазы».\u003c/p>\n\u003ch2>Ловушка LazyInitializationException\u003c/h2>\n\u003cp>Ленивость работает, только пока открыт \u003cstrong>контекст персистентности\u003c/strong> (Hibernate-сессия). Классика Spring:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">business\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n    \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>).orElseThrow();\n    \u003cspan class=\"hljs-keyword\">return\u003c/span> task.getProject().getName();  \u003cspan class=\"hljs-comment\">// ок: сессия открыта\u003c/span>\n}\n\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">broken\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n    \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>).orElseThrow();\n    task.getProject().getName();  \u003cspan class=\"hljs-comment\">// LazyInitializationException!\u003c/span>\n                                     \u003cspan class=\"hljs-comment\">// транзакции нет, сессия закрыта\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Лечение — не «сделать EAGER», а загрузить нужное внутри транзакции (следующий урок — как, через JOIN FETCH).\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> \u003ccode>LazyInitializationException\u003c/code> в логах = код обратился к ленивой связи за пределами транзакции. Это не «база сломалась», это бордер-эффект слоёв: репозиторий отдал объект, а хвостик догрузить некому.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Hibernate генерирует SQL\u003c/h2>\n\u003cp>Что видит база под кодом (включите \u003ccode>spring.jpa.show-sql: true\u003c/code> в деве — и смотрите):\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Код\u003c/th>\n\u003cth>SQL\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>findById(42)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>SELECT ... FROM tasks WHERE id = 42\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>task.getProject().getName()\u003c/code> (lazy)\u003c/td>\n\u003ctd>\u003ccode>SELECT ... FROM projects WHERE id = ?\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>save(newTask)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>INSERT INTO tasks ...\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>изменение managed-entity внутри транзакции\u003c/td>\n\u003ctd>\u003ccode>UPDATE tasks SET ... WHERE id = ?\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Последняя строка — самое неочевидное: в транзакции Hibernate сам сравнивает снимок entity с текущим состоянием (\u003cstrong>dirty checking\u003c/strong>) и сам генерирует UPDATE. Изменил поле — не вызывай \u003ccode>save()\u003c/code>, коммит транзакции всё сохранит.\u003c/p>\n\u003ch2>Идентичность: equals/hashCode\u003c/h2>\n\u003cp>Две загрузки \u003ccode>findById(42)\u003c/code> внутри одной транзакции — \u003cstrong>один и тот же объект\u003c/strong> (кэш первого уровня — сессии). \u003ccode>new Task(42)\u003c/code> и \u003ccode>findById(42)\u003c/code> — разные объекты по Java, но одна строка в базе. Поэтому у entity \u003ccode>equals/hashCode\u003c/code> строят по бизнес-ключу или id, а не по всем полям; в лабах мы этим займёмся.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Связи: владелец — сторона с FK (\u003ccode>@ManyToOne\u003c/code> + \u003ccode>@JoinColumn\u003c/code>), зеркальная — \u003ccode>mappedBy\u003c/code>\u003c/li>\n\u003cli>Каскады передают операции по связи — удобно, но с \u003ccode>remove\u003c/code> осторожно\u003c/li>\n\u003cli>\u003ccode>LAZY\u003c/code> по умолчанию для коллекций, руками — для \u003ccode>@ManyToOne\u003c/code>; иначе «загрузил одно — получил полбазы»\u003c/li>\n\u003cli>Ленивое догружается только в открытой сессии: вне транзакции — \u003ccode>LazyInitializationException\u003c/code>\u003c/li>\n\u003cli>Dirty checking: изменение managed-entity внутри транзакции само становится UPDATE\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — про производительность: знаменитая проблема N+1 и как её лечить.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"У Task есть @ManyToOne @JoinColumn(name = \"project_id\") Project project, а у Project — @OneToMany(mappedBy = \"project\"). Кто владелец связи?","options":["Task: владелец — сторона, где колонка внешнего ключа","Project: у него список","Обе стороны владеют поровну","Никто: связью управляет база"],"correct":0,"explanation":"Владение — про колонку FK: она в tasks, значит владелец Task.project. mappedBy на Project лишь отражает связь, записи в неё не влияют на базу."},{"type":"single","codeLang":"java","code":"@Transactional\npublic String projectName(Long taskId) {\n    Task task = taskRepository.findById(taskId).orElseThrow();\n    return task.getProject().getName();\n}\n","question":"Сколько SELECT-запросов выполнит этот код (связь LAZY, проект не кэширован)?","options":["Два: сначала задача, потом проект при обращении к getName()","Один: Hibernate догрузит всё сразу","Ни одного: вернётся прокси","Три: задача, проект и имя отдельно"],"correct":0,"explanation":"findById — SELECT из tasks. getName() на ленивом прокси — второй SELECT из projects. Внутри транзакции это работает; вне её было бы LazyInitializationException.","codeHtml":"\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">String\u003c/span> \u003cspan class=\"hljs-title function_\">projectName\u003c/span>\u003cspan class=\"hljs-params\">(Long taskId)\u003c/span> {\n    \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(taskId).orElseThrow();\n    \u003cspan class=\"hljs-keyword\">return\u003c/span> task.getProject().getName();\n}\n"},{"type":"multi","question":"Почему @ManyToOne стоит помечать LAZY руками? (несколько ответов)","options":["По умолчанию он EAGER и грузит связанную сущность всегда, даже когда она не нужна","Жадные связи расцветают цепочкой: задача → проект → все его задачи → их комментарии","LAZY ускоряет запись в базу","EAGER ломает схему таблиц"],"correct":[0,1],"explanation":"Проблема EAGER — чтение: тянутся объекты, которые не просили, и каскадом ещё объекты. На запись fetch не влияет."},{"type":"single","question":"В логах продакшена LazyInitializationException. Что произошло?","options":["К коде обратились к ленивой связи после закрытия транзакции/сессии","База данных недоступна","Не хватило памяти под объект","Пароль от базы истёк"],"correct":0,"explanation":"Ленивый прокси умеет догрузиться только пока открыта сессия. Вне транзакции (например, в маппере после выхода из @Transactional-метода) обращение падает с этим исключением."},{"type":"blank","question":"Как называется механизм, при котором Hibernate сам сравнивает состояние entity в сессии с исходным снимком и генерирует UPDATE без явного вызова save()? (два слова: ___ checking)","answers":["dirty checking","dirty"],"explanation":"Dirty checking: «грязное» (изменённое) поле найдено — при коммите транзакции Hibernate сам выполнит UPDATE."},{"type":"single","codeLang":"java","code":"@OneToMany(mappedBy = \"project\", cascade = CascadeType.ALL, orphanRemoval = true)\nprivate List\u003cTask> tasks = new ArrayList\u003c>();\n","question":"Что сделает удаление проекта с такой настройкой?","options":["Удалит проект и все его задачи из базы","Удалит только проект, задачи останутся без проекта (если база позволит)","Удалит только задачи","Ничего: каскад запрещает удаление"],"correct":0,"explanation":"CascadeType.ALL передаёт remove вниз, orphanRemoval добивает «осиротевшие» задачи. Мощно — и опасно: проверяйте, действительно ли вы хотите снести всё поддерево.","codeHtml":"\u003cspan class=\"hljs-meta\">@OneToMany(mappedBy = &quot;project&quot;, cascade = CascadeType.ALL, orphanRemoval = true)\u003c/span>\n\u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-variable\">tasks\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ArrayList\u003c/span>&lt;&gt;();\n"},{"type":"match","question":"Сопоставь код и SQL, который сгенерирует Hibernate.","pairs":[{"left":"findById(42L)","right":"SELECT ... WHERE id = 42"},{"left":"repository.save(newTask)","right":"INSERT INTO tasks ..."},{"left":"изменение поля managed-entity в транзакции","right":"UPDATE tasks SET ... при коммите"},{"left":"обращение к ленивому task.getProject()","right":"SELECT ... FROM projects WHERE id = ?"}]}]],"cases":[]},{"id":"m3-lesson-03","title":"N+1 и производительность запросов","module":3,"moduleTitle":"Данные","order":3,"lab":null,"html":"\u003ch1>Урок 3. N+1 и производительность запросов\u003c/h1>\n\u003cp>Этот урок — про самую знаменитую производительную болезнь Spring-приложений. Она не видна на локале с десятью строками и выстреливает на проде с десятью тысячами. Умеете видеть N+1 — умеете читать чужие «почему так медленно».\u003c/p>\n\u003ch2>Проблема\u003c/h2>\n\u003cp>Задача: список проектов, у каждого — количество задач. Наивный код:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">List\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-variable\">projects\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> projectRepository.findAll();      \u003cspan class=\"hljs-comment\">// 1 запрос\u003c/span>\n\u003cspan class=\"hljs-keyword\">for\u003c/span> (Project p : projects) {\n    \u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-variable\">n\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> p.getTasks().size();                            \u003cspan class=\"hljs-comment\">// N запросов!\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Что происходит в базе:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">SELECT * FROM projects;                      -- 1 раз\nSELECT * FROM tasks WHERE project_id = 1;    -- для первого проекта\nSELECT * FROM tasks WHERE project_id = 2;    -- для второго\n...\nSELECT * FROM tasks WHERE project_id = N;    -- для N-го\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>1 + N запросов\u003c/strong> — отсюда имя. 50 проектов = 51 поездка в базу. Каждая поездка — сеть, парсинг, план запроса. Локально всё мгновенно, на проде — секунды.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> симптом N+1 — «эндпоинт линейно замедляется с ростом данных» и лес одинаковых SELECT'ов в логах. Включите \u003ccode>spring.jpa.properties.hibernate.generate_statistics=true\u003c/code> на стенде: в логе будет «JDBC statements» — и их количество скажет всё.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Лечение 1: JOIN FETCH\u003c/h2>\n\u003cp>Сказать Hibernate: «грузи задачи сразу вместе с проектами, одним запросом»:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">ProjectRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Project, Long&gt; {\n\n    \u003cspan class=\"hljs-meta\">@Query(&quot;select distinct p from Project p left join fetch p.tasks&quot;)\u003c/span>\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-title function_\">findAllWithTasks\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span>;\n}\n\u003c/code>\u003c/pre>\n\u003cp>Сгенерированный SQL — один: \u003ccode>SELECT ... FROM projects p LEFT JOIN tasks t ON ...\u003c/code>. Прокси не нужны, сессия закрывается — данные уже на месте (заодно решает LazyInitializationException из прошлого урока).\u003c/p>\n\u003cp>\u003ccode>distinct\u003c/code> в JPQL — важная деталь: JOIN размножает строки проектов (проект × каждая задача), Hibernate дедуплицирует.\u003c/p>\n\u003ch2>Лечение 2: @EntityGraph\u003c/h2>\n\u003cp>То же самое без JPQL, декларативно:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">ProjectRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Project, Long&gt; {\n\n    \u003cspan class=\"hljs-meta\">@EntityGraph(attributePaths = &quot;tasks&quot;)\u003c/span>\n    \u003cspan class=\"hljs-meta\">@Query(&quot;select p from Project p&quot;)\u003c/span>\n    List&lt;Project.findAllWithTasks();   \u003cspan class=\"hljs-comment\">// или совсем без @Query — на derived-методах\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>attributePaths\u003c/code> перечисляет, какие ленивые связи догрузить сразу. Идеально, когда граф фиксированный.\u003c/p>\n\u003ch2>Когда лечить не надо\u003c/h2>\n\u003cp>Если бы нужно только \u003cstrong>количество\u003c/strong> задач — тащить сами задачи расточительно. Правильнее считать в базе:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Query(&quot;select p.name, count(t) from Project p left join p.tasks t group by p.name&quot;)\u003c/span>\n\u003cspan class=\"hljs-type\">List\u003c/span>&lt;Object[]&gt; \u003cspan class=\"hljs-title function_\">projectNameToTaskCount\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span>;   \u003cspan class=\"hljs-comment\">// или сразу в DTO-проекцию\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Правило: \u003cstrong>не тяните в Java то, что база посчитает дешевле\u003c/strong>. COUNT, SUM, сортировка, первая страница — это работа СУБД.\u003c/p>\n\u003ch2>Пагинация на уровне базы\u003c/h2>\n\u003cp>\u003ccode>findAll()\u003c/code> на большой таблице — вернуть миллион строк в память приложения. Пагинация обязательна, и она должна быть \u003cstrong>в SQL\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Page\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-variable\">page\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> projectRepository.findAll(PageRequest.of(\u003cspan class=\"hljs-number\">0\u003c/span>, \u003cspan class=\"hljs-number\">20\u003c/span>));  \u003cspan class=\"hljs-comment\">// LIMIT 20 OFFSET 0\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Spring Data добавит \u003ccode>LIMIT/OFFSET\u003c/code> и отдельно посчитает тотал. Пагинация стрим-ом в Java (\u003ccode>list.stream().skip(...).limit(...)\u003c/code>) — антипаттерн: все строки уже в памяти.\u003c/p>\n\u003cp>Осторожно с \u003ccode>Page\u003c/code> + \u003ccode>JOIN FETCH\u003c/code> на коллекции: LIMIT в SQL размноженном JOIN'ом режет не проекты, а строки — Hibernate честно предупредит (HHH000104). Для «страница с подтянутой коллекцией» используют два запроса или \u003ccode>@BatchSize\u003c/code>.\u003c/p>\n\u003ch2>@BatchSize: золотая середина\u003c/h2>\n\u003cpre>\u003ccode class=\"language-properties\">\u003cspan class=\"hljs-attr\">spring.jpa.properties.hibernate.default_batch_fetch_size\u003c/span>=\u003cspan class=\"hljs-string\">16\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Вместо N запросов по одному Hibernate соберёт их в пачки \u003ccode>IN (...)\u003c/code>: \u003ccode>SELECT ... WHERE project_id IN (1,2,...,16)\u003c/code>. Из 51 запроса станет ~4. Не идеал одного JOIN'а, но решает проблему массово и без правок каждого запроса.\u003c/p>\n\u003ch2>Как заметить N+1 до прода\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Логи SQL в деве\u003c/strong>: \u003ccode>spring.jpa.show-sql=true\u003c/code> — лес одинаковых SELECT'ов виден глазами\u003c/li>\n\u003cli>\u003cstrong>Статистика Hibernate\u003c/strong> на тестовом стенде: количество statements на запрос\u003c/li>\n\u003cli>\u003cstrong>Тесты данных\u003c/strong>: в лабе этого модуля тест сам посчитает запросы к базе и покраснеет, если их слишком много\u003c/li>\n\u003cli>\u003cstrong>Прод-метрики\u003c/strong>: время ответа растёт с данными — включайте точечный лог медленных запросов\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> если бэкенд отдаёт список медленно — попросите включить SQL-логи. N+1 часто лечится одной аннотацией на репозитории, а «оптимизация фронта» тут бессильна. Теперь вы знаете, как назвать болезнь 🙂\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>N+1: 1 запрос за списком + N за ленивыми связями каждого элемента; локально незаметно, на проде больно\u003c/li>\n\u003cli>Лечение: \u003ccode>JOIN FETCH\u003c/code> в @Query или \u003ccode>@EntityGraph(attributePaths=...)\u003c/code> — один SQL со связью\u003c/li>\n\u003cli>Считать (count/sum/первые N) — в базе, проекциями и агрегатами, не в Java\u003c/li>\n\u003cli>Пагинация — только через \u003ccode>Pageable\u003c/code> (LIMIT/OFFSET в SQL)\u003c/li>\n\u003cli>\u003ccode>default_batch_fetch_size\u003c/code> — массовая полумера: пачки \u003ccode>IN (...)\u003c/code> вместо одиночек\u003c/li>\n\u003cli>Показатель здоровья: количество SQL-запросов на операцию — логи, статистика, тесты\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","codeLang":"java","code":"List\u003cProject> projects = projectRepository.findAll();   // 1\nfor (Project p : projects) {\n    report.add(p.getName() + \": \" + p.getTasks().size()); // связь LAZY\n}\n","question":"В базе 40 проектов. Сколько SQL-запросов сделает этот код?","options":["41: один за проектами и по одному за задачи каждого","1: задачи подгрузятся в том же запросе","40: только запросы за задачами","2: проекты и все задачи одним списком"],"correct":0,"explanation":"Классический 1+N. Обращение к ленивой коллекции каждого проекта — отдельный SELECT. 40 проектов → 1 + 40 = 41 запрос.","codeHtml":"\u003cspan class=\"hljs-type\">List\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-variable\">projects\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> projectRepository.findAll();   \u003cspan class=\"hljs-comment\">// 1\u003c/span>\n\u003cspan class=\"hljs-keyword\">for\u003c/span> (Project p : projects) {\n    report.add(p.getName() + \u003cspan class=\"hljs-string\">&quot;: &quot;\u003c/span> + p.getTasks().size()); \u003cspan class=\"hljs-comment\">// связь LAZY\u003c/span>\n}\n"},{"type":"single","question":"Чем @EntityGraph(attributePaths = \"tasks\") на методе репозитория отличается от JOIN FETCH в @Query?","options":["По сути не отличаются: оба дают одну поездку в базу с LEFT JOIN; EntityGraph — декларативнее, без JPQL","EntityGraph работает только на findAll","JOIN FETCH грузит данные в память приложения, а EntityGraph — в базу","EntityGraph быстрее в 10 раз"],"correct":0,"explanation":"Оба механизма превращают ленивую связь в жадную для конкретного запроса одним SQL. Выбор — стиль команды: аннотация против JPQL."},{"type":"multi","question":"Какие приёмы уменьшат число запросов или нагрузку? (несколько ответов)","options":["hibernate.default_batch_fetch_size=16 — ленивые загрузки пачками IN (...)","Количество задач считать агрегатом в базе, а не getSize() по загруженным задачам","Постранично отдавать через Pageable вместо findAll()","Поставить @ManyToOne обратно EAGER — пусть грузится всегда"],"correct":[0,1,2],"explanation":"EAGER не лечит N+1, а делает его постоянным и неуправляемым: грузит связь даже там, где не просили."},{"type":"single","codeLang":"java","code":"@Query(\"select distinct p from Project p left join fetch p.tasks\")\nList\u003cProject> findAllWithTasks();\n","question":"Зачем здесь distinct?","options":["JOIN размножает строки (проект × задача); distinct просит Hibernate дедуплицировать проекты в памяти","Он добавляет DISTINCT в SQL — иначе не скомпилируется","Он включает пагинацию","Он ускоряет базу за счёт индекса"],"correct":0,"explanation":"В SQL строк действительно больше (это нормально), а distinct — сигнал Hibernate собрать из них уникальные entity. Без него проектов в списке было бы по числу задач.","codeHtml":"\u003cspan class=\"hljs-meta\">@Query(&quot;select distinct p from Project p left join fetch p.tasks&quot;)\u003c/span>\n\u003cspan class=\"hljs-type\">List\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-title function_\">findAllWithTasks\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span>;\n"},{"type":"single","question":"Нужна страница проектов: 20 штук, у каждого — задачи. Что НЕ так с page + JOIN FETCH на коллекции?","options":["LIMIT/OFFSET режет размноженные JOIN'ом строки: 20 «строк» ≠ 20 проектов — Hibernate предупредит HHH000104","Ничего: это штатная комбинация","JOIN FETCH не работает с Pageable","Страницы нельзя отдавать со связями"],"correct":0,"explanation":"Пагинация с fetch-коллекцией применяется к строкам JOIN, а не к сущностям. Решения: @BatchSize + обычная пагинация, два запроса (страница id → fetch по id) или проекция."},{"type":"blank","question":"Каким словом называется паттерн «1 запрос за списком + N запросов за связями»? (формат: N+1)","answers":["N+1","n+1"],"explanation":"N+1. Первое, что ищут в логах, когда «работало быстро и стало медленно»."},{"type":"single","question":"Эндпоинт «отчёт по проектам» грузит все проекты в память, стримом считает суммы по задачам и сортирует. База — миллион строк. С чего начать?","options":["Перенести агрегацию и сортировку в SQL-проекцию и добавить пагинацию","Поднять памяти под JVM","Добавить кэш на весь отчёт и не трогать код","Разбить отчёт на несколько эндпоинтов"],"correct":0,"explanation":"Миллион строк в память приложения — всегда проигрыш: сеть, GC, время. COUNT/SUM/GROUP BY и LIMIT — работа СУБД; Java получает готовые маленькие цифры."}]],"cases":[]},{"id":"m3-lesson-04","title":"Транзакции и изоляция","module":3,"moduleTitle":"Данные","order":4,"lab":null,"html":"\u003ch1>Урок 4. Транзакции и изоляция\u003c/h1>\n\u003cp>\u003ccode>@Transactional\u003c/code> в пилоте был заклинанием «всё или ничего». Теперь — что это значит на самом деле: ACID, уровни изоляции, аномалии гонок и блокировки. Это урок про то, что происходит, когда два пользователя жмут кнопку одновременно.\u003c/p>\n\u003ch2>ACID: четыре обещания транзакции\u003c/h2>\n\u003cp>\u003cstrong>Атомарность\u003c/strong> — всё или ничего: упало на середине — откат целиком.\n\u003cstrong>Согласованность\u003c/strong> — данные переходят из одного корректного состояния в другое: инварианты (сумма списания = сумме зачисления) не нарушаются.\n\u003cstrong>Изоляция\u003c/strong> — параллельные транзакции не видят чужие полусырые изменения.\n\u003cstrong>Долговечность\u003c/strong> — commit записан — переживёт перезагрузку сервера.\u003c/p>\n\u003cp>Spring-разработчик чаще всего сталкивается с А (откат) и I (гонки). Ими и займёмся.\u003c/p>\n\u003ch2>@Transactional: границы — это и есть смысл\u003c/h2>\n\u003cp>Транзакцию открывает \u003cstrong>первый\u003c/strong> запрос к базе внутри метода и закрывает коммит/откат на выходе:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">transfer\u003c/span>\u003cspan class=\"hljs-params\">(Long from, Long to, BigDecimal amount)\u003c/span> {\n    accountRepository.withdraw(from, amount);   \u003cspan class=\"hljs-comment\">// BEGIN\u003c/span>\n    \u003cspan class=\"hljs-keyword\">if\u003c/span> (кредитный лимит нарушен) {\n        \u003cspan class=\"hljs-keyword\">throw\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">IllegalStateException\u003c/span>(...);   \u003cspan class=\"hljs-comment\">// ROLLBACK: списание отменено\u003c/span>\n    }\n    accountRepository.deposit(to, amount);      \u003cspan class=\"hljs-comment\">// COMMIT на выходе\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Правила, которые экономят часы дебага:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Только публичные мет
