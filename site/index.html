цикл вешает весь топик, молчаливый скип теряет данные."},{"type":"single","topic":"m4-lesson-03","question":"Почему ретраи продюсера безопасны с enable.idempotence?","options":["Брокер помнит seq продюсера и отбрасывает повтор записи — дублей на стороне записи нет","Ретраи отключаются автоматически","Консюмер фильтрует дубли по магии","Сообщения шифруются"],"correct":0,"explanation":"Идемпотентность записи — про продюсера. Дубли чтения остаётся закрывать обработчиком."},{"type":"multi","topic":"m4-lesson-05","question":"Что входит в production-ready асинхронный контур? (несколько ответов)","options":["acks=all для доменных событий","Outbox для событий, которые обязаны случиться","Идемпотентные обработчики","Мониторинг лага и глубины DLT"],"correct":[0,1,2,3],"explanation":"Всё вместе: доставка подтверждена, публикация атомарна, эффекты идемпотентны, сбои наблюдаемы."},{"type":"single","topic":"m4-lesson-05","question":"События заказа обрабатываются с ретраями, v2 (cancelled) применилось раньше v1 (created). Защита?","options":["Версия события в payload: обработчик применяет только более новые версии","Ничего: порядок в партиции спасает","DLT для v1","Увеличить ретраи"],"correct":0,"explanation":"Порядок доставки ≠ порядок эффекта (ретраи/DLT ломают). Версии в событии — защита обработчика от устаревших состояний."},{"type":"single","topic":"m4-lesson-04","question":"Метрика «глубина DLT» вылетела в алерт. Что это значит для команды?","options":["Есть события, которые не обработались за все ретраи — разбор и починка обязательны, пока не потеряли бизнес-эффекты","Kafka сломалась, перезапустить брокер","Ничего: DLT — норма жизни","Добавить партиций"],"correct":0,"explanation":"DLT — видимый пазл ненадёжности: каждое событие там — возможно, непосланное письмо или незачисленный платёж. Разбор — процесс, не событие."},{"type":"blank","topic":"m4-lesson-05","question":"Назовите семантику: «событие может прийти повторно, но эффект обязателен ровно один» — практически это at-least-once + идемпотентность, или effectively-… (одно слово)","answers":["once","effectively-once"],"explanation":"Effectively-once — инженерный exactly-once: дублируются доставки, не эффекты."},{"type":"single","topic":"m4-lesson-01","question":"Итог. Сервис заказов должен уведомить 6 команд. Главное преимущество событий перед HTTP-вызовами?","options":["Заказ не знает потребителей и не зависит от их доступности: новые подписчики приходят без правок издателя","События быстрее HTTP","Не нужно тестировать","Kafka заменяет базу данных"],"correct":0,"explanation":"Развязка по знанию и по времени — суть перехода. Скорость — приятный бонус, а базу событий не заменяют."}]],"cases":[{"title":"Спроектируй события для интернет-магазина","task":"Магазин: заказы, платежи, склад, письма, аналитика. События уже частично есть: orders.created. Опишите: (1) какие ещё события нужны и как их назвать (домен.факт); (2) ключ каждого события и почему; (3) кто консюмеры и их группы; (4) какие события требуют outbox и строгой идемпотентности, а какие живут по-проще; (5) что делать, если 'payments.succeeded' иногда приходит дважды. Форма свободная.","placeholder":"Например:\norders.created — ключ orderId...\nmail-service (группа) читает ...\noutbox нужен для ...","referenceHtml":"\u003cp>Один из возможных ответов.\u003c/p>\n\u003ch2>События и ключи\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Событие\u003c/th>\n\u003cth>Ключ\u003c/th>\n\u003cth>Почему ключ\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>orders.created\u003c/code>\u003c/td>\n\u003ctd>orderId\u003c/td>\n\u003ctd>Порядок событий заказа\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>orders.cancelled\u003c/code>\u003c/td>\n\u003ctd>orderId\u003c/td>\n\u003ctd>Тот же ключ — та же партиция, порядок с created\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>payments.succeeded\u003c/code> / \u003ccode>payments.failed\u003c/code>\u003c/td>\n\u003ctd>orderId (или paymentId + версия)\u003c/td>\n\u003ctd>Обработка в порядке судьбы заказа\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>stock.reserved\u003c/code> / \u003ccode>stock.unavailable\u003c/code>\u003c/td>\n\u003ctd>orderId\u003c/td>\n\u003ctd>Резерв под конкретный заказ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>users.registered\u003c/code>\u003c/td>\n\u003ctd>userId\u003c/td>\n\u003ctd>Порядок событий пользователя\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Правило: ключ = сущность, чьи события обязаны идти по порядку. Имя = домен.факт.\u003c/p>\n\u003ch2>Консюмеры и группы\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>mail-service\u003c/code> (группа) — orders.created/cancelled: письма\u003c/li>\n\u003cli>\u003ccode>analytics\u003c/code> (группа) — всё: дашборды. Свои offset'ы, свой темп\u003c/li>\n\u003cli>\u003ccode>stock-service\u003c/code> (группа) — payments.succeeded: списание резерва\u003c/li>\n\u003cli>\u003ccode>search-indexer\u003c/code> (группа) — orders.\u003cem>, users.\u003c/em>: обновление поиска\u003c/li>\n\u003c/ul>\n\u003cp>Разные группы читают одни и те же топики независимо — каждый со своей закладкой.\u003c/p>\n\u003ch2>Уровни надёжности\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Событие\u003c/th>\n\u003cth>Подход\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>orders.created\u003c/td>\n\u003ctd>acks=all + \u003cstrong>outbox\u003c/strong> (заказ без события — баг интеграции) + идемпотентная обработка\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>payments.*\u003c/td>\n\u003ctd>acks=all + outbox + \u003cstrong>строгая идемпотентность\u003c/strong> (деньги)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>аналитические клики/просмотры\u003c/td>\n\u003ctd>at-most/at-least, дубли терпимы — без церемоний\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Дубли payments.succeeded\u003c/h2>\n\u003cp>At-least-once: повторы — норма доставки. Защита на стороне эффекта:\u003c/p>\n\u003cul>\n\u003cli>зачисление/списание — UPDATE по бизнес-ключу с естественной идемпотентностью (\u003ccode>WHERE status = 'PENDING'\u003c/code>);\u003c/li>\n\u003cli>таблица processed_events(eventId) в одной транзакции с эффектом;\u003c/li>\n\u003cli>версии событий для устаревших.\u003c/li>\n\u003c/ul>\n\u003cp>Итог: effectively-once = at-least-once + идемпотентный обработчик.\u003c/p>\n\u003ch2>Бонус: заказ без события (dual-write)\u003c/h2>\n\u003cp>Если публикация идёт из транзакции создания заказа — возможен заказ-призрак. Outbox: заказ + outbox_event одной транзакцией, релей публикует.\u003c/p>\n"}]},{"id":"m4-cheatsheet","title":"Шпаргалка модуля","module":4,"moduleTitle":"Kafka вглубь","order":7,"baseOrder":null,"lab":null,"html":"\u003ch1>Шпаргалка: Kafka\u003c/h1>\n\u003ch2>Словарь\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Термин\u003c/th>\n\u003cth>Смысл\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Topic\u003c/td>\n\u003ctd>Именованный лог событий (\u003ccode>домен.факт\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Partition\u003c/td>\n\u003ctd>Параллельный лог; единица порядка и масштаба\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ключ\u003c/td>\n\u003ctd>Хэш ключа → партиция; события одной сущности — по порядку\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Offset\u003c/td>\n\u003ctd>Номер события; закладка читателя, хранится на группу\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Consumer group\u003c/td>\n\u003ctd>Инстансы делят партиции; событие — ровно одному инстансу группы\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Retention\u003c/td>\n\u003ctd>Сколько topic хранит события (можно перечитать)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Lag\u003c/td>\n\u003ctd>Отставание группы от хвоста лога — главная метрика консюмера\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DLT\u003c/td>\n\u003ctd>Кладбище событий после N неудачных обработок\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Продюсер\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, String.valueOf(orderId), event);\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Настройка\u003c/th>\n\u003cth>Эффект\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>acks=all\u003c/code>\u003c/td>\n\u003ctd>Подтверждение репликами — норма для доменных событий\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>enable.idempotence=true\u003c/code>\u003c/td>\n\u003ctd>Ретраи не плодят дубли записи\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>ключ = orderId\u003c/td>\n\u003ctd>Порядок событий заказа\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Dual-write\u003c/strong>: БД + Kafka в одном методе = рассинхрон. Лечение — \u003cstrong>outbox\u003c/strong>: событие в таблицу в той же транзакции, релей публикует.\u003c/p>\n\u003ch2>Консюмер\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@KafkaListener(topics = &quot;orders.created&quot;, groupId = &quot;mail-service&quot;)\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Коммит offset'а \u003cstrong>после\u003c/strong> обработки: потерять нельзя, дубль — можно (at-least-once)\u003c/li>\n\u003cli>Обработчик обязан быть идемпотентным:\n\u003cul>\n\u003cli>\u003ccode>UPDATE ... SET status='X' WHERE status&lt;&gt;'X'\u003c/code> — естественно идемпотентно\u003c/li>\n\u003cli>\u003ccode>processed_events(eventId)\u003c/code> в одной транзакции с эффектом\u003c/li>\n\u003cli>версии событий против «v1 пришла после v2»\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Ядовитое сообщение → \u003ccode>@RetryableTopic\u003c/code> + \u003ccode>@DltHandler\u003c/code>, алерт на глубину DLT\u003c/li>\n\u003cli>Медленная обработка (&gt; \u003ccode>max.poll.interval.ms\u003c/code>) → выпадение из группы → ребалансы\u003c/li>\n\u003c/ul>\n\u003ch2>Семантики\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Семантика\u003c/th>\n\u003cth>Достигается\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>At-most-once\u003c/td>\n\u003ctd>Коммит до обработки (теряем)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>At-least-once\u003c/td>\n\u003ctd>Коммит после обработки (дублируем доставку)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Effectively-once\u003c/td>\n\u003ctd>At-least-once \u003cstrong>+ идемпотентный обработчик\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Правила выживания\u003c/h2>\n\u003cul>\n\u003cli>Имя topic'а — контракт: \u003ccode>orders.created\u003c/code>, не \u003ccode>events\u003c/code>\u003c/li>\n\u003cli>Уровень надёжности = цена потери события (клики ≠ платежи)\u003c/li>\n\u003cli>Outbox для обязательных событий; версиями — порядок; сагами — длинные процессы\u003c/li>\n\u003c/ul>\n","quizzes":[],"cases":[]},{"id":"m5-lesson-01","title":"Три столпа наблюдаемости","module":5,"moduleTitle":"Наблюдаемость","order":1,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 1. Три столпа наблюдаемости\u003c/h1>\n\u003cp>В пилоте вы трогали Actuator: \u003ccode>/actuator/health\u003c/code> и метрики «из коробки». Этот модуль — про то, как сделать сервис \u003cstrong>наблюдаемым по-настоящему\u003c/strong>: чтобы по дашборду было видно здоровье бизнеса, а по одному логу — вся история запроса. Начнём с карты местности.\u003c/p>\n\u003ch2>Мониторинг vs наблюдаемость\u003c/h2>\n\u003cp>\u003cstrong>Мониторинг\u003c/strong> — заранее известный набор проверок: «диск заполнен?», «сервис отвечает 200?». Отвечает на \u003cem>известные\u003c/em> вопросы.\u003c/p>\n\u003cp>\u003cstrong>Наблюдаемость\u003c/strong> — свойство системы: по её внешним сигналам можно понять \u003cem>неизвестное\u003c/em> — «почему у Анны из Твери корзина не оформляется прямо сейчас?». Мониторинг ловит известные отказы, наблюдаемость позволяет расследовать новые.\u003c/p>\n\u003cp>Три столпа наблюдаемости:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Столп\u003c/th>\n\u003cth>Формат\u003c/th>\n\u003cth>Вопрос\u003c/th>\n\u003cth>Инструменты\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Метрики\u003c/strong>\u003c/td>\n\u003ctd>числа во времени\u003c/td>\n\u003ctd>«Сколько? Как быстро? Как часто падает?»\u003c/td>\n\u003ctd>Micrometer → Prometheus, Grafana\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Логи\u003c/strong>\u003c/td>\n\u003ctd>текстовые события\u003c/td>\n\u003ctd>«Что именно случилось?»\u003c/td>\n\u003ctd>structured logging, Loki/ELK\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Трейсы\u003c/strong>\u003c/td>\n\u003ctd>путь запроса через сервисы\u003c/td>\n\u003ctd>«Где застряло?»\u003c/td>\n\u003ctd>traceId, OpenTelemetry\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Вместе они отвечают на главный вопрос: «система здорова, и если нет — где именно болит».\u003c/p>\n\u003ch2>Как они работают в связке\u003c/h2>\n\u003cp>Типичное расследование инцидента «оформление заказа тормозит»:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart TD\n    A[&quot;Алерт: p99 /api/orders &gt; 2s&lt;br/&gt;(метрика)&quot;] --&gt; B[&quot;Дашборд: тормозит только&lt;br/&gt;POST, БД и Kafka в норме&quot;]\n    B --&gt; C[&quot;Лог по traceId проблемного запроса:&lt;br/&gt;упор в 3 строки, медленный вызов&quot;]\n    C --&gt; D[&quot;Трейс: span 'call payment-api' 1.8s&lt;br/&gt;— вот виновник&quot;]\u003c/div>\u003cp>Метрика говорит \u003cstrong>что\u003c/strong> и \u003cstrong>когда\u003c/strong>, лог — \u003cstrong>что конкретно\u003c/strong>, трейс — \u003cstrong>где в цепочке\u003c/strong>. Один столп без остальных оставляет слепые зоны.\u003c/p>\n\u003ch2>Метрики: язык чисел\u003c/h2>\n\u003cp>Метрика — число с именем, временем и \u003cstrong>тегами\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">http_server_requests_seconds_count{uri=&quot;/api/orders&quot;, method=&quot;POST&quot;, status=&quot;201&quot;}  4182\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>имя — что меряем\u003c/li>\n\u003cli>теги — по каким осям резать (URI, метод, статус, сервис)\u003c/li>\n\u003cli>значение и время — ряд, из которого растут графики\u003c/li>\n\u003c/ul>\n\u003cp>Силу метрик даёт агрегируемость: «error rate по всем инстансам за 5 минут» — это один запрос к Prometheus, без чтения логов.\u003c/p>\n\u003ch2>Логи: язык событий\u003c/h2>\n\u003cp>Лог — запись о событии с уровнем (ERROR/WARN/INFO/DEBUG) и контекстом (кто, что, traceId). Правила выживания:\u003c/p>\n\u003cul>\n\u003cli>логи читают машины и люди: \u003cstrong>структура\u003c/strong> (JSON) важнее прозы\u003c/li>\n\u003cli>ERROR — «нужен человек», WARN — «странно, но живём», INFO — факты, DEBUG — детали (выключены в проде)\u003c/li>\n\u003cli>в ERROR-логе должна быть причина, а не только «что-то упало»\u003c/li>\n\u003c/ul>\n\u003ch2>Трейсы: язык путей\u003c/h2>\n\u003cp>Запрос через микросервисы порождает \u003cstrong>trace\u003c/strong>: дерево \u003cstrong>span'ов\u003c/strong> — отрезков работы (контроллер → сервис → SQL → Kafka-send). Один \u003cstrong>traceId\u003c/strong> связывает всё. Без него «почему медленно» в распределённой системе — гадание: каждый сервис видит только свой кусок.\u003c/p>\n\u003cp>Трейсинг в Java — OpenTelemetry: библиотека автоинструментирует HTTP/JDBC/Kafka, вам остаётся propagated контекст.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> наблюдаемость — тестируемое требование: «по каждой бизнес-ошибке есть WARN/ERROR с кодом», «метрика orders.created растёт после оформления», «в ответе API есть traceId для поддержки». Проверяется за минуты, экономит часы разборов.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> дашборд команды — это ваш интерфейс с системой в рантайме. Требования типа «конверсия заказов видна с задержкой не больше минуты» — это требования к метрикам и событиям, а не к ночной выгрузке.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Мониторинг отвечает на известное, наблюдаемость — на неизвестное\u003c/li>\n\u003cli>Три столпа: метрики (сколько), логи (что), трейсы (где) — работают в связке\u003c/li>\n\u003cli>Метрика = имя + теги + ряд значений; агрегируется и рисуется\u003c/li>\n\u003cli>Логи: структурированные, уровни по смыслу, ERROR = нужен человек\u003c/li>\n\u003cli>Трейс связывает путь запроса через сервисы одним traceId (OpenTelemetry)\u003c/li>\n\u003c/ul>\n\u003cp>В следующем уроке — метрики вглубь: Counter, Gauge, Timer и как одна строка Micrometer превращается в график на дашборде.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Поддержка спрашивает: «почему у пользователя не оформляется заказ?» Какой столп назовёт конкретное место сбоя в цепочке сервисов?","options":["Трейс: span'ы покажут, где запрос застрял (контроллер, SQL, внешний вызов)","Метрика CPU utilization","Health-check /actuator/health","Лог доступа nginx за прошлый месяц"],"correct":0,"explanation":"Трейс — про путь запроса через компоненты. Метрики скажут «есть проблема», логи — «что случилось», но связать куски по времени и месту — работа traceId."},{"type":"multi","question":"Что верно про метрики? (несколько ответов)","options":["Это числа с именами и тегами, собранные во времени","Они агрегируются: error rate за 5 минут по всем инстансам — один запрос","Они отвечают «что именно случилось с конкретным заказом» лучше логов","Теги позволяют резать данные по осям: URI, метод, статус"],"correct":[0,1,3],"explanation":"«Что именно с конкретным заказом» — территория логов и трейсов: метрики про популяции, а не про индивидуумов."},{"type":"match","question":"Сопоставьте столп и типичный вопрос.","pairs":[{"left":"Метрики","right":"Какой p99 задержки на POST /api/orders?"},{"left":"Логи","right":"Какая ошибка выпала у заказа 42?"},{"left":"Трейсы","right":"На каком сервисе запрос потратил 1.8 секунды?"},{"left":"Health","right":"Жив ли инстанс вообще?"}]},{"type":"single","question":"Что значит ERROR в зрелой системе логирования?","options":["«Нужен человек»: потеря функциональности или риска; ERROR-шум — антипаттерн","Любое исключение, даже обработанное и ожидаемое","Просто самый громкий уровень — пишем всё подряд","То же, что и WARN"],"correct":0,"explanation":"Если ERROR сыпется на каждый ожидаемый 404 — на алерты никто не смотрит. Уровень — это серьёзность последствий, а не громкость испуга."},{"type":"blank","question":"Как называется идентификатор, связывающий все логи и span'ы одного запроса across сервисы? (формат: …Id)","answers":["traceId","trace id","трейс-id"],"explanation":"TraceId. Пробрасывается через HTTP-заголовки и Kafka-заголовки; найден в одном логе — найдёте всю историю запроса."},{"type":"single","question":"Отладочная история: алерт сработал → дашборд сузил → лог назвал строку → трейс показал span. Что это демонстрирует?","options":["Три столпа работают в связке: каждый отвечает на свой вопрос и передаёт эстафету","Что трейсинг лишний","Что метрики можно убрать","Что достаточно логов"],"correct":0,"explanation":"Классический цикл расследования: что → где → что именно → где точно. Ровно этому посвящён модуль."},{"type":"single","question":"Чем наблюдаемость отличается от мониторинга?","options":["Наблюдаемость позволяет расследовать неизвестные заранее проблемы по внешним сигналам; мониторинг — проверки известного списка","Это синонимы","Мониторинг новее","Наблюдаемость — только логи"],"correct":0,"explanation":"Мониторинг: «диск заполнен?» Наблюдаемость: «почему у Анны не оформляется корзина?» — вопрос, которого не было в чек-листе."}]],"cases":[]},{"id":"m5-lesson-02","title":"Метрики: Micrometer вглубь","module":5,"moduleTitle":"Наблюдаемость","order":2,"baseOrder":null,"lab":{"title":"Лаба 7. Свои метрики","description":"Добавить в сервис заказов бизнес-счётчик (orders.created.total) и таймер (orders.create.time), проверить их через /actuator/metrics. Проверка — автотесты.","branch":"lab-7","branchSolution":"lab-7-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 2. Метрики: Micrometer вглубь\u003c/h1>\n\u003cp>Micrometer — «SLF4J для метрик»: один API, много бэкендов (Prometheus, Datadog…). Вы пишете метрику один раз — график появляется там, куда смотрит команда. Разберём типы счётчиков и путь от кода до дашборда.\u003c/p>\n\u003ch2>Три главных типа\u003c/h2>\n\u003cp>\u003cstrong>Counter — «сколько раз».\u003c/strong> Только растёт: заказы, ошибки, запросы.\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> Counter ordersCreated;\n\n\u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">OrderService\u003c/span>\u003cspan class=\"hljs-params\">(MeterRegistry registry)\u003c/span> {\n    \u003cspan class=\"hljs-built_in\">this\u003c/span>.ordersCreated = Counter.builder(\u003cspan class=\"hljs-string\">&quot;orders.created.total&quot;\u003c/span>)\n            .description(\u003cspan class=\"hljs-string\">&quot;Создано заказов&quot;\u003c/span>)\n            .tag(\u003cspan class=\"hljs-string\">&quot;service&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;orders&quot;\u003c/span>)\n            .register(registry);\n}\n\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(...)\u003c/span> {\n    ...\n    ordersCreated.increment();          \u003cspan class=\"hljs-comment\">// +1\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>Gauge — «сколько сейчас».\u003c/strong> Текущее значение, может падать: размер очереди, число подключений.\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">Gauge.builder(\u003cspan class=\"hljs-string\">&quot;orders.pending&quot;\u003c/span>, store, s -&gt; s.pendingCount())\n        .register(registry);\n\u003c/code>\u003c/pre>\n\u003cp>Gauge снимает значение в момент опроса — меряет то, что уже где-то лежит; он не хранит историю сам.\u003c/p>\n\u003cp>\u003cstrong>Timer — «сколько длилось».\u003c/strong> Распределение длительностей: p50/p95/p99.\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> Timer createTimer;\n\n\u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">OrderService\u003c/span>\u003cspan class=\"hljs-params\">(MeterRegistry registry)\u003c/span> {\n    \u003cspan class=\"hljs-built_in\">this\u003c/span>.createTimer = Timer.builder(\u003cspan class=\"hljs-string\">&quot;orders.create.time&quot;\u003c/span>)\n            .description(\u003cspan class=\"hljs-string\">&quot;Время создания заказа&quot;\u003c/span>)\n            .register(registry);\n}\n\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(...)\u003c/span> {\n    \u003cspan class=\"hljs-type\">long\u003c/span> \u003cspan class=\"hljs-variable\">start\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> System.nanoTime();\n    ...\n    createTimer.record(System.nanoTime() - start, TimeUnit.NANOSECONDS);\n}\n\u003c/code>\u003c/pre>\n\u003cp>Или декларативно на весь метод: \u003ccode>@Timed(&quot;orders.create.time&quot;)\u003c/code> (+ включить \u003ccode>@EnableTiming\u003c/code>).\u003c/p>\n\u003cp>Именование: \u003ccode>домен.действие.единицы\u003c/code> — \u003ccode>orders.created.total\u003c/code>, \u003ccode>payments.charge.seconds\u003c/code>. Точки — Micrometer сам нормализует под бэкенд.\u003c/p>\n\u003ch2>Теги: оси, а не ряды\u003c/h2>\n\u003cp>Теги — способ резать одну метрику по осям без её размножения в коде:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">http_server_requests_seconds_count{method=&quot;POST&quot;, uri=&quot;/api/orders&quot;, status=&quot;2xx&quot;}\nhttp_server_requests_seconds_count{method=&quot;POST&quot;, uri=&quot;/api/orders&quot;, status=&quot;5xx&quot;}\n\u003c/code>\u003c/pre>\n\u003cp>Одна метрика — сколько угодно срезов в одном графике: «разложи 5xx по URI». Меняете набор тегов — меняется временной ряд (старый ряд обрывается): продумывайте их заранее.\u003c/p>\n\u003cp>\u003cstrong>Кардинальность — главный враг.\u003c/strong> Тег с уникальными значениями (\u003ccode>userId\u003c/code>, \u003ccode>email\u003c/code>, \u003ccode>orderId\u003c/code>) создаёт новый ряд на каждое значение — Prometheus деградирует, а не «немного замедляется». Правило: теги — конечные множества (метод, статус, тип), пользовательские id — в логи и трейсы, не в метрики.\u003c/p>\n\u003ch2>Путь на дашборд\u003c/h2>\n\u003cdiv class=\"mermaid\">flowchart LR\n    C[&quot;Ваш код&lt;br/&gt;counter.increment()&quot;] --&gt; R[&quot;MeterRegistry&lt;br/&gt;(в памяти)&quot;]\n    R --&gt; E[&quot;/actuator/metrics&lt;br/&gt;(и /actuator/prometheus)&quot;]\n    E --&gt; P[&quot;Prometheus&lt;br/&gt;скрейпит каждые 15-30с&quot;]\n    P --&gt; G[&quot;Grafana&lt;br/&gt;графики и алерты&quot;]\u003c/div>\u003col>\n\u003cli>Метрика живёт в реестре приложения (Spring создаёт \u003ccode>MeterRegistry\u003c/code> под classpath)\u003c/li>\n\u003cli>\u003ccode>/actuator/metrics/orders.created.total\u003c/code> — посмотреть руками прямо сейчас (это и есть лаба 7)\u003c/li>\n\u003cli>Prometheus \u003cstrong>pull'ит\u003c/strong> приложение по расписанию — хранит историю\u003c/li>\n\u003cli>Grafana рисует и алертит\u003c/li>\n\u003c/ol>\n\u003cp>Плюс автоматические метрики Spring Boot: HTTP (\u003ccode>http.server.requests\u003c/code> с uri/method/status), JVM (память, GC), пулы, Kafka-клиент, HikariPool — они уже у вас есть, включите \u003ccode>management.metrics\u003c/code> и пользуйтесь.\u003c/p>\n\u003ch2>@Scheduled-метрики и «красота» богатства\u003c/h2>\n\u003cp>Уровнем выше — агрегаты, которые команда считает сама: раз в минуту писать Gauge от SQL-запроса (\u003ccode>db.orders.unshipped\u003c/code>), счётчик DLT-сообщений, глубину outbox. Правило безопасности: тяжёлые вычисления — не в запросе пользователя, а по расписанию.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Типы: Counter (сколько раз), Gauge (сколько сейчас), Timer (как долго, перцентили)\u003c/li>\n\u003cli>Регистрация в конструкторе через \u003ccode>MeterRegistry\u003c/code>; \u003ccode>@Timed\u003c/code> — декларативно\u003c/li>\n\u003cli>Теги — оси срезов; кардинальность убивает Prometheus: id-шники — в логи\u003c/li>\n\u003cli>Путь: код → реестр → /actuator/metrics → Prometheus (pull) → Grafana\u003c/li>\n\u003cli>Богатство Spring Boot: HTTP/JVM/пулы/Kafka-метрики уже есть из коробки\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — что именно мерить: золотые сигналы, бизнес-метрики и типовой набор сервиса.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Нужно мерить «сколько заказов оформлено с момента запуска». Какой тип метрики?","options":["Counter — только растущее число событий","Gauge — текущее значение","Timer — длительности","Histogram текстовых ошибок"],"correct":0,"explanation":"«Сколько раз случилось» = Counter. Gauge — «сколько прямо сейчас» (например, необработанных), Timer — «как долго»."},{"type":"single","question":"Почему тег userId в метрике заказов — антипаттерн?","options":["Каждый пользователь создаст новый временной ряд — кардинальность взорвёт хранилище метрик","Prometheus не поддерживает строковые теги","Grafana не умеет фильтровать по тегам","Micrometer запрещает больше одного тега"],"correct":0,"explanation":"Теги — для конечных осей (метод, статус). Уникальные id — в логи/трейсы: там поиск по конкретному заказу уместен."},{"type":"multi","question":"Что даёт /actuator/metrics? (несколько ответов)","options":["Посмотреть текущее значение любой метрики прямо в браузере/курлом","Увидеть список всех метрик приложения","Хранит историю метрик вечно","Точка, которую скрейпит Prometheus"],"correct":[0,1,3],"explanation":"Историю хранит Prometheus; endpoint — витрина «прямо сейчас» и источник для скрейпера. Это ваш главный отладочный ход в лабе 7."},{"type":"match","question":"Сопоставьте тип метрики и вопрос.","pairs":[{"left":"Counter","right":"Сколько заказов создано?"},{"left":"Gauge","right":"Сколько заказов ждёт отгрузки сейчас?"},{"left":"Timer","right":"Какой p99 времени создания заказа?"},{"left":"http.server.requests","right":"Готовая метрика Spring Boot по HTTP-запросам"}]},{"type":"single","codeLang":"java","code":"Timer.builder(\"orders.create.time\")\n     .description(\"Время создания заказа\")\n     .register(registry);\n","question":"Что вы получите из этой метрики в Grafana?","options":["Распределение длительностей: можно рисовать p50/p95/p99 времени создания","Только среднее время","Число созданных заказов","Код ошибки для каждого заказа"],"correct":0,"explanation":"Timer собирает гистограмму длительностей — отсюда перцентили. Среднее — лишь одна (и часто обманчивая) точка этого распределения.","codeHtml":"Timer.builder(\u003cspan class=\"hljs-string\">&quot;orders.create.time&quot;\u003c/span>)\n     .description(\u003cspan class=\"hljs-string\">&quot;Время создания заказа&quot;\u003c/span>)\n     .register(registry);\n"},{"type":"blank","question":"Как называется реестр метрик Micrometer, который Spring автосоздаёт и в который вы регистрируете счётчики? (класс: Meter…)","answers":["MeterRegistry","meterregistry"],"explanation":"MeterRegistry. Как SLF4J-логгер для метрик: пишете в него, бэкенд (Prometheus и др.) подключается конфигурацией."},{"type":"single","question":"Как метрики попадают из приложения в Prometheus?","options":["Prometheus сам опрашивает (pull) endpoint приложения по расписанию","Приложение пушит каждую метрику в Prometheus на каждый increment()","Grafana читает память приложения напрямую","Через базу данных"],"correct":0,"explanation":"Pull-модель: Prometheus скрейпит /actuator/prometheus каждые 15–30 секунд. Приложение ничего не знает про хранилище — развязка как у брокера."}]],"cases":[]},{"id":"m5-lesson-03","title":"Практичные метрики бэкенда","module":5,"moduleTitle":"Наблюдаемость","order":3,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 3. Практичные метрики бэкенда\u003c/h1>\n\u003cp>Знать типы счётчиков — полдела. Умение — выбрать те метрики, по которым видно здоровье сервиса и бизнеса, и не утонуть в сотнях бессмысленных графиков. Урок — про минимальный джентльменский набор.\u003c/p>\n\u003ch2>Золотые сигналы: четыре вопроса о любом сервисе\u003c/h2>\n\u003cp>Google SRE сформулировала четыре сигнала, покрывающих 90% потребностей:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Сигнал\u003c/th>\n\u003cth>Вопрос\u003c/th>\n\u003cth>Метрики\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Traffic\u003c/strong>\u003c/td>\n\u003ctd>Сколько работы приходит?\u003c/td>\n\u003ctd>RPS по эндпоинтам, события Kafka/сек\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Latency\u003c/strong>\u003c/td>\n\u003ctd>Как быстро справляемся?\u003c/td>\n\u003ctd>p50/p95/p99 \u003ccode>http.server.requests\u003c/code>, таймеры бизнес-операций\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Errors\u003c/strong>\u003c/td>\n\u003ctd>Как часто fails?\u003c/td>\n\u003ctd>Доля 5xx, бизнес-ошибки по кодам\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Saturation\u003c/strong>\u003c/td>\n\u003ctd>Насколько «заполнен»?\u003c/td>\n\u003ctd>Пулы соединений, потоки, лаг консюмер-групп, глубина DLT\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Инцидент почти всегда виден в одном из четырёх. Дашборд сервиса, начинающийся с этих четырёх панелей, — лучший друг дежурного.\u003c/p>\n\u003ch2>Слои метрик: инфра → приложение → бизнес\u003c/h2>\n\u003cp>\u003cstrong>Инфраструктура\u003c/strong> (из коробки): память/GC/потоки JVM, Hikari-пул БД (\u003ccode>hikaricp.connections.pending\u003c/code>), Kafka-клиент. Смотрите, когда «всё медленно и непонятно почему».\u003c/p>\n\u003cp>\u003cstrong>Приложение\u003c/strong> (авто + чуть своих): HTTP-запросы по uri/method/status, свои таймеры тяжёлых операций, внешние вызовы (таймер на «запрос в платёжный шлюз»).\u003c/p>\n\u003cp>\u003cstrong>Бизнес\u003c/strong> (только ваши): \u003ccode>orders.created.total\u003c/code>, \u003ccode>payments.failed.total{reason}\u003c/code>, \u003ccode>carts.abandoned\u003c/code> — то, что продакт читает вместо «статуса сервера». Бизнес-метрики ловят падения, которые технические метрики не видят: внешняя реклама сломалась — трафика нет, всё «зелёное», а денег нет.\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">Counter.builder(\u003cspan class=\"hljs-string\">&quot;payments.charge.total&quot;\u003c/span>)\n        .tag(\u003cspan class=\"hljs-string\">&quot;result&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;success&quot;\u003c/span>)     \u003cspan class=\"hljs-comment\">// конечное множество значений!\u003c/span>\n        .register(registry);\n\u003c/code>\u003c/pre>\n\u003cp>Ошибка с тегом \u003ccode>reason\u003c/code> — по конечному списку причин (\u003ccode>insufficient_funds\u003c/code>, \u003ccode>gateway_timeout\u003c/code>), не по свободному тексту.\u003c/p>\n\u003ch2>Производные показатели: считайте на дашборде, не в коде\u003c/h2>\n\u003cp>Долю ошибок и рейт не хранят — их \u003cstrong>вычисляют\u003c/strong> из счётчиков в Grafana/PromQL:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">error_rate = rate(http_5xx_total[5m]) / rate(http_all_total[5m])\n\u003c/code>\u003c/pre>\n\u003cp>Поэтому в коде — только атомарные факты (сколько 5xx, сколько всего), а «проценты» — функция над ними. Один и тот же счётчик потом участвует в разных графиках.\u003c/p>\n\u003ch2>Лаг и DLT: метрики асинхронности\u003c/h2>\n\u003cp>Из модуля Kafka: лаг группы и глубина DLT — это тоже метрики, и они обязаны быть на дашборде рядом с золотыми сигналами. Растущий лаг = «не успеваем», глубина DLT &gt; 0 = «что-то не обрабатывается» — оба алерта должны существовать до продакшена фичи.\u003c/p>\n\u003ch2>Антипаттерны\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Метрики ради метрик\u003c/strong>: 300 графиков, из которых смотрят на 5. Каждый график отвечает за вопрос дежурного или продакта — иначе удалить\u003c/li>\n\u003cli>\u003cstrong>Средние вместо перцентилей\u003c/strong>: p99 = 8s при среднем 200ms — «в среднем всё хорошо», а каждый десятый пользователь страдает\u003c/li>\n\u003cli>\u003cstrong>Уникальные теги\u003c/strong> (userId, orderId) — кардинальность (урок 2)\u003c/li>\n\u003cli>\u003cstrong>Свободный текст в тегах\u003c/strong> (\u003ccode>reason=&quot;gateway timeout after 3 retries!!!&quot;\u003c/code>) — ряды плодятся\u003c/li>\n\u003cli>\u003cstrong>Бизнес-метрики постфактум\u003c/strong>: «добавим метрику после инцидента» — добавляйте в момент фичи, это одна строка рядом с бизнес-кодом\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> бизнес-метрики — ваше поле: их имена, теги и смысл фиксируйте в требованиях фичи («после релиза видно orders.created.total с разбивкой по стране»). Разница между «метрикой по случаю» и продуманной системой — именно в вашем участии.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> проверяйте метрики как функциональность: оформил заказ в тесте — счётчик вырос; словил 5xx — попал в тег status. Метрика, которая не растёт от действий — баг не хуже упавшего API.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Золотые сигналы: traffic, latency, errors, saturation — основа дашборда\u003c/li>\n\u003cli>Слои: инфра (авто) → приложение → бизнес (только ваши, рядом с кодом)\u003c/li>\n\u003cli>Доли и рейты считаются на дашборде из атомарных счётчиков\u003c/li>\n\u003cli>Лаг групп и глубина DLT — обязательные соседи золотых сигналов\u003c/li>\n\u003cli>Перцентили &gt; средние; конечные теги; каждый график отвечает на конкретный вопрос\u003c/li>\n\u003c/ul>\n\u003cp>Дальше — логи: структура, уровни, корреляция через traceId, и что нельзя писать никогда.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Средняя задержка 200ms, p99 — 8 секунд. Что это значит и какой вывод?","options":["Большинство быстро, но каждый сотый запрос страдает: смотреть хвост распределения, среднее скрывает проблему","Всё хорошо: среднее в норме","Метрики врут, отключить их","Нужен более мощный сервер немедленно"],"correct":0,"explanation":"Среднее бессимптомно к хвостам. p99/p95 — рабочий инструмент: именно хвостовые страдания пользователи замечают и уносят с собой."},{"type":"multi","question":"Золотые сигналы включают: (несколько ответов)","options":["Traffic — входящий поток","Latency — задержки (перцентили)","Errors — доля ошибок","Число строк в таблице пользователей"],"correct":[0,1,2],"explanation":"Четвёртый сигнал — saturation (заполненность: пулы, лаги). Размеры таблиц — не сигнал здоровья сервиса."},{"type":"single","question":"Где правильнее считать error_rate (долю 5xx)?","options":["На дашборде, из атомарных счётчиков запросов по статусам","В коде: писать готовый процент отдельной метрикой","В логах регуляркой","На бумаге раз в неделю"],"correct":0,"explanation":"В коде — факты (сколько 5xx, сколько всего), в PromQL — функции над ними. Готовый процент в метрике нельзя переагрегировать по-другому."},{"type":"match","question":"Сопоставьте симптом и метрику, которая его покажет.","pairs":[{"left":"«Не успеваем читать события»","right":"Лаг консюмер-группы"},{"left":"«События теряют обработку»","right":"Глубина DLT"},{"left":"«База задыхается»","right":"hikaricp.connections.pending"},{"left":"«Реклама сломалась, заказов нет»","right":"orders.created.total (бизнес-счётчик)"}]},{"type":"single","question":"Коллега предлагает тег result со значениями «ok», «OK», «ок!», «success (retry)». Ваш комментарий в ревью?","options":["Теги — конечное нормализованное множество: success/failure/retry; иначе каждый вариант — отдельный несопоставимый ряд","Отлично, чем больше вариантов, тем информативнее","Теги не влияют на графики","Лучше добавлять timestamp в тег"],"correct":0,"explanation":"Кардинальность и нормализация: «ок» и «OK» — два разных ряда на графике. Enum-значения фиксируются в коде константами."},{"type":"blank","question":"Как называется четвёртый золотой сигнал — «насколько заполнены ресурсы»? (английское слово)","answers":["saturation","насыщение"],"explanation":"Saturation: пулы соединений, потоки, лаги, глубины очередей — «сколько запаса осталось»."},{"type":"single","question":"Фича «отправка подарков» уехла в прод без бизнес-метрик. Через неделю продакт спрашивает «работает ли?». Что отвечает зрелая команда?","options":["«Не знаем, надо было заложить метрику в фичу — добавим сейчас и в следующий раз метрика — часть Definition of Done»","«Конечно работает, тесты зелёные были»","«Смотрите логи за неделю глазами»","«Это не наша забота»"],"correct":0,"explanation":"Зелёные тесты — про момент релиза; наблюдаемость — про жизнь после. Одна строка Counter рядом с бизнес-кодом — копеечная страховка."}]],"cases":[]},{"id":"m5-lesson-04","title":"Логи и корреляция","module":5,"moduleTitle":"Наблюдаемость","order":4,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 4. Логи и корреляция\u003c/h1>\n\u003cp>Логи — самый старый инструмент и до сих пор главный на разборе инцидентов. Разница между «логами» и «полезными логами» — структура и корреляция. Урок — как писать логи, по которым расследование занимает минуты.\u003c/p>\n\u003ch2>Структурированные логи: JSON вместо прозы\u003c/h2>\n\u003cpre>\u003ccode class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\u003cspan class=\"hljs-attr\">&quot;timestamp&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-string\">&quot;2026-11-12T10:15:03Z&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\u003cspan class=\"hljs-attr\">&quot;level&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-string\">&quot;INFO&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\u003cspan class=\"hljs-attr\">&quot;logger&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-string\">&quot;be101.orders.OrderService&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n \u003cspan class=\"hljs-attr\">&quot;message&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-string\">&quot;order created&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\u003cspan class=\"hljs-attr\">&quot;orderId&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-number\">42\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\u003cspan class=\"hljs-attr\">&quot;customer&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\u003cspan class=\"hljs-attr\">&quot;amount&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-number\">5990\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\u003cspan class=\"hljs-attr\">&quot;traceId&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-string\">&quot;a4f9c2...&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Против \u003ccode>10:15:03 INFO Заказ 42 создан для ann на 5990\u003c/code>. Человек прочитает оба; машина (Loki, ELK) — только первый: фильтры \u003ccode>orderId=42 AND level=ERROR\u003c/code>, графики по полям, алерты по подсчётам. В Spring Boot: logback-encoder + \u003ccode>logging.pattern\u003c/code> в JSON — поля из MDC и аргументы автоматически.\u003c/p>\n\u003cp>Поля — змеёй/верблюдом, но одинаково везде; \u003ccode>message\u003c/code> — короткий факт, детали — полями.\u003c/p>\n\u003ch2>Уровни: дисциплина, не настроение\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Уровень\u003c/th>\n\u003cth>Смысл\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ERROR\u003c/td>\n\u003ctd>Нужен человек: функциональность потеряна\u003c/td>\n\u003ctd>Не сохранился заказ\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WARN\u003c/td>\n\u003ctd>Странно, но обработано: присмотритесь\u003c/td>\n\u003ctd>Ретрай внешнего вызова, DLT+1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>INFO\u003c/td>\n\u003ctd>Значимые факты жизни\u003c/td>\n\u003ctd>Заказ создан, конфигурация применена\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEBUG\u003c/td>\n\u003ctd>Детали для отладки\u003c/td>\n\u003ctd>Параметры SQL, решение бизнес-правила\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Антипаттерн — ERROR-шум: ожидаемый 404 или чужой кривой токен сыпятся ERROR'ами → на алерты перестают смотреть → настоящий ERROR теряется. ERROR — не «мне стало страшно», а «дежурному встать».\u003c/p>\n\u003ch2>MDC и traceId: нитка через весь запрос\u003c/h2>\n\u003cp>\u003cstrong>MDC\u003c/strong> (Mapped Diagnostic Context) — поток-локальная карта «поле → значение», автоматически подмешиваемая в каждую строку лога этого потока:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">MDC.put(\u003cspan class=\"hljs-string\">&quot;traceId&quot;\u003c/span>, UUID.randomUUID().toString());\n\u003cspan class=\"hljs-keyword\">try\u003c/span> {\n    log.info(\u003cspan class=\"hljs-string\">&quot;order created&quot;\u003c/span>);      \u003cspan class=\"hljs-comment\">// в логе будет traceId автоматически\u003c/span>\n} \u003cspan class=\"hljs-keyword\">finally\u003c/span> {\n    MDC.remove(\u003cspan class=\"hljs-string\">&quot;traceId&quot;\u003c/span>);\n}\n\u003c/code>\u003c/pre>\n\u003cp>В распределённой системе traceId приходит \u003cstrong>снаружи\u003c/strong> (HTTP-заголовок от фронта/шлюза) или создаётся на входе — фильтр/интерцептор. Дальше он путешествует:\u003c/p>\n\u003cul>\n\u003cli>в HTTP-ответе (заголовок) — поддержка просит его у пользователя при тикете\u003c/li>\n\u003cli>в исходящих вызовах — заголовком дальше\u003c/li>\n\u003cli>\u003cstrong>в Kafka\u003c/strong> — заголовком сообщения: консюмер кладёт в MDC перед обработкой\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@KafkaListener(topics = &quot;orders.created&quot;)\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">on\u003c/span>\u003cspan class=\"hljs-params\">(OrderCreatedEvent e, \u003cspan class=\"hljs-meta\">@Header(&quot;traceId&quot;)\u003c/span> String traceId)\u003c/span> {\n    MDC.put(\u003cspan class=\"hljs-string\">&quot;traceId&quot;\u003c/span>, traceId);\n    \u003cspan class=\"hljs-keyword\">try\u003c/span> { process(e); } \u003cspan class=\"hljs-keyword\">finally\u003c/span> { MDC.remove(\u003cspan class=\"hljs-string\">&quot;traceId&quot;\u003c/span>); }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Без этой ниточки «асинхронный инцидент» = восемь несвязанных логов в восьми сервисах; с ней — одна история с общим traceId.\u003c/p>\n\u003ch2>Что логировать (и что — никогда)\u003c/h2>\n\u003cp>Логировать: факты смены состояния, решения бизнес-правил (DEBUG), внешние вызовы (кто/зачем/сколько), ошибки с контекстом.\u003c/p>\n\u003cp>\u003cstrong>Никогда\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>секреты: пароли, токены, номера карт (даже частично — регуляторы не шутят)\u003c/li>\n\u003cli>персональные данные сверх необходимого (email — ок в контексте заказа по легальным основаниям; паспорт — нет)\u003c/li>\n\u003cli>тела целиком «на всякий случай» (объём + утечки + GDPR-стиль проблемы)\u003c/li>\n\u003cli>в цикле на миллион итераций (лог-шторм топит и диск, и агрегатор)\u003c/li>\n\u003c/ul>\n\u003ch2>Логи vs метрики vs трейсы: кто за что\u003c/h2>\n\u003cp>Не дублируйте: счётчик не нужен там, где достаточно метрики; стек всей цепочки — работа трейса. Лог — событие с контекстом, которое объяснит «почему», когда метрика скажет «что». Практическое правило: по каждому ERROR в логе должно быть можно построить график частоты, а по каждому графику 5xx — найти примеры в логах.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> тестируйте логи как контракт: бизнес-ошибка → WARN/ERROR с кодом, в каждой строке traceId, секреты не встречаются (простой grep по тестовым паролям). «Логи есть» ≠ «по ним можно расследовать».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Структурированный JSON-лог: поля вместо прозы, машина и человек читают одно и то же\u003c/li>\n\u003cli>Уровни — дисциплина: ERROR = «нужен человек»; шум убивает алерты\u003c/li>\n\u003cli>MDC + traceId: нитка от фронта через сервисы и Kafka до последнего обработчика\u003c/li>\n\u003cli>Секреты и лишние персональные данные — никогда; миллион строк в цикле — тоже\u003c/li>\n\u003cli>Логи объясняют «почему», метрики — «что», трейсы — «где»: не дублировать\u003c/li>\n\u003c/ul>\n\u003cp>Последний урок модуля — дашборды и алерты: как из метрик сделать систему, которая зовёт людей вовремя, а не ночью по пустякам.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Почему структурированный JSON-лог лучше текстового?","options":["Поля парсятся машиной: фильтры orderId=42 AND level=ERROR, графики и алерты по полям","Он компактнее по байтам","Человек не сможет его прочитать — и это хорошо","JSON красивее в консоли"],"correct":0,"explanation":"Агрегаторы (Loki/ELK) работают с полями. Проза — только grep глазами, что на объёмах продa не масштабируется."},{"type":"single","question":"Каждый валидационный 400 в сервисе логируется как ERROR. К чему это приведёт?","options":["ERROR-шуму: алерты потеряют смысл, настоящий отказ будет не виден","Повышению надёжности","Ускорению ответов API","Ничему: уровни не важны"],"correct":0,"explanation":"Клиентские 400 — норма жизни (WARN/DEBUG). ERROR — сигнал дежурному; обесцененный сигнал не работает в критический момент."},{"type":"blank","question":"Как называется поток-локальное хранилище «поле → значение», из которого logging-фреймворк автоматически подмешивает поля в каждую строку? (аббревиатура)","answers":["MDC"],"explanation":"Mapped Diagnostic Context. Кладёте traceId на входе запроса — получаете его во всех логах потока."},{"type":"multi","question":"Как traceId попадает из order-service в mail-service через Kafka? (несколько ответов)","options":["Продюсер кладёт traceId в заголовок сообщения","Консюмер читает заголовок и кладёт в MDC перед обработкой","Он передаётся в теле каждого события дублированием полей","Kafka генерирует traceId сама из offset'а"],"correct":[0,1],"explanation":"Заголовки сообщения — транспорт контекста; тело события — бизнес-данные. Паттерн: фильтр на входе HTTP, обёртка на входе листенера."},{"type":"match","question":"Сопоставьте артефакт и его вопрос.","pairs":[{"left":"ERROR-лог с кодом и traceId","right":"«Что сломалось и у кого именно?»"},{"left":"Метрика 5xx-рейта","right":"«Как часто ломается в целом?»"},{"left":"Трейс со span'ами","right":"«В каком месте цепочки время/ошибка?»"},{"left":"Лаг группы","right":"«Успеваем ли читать события?»"}]},{"type":"single","question":"Что из этого допустимо написать в лог?","options":["«payment failed» + orderId + код причины — без номера карты и токена","Номер карты 4242... с CVV «для разбора инцидента»","JWT-токен пользователя целиком","Пароль из конфига при старте"],"correct":0,"explanation":"Идентификаторы и коды — да; секреты и платёжные реквизиты — никогда. Утечка из логов — самая частая и самая дорогая."},{"type":"single","question":"Инцидент разбора: «нашли восемь логов в восьми сервисах, но не можем понять, чьи они». Чего не хватало?","options":["Единого traceId, пробрасываемого через HTTP-заголовки и заголовки Kafka-сообщений","Логов уровня TRACE везде","Больше полей userId в метриках","Корневого логина на всех серверах"],"correct":0,"explanation":"Корреляция — суть расследования. traceId стоил одного фильтра на входе, а его отсутствие стоило часа восьми людей."}]],"cases":[]},{"id":"m5-order-timeout","title":"Расследование 504 при отмене заказа","module":5,"moduleTitle":"Наблюдаемость","order":4.5,"baseOrder":9,"lab":null,"html":"\u003ch1>Расследование 504 при отмене заказа\u003c/h1>\n\u003cp>Анна нажала «Отменить заказ». Браузер получил \u003ccode>504\u003c/code>. Разбери сохранённые артефакты по порядку. Сначала определи, где искать результат операции. Затем подтверди его по данным и реши, как повторить запрос.\u003c/p>\n\u003ch2>Запрос в браузере\u003c/h2>\n\u003cp>Во фрагменте \u003cstrong>Network\u003c/strong> от 16 января все отметки времени указаны в UTC.\u003c/p>\n\u003cpre>\u003ccode class=\"language-http\">\u003cspan class=\"hljs-keyword\">POST\u003c/span> \u003cspan class=\"hljs-string\">/api/orders/42/cancel\u003c/span> \u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span>\n\u003cspan class=\"hljs-attribute\">Host\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>api.shop.example.test\n\u003cspan class=\"hljs-attribute\">Authorization\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>Bearer demo-anna\n\u003cspan class=\"hljs-attribute\">Idempotency-Key\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>cancel-42-1\n\n\u003cspan class=\"language-http\">\u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span> \u003cspan class=\"hljs-number\">504\u003c/span> Gateway Timeout\n\u003cspan class=\"hljs-attribute\">X-Trace-Id\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>42c0a600000000000000000000000001\n\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>504\u003c/code> означает, что шлюз вовремя не получил ответ от сервиса, к которому обратился. Чтобы узнать результат самой операции, проследи запрос дальше шлюза. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9110.html#section-15.6.5\">RFC 9110\u003c/a>\u003c/p>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Состояние заказа и повтор запроса\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"1\">\u003c/div>\u003ch2>Другой исход в тренажёре\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>\u003ch2>504 и неполные данные\u003c/h2>\n\u003cp>Анна отменяет другой заказ, \u003ccode>58\u003c/code>. Она создала его 15 января в \u003ccode>14:00:00Z\u003c/code>. По \u003ca href=\"#/m2-order-cancellation-review\">контракту отмены\u003c/a> окно закрывается 16 января в \u003ccode>14:00:00Z\u003c/code>. В браузере доступен такой обмен.\u003c/p>\n\u003cpre>\u003ccode class=\"language-http\">\u003cspan class=\"hljs-keyword\">POST\u003c/span> \u003cspan class=\"hljs-string\">/api/orders/58/cancel\u003c/span> \u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span>\n\u003cspan class=\"hljs-attribute\">Host\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>api.shop.example.test\n\u003cspan class=\"hljs-attribute\">Authorization\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>Bearer demo-anna\n\u003cspan class=\"hljs-attribute\">Idempotency-Key\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>cancel-58-1\n\n\u003cspan class=\"language-http\">\u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span> \u003cspan class=\"hljs-number\">504\u003c/span> Gateway Timeout\n\u003cspan class=\"hljs-attribute\">X-Trace-Id\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>58c0a600000000000000000000000003\n\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>В выгрузку трейса попали три записи.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">traceId=58c0a600000000000000000000000003\n13:59:57.900Z gateway POST /api/orders/58/cancel deadline=13:59:59.900Z\n13:59:57.914Z orders  start orderId=58 key=cancel-58-1\n13:59:59.900Z gateway upstream_timeout status=504\n\u003c/code>\u003c/pre>\n\u003cp>У дежурного пока есть срез основной БД на \u003ccode>13:59:50.000Z\u003c/code>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Источник\u003c/th>\n\u003cth>Данные\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>orders\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>id=58\u003c/code>, \u003ccode>status=NEW\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>bonus_transactions\u003c/code>\u003c/td>\n\u003ctd>Для заказа \u003ccode>58\u003c/code> нет строк с причиной \u003ccode>ORDER_CANCELLED\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"case-slot\" data-case=\"2\">\u003c/div>\u003cdiv class=\"case-slot\" data-case=\"3\">\u003c/div>","quizzes":[[{"type":"single","topic":"m5-order-timeout","codeLang":"plaintext","code":"traceId=57c0a600000000000000000000000002\n11:40:12.190Z orders tx.rollback orderId=57 key=cancel-57-1\n11:40:14.000Z gateway upstream_timeout status=504\n11:40:15.000Z orders.status id=57 status=NEW\n11:40:15.000Z bonus_transactions orderId=57 reason=ORDER_CANCELLED rows=0\n","question":"Другой заказ получил 504. Какой результат операции подтверждают трейс и срез?","options":["Транзакция откатилась. В срезе заказ ещё NEW, возврата по отмене нет","Отмена сохранилась. Повтор с тем же ключом обязательно вернёт прежний 204","Возврат произойдёт, как только обработчик уведомлений дочитает Kafka","Запрос надо признать успешным по одному ответу шлюза"],"correct":0,"explanation":"В этом трейсе зафиксирован rollback. Статус NEW и отсутствие строки возврата согласуются с откатом. При решении о повторе проверь текущее состояние и окно отмены по контракту.","codeHtml":"traceId=57c0a600000000000000000000000002\n11:40:12.190Z orders tx.rollback orderId=57 key=cancel-57-1\n11:40:14.000Z gateway upstream_timeout status=504\n11:40:15.000Z orders.status id=57 status=NEW\n11:40:15.000Z bonus_transactions orderId=57 reason=ORDER_CANCELLED rows=0\n"}]],"cases":[{"title":"Выбери следующий шаг расследования","task":"Запиши, что подтверждает ответ 504 и какие исходы операции пока возможны. Назови следующий источник данных. По какому полю найдёшь именно этот запрос?\n","placeholder":"Что уже известно\nГипотеза\nГде и по какому полю её проверить","referenceHtml":"\u003cp>Шлюз ожидал ответ две секунды. Найди трейс по \u003ccode>X-Trace-Id\u003c/code>. В нём видно, что сервис принял запрос, зафиксировал отмену и сформировал ответ уже после таймаута шлюза.\u003c/p>\n\u003cpre>\u003ccode>traceId=42c0a600000000000000000000000001\n11:59:52.000Z gateway POST /api/orders/42/cancel deadline=11:59:54.000Z\n11:59:52.012Z orders  start key=cancel-42-1 orderId=42\n11:59:52.180Z orders  tx.commit tx=tx-cancel-42 status=CANCELLED bonusId=refund-42\n11:59:54.000Z gateway upstream_timeout status=504\n11:59:54.280Z orders  response_ready status=204\n\u003c/code>\u003c/pre>\n\u003cp>Спан шлюза объясняет, откуда взялся HTTP-ответ. Запись \u003ccode>tx.commit\u003c/code> с тем же \u003ccode>traceId\u003c/code> свидетельствует о сохранённой отмене. Дальше можно сверить её с состоянием заказа и записью возврата.\u003c/p>\n"},{"title":"Проверь результат отмены и составь баг-репорт","task":"Сверься с трейсом из предыдущего блока. Назови два наблюдения в БД, которые подтвердят, что операция состоялась. Анна повторяет запрос в 12:00:03Z, после истечения окна отмены. Какой ключ она должна отправить и чего ждать? Запиши короткий баг-репорт с запросом, ожиданием, фактом, traceId и следующим шагом.\n","placeholder":"Как проверю БД\nЧто отправит клиент\nКороткий баг-репорт","referenceHtml":"\u003cp>В срезе на \u003ccode>11:59:53Z\u003c/code> обнаруживаются обе записи.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Источник\u003c/th>\n\u003cth>Наблюдение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>orders\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>id=42\u003c/code>, \u003ccode>status=CANCELLED\u003c/code>, \u003ccode>cancelled_at=2026-01-16T11:59:52.180Z\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>bonus_transactions\u003c/code>\u003c/td>\n\u003ctd>Одна строка \u003ccode>refund-42\u003c/code> для \u003ccode>order_id=42\u003c/code> с причиной \u003ccode>ORDER_CANCELLED\u003c/code> и суммой \u003ccode>+120\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>При повторе сервис использует сохранённый результат по ключу \u003ccode>cancel-42-1\u003c/code>. По \u003ca href=\"#/m2-order-cancellation-review\">контракту\u003c/a> он возвращает его даже после истечения окна.\u003c/p>\n\u003cpre>\u003ccode>12:00:03.000Z POST /api/orders/42/cancel Idempotency-Key=cancel-42-1\n12:00:03.019Z orders replay key=cancel-42-1 status=204\n12:00:03.100Z GET /api/orders/42 -&gt; 200 {&quot;id&quot;:42,&quot;status&quot;:&quot;CANCELLED&quot;}\n12:00:03.130Z bonus_transactions(order_id=42,reason=ORDER_CANCELLED) -&gt; [refund-42]\n\u003c/code>\u003c/pre>\n\u003cp>Повтор вернул \u003ccode>204\u003c/code>. Заказ остался в \u003ccode>CANCELLED\u003c/code>, и возврат остался один.\u003c/p>\n\u003ch3>Пример баг-репорта\u003c/h3>\n\u003cp>\u003cstrong>После сохранённой отмены браузер получил 504.\u003c/strong> Запрос \u003ccode>POST /api/orders/42/cancel\u003c/code> с ключом \u003ccode>cancel-42-1\u003c/code>. Ожидали \u003ccode>204\u003c/code> по завершении операции. Получили \u003ccode>504\u003c/code> при таймауте шлюза. Трейс \u003ccode>42c0a600000000000000000000000001\u003c/code> показывает коммит в \u003ccode>11:59:52.180Z\u003c/code> и готовность ответа в \u003ccode>11:59:54.280Z\u003c/code>. Следующий шаг — проверить, где сервис потратил время между коммитом и подготовкой ответа. Тот же ключ уже вернул \u003ccode>204\u003c/code>. По заказу есть один возврат.\u003c/p>\n"},{"title":"Реши, каких свидетельств не хватает","task":"Запиши, что известно о запросе по Network и трейсу. На какой вопрос отвечает срез БД с учётом его времени? Какие сведения ты запросишь, чтобы узнать состояние заказа и результат попытки с ключом cancel-58-1? Укажи источник и идентификаторы, по которым искать каждое свидетельство.\n","placeholder":"Подтверждённые факты\nЧто показывает срез и на какой момент\nКакие данные запрошу и по каким идентификаторам","referenceHtml":"\u003cp>Шлюз вернул \u003ccode>504\u003c/code>, а запись \u003ccode>orders start\u003c/code> подтверждает, что сервис начал обработку. Срез показывает \u003ccode>NEW\u003c/code> и ноль возвратов до запроса. На этом этапе результат отмены неизвестен.\u003c/p>\n\u003cp>Запроси свежий срез основной БД по \u003ccode>orderId=58\u003c/code> и строки журнала бонусов с причиной \u003ccode>ORDER_CANCELLED\u003c/code>. Для исходной попытки ищи записи сервиса по \u003ccode>traceId=58c0a600000000000000000000000003\u003c/code> или результат по сочетанию \u003ccode>anna\u003c/code>, \u003ccode>58\u003c/code>, \u003ccode>cancel-58-1\u003c/code>.\u003c/p>\n\u003ch3>Что нашли в 14:00:02Z\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Источник\u003c/th>\n\u003cth>Наблюдение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Свежий срез \u003ccode>orders\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>id=58\u003c/code>, \u003ccode>status=CANCELLED\u003c/code>, \u003ccode>cancelled_at=13:59:59.120Z\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Свежий срез \u003ccode>bonus_transactions\u003c/code>\u003c/td>\n\u003ctd>Одна строка \u003ccode>refund-58\u003c/code> для \u003ccode>order_id=58\u003c/code> с причиной \u003ccode>ORDER_CANCELLED\u003c/code>, созданная в \u003ccode>13:59:59.120Z\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Журнал сервиса\u003c/td>\n\u003ctd>В \u003ccode>13:59:59.120Z\u003c/code> коммит отмены для \u003ccode>orderId=58\u003c/code>, пользователя \u003ccode>anna\u003c/code> и ключа \u003ccode>cancel-58-2\u003c/code> из второй вкладки\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Результат по ключу\u003c/td>\n\u003ctd>Для \u003ccode>anna\u003c/code>, \u003ccode>58\u003c/code>, \u003ccode>cancel-58-2\u003c/code> сохранён \u003ccode>204\u003c/code>. Для \u003ccode>anna\u003c/code>, \u003ccode>58\u003c/code>, \u003ccode>cancel-58-1\u003c/code> успешного результата нет\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n"},{"title":"Прими решение о повторе","task":"Открой свежие данные в разборе выше. Какой результат можно показать Анне? Какой запрос записал отмену и возврат? Нужен ли новый POST для завершения действия в интерфейсе? Укажи ответ при диагностическом повторе исходного запроса по учебному контракту и проверку числа возвратов.\n","placeholder":"Итог по заказу и свидетельства\nКакая попытка записала отмену\nРешение для интерфейса\nЕсли всё же повторить исходный запрос","referenceHtml":"\u003cp>Свежий срез подтверждает статус \u003ccode>CANCELLED\u003c/code> и один возврат \u003ccode>refund-58\u003c/code>. По записи коммита и сохранённому ответу видно, что отмену выполнил запрос с ключом \u003ccode>cancel-58-2\u003c/code>. Этот \u003ccode>204\u003c/code> относится ко второй вкладке.\u003c/p>\n\u003cp>Чтобы выяснить, чем завершился первый вызов внутри сервиса, запроси запись завершения по его исходному \u003ccode>traceId\u003c/code>.\u003c/p>\n\u003cp>Покажи Анне отменённый заказ по свежему состоянию. Для завершения действия в интерфейсе достаточно подтверждённого \u003ccode>CANCELLED\u003c/code>.\u003c/p>\n\u003cp>Если для диагностики повторить исходный запрос с \u003ccode>cancel-58-1\u003c/code>, API сначала поищет успешный результат именно по этому ключу. Его нет, поэтому сработает проверка состояния заказа и сервис вернёт \u003ccode>409 ORDER_ALREADY_CANCELLED\u003c/code>. Проверь, что для заказа \u003ccode>58\u003c/code> и причины \u003ccode>ORDER_CANCELLED\u003c/code> по-прежнему существует ровно одна строка \u003ccode>refund-58\u003c/code>.\u003c/p>\n"}]},{"id":"m5-lesson-05","title":"Дашборды и алерты","module":5,"moduleTitle":"Наблюдаемость","order":5,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 5. Дашборды и алерты\u003c/h1>\n\u003cp>Финальный урок курса: как из метрик собрать систему, которая зовёт людей \u003cstrong>вовремя\u003c/strong> — и молчит, когда вмешательство не нужно. Дашборд — это интерфейс дежурного и продакта; алерт — обещание «встань и сделай». Оба подчиняются дизайну, а не вдохновению.\u003c/p>\n\u003ch2>Дашборд сервиса: три экрана сверху вниз\u003c/h2>\n\u003cp>\u003cstrong>Экран 1. «Здоровье» (для дежурного)\u003c/strong> — золотые сигналы + асинхронность:\u003c/p>\n\u003cul>\n\u003cli>RPS и p99 по эндпоинтам, error rate (5xx)\u003c/li>\n\u003cli>лаг консюмер-групп, глубина DLT/outbox\u003c/li>\n\u003cli>насыщение: пулы БД, потоки\u003c/li>\n\u003c/ul>\n\u003cp>Открывается по алерту: за 5 секунд видно, «у нас» или «в соседях», растёт или стабильно.\u003c/p>\n\u003cp>\u003cstrong>Экран 2. «Бизнес» (для продакта)\u003c/strong> — \u003ccode>orders.created.total\u003c/code> с разбивками, конверсия шагов воронки, суммы. Технических панелей здесь нет: продакт должен читать без переводчика.\u003c/p>\n\u003cp>\u003cstrong>Экран 3. «Детали» (для разбора)\u003c/strong> — JVM/GC, топ SQL-времён, внешние вызовы. Открывают при расследовании, не живут на первом экране.\u003c/p>\n\u003cp>Правило навигации: с любого графика — вниз к деталям (drill-down): с error rate — на разбивку по URI — на примеры логов с тем же тегом.\u003c/p>\n\u003ch2>Алерты: по симптомам, а не по причинам\u003c/h2>\n\u003cp>Плохой алерт смотрит на \u003cstrong>причину\u003c/strong> (CPU 80%) и срабатывает впустую: сервис при этом здоров. Хороший алерт смотрит на \u003cstrong>симптом\u003c/strong> — то, что чувствует пользователь:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">✅ error_rate &gt; 1% в течение 10 минут           — пользователи видят отказы\n✅ p99 /api/orders &gt; 2s в течение 10 минут      — пользователи ждут\n✅ lag(consumer_group) &gt; 100k и растёт 15 минут — события обрабатываются с опозданием\n✅ DLT depth &gt; 0 растёт 30 минут                — события теряют обработку\n❌ CPU &gt; 80%                                    — а сервис-то здоров\n\u003c/code>\u003c/pre>\n\u003cp>Формула читаемого алерта: \u003cstrong>условие + время горения + кому + что делать\u003c/strong> (runbook-ссылка). Алерт без инструкции «что теперь» перекладывает панику на дежурного.\u003c/p>\n\u003ch2>SLO: сколько можно ломаться\u003c/h2>\n\u003cp>\u003cstrong>SLO\u003c/strong> (Service Level Objective) — договор о допустимом несовершенстве: «99.9% запросов успешны за 30 дней». Из него растут правильные алерты: бюджет ошибок (error budget) тратится — темп настораживает (multi-window burn rate), кончился — инцидент и стоп-релизы. SLO переводит «медленно/частично/иногда» в числа, о которых договариваются продакт и инженеры.\u003c/p>\n\u003ch2>Культура: алерт — это обязательство\u003c/h2>\n\u003cul>\n\u003cli>Алерт сработал — действие есть (посмотрел, починил, завёл тикет). «Повалено, привыкли» — сигнал удалить или переделать алерт\u003c/li>\n\u003cli>Постмортем без поиска виноватых: сбой → разбор → действия в систему (новый алерт, метрика, тест)\u003c/li>\n\u003cli>Тишина дежурного — тоже метрика: page'ей мало, а пойманных проблем — много\u003c/li>\n\u003c/ul>\n\u003ch2>Собираем весь курс: чек-лист production-ready сервиса\u003c/h2>\n\u003cp>Пройден весь курс — соберём финальный список того, что отличает «работает у меня» от «живёт в проде»:\u003c/p>\n\u003cul>\n\u003cli>[ ] \u003cstrong>Контракт\u003c/strong>: OpenAPI-спека, ревью, версионирование (модуль 2)\u003c/li>\n\u003cli>[ ] \u003cstrong>Данные\u003c/strong>: миграции Liquibase, \u003ccode>validate\u003c/code>, индексы под запросы, идемпотентность (модуль 3)\u003c/li>\n\u003cli>[ ] \u003cstrong>Асинхронность\u003c/strong>: ключи событий, outbox для обязательных, DLT, идемпотентные обработчики (модуль 4)\u003c/li>\n\u003cli>[ ] \u003cstrong>Наблюдаемость\u003c/strong>: золотые сигналы + бизнес-метрики, структурированные логи с traceId, дашборд и алерты по симптомам (этот модуль)\u003c/li>\n\u003c/ul>\n\u003cp>Каждый пункт — одна-две строки кода или конфига в момент написания фичи, и недели разбора, если добавить «потом».\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Дашборд слоями: здоровье (дежурный) → бизнес (продакт) → детали (разбор), с drill-down\u003c/li>\n\u003cli>Алерты — по симптомам с временем горения; причина без следствия — не алерт\u003c/li>\n\u003cli>SLO превращает «достаточно ли надёжно» в договор с бюджетом ошибок\u003c/li>\n\u003cli>Алерт = обязательство действия; бесполезный алерт вреден\u003c/li>\n\u003cli>Финальный чек-лист курса связывает все пять модулей в одну дисциплину\u003c/li>\n\u003c/ul>\n\u003cp>Экзамен и кейс — впереди. После них вы прошли весь курс: от HTTP-запроса до сервиса, за которым видно здоровье бизнеса.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Алерт «CPU > 80%» срабатывает несколько раз в неделю, сервис при этом здоров и жалоб нет. Что не так?","options":["Алерт по причине, а не симптому: пользователи ничего не чувствуют — сигнал бесполезен, менять на симптом-алерты или удалить","Надо поднять порог до 95%","Так и должно быть: алерты для этого","CPU — неправильная метрика всегда"],"correct":0,"explanation":"Насыщение — повод посмотреть, симптом — повод действовать. Настроенные на причины алерты приучают игнорировать канал — и настоящий инцидент пройдёт мимо."},{"type":"multi","question":"Что делает алерт пригодным к действию? (несколько ответов)","options":["Условие с временем горения: не мигание, а состояние","Понятно кому адресовано","Ссылка на runbook: что делать первым шагом","Максимально громкое имя с восклицательными знаками"],"correct":[0,1,2],"explanation":"Алерт = условие + длительность + адресат + инструкция. Тональность названия на способность действовать не влияет."},{"type":"single","question":"Что такое error budget в SLO-подходе?","options":["Допустимый объём несовершенства за период: 99.9% цели → 0.1% бюджет на сбои, который можно «тратить» (например, на релизы)","Деньги, которые платят за мониторинг","Штраф за простой по договору","Запас мощности серверов"],"correct":0,"explanation":"Бюджет ошибок делает надёжность управляемой: тратится — осторожничаем; цел — можно рисковать быстрее. Общий язык продакта и инженеров."},{"type":"match","question":"Сопоставьте слой дашборда и его аудиторию.","pairs":[{"left":"Золотые сигналы + лаги","right":"Дежурный: «здоров ли сервис»"},{"left":"Воронка и бизнес-счётчики","right":"Продакт: «идут ли деньги»"},{"left":"JVM, топ SQL, внешние вызовы","right":"Инженер на разборе: «где именно»"},{"left":"Список активных алертов","right":"Все: «что горит сейчас»"}]},{"type":"single","question":"Паттерн drill-down на дашборде — это когда…","options":["С любого верхнего графика можно спуститься к деталям: error rate → по URI → примеры логов с тем же тегом","Все графики на одной странице без прокрутки","Дашборд открывается только с мобильного","Метрики хранятся вечно"],"correct":0,"explanation":"Расследование — это спуск от симптома к причине. Дашборд, где верх не связан с низом, заставляет собирать этот путь вручную в пяти вкладках."},{"type":"blank","question":"Как называется документ «что произошло, почему, что сделали, чему научились» после инцидента? (одним словом, русское)","answers":["постмортем","postmortem"],"explanation":"Постмортем без поиска виноватых: сбой → разбор → улучшения в системе (алерт, метрика, тест). Культура, а не ритуал."},{"type":"single","question":"Итог курса. Что отличает сервис, готовый к продакшену?","options":["Контракт со спекой и версионированием, миграции и индексы, надёжная асинхронность с идемпотентностью, наблюдаемость с алертами по симптомам","Только зелёные юнит-тесты","Самый новый фреймворк","Много ручных инструкций по эксплуатации"],"correct":0,"explanation":"Пять модулей курса — пять граней одного навыка: писать системы, которые живут без ручного присмотра и рассказывают о себе, когда что-то не так."}]],"cases":[]},{"id":"m5-exam","title":"Экзамен модуля и кейс","module":5,"moduleTitle":"Наблюдаемость","order":6,"baseOrder":null,"lab":null,"html":"\u003ch1>Экзамен модуля «Наблюдаемость» — финальный экзамен курса\u003c/h1>\n\u003cp>Последний рывок: кейс своими словами, затем 15 вопросов. Порог прежний — 80%.\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","topic":"m5-lesson-03","question":"p50 = 120ms, p99 = 6s. Продакт говорит «в среднем быстро — претензий нет». Ваш контраргумент?","options":["Каждый сотый запрос ждёт 6 секунд: на 100k заказов в день это тысяча страдающих пользователей в день — хвост важнее среднего","Среднее всегда врёт, p50 не существует","Нужно удалить метрику","Надо перемерить утром"],"correct":0,"explanation":"Среднее прячет хвосты, пользователи — именно хвосты. Перцентили — обязательная часть дашборда задержек."},{"type":"single","topic":"m5-lesson-02","question":"Counter orders.created.total помечен тегом orderId для удобства поиска конкретного заказа. Вердикт?","options":["Катастрофа кардинальности: миллион заказов = миллион рядов; поиск конкретного заказа — работа логов с orderId","Отличная идея: так метрика информативнее","Нормально, если заказов меньше тысячи","Тег orderId ускоряет Prometheus"],"correct":0,"explanation":"Теги — конечные оси. Уникальные идентификаторы живут в логах/трейсах, где поиск по конкретике и предусмотрен."},{"type":"multi","topic":"m5-lesson-03","question":"Что должно быть на первом экране дежурного? (несколько ответов)","options":["Error rate и p99 по ключевым эндпоинтам","Лаг консюмер-групп и глубина DLT","Полный дамп всех логов за сутки","Насыщение: пул соединений с БД"],"correct":[0,1,3],"explanation":"Первый экран — золотые сигналы + асинхронность. Логи открывают по следу с метрик, а не читают поток сознания."},{"type":"single","topic":"m5-lesson-03","question":"Где считается доля 5xx?","options":["На дашборде: rate(5xx)/rate(all) из атомарных счётчиков запросов","В коде метрикой error_rate_percent","В логах регуляркой каждые 5 минут","В отчёте за месяц"],"correct":0,"explanation":"В коде — факты, в PromQL — арифметика. Готовые проценты нельзя переагрегировать по-новому."},{"type":"blank","topic":"m5-lesson-05","question":"Как называется договор «99.9% запросов успешны за 30 дней»? (аббревиатура)","answers":["SLO"],"explanation":"Service Level Objective. Из него — бюджет ошибок и правильные алерты по темпу его сгорания."},{"type":"match","topic":"m5-lesson-01","question":"Сопоставьте артефакт наблюдаемости и его роль в расследовании.","pairs":[{"left":"Алерт по симптомам","right":"«Встань и посмотри» — вовремя и по делу"},{"left":"Трейс с span'ами","right":"«Где именно в цепочке»"},{"left":"Структурированный лог с traceId","right":"«Что конкретно случилось»"},{"left":"Runbook","right":"«Что делать первым шагом»"}]},{"type":"single","topic":"m5-lesson-04","question":"Валидационные ошибки 400 сыплются ERROR'ом. Почему это опасно именно ночью?","options":["Дежурный приучится игнорировать канал — и настоящий ERROR в 3 часа пройдёт мимо","ERROR нагревает сервер","Логи станут синими","Ничего: ночью никто не смотрит"],"correct":0,"explanation":"Сигнал живёт доверием. Ожидаемые события — WARN/DEBUG; ERROR — только то, что требует человека."},{"type":"single","topic":"m5-lesson-02","codeLang":"java","code":"Counter.builder(\"payments.charge.total\")\n       .tag(\"result\", \"success\")\n       .register(registry);\n","question":"Как из этой метрики получить долю успешных платежей?","options":["rate(payments.charge.total{result=\"success\"}) / rate(payments.charge.total) — на дашборде, из счётчиков","Написать вторую метрику с процентом в коде","Разделить значения вручную на калькуляторе раз в день","Никак: счётчик не для этого"],"correct":0,"explanation":"Атомарные счётчики по результатам (success/failure) + арифметика дашборда = любая производная без нового кода.","codeHtml":"Counter.builder(\u003cspan class=\"hljs-string\">&quot;payments.charge.total&quot;\u003c/span>)\n       .tag(\u003cspan class=\"hljs-string\">&quot;result&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;success&quot;\u003c/span>)\n       .register(registry);\n"},{"type":"single","topic":"m5-lesson-04","question":"traceId в MDC входящего HTTP-запроса, но в Kafka-событиях его нет. Что чинить?","options":["Продюсера: писать traceId в заголовок сообщения; консюмеру: класть его в MDC перед обработкой","Ничего: события и без него работают","Дублировать traceId в каждое поле события","Отключить MDC"],"correct":0,"explanation":"Заголовки Kafka — транспорт корреляции. Без них асинхронная цепочка разрывается на несвязанные логи."},{"type":"multi","topic":"m5-lesson-05","question":"Алерт пригоден к действию, если: (несколько ответов)","options":["Есть время горения — это состояние, а не мигание","Понятен адресат","Есть runbook со первым шагом","Он срабатывает по каждой метрике, которую видно"],"correct":[0,1,2],"explanation":"«Алерт на всё» = «алерт ни на что». Отбор и молчание — половина мастерства."},{"type":"single","topic":"m5-lesson-03","question":"Бизнес-метрики фичи добавили через месяц после релиза. Что потеряла команда?","options":["Месяц жизни фичи без обратной связи: сломанную воронку/рекламу увидели бы счётчики сразу — теперь не поймёшь, «всегда так было» или «сломалось»","Ничего: метрики задним числом строятся из логов","Релиз отменился бы","Компанию"],"correct":0,"explanation":"Наблюдаемость закладывается в момент фичи — иначе нет базовой линии, с которой сравнивать. Логи не заменят ряд значений."},{"type":"single","topic":"m5-lesson-05","question":"Симптом-алерты против алертов-причин: выберите правильную пару для сервиса заказов.","options":["«error_rate > 1% 10 минут» и «p99 > 2s 10 минут» — симптомы; «CPU 80%» — причина","«CPU 80%» — симптом; «error_rate» — причина","Оба — причины","Разницы нет"],"correct":0,"explanation":"Симптом — то, что чувствует пользователь. Причины (насыщение) — контекст для разбора, не повод будить людей сами по себе."},{"type":"blank","topic":"m5-lesson-05","question":"Как называется документ разбора инцидента «что случилось/почему/действия»? (одно слово)","answers":["постмортем","postmortem"],"explanation":"Постмортем без поиска виноватых: каждый сбой улучшает систему (алерт, метрика, тест), а не настроение команды."},{"type":"single","topic":"m5-lesson-04","codeLang":"plaintext","code":"14:22:01 gateway WARN path=/api/orders status=504 traceId=a1f0\n14:22:01 orders  WARN dependency=payment elapsedMs=1930 traceId=a1f0\n14:22:01 orders  WARN dependency=db elapsedMs=1870 traceId=b2c9\n","question":"Какой следующий шаг поможет объяснить 504 именно у этого запроса?","options":["Открыть трейс a1f0 и проверить длительность и исход вызова платёжного сервиса","Открыть трейс b2c9 и проверить, блокировалась ли запись заказа в базе","Сравнить p99 базы и платёжного сервиса за час и выбрать зависимость с большим значением","Найти последний деплой сервиса заказов и сравнить общее число 5xx до и после релиза"],"correct":0,"explanation":"Шлюз и медленный платёжный вызов имеют один traceId. Длительность и исход этого вызова в трейсе помогут проверить, укладывался ли он в срок ожидания шлюза. Запись про БД относится к другому запросу. Сводные метрики описывают группу запросов.","codeHtml":"14:22:01 gateway WARN path=/api/orders status=504 traceId=a1f0\n14:22:01 orders  WARN dependen
