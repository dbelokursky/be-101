ss=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Обновлено\u003c/span> }\n        \u003cspan class=\"hljs-attr\">&quot;404&quot;:\u003c/span> { \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Не\u003c/span> \u003cspan class=\"hljs-string\">найдено\u003c/span> }\n"},{"type":"multi","question":"Зачем в схемах и ответах заполнять example? (несколько ответов)","options":["Swagger UI покажет живой пример — документация понятнее","QA использует примеры как согласованные тест-данные","Фронтендер пишет обработку ошибок по примерам, не спрашивая в чате","Примеры заменяют собой описание схем"],"correct":[0,1,2],"explanation":"Примеры — иллюстрации поверх формального описания, а не его замена. Схема остаётся источником правил, пример — образцом."},{"type":"match","question":"Сопоставь раздел спеки и его роль.","pairs":[{"left":"info","right":"Название, версия и описание API"},{"left":"paths","right":"Эндпоинты: методы, параметры, ответы"},{"left":"components/schemas","right":"Переиспользуемые структуры данных"},{"left":"servers","right":"Адреса, где живёт API"}]},{"type":"blank","question":"Каким ключевым словом ссылаются на переиспользуемую схему в другом месте спеки? (со значком $)","answers":["$ref"],"explanation":"$ref: \"#/components/schemas/Имя\" — ссылка на описанную схему. Описали один раз — используем во всех ответах и запросах."},{"type":"single","question":"Команда работает по API-First. Что появится раньше — Java-код контроллера или спека?","options":["Спека: её согласуют с потребителями, из неё сгенерят заготовки, код пишется под контракт","Код: спека генерируется из готового контроллера","Одновременно — это одно и то же","Зависит от дня недели"],"correct":0,"explanation":"В API-First источник правды — спека. Генерация спеки из кода — подход code-first с документацией; он не даёт ревью контракта до реализации."},{"type":"single","codeLang":"yaml","code":"CreateTaskRequest:\n  type: object\n  required: [title]\n  properties:\n    title:\n      type: string\n      minLength: 1\n","question":"Что произойдёт, если клиент отправит {\"title\": \"\"} против такой схемы?","options":["Запрос не соответствует контракту: пустой title нарушает minLength — сервер вправе ответить 400","Сервер обязан создать задачу с пустым названием","Спека автоматически подставит дефолтное значение","Ничего: minLength не влияет на валидацию"],"correct":0,"explanation":"minLength: 1 плюс required — правило контракта: пустая строка невалидна. В Spring то же правило выражается @NotBlank, и ответ — 400.","codeHtml":"\u003cspan class=\"hljs-attr\">CreateTaskRequest:\u003c/span>\n  \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">object\u003c/span>\n  \u003cspan class=\"hljs-attr\">required:\u003c/span> [\u003cspan class=\"hljs-string\">title\u003c/span>]\n  \u003cspan class=\"hljs-attr\">properties:\u003c/span>\n    \u003cspan class=\"hljs-attr\">title:\u003c/span>\n      \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>\n      \u003cspan class=\"hljs-attr\">minLength:\u003c/span> \u003cspan class=\"hljs-number\">1\u003c/span>\n"}]],"cases":[]},{"id":"m2-lesson-03","title":"REST-практики","module":2,"moduleTitle":"Проектирование API","order":3,"baseOrder":5,"lab":null,"html":"\u003ch1>Урок 3. REST-практики: ресурсы, ошибки, версионирование\u003c/h1>\n\u003cp>Вы умеете описывать контракт. Теперь — правила хорошего тона: как называть ресурсы, как отдавать ошибки и как менять API, не подставляя потребителей. Эти правила не «буква стандарта», а выработанные сообществом привычки — следуя им, вы получаете предсказуемый API, который не надо объяснять каждому новичку.\u003c/p>\n\u003ch2>Ресурсный дизайн: существительные вместо глаголов\u003c/h2>\n\u003cp>REST строится вокруг \u003cstrong>ресурсов\u003c/strong> — сущностей, с которыми работают через пути. Путь — «что», HTTP-метод — «что сделать»:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Хорошо\u003c/th>\n\u003cth>Плохо\u003c/th>\n\u003cth>Почему\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/tasks\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>GET /api/getAllTasks\u003c/code>\u003c/td>\n\u003ctd>Метод уже говорит «получить»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/tasks\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>POST /api/createTask\u003c/code>\u003c/td>\n\u003ctd>POST = создать\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PATCH /api/tasks/42\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>POST /api/updateTask?id=42\u003c/code>\u003c/td>\n\u003ctd>PATCH = изменить\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DELETE /api/tasks/42\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>GET /api/deleteTask?id=42\u003c/code>\u003c/td>\n\u003ctd>DELETE = удалить; GET не меняет!\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Вложенность выражает принадлежность: \u003ccode>/api/projects/7/tasks\u003c/code> — задачи проекта 7. Глубже двух уровней обычно не опускаются.\u003c/p>\n\u003cp>\u003cstrong>А если действие — не CRUD?\u003c/strong> Бывают операции вне «создай-измени-удали»: «отправить на проверку», «отменить заказ». Два честных варианта:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>POST /api/orders/42/cancellations\u003c/code> — создайте «факт отмены» как ресурс (пуристично)\u003c/li>\n\u003cli>\u003ccode>POST /api/orders/42/cancel\u003c/code> — глагольный эндпоинт (прагматично, все поймут)\u003c/li>\n\u003c/ul>\n\u003cp>Главное — не прятать смену состояния в GET: «открой ссылку — заказ отменится» — путь к беде (краулеры, префетч браузера).\u003c/p>\n\u003ch2>Пагинация, фильтрация, сортировка\u003c/h2>\n\u003cp>Списки отдают порциями. Два основных способа:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>limit/offset\u003c/strong>: \u003ccode>GET /api/tasks?limit=20&amp;offset=40\u003c/code> — простые «страницы». Слабость: на живых данных элемент может «уехать» между страницами.\u003c/li>\n\u003cli>\u003cstrong>cursor\u003c/strong>: \u003ccode>GET /api/tasks?limit=20&amp;cursor=eyJpZCI6NDJ9\u003c/code> — «дай следующее после этого». Надёжнее для бесконечных лент, сложнее.\u003c/li>\n\u003c/ul>\n\u003cp>Фильтры и сортировка — query-параметрами: \u003ccode>?status=done&amp;assignee=ann&amp;sort=deadline,asc\u003c/code>. В спеке каждый параметр описан — и потребитель узнаёт о возможностях до первого запроса.\u003c/p>\n\u003ch2>Единый формат ошибок\u003c/h2>\n\u003cp>Для ошибок можно договориться о едином формате \u003cstrong>Problem Details\u003c/strong>. Пример ниже показывает тело с типом \u003ccode>application/problem+json\u003c/code>. \u003ca href=\"https://www.rfc-editor.org/rfc/rfc9457.html\">RFC 9457\u003c/a>\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;type&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;https://tasks.example.com/errors/validation&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Запрос не прошёл валидацию&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;status&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">400\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;detail&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;title: не должен быть пустым&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;instance&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;/api/projects/7/tasks&quot;\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Поля стабильны: \u003ccode>title\u003c/code> — что случилось (человеком), \u003ccode>detail\u003c/code> — подробности, \u003ccode>type\u003c/code> — ссылка на описание ошибки. В Spring Boot есть встроенная поддержка (ProblemDetail), а для бизнес-ошибок добавляют свой код: \u003ccode>&quot;code&quot;: &quot;TASK_ALREADY_DONE&quot;\u003c/code> — по нему фронт принимает решение, а не парсит текст.\u003c/p>\n\u003cp>Правило: \u003cstrong>машина — по коду/статусу, человек — по тексту\u003c/strong>. Никогда не завязывайтесь на \u003ccode>detail\u003c/code> как на контракт: это сообщение, оно может измениться.\u003c/p>\n\u003ch2>Идемпотентность: повторить без страха\u003c/h2>\n\u003cp>Запрос \u003cstrong>идемпотентен\u003c/strong>, если его повторение не меняет результат сверх первого выполнения:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>GET\u003c/code>, \u003ccode>PUT\u003c/code>, \u003ccode>DELETE\u003c/code> — идемпотентны (по духу): сколько ни повторяй — состояние то же\u003c/li>\n\u003cli>\u003ccode>POST\u003c/code> — нет: два одинаковых POST = два заказа\u003c/li>\n\u003c/ul>\n\u003cp>Проблема: сети падают, клиенты ретраят. Двойной POST «оформить заказ» — двойной платёж. Решения:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Идемпотентный ключ\u003c/strong>: клиент генерирует \u003ccode>Idempotency-Key: 7f3a...\u003c/code>, сервер запоминает: «этот ключ уже выполнял — верну тот же результат без повторного создания»\u003c/li>\n\u003cli>Дизайн API: \u003ccode>PUT /api/orders/{uuid}\u003c/code> (клиент придумал id заранее) вместо \u003ccode>POST /api/orders\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch2>Версионирование и обратная совместимость\u003c/h2>\n\u003cp>\u003cstrong>Обратно совместимое\u003c/strong> изменение — старые клиенты продолжают работать:\u003c/p>\n\u003cul>\n\u003cli>добавить новое поле в ответ ✓ (старый клиент его игнорирует)\u003c/li>\n\u003cli>добавить новый эндпоинт или необязательный параметр ✓\u003c/li>\n\u003cli>удалить поле, переименовать, изменить смысл ✗ (это breaking change)\u003c/li>\n\u003c/ul>\n\u003cp>Breaking changes unavoidable — тогда \u003cstrong>новая версия\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>в пути: \u003ccode>/api/v2/tasks\u003c/code> — просто и наглядно, стандарт де-факто\u003c/li>\n\u003cli>в заголовке: \u003ccode>Accept: application/vnd.tasks.v2+json\u003c/code> — чище идеологически, но менее заметен\u003c/li>\n\u003c/ul>\n\u003cp>Уходящая версия не выключается сразу: заголовок \u003ccode>Deprecation\u003c/code>/\u003ccode>Sunset\u003c/code>, письмо потребителям, период параллельной работы версий (месяцы!), мониторинг доли трафика на старой версии — выключаем, когда доля ≈ 0.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> обратная совместимость — это про ваш спокойный сон. Если бэкенд добавил поле — ваш код не сломается. Если переименовал без версии — упадёт в рантайме, возможно, только в одном rarely-используемом экране. Сгенерированный из спеки клиент ловит такие вещи на этапе компиляции.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> проверяйте не только «работает», но и совместимость: старый клиент против нового бэкенда — отдельный класс тестов. Идентичные повторные запросы (идемпотентность) — тоже ваш кейс: ретраи в проде будут.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> deprecation — это управляемое изменение, у которого есть владелец, срок и метрика доли старой версии. Когда просите «убрать поле» — уточняйте план переезда потребителей: это проект, а не коммит.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Ресурсы — существительные; действие — HTTP-метод; смену состояния не прячьте в GET\u003c/li>\n\u003cli>Списки — с пагинацией; фильтры и сортировка — query-параметры, описанные в спеке\u003c/li>\n\u003cli>Ошибки — единый формат (Problem Details): машина — по статусу и коду, человек — по тексту\u003c/li>\n\u003cli>POST не идемпотентен: идемпотентные ключи или клиентские uuid для критичных операций\u003c/li>\n\u003cli>Добавлять поля можно, удалять — только через новую версию с периодом deprecation\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — GraphQL: стиль API, где клиент сам говорит, какие поля ему нужны.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Продакт просит эндпоинт «закрыть все выполненные задачи квартала». Какой вариант лучше остальных?","options":["POST /api/projects/7/tasks:close-completed — массовая операция вне CRUD, глагол в подпути, состояние меняет только POST","GET /api/closeCompletedTasks?quarter=Q3 — короче и быстрее","DELETE /api/tasks?quarter=Q3 — закрытие похоже на удаление","PATCH /api/tasks — и пусть клиент сам перебирает задачи циклом"],"correct":0,"explanation":"Массовая операция — законный случай глагольного эндпоинта под POST. GET не должен менять состояние; перебор клиентом — N запросов и гонки вместо одной атомарной операции."},{"type":"multi","question":"Какие изменения API обратно совместимы? (несколько ответов)","options":["Новое необязательное поле в ответе","Новый эндпоинт","Переименование поля name в fullName","Новое необязательное query-параметр фильтрации"],"correct":[0,1,3],"explanation":"Старые клиенты игнорируют новые поля, параметры и эндпоинты. Переименование ломает всех, кто читал поле — это breaking change, требующий версии и deprecation."},{"type":"single","codeLang":"json","code":"{\n  \"status\": 400,\n  \"title\": \"Запрос не прошёл валидацию\",\n  \"detail\": \"title: не должен быть пустым\",\n  \"code\": \"VALIDATION_ERROR\"\n}\n","question":"По какому полю фронту стоит принимать решение «показать красное поле с текстом»?","options":["По code (и status) — стабильным машинным признакам","По detail — там человекочитаемое объяснение","По title — он короче","По порядку полей в JSON"],"correct":0,"explanation":"detail и title — тексты для людей, их формулировки меняются без предупреждения. Стабильный контракт для логики — статус и машинный код ошибки.","codeHtml":"\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;status&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">400\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Запрос не прошёл валидацию&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;detail&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;title: не должен быть пустым&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;code&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;VALIDATION_ERROR&quot;\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n"},{"type":"blank","question":"Как называется свойство запроса, когда его повторное выполнение не меняет результат сверх первого раза?","answers":["идемпотентность","идемпотентность"],"correct":0,"explanation":"Идемпотентность. GET/PUT/DELETE идемпотентны по духу, POST — нет; для критичных POST-операций вводят идемпотентные ключи."},{"type":"match","question":"Сопоставь требование и правильный дизайн эндпоинта.","pairs":[{"left":"Список задач со 2-й страницы по 20 штук","right":"GET /api/tasks?limit=20&offset=20"},{"left":"Создать задачу","right":"POST /api/tasks с телом запроса"},{"left":"Отметить задачу выполненной","right":"PATCH /api/tasks/42 с {\"done\":true}"},{"left":"Убрать задачу","right":"DELETE /api/tasks/42"}]},{"type":"single","question":"Команда перешла на /api/v2/tasks. Когда можно выключить /api/v1/tasks?","options":["Когда мониторинг покажет, что доля трафика на v1 практически нулевая, и потребители предупреждены","Сразу после релиза v2 — пусть переезжают","Через неделю — хватит всем","Никогда: v1 должна жить вечно"],"correct":0,"explanation":"Deprecation — управляемый процесс: предупреждение, переходный период, метрика реального использования. Чуть-чуть трафика на v1 может значить «забытый cron, который уронит прод»."},{"type":"single","question":"Клиент шлёт POST /api/payments, сеть падает на ответе, клиент ретраит — платёж проходит дважды. Что поможет?","options":["Идемпотентный ключ: клиент генерирует его один раз на операцию, сервер при повторе возвращает результат первого выполнения","Перейти на GET /api/payments","Увеличить таймаут на клиенте","Ничего: двойные платежи неизбежны"],"correct":0,"explanation":"Idempotency-Key — стандартное решение: сервер запоминает результат по ключу и на повтор отвечает тем же, не создавая второй платёж. GET для платежей — смена состояния через GET, запрещённый приём."}]],"cases":[]},{"id":"m2-lesson-04","title":"GraphQL","module":2,"moduleTitle":"Проектирование API","order":4,"baseOrder":null,"lab":{"title":"Лаба 4. GraphQL","description":"Обслужить готовую GraphQL-схему задачника: @QueryMapping и @MutationMapping над готовым хранилищем. Проверка — 6 запросов-тестов и песочница GraphiQL.","branch":"lab-4","branchSolution":"lab-4-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 4. GraphQL: API, где клиент заказывает данные\u003c/h1>\n\u003cp>REST-контракт жёсток: сервер решил, какие поля отдать, — клиент получает их все. Обычно это ок. Но у фронтенда бывают экраны, где REST либо отдаёт лишнее, либо требует нескольких запросов. На этот случай есть другой стиль — GraphQL.\u003c/p>\n\u003ch2>Две боли REST\u003c/h2>\n\u003cp>\u003cstrong>Over-fetching (лишние данные).\u003c/strong> Экрану «список задач» нужно только \u003ccode>title\u003c/code> и \u003ccode>done\u003c/code>, а \u003ccode>GET /api/tasks\u003c/code> отдаёт ещё описание, автора, историю, вложения — тянет из базы, сериализует, гонит по сети.\u003c/p>\n\u003cp>\u003cstrong>Under-fetching (мало данных).\u003c/strong> Список задач получили. Теперь для каждой — имя проекта: \u003ccode>GET /api/projects/7\u003c/code>, \u003ccode>GET /api/projects/8\u003c/code>… Классический \u003cstrong>N+1\u003c/strong>: 1 запрос за списком + N запросов за деталями.\u003c/p>\n\u003cp>GraphQL отвечает на обе боли одним приёмом: клиент описывает в запросе, какие именно поля ему нужны.\u003c/p>\n\u003ch2>Схема и запрос\u003c/h2>\n\u003cp>Сначала сервер описывает \u003cstrong>схему\u003c/strong> — какие типы и поля существуют (файл \u003ccode>schema.graphqls\u003c/code> в Spring-проекте):\u003c/p>\n\u003cpre>\u003ccode class=\"language-graphql\">\u003cspan class=\"hljs-keyword\">type\u003c/span> Task \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    \u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> ID\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    \u003cspan class=\"hljs-symbol\">title\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> String\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    \u003cspan class=\"hljs-symbol\">done\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Boolean\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    \u003cspan class=\"hljs-symbol\">deadline\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> String\n    \u003cspan class=\"hljs-symbol\">project\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Project\u003cspan class=\"hljs-punctuation\">!\u003c/span>          \u003cspan class=\"hljs-comment\"># вложенный объект!\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\n\u003cspan class=\"hljs-keyword\">type\u003c/span> Project \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    \u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> ID\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    \u003cspan class=\"hljs-symbol\">name\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> String\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\n\u003cspan class=\"hljs-keyword\">type\u003c/span> \u003cspan class=\"hljs-keyword\">Query\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    tasks\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">done\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Boolean\u003cspan class=\"hljs-punctuation\">)\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">[\u003c/span>Task\u003cspan class=\"hljs-punctuation\">!\u003c/span>\u003cspan class=\"hljs-punctuation\">]\u003c/span>\u003cspan class=\"hljs-punctuation\">!\u003c/span>\n    task\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> ID\u003cspan class=\"hljs-punctuation\">!\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Task\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>!\u003c/code> — «не null». \u003ccode>[Task!]!\u003c/code> — «список не-null задач, сам список тоже не null». Читается как типы в TS.\u003c/p>\n\u003cp>Клиент отправляет \u003cstrong>запрос\u003c/strong> — заказывает ровно то, что нужно экрану:\u003c/p>\n\u003cpre>\u003ccode class=\"language-graphql\">\u003cspan class=\"hljs-keyword\">query\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    tasks\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">done\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n        title\n        done\n        project \u003cspan class=\"hljs-punctuation\">{\u003c/span> name \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n    \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>И получает \u003cstrong>ровно это\u003c/strong> — ни полем больше:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;data&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    \u003cspan class=\"hljs-attr\">&quot;tasks&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">[\u003c/span>\n      \u003cspan class=\"hljs-punctuation\">{\u003c/span> \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Купить молоко&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;done&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-literal\">\u003cspan class=\"hljs-keyword\">false\u003c/span>\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;project&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span> \u003cspan class=\"hljs-attr\">&quot;name&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Дом&quot;\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n      \u003cspan class=\"hljs-punctuation\">{\u003c/span> \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Ревью PR&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;done&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-literal\">\u003cspan class=\"hljs-keyword\">false\u003c/span>\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;project&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span> \u003cspan class=\"hljs-attr\">&quot;name&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Работа&quot;\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n    \u003cspan class=\"hljs-punctuation\">]\u003c/span>\n  \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Один эндпоинт (\u003ccode>POST /graphql\u003c/code>), один запрос, вложенность на любую глубину схемы, форма ответа повторяет форму запроса. Over-fetching и N+1 с точки зрения клиента исчезли.\u003c/p>\n\u003cp>Изменения данных — \u003cstrong>мутации\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-graphql\">\u003cspan class=\"hljs-keyword\">mutation\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    completeTask\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n        id\n        done\n    \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003ch2>Как это выглядит в Spring Boot\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Controller\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">TaskGraphqlController\u003c/span> {\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> TaskService taskService;\n\n    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">TaskGraphqlController\u003c/span>\u003cspan class=\"hljs-params\">(TaskService taskService)\u003c/span> {\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.taskService = taskService;\n    }\n\n    \u003cspan class=\"hljs-meta\">@QueryMapping\u003c/span>                       \u003cspan class=\"hljs-comment\">// обслуживает поле tasks из схемы\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-title function_\">tasks\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Argument\u003c/span> Boolean done)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> taskService.find(done);\n    }\n\n    \u003cspan class=\"hljs-meta\">@MutationMapping\u003c/span>                    \u003cspan class=\"hljs-comment\">// обслуживает мутацию completeTask\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-title function_\">completeTask\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Argument\u003c/span> Long id)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> taskService.complete(id);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Тот же сервисный слой, те же сущности — меняется только «обвязка»: вместо \u003ccode>@GetMapping\u003c/code> — \u003ccode>@QueryMapping\u003c/code>. REST и GraphQL спокойно живут в одном приложении рядом: REST для простых интеграций, GraphQL для насыщенных фронтендов.\u003c/p>\n\u003ch2>GraphQL vs REST: что когда\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>REST\u003c/th>\n\u003cth>GraphQL\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Форма ответа\u003c/td>\n\u003ctd>Задаёт сервер\u003c/td>\n\u003ctd>Заказывает клиент\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Число эндпоинтов\u003c/td>\n\u003ctd>Много\u003c/td>\n\u003ctd>Один (\u003ccode>/graphql\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Кэширование HTTP\u003c/td>\n\u003ctd>Естественное (GET, CDN)\u003c/td>\n\u003ctd>Сложнее (всё через POST)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Инструменты\u003c/td>\n\u003ctd>Все привыкли\u003c/td>\n\u003ctd>GraphiQL, типизированные клиенты\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Валидация контракта\u003c/td>\n\u003ctd>OpenAPI-спека\u003c/td>\n\u003ctd>Схема — сама спека, валидируется рантаймом\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Хорош когда\u003c/td>\n\u003ctd>Простые CRUD-интеграции, кэш, публичные API\u003c/td>\n\u003ctd>Сложные экраны, много клиентов с разными потребностями\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>GraphQL — не «замена REST», а инструмент под конкретную боль. Внутри компании: мобильный клиент с медленной сетью и богатым UI — GraphQL; webhook для партнёра — REST.\u003c/p>\n\u003cp>Одно предостережение: гибкость GraphQL ложится на сервер. Клиент может заказать \u003ccode>project { tasks { project { tasks ... } } }\u003c/code> — и сервер должен отвечать быстро и не падать. В Spring это решается дозагрузкой данных пачками (batching), но это уже глубина для бэкенд-разработки.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> если вы работали с Apollo/Relay — вы уже писали эти запросы. Новое здесь — обратная сторона: как серверу жить с произвольными запросами, и почему бэкендеры иногда просят «не запрашивайте это поле в списке».\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> тестируя GraphQL, проверяйте не только форму «что попросили — то получили», но и границы: запросы огромной глубины, отсутствующие поля, ошибки в одном поле запроса (GraphQL не падает целиком — возвращает data и errors одновременно!).\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> в GraphQL сущности и связи схемы видны напрямую: \u003ccode>Task.project\u003c/code> — задача связана с проектом. Схема — почти ваша ER-диаграмма предметной области, и она же — исполняемый контракт.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>GraphQL лечит over-fetching и under-fetching: клиент заказывает ровно нужные поля одним запросом\u003c/li>\n\u003cli>Сервер описывает схему (типы, Query, Mutation); ответ повторяет форму запроса\u003c/li>\n\u003cli>В Spring: \u003ccode>@QueryMapping\u003c/code>/\u003ccode>@MutationMapping\u003c/code> поверх того же сервисного слоя; REST и GraphQL живут рядом\u003c/li>\n\u003cli>Выбор — не религия: REST — простота и кэш, GraphQL — гибкие богатые клиенты\u003c/li>\n\u003cli>Цена гибкости — сложность сервера: произвольные запросы надо уметь обслуживать быстро\u003c/li>\n\u003c/ul>\n\u003cp>Последний урок модуля — как контракт (любой: OpenAPI или GraphQL-схема) живёт в процессах команды.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Экрану нужны только title задач, а REST отдаёт 12 полей, включая тяжёлую историю изменений. Как называется эта боль?","options":["Over-fetching: клиент получает лишние данные","Under-fetching: клиенту не хватает данных","N+1: запросов слишком много","Блокировка: запросы идут последовательно"],"correct":0,"explanation":"Over-fetching — «слишком много дали». Сервер тянет из базы и сериализует поля, которые клиент выбросит."},{"type":"single","codeLang":"graphql","code":"query {\n    task(id: 42) {\n        title\n        project { name }\n    }\n}\n","question":"Что вернёт сервер на такой GraphQL-запрос (при валидной схеме из урока)?","options":["Объект с title задачи и name её проекта — только эти поля","Всю задачу целиком: GraphQL всегда отдаёт все поля","Только id — по нему клиент дорезолвит остальное","Ошибку: в одном запросе нельзя просить вложенные объекты"],"correct":0,"explanation":"Форма ответа повторяет форму запроса: попросили title и project.name — ровно их и получили. Вложенность — норма GraphQL.","codeHtml":"\u003cspan class=\"hljs-keyword\">query\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n    task\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">id\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span>\n        title\n        project \u003cspan class=\"hljs-punctuation\">{\u003c/span> name \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n    \u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n"},{"type":"single","question":"Почему в GraphQL всё ходит через POST /graphql и с этим больно кэшировать на уровне HTTP?","options":["POST-тело не кэшируется стандартными HTTP-механизмами, в отличие от GET с его URL и CDN","GraphQL не работает по HTTP","POST медленнее GET в любом случае","Серверы запрещают кэшировать ответы GraphQL"],"correct":0,"explanation":"HTTP-кэширование завязано на GET и URL. Весь GraphQL — POST с телом-запросом, стандартные механизмы мимо. Кэш строят на уровне клиентов (Apollo cache и др.)."},{"type":"multi","question":"Что верно про схему GraphQL? (несколько ответов)","options":["type Task { ... } описывает тип и его поля — как интерфейс в TS","Восклицательный знак (String!) означает «не null»","Схему пишет клиент под каждый экран","Query и Mutation — корневые типы: входные точки чтения и изменения"],"correct":[0,1,3],"explanation":"Схему описывает сервер один раз — это контракт. Клиенты лишь выбирают подмножество полей в своих запросах."},{"type":"blank","question":"Как называется GraphQL-операция изменения данных (аналог POST/PATCH в REST)? (одно слово)","answers":["mutation","мутация"],"explanation":"Mutation. Чтение — query, изменение — mutation; в Spring их обслуживают @QueryMapping и @MutationMapping."},{"type":"single","question":"Вы проектируете API для партнёрского webhook-интегратора и для своего мобильного приложения с 20 экранами. Что разумно?","options":["Партнёру — простой REST (кэш, привычность, минимум движущихся частей); приложению — GraphQL под разные экраны","Всем GraphQL: зачем два стиля","Всем REST: GraphQL — хайп","Партнёру — GraphQL, приложению — REST"],"correct":0,"explanation":"Инструмент под потребителя. Партнёру важна предсказуемость и кэшируемость; своему приложению с богатыми экранами — гибкость заказов. Оба живут в одном Spring-приложении."},{"type":"single","codeLang":"java","code":"@QueryMapping\npublic List\u003cTask> tasks(@Argument Boolean done) {\n    return taskService.find(done);\n}\n","question":"Что делает этот код в Spring-приложении со схемой GraphQL?","options":["Обслуживает запросы к полю tasks схемы, передавая аргумент done в сервис","Создаёт REST-эндпоинт /tasks?done=...","Определяет новый тип в схеме GraphQL","Публикует событие в Kafka"],"correct":0,"explanation":"@QueryMapping связывает поле Query.tasks из schema.graphqls с методом. Схема описывает контракт, метод — его исполнение; @Argument достаёт аргументы запроса.","codeHtml":"\u003cspan class=\"hljs-meta\">@QueryMapping\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-title function_\">tasks\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Argument\u003c/span> Boolean done)\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">return\u003c/span> taskService.find(done);\n}\n"}]],"cases":[]},{"id":"m2-lesson-05","title":"Контракт в работе команды","module":2,"moduleTitle":"Проектирование API","order":5,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 5. Контракт в работе команды\u003c/h1>\n\u003cp>Последний урок модуля — про процесс. Спека сама по себе не спасает: «OpenAPI-файл, который обновляют после кода раз в квартал» — это просто устаревшая документация. Ценность появляется, когда контракт встроен в ежедневную работу всех ролей.\u003c/p>\n\u003ch2>Жизненный цикл фичи в API-First\u003c/h2>\n\u003cp>Разберём типичную фичу — «просроченные задачи подсвечивать на дашборде»:\u003c/p>\n\u003cp>\u003cstrong>1. Черновик спеки (бэкенд + аналитик).\u003c/strong> В \u003ccode>openapi.yaml\u003c/code> появляется изменение: у \u003ccode>TaskResponse\u003c/code> новое вычисляемое поле \u003ccode>overdue: boolean\u003c/code>. Всё обсуждение предметики происходит здесь — на языке полей и типов.\u003c/p>\n\u003cp>\u003cstrong>2. Ревью контракта (все).\u003c/strong> PR со спекой смотрят: аналитик — семантика («overdue — это только дата прошла, или ещё и не done?»), фронтендер — достаточно ли полей для UI, QA — описаны ли ошибки. Код ещё не написан — правки бесплатны.\u003c/p>\n\u003cp>\u003cstrong>3. Фиксация версии.\u003c/strong> Спека смержена — теперь это договор. Из CI публикуется Swagger UI и генерятся клиенты.\u003c/p>\n\u003cp>\u003cstrong>4. Параллельная работа.\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Фронтенд: перегенерил TS-клиент, поднял мок-сервер по спеке — верстает дашборд против мока.\u003c/li>\n\u003cli>Бэкенд: реализует \u003ccode>overdue\u003c/code> в сервисном слое.\u003c/li>\n\u003cli>QA: по спеке готовит тест-кейсы: \u003ccode>overdue=true\u003c/code> при прошедшем дедлайне и \u003ccode>done=false\u003c/code>, \u003ccode>overdue=false\u003c/code> у выполненной, формат даты.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>5. Контрактные тесты.\u003c/strong> CI гоняет проверку: живой API соответствует спеке — каждое поле, каждый статус. Расхождение — красный пайплайн, а не «у френта что-то падает».\u003c/p>\n\u003cp>\u003cstrong>6. Релиз.\u003c/strong> Фронт переключается с мока на реальный API (или уже жил против тестового стенда). Депрекаций нет — поле новое, обратная совместимость соблюдена.\u003c/p>\n\u003ch2>Что делает каждая роль\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Роль\u003c/th>\n\u003cth>Обязанности по контракту\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Аналитик\u003c/strong>\u003c/td>\n\u003ctd>Семантика полей, сценарии, коды ошибок. Участвует в ревью спеки до кода\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Бэкендер\u003c/strong>\u003c/td>\n\u003ctd>Пишет и поддерживает спеку, реализует код под контракт, держит контрактные тесты зелёными\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Фронтендер\u003c/strong>\u003c/td>\n\u003ctd>Читает спеку в Swagger UI, работает против мока, использует сгенерированный клиент, ревьюит изменения на «не сломают ли меня»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>QA\u003c/strong>\u003c/td>\n\u003ctd>Тест-кейсы и тест-данные из спеки (examples), контрактные тесты как регресс, проверка обратной совместимости и идемпотентности\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Ключевая смена оптики: \u003cstrong>обсуждаем контракт — до кода, изменения — через ревью спеки\u003c/strong>. Вопрос «а какое поле придёт?» решается не чтением чужого Java-кода, а открытием одного YAML-файла.\u003c/p>\n\u003ch2>Изменение контракта, который уже в проде\u003c/h2>\n\u003cp>Флоу для изменения живого API:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Предложение\u003c/strong>: PR в спеку с пометкой о типе изменения (совместимое / breaking)\u003c/li>\n\u003cli>\u003cstrong>Ревью потребителями\u003c/strong>: фронт, мобилки, интеграции — «не сломает ли вас»\u003c/li>\n\u003cli>Совместимое — мержим, деплоим, поле появляется. Breaking — новая версия (\u003ccode>/v2\u003c/code>) + \u003ccode>Deprecation\u003c/code>-заголовок старой + план переезда\u003c/li>\n\u003cli>\u003cstrong>Changelog\u003c/strong>: люди читают changelog, а не diff YAML\u003c/li>\n\u003c/ol>\n\u003ch2>Anti-patterns\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>«Спека потом»\u003c/strong> — код уже в проде, спеки нет. Долг растёт с каждым эндпоинтом.\u003c/li>\n\u003cli>\u003cstrong>«Тихие правки»\u003c/strong> — бэкенд поправил поле «по мелочи». Каждый такой раз — лотерея для потребителей.\u003c/li>\n\u003cli>\u003cstrong>«Спека для галочки»\u003c/strong> — файл лежит в репо, генерится из кода раз в квартал, никем не ревьюится.\u003c/li>\n\u003cli>\u003cstrong>«Диктат бэкенда»\u003c/strong> — спека не ревьюится потребителями: «мы знаем лучше». Потом узнают, как выглядели нужные поля, — по багрепортам.\u003c/li>\n\u003cli>\u003cstrong>«Всё в v1»\u003c/strong> — копят breaking changes годами, потом «v2» = переписывание всего. Мелкие версии дешевле больших.\u003c/li>\n\u003c/ul>\n\u003ch2>Экосистема инструментов (шпаргалка)\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Задача\u003c/th>\n\u003cth>Инструменты\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Редактирование спеки\u003c/td>\n\u003ctd>Ревью в PR, Swagger Editor, Redoc\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Просмотр\u003c/td>\n\u003ctd>Swagger UI (попробовать запросы), Redoc (читать)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Мок-сервер\u003c/td>\n\u003ctd>Prism, WireMock (по спеке)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Генерация\u003c/td>\n\u003ctd>openapi-generator: TS/Java/Python клиенты, заготовки сервера\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Контрактные тесты\u003c/td>\n\u003ctd>Schemathesis, Dredd, springdoc + Spring тесты\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Спецификация GraphQL\u003c/td>\n\u003ctd>GraphiQL (песочница), Apollo/Relay на клиенте\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> ваша суперсила в этом процессе — предметная точность. «Поле overdue» без определения — половина багов фичи. Формулировка «задача просрочена, если deadline &lt; сегодня И done = false» в ревью спеки стоит десять минут и экономит неделю споров на тестировании.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> контрактные тесты в CI — это «регресс контракта» без ручной работы: любое расхождение кода и спеки краснит пайплайн. А очередь к вам доходит уже с согласованным контрактом и тест-данными — время уходит на настоящее тестирование, а не на выяснение «а что должен возвращать этот эндпоинт».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Контракт ценен процессом: черновик → ревью всеми ролями → версия → параллельная работа → контрактные тесты → changelog\u003c/li>\n\u003cli>Фронт не ждёт бэк: мок-сервер и сгенерированный клиент\u003c/li>\n\u003cli>Изменения живого API — через PR в спеку; breaking — только новая версия с deprecation\u003c/li>\n\u003cli>Anti-patterns: «спека потом», тихие правки, спека для галочки\u003c/li>\n\u003cli>У каждой роли в контракте своя зона — и она не «в чужом коде», а в общем YAML\u003c/li>\n\u003c/ul>\n\u003cp>Модуль пройден: вы умеете читать и писать OpenAPI, знаете REST-практики и GraphQL, и понимаете, как контракт живёт в команде. Экзамен и кейс — впереди.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"В каком порядке строятся работы над фичей в API-First?","options":["Черновик спеки → ревью контракта потребителями → параллельная работа фронта (мок) и бэка (код) → контрактные тесты → релиз","Код контроллера → деплой → документация → сообщение фронту","Дизайн UI → вёрстка → «бэк, отдай нам такие же поля»","Тесты → код → спека из кода → релиз"],"correct":0,"explanation":"Суть API-First — договор раньше кода и параллельная работа сторон против него. Все остальные порядки — варианты code-first с его рисками."},{"type":"multi","question":"Что даёт мок-сервер по спеке? (несколько ответов)","options":["Фронтенд работает с API до готовности бэкенда","Мобильная команда тестирует клиент против стабильных ответов","Мок заменяет боевую базу данных в продакшене","QA может стартовать до реализации, отлаживая клиент против ожидаемых ответов"],"correct":[0,1,3],"explanation":"Мок — про разработку и тестирование против контракта. Прод-БД он не заменяет: это не про данные, а про форму ответов."},{"type":"match","question":"Сопоставь роль и её ответственность в контрактном процессе.","pairs":[{"left":"Аналитик","right":"Семантика полей и сценарии в ревью спеки"},{"left":"Фронтендер","right":"Сгенерированный клиент + работа против мока"},{"left":"QA","right":"Тест-кейсы из спеки, контрактные тесты как регресс"},{"left":"Бэкендер","right":"Спека и код под контракт, зелёные контрактные тесты"}]},{"type":"single","question":"Контрактный тест упал в CI: живой API отдаёт поле createdAt, которого нет в спеке. Что это значит?","options":["Код разошёлся с договором: либо добавить поле в спеку через ревью, либо убрать из ответа","Тест слишком строгий, его надо отключить","Ничего страшного: лишнее поле никому не мешает","Сломался CI-сервер"],"correct":0,"explanation":"Даже «безобидное» поле — расхождение: спека перестала быть источником правды. Решение — осознанное: править договор через ревью или код. Отключить тест — запретить датчику сигналить."},{"type":"single","question":"Какой anti-pattern описан: «Файл openapi.yaml лежит в репозитории, генерируется из кода постфактум, никто его не смотрит»?","options":["Спека для галочки: контракт без процесса не работает","API-First: так и задумано","Контрактное тестирование","Версионирование"],"correct":0,"explanation":"Ценность контракта — в ревью ДО кода и тестах ПОСЛЕ. Спека-архив ничем не лучше устаревшей страницы в Confluence."},{"type":"blank","question":"Как называется заголовок HTTP, которым сервер официально сообщает, что эндпоинт устарел и будет выключен? (английское слово)","answers":["Deprecation","deprecation"],"explanation":"Deprecation (и Sunset — с датой выключения). Стандартный способ объявить «переезжайте» вместо молчаливого выключения."},{"type":"single","question":"Фронтендер спрашивает в чате: «А что придёт в GET /api/tasks/42, если задача просрочена?». Лучший ответ команды, живущей по контракту:","options":["«Открой спеку: поле overdue описано в TaskResponse, пример есть в Swagger UI»","«Сейчас гляну код контроллера, секунду»","«Спроси у бэкендера, он в отпуске, вернётся через неделю»","«Покрути приложение в дев-окружении и посмотри вкладку Network»"],"correct":0,"explanation":"Ответ по контракту — мгновенный, точный и не зависит от отпусков. Чтение кода и эксперименты — путь дольше и с риском догадок."}]],"cases":[]},{"id":"m2-order-cancellation-review","title":"Ревью контракта отмены заказа","module":2,"moduleTitle":"Проектирование API","order":5.5,"baseOrder":6,"lab":null,"html":"\u003ch1>Ревью контракта отмены заказа\u003c/h1>\n\u003cp>Анна оформила заказ \u003ccode>42\u003c/code> 15 января в \u003ccode>12:00:00Z\u003c/code>. Команда хочет дать владельцу 24 часа на отмену. При отмене заказ переходит в \u003ccode>CANCELLED\u003c/code>, бонусы возвращаются один раз. Клиент иногда повторяет запрос после таймаута.\u003c/p>\n\u003cp>Фрагмент OpenAPI уже описывает путь, токен и ключ повтора. На ревью надо договориться о граничном времени и о повторном вызове.\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">paths:\u003c/span>\n  \u003cspan class=\"hljs-string\">/api/orders/{orderId}/cancel:\u003c/span>\n    \u003cspan class=\"hljs-attr\">post:\u003c/span>\n      \u003cspan class=\"hljs-attr\">summary:\u003c/span> \u003cspan class=\"hljs-string\">Отменить\u003c/span> \u003cspan class=\"hljs-string\">заказ\u003c/span>\n      \u003cspan class=\"hljs-attr\">security:\u003c/span>\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">bearerAuth:\u003c/span> []\n      \u003cspan class=\"hljs-attr\">parameters:\u003c/span>\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">orderId\u003c/span>\n          \u003cspan class=\"hljs-attr\">in:\u003c/span> \u003cspan class=\"hljs-string\">path\u003c/span>\n          \u003cspan class=\"hljs-attr\">required:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n          \u003cspan class=\"hljs-attr\">schema:\u003c/span> { \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">integer\u003c/span> }\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">Idempotency-Key\u003c/span>\n          \u003cspan class=\"hljs-attr\">in:\u003c/span> \u003cspan class=\"hljs-string\">header\u003c/span>\n          \u003cspan class=\"hljs-attr\">required:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n          \u003cspan class=\"hljs-attr\">schema:\u003c/span> { \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">string\u003c/span>, \u003cspan class=\"hljs-attr\">minLength:\u003c/span> \u003cspan class=\"hljs-number\">1\u003c/span> }\n      \u003cspan class=\"hljs-attr\">responses:\u003c/span>\n        \u003cspan class=\"hljs-attr\">&#x27;204&#x27;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Отмена\u003c/span> \u003cspan class=\"hljs-string\">принята\u003c/span>\n        \u003cspan class=\"hljs-attr\">&#x27;401&#x27;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Нужен\u003c/span> \u003cspan class=\"hljs-string\">действительный\u003c/span> \u003cspan class=\"hljs-string\">токен\u003c/span>\n        \u003cspan class=\"hljs-attr\">&#x27;403&#x27;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Отмена\u003c/span> \u003cspan class=\"hljs-string\">запрещена\u003c/span> \u003cspan class=\"hljs-string\">этому\u003c/span> \u003cspan class=\"hljs-string\">пользователю\u003c/span>\n        \u003cspan class=\"hljs-attr\">&#x27;404&#x27;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Заказ\u003c/span> \u003cspan class=\"hljs-string\">не\u003c/span> \u003cspan class=\"hljs-string\">найден\u003c/span>\n        \u003cspan class=\"hljs-attr\">&#x27;409&#x27;:\u003c/span>\n          \u003cspan class=\"hljs-attr\">description:\u003c/span> \u003cspan class=\"hljs-string\">Операция\u003c/span> \u003cspan class=\"hljs-string\">конфликтует\u003c/span> \u003cspan class=\"hljs-string\">с\u003c/span> \u003cspan class=\"hljs-string\">состоянием\u003c/span> \u003cspan class=\"hljs-string\">заказа\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>","quizzes":[],"cases":[{"title":"Согласуй правила и примеры для клиента","task":"Запиши ожидаемые статусы и, где нужен отказ, машинные коды. Что ответит API в 11:59:59Z, 12:00:00Z и 12:00:01Z на следующий день после создания? Как ответить на повтор успешного запроса с тем же ключом и на новую попытку с другим ключом? Аналитик формулирует правила перехода состояния. Фронтендер указывает, что покажет при успехе, отказе и таймауте. QA описывает проверки времени, собственника заказа и числа возвратов.\n","placeholder":"Правило и граница времени\nОжидаемые статусы и коды\nЧто делает клиент\nЧто проверяет QA","referenceHtml":"\u003ch2>Правило времени и повтора\u003c/h2>\n\u003cp>Срок открыт, пока серверное время строго меньше времени создания заказа плюс 24 часа. Ровно на границе срок уже истёк.\u003c/p>\n\u003cp>Сервис проверяет аутентификацию и право владения. Затем ищет успешный результат по ключу в рамках пользователя и заказа. Найденный результат возвращается повторно даже после истечения срока. При новом ключе сервис проверяет состояние заказа и оставшееся время.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Запрос на 16 января\u003c/th>\n\u003cth>Ответ\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Первый вызов Анны в \u003ccode>11:59:59Z\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>204\u003c/code>. Заказ переходит в \u003ccode>CANCELLED\u003c/code>, бонусы возвращаются один раз\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Первый вызов Анны в \u003ccode>12:00:00Z\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>409 CANCELLATION_WINDOW_EXPIRED\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Первый вызов Анны в \u003ccode>12:00:01Z\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>409 CANCELLATION_WINDOW_EXPIRED\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Повтор успешного вызова с тем же ключом\u003c/td>\n\u003ctd>\u003ccode>204\u003c/code>. Сохраняется единственный возврат\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Новый ключ у уже отменённого заказа\u003c/td>\n\u003ctd>\u003ccode>409 ORDER_ALREADY_CANCELLED\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Запрос без действительного токена\u003c/td>\n\u003ctd>\u003ccode>401\u003c/code> с \u003ccode>WWW-Authenticate: Bearer\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Запрос Бориса к заказу Анны\u003c/td>\n\u003ctd>\u003ccode>403\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Для проверки границы каждый первый вызов в таблице выполняется на новом исходном экземпляре заказа.\u003c/p>\n\u003ch2>Уточнение ответов в OpenAPI\u003c/h2>\n\u003cp>Задай \u003ccode>400\u003c/code> для отсутствующего обязательного заголовка. Для \u003ccode>204\u003c/code> укажи, что это успешная отмена или повтор её результата без тела. У \u003ccode>409\u003c/code> опиши тело с \u003ccode>Content-Type: application/problem+json\u003c/code> и двумя возможными кодами.\u003c/p>\n\u003cpre>\u003ccode>'409':\n  description: Срок истёк или заказ уже отменён при новой попытке\n  content:\n    application/problem+json:\n      schema:\n        type: object\n        required: [title, status, code]\n        properties:\n          title: { type: string }\n          status: { type: integer, enum: [409] }\n          code:\n            type: string\n            enum: [CANCELLATION_WINDOW_EXPIRED, ORDER_ALREADY_CANCELLED]\n\u003c/code>\u003c/pre>\n\u003ch2>Как этим пользуется команда\u003c/h2>\n\u003cul>\n\u003cli>Аналитик фиксирует переход из \u003ccode>NEW\u003c/code> в \u003ccode>CANCELLED\u003c/code> и предел в 24 часа. Успешный повтор относится к первой операции.\u003c/li>\n\u003cli>Фронтендер на \u003ccode>204\u003c/code> показывает отменённый заказ. При \u003ccode>409\u003c/code> выбирает действие по \u003ccode>code\u003c/code>. После таймаута проверяет состояние заказа или повторяет отмену с тем же ключом.\u003c/li>\n\u003cli>QA проверяет три момента времени на исходном заказе, отказ другому покупателю, успешный повтор и попытку с новым ключом. После двух одинаковых запросов ожидает один возврат бонусов.\u003c/li>\n\u003c/ul>\n"}]},{"id":"m2-exam","title":"Экзамен модуля и кейс","module":2,"moduleTitle":"Проектирование API","order":6,"baseOrder":null,"lab":null,"html":"\u003ch1>Экзамен модуля «Проектирование API»\u003c/h1>\n\u003cp>Пять уроков позади: контракт как договор, OpenAPI, REST-практики, GraphQL, командный процесс. Финал — как всегда, в двух частях: кейс своими словами, затем экзамен на 15 вопросов (порог 80%).\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","topic":"m2-lesson-03","question":"Бэкенд удалил из ответа необязательное поле nickname, о котором никто не знал. Фронтенд упал. Что нарушено?","options":["Обратная совместимость: удаление поля — breaking change даже если «оно было необязательным»","Ничего: необязательные поля можно удалять свободно","Правила YAML","Идемпотентность"],"correct":0,"explanation":"Обязательность в схеме — про валидацию, а не про «можно удалять». Кто-то мог читать поле. Удаление — только через версию и deprecation."},{"type":"single","topic":"m2-lesson-02","question":"Что означает $ref: \"#/components/schemas/Booking\" в спеке?","options":["Ссылку на схему Booking, описанную в components — переиспользование структуры","Ссылку на внешнюю базу данных","Запрос к сервису бронирования в рантайме","Обязательность всех полей Booking"],"correct":0,"explanation":"$ref — внутренняя ссылка на описанную схему: один источник правды для всех мест, где нужна структура."},{"type":"multi","topic":"m2-lesson-03","question":"Какие утверждения о версионировании верны? (несколько ответов)","options":["Добавление нового эндпоинта обратно совместимо","Переименование поля — breaking change","/api/v2 в пути — самый распространённый способ версионирования","Старую версию выключают сразу после релиза новой"],"correct":[0,1,2],"explanation":"Старую версию выключают по метрике (доля трафика ≈ 0) после переходного периода, а не сразу: потребители переезжают с разной скоростью."},{"type":"single","topic":"m2-lesson-03","codeLang":"json","code":"{\n  \"status\": 409,\n  \"code\": \"SLOT_TAKEN\",\n  \"title\": \"Слот уже занят\",\n  \"detail\": \"Переговорка 7 занята 14:00–15:00\"\n}\n","question":"Почему фронт должен ветвиться по code/status, а не по detail?","options":["detail — текст для человека: формулировка меняется без предупреждения, а code и статус стабильны","detail всегда пустой","По code нельзя ветвиться","Статус в теле не совпадает с HTTP-статусом"],"correct":0,"explanation":"Контракт для логики — статус и машинный код. Тексты (title, detail) — для людей, они локализуются и переформулируются.","codeHtml":"\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;status&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">409\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;code&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;SLOT_TAKEN&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Слот уже занят&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;detail&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Переговорка 7 занята 14:00–15:00&quot;\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n"},{"type":"single","topic":"m2-lesson-03","question":"Мобильный клиент ретраит POST /api/bookings после таймаута. Без чего он может забронировать слот дважды?","options":["Без идемпотентного ключа: сервер не отличит повтор от нового запроса","Без пагинации","Без GraphQL","Без версионирования"],"correct":0,"explanation":"POST не идемпотентен. Idempotency-Key позволяет серверу вернуть результат первого выполнения вместо создания дубля."},{"type":"match","topic":"m2-lesson-04","question":"Сопоставь элемент GraphQL и его смысл.","pairs":[{"left":"schema.graphqls","right":"Контракт: типы и поля, которые есть"},{"left":"query","right":"Заказ данных: клиент указывает поля"},{"left":"mutation","right":"Изменение данных"},{"left":"@QueryMapping","right":"Spring-метод, обслуживающий поле схемы"}]},{"type":"single","topic":"m2-lesson-04","question":"GraphQL особенно уместен, когда…","options":["Много разных клиентов с разными потребностями в данных и богатые экраны: каждый заказывает ровно своё","Нужен публичный webhook с кэшированием на CDN","API состоит из трёх CRUD-эндпоинтов","Команда не хочет писать схемы"],"correct":0,"explanation":"Сила GraphQL — гибкость формы ответа. Для простых CRUD и кэшируемых публичных API она избыточна."},{"type":"single","topic":"m2-lesson-02","question":"В спеке у POST /api/bookings не указан required у requestBody. Чем это грозит?","options":["Договор двусмыслен: клиент вправе отправить запрос без тела, а ожидания сервера не зафиксированы","Спека не пройдёт валидацию OpenAPI","POST автоматически станет GET","Ничем: required пишут только для GET"],"correct":0,"explanation":"Хороший контракт однозначен. Каждый параметр и тело — либо обязательны, либо нет, явно."},{"type":"single","topic":"m2-lesson-05","question":"Что в первую очередь смотрит QA в PR со спекой?","options":["Описаны ли все ответы и ошибки с примерами — готовая основа тест-кейсов и тест-данных","Стиль Java-кода контроллера","Название ветки","Ничего: спека — не зона QA"],"correct":0,"explanation":"Спека — источник тест-анализа: каждая операция и код ответа — кейс, каждый example — тест-данные. Ревью спеки — самая дешёвая точка влияния QA."},{"type":"blank","topic":"m2-lesson-05","question":"Как называется сервер, который отвечает на запросы примерами из спеки, без реальной реализации? (мок-…)","answers":["мок-сервер","мок","mock server"],"explanation":"Мок-сервер (Prism, WireMock): фронт и QA работают против контракта до готовности бэкенда."},{"type":"single","topic":"m2-lesson-05","question":"Фронтендер обнаружил в ответе поле overdue, которого нет в спеке, и молча начал его использовать. Что должно произойти?","options":["Поле внести в спеку через ревью — либо убрать из ответа: код и договор не должны расходиться","Ничего: раз поле приходит — можно пользоваться","Фронтендеру запретить смотреть вкладку Network","Спеку удалить"],"correct":0,"explanation":"Поле вне контракта — случайность: его могут убрать без предупреждения. Контрактные тесты должны ловить такие расхождения в CI."},{"type":"single","topic":"m2-lesson-03","question":"GET /api/rooms/{id}/slots?date=2026-12-01 — что говорит такой дизайн про слоты?","options":["Слоты — вычисляемый под-ресурс комнаты на дату: читаем расписание, ничего не меняем","Слоты хранятся в отдельной базе","Это GraphQL-запрос","Дизайн неверен: query-параметры нельзя использовать с path-параметрами"],"correct":0,"explanation":"Ресурс не обязан быть таблицей: «свободные слоты» — представление, вычисляемое по запросу. GET + path + query — классика чтения."},{"type":"multi","topic":"m2-lesson-03","question":"Какие из этих изменений потребуют новой версии API? (несколько ответов)","options":["Переименование /api/bookings в /api/reservations","Новое поле roomName в ответе брони","Изменение типа поля capacity со строки на число","Новый эндпоинт статистики по броням"],"correct":[0,2],"explanation":"Новое поле и новый эндпоинт совместимы. Переименование пути и смена типа поля ломают существующих клиентов — v2 и deprecation."},{"type":"single","topic":"m2-lesson-03","question":"Для чего заголовок Sunset в ответе устаревшего API?","options":["Сообщает дату планового выключения версии — у потребителей есть дедлайн переезда","Отменяет все активные брони","Включает тёмную тему Swagger UI","Ускоряет ответы сервера на закате"],"correct":0,"explanation":"Sunset — дата выключения, парная к Deprecation. Вместе они делают процесс переезда управляемым и наблюдаемым."},{"type":"single","topic":"m2-lesson-01","question":"Итоговая мысль модуля. Как правильно относиться к OpenAPI-спеке?","options":["Это источник правды об API: ревьюится до кода, проверяется тестами после, им пользуются все роли","Это документация, которую пишут, когда всё готово","Это артефект для аудита, раз в год","Это то, что генерируется из кода автоматически и никому не нужно"],"correct":0,"explanation":"Контракт работает только в процессе: до кода — ревью и моки, после — контрактные тесты и генерация клиентов. Иначе это просто устаревающий YAML."}]],"cases":[{"title":"Спроектируйте контракт API бронирования переговорок","task":"Офис на 300 человек. Есть переговорки (номер, вместимость, проектор: да/нет). Нужно API: посмотреть свободные слоты, забронировать, отменить бронь, список своих броней. Известные конфликты: двойное бронирование, отмены в последний момент. Опишите контракт: основные эндпоинты (метод + путь), ключевые поля, важные ошибки (статус + код), где бы вы применили идемпотентный ключ. Форма свободная. Это задание уровня урока 1–3 модуля: ресурсы, статусы, ошибки.","placeholder":"Например:\nGET /api/rooms?capacity=8 — список переговорок\nPOST /api/bookings — бронь, 201...\n409 — конфликт слотов...","referenceHtml":"\u003cp>Один из возможных ответов.\u003c/p>\n\u003ch2>Эндпоинты\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Метод и путь\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003cth>Успех\u003c/th>\n\u003cth>Ошибки\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/rooms?capacity=8&amp;projector=true\u003c/code>\u003c/td>\n\u003ctd>Список переговорок с фильтрами\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/rooms/{id}/slots?date=2026-12-01\u003c/code>\u003c/td>\n\u003ctd>Свободные слоты на день\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>404\u003c/code> нет комнаты\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST /api/bookings\u003c/code>\u003c/td>\n\u003ctd>Создать бронь\u003c/td>\n\u003ctd>\u003ccode>201\u003c/code> + \u003ccode>Location\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>409\u003c/code> слот занят, \u003ccode>400\u003c/code> валидация\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GET /api/bookings?mine=true\u003c/code>\u003c/td>\n\u003ctd>Мои брони\u003c/td>\n\u003ctd>\u003ccode>200\u003c/code>\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DELETE /api/bookings/{id}\u003c/code>\u003c/td>\n\u003ctd>Отменить\u003c/td>\n\u003ctd>\u003ccode>204\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>404\u003c/code>, \u003ccode>409\u003c/code> слишком поздно отменять (правило можно смягчить)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Ключевые поля\u003c/h2>\n\u003cpre>\u003ccode>Booking: id, roomId, startsAt, endsAt, bookedBy, status (ACTIVE/CANCELLED), createdAt\nCreateBookingRequest: roomId, startsAt, endsAt\nSlots: startsAt, endsAt, available\n\u003c/code>\u003c/pre>\n\u003cp>Свободные слоты — вычисляемый ресурс: \u003ccode>GET /slots\u003c/code> читается как «расписание на день», а не «таблица в базе».\u003c/p>\n\u003ch2>Ошибки и семантика\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>409 SLOT_TAKEN\u003c/code> — бронирование в занятый слот: два человека жмут «забронировать» одновременно, второму честный конфликт, а не 500.\u003c/li>\n\u003cli>\u003ccode>400 VALIDATION_ERROR\u003c/code> — endsAt раньше startsAt, бронь в прошлом.\u003c/li>\n\u003cli>\u003ccode>403\u003c/code> — отменять чужую бронь нельзя (а 401 был бы «не знаю, кто ты»).\u003c/li>\n\u003c/ul>\n\u003ch2>Идемпотентный ключ\u003c/h2>\n\u003cp>На \u003ccode>POST /api/bookings\u003c/code>: клиент сгенерировал ключ, ретрай после обрыва сети не создаёт вторую бронь — сервер вернёт результат первого выполнения. Критично: двойное бронирование — наш главный бизнес-риск.\u003c/p>\n\u003ch2>Продвинутое (не обязательно)\u003c/h2>\n\u003cp>\u003ccode>POST /api/bookings/{id}/cancellations\u003c/code> — как «факт отмены»-ресурс; причина отмены становится телом, история — списком cancellations. GraphQL имел бы смысл, если бы появился дашборд с рейтингом комнат: один запрос возьмёт и брони, и комнаты, и участников.\u003c/p>\n"}]},{"id":"m2-cheatsheet","title":"Шпаргалка модуля","module":2,"moduleTitle":"Проектирование API","order":7,"baseOrder":null,"lab":null,"html":"\u003ch1>Шпаргалка: Проектирование API\u003c/h1>\n\u003ch2>Два подхода\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Code-first\u003c/th>\n\u003cth>API-First\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Сначала\u003c/td>\n\u003ctd>Код\u003c/td>\n\u003ctd>Контракт (OpenAPI)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ревью\u003c/td>\n\u003ctd>Кода (контракт «случился»)\u003c/td>\n\u003ctd>Контракта всеми ролями\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Фронт ждёт бэка\u003c/td>\n\u003ctd>Да\u003c/td>\n\u003ctd>Нет: мок-сервер + генерация клиента\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Скелет OpenAPI\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">info:\u003c/span>    \u003cspan class=\"hljs-comment\"># название, версия\u003c/span>\n\u003cspan class=\"hljs-attr\">servers:\u003c/span> \u003cspan class=\"hljs-comment\"># где живёт\u003c/span>\n\u003cspan class=\"hljs-attr\">paths:\u003c/span>   \u003cspan class=\"hljs-comment\"># эндпоинты: методы, параметры, ответы\u003c/span>\n\u003cspan class=\"hljs-attr\">components:\u003c/span>\n  \u003cspan class=\"hljs-attr\">schemas:\u003c/span>   \u003cspan class=\"hljs-comment\"># переиспользуемые DTO; ссылка — $ref\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Обязательно: \u003ccode>required\u003c/code> у requestBody, ответы 4xx с \u003ccode>example\u003c/code> (с машинным \u003ccode>code\u003c/code>),\n\u003ccode>example\u003c/code> у схем — это тест-данные для QA и фрона.\u003c/p>\n\u003ch2>REST-практики\u003c/h2>\n\u003cul>\n\u003cli>Ресурсы — существительные: \u003ccode>GET /api/tasks\u003c/code>, \u003ccode>POST /api/orders\u003c/code>\u003c/li>\n\u003cli>Действие вне CRUD: \u003ccode>POST /api/orders/42/cancellations\u003c/code> (или \u003ccode>/cancel\u003c/code> — прагматично)\u003c/li>\n\u003cli>Пагинация: \u003ccode>?limit=20&amp;offset=40\u003c/code> или cursor; фильтры — query\u003c/li>\n\u003cli>Ошибки — единым форматом (Problem Details): машина — по \u003ccode>status\u003c/code>+\u003ccode>code\u003c/code>, человек — по \u003ccode>title/detail\u003c/code>\u003c/li>\n\u003cli>POST не идемпотентен → \u003ccode>Idempotency-Key\u003c/code> для критичных операций\u003c/li>\n\u003c/ul>\n\u003ch2>Обратная совместимость\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Совместимо ✓\u003c/th>\n\u003cth>Breaking ✗\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Новое поле в ответе\u003c/td>\n\u003ctd>Удалить/переименовать поле\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Новый эндпоинт\u003c/td>\n\u003ctd>Сменить тип поля\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Новый необязательный параметр\u003c/td>\n\u003ctd>Изменить смысл\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Breaking → новая версия (\u003ccode>/v2\u003c/code>) + \u003ccode>Deprecation\u003c/code>/\u003ccode>Sunset\u003c/code> + переезд по метрике.\u003c/p>\n\u003ch2>GraphQL за 30 секунд\u003c/h2>\n\u003cpre>\u003ccode class=\"language-graphql\">\u003cspan class=\"hljs-keyword\">type\u003c/span> \u003cspan class=\"hljs-keyword\">Query\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span> tasks\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">done\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> Boolean\u003cspan class=\"hljs-punctuation\">)\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">[\u003c/span>Task\u003cspan class=\"hljs-punctuation\">!\u003c/span>\u003cspan class=\"hljs-punctuation\">]\u003c/span>\u003cspan class=\"hljs-punctuation\">!\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span>   \u003cspan class=\"hljs-comment\"># сервер описал схему\u003c/span>\n\u003cspan class=\"hljs-keyword\">query\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span> tasks\u003cspan class=\"hljs-punctuation\">(\u003c/span>\u003cspan class=\"hljs-symbol\">done\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>\u003cspan class=\"hljs-punctuation\">)\u003c/span> \u003cspan class=\"hljs-punctuation\">{\u003c/span> title project \u003cspan class=\"hljs-punctuation\">{\u003c/span> name \u003cspan class=\"hljs-punctuation\">}\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span> \u003cspan class=\"hljs-punctuation\">}\u003c/span>  \u003cspan class=\"hljs-comment\"># клиент заказал\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Лечит over-fetching и N+1 на стороне клиента; один эндпоинт \u003ccode>/graphql\u003c/code>\u003c/li>\n\u003cli>Минусы: POST → HTTP-кэш мимо; серверу сложнее\u003c/li>\n\u003cli>В Spring: \u003ccode>@QueryMapping\u003c/code> / \u003ccode>@MutationMapping\u003c/code> поверх того же сервиса\u003c/li>\n\u003c/ul>\n\u003ch2>Процесс в команде\u003c/h2>\n\u003cp>Черновик спеки → ревью (аналитик: семантика, фронт: поля, QA: ошибки) → мок+клиент\n→ реализация → контрактные тесты в CI → changelog.\u003c/p>\n","quizzes":[],"cases":[]},{"id":"m3-lesson-01","title":"Реляционная база и SQL-минимум","module":3,"moduleTitle":"Данные","order":1,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 1. Реляционная база и SQL-минимум\u003c/h1>\n\u003cp>До сих пор база была «чёрным ящиком»: репозиторий сам что-то делал. Модуль — про то, что внутри: таблицы, ключи, запросы, транзакции. Половина бэкенд-багов — это SQL-проблемы, надетые на Java. Начнём с фундамента — реляционной модели.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитики:\u003c/strong> этот урок — ваша территория: вы давно живёте в таблицах и JOIN'ах. Задача — освежить термины, потому что дальше весь модуль говорит на этом языке. А вот уроки 2–3 покажут вам, во что превращаются ваши таблицы в Java-кодe.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Таблицы, строки, колонки\u003c/h2>\n\u003cp>Реляционная база — набор \u003cstrong>таблиц\u003c/strong>. У таблицы фиксированные \u003cstrong>колонки\u003c/strong> (типизированные) и любое количество \u003cstrong>строк\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">CREATE TABLE\u003c/span> tasks (\n    id          \u003cspan class=\"hljs-type\">BIGINT\u003c/span> \u003cspan class=\"hljs-keyword\">PRIMARY KEY\u003c/span>,\n    project_id  \u003cspan class=\"hljs-type\">BIGINT\u003c/span> \u003cspan class=\"hljs-keyword\">NOT NULL\u003c/span>,\n    title       \u003cspan class=\"hljs-type\">VARCHAR\u003c/span>(\u003cspan class=\"hljs-number\">200\u003c/span>) \u003cspan class=\"hljs-keyword\">NOT NULL\u003c/span>,\n    done        \u003cspan class=\"hljs-type\">BOOLEAN\u003c/span> \u003cspan class=\"hljs-keyword\">NOT NULL\u003c/span> \u003cspan class=\"hljs-keyword\">DEFAULT\u003c/span> \u003cspan class=\"hljs-literal\">FALSE\u003c/span>,\n    deadline    \u003cspan class=\"hljs-type\">DATE\u003c/span>\n);\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>PRIMARY KEY\u003c/strong> — первичный ключ: значение, однозначно идентифицирующее строку. У нас — \u003ccode>id\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>NOT NULL\u003c/strong> — поле обязательно.\u003c/li>\n\u003cli>\u003cstrong>DEFAULT\u003c/strong> — значение по умолчанию.\u003c/li>\n\u003c/ul>\n\u003ch2>Связи: внешний ключ\u003c/h2>\n\u003cp>Таблицы связываются \u003cstrong>внешним ключом\u003c/strong> (FOREIGN KEY): колонка в одной таблице указывает на первичный ключ другой:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">CREATE TABLE\u003c/span> projects (\n    id   \u003cspan class=\"hljs-type\">BIGINT\u003c/span> \u003cspan class=\"hljs-keyword\">PRIMARY KEY\u003c/span>,\n    name \u003cspan class=\"hljs-type\">VARCHAR\u003c/span>(\u003cspan class=\"hljs-number\">100\u003c/span>) \u003cspan class=\"hljs-keyword\">NOT NULL\u003c/span>\n);\n\n\u003cspan class=\"hljs-keyword\">ALTER TABLE\u003c/span> tasks\n    \u003cspan class=\"hljs-keyword\">ADD CONSTRAINT\u003c/span> fk_tasks_project\n    \u003cspan class=\"hljs-keyword\">FOREIGN KEY\u003c/span> (project_id) \u003cspan class=\"hljs-keyword\">REFERENCES\u003c/span> projects (id);\n\u003c/code>\u003c/pre>\n\u003cp>Теперь \u003ccode>tasks.project_id\u003c/code> обязан существовать в \u003ccode>projects.id\u003c/code> — база не даст записать задачу «в никуда». Это \u003cstrong>ссылочная целостность\u003c/strong>: база охраняет связи, а не полагается на аккуратность кода.\u003c/p>\n\u003cp>Виды связей, которые встречаются постоянно:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Связь\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003cth>Как выражена\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>один-ко-многим\u003c/td>\n\u003ctd>проект → задачи\u003c/td>\n\u003ctd>FK на стороне «многих» (\u003ccode>tasks.project_id\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>один-к-одному\u003c/td>\n\u003ctd>пользователь → паспорт\u003c/td>\n\u003ctd>FK + уникальность\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>многие-ко-многим\u003c/td>\n\u003ctd>задачи ↔ исполнители\u003c/td>\n\u003ctd>отдельная таблица-связка \u003ccode>task_assignees(task_id, user_id)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>SQL: четыре главных глагола\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-comment\">-- прочитать\u003c/span>\n\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> id, title, done \u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> \u003cspan class=\"hljs-keyword\">ORDER\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> deadline;\n\n\u003cspan class=\"hljs-comment\">-- вставить\u003c/span>\n\u003cspan class=\"hljs-keyword\">INSERT INTO\u003c/span> tasks (project_id, title, done) \u003cspan class=\"hljs-keyword\">VALUES\u003c/span> (\u003cspan class=\"hljs-number\">7\u003c/span>, \u003cspan class=\"hljs-string\">&#x27;Купить молоко&#x27;\u003c/span>, \u003cspan class=\"hljs-literal\">false\u003c/span>);\n\n\u003cspan class=\"hljs-comment\">-- изменить\u003c/span>\n\u003cspan class=\"hljs-keyword\">UPDATE\u003c/span> tasks \u003cspan class=\"hljs-keyword\">SET\u003c/span> done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span> \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>;\n\n\u003cspan class=\"hljs-comment\">-- удалить\u003c/span>\n\u003cspan class=\"hljs-keyword\">DELETE\u003c/span> \u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cp>Джойн — соединение таблиц по связи:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name \u003cspan class=\"hljs-keyword\">AS\u003c/span> project, t.title\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks t\n\u003cspan class=\"hljs-keyword\">JOIN\u003c/span> projects p \u003cspan class=\"hljs-keyword\">ON\u003c/span> p.id \u003cspan class=\"hljs-operator\">=\u003c/span> t.project_id\n\u003cspan class=\"hljs-keyword\">WHERE\u003c/span> t.done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cp>Читается: возьми задачи, к каждой приклей её проект по \u003ccode>project_id = id\u003c/code>, оставь несделанные.\u003c/p>\n\u003cp>Агрегация — когда нужен н
