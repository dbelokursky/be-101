<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BE-101 — Бэкенд для смежных специальностей</title>
<style>
/* BE-101 — стили курса */

:root {
  --bg: #f6f7f9;
  --paper: #ffffff;
  --ink: #1f2430;
  --ink-soft: #5b6472;
  --line: #e3e6eb;
  --accent: #3556e0;
  --accent-soft: #eef1fe;
  --ok: #1a8a4a;
  --ok-soft: #e7f6ed;
  --fail: #d64545;
  --fail-soft: #fdecec;
  --code-bg: #1e2430;
  --code-ink: #e8ecf3;
  --radius: 10px;
  --sidebar-w: 300px;
  --content-w: 780px;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.65;
  font-size: 16px;
}

#app { display: flex; min-height: 100vh; }

/* ---------- сайдбар ---------- */

.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--paper);
  border-right: 1px solid var(--line);
  padding: 28px 22px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.brand-title { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
.brand-sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 2px; }

.module-progress { margin: 22px 0 18px; }
.module-progress-label { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 6px; }
.module-head {
  display: flex; align-items: baseline; justify-content: space-between;
  margin: 24px 0 4px;
}
.module-head:first-of-type { margin-top: 18px; }
.module-title {
  font-size: 13px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .6px; color: var(--ink-soft);
}
.module-head .module-progress-label { margin: 0; font-weight: 600; }
.module-progress-bar {
  height: 6px; border-radius: 99px; background: var(--line); overflow: hidden;
}
.module-progress-fill {
  height: 100%; width: 0;
  background: linear-gradient(90deg, var(--accent), #7c94f0);
  border-radius: 99px;
  transition: width .4s ease;
}

.lesson-list { display: flex; flex-direction: column; gap: 4px; }
.lesson-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; border-radius: 8px;
  color: var(--ink); text-decoration: none; font-size: 14px;
  border: 1px solid transparent;
}
.lesson-item:hover { background: var(--bg); }
.lesson-item.active { background: var(--accent-soft); border-color: #d5dcfb; font-weight: 600; }
.lesson-status {
  width: 22px; height: 22px; flex-shrink: 0;
  border-radius: 50%; border: 1.6px solid var(--line);
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; color: transparent;
}
.lesson-status.done {
  background: var(--ok); border-color: var(--ok); color: #fff;
}
.lesson-title { flex: 1; }

.sidebar-footer {
  margin-top: 26px; font-size: 11.5px; color: var(--ink-soft);
  border-top: 1px solid var(--line); padding-top: 14px;
}

/* ---------- контент ---------- */

.content {
  flex: 1;
  padding: 40px 48px 90px;
  display: flex;
  justify-content: center;
}

.lesson { max-width: var(--content-w); width: 100%; }

.lesson h1 {
  font-size: 30px; line-height: 1.25; margin: 0 0 6px;
  letter-spacing: -.3px;
}
.lesson h2 {
  font-size: 21px; margin: 38px 0 12px;
  padding-top: 10px; border-top: 1px solid var(--line);
}
.lesson h3 { font-size: 17px; margin: 26px 0 8px; }

.lesson p { margin: 12px 0; }
.lesson ul, .lesson ol { padding-left: 24px; margin: 12px 0; }
.lesson li { margin: 5px 0; }

.lesson a { color: var(--accent); }

.lesson blockquote {
  margin: 18px 0; padding: 12px 18px;
  background: var(--accent-soft);
  border-left: 4px solid var(--accent);
  border-radius: 0 8px 8px 0;
  color: #2c3350;
}
.lesson blockquote p { margin: 4px 0; }

.lesson table {
  border-collapse: collapse; width: 100%; margin: 16px 0;
  font-size: 14.5px; background: var(--paper);
}
.lesson th, .lesson td {
  border: 1px solid var(--line); padding: 8px 12px; text-align: left;
  vertical-align: top;
}
.lesson th { background: var(--bg); font-weight: 600; }

.lesson code {
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: .88em;
  background: #eceff3; padding: 2px 6px; border-radius: 5px;
}

.lesson pre {
  background: var(--code-bg); color: var(--code-ink);
  border-radius: var(--radius);
  padding: 16px 18px; overflow-x: auto;
  font-size: 13.5px; line-height: 1.55;
  margin: 16px 0;
}
.lesson pre code { background: none; padding: 0; color: inherit; font-size: inherit; }

/* mermaid */
.mermaid {
  background: var(--paper); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 14px; margin: 18px 0;
  display: flex; justify-content: center; overflow-x: auto;
}

/* ---------- квиз ---------- */

.quiz {
  margin: 34px 0 10px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px 24px;
  box-shadow: 0 1px 3px rgba(31, 36, 48, .05);
}

.quiz-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 18px;
}
.quiz-badge {
  background: var(--accent); color: #fff;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; padding: 4px 10px; border-radius: 6px;
}
.quiz-hint { font-size: 12.5px; color: var(--ink-soft); }
.quiz-passed-badge {
  color: var(--ok); font-weight: 700; font-size: 13px;
}

.question {
  border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px 18px; margin: 14px 0;
  background: #fbfcfe;
}
.question.ok { border-color: #bfe6cd; background: var(--ok-soft); }
.question.fail { border-color: #f2c6c6; background: var(--fail-soft); }

.question-head {
  display: flex; align-items: center; gap: 10px; margin-bottom: 8px;
}
.question-num {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--accent-soft); color: var(--accent);
  font-weight: 700; font-size: 13px;
  display: inline-flex; align-items: center; justify-content: center;
}
.question-type { font-size: 11.5px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .5px; }

.question-text { font-weight: 600; margin: 4px 0 12px; }

.question-code {
  background: var(--code-bg); color: var(--code-ink);
  border-radius: 8px; padding: 12px 14px; overflow-x: auto;
  font-size: 13px; margin: 10px 0;
}
.question-code code { background: none; padding: 0; color: inherit; }

.question-area { display: flex; flex-direction: column; gap: 8px; }

.option {
  display: block; width: 100%; text-align: left;
  background: var(--paper); border: 1.5px solid var(--line);
  border-radius: 8px; padding: 10px 14px;
  font-size: 14.5px; font-family: inherit; color: var(--ink);
  cursor: pointer; transition: border-color .12s, background .12s;
}
.option:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
.option.correct { border-color: var(--ok); background: var(--ok-soft); }
.option.wrong { border-color: var(--fail); background: var(--fail-soft); }
.option:disabled { cursor: default; opacity: .92; }

.option.check { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.option.check input { width: 17px; height: 17px; accent-color: var(--accent); }

.locked .option { pointer-events: none; }

.btn {
  background: var(--accent); color: #fff; border: none;
  border-radius: 8px; padding: 10px 20px;
  font-size: 14.5px; font-weight: 600; font-family: inherit;
  cursor: pointer;
}
.btn:hover { filter: brightness(1.08); }
.btn.small { padding: 8px 16px; font-size: 13.5px; align-self: flex-start; }

.blank-row { display: flex; gap: 10px; }
.blank-input {
  flex: 1; max-width: 420px;
  border: 1.5px solid var(--line); border-radius: 8px;
  padding: 9px 14px; font-size: 14.5px; font-family: inherit;
}
.blank-input:focus { outline: none; border-color: var(--accent); }
.blank-input.correct { border-color: var(--ok); background: var(--ok-soft); }
.blank-input.wrong { border-color: var(--fail); background: var(--fail-soft); }

.match-row {
  display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px;
  align-items: center;
}
.match-left { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; }
.match-select {
  border: 1.5px solid var(--line); border-radius: 8px;
  padding: 8px 10px; font-size: 14px; font-family: inherit;
  background: var(--paper); color: var(--ink);
}
.match-select.correct { border-color: var(--ok); background: var(--ok-soft); }
.match-select.wrong { border-color: var(--fail); background: var(--fail-soft); }

.question-feedback {
  margin-top: 12px; border-radius: 8px; padding: 10px 14px; font-size: 14px;
}
.question-feedback.ok { background: var(--ok-soft); color: #14532d; }
.question-feedback.fail { background: var(--fail-soft); color: #7f1d1d; }
.question-expl { margin-top: 4px; }
.correct-answer { margin-top: 6px; }

.quiz-result { display: none; margin-top: 18px; }
.quiz-result.show { display: block; }
.quiz-result.ok .quiz-score { color: var(--ok); }
.quiz-result.fail .quiz-score { color: var(--fail); }
.quiz-score { font-size: 18px; font-weight: 700; }
.quiz-note { color: var(--ink-soft); font-size: 14px; margin: 6px 0 12px; }

/* ---------- кейс ---------- */

.case {
  margin: 34px 0 10px;
  background: var(--paper);
  border: 1.5px solid #c9b458;
  border-radius: 14px;
  padding: 22px 24px;
  box-shadow: 0 1px 3px rgba(31, 36, 48, .05);
}
.case-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 12px;
}
.case-badge {
  background: #b78a12; color: #fff;
  font-size: 12px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .8px; padding: 4px 10px; border-radius: 6px;
}
.case-title { font-weight: 700; font-size: 16px; }
.case-done-badge { color: var(--ok); font-weight: 700; font-size: 13px; }
.case-task { font-size: 15px; margin-bottom: 12px; }
.case-input {
  width: 100%; min-height: 130px; resize: vertical;
  border: 1.5px solid var(--line); border-radius: 8px;
  padding: 10px 14px; font-size: 14.5px; font-family: inherit;
  background: #fbfcfe;
}
.case-input:focus { outline: none; border-color: var(--accent); }
.case .btn { margin-top: 10px; }
.case .btn:disabled { opacity: .5; cursor: not-allowed; }
.case-reference {
  display: none; margin-top: 16px;
  border-top: 1px dashed #d8c27a; padding-top: 14px;
}
.case-reference.show { display: block; }
.case-reference table { font-size: 14px; }
.case-note { margin-top: 12px; font-size: 12px; color: var(--ink-soft); }

/* ---------- лаба ---------- */

.lab-card {
  margin: 34px 0 10px;
  border: 1.5px dashed #c9b458;
  background: #fffdf3;
  border-radius: 14px; padding: 20px 22px;
}
.lab-head { font-weight: 700; font-size: 16px; margin-bottom: 8px; }
.lab-badge {
  background: #b78a12; color: #fff; font-size: 11.5px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .8px;
  padding: 3px 9px; border-radius: 6px; margin-right: 6px;
}
.lab-desc { margin: 6px 0; font-size: 14.5px; }
.lab-branches { font-size: 13.5px; color: var(--ink-soft); margin: 8px 0; }
.lab-check {
  display: inline-flex; align-items: center; gap: 9px;
  margin-top: 10px; cursor: pointer; font-size: 14.5px; font-weight: 600;
  background: var(--paper); border: 1.5px solid var(--line);
  padding: 8px 14px; border-radius: 8px;
}
.lab-check input { width: 17px; height: 17px; accent-color: var(--ok); }

/* ---------- прочее ---------- */

.empty { padding: 60px; text-align: center; color: var(--ink-soft); }

@media (max-width: 920px) {
  #app { flex-direction: column; }
  .sidebar {
    width: 100%; height: auto; position: static;
    border-right: none; border-bottom: 1px solid var(--line);
  }
  .content { padding: 26px 18px 70px; }
}

</style>
</head>
<body>
<noscript>Для работы курса нужен включённый JavaScript.</noscript>

<script src="mermaid.min.js"></script>
<script>
window.BE101 = {"lessons":[{"id":"lesson-01","title":"Клиент–сервер и HTTP","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":1,"lab":null,"html":"\u003ch1>Урок 1. Клиент–сервер и HTTP\u003c/h1>\n\u003cp>Каждый раз, когда ты открываешь страницу интернет-магазина, ставишь лайк или жмёшь «Оформить заказ», между твоим браузером и чьим-то сервером происходит короткий строгий разговор. Он называется \u003cstrong>HTTP\u003c/strong> — и это язык, на котором фронтенд говорит с бэкендом.\u003c/p>\n\u003cp>Этот язык знает каждый участник продуктовой команды — но часто «на слух». К концу урока ты будешь понимать его структуру: из чего состоит запрос, что отвечает сервер и почему «404» — это не всегда баг.\u003c/p>\n\u003ch2>Клиент и сервер\u003c/h2>\n\u003cp>Всё общение в вебе строится по модели \u003cstrong>клиент–сервер\u003c/strong>:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Клиент\u003c/strong> — та программа, которая \u003cem>просит\u003c/em>: браузер, мобильное приложение, Postman, скрипт.\u003c/li>\n\u003cli>\u003cstrong>Сервер\u003c/strong> — программа, которая \u003cem>отвечает\u003c/em>: принимает запрос, что-то делает (считает, ходит в базу) и возвращает ответ.\u003c/li>\n\u003c/ul>\n\u003cp>Сервер не «толкает» данные сам по себе (по крайней мере, в базовом HTTP): он сидит и ждёт запросов. Клиент всегда начинает разговор первым.\u003c/p>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant C as Браузер (клиент)\n    participant S as Сервер (бэкенд)\n    C-&gt;&gt;S: GET /api/products — HTTP-запрос\n    Note over S: достаёт товары из базы\n    S--&gt;&gt;C: 200 OK + JSON со списком — HTTP-ответ\n    C-&gt;&gt;S: POST /api/orders — новый заказ\n    S--&gt;&gt;C: 201 Created + созданный заказ\u003c/div>\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> вы делаете это десятки раз в день — каждый \u003ccode>fetch()\u003c/code> / \u003ccode>axios.get()\u003c/code> в вашем коде и есть «клиент начинает разговор». Бэкенд — та сторона, которая отвечает.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> в Postman или DevTools → Network вы видите эти разговоры вживую. Этот урок — про структуру того, что вы там видите.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> представьте письмо: адрес получателя — это URL, конверт с пометками — заголовки, а сам текст письма — тело. HTTP устроен так же.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Из чего состоит HTTP-запрос\u003c/h2>\n\u003cp>Вот настоящий запрос, который браузер отправляет, когда вы открываете список товаров:\u003c/p>\n\u003cpre>\u003ccode class=\"language-http\">\u003cspan class=\"hljs-keyword\">GET\u003c/span> \u003cspan class=\"hljs-string\">/api/products?category=shoes\u003c/span> \u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span>\n\u003cspan class=\"hljs-attribute\">Host\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>shop.example.com\n\u003cspan class=\"hljs-attribute\">Accept\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>application/json\n\u003cspan class=\"hljs-attribute\">User-Agent\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>Mozilla/5.0\n\u003cspan class=\"hljs-attribute\">Authorization\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>Bearer eyJhbGciOi...\n\u003c/code>\u003c/pre>\n\u003cp>Разберём построчно:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Часть\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003cth>Что это\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Метод\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>GET\u003c/code>\u003c/td>\n\u003ctd>Что сделать с ресурсом: прочитать, создать, изменить, удалить\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Путь (URL)\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>/api/products?category=shoes\u003c/code>\u003c/td>\n\u003ctd>К какому ресурсу обращаемся. После \u003ccode>?\u003c/code> идут параметры-фильтры\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Версия\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>HTTP/1.1\u003c/code>\u003c/td>\n\u003ctd>Диалект языка, сейчас почти везде 1.1 или 2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Заголовки\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>Host\u003c/code>, \u003ccode>Accept\u003c/code>, \u003ccode>Authorization\u003c/code>\u003c/td>\n\u003ctd>Метаданные: куда, в каком формате ответ ждать, кто мы\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Тело\u003c/strong>\u003c/td>\n\u003ctd>\u003cem>(у GET его нет)\u003c/em>\u003c/td>\n\u003ctd>Данные, которые клиент передаёт серверу — у \u003ccode>POST\u003c/code> и \u003ccode>PUT\u003c/code> здесь JSON\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Всё вместе — метод + путь + заголовки + тело — это и есть запрос. Сервер смотрит на метод и путь, понимает, \u003cem>что от него хотят\u003c/em>, и решает, какую логику запустить.\u003c/p>\n\u003ch2>Методы: GET, POST, PUT, PATCH, DELETE\u003c/h2>\n\u003cp>Метод — это «глагол» запроса. Пять основных:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Метод\u003c/th>\n\u003cth>Семантика\u003c/th>\n\u003cth>Тело запроса\u003c/th>\n\u003cth>Типичный пример\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>GET\u003c/code>\u003c/td>\n\u003ctd>Получить данные, ничего не менять\u003c/td>\n\u003ctd>нет\u003c/td>\n\u003ctd>«дай список товаров»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>POST\u003c/code>\u003c/td>\n\u003ctd>Создать что-то новое\u003c/td>\n\u003ctd>да (JSON)\u003c/td>\n\u003ctd>«создай заказ из корзины»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PUT\u003c/code>\u003c/td>\n\u003ctd>Обновить объект целиком\u003c/td>\n\u003ctd>да (JSON)\u003c/td>\n\u003ctd>«замени профиль пользователя»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>PATCH\u003c/code>\u003c/td>\n\u003ctd>Обновить часть полей\u003c/td>\n\u003ctd>да (JSON)\u003c/td>\n\u003ctd>«поменяй только email»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>DELETE\u003c/code>\u003c/td>\n\u003ctd>Удалить\u003c/td>\n\u003ctd>обычно нет\u003c/td>\n\u003ctd>«удали товар из корзины»\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Важная привычка бэкенда: один и тот же путь с разными методами делает разное. \u003ccode>GET /api/orders\u003c/code> — «покажи заказы», \u003ccode>POST /api/orders\u003c/code> — «создай заказ». Метод — часть смысла, а не техническая деталь.\u003c/p>\n\u003ch2>Ответ: статус-код + заголовки + тело\u003c/h2>\n\u003cp>Сервер всегда отвечает \u003cstrong>статус-кодом\u003c/strong> — трёхзначным числом, которое сразу говорит, как всё прошло:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Класс\u003c/th>\n\u003cth>Значение\u003c/th>\n\u003cth>Частые примеры\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>2xx\u003c/code>\u003c/td>\n\u003ctd>Успех\u003c/td>\n\u003ctd>\u003ccode>200 OK\u003c/code>, \u003ccode>201 Created\u003c/code>, \u003ccode>204 No Content\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>3xx\u003c/code>\u003c/td>\n\u003ctd>Редирект\u003c/td>\n\u003ctd>\u003ccode>301 Moved Permanently\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>4xx\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Ошибся клиент\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>400 Bad Request\u003c/code>, \u003ccode>401 Unauthorized\u003c/code>, \u003ccode>403 Forbidden\u003c/code>, \u003ccode>404 Not Found\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>5xx\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>Ошибся сервер\u003c/strong>\u003c/td>\n\u003ctd>\u003ccode>500 Internal Server Error\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Полезная шпаргалка для переписки в чатах:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>401\u003c/code> — «я не знаю, кто ты» (не авторизован)\u003c/li>\n\u003cli>\u003ccode>403\u003c/code> — «я знаю, кто ты, но нельзя» (нет прав)\u003c/li>\n\u003cli>\u003ccode>404\u003c/code> — «такого ресурса нет»\u003c/li>\n\u003cli>\u003ccode>500\u003c/code> — «всё сломалось на нашей стороне» (бэкендеру — в логи!)\u003c/li>\n\u003c/ul>\n\u003cp>Ответ на успешный \u003ccode>POST\u003c/code> (создание заказа) выглядит так:\u003c/p>\n\u003cpre>\u003ccode class=\"language-http\">\u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span> \u003cspan class=\"hljs-number\">201\u003c/span> Created\n\u003cspan class=\"hljs-attribute\">Content-Type\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>application/json\n\u003cspan class=\"hljs-attribute\">Location\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>/api/orders/42\n\n\u003cspan class=\"language-prolog\">{\n  \u003cspan class=\"hljs-string\">&quot;id&quot;\u003c/span>: \u003cspan class=\"hljs-number\">42\u003c/span>,\n  \u003cspan class=\"hljs-string\">&quot;status&quot;\u003c/span>: \u003cspan class=\"hljs-string\">&quot;NEW&quot;\u003c/span>,\n  \u003cspan class=\"hljs-string\">&quot;items&quot;\u003c/span>: [\n    { \u003cspan class=\"hljs-string\">&quot;sku&quot;\u003c/span>: \u003cspan class=\"hljs-string\">&quot;SHOE-01&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;title&quot;\u003c/span>: \u003cspan class=\"hljs-string\">&quot;Кроссовки&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;price&quot;\u003c/span>: \u003cspan class=\"hljs-number\">5990\u003c/span> }\n  ]\n}\n\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>201\u003c/code>, а не \u003ccode>200\u003c/code> — маленький, но важный штрих: сервер не просто «ок», он сообщает, что ресурс \u003cem>создан\u003c/em>, и в заголовке \u003ccode>Location\u003c/code> говорит, где его искать.\u003c/p>\n\u003ch2>JSON — язык обмена данными\u003c/h2>\n\u003cp>Тело запроса и ответа почти всегда — \u003cstrong>JSON\u003c/strong>: текстовый формат «ключ – значение», читаемый и человеком, и программой.\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;id&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;title&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;Кроссовки&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;price&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">5990\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;inStock&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-literal\">\u003cspan class=\"hljs-keyword\">true\u003c/span>\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;tags&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-punctuation\">[\u003c/span>\u003cspan class=\"hljs-string\">&quot;sports&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-string\">&quot;new&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">]\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Правила простые: объект в \u003ccode>{}\u003c/code>, список в \u003ccode>[]\u003c/code>, строки в \u003ccode>&quot;&quot;\u003c/code>, числа и \u003ccode>true\u003c/code>/\u003ccode>false\u003c/code>/\u003ccode>null\u003c/code> как есть. В Java (и в Spring Boot) этому формату соответствуют обычные классы с полями — но об этом в уроке 4.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> JSON вы знаете идеально. Новое для вас — что на бэкенде этот JSON превращается в \u003cstrong>Java-объект\u003c/strong> автоматически: за это отвечает Spring Boot и специальные классы-DTO.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Веб = \u003cstrong>клиент–сервер\u003c/strong>: клиент всегда начинает разговор, сервер отвечает\u003c/li>\n\u003cli>Запрос = \u003cstrong>метод + путь + заголовки + тело\u003c/strong>; метод — это смысл («прочитай» / «создай» / «удали»)\u003c/li>\n\u003cli>Ответ = \u003cstrong>статус-код + заголовки + тело\u003c/strong>; \u003ccode>2xx\u003c/code> — успех, \u003ccode>4xx\u003c/code> — вина клиента, \u003ccode>5xx\u003c/code> — вина сервера\u003c/li>\n\u003cli>\u003cstrong>JSON\u003c/strong> — формат обмена; на бэкенде он маппится в Java-объекты\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — что происходит \u003cem>на стороне сервера\u003c/em> после того, как он получил запрос: слои, база данных и почему бэкенд — это не «одна большая программа».\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Ты открываешь в браузере адрес https://shop.example.com/products. Что делает браузер?","options":["Отправляет HTTP-запрос GET на сервер shop.example.com","Скачивает себе всю базу товаров магазина","Устанавливает постоянное соединение и ждёт изменений","Ничего: сервер сам присылает страницу, когда появляются новости"],"correct":0,"explanation":"Браузер — это клиент: он отправляет GET-запрос по пути /products и ждёт ответа. Инициатор разговора в HTTP — всегда клиент."},{"type":"single","codeLang":"http","code":"HTTP/1.1 201 Created\nContent-Type: application/json\nLocation: /api/orders/42\n\n{\"id\": 42, \"status\": \"NEW\"}\n","question":"Посмотри на ответ сервера. Что означает статус 201?","options":["Ресурс успешно создан, в Location — где его искать","Ошибка авторизации: нужно перелогиниться","Ресурс не найден, проверь URL","Всё в порядке, это просто разновидность OK без деталей"],"correct":0,"explanation":"201 Created — успех создания ресурса. Заголовок Location показывает адрес нового объекта. «Просто OK» — это 200, он не сообщает о создании.","codeHtml":"\u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span> \u003cspan class=\"hljs-number\">201\u003c/span> Created\n\u003cspan class=\"hljs-attribute\">Content-Type\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>application/json\n\u003cspan class=\"hljs-attribute\">Location\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>/api/orders/42\n\n\u003cspan class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\u003cspan class=\"hljs-attr\">&quot;id&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span> \u003cspan class=\"hljs-attr\">&quot;status&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;NEW&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/span>"},{"type":"multi","question":"Какие утверждения про HTTP-методы верны? (несколько ответов)","options":["GET используют, чтобы получить данные, не меняя их на сервере","POST отправляет данные на сервер — например, чтобы создать объект","DELETE обязан передавать JSON-тело с описанием того, что удаляем","PUT и POST различаются скоростью: PUT всегда быстрее"],"correct":[0,1],"explanation":"GET — чтение, POST — создание/отправка данных. Тело у DELETE обычно пустое (что удалять — сказано в пути), а различие PUT/POST — в смысле (полная замена vs создание), а не в скорости."},{"type":"blank","question":"Какое значение должен иметь заголовок Content-Type, чтобы сообщить серверу, что тело запроса — JSON? Ответ в формате «тип/подтип».","answers":["application/json"],"explanation":"Content-Type: application/json — стандартный способ сказать «тело — это JSON». Без него Spring Boot не поймёт, как разбирать тело запроса."},{"type":"match","question":"Сопоставь HTTP-метод и его типичное назначение.","pairs":[{"left":"GET","right":"Получить данные, не меняя их"},{"left":"POST","right":"Создать новый объект"},{"left":"PUT","right":"Обновить объект целиком"},{"left":"DELETE","right":"Удалить объект"}]},{"type":"single","codeLang":"http","code":"GET /api/users/1042 HTTP/1.1\nHost: shop.example.com\nAuthorization: Bearer eyJhbGciOi...\n","question":"Запрос вернул статус 404, хотя пользователь 1042 точно существует в базе. Какая гипотеза хуже всего?","options":["Бэкенд ищет пользователя не в той таблице — баг на сервере","В пути опечатка: например, /api/users/1O42 с буквой O вместо нуля","Токен в Authorization истёк — сервер не узнал клиента","Маршрут /api/users/{id} вообще не настроен в приложении"],"correct":2,"explanation":"Истёкший или невалидный токен — это ошибка авторизации: сервер отвечает 401 (или 403), но не 404. А вот опечатка в id, отсутствие маршрута или баг с таблицей как раз дают именно «не найдено».","codeHtml":"\u003cspan class=\"hljs-keyword\">GET\u003c/span> \u003cspan class=\"hljs-string\">/api/users/1042\u003c/span> \u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span>\n\u003cspan class=\"hljs-attribute\">Host\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>shop.example.com\n\u003cspan class=\"hljs-attribute\">Authorization\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>Bearer eyJhbGciOi...\n"},{"type":"multi","question":"Какие статус-коды говорят об ошибке на стороне клиента (класс 4xx)?","options":["404 Not Found","401 Unauthorized","500 Internal Server Error","204 No Content"],"correct":[0,1],"explanation":"404 и 401 — класс 4xx, вина клиента (неверный ресурс / нет авторизации). 500 — серверная ошибка (5xx). 204 — вообще не ошибка: успешный ответ без тела."}]],"cases":[]},{"id":"lesson-02","title":"Что такое бэкенд-сервис","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":2,"lab":{"title":"Лаба 0. Запуск","description":"Поставить JDK 21 и IDE, открыть готовый проект и запустить его — один зелёный тест и живой endpoint. Подробная инструкция — в README ветки lab-0.","branch":"lab-0"},"html":"\u003ch1>Урок 2. Что такое бэкенд-сервис\u003c/h1>\n\u003cp>В уроке 1 запрос долетел до сервера и получил ответ. Но что происходит «за дверью»? Из чего состоит программа, которая отвечает, и почему бэкенд — это почти всегда несколько слоёв, а не один большой файл?\u003c/p>\n\u003ch2>Сервис — это программа, которая слушает порт\u003c/h2>\n\u003cp>Когда говорят «наш бэкенд», чаще всего имеют в виду \u003cstrong>сервис\u003c/strong> — отдельную программу (у нас это JVM-процесс на Java), которая:\u003c/p>\n\u003col>\n\u003cli>запустилась на сервере,\u003c/li>\n\u003cli>открыла \u003cstrong>порт\u003c/strong> — «окно», через которое принимает HTTP-запросы,\u003c/li>\n\u003cli>работает в цикле: получила запрос → обработала → ответила → ждёт следующий.\u003c/li>\n\u003c/ol>\n\u003cp>В Spring Boot веб-сервер (Tomcat) встроен прямо в приложение: запустил jar-файл — сервис уже слушает HTTP. Не нужно ничего устанавливать и настраивать отдельно.\u003c/p>\n\u003cp>Порт — как квартира в многоквартирном доме: сервер имеет один адрес (например, \u003ccode>shop.example.com\u003c/code>), но в «квартире 8080» живёт бэкенд магазина, в «квартире 9090» — сервис уведомлений. Полный адрес сервиса складывается из хоста и порта: \u003ccode>http://shop.example.com:8080/api/...\u003c/code>\u003c/p>\n\u003cp>Если порт в настройках не указан, Spring Boot по умолчанию слушает \u003cstrong>8080\u003c/strong>.\u003c/p>\n\u003ch2>Что происходит с запросом внутри: слои\u003c/h2>\n\u003cp>Запрос, попав в сервис, проходит через слои. У каждого — одна ответственность:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    C2[&quot;Клиент&lt;br/&gt;(браузер, приложение)&quot;] --&gt;|&quot;HTTP-запрос&quot;| K[&quot;Контроллер&quot;]\n    K --&gt; S[&quot;Сервисный слой&quot;]\n    S --&gt; R[&quot;Репозиторий&quot;]\n    R --&gt; D[(&quot;База данных&quot;)]\n    D --&gt; R2[&quot;ответ обратно&quot;]\n    R --&gt; S\n    S --&gt; K\n    K --&gt;|&quot;HTTP-ответ&quot;| C3[&quot;Клиент&quot;]\u003c/div>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Слой\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003cth>Не делает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Контроллер\u003c/strong>\u003c/td>\n\u003ctd>Принимает HTTP, проверяет входные данные, вызывает сервис, формирует ответ\u003c/td>\n\u003ctd>Не содержит бизнес-правил, не ходит в базу\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Сервисный слой\u003c/strong>\u003c/td>\n\u003ctd>Бизнес-логика: правила, вычисления, «что можно и нельзя»\u003c/td>\n\u003ctd>Не знает про HTTP: ни URL, ни статус-коды\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Репозиторий\u003c/strong>\u003c/td>\n\u003ctd>Читает и записывает данные\u003c/td>\n\u003ctd>Не решает бизнес-задачи\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>База данных\u003c/strong>\u003c/td>\n\u003ctd>Долговременно хранит данные\u003c/td>\n\u003ctd>Не считает скидки и не валидирует запросы\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Зачем так сложно?\u003c/strong> Три выгоды:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Локализация багов.\u003c/strong> Пришёл \u003ccode>400\u003c/code> и «поле обязательно» — смотри контроллер. Заказ посчитан неверно — сервисный слой. Данные не сохранились — репозиторий или база.\u003c/li>\n\u003cli>\u003cstrong>Тестируемость.\u003c/strong> Сервисный слой можно проверить без HTTP и базы — быстрые и стабильные тесты.\u003c/li>\n\u003cli>\u003cstrong>Изменяемость.\u003c/strong> Поменять способ хранения (например, перейти на другую базу) можно, не трогая бизнес-логику.\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> вы уже пишите слоями: страница → хук/стор → API-клиент. Контроллер ≈ обработчик маршрута, сервисный слой ≈ бизнес-хук с правилами, репозиторий ≈ слой работы с API. Разница одна: у бэкенда под репозиторием настоящая база данных, а не чужой API.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> слои — ваш инструмент диагностики. Симптом + статус-код почти всегда подсказывают, где искать: \u003ccode>400\u003c/code>/\u003ccode>422\u003c/code> — валидация в контроллере, \u003ccode>500\u003c/code> с логом SQL — репозиторий, «логика посчитала не то» при \u003ccode>200 OK\u003c/code> — сервисный слой. Это сужает поле поиска бага в разы.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> слои = распределение ответственности. Требование «скидка не больше 50%» — это про сервисный слой, «у заказа обязательное поле email» — про контроллер, «история заказов хранится 5 лет» — про хранение. Когда вы знаете, про какой слой требование, его проще декомпозировать и проверить.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Конфигурация: application.yml\u003c/h2>\n\u003cp>Сервису нужно знать: какой порт слушать, как называется база, где брать секреты. Всё это живёт не в коде, а в \u003cstrong>конфигурации\u003c/strong> — файле \u003ccode>application.yml\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">server:\u003c/span>\n  \u003cspan class=\"hljs-attr\">port:\u003c/span> \u003cspan class=\"hljs-number\">8080\u003c/span>\n\n\u003cspan class=\"hljs-attr\">spring:\u003c/span>\n  \u003cspan class=\"hljs-attr\">application:\u003c/span>\n    \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">orders-service\u003c/span>\n  \u003cspan class=\"hljs-attr\">datasource:\u003c/span>\n    \u003cspan class=\"hljs-attr\">url:\u003c/span> \u003cspan class=\"hljs-string\">jdbc:h2:mem:orders\u003c/span>\n    \u003cspan class=\"hljs-attr\">username:\u003c/span> \u003cspan class=\"hljs-string\">sa\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Ключевые привычки:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Профили\u003c/strong>: \u003ccode>application-dev.yml\u003c/code> для локальной разработки, \u003ccode>application-prod.yml\u003c/code> для боевого окружения. Код один — настройки разные.\u003c/li>\n\u003cli>\u003cstrong>Секреты\u003c/strong> (пароли, токены) — не в файле и не в git, а в переменных окружения.\u003c/li>\n\u003cli>Конфиг меняется без перекомпиляции: поменял порт — перезапустил.\u003c/li>\n\u003c/ul>\n\u003ch2>Почему не одна большая программа\u003c/h2>\n\u003cp>Реальный бэкенд — это часто \u003cstrong>несколько сервисов\u003c/strong>: заказы, платежи, уведомления. Причины:\u003c/p>\n\u003cul>\n\u003cli>разные команды развивают свои части независимо,\u003c/li>\n\u003cli>сбой в уведомлениях не роняет оформление заказа,\u003c/li>\n\u003cli>каждый сервис масштабируется под свою нагрузку.\u003c/li>\n\u003c/ul>\n\u003cp>Общаются сервисы двумя основными способами: \u003cstrong>напрямую по HTTP\u003c/strong> («заказ-сервис спросил у платежного статус») и \u003cstrong>через брокер сообщений вроде Kafka\u003c/strong> («заказ-сервис опубликовал событие &quot;заказ создан&quot; — все, кому важно, получили»). Как это устроено — в уроке 5.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Сервис = процесс со встроенным веб-сервером, который слушает порт (по умолчанию 8080) и отвечает на HTTP\u003c/li>\n\u003cli>Внутри слои: \u003cstrong>контроллер → сервис → репозиторий → база\u003c/strong>; каждый слой отвечает за одно\u003c/li>\n\u003cli>Конфигурация — в \u003ccode>application.yml\u003c/code>: порты, имя, база; профили dev/prod, секреты — в переменных окружения\u003c/li>\n\u003cli>Система — это несколько сервисов, общающихся по HTTP и через Kafka\u003c/li>\n\u003c/ul>\n\u003cp>Дальше — короткая Java-шпаргалка, чтобы вы могли читать код этих слоёв. А после неё — первая практика.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Коллега говорит: «Наш бэкенд слушает порт 8080». Что это значит?","options":["Сервис принимает HTTP-запросы, которые приходят на порт 8080 этого сервера","Приложение занимает 8080 мегабайт памяти","У приложения есть пул на 8080 потоков","Сервер выдерживает максимум 8080 запросов в секунду"],"correct":0,"explanation":"Порт — это «окно» с номером, через которое процесс принимает входящие соединения. Адрес сервиса = хост + порт: http://host:8080."},{"type":"single","codeLang":"yaml","code":"server:\n  port: 9090\n\nspring:\n  application:\n    name: orders-service\n","question":"Приложение с таким конфигом запущено на твоей машине. По какому адресу оно доступно?","options":["http://localhost:9090","http://localhost:8080","http://orders-service:9090","http://localhost/9090"],"correct":0,"explanation":"server.port: 9090 переопределяет дефолтный 8080. localhost = твоя машина, значит http://localhost:9090. Имя приложения — это метка для логов и метрик, не адрес.","codeHtml":"\u003cspan class=\"hljs-attr\">server:\u003c/span>\n  \u003cspan class=\"hljs-attr\">port:\u003c/span> \u003cspan class=\"hljs-number\">9090\u003c/span>\n\n\u003cspan class=\"hljs-attr\">spring:\u003c/span>\n  \u003cspan class=\"hljs-attr\">application:\u003c/span>\n    \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">orders-service\u003c/span>\n"},{"type":"match","question":"Сопоставь слой и его ответственность.","pairs":[{"left":"Контроллер","right":"Принять HTTP-запрос и вернуть ответ"},{"left":"Сервисный слой","right":"Бизнес-правила и вычисления"},{"left":"Репозиторий","right":"Чтение и запись данных"},{"left":"База данных","right":"Долговременное хранение"}]},{"type":"multi","question":"Какие утверждения про слои верны? (несколько ответов)","options":["Контроллер не должен ходить в базу данных напрямую","Бизнес-правила вроде «скидка не больше 50%» живут в сервисном слое","Репозиторий знает, что такое HTTP-заголовки","Слои нужны в том числе для локализации багов"],"correct":[0,1,3],"explanation":"Репозиторий — единственный слой, которому можно ничего не знать про HTTP: он про данные, а не про транспортировку запросов. Остальное — прямые следствия принципа «один слой — одна ответственность»."},{"type":"blank","question":"Какой порт слушает Spring Boot-приложение по умолчанию, если в application.yml порт не задан?","answers":["8080"],"explanation":"Дефолт Tomcat в Spring Boot — 8080. Занят? Меняй server.port в конфиге."},{"type":"single","question":"Зачем в проекте конфиги application-dev.yml и application-prod.yml?","options":["Код один, но настройки разные: локально — тестовая база и дебаг, в проде — боевая база и строгости","Чтобы в dev-профиле не писать бизнес-логику","Профили переключают язык ответов API","Это версии приложения: dev — старая, prod — новая"],"correct":0,"explanation":"Профиль — набор настроек для окружения. Код и сборка одни и те же, меняется только окружение: базы, уровни логирования, внешние адреса."},{"type":"single","question":"Пользователь оформил заказ на 3 позиции, в базу сохранился только 1. API ответил 200 OK, в ответе все 3 позиции. Какой слой — первый подозреваемый?","options":["Сервисный слой: бизнес-логика передала на сохранение не всё","Контроллер: неверно разобрал запрос — но тогда ответ был бы 400 и без позиций","База данных: диск переполнен — но тогда был бы 500 и ошибка в логах","Веб-сервер: исчерпал потоки — но тогда запросы просто не доходили бы"],"correct":0,"explanation":"Ответ 200 и корректный JSON говорят: контроллер отработал. База не падала (иначе 500). Значит, данные потерялись между сервисом и сохранением — ищем в сервисном слое. Это и есть диагностика по слоям."}]],"cases":[]},{"id":"lesson-03","title":"Java-минимум для чтения кода","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":3,"lab":null,"html":"\u003ch1>Урок 3. Java-минимум для чтения кода\u003c/h1>\n\u003cp>Чтобы читать Spring-код, не нужно знать всю Java. Хватит десяти конструкций — и большинство из них вы уже видели в TypeScript или Python. Этот урок — шпаргалка: читаем её сейчас, а возвращаемся, когда в уроках 4–5 встретится незнакомый синтаксис.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> Java похожа на TypeScript: статические типы, классы, интерфейсы, дженерики (\u003ccode>List&lt;String&gt;\u003c/code> ≈ \u003ccode>string[]\u003c/code>, \u003ccode>Map&lt;String, Integer&gt;\u003c/code> ≈ \u003ccode>Record&lt;string, number&gt;\u003c/code>). Главное отличие — многословность и аннотации вместо декораторов… хотя декораторы в TS — те же аннотации, только стандартнее.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Класс — чертёж объекта\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Order\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> String number;      \u003cspan class=\"hljs-comment\">// поле: данные\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> BigDecimal amount;        \u003cspan class=\"hljs-comment\">// ещё поле\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String status;\n\n    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">Order\u003c/span>\u003cspan class=\"hljs-params\">(String number, BigDecimal amount)\u003c/span> {   \u003cspan class=\"hljs-comment\">// конструктор\u003c/span>\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.number = number;\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.amount = amount;\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.status = \u003cspan class=\"hljs-string\">&quot;NEW&quot;\u003c/span>;\n    }\n\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">BigDecimal\u003c/span> \u003cspan class=\"hljs-title function_\">getAmount\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {   \u003cspan class=\"hljs-comment\">// метод: поведение\u003c/span>\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> amount;\n    }\n\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">cancel\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {            \u003cspan class=\"hljs-comment\">// void = ничего не возвращает\u003c/span>\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.status = \u003cspan class=\"hljs-string\">&quot;CANCELLED&quot;\u003c/span>;\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Читать так: \u003cstrong>класс\u003c/strong> \u003ccode>Order\u003c/code> — чертёж; \u003ccode>new Order(&quot;A-1&quot;, ...)\u003c/code> — конкретный объект, \u003cem>экземпляр\u003c/em>. \u003cstrong>Поля\u003c/strong> — данные объекта, \u003cstrong>методы\u003c/strong> — его поведение. \u003ccode>private\u003c/code>/\u003ccode>public\u003c/code> — видимость: снаружи класса видно только \u003ccode>public\u003c/code>.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> поле класса ≈ атрибут сущности в вашей модели, метод ≈ операция над ней. \u003ccode>Order\u003c/code> с полями \u003ccode>number\u003c/code>, \u003ccode>amount\u003c/code>, \u003ccode>status\u003c/code> — это ровно ваша карточка сущности «Заказ», просто в синтаксисе Java.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Типы: главное\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Тип\u003c/th>\n\u003cth>Что это\u003c/th>\n\u003cth>Пример\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>String\u003c/code>\u003c/td>\n\u003ctd>строка\u003c/td>\n\u003ctd>\u003ccode>&quot;NEW&quot;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>int\u003c/code>, \u003ccode>long\u003c/code>\u003c/td>\n\u003ctd>целые числа\u003c/td>\n\u003ctd>\u003ccode>42\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>boolean\u003c/code>\u003c/td>\n\u003ctd>истина/ложь\u003c/td>\n\u003ctd>\u003ccode>true\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>BigDecimal\u003c/code>\u003c/td>\n\u003ctd>\u003cstrong>деньги\u003c/strong> (точная арифметика)\u003c/td>\n\u003ctd>\u003ccode>new BigDecimal(&quot;5990.00&quot;)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>List&lt;T&gt;\u003c/code>\u003c/td>\n\u003ctd>список\u003c/td>\n\u003ctd>\u003ccode>List&lt;String&gt; tags\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Map&lt;K,V&gt;\u003c/code>\u003c/td>\n\u003ctd>словарь\u003c/td>\n\u003ctd>\u003ccode>Map&lt;String, Integer&gt;\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>record\u003c/code>\u003c/td>\n\u003ctd>неизменяемый контейнер данных\u003c/td>\n\u003ctd>\u003ccode>record Point(int x, int y) {}\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Две привычки, которые вы будете встречать постоянно:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Деньги — всегда \u003ccode>BigDecimal\u003c/code>\u003c/strong>, не \u003ccode>double\u003c/code>: числа с плавающей точкой копят погрешность (\u003ccode>0.1 + 0.2 != 0.3\u003c/code>), а в ценах терять копейки нельзя.\u003c/li>\n\u003cli>\u003ccode>final\u003c/code> — значение нельзя переприсвоить. Поле \u003ccode>final\u003c/code> задаётся один раз в конструкторе: иммутабельность, любимо и бэкендом, и фронтендом.\u003c/li>\n\u003c/ul>\n\u003ch2>Аннотации: метки для фреймворков\u003c/h2>\n\u003cp>\u003ccode>@Что-то\u003c/code> над классом, полем или методом — \u003cstrong>аннотация\u003c/strong>: метаданные, которые читает не ваша программа, а фреймворк.\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Override\u003c/span>                     \u003cspan class=\"hljs-comment\">// «я переопределяю метод родителя»\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">String\u003c/span> \u003cspan class=\"hljs-title function_\">toString\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> { ... }\n\n\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>               \u003cspan class=\"hljs-comment\">// Spring: выполнить метод в транзакции\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">createOrder\u003c/span>\u003cspan class=\"hljs-params\">(...)\u003c/span> { ... }\n\u003c/code>\u003c/pre>\n\u003cp>Spring построен на этом: \u003ccode>@RestController\u003c/code>, \u003ccode>@Service\u003c/code>, \u003ccode>@Entity\u003c/code> — аннотации, по которым фреймворк находит ваши классы и решает, что с ними делать. Это как декораторы в TS — только читает их Spring при старте приложения.\u003c/p>\n\u003ch2>Lombok: меньше бойлерплейта\u003c/h2>\n\u003cp>В Java классы данных получаются многословными: конструктор, геттеры, сеттеры, equals, toString… \u003cstrong>Lombok\u003c/strong> генерирует это за вас на этапе компиляции:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Getter\u003c/span>                     \u003cspan class=\"hljs-comment\">// сгенерирует getNumber(), getAmount(), getStatus()\u003c/span>\n\u003cspan class=\"hljs-meta\">@Builder\u003c/span>                    \u003cspan class=\"hljs-comment\">// сгенерирует builder: Order.builder()...build()\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Order\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> String number;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> BigDecimal amount;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String status;\n}\n\u003c/code>\u003c/pre>\n\u003cp>В реальных проектах так и выглядит: тонкий класс с аннотациями \u003ccode>@Getter\u003c/code>, \u003ccode>@Builder\u003c/code>, \u003ccode>@Data\u003c/code>. Если не видите геттер в коде — его сгенерировал Lombok, IDE его покажет.\u003c/p>\n\u003ch2>Optional: честный «может не быть»\u003c/h2>\n\u003cp>Метод может не найти значение. Возвращать \u003ccode>null\u003c/code> — русская рулетка (забыл проверить — \u003ccode>NullPointerException\u003c/code>). Java-способ — обёртка \u003ccode>Optional\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Optional\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-variable\">found\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderRepository.findByNumber(\u003cspan class=\"hljs-string\">&quot;A-1&quot;\u003c/span>);\n\nfound.ifPresent(order -&gt; log.info(order.getStatus()));  \u003cspan class=\"hljs-comment\">// если есть\u003c/span>\n\u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> found.orElseThrow(() -&gt; \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderNotFoundException\u003c/span>(\u003cspan class=\"hljs-string\">&quot;A-1&quot;\u003c/span>));\n\u003cspan class=\"hljs-type\">BigDecimal\u003c/span> \u003cspan class=\"hljs-variable\">amount\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> found.map(Order::getAmount).orElse(BigDecimal.ZERO);\n\u003c/code>\u003c/pre>\n\u003cp>Читаете \u003ccode>Optional&lt;Order&gt;\u003c/code> — сразу понятно: «заказ может не найтись, обработай это». \u003ccode>map\u003c/code>/\u003ccode>orElse\u003c/code> — как у optional chaining \u003ccode>?.\u003c/code> и \u003ccode>??\u003c/code> в TypeScript.\u003c/p>\n\u003ch2>Интерфейс и реализация\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {          \u003cspan class=\"hljs-comment\">// контракт: ЧТО умеет\u003c/span>\n    \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest request)\u003c/span>;\n    \u003cspan class=\"hljs-type\">Optional\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-title function_\">findByNumber\u003c/span>\u003cspan class=\"hljs-params\">(String number)\u003c/span>;\n}\n\n\u003cspan class=\"hljs-meta\">@Service\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderServiceImpl\u003c/span> \u003cspan class=\"hljs-keyword\">implements\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {   \u003cspan class=\"hljs-comment\">// КАК умеет\u003c/span>\n    \u003cspan class=\"hljs-meta\">@Override\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest request)\u003c/span> { ... }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Контракт отдельно, реализация отдельно. Когда код просит «дай мне \u003ccode>OrderService\u003c/code>», Spring подставит реализацию — это \u003cstrong>Dependency Injection\u003c/strong>, механика урока 4. Пока достаточно: видите \u003ccode>interface X\u003c/code> и \u003ccode>class XImpl implements X\u003c/code> — это «что» и «как».\u003c/p>\n\u003ch2>Как читать незнакомый Java-файл\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Аннотации над классом\u003c/strong> — кто это (\u003ccode>@RestController\u003c/code>? \u003ccode>@Service\u003c/code>? \u003ccode>@Entity\u003c/code>?) — главная подсказка роли.\u003c/li>\n\u003cli>\u003cstrong>Поля\u003c/strong> — какие данные держит.\u003c/li>\n\u003cli>\u003cstrong>Публичные методы\u003c/strong> — что умеет; их параметры и возвращаемые типы — вход и выход.\u003c/li>\n\u003cli>Детали реализации — по необходимости.\u003c/li>\n\u003c/ol>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Класс = чертёж: поля (данные) + методы (поведение); \u003ccode>new\u003c/code> = экземпляр\u003c/li>\n\u003cli>Деньги — \u003ccode>BigDecimal\u003c/code>; \u003ccode>final\u003c/code> = «не переприсваивать»\u003c/li>\n\u003cli>\u003ccode>@Аннотации\u003c/code> — метки для фреймворков, Lombok генерирует бойлерплейт\u003c/li>\n\u003cli>\u003ccode>Optional&lt;T&gt;\u003c/code> — честное «значения может не быть», как \u003ccode>?.\u003c/code> и \u003ccode>??\u003c/code>\u003c/li>\n\u003cli>\u003ccode>interface\u003c/code> — контракт, \u003ccode>Impl\u003c/code> — реализация; связывает Spring\u003c/li>\n\u003cli>Алгоритм чтения файла: аннотации → поля → публичные методы\u003c/li>\n\u003c/ul>\n\u003cp>Теперь вы готовы читать Spring-контроллер целиком — этим и займёмся.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"В коде встретили строку new Order(\"A-1\", amount). Что она делает?","options":["Создаёт новый объект-экземпляр класса Order, вызвав конструктор","Объявляет класс Order","Копирует существующий заказ A-1","Подключает зависимость Order через Spring"],"correct":0,"explanation":"new + имя класса = создать экземпляр по чертежу-классу, передав аргументы в конструктор. Класс объявляется словом class, зависимости подключает Spring без new."},{"type":"single","codeLang":"java","code":"double price = 0.1 + 0.2;              // 0.30000000000000004\nBigDecimal money = new BigDecimal(\"0.1\").add(new BigDecimal(\"0.2\"));  // ровно 0.3\n","question":"Почему в бэкенде деньги держат в BigDecimal, а не в double?","options":["double копит погрешность округления — в ценах нельзя терять копейки","BigDecimal работает быстрее double","double нельзя складывать","BigDecimal занимает меньше памяти"],"correct":0,"explanation":"Числа с плавающей точкой — двоичные дроби, 0.1 в них не представимо точно, погрешности накапливаются. BigDecimal хранит десятичную запись точно. Скорость у него ниже — но в расчётах денег точность важнее.","codeHtml":"\u003cspan class=\"hljs-type\">double\u003c/span> \u003cspan class=\"hljs-variable\">price\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">0.1\u003c/span> + \u003cspan class=\"hljs-number\">0.2\u003c/span>;              \u003cspan class=\"hljs-comment\">// 0.30000000000000004\u003c/span>\n\u003cspan class=\"hljs-type\">BigDecimal\u003c/span> \u003cspan class=\"hljs-variable\">money\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;0.1&quot;\u003c/span>).add(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;0.2&quot;\u003c/span>));  \u003cspan class=\"hljs-comment\">// ровно 0.3\u003c/span>\n"},{"type":"multi","question":"Какие утверждения верны? (несколько ответов)","options":["Аннотация — это метаданные, которые читает фреймворк, а не ваша логика","Lombok генерирует геттеры и билдеры на этапе компиляции","Optional\u003cT> гарантирует, что внутри никогда не лежит null","Метод с возвращаемым типом void возвращает значение null"],"correct":[0,1],"explanation":"Optional — это сигнал «обработай отсутствие значения», а не гарантия отсутствия null внутри (обёртка сама может быть null, если её так создали). void означает «метод ничего не возвращает», это не null."},{"type":"blank","question":"Какое ключевое слово пишут перед методом, который ничего не возвращает? Например, у метода cancel().","answers":["void"],"explanation":"void = «пусто»: метод выполняет действия, но не возвращает значение."},{"type":"match","question":"Сопоставь понятие Java и его смысл.","pairs":[{"left":"Класс","right":"Чертёж объекта: поля и методы"},{"left":"Аннотация","right":"Метка-метаданные для фреймворков"},{"left":"Интерфейс","right":"Контракт: что должно уметь"},{"left":"Optional","right":"Честное «значения может не быть»"}]},{"type":"single","codeLang":"java","code":"Optional\u003cUser> user = userRepository.findByLogin(\"ann\");\n\nString name = user\n    .map(User::getName)\n    .orElse(\"guest\");\n","question":"Пользователя с логином ann в базе нет. Что окажется в переменной name?","options":["Строка \"guest\"","null","Исключение NullPointerException","Пустая строка \"\""],"correct":0,"explanation":"Пустой Optional.map(...) возвращает пустой Optional, а orElse(\"guest\") подставляет значение по умолчанию. Это аналог user?.name ?? \"guest\" в TypeScript.","codeHtml":"\u003cspan class=\"hljs-type\">Optional\u003c/span>&lt;User&gt; \u003cspan class=\"hljs-variable\">user\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> userRepository.findByLogin(\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>);\n\n\u003cspan class=\"hljs-type\">String\u003c/span> \u003cspan class=\"hljs-variable\">name\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> user\n    .map(User::getName)\n    .orElse(\u003cspan class=\"hljs-string\">&quot;guest&quot;\u003c/span>);\n"},{"type":"single","question":"В проекте есть interface OrderService и класс OrderServiceImpl implements OrderService. Зачем так делается?","options":["Контракт отделён от реализации: код зависит от «что умеет», а какую реализацию подсунуть — решает Spring","Это требование компилятора: без интерфейса класс не скомпилируется","Интерфейс нужен только для документации, на код не влияет","Так скрывают пароли реализации от базы данных"],"correct":0,"explanation":"Классы могут зависеть от интерфейса, а Spring (Dependency Injection) подставит реализацию. Это позволяет менять «как» не трогая «что», и подменять реализацию в тестах."}]],"cases":[]},{"id":"lesson-04","title":"Первый REST-контроллер","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":4,"lab":{"title":"Лаба 1. Контроллер","description":"Дописать REST-контроллер магазина по TODO-меткам: DTO, Lombok, MapStruct-маппер. Без автотестов — сделал и сравнил со студенческим эталоном в ветке решения.","branch":"lab-1","branchSolution":"lab-1-solution"},"html":"\u003ch1>Урок 4. Первый REST-контроллер\u003c/h1>\n\u003cp>Собираем всё, что уже знаем: HTTP из урока 1, слои из урока 2, Java-шпаргалку из урока 3. Результат — настоящий Spring Boot-контроллер, который вы сможете не только прочитать, но и написать (в лабе 1).\u003c/p>\n\u003ch2>Аннотации, которые делают всё\u003c/h2>\n\u003cp>В Spring контроллер — это обычный класс с аннотациями. Фреймворк видит их при старте, регистрирует маршруты и сам раздаёт входящие запросы:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@RestController\u003c/span>                          \u003cspan class=\"hljs-comment\">// этот класс принимает HTTP и возвращает JSON\u003c/span>\n\u003cspan class=\"hljs-meta\">@RequestMapping(&quot;/api/products&quot;)\u003c/span>         \u003cspan class=\"hljs-comment\">// общий префикс путей\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">ProductController\u003c/span> {\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> ProductService productService;   \u003cspan class=\"hljs-comment\">// логика — в сервисном слое\u003c/span>\n\n    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">ProductController\u003c/span>\u003cspan class=\"hljs-params\">(ProductService productService)\u003c/span> {\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.productService = productService;      \u003cspan class=\"hljs-comment\">// Spring сам подставит реализацию (DI)\u003c/span>\n    }\n\n    \u003cspan class=\"hljs-meta\">@GetMapping\u003c/span>                          \u003cspan class=\"hljs-comment\">// GET /api/products\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;ProductResponse&gt; \u003cspan class=\"hljs-title function_\">findAll\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> productService.findAll();\n    }\n\n    \u003cspan class=\"hljs-meta\">@GetMapping(&quot;/{id}&quot;)\u003c/span>                 \u003cspan class=\"hljs-comment\">// GET /api/products/42\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">ProductResponse\u003c/span> \u003cspan class=\"hljs-title function_\">findById\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@PathVariable\u003c/span> Long id)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> productService.findById(id);\n    }\n\n    \u003cspan class=\"hljs-meta\">@PostMapping\u003c/span>                        \u003cspan class=\"hljs-comment\">// POST /api/products\u003c/span>\n    \u003cspan class=\"hljs-meta\">@ResponseStatus(HttpStatus.CREATED)\u003c/span>  \u003cspan class=\"hljs-comment\">// вернём 201, а не 200\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">ProductResponse\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@RequestBody\u003c/span> CreateProductRequest request)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> productService.create(request);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Как запрос находит метод:\u003c/p>\n\u003cdiv class=\"mermaid\">sequenceDiagram\n    participant C as Клиент\n    participant W as Spring (DispatcherServlet)\n    participant K as ProductController\n    participant S as ProductService\n    C-&gt;&gt;W: GET /api/products/42\n    W-&gt;&gt;W: смотрит путь+метод → findById(42)\n    W-&gt;&gt;K: вызвать метод, конвертировать аргументы\n    K-&gt;&gt;S: findById(42)\n    S--&gt;&gt;K: ProductResponse\n    K--&gt;&gt;W: объект\n    W--&gt;&gt;C: 200 OK + JSON\u003c/div>\u003cp>Разбор аннотаций-переводчиков:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Аннотация\u003c/th>\n\u003cth>Что делает\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>@RestController\u003c/code>\u003c/td>\n\u003ctd>«этот класс — REST-endpoint»: методы возвращают объекты, Spring сериализует их в JSON\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@GetMapping\u003c/code> / \u003ccode>@PostMapping\u003c/code> / \u003ccode>@PutMapping\u003c/code> / \u003ccode>@DeleteMapping\u003c/code>\u003c/td>\n\u003ctd>какой HTTP-метод и путь обрабатывает метод\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@PathVariable\u003c/code>\u003c/td>\n\u003ctd>кусочек пути (\u003ccode>42\u003c/code> из \u003ccode>/api/products/42\u003c/code>) → аргумент метода\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@RequestBody\u003c/code>\u003c/td>\n\u003ctd>тело запроса (JSON) → Java-объект\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@ResponseStatus\u003c/code>\u003c/td>\n\u003ctd>какой статус вернуть при успехе\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> \u003ccode>@GetMapping(&quot;/api/products&quot;)\u003c/code> ≈ маршрут вашего роутера, \u003ccode>@RequestBody\u003c/code> ≈ \u003ccode>JSON.parse\u003c/code> + zod-схема: Spring сам распарсит тело и сложит его в объект. Вы пишете обработчик — фреймворк вызывает.\u003c/p>\n\u003c/blockquote>\n\u003ch2>DTO: контракт обмена, а не внутренности\u003c/h2>\n\u003cp>Класс для ответа API — отдельный. Это \u003cstrong>DTO\u003c/strong> (Data Transfer Object):\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">record\u003c/span> \u003cspan class=\"hljs-title class_\">ProductResponse\u003c/span>\u003cspan class=\"hljs-params\">(          // record: неизменяемый класс данных\n        Long id,\n        String title,\n        BigDecimal price\n)\u003c/span> {}\n\u003c/code>\u003c/pre>\n\u003cp>Зачем не отдавать «настоящий» объект из базы напрямую?\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Стабильный контракт\u003c/strong>: поменяли поле в хранилище — API не дрогнул; фронтенд не падает от лишних внутренних полей.\u003c/li>\n\u003cli>\u003cstrong>Безопасность\u003c/strong>: не утечет \u003ccode>passwordHash\u003c/code> или себестоимость.\u003c/li>\n\u003cli>\u003cstrong>Понятно, чтоAPI\u003c/strong>: DTO — это и есть описание API: поля запроса и ответа.\u003c/li>\n\u003c/ul>\n\u003cp>Для запросов — то же самое: \u003ccode>CreateProductRequest(String title, BigDecimal price)\u003c/code>. Spring превратит \u003ccode>{&quot;title&quot;: &quot;Кроссовки&quot;, &quot;price&quot;: 5990}\u003c/code> в этот объект, а на ошибку валидации вернёт \u003ccode>400\u003c/code>.\u003c/p>\n\u003ch2>MapStruct: переливание полей без боли\u003c/h2>\n\u003cp>Внутри приложения — свои объекты (entity, о них в уроке 5), снаружи — DTO. Между ними нужен «переливальщик». \u003cstrong>MapStruct\u003c/strong> генерирует его сам:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Mapper(componentModel = &quot;spring&quot;)\u003c/span>      \u003cspan class=\"hljs-comment\">// реализацию соберёт Spring\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">ProductMapper\u003c/span> {\n    \u003cspan class=\"hljs-type\">ProductResponse\u003c/span> \u003cspan class=\"hljs-title function_\">toResponse\u003c/span>\u003cspan class=\"hljs-params\">(Product product)\u003c/span>;      \u003cspan class=\"hljs-comment\">// entity → DTO\u003c/span>\n    \u003cspan class=\"hljs-type\">Product\u003c/span> \u003cspan class=\"hljs-title function_\">toEntity\u003c/span>\u003cspan class=\"hljs-params\">(CreateProductRequest request)\u003c/span>;   \u003cspan class=\"hljs-comment\">// DTO → entity\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Одна строчка на преобразование — MapStruct сгенерирует класс с честным \u003ccode>new ProductResponse(product.getId(), product.getTitle(), ...)\u003c/code>. Скучные присваивания полей больше не пишут руками.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA-инженерам:\u003c/strong> MapStruct-мапперы — любимое место коварных багов: поле забыли замапить — в ответе будет \u003ccode>null\u003c/code>. Проверяйте не только статус 200, но и значения всех полей DTO.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Код-first и API-First: два подхода к дизайну API\u003c/h2>\n\u003cp>Мы писали код — и API получался каким вышел (это \u003cstrong>code-first\u003c/strong>). Есть и обратный путь — \u003cstrong>API-First\u003c/strong>:\u003c/p>\n\u003col>\n\u003cli>Сначала \u003cstrong>контракт\u003c/strong>: OpenAPI-файл (YAML), где описаны пути, запросы, ответы, коды ошибок.\u003c/li>\n\u003cli>Из контракта \u003cstrong>генерируется\u003c/strong> код: заготовки контроллеров на бэкенде и типизированные клиенты на фронтенд.\u003c/li>\n\u003cli>Контракт — предмет договора: фронтендер, QA и аналитик читают его до того, как код написан.\u003c/li>\n\u003c/ol>\n\u003cp>API-First особенно силён, когда API много и их потребляют другие команды. Погружение в контрактный подход и сравнение с GraphQL (альтернативный стиль API, где клиент сам просит нужные поля) — тема отдельного модуля «Проектирование API».\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Контроллер = класс с \u003ccode>@RestController\u003c/code>; аннотации маппинга связывают метод+путь с HTTP\u003c/li>\n\u003cli>\u003ccode>@PathVariable\u003c/code> — из пути, \u003ccode>@RequestBody\u003c/code> — из тела; Spring сам конвертирует JSON ↔ объекты\u003c/li>\n\u003cli>API принимает и возвращает \u003cstrong>DTO\u003c/strong> — стабильный контракт, а не внутренние объекты\u003c/li>\n\u003cli>\u003cstrong>MapStruct\u003c/strong> генерирует перевод entity ↔ DTO\u003c/li>\n\u003cli>Есть два мира: code-first (пишем код — API получается) и \u003cstrong>API-First\u003c/strong> (сначала контракт OpenAPI, потом генерация)\u003c/li>\n\u003c/ul>\n\u003cp>Осталось собрать последний слой пазла: что происходит в сервисе и репозитории, причём тут Hibernate и Kafka — урок 5. А пока — первая настоящая кодовая практика.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","codeLang":"java","code":"@RestController\n@RequestMapping(\"/api/orders\")\npublic class OrderController {\n\n    @GetMapping(\"/{id}\")\n    public OrderResponse findById(@PathVariable Long id) { ... }\n}\n","question":"Какой запрос обработает метод findById?","options":["GET /api/orders/42","POST /api/orders/42","GET /api/orders?id=42","GET /findById/42"],"correct":0,"explanation":"Префикс класса + путь метода: /api/orders + /{id}. {id} — переменная кусок пути, её значение попадает в аргумент через @PathVariable. Метод задан @GetMapping — значит HTTP GET.","codeHtml":"\u003cspan class=\"hljs-meta\">@RestController\u003c/span>\n\u003cspan class=\"hljs-meta\">@RequestMapping(&quot;/api/orders&quot;)\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderController\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@GetMapping(&quot;/{id}&quot;)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderResponse\u003c/span> \u003cspan class=\"hljs-title function_\">findById\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@PathVariable\u003c/span> Long id)\u003c/span> { ... }\n}\n"},{"type":"single","question":"Метод контроллера помечен @RequestBody CreateProductRequest request. Что делает Spring с телом запроса?","options":["Распарсит JSON тела и соберёт из него объект CreateProductRequest","Передаст тело как сырую строку","Проигнорирует тело — оно недоступно в Spring","Сохранит тело сразу в базу данных"],"correct":0,"explanation":"@RequestBody = «тело запроса → объект»: Spring десериализует JSON в ваш класс. Если JSON не соответствует — клиент получит 400 Bad Request."},{"type":"multi","question":"Зачем API принимает и возвращает DTO, а не внутренние объекты приложения? (несколько ответов)","options":["API-контракт стабилен: внутренние refactor'ы не ломают клиентов","Не утекут внутренние и секретные поля (себестоимость, passwordHash)","DTO ускоряют запросы к базе данных","DTO обязательны по стандарту языка Java"],"correct":[0,1],"explanation":"DTO — про контракт и безопасность. Скорость базы они сами по себе не добавляют, и это не требование языка — это архитектурная привычка."},{"type":"match","question":"Сопоставь аннотацию и её роль.","pairs":[{"left":"@RestController","right":"Класс принимает HTTP и возвращает JSON"},{"left":"@RequestBody","right":"Тело запроса → Java-объект"},{"left":"@PathVariable","right":"Кусочек пути → аргумент метода"},{"left":"@ResponseStatus","right":"Статус-код успешного ответа"}]},{"type":"blank","question":"Какая аннотация Spring превращает обычный класс в REST-контроллер? Напиши её с собакой.","answers":["@RestController"],"explanation":"@RestController = @Controller + @ResponseBody: методы возвращают объекты, которые Spring сериализует в JSON."},{"type":"single","codeLang":"java","code":"@Mapper(componentModel = \"spring\")\npublic interface ProductMapper {\n    ProductResponse toResponse(Product product);\n}\n","question":"Что делает MapStruct с этим интерфейсом?","options":["Генерирует реализацию, которая перекладывает поля Product в поля ProductResponse","Ничего: интерфейс без реализации нерабочий, код упадёт при старте","Превращает ProductResponse в JSON в базе данных","Создаёт REST-endpoint /api/mapper"],"correct":0,"explanation":"MapStruct на этапе компиляции генерирует класс-реализацию с присваиванием одноимённых полей. Руками эти присваивания писать не нужно; отличия имён настраиваются аннотациями @Mapping.","codeHtml":"\u003cspan class=\"hljs-meta\">@Mapper(componentModel = &quot;spring&quot;)\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">ProductMapper\u003c/span> {\n    \u003cspan class=\"hljs-type\">ProductResponse\u003c/span> \u003cspan class=\"hljs-title function_\">toResponse\u003c/span>\u003cspan class=\"hljs-params\">(Product product)\u003c/span>;\n}\n"},{"type":"single","question":"Команда работает по API-First. Продакт просит новое поле в ответе заказа. С чего правильно начать?","options":["С правки контракта OpenAPI и согласования с потребителями API, потом генерация и код","С добавления поля в Java-класс ответа — контракт догонит потом","С изменения базы данных, остальное приложится","С письма фронтендерам: «поле уже есть, проверьте»"],"correct":0,"explanation":"API-First = контракт сначала: OpenAPI — источник правды. Сначала правим и согласуем специкацию с теми, кто API потребляет, затем генерируем/пишем код под неё. Добавить поле «сразу в класс» — путь code-first, он ломает саму идею договора."}]],"cases":[]},{"id":"lesson-05","title":"Слои приложения и Kafka","module":1,"moduleTitle":"Spring Boot: бэкенд с нуля","order":5,"lab":{"title":"Лаба 2. Финальный срез","description":"Полный срез своими руками: контроллер → сервис → репозиторий (H2). С автотестами: mvn test зелёный — лаба сдана. Решение — для сверки «как красиво».","branch":"lab-2","branchSolution":"lab-2-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 5. Слои приложения и Kafka\u003c/h1>\n\u003cp>Последний пазл пилота: как слои работают вместе, что именно делает Hibernate в репозитории, куда в этой картине встаивает Kafka — и как понять, что живой сервис жив.\u003c/p>\n\u003ch2>Сервисный слой: бизнес-сердце\u003c/h2>\n\u003cp>Всё «что можно и почём» — здесь:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Service\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> OrderRepository orderRepository;\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> OrderMapper orderMapper;\n\n    \u003cspan class=\"hljs-type\">public\u003c/span> \u003cspan class=\"hljs-title function_\">OrderService\u003c/span>\u003cspan class=\"hljs-params\">(OrderRepository orderRepository, OrderMapper orderMapper)\u003c/span> {\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.orderRepository = orderRepository;\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.orderMapper = orderMapper;\n    }\n\n    \u003cspan class=\"hljs-meta\">@Transactional\u003c/span>                       \u003cspan class=\"hljs-comment\">// метод = транзакция: всё или ничего\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderResponse\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest request)\u003c/span> {\n        \u003cspan class=\"hljs-keyword\">if\u003c/span> (request.items().isEmpty())                       \u003cspan class=\"hljs-comment\">// бизнес-правило\u003c/span>\n            \u003cspan class=\"hljs-keyword\">throw\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">EmptyOrderException\u003c/span>();\n\n        \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderMapper.toEntity(request);\n        order.setStatus(\u003cspan class=\"hljs-string\">&quot;NEW&quot;\u003c/span>);\n        \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">saved\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderRepository.save(order);           \u003cspan class=\"hljs-comment\">// в базу\u003c/span>\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> orderMapper.toResponse(saved);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>@Transactional\u003c/code> — «всё или ничего»: если после сохранения заказа что-то упадёт, база останется как была. Половинчатых заказов не бывает.\u003c/p>\n\u003ch2>Репозиторий и Hibernate: база без SQL\u003c/h2>\n\u003cp>Самая большая магия Spring Data. Репозиторий — просто интерфейс:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">OrderRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Order, Long&gt; {\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Order&gt; \u003cspan class=\"hljs-title function_\">findByCustomerIdAndStatus\u003c/span>\u003cspan class=\"hljs-params\">(Long customerId, String status)\u003c/span>;\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>JpaRepository\u003c/code> дарит готовые \u003ccode>save\u003c/code>, \u003ccode>findById\u003c/code>, \u003ccode>deleteById\u003c/code> и умеет \u003cstrong>сам генерировать SQL по имени метода\u003
