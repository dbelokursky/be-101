бе откатятся","Зависит от уровня READ UNCOMMITTED"],"correct":0,"explanation":"READ COMMITTED не сериализует «прочитал-проверил-записал». Нужны SELECT FOR UPDATE, @Version или атомарный UPDATE с WHERE qty > 0."},{"type":"match","topic":"m3-lesson-04","question":"Сопоставьте инструмент борьбы с гонкой и его поведение.","pairs":[{"left":"PESSIMISTIC_WRITE","right":"Строка блокируется: конкурент ждёт освобождения"},{"left":"@Version (оптимистичная)","right":"Конфликт ловится при UPDATE: исключение и повтор"},{"left":"Атомарный UPDATE с условием","right":"База сама решает: обновилось 0 строк — не вышло"},{"left":"Thread.sleep перед записью","right":"Не решение: гонка остаётся"}]},{"type":"single","topic":"m3-lesson-04","question":"Метод @Transactional сделал UPDATE и выбросил NullPointerException. Что в базе?","options":["Ничего: RuntimeException → откат транзакции","UPDATE останется: коммит уже прошёл","UPDATE останется наполовину","База заблокируется"],"correct":0,"explanation":"Атомарность: unchecked-исключение откатывает всё, что сделано в методе. Для checked по умолчанию — коммит (вопрос из урока 4)."},{"type":"multi","topic":"m3-lesson-05","question":"Что верно про changeset'ы Liquibase? (несколько ответов)","options":["Применённый changeset нельзя редактировать: чек-сумма в DATABASECHANGELOG не совпадёт","Новое изменение схемы = новый changeset","Changeset можно безопасно править сколько угодно после применения","Changeset применяется один раз — это гарантирует таблица changelog"],"correct":[0,1,3],"explanation":"Редактирование применённого changeset'а — способ уронить старт приложения на проде. История неизменна, изменения только добавляются."},{"type":"single","topic":"m3-lesson-05","question":"Безопасный способ убрать колонку, которую ещё читает работающий код?","options":["Expand-contract: сначала новый вариант схемы и запись в оба места, потом выкатка кода без старой колонки, потом удаление","Удалить сразу: если упадёт — вернём откатом","Переименовать колонку: rename безопаснее delete","Отключить приложение на время удаления"],"correct":0,"explanation":"Окно несовместимости должно быть пустым. «Упадёт — откатим» на проде с данными — не стратегия, а инцидент."},{"type":"single","topic":"m3-lesson-05","question":"Что делает ddl-auto: validate в связке с Liquibase?","options":["Проверяет соответствие entity схеме при старте: расхождение — приложение не поднимется","Создаёт схему по entity","Удаляет схему перед стартом","Ничего: это синоним для none"],"correct":0,"explanation":"Схемой управляет Liquibase, а validate ловит расхождение между кодом и базой на старте — ранняя, громкая ошибка вместо тихого рантайма."},{"type":"blank","topic":"m3-lesson-05","question":"Как называется подход к интеграционным тестам, поднимающий настоящую PostgreSQL в Docker? (одно слово, имя инструмента)","answers":["Testcontainers","testcontainers"],"explanation":"Testcontainers: контейнер с реальной СУБД на время теста. Диалект, индексы, блокировки и миграции — как в проде."},{"type":"single","topic":"m3-lesson-03","question":"Итог модуля. Отчёт «проекты с числом открытых задач» на проде тормозит, в логах сотни SELECT'ов по project_id. Ваш первый шаг?","options":["Посчитать в базе: агрегат-проекция с GROUP BY вместо загрузки задач в Java; при загрузке списков — EntityGraph/JOIN FETCH","Добавить памяти приложению","Поднять пул соединений с базой","Вынести отчёт в отдельный микросервис"],"correct":0,"explanation":"Сотни однотипных SELECT'ов = N+1. Лечение — из урока 3: агрегация в базе или догрузка связей одним запросом. Инфраструктурные костыли проблему не убирают."}]],"cases":[{"title":"Спроектируйте схему данных для бронирования переговорок","task":"Та же предметная область, что в кейсе модуля 2, но теперь — изнутри: спроектируйте СХЕМУ БАЗЫ. Известно: переговорки (номер/имя, вместимость, проектор), сотрудники (логин), брони (комната, кто, интервал времени, статус). Подумайте: какие таблицы и связи (один-ко-многим/многие-ко-многим)? Где первичные и внешние ключи? Какой индекс поставите под запрос «свободные слоты комнаты на день»? Как на уровне БД не дать двойного бронирования? Опишите таблицами: имя → колонки (имя, тип, ограничения) → связи. Форма свободная.","placeholder":"Например:\nrooms: id PK, name, capacity...\nbookings: id PK, room_id FK, ...","referenceHtml":"\u003cp>Один из возможных ответов.\u003c/p>\n\u003ch2>Таблицы\u003c/h2>\n\u003cp>\u003cstrong>rooms\u003c/strong>: \u003ccode>id BIGINT PK\u003c/code>, \u003ccode>name VARCHAR(100) NOT NULL\u003c/code>, \u003ccode>capacity INT NOT NULL CHECK (capacity &gt; 0)\u003c/code>, \u003ccode>projector BOOLEAN NOT NULL DEFAULT false\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>employees\u003c/strong>: \u003ccode>id BIGINT PK\u003c/code>, \u003ccode>login VARCHAR(50) NOT NULL UNIQUE\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>bookings\u003c/strong>: \u003ccode>id BIGINT PK\u003c/code>, \u003ccode>room_id BIGINT NOT NULL FK → rooms.id\u003c/code>,\n\u003ccode>employee_id BIGINT NOT NULL FK → employees.id\u003c/code>,\n\u003ccode>starts_at TIMESTAMP NOT NULL\u003c/code>, \u003ccode>ends_at TIMESTAMP NOT NULL\u003c/code>,\n\u003ccode>status VARCHAR(20) NOT NULL DEFAULT 'ACTIVE'\u003c/code> (ACTIVE/CANCELLED),\n\u003ccode>CHECK (starts_at &lt; ends_at)\u003c/code>\u003c/p>\n\u003ch2>Связи\u003c/h2>\n\u003cul>\n\u003cli>rooms → bookings: один-ко-многим (FK на стороне броней — их много на комнату)\u003c/li>\n\u003cli>employees → bookings: один-ко-многим (FK у броней)\u003c/li>\n\u003cli>Многие-ко-многим (участники встречи): при необходимости \u003ccode>booking_attendees(booking_id FK, employee_id FK)\u003c/code> с составным PK\u003c/li>\n\u003c/ul>\n\u003ch2>Индексы\u003c/h2>\n\u003cpre>\u003ccode>CREATE INDEX idx_bookings_room_time ON bookings (room_id, starts_at);\n-- запрос «слоты комнаты на день» = WHERE room_id = ? AND starts_at &lt; конец дня AND ends_at &gt; начало дня\n\u003c/code>\u003c/pre>\n\u003cp>Индекс по паре (room_id, starts_at) закрывает горячий запрос поиска пересечений.\u003c/p>\n\u003ch2>Защита от двойного бронирования\u003c/h2>\n\u003cp>Вариант 1 — исключающее ограничение (PostgreSQL):\u003c/p>\n\u003cpre>\u003ccode>ALTER TABLE bookings ADD CONSTRAINT excl_no_overlap\n  EXCLUDE USING gist (\n    room_id WITH =, tsrange(starts_at, ends_at) WITH &amp;&amp;\n  ) WHERE (status = 'ACTIVE');\n\u003c/code>\u003c/pre>\n\u003cp>База сама отклонит пересекающиеся активные брони → приложению остаётся отдать 409.\u003c/p>\n\u003cp>Вариант 2 — без EXCLUDE: \u003ccode>SELECT ... FOR UPDATE\u003c/code> по комнате в транзакции + проверка пересечений перед INSERT (пессимистичная блокировка из урока 4).\u003c/p>\n\u003ch2>Связь с контрактом API\u003c/h2>\n\u003cp>Схема — не копия DTO из кейса модуля 2: API отдаёт Booking с bookedBy (логин), а в базе — employee_id FK. Маппинг между ними — MapStruct-маппер. Контракт — для потребителей, схема — для целостности.\u003c/p>\n"}]},{"id":"m3-cheatsheet","title":"Шпаргалка модуля","module":3,"moduleTitle":"Данные","order":7,"baseOrder":null,"lab":null,"html":"\u003ch1>Шпаргалка: Данные\u003c/h1>\n\u003ch2>SQL одним взглядом\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> id, title \u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> \u003cspan class=\"hljs-keyword\">ORDER\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> deadline;\n\u003cspan class=\"hljs-keyword\">INSERT INTO\u003c/span> tasks (project_id, title) \u003cspan class=\"hljs-keyword\">VALUES\u003c/span> (\u003cspan class=\"hljs-number\">7\u003c/span>, \u003cspan class=\"hljs-string\">&#x27;Молоко&#x27;\u003c/span>);\n\u003cspan class=\"hljs-keyword\">UPDATE\u003c/span> tasks \u003cspan class=\"hljs-keyword\">SET\u003c/span> done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span> \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>;\n\u003cspan class=\"hljs-keyword\">DELETE\u003c/span> \u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>;\n\n\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name, \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks t\n\u003cspan class=\"hljs-keyword\">JOIN\u003c/span> projects p \u003cspan class=\"hljs-keyword\">ON\u003c/span> p.id \u003cspan class=\"hljs-operator\">=\u003c/span> t.project_id\n\u003cspan class=\"hljs-keyword\">GROUP\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> p.name \u003cspan class=\"hljs-keyword\">HAVING\u003c/span> \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-operator\">&gt;\u003c/span> \u003cspan class=\"hljs-number\">5\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>PK — идентичность строки; FK — связь + ссылочная целостность\u003c/li>\n\u003cli>Многие-ко-многим → таблица-связка \u003ccode>task_assignees(task_id, user_id)\u003c/code>\u003c/li>\n\u003cli>Нет индекса по колонке поиска → полный перебор → «на проде медленно»\u003c/li>\n\u003c/ul>\n\u003ch2>JPA: аннотации связей\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@ManyToOne(fetch = LAZY)\u003c/span> \u003cspan class=\"hljs-meta\">@JoinColumn(name = &quot;project_id&quot;)\u003c/span>  \u003cspan class=\"hljs-comment\">// ВЛАДЕЛЕЦ (там FK)\u003c/span>\n\u003cspan class=\"hljs-meta\">@OneToMany(mappedBy = &quot;project&quot;, cascade = ALL, orphanRemoval = true)\u003c/span> \u003cspan class=\"hljs-comment\">// зеркало\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Всегда \u003ccode>LAZY\u003c/code> на \u003ccode>@ManyToOne\u003c/code> (дефолт EAGER — ловушка)\u003c/li>\n\u003cli>Dirty checking: изменение managed-entity в транзакции = сам станет UPDATE\u003c/li>\n\u003cli>Ленивая связь вне транзакции → \u003ccode>LazyInitializationException\u003c/code>\u003c/li>\n\u003c/ul>\n\u003ch2>N+1\u003c/h2>\n\u003cp>Симптом: 1 + N однотипных SELECT'ов, время растёт с данными.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Средство\u003c/th>\n\u003cth>Как\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>@Query(&quot;... join fetch p.tasks&quot;)\u003c/code>\u003c/td>\n\u003ctd>один SQL со связью\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@EntityGraph(attributePaths = &quot;tasks&quot;)\u003c/code>\u003c/td>\n\u003ctd>то же, декларативно\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>hibernate.default_batch_fetch_size=16\u003c/code>\u003c/td>\n\u003ctd>пачки \u003ccode>IN (...)\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Агрегат в базе\u003c/td>\n\u003ctd>\u003ccode>count(t)\u003c/code> вместо \u003ccode>getSize()\u003c/code> по загруженным\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Пагинация — только \u003ccode>Pageable\u003c/code> (LIMIT/OFFSET в SQL).\u003c/p>\n\u003ch2>Транзакции\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>@Transactional\u003c/code>: границы = метод; \u003cstrong>публичный\u003c/strong> вызов через прокси (внутренний \u003ccode>this.\u003c/code> не работает!)\u003c/li>\n\u003cli>unchecked → откат; checked → по умолчанию коммит (\u003ccode>rollbackFor\u003c/code>)\u003c/li>\n\u003cli>Гонки: \u003ccode>SELECT FOR UPDATE\u003c/code> (ждать) / \u003ccode>@Version\u003c/code> (повторить) / атомарный \u003ccode>UPDATE ... WHERE qty &gt; 0\u003c/code>\u003c/li>\n\u003cli>READ COMMITTED (дефолт PG) от гонок чтение-запись не спасает\u003c/li>\n\u003c/ul>\n\u003ch2>Миграции Liquibase\u003c/h2>\n\u003cul>\n\u003cli>Схему прода ведут changeset'ы; применённый — не редактировать (чек-сумма)\u003c/li>\n\u003cli>Опасное удаление — expand → contract\u003c/li>\n\u003cli>\u003ccode>ddl-auto: validate\u003c/code> + Liquibase: разошлись entity и схема → не стартует (так и надо)\u003c/li>\n\u003cli>Честные тесты — Testcontainers (настоящий Postgres), H2 — для быстрых лаб\u003c/li>\n\u003c/ul>\n","quizzes":[],"cases":[]},{"id":"m4-lesson-01","title":"Зачем брокер: асинхронный мир","module":4,"moduleTitle":"Kafka вглубь","order":1,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 1. Зачем брокер: асинхронный мир\u003c/h1>\n\u003cp>В пилоте Kafka мелькнула одной картинкой: «сделал дело — опубликовал событие». Теперь — вглубь: как брокер устроен, кто такие партиции и офсеты, почему сообщения не теряются (и когда теряются), и какие паттерны делают асинхронность надёжной. Начнём с мотивации.\u003c/p>\n\u003ch2>Что не так с прямыми вызовами\u003c/h2>\n\u003cp>Сервис заказов должен уведомить о новом заказе: письма, аналитику, поиск. Прямое решение — вызвать всех по HTTP из транзакции создания заказа:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart TD\n    O[&quot;order-service&quot;] --&gt;|&quot;HTTP&quot;| M[&quot;mail-service&quot;]\n    O --&gt;|&quot;HTTP&quot;| A[&quot;analytics&quot;]\n    O --&gt;|&quot;HTTP&quot;| S[&quot;search-indexer&quot;]\n    M -.-&gt;|&quot;упал — заказ не создался?&quot;| O\n    A -.-&gt;|&quot;медленный — заказ создаётся 5 секунд&quot;| O\u003c/div>\u003cp>Проблемы нарастают как снежный ком:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Связанность\u003c/strong>: заказ знает про всех потребителей и их адреса; новый подписчик = правка заказa\u003c/li>\n\u003cli>\u003cstrong>Каскадные сбои\u003c/strong>: почтовый лежит — заказы не оформляются\u003c/li>\n\u003cli>\u003cstrong>Задержка\u003c/strong>: клиент ждёт самого медленного\u003c/li>\n\u003cli>\u003cstrong>Потеряные события\u003c/strong>: сервис analytics перезапускают — что случилось в этот момент, никто не узнает\u003c/li>\n\u003c/ul>\n\u003ch2>Событие и брокер\u003c/h2>\n\u003cp>Меняем модель: заказ-сервис \u003cstrong>публикует факт\u003c/strong> — «заказ создан» — в именованный канал (\u003cstrong>topic\u003c/strong>), не зная, кто читает. Потребители \u003cstrong>подписаны\u003c/strong> и читают в своём темпе. Между ними — \u003cstrong>брокер\u003c/strong> (Kafka): принимает, хранит, раздаёт.\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    O[&quot;order-service&lt;br/&gt;(продюсер)&quot;] --&gt; T[&quot;topic: orders.created&quot;]\n    T --&gt; M[&quot;mail-service&quot;]\n    T --&gt; A[&quot;analytics&quot;]\n    T --&gt; S[&quot;search-indexer&quot;]\u003c/div>\u003cp>Что это меняет по сравнению с прямым вызовом:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Прямые HTTP-вызовы\u003c/th>\n\u003cth>Через брокер\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Кто кого знает\u003c/td>\n\u003ctd>Заказ знает всех\u003c/td>\n\u003ctd>Никто никого не знает, только topic\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Потребитель лежит\u003c/td>\n\u003ctd>Отравитель звонков страдает\u003c/td>\n\u003ctd>События копятся, догонит после старта\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Добавить потребителя\u003c/td>\n\u003ctd>Правка кода заказa\u003c/td>\n\u003ctd>Подписаться на topic — код не меняется\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Темп\u003c/td>\n\u003ctd>Синхронно, ждём всех\u003c/td>\n\u003ctd>Каждый читает со своей скоростью\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>История\u003c/td>\n\u003ctd>Нет (мимо = потеряно)\u003c/td>\n\u003ctd>Kafka хранит события: можно перечитать\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Важно понимать смену смысла: HTTP-вызов — это \u003cstrong>команда\u003c/strong> («отправь письмо»), событие — это \u003cstrong>факт\u003c/strong> («заказ создан»). Событие уже случилось и не может «не отправиться» из-за чьего-то сбоя.\u003c/p>\n\u003ch2>Доставка: at-least-once и последствия\u003c/h2>\n\u003cp>Сетей без потерь не бывает, поэтому Kafka по умолчанию гарантирует \u003cstrong>at-least-once\u003c/strong>: сообщение доставится \u003cstrong>хотя бы один раз\u003c/strong> — а значит, иногда \u003cstrong>дважды\u003c/strong> (ретрай после неуверенного таймаута).\u003c/p>\n\u003cp>Следствие — главное правило асинхронного мира:\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Консюмер должен быть идемпотентным\u003c/strong>: повторная обработка того же события не должна создавать дубль.\u003c/p>\n\u003c/blockquote>\n\u003cp>«Отправить письмо повторно» — терпимо. «Начислить бонус повторно» — нет: обработчик проверяет, не обработал ли он уже это событие (по id), прежде чем действовать. Это тема урока 5, но помните о ней с первой минуты.\u003c/p>\n\u003ch2>События в коде: как это выглядит\u003c/h2>\n\u003cp>Публикация в Spring — одна строка (продюсер):\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Service\u003c/span>\n\u003cspan class=\"hljs-meta\">@RequiredArgsConstructor\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> KafkaTemplate&lt;String, OrderCreatedEvent&gt; kafkaTemplate;\n\n    \u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderResponse\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest request)\u003c/span> {\n        \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-comment\">/* создать и сохранить */\u003c/span>;\n        kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>,\n                String.valueOf(order.getId()),\n                \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(order.getId(), order.getAmount()));\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> toResponse(order);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Чтение — листенер (консюмер), его напишет подписчик:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@KafkaListener(topics = &quot;orders.created&quot;, groupId = &quot;mail-service&quot;)\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">onOrderCreated\u003c/span>\u003cspan class=\"hljs-params\">(OrderCreatedEvent event)\u003c/span> {\n    mailService.sendOrderConfirmation(event.orderId());\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>groupId\u003c/code> — «кто я такой»: все инстансы mail-service в одной группе делят работу между собой. Как именно — урок 3.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> pub/sub вы видели в шинах событий (EventBus, Redux). Kafka — то же, но события персистентны: подписчик может «перемыть» историю. \u003ccode>groupId\u003c/code> ≈ имя подписчика: один и тот же обработчик в нескольких вкладках не должен получать копию события.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> асинхронность меняет тестирование: проверка «нажал кнопку — пришло письмо» больше не транзакция, а цепочка с задержкой. Тестируйте событие как отдельный контракт: опубликовали \u003ccode>orders.created\u003c/code> — слушатели обязаны отработать; и обязательно — повторную доставку (at-least-once!).\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> событие — первичный факт предметной области: «заказ создан», «платёж прошёл». Продуктовая аналитика в реальном времени строится именно на потоке событий, а не на ночных выгрузках таблиц. Вы помогаете называть события так, чтобы они были понятны через год.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Прямые вызовы связывают сервисы и каскадируют сбои; брокер развязывает их по времени и знанию\u003c/li>\n\u003cli>Событие — факт, уже случившийся; команда — просьба что-то сделать; Kafka про факты\u003c/li>\n\u003cli>Kafka хранит события: потребители читают в своём темпе, могут перечитать\u003c/li>\n\u003cli>Гарантия доставки — at-least-once: повторы возможны, консюмер обязан быть идемпотентным\u003c/li>\n\u003cli>В Spring: \u003ccode>kafkaTemplate.send(topic, key, event)\u003c/code> и \u003ccode>@KafkaListener(topics, groupId)\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>Дальше — внутрь брокера: топики, партиции и почему порядок сообщений связан с ключами.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Заказ-сервис синхронно вызывает почтовый, аналитику и индексатор поиска. Почтовый упал. Что происходит с оформлением заказов?","options":["Зависит от обработки ошибок: либо заказ падает вместе с почтой, либо письмо теряется — обе стороны плохи","Ничего: вызовы независимы","Kafka доставит письмо позже","Заказ всегда создаётся, письма накапливаются в базе"],"correct":0,"explanation":"Синхронная цепочка без запасного пути: либо транзакция падает (клиент страдает), либо событие теряется (молча). Брокер разрубает эту развилку: событие фиксируется и ждёт подписчика."},{"type":"single","question":"Чем событие «orders.created» принципиально отличается от команды «sendOrderEmail»?","options":["Событие — уже случившийся факт, издатель не знает и не ждёт обработчиков; команда — просьба что-то сделать конкретному исполнителю","Ничем: это синонимы","События пишутся только в базу","Команды нельзя отправлять в Kafka"],"correct":0,"explanation":"Факт не может «не удаться» и не адресован никому. Из этого растёт вся развязка: новые подписчики без правок издателя, независимые темпы, перечитывание."},{"type":"multi","question":"Что даёт переход на брокер? (несколько ответов)","options":["Новый потребитель подписывается без правок издателя","Упавший потребитель догоняет пропущенное после перезапуска","Гарантия exactly-once из коробки без усилий","Издатель не ждёт самых медленных подписчиков"],"correct":[0,1,3],"explanation":"Exactly-once из коробки не бывает: at-least-once + идемпотентность обработчика — вот реальный контракт."},{"type":"blank","question":"Как называется гарантия доставки «хотя бы один раз, возможны повторы»? (формат: at-…-once)","answers":["at-least-once","at least once"],"explanation":"At-least-once. Повторы — норма, поэтому консюмер проектируют идемпотентным."},{"type":"match","question":"Сопоставьте понятие и роль.","pairs":[{"left":"Topic","right":"Именованный канал событий"},{"left":"Продюсер","right":"Публикует события в topic"},{"left":"Консюмер","right":"Подписан и читает события"},{"left":"groupId","right":"Имя группы: её инстансы делят чтение между собой"}]},{"type":"single","question":"Консюмер начисляет бонус за регистрацию, слушая user.registered. Событие пришло дважды (at-least-once). Что нужно в обработчике?","options":["Идемпотентность: проверить по id события, не начислен ли уже бонус, и только тогда действовать","Ничего: повторы игнорируются брокером автоматически","Переключить Kafka на exactly-once","Отправить письмо дважды — так задумано"],"correct":0,"explanation":"Повторы — свойство доставки, а не чья-то ошибка. Обработчик обязан быть безопасным к повтору: уникальный ключ, проверка «уже сделано», транзакция с идемпотентной записью."},{"type":"single","question":"Продакт хочет новое событие «заказ доставлен» для пуш-уведомлений и обновления аналитики. Что меняется в сервисе заказов?","options":["Ничего: заказ уже публикует orders.delivered — подписчики просто слушают новый для них topic","Заказ-сервис получает адреса всех подписчиков","Нужны отдельные HTTP-ручки для пушей и аналитики","Заказы перестают создавать события"],"correct":0,"explanation":"Смысл развязки: издатель публикует факты, потребители приходят и уходят сами. Правка — только если самого факта ещё нет."}]],"cases":[]},{"id":"m4-order-events","title":"Отмена заказа и повтор события","module":4,"moduleTitle":"Kafka вглубь","order":1.5,"baseOrder":8,"lab":null,"html":"\u003ch1>Отмена заказа и повтор события\u003c/h1>\n\u003cp>В срезе на \u003ccode>11:59:53Z\u003c/code> заказ \u003ccode>42\u003c/code> уже отменён. Уведомление об отмене создаётся отдельным обработчиком. Посмотри, когда он получил событие и что произошло после перезапуска.\u003c/p>\n\u003ch2>Сообщение в Kafka\u003c/h2>\n\u003cp>В учебном журнале все отметки относятся к 16 января и указаны в UTC. Брокер получил одно сообщение об отмене.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">11:59:52.410Z append topic=orders.cancelled partition=1 offset=803 key=42\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;eventId&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;evt-order-42-cancel&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;orderId&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;occurredAt&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;2026-01-16T11:59:52.180Z&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\n  \u003cspan class=\"hljs-attr\">&quot;type&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span> \u003cspan class=\"hljs-string\">&quot;orders.cancelled&quot;\u003c/span>\n\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Ключ \u003ccode>42\u003c/code> помогает направить события заказа в одну партицию. \u003ccode>eventId\u003c/code> обозначает логическое событие. По \u003ccode>partition\u003c/code> и \u003ccode>offset\u003c/code> можно найти конкретную запись в топике.\u003c/p>\n\u003ch2>Журнал обработчика\u003c/h2>\n\u003cp>К \u003ccode>11:59:55Z\u003c/code> в таблице \u003ccode>notifications\u003c/code> ещё нет записи по событию. Позже обработчик читает сообщение и фиксирует результат в БД. После сбоя Kafka отдаёт ему ту же запись повторно.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">11:59:57.010Z received   eventId=evt-order-42-cancel orderId=42 partition=1 offset=803\n11:59:57.060Z committed notificationId=notice-42 eventId=evt-order-42-cancel\n11:59:57.074Z stopped   nextOffset=803\n12:00:01.300Z received   eventId=evt-order-42-cancel orderId=42 partition=1 offset=803\n12:00:01.310Z duplicate eventId=evt-order-42-cancel notificationId=notice-42\n12:00:01.320Z offset_commit partition=1 nextOffset=804\n\u003c/code>\u003c/pre>\n\u003cp>Группа хранила \u003ccode>803\u003c/code> как позицию следующего чтения. После остановки новый экземпляр снова прочитал запись \u003ccode>803\u003c/code>. Сохранённый результат с тем же \u003ccode>eventId\u003c/code> позволил завершить обработку, сохранив одну строку \u003ccode>notice-42\u003c/code>. Проверка эффекта ищет строку в \u003ccode>notifications\u003c/code> по \u003ccode>event_id = 'evt-order-42-cancel'\u003c/code>.\u003c/p>\n\u003cp>Возврат бонусов входит в транзакцию отмены. Обработчик уведомлений делает свою работу позже. Статус заказа, запись возврата и уведомление можно проверить по отдельности.\u003c/p>\n\u003ch2>Дополнительная практика в Java\u003c/h2>\n\u003cp>В \u003ca href=\"https://github.com/dbelokursky/be-101/tree/lab-6-solution\">эталоне лабы 6\u003c/a> добавь метод ниже в \u003ccode>Lab6KafkaTest\u003c/code> и запусти \u003ccode>mvn test\u003c/code>. В этой лабе учебный потребитель складывает входящие события \u003ccode>orders.created\u003c/code> в список.\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Test\u003c/span>\n\u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">repeatedPayloadReachesConsumerTwice\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> \u003cspan class=\"hljs-keyword\">throws\u003c/span> Exception {\n    consumer.clear();\n    \u003cspan class=\"hljs-type\">OrderCreatedEvent\u003c/span> \u003cspan class=\"hljs-variable\">event\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(\u003cspan class=\"hljs-number\">42L\u003c/span>, \u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>, BigDecimal.ONE);\n\n    \u003cspan class=\"hljs-type\">var\u003c/span> \u003cspan class=\"hljs-variable\">first\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;42&quot;\u003c/span>, event).get().getRecordMetadata();\n    \u003cspan class=\"hljs-type\">var\u003c/span> \u003cspan class=\"hljs-variable\">second\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;42&quot;\u003c/span>, event).get().getRecordMetadata();\n\n    await(() -&gt; consumer.received().size() == \u003cspan class=\"hljs-number\">2\u003c/span>);\n    assertEquals(java.util.List.of(event, event), consumer.received());\n    assertEquals(first.partition(), second.partition());\n    assertEquals(first.offset() + \u003cspan class=\"hljs-number\">1\u003c/span>, second.offset());\n}\n\u003c/code>\u003c/pre>\n\u003cp>Две публикации одинакового содержимого получают разные offset. В журнале отмены обработчик перечитал один offset. В обоих случаях обработчик может получить один логический факт дважды.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"В 11:59:55Z уведомления для заказа 42 ещё нет. По каким данным проверить, отменён ли заказ?","options":["По статусу заказа и записи возврата в БД","По числу строк в таблице notifications","По зафиксированному offset группы уведомлений","По числу повторных попыток прочитать событие"],"correct":0,"explanation":"К этому времени отмена и возврат уже есть в БД. Уведомление обрабатывается отдельным сервисом."},{"type":"single","question":"Какое наблюдение в журнале показывает повторное чтение той же записи Kafka?","options":["Совпадают партиция, offset и eventId у двух строк received","Совпадает только orderId у двух строк received","Следующая позиция после обработки стала 804","У следующих сообщений разные ключи"],"correct":0,"explanation":"Пара partition и offset указывает на запись в топике. Одинаковый eventId связывает обе попытки с одним бизнес-событием."},{"type":"single","question":"Чем проверить, сколько уведомлений было создано для evt-order-42-cancel?","options":["Посчитать сохранённые строки notifications по event_id","Посчитать строки received в журнале консюмера","Вычесть предыдущий offset из следующего","Посчитать все записи возврата бонусов"],"correct":0,"explanation":"Две строки received показывают число доставок. Одна сохранённая строка notice-42 показывает эффект обработчика."},{"type":"single","question":"У двух сообщений один orderId и разные eventId. Можно ли по ключу заказа объявить второе сообщение повтором?","options":["Для вывода нужен идентификатор логического события. У заказа могут происходить разные события","Да, ключ заказа единственный для всех его бизнес-событий","Да, достаточно одинаковой партиции","Нет, нужно удалить offset группы"],"correct":0,"explanation":"Ключ определяет маршрутизацию сообщения. В этом сценарии обработчик отслеживает повторы по eventId."},{"type":"match","question":"Свяжи наблюдение с тем, что оно подтверждает.","pairs":[{"left":"orders.status = CANCELLED","right":"Транзакция отмены сохранила состояние заказа"},{"left":"refund-42","right":"В журнале бонусов есть возврат по отмене"},{"left":"notice-42","right":"Обработчик создал запись уведомления"}],"explanation":"Каждая запись свидетельствует о своём этапе. Для проверки всего сценария собирают несколько источников по одному заказу."}]],"cases":[]},{"id":"m4-lesson-02","title":"Топики, партиции, офсеты","module":4,"moduleTitle":"Kafka вглубь","order":2,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 2. Топики, партиции, офсеты\u003c/h1>\n\u003cp>Kafka часто называют «большим логом» — и это самое точное описание. Разберём физическое устройство: во что пишутся события, как брокер хранит годы истории и почему порядок сообщений — не то, чем кажется.\u003c/p>\n\u003ch2>Topic: лог с именем\u003c/h2>\n\u003cp>\u003cstrong>Topic\u003c/strong> — не «очередь», а \u003cstrong>журнал (лог)\u003c/strong>: события дописываются в конец и хранятся, а не удаляются после прочтения. Прочитали — просто запомнили, докуда.\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    P[&quot;продюсеры&quot;] --&gt; T\n    subgraph T[&quot;topic: orders.created&quot;]\n        direction LR\n        L[&quot;e₁ e₂ e₃ e₄ e₅ …дописывается в конец&quot;]\n    end\n    T --&gt; C1[&quot;консюмер A&lt;br/&gt;(читает с 3)&quot;]\n    T --&gt; C2[&quot;консюмер B&lt;br/&gt;(перечитывает с 1)&quot;]\u003c/div>\u003cp>Отсюда суперсила Kafka: два консюмера читают \u003cstrong>один и тот же\u003c/strong> topic с разных позиций и в разном темпе — данные не исчезают после первого прочтения. \u003cstrong>Retention\u003c/strong> (сколько хранить) настраивается на topic: часы, дни, годы — или «пока не кончится место».\u003c/p>\n\u003ch2>Partition: параллельный лог\u003c/h2>\n\u003cp>Topic разбит на \u003cstrong>партиции\u003c/strong> — независимые логи на разных брокерах:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">topic: orders.created\n├── partition 0:  e₁  e₄  e₅  e₈   ← ключ K1\n├── partition 1:  e₂  e₃  e₆       ← ключ K2\n└── partition 2:  e₇  e₉           ← ключ K3\n\u003c/code>\u003c/pre>\n\u003cp>Партиции дают две вещи:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Масштаб записи и чтения\u003c/strong>: разные партиции живут на разных брокерах; разные консюмеры группы читают разные партиции параллельно\u003c/li>\n\u003cli>\u003cstrong>Порядок внутри партиции\u003c/strong>: события одного ключа — всегда в порядке записи\u003c/li>\n\u003c/ol>\n\u003ch2>Ключ и правило порядка\u003c/h2>\n\u003cp>Сообщение может иметь \u003cstrong>ключ\u003c/strong>. Одинаковый ключ → всегда одна и та же партиция (хэш ключа). Отсюда главное правило порядка в Kafka:\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Гарантия порядка — только внутри партиции.\u003c/strong> Хотите «события заказа 42 идут по порядку» — публикуйте их с ключом \u003ccode>&quot;42&quot;\u003c/code>, и они лягут в одну партицию друг за другом.\u003c/p>\n\u003c/blockquote>\n\u003cp>Без ключа события_ROUND_ROBIN'ятся по партициям — глобального порядка нет вовсе. Это не баг: для независимых событий порядок и не нужен.\u003c/p>\n\u003cp>Практика именования: \u003ccode>topic\u003c/code> — множественное число фактов (\u003ccode>orders.created\u003c/code>), ключ — идентичность сущности (\u003ccode>orderId\u003c/code>). Один заказ = один ключ = строгий порядок его событий.\u003c/p>\n\u003ch2>Offset: закладка читателя\u003c/h2>\n\u003cp>\u003cstrong>Offset\u003c/strong> — номер события в партиции (0, 1, 2…). Позиция консюмера — это offset, и он принадлежит \u003cstrong>группе\u003c/strong> (groupId), а не отдельному процессу:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">offset:        0   1   2   3   4   5\npartition 0:  e₁  e₂  e₃  e₄  e₅  e₆\n                               ↑\n        группа mail-service зафиксировала offset = 4\n        следующее чтение начнётся с e₅\n\u003c/code>\u003c/pre>\n\u003cp>Зафиксированный offset указывает позицию следующего чтения. Так, после успешной обработки записи с offset \u003ccode>3\u003c/code> группа может сохранить \u003ccode>4\u003c/code>. \u003ca href=\"https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/consumer/KafkaConsumer.html\">Документация KafkaConsumer\u003c/a>\u003c/p>\n\u003cp>Кто что читает — хранит сам Kafka (offsets topic). Поэтому:\u003c/p>\n\u003cul>\n\u003cli>инстанс упал → поднялся → продолжает с зафиксированного offset'а своей группы;\u003c/li>\n\u003cli>новая группа с нуля → прочитает \u003cstrong>всю историю\u003c/strong> topic'а (или с \u003ccode>earliest/latest\u003c/code> — как настроите);\u003c/li>\n\u003cli>группу удалили → её offsets потеряны → новая с тем же именем начнёт по правилам «старта».\u003c/li>\n\u003c/ul>\n\u003cp>Коммит offset'а — момент истины: \u003cstrong>закомитили после обработки\u003c/strong> — потеряете при сбое минимум; закомитили до — рискуете потерять само событие. Подробно — в уроке 4.\u003c/p>\n\u003ch2>Сколько партиций нужно\u003c/h2>\n\u003cp>Партиции — единица параллелизма: в группе не больше активных консюмеров, чем партиций topic'а (лишние сидят без работы). Мало партиций — узкое место чтения; много — дольше старт, больше файлов и запросов у брокера. Стартуют обычно с запасом (например, 6–12 для горячего topic'а), потому что \u003cstrong>увеличить можно, а уменьшить — нельзя\u003c/strong> (только пересозданием topic'а).\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> «дубликаты» и «пропуски» в асинхронных фичах почти всегда про offset'ы: закомитили до обработки — пропуск при сбое; после — дубль при ретрае. Тест с убийством консюмера на середине батча — высшая лига вашего ремесла.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> «источник правды по событиям» = topic с retention. Спрашивая «а можно выгрузить всё за прошлый квартал ещё раз», вы просите перечитать лог с offset'а начала квартала — это штатная операция, а не «сложно, нельзя».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Topic — лог: события дописываются в конец и хранятся по retention; читатели не удаляют данные\u003c/li>\n\u003cli>Партиции — параллелизм и единица порядка; гарантия порядка — внутри партиции\u003c/li>\n\u003cli>Ключ сообщения маршрутизирует в партицию: \u003ccode>orderId\u003c/code> ключом = порядок событий заказа\u003c/li>\n\u003cli>Offset — закладка группы; коммит после обработки — меньшая из бед (дубль), до — потеря\u003c/li>\n\u003cli>Партиции наращивают, но не сокращают: закладывайте запас сразу\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Чем topic Kafka принципиально отличается от очереди (queue)?","options":["События не удаляются после чтения: несколько групп могут читать один topic каждая со своей позиции","В topic нельзя писать больше одного продюсера","Очередь хранит данные дольше","Ничем не отличается"],"correct":0,"explanation":"Очередь: взял — исчезло. Лог: дописал в конец — храни retention, читатели ходят с закладками-offset'ами. Отсюда перечитывание истории и независимость потребителей."},{"type":"single","question":"Продакт требует: «статусы заказа 42 должны обрабатываться строго по порядку». Что гарантирует это?","options":["Публиковать события заказа с ключом \"42\": одинаковый ключ → одна партиция → порядок внутри неё","Включить сортировку в брокере","Сделать topic с одной партицией для всех заказов","Ничего: Kafka всегда сохраняет глобальный порядок"],"correct":0,"explanation":"Порядок — только внутри партиции, партиция выбирается хэшем ключа. Ключ = orderId даёт порядок событий каждого заказа и параллельность между заказами. Одна партиция для всех тоже дала бы порядок, но убила бы масштабирование."},{"type":"multi","question":"Что верно про партиции? (несколько ответов)","options":["Активных консюмеров в группе не может быть больше, чем партиций у topic'а","Партиции одного topic'а могут жить на разных брокерах","Партиции можно уменьшить командой на лету","Партиций можно добавить позже"],"correct":[0,1,3],"explanation":"Уменьшение — только пересозданием topic'а. Поэтому параллелизм закладывают с запасом."},{"type":"blank","question":"Как называется номер позиции события внутри партиции, который группа фиксирует как закладку чтения? (одно слово)","answers":["offset","офсет"],"explanation":"Offset. Хранится у Kafka на группу+партицию; правила коммита определяют повторы/потери при сбоях."},{"type":"match","question":"Сопоставьте понятие и смысл.","pairs":[{"left":"Retention","right":"Сколько времени topic хранит события"},{"left":"Ключ сообщения","right":"Определяет партицию и группирует порядок"},{"left":"Consumer group","right":"Владеет offset'ами и делит партиции между инстансами"},{"left":"Брокер","right":"Сервер Kafka, хранит партиции"}]},{"type":"single","question":"Группа analytics перечитывает topic с самого начала. Где лежит информация, с какого offset'а ей продолжать после рестарта?","options":["В самой Kafka: offsets фиксируются на группу и партицию","В базе данных каждого консюмера — вручную","Нигде: каждый старт читает всё заново","В заголовке сообщения"],"correct":0,"explanation":"Kafka хранит коммиты offset'ов по группам. Это и делает потребителей stateless-ми: упал-поднялся — продолжил с закладки."},{"type":"single","question":"Команда создала topic с 3 партициями, а консюмеров в группе — 6. Что будет?","options":["Активны только 3 консюмера — по числу партиций; остальные — горячий резерв","Все 6 будут читать каждую партицию","Kafka автоматически разрежет партиции","Ничего плохого: 6 > 3 — так и надо"],"correct":0,"explanation":"Партиция — атом параллелизма: её нельзя делить внутри группы. Лишние инстансы ждут (резерв при падении). Хотите 6 рабочих — закладывайте ≥6 партиций."}]],"cases":[]},{"id":"m4-lesson-03","title":"Продюсер","module":4,"moduleTitle":"Kafka вглубь","order":3,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 3. Продюсер: публикация без потерь\u003c/h1>\n\u003cp>Продюсер выглядит как одна строка \u003ccode>kafkaTemplate.send(...)\u003c/code> — пока всё хорошо. Урок о том, что за этой строкой: сериализация, ключи, подтверждения и что отличает «отправил» от «не потерял».\u003c/p>\n\u003ch2>Анатомия send()\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;42&quot;\u003c/span>, \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(\u003cspan class=\"hljs-number\">42L\u003c/span>, amount));\n\u003cspan class=\"hljs-comment\">//              topic               ключ      значение (payload)\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Путь сообщения внутри продюсера:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Сериализация\u003c/strong>: ключ и значение превращаются в байты — \u003ccode>StringSerializer\u003c/code>, \u003ccode>JsonSerializer\u003c/code> (вес события — обычный JSON)\u003c/li>\n\u003cli>\u003cstrong>Партиционирование\u003c/strong>: хэш ключа → номер партиции; без ключа — round-robin/sticky\u003c/li>\n\u003cli>\u003cstrong>Батчер\u003c/strong>: сообщения копятся микробатчами (за счёт этого Kafka такая быстрая)\u003c/li>\n\u003cli>\u003cstrong>Отправка + ожидание подтверждения\u003c/strong> — по настройке \u003ccode>acks\u003c/code>\u003c/li>\n\u003c/ol>\n\u003ch2>acks: кто и перед кем отчитывается\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>acks\u003c/th>\n\u003cth>Подтверждение\u003c/th>\n\u003cth>Риск\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003ctd>Не ждём никого\u003c/td>\n\u003ctd>Пожар: могло не дойти вообще\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003ctd>Лидер партиции записал\u003c/td>\n\u003ctd>Лидер упал до репликации — событие потеряно\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>all\u003c/code>\u003c/td>\n\u003ctd>Все ISR-реплики записали\u003c/td>\n\u003ctd>Надёжно; стандарт для ценных данных\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>acks=all\u003c/code> — правильный дефолт для доменных событий. Дешевле всего терять логи метрик (\u003ccode>acks=1\u003c/code>), дороже всего — деньги.\u003c/p>\n\u003cp>Идемпотентный продюсер (\u003ccode>enable.idempotence=true\u003c/code>, в свежих версиях включён по умолчанию): брокер помнит «продюсер №X уже писал с seq №Y» и отбрасывает повтор — ретраи сети не плодят дубли \u003cstrong>на стороне записи\u003c/strong>.\u003c/p>\n\u003ch2>Ретраи и таймауты\u003c/h2>\n\u003cp>Сеть мигает — продюсер ретраит сам (\u003ccode>delivery.timeout.ms\u003c/code>, \u003ccode>retries\u003c/code>). Правило: \u003cstrong>ретраи без идемпотентности = дубли\u003c/strong>, поэтому идемпотентность и ретраи ходят парой. Исчерпал попытки — \u003ccode>send\u003c/code> завершится исключением: ловите и решайте, что важнее — потерять событие или уронить операцию.\u003c/p>\n\u003ch2>Отправка из транзакции: проблема dual-write\u003c/h2>\n\u003cp>Классическая ловушка (мы её почти вырыли в уроке 1):\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(...)\u003c/span> {\n    orderRepository.save(order);                    \u003cspan class=\"hljs-comment\">// ① запись в БД\u003c/span>\n    kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, event);    \u003cspan class=\"hljs-comment\">// ② отправка в Kafka\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Коммит БД происходит \u003cstrong>после\u003c/strong> выхода из метода. Упало между ② и коммитом? Событие о \u003cstrong>несуществующем\u003c/strong> заказе. Упало после коммита, но ① без ② (брокер недоступен)? Заказ есть — события нет, аналитика никогда не узнает. Это \u003cstrong>dual-write problem\u003c/strong>: две независимые системы записи без общей транзакции.\u003c/p>\n\u003cp>Штатное решение — \u003cstrong>transactional outbox\u003c/strong> (детали в уроке 5): в той же БД-транзакции пишем событие в таблицу \u003ccode>outbox\u003c/code>, отдельный релей читает её и публикует в Kafka. Запись заказа и «намерение опубликовать» становятся атомарными.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> dual-write — старый знакомый: «сохрани на сервере и отправь аналитику» в двух вызовах из браузера роняется точно так же. Outbox — «сначала записал в один источник, потом разнёс» — тот же паттерн, что оптимистичные обновления UI.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Практика конфигурации\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">spring:\u003c/span>\n  \u003cspan class=\"hljs-attr\">kafka:\u003c/span>\n    \u003cspan class=\"hljs-attr\">producer:\u003c/span>\n      \u003cspan class=\"hljs-attr\">acks:\u003c/span> \u003cspan class=\"hljs-string\">all\u003c/span>\n      \u003cspan class=\"hljs-attr\">properties:\u003c/span>\n        \u003cspan class=\"hljs-attr\">enable.idempotence:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n      \u003cspan class=\"hljs-attr\">key-serializer:\u003c/span> \u003cspan class=\"hljs-string\">org.apache.kafka.common.serialization.StringSerializer\u003c/span>\n      \u003cspan class=\"hljs-attr\">value-serializer:\u003c/span> \u003cspan class=\"hljs-string\">org.springframework.kafka.support.serializer.JsonSerializer\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Именование topic'ов — контракт: \u003ccode>домен.факт\u003c/code> (\u003ccode>orders.created\u003c/code>, \u003ccode>payments.succeeded\u003c/code>). Не \u003ccode>events\u003c/code>, не \u003ccode>topic1\u003c/code>: по имени должно быть понятно, что случилось.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Путь события: сериализация → партиция по ключу → батч → подтверждение\u003c/li>\n\u003cli>\u003ccode>acks=all\u003c/code> + идемпотентный продюсер — норма для доменных событий; acks=0/1 — осознанный риск\u003c/li>\n\u003cli>Ретраи безопасны только с идемпотентностью записи\u003c/li>\n\u003cli>Dual-write (БД + Kafka в одном методе) — источник потерянных/фантомных событий; лечится outbox-паттерном\u003c/li>\n\u003cli>Имя topic'а — часть контракта: \u003ccode>домен.факт\u003c/code>, ключ — идентичность сущности\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — вторая сторона: консюмеры, группы и что происходит при сбоях чтения.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Чем acks=all принципиально отличается от acks=1?","options":["Ждём подтверждения не только лидера, но и реплик партиции — лидер упал, событие не потерялось","all быстрее, потому что параллельно","1 надёжнее all","all включает сжатие"],"correct":0,"explanation":"1 рискует потерять запись при падении лидера до репликации. all требует кворума ISR-реплик — событие переживёт отказ одного брокера."},{"type":"single","question":"Продюсер шлёт события без ключа. Что можно сказать о порядке?","options":["Никакого глобального порядка нет: сообщения распределяются по партициям","Порядок строгий: Kafka сортирует по времени","Порядок есть, но только по вторникам","Сообщения без ключа отклоняются"],"correct":0,"explanation":"Без ключа партиция выбирается round-robin — соседние события уезжают в разные партиции. Порядок нужен? Ставьте ключ сущности."},{"type":"multi","question":"Что даёт enable.idempotence у продюсера? (несколько ответов)","options":["Брокер отличает ретрай от новой записи по seq-номерам — дублей записи нет","Ретраи сети становятся безопасными","Консюмеры автоматически становятся идемпотентными","Сообщения получают ключ автоматически"],"correct":[0,1],"explanation":"Идемпотентность — только про запись продюсером. Дубли на чтении (at-least-once доставке) остаются заботой консюмера."},{"type":"single","codeLang":"java","code":"@Transactional\npublic void create(CreateOrderRequest r) {\n    orderRepository.save(order);                   // ①\n    kafkaTemplate.send(\"orders.created\", event);   // ②\n}   // коммит БД — здесь, после метода\n","question":"Брокер доступен, БД упала на коммите. Что получил подписчик?","options":["Событие о заказе, которого нет в базе: dual-write во всей красе","Ничего: всё откатилось атомарно","Событие и заказ: транзакция всё согласовало","Ошибку в topic"],"correct":0,"explanation":"Kafka не участник БД-транзакции: send прошёл, коммит — нет. Обратный сценарий (коммит есть, send упал) теряет событие. Лечение — outbox.","codeHtml":"\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest r)\u003c/span> {\n    orderRepository.save(order);                   \u003cspan class=\"hljs-comment\">// ①\u003c/span>\n    kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, event);   \u003cspan class=\"hljs-comment\">// ②\u003c/span>\n}   \u003cspan class=\"hljs-comment\">// коммит БД — здесь, после метода\u003c/span>\n"},{"type":"blank","question":"Как называется паттерн, при котором событие сначала атомарно пишется в таблицу базы рядом с бизнес-данными, а отдельный процесс публикует его в Kafka? (английское слово)","answers":["outbox","transactional outbox","аутбокс"],"explanation":"Transactional outbox: одна транзакция на заказ+событие, релей гарантирует публикацию. Единственный честный ответ на dual-write."},{"type":"match","question":"Сопоставьте настройку/понятие и её эффект.","pairs":[{"left":"acks=all","right":"Подтверждение после записи репликами"},{"left":"enable.idempotence","right":"Ретраи продюсера не создают дублей записи"},{"left":"ключ сообщения","right":"Партиция и порядок событий одной сущности"},{"left":"JsonSerializer","right":"Событие сериализуется как JSON"}]},{"type":"single","question":"В ревью PR видите topic с именем \"events\" для всех событий компании. Ваш комментарий?","options":["Имя topic'а — контракт: разбить на домен.факт (orders.created, payments.succeeded), иначе подписчики фильтруют шум и связаны чужими изменениями","Отлично: один topic — меньше настройки","Имя ни на что не влияет","Нужно назвать topic1"],"correct":0,"explanation":"Тематическое имя разводит потребителей по потокам фактов: каждый слушает своё, retention и партиции настраиваются под нагрузку конкретного домена."}]],"cases":[]},{"id":"m4-lesson-04","title":"Консюмер и группы","module":4,"moduleTitle":"Kafka вглубь","order":4,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 4. Консюмер и группы\u003c/h1>\n\u003cp>Вторая сторона диалога: кто и как читает лог. Разберём группы и ребалансировку — механику, которая раскидывает партиции по инстансам, — и главное: где живут повторы, пропуски и мёртвые сообщения.\u003c/p>\n\u003ch2>Consumer group: очередь внутри pub/sub\u003c/h2>\n\u003cp>Группа превращает topic в очередь \u003cstrong>для себя\u003c/strong>: партиции topic'а делятся между инстансами группы, каждое событие достаётся ровно одному инстансу группы. Разные группы друг другу не мешают — каждая читает всё.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">topic (3 партиции), группа mail-service из 3 инстансов:\n\n  partition 0 → инстанс-1\n  partition 1 → инстанс-2\n  partition 2 → инстанс-3\n\nгруппа analytics читает те же партиции СВОИМИ силами и со своими offset&#x27;ами\n\u003c/code>\u003c/pre>\n\u003cp>Масштабирование: медленно обрабатываете — добавляете инстансы (до числа партиций). Отказоустойчивость: инстанс умер — его партиции перераспределятся.\u003c/p>\n\u003ch2>Rebalance: перетасовка партиций\u003c/h2>\n\u003cp>Изменение состава группы (упал/поднялся инстанс, деплой) → \u003cstrong>rebalance\u003c/strong>: партиции заново делят между выжившими. На время ребаланса группа стоит: не паникуйте, это секунды. Тонкость — что считать «умершим»: \u003ccode>max.poll.interval.ms\u003c/code> — если обработка батча дольше, консюмер выкидывается из группы, инициируя ребаланс. Медленный обработчик → вечные ребалансы → группа буксует. Лечение: батчи меньше, обработка быстрее, тяжёлое — наружу из листенера.\u003c/p>\n\u003ch2>Обработка, потом коммит\u003c/h2>\n\u003cp>Цикл консюмера: прочитать батч → обработать → \u003cstrong>заккоммитить offset'ы\u003c/strong>. Момент коммита определяет семантику сбоя:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Коммит\u003c/th>\n\u003cth>Сбой после\u003c/th>\n\u003cth>Последствие\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>После обработки\u003c/td>\n\u003ctd>Коммита\u003c/td>\n\u003ctd>Событие обработается повторно (\u003cstrong>дубль\u003c/strong>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>До обработки\u003c/td>\n\u003ctd>Коммита\u003c/td>\n\u003ctd>Событие потеряно (\u003cstrong>пропуск\u003c/strong>)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Spring-листенер коммитит после успешного вызова метода: потерь не получится, дубли — могут (норма at-least-once, урок 1). Отсюда железное требование идемпотентности обработчика.\u003c/p>\n\u003ch2>Ошибки обработки: DLT\u003c/h2>\n\u003cp>Обработчик упал на «ядовитом» сообщении (битый JSON, неожиданное состояние). Без стратегии — бесконечный цикл: партиция стоит, событие возвращается после рестарта. Штатное решение — \u003cstrong>Dead Letter Topic (DLT)\u003c/strong>: после N безуспешных попыток событие уезжает в \u003ccode>topic.DLT\u003c/code>, партиция продолжает жить:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@KafkaListener(\n        topics = &quot;orders.created&quot;,\n        groupId = &quot;mail-service&quot;,\n        properties = {&quot;default.deserialization.value...&quot;}, // опустим\n        ...)\u003c/span>\n\u003cspan class=\"hljs-meta\">@RetryableTopic(attempts = &quot;4&quot;, dltTopicSuffix = &quot;.DLT&quot;)\u003c/span>   \u003cspan class=\"hljs-comment\">// 3 попытки, потом .DLT\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">onOrderCreated\u003c/span>\u003cspan class=\"hljs-params\">(OrderCreatedEvent event)\u003c/span> {\n    mailService.sendOrderConfirmation(event.orderId());\n}\n\n\u003cspan class=\"hljs-meta\">@DltHandler\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">toDlt\u003c/span>\u003cspan class=\"hljs-params\">(OrderCreatedEvent event)\u003c/span> {\n    log.error(\u003cspan class=\"hljs-string\">&quot;Событие ушло в DLT после ретраев: {}&quot;\u003c/span>, event);\n    \u003cspan class=\"hljs-comment\">// алерт, разбор руками, починка и переигровка\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>DLT — не мусорка, а рабочий инструмент: алерт на его глубину, регулярный разбор, переигрывание после починки.\u003c/p>\n\u003ch2>@KafkaListener: что ещё в хозяйстве\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Фильтры\u003c/strong>: пропускать нецелевые события до обработчика\u003c/li>\n\u003cli>\u003cstrong>Батчи\u003c/strong>: слушать \u003ccode>List&lt;Message&lt;?&gt;&gt;\u003c/code> — для высоких потоков\u003c/li>\n\u003cli>\u003cstrong>Заголовки\u003c/strong>: трейсинг-id, версия схемы — читаются как метаданные\u003c/li>\n\u003cli>\u003cstrong>Ручной Ack\u003c/strong>: точный контроль коммита для «обработал пачку — закоммитил разом»\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> три обязательных кейса по консюмерам: (1) дубль — событие пришло дважды, эффект один; (2) яд — битое сообщение не подвешивает партицию, а уезжает в DLT; (3) ребаланс — убийство инстанса не теряет события. Если фича проходит все три — она переживёт пятничный деплой.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> «событие не обработалось» — теперь измеримый процесс: N попыток → DLT → алерт. Требование «все заказы получают письма» превращается в метрику «глубина DLT = 0 и лаг группы = 0». Это ваш язык с инженерами.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Группа делит партиции между инстансами: каждая группа читает всё своими темпами\u003c/li>\n\u003cli>Rebalance перетасовывает партиции при изменении состава; долгая обработка → выпадение из группы\u003c/li>\n\u003cli>Коммит после обработки: терять нельзя, дубли можно (идемпотентность!)\u003c/li>\n\u003cli>Ядовитые события — в DLT после N попыток: партиция живёт, инцидент виден\u003c/li>\n\u003cli>Лаг группы (отставание от хвоста лога) — главная метрика здоровья консюмера\u003c/li>\n\u003c/ul>\n\u003cp>Последний урок модуля собирает надёжность в целые паттерны: outbox, идемпотентный консюмер и порядок vs параллелизм.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Два инстанса mail-service в одной группе читают topic из 4 партиций. Сколько событий получит каждый?","options":["Примерно по половине: партиции делятся внутри группы, каждое событие — ровно одному инстансу группы","Оба получат все события","Зависит от ключей: один — все, второй — ничего","Поровну по 4 каждому"],"correct":0,"explanation":"Внутри группы topic — очередь: партиции распределены, события не дублируются. Все события — только у консюмеров РАЗНЫХ групп."},{"type":"single","question":"Обработчик батча работает дольше max.poll.interval.ms. Что происходит?","options":["Консюмер считается умершим: ребаланс, партиции уходят другим, а потом возвращаются — вечный цикл отставания","Ничего: интервал продлевается автоматически","Батч обрезается","Kafka ускоряет обработчик"],"correct":0,"explanation":"max.poll.interval.ms — это «сердцебиение» обработки. Медленный обработчик роняет членство → ребалансы → стоп-эффект. Лечение: меньше батчи/быстрее обработка/тяжёлое наружу."},{"type":"multi","question":"Что может завести событие в DLT? (несколько ответов)","options":["Невалидный JSON события","Неожожданное состояние: событие ссылается на несуществующую сущность","Долгая, но успешная обработка","Исключение в обработчике, не прошедшее за N попыток"],"correct":[0,1,3],"explanation":"DLT — для событий, которые нельзя обработать после ретраев. Медленная успешная обработка — про производительность, а не про яд."},{"type":"match","question":"Сопоставьте термин консюмера и смысл.","pairs":[{"left":"Consumer group","right":"Набор инстансов, делящих партиции topic'а"},{"left":"Offset commit","right":"Фиксация «дочитал досюда» за группой"},{"left":"Rebalance","right":"Перераспределение партиций при смене состава группы"},{"left":"Лаг (lag)","right":"Отставание группы от хвоста лога"}]},{"type":"single","question":"Листенер закоммитил offset ДО обработки, обработка упала. Что стало с событием?","options":["Потеряно: после рестарта чтение продолжится со следующего","Ничего: вернётся при следующем poll","Уедет в DLT","Задублируется"],"correct":0,"explanation":"Именно поэтому Spring коммитит после успешного метода: ценой возможного дубля исключается потеря. Дубль лечится идемпотентностью, потеря — ничем."},{"type":"blank","question":"Как называется topic-кладбище для событий, не поддавшихся обработке после всех ретраев? (аббревиатура)","answers":["DLT","dead letter topic","длт"],"explanation":"Dead Letter Topic. С суффиксом .DLT, с алертами на глубину и регулярным разбором — рабочий инструмент, а не мусорка."},{"type":"single","question":"Метрика здоровья консюмера, которую смотрят первыми: что и почему?","options":["Лаг группы: отставание от хвоста лога — растёт, значит не успеваем за потоком","Число продюсеров","Размер topic'а в гигабайтах","Количество партиций"],"correct":0,"explanation":"Лаг = хвост лога − коммит группы. Растущий лаг — «не справляемся»: алерт, скейлинг группы, профиль обработки."}]],"cases":[]},{"id":"m4-lesson-05","title":"Надёжность: паттерны доставки","module":4,"moduleTitle":"Kafka вглубь","order":5,"baseOrder":null,"lab":{"title":"Лаба 6. Продюсер и консюмер","description":"Простой цикл своими руками: опубликовать событие OrderCreated через KafkaTemplate и принять его @KafkaListener'ом. Проверка — тесты на встроенном Kafka-брокере, Docker не нужен.","branch":"lab-6","branchSolution":"lab-6-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 5. Надёжность: паттерны доставки\u003c/h1>\n\u003cp>Финальный урок собирает модуль в целостную картину: что значит «надёжная асинхронность», какие паттерны закрывают дыры доставки и где проходит граница цены надёжности.\u003c/p>\n\u003ch2>Семантики доставки: три слова, которые надо различать\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Семантика\u003c/th>\n\u003cth>Гарантия\u003c/th>\n\u003cth>Чем достигается\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>At-most-once\u003c/strong>\u003c/td>\n\u003ctd>Не больше одного раза: могут быть потери\u003c/td>\n\u003ctd>Коммит до обработки, acks низкие\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>At-least-once\u003c/strong>\u003c/td>\n\u003ctd>Хотя бы один раз: возможны дубли\u003c/td>\n\u003ctd>Коммит после обработки, acks=all\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Effectively-once\u003c/strong>\u003c/td>\n\u003ctd>Итоговый эффект ровно один\u003c/td>\n\u003ctd>At-least-once + \u003cstrong>идемпотентный\u003c/strong> обработчик\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Kafka не даёт exactly-once «бесплатно» между произвольными системами. Реальность инженерии: \u003cstrong>at-least-once + идемпотентность = effectively-once\u003c/strong>. Поэтому центральный паттерн модуля — не настройка брокера, а дисциплина обработчика.\u003c/p>\n\u003ch2>Идемпотентный консюмер: как именно\u003c/h2>\n\u003cp>Событие пришло повторно — эффект обязан быть тем же. Приёмы по нарастанию сложности:\u003c/p>\n\u003cp>\u003cstrong>1. Естественная идемпотентность.\u003c/strong> \u003ccode>SET status = 'CONFIRMED' WHERE id = 42\u003c/code> — повтор меняет ничего. Если операция так выглядит — вы уже защищены.\u003c/p>\n\u003cp>\u003cstrong>2. Проверка по id события.\u003c/strong> У события есть уникальный \u003ccode>eventId\u003c/code> (UUID). Обработчик в той же транзакции: записал \u003ccode>processed_events(eventId)\u003c/code> + выполнил эффект. Повтор видит «уже обработано» — выход.\u003c/p>\n\u003cp>\u003cstrong>3. Версии/дедупликация по бизнес-ключу.\u003c/strong> \u003ccode>user.version = 5\u003c/code> пришёл после \u003ccode>version = 7\u003c/code>? Устаревшее — игнор.\u003c/p>\n\u003cp>Бонус прагматика: «письмо о заказе» — идемпотентно само по себе (два письма — терпимо, но лучше не надо); «начисление бонуса» — требует строгой схемы 2.\u003c/p>\n\u003ch2>Transactional Outbox: атомарность БД + Kafka\u003c/h2>\n\u003cp>Проблема dual-write из урока 3 — «сохранил в БД, не донёс до Kafka» — решается \u003cstrong>таблицей-исходящим ящиком\u003c/strong>:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    A[&quot;@Transactional:&lt;br/&gt;order + outbox_event&lt;br/&gt;одна транзакция&quot;] --&gt; DB[(&quot;БД&quot;)]\n    DB --&gt; R[&quot;Outbox-релей&lt;br/&gt;читает outbox, публикует&lt;br/&gt;в Kafka, помечает отправлено&quot;]\n    R --&gt; K[&quot;topic orders.created&quot;]\u003c/div>\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest r)\u003c/span> {\n    \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderRepository.save(newOrder(r));\n    outboxRepository.save(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OutboxEvent\u003c/span>(\n            \u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>,\n            String.valueOf(order.getId()),          \u003cspan class=\"hljs-comment\">// ключ\u003c/span>\n            toJson(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(order.getId()))));\n}\n\u003c/code>\u003c/pre>\n\u003cp>Релей (отдельный поток/библиотека/Debezium) поллит таблицу, публикует и помечает. Свойства: заказ без события — невозможен (одна транзакция); событие без заказа — невозможно; дубль публикации — возможен, глушится идемпотентным консюмером. Outbox — обязательный паттерн там, где событие обязано случиться.\u003c/p>\n\u003ch2>Порядок vs параллелизм: саги и версии\u003c/h2>\n\u003cp>Партиция даёт порядок событий одной сущности. Но потребители могли обработать с разной скоростью (ретраи, DLT) — эффект «e₃ применился раньше e₂». Защита:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Версии событий\u003c/strong>: событие несёт \u003ccode>version\u003c/code>/\u003ccode>occurredAt\u003c/code>; обработчик применяет только более новое\u003c/li>\n\u003cli>\u003cstrong>Коммуникативные ассоциации\u003c/strong>: обработка «заказ отменён» должна учитывать, что «заказ создан» мог ещё не дойти → обработчик ждёт/подтягивает состояние\u003c/li>\n\u003c/ul>\n\u003cp>Развязка длинных процессов — \u003cstrong>сага\u003c/strong>: цепочка локальных транзакций + компенсации («заказ создан → платёж прошёл → …; платёж не прошёл → заказ отменить»). Это ортогонально Kafka (саги бывают и на HTTP), но с событиями сага становится естественной формой.\u003c/p>\n\u003ch2>Сколько надёжности нужно?\u003c/h2>\n\u003cp>Надёжность — не бесплатна: outbox — таблица и релей; strict-идемпотентность — хранение обработанных id; effectively-once — тесты тройных сценариев. Зрелая команда соизмеряет:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Событие\u003c/th>\n\u003cth>Стоимость потери\u003c/th>\n\u003cth>Решение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Клики, метрики\u003c/td>\n\u003ctd>Мала\u003c/td>\n\u003ctd>at-most/at-least, без церемоний\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>«Заказ создан», «платёж прошёл»\u003c/td>\n\u003ctd>Велика\u003c/td>\n\u003ctd>acks=all + outbox + идемпотентный консюмер\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Деньги, бухгалтерия\u003c/td>\n\u003ctd>Критична\u003c/td>\n\u003ctd>+ строгая идемпотентность, сверки, possibly саги\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> таблица выше — почти готовый вопрос к требованиям: «что будет, если это событие потеряется/задвоится?» Ответ определяет бюджет надёжности фичи. Это самое дешёвое архитектурное решение, которое вы можете принять.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> матрица тестов зрелого асинхронного контура: дубль, потеря (kill -9 консюмера), яд в DLT, порядок событий одной сущности, ребаланс. Пять сценариев, полчаса тестов, и асинхронность перестаёт быть «магией, которая иногда ломается».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Effectively-once = at-least-once + идемпотентный обработчик; «бесплатного» exactly-once нет\u003c/li>\n\u003cli>Идемпотентность: естественная (SET) → eventId-таблица → версии\u003c/li>\n\u003cli>Outbox делает «БД-изменение + событие» атомарными; релей и идемпотентный консюмер закрывают остальное\u003c/li>\n\u003cli>Порядок при ретраях защищают версии событий; длинные процессы развязываются сагами\u003c/li>\n\u003cli>Уровень надёжности выбирают по цене потери события — это продуктовое решение\u003c/li>\n\u003c/ul>\n\u003cp>Модуль пройден. Дальше — экзамен, кейс и лаба: настоящий продюсер и консюмер на встроенном Kafka-брокере.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"«Effectively-once» в асинхронных системах достигается как…","options":["At-least-once доставка + идемпотентный обработчик: дубли приходят, эффект один","Включением галочки exactly-once в брокере","Запретом ретраев","Одной партицией на всё"],"correct":0,"explanation":"Доставка может дублировать — эффект обязана убирать сторона обработки. Пара at-least-once + идемпотентность и есть инженерный exactly-once."},{"type":"multi","question":"Что даёт transactional outbox? (несколько ответов)","options":["Заказ без события невозможен: одна транзакция БД","Событие без заказа невозможно","Полностью исключает дубли публикации","Релей публикует из таблицы и помечает отправленное"],"correct":[0,1,3],"explanation":"Дубль публикации релеем возможен (крэш после send, до пометки) — и это нормально: его съест идемпотентный консюмер. Outbox решает атомарность, а не дубли."},{"type":"single","codeLang":"sql","code":"UPDATE orders SET status = 'CANCELLED' WHERE id = 42 AND status \u003c> 'CANCELLED';\n","question":"Обработчик события отмены выполняет такой UPDATE. Какой вид идемпотентности работает?","options":["Естественная: повторное выполнение ничего не меняет","Проверка по eventId","Версии событий","Никакая: нужен outbox"],"correct":0,"explanation":"Повтор события даёт тот же результат (обновление 0 строк). Самый дешёвый вид идемпотентности — писать эффекты так, чтобы они были «перевыполняемы».","codeHtml":"\u003cspan class=\"hljs-keyword\">UPDATE\u003c/span> orders \u003cspan class=\"hljs-keyword\">SET\u003c/span> status \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-string\">&#x27;CANCELLED&#x27;\u003c/span> \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span> \u003cspan class=\"hljs-keyword\">AND\u003c/span> status \u003cspan class=\"hljs-operator\">&lt;&gt;\u003c/span> \u003cspan class=\"hljs-string\">&#x27;CANCELLED&#x27;\u003c/span>;\n"},{"type":"single","question":"События заказа 42: created (v1) и cancelled (v2), консюмер обработал их в обратном порядке из-за ретрая. Что защищает?","options":["Версии событий: обработчик игнорирует v1 после применённой v2","Ничего: порядок в партиции гарантирует порядок обработки","DLT: отменит устаревшее","acks=all"],"correct":0,"explanation":"Порядок в партиции — порядок доставки, но не порядок эффектов (ретраи/DLT ломают его). Версия в событии — защита обработчика."},{"type":"blank","question":"Как называется таблица, в которую событие атомарно пишется в транзакции с бизнес-данными, а отдельный релей публикует его в Kafka? (одним словом)","answers":["outbox","аутбокс"],"explanation":"Outbox. Лечит dual-write: запись и «обязательство опубликовать» — одна транзакция."},{"type":"match","question":"Сопоставьте событие и разумный уровень надёжности.","pairs":[{"left":"Просмотр карточки товара","right":"At-most-once: потеря терпима"},{"left":"Заказ создан","right":"acks=all + outbox + идемпотентность"},{"left":"Платёж проведён","right":"Строгая идемпотентность, сверки"},{"left":"Клик по баннеру","right":"Дёшево и сердито: потери в пределах статистики"}]},{"type":"single","question":"Итог модуля. Что делает асинхронный контур production-ready?","options":["Acks=all, outbox для обязательных событий, идемпотентные обработчики, DLT с алертами, мониторинг лага","Одна большая партиция и молитва","Отключение ретраев везде","Синхронные HTTP-вызовы из каждого листенера"],"correct":0,"explanation":"Четыре кита надёжности: доставка подтверждена, публикация атомарна, обработка идемпотентна, сбои видны (DLT + лаг). Синхронные вызовы из листенера возвращают связанность, от которой уходили."}]],"cases":[]},{"id":"m4-exam","title":"Экзамен модуля и кейс","module":4,"moduleTitle":"Kafka вглубь","order":6,"baseOrder":null,"lab":null,"html":"\u003ch1>Экзамен модуля «Kafka вглубь»\u003c/h1>\n\u003cp>Брокер, партиции, продюсеры, группы, надёжность — всё в одном финале: кейс, затем 15 вопросов, порог 80%.\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","topic":"m4-lesson-02","question":"Topic — это очередь или лог? Что из этого следует?","options":["Лог: события хранятся по retention, несколько групп читают один topic независимо со своими offset'ами","Очередь: событие удаляется после первого прочтения","И то и другое одновременно","Ни то, ни другое: это таблица"],"correct":0,"explanation":"Лог — фундамент Kafka: подписчики с закладками, перечитывание истории, независимые группы. Очередь удаляет — этого нет."},{"type":"single","topic":"m4-lesson-02","question":"Нужен строгий порядок событий каждого пользователя. Решение?","options":["Ключ сообщения = userId: все события пользователя в одной партиции, порядок внутри партиции гарантирован","Отдельный topic на каждого пользователя","Одна партиция на всё — пользователей немного","Сортировка по timestamp в обработчике"],"correct":0,"explanation":"Ключ маршрутизирует в партицию — порядок внутри ключа. Одна партиция на всех дала бы порядок ценой нулевого параллелизма."},{"type":"multi","topic":"m4-lesson-02","question":"Про offset'ы верно: (несколько ответов)","options":["Offset фиксируется на группу и партицию, хранится в Kafka","Коммит до обработки может потерять событие при сбое","Коммит после обработки может задублировать обработку","Offset живёт в теле сообщения"],"correct":[0,1,2],"explanation":"Закладка группы — вне сообщения. Дилемма коммита: до — потеря, после — дубль; выбирают «после», дубль лечат идемпотентностью."},{"type":"single","topic":"m4-lesson-02","question":"Группа из 5 инстансов читает topic из 3 партиций. Сколько инстансов работают?","options":["3 — по одному на партицию, остальные в резерве","Все 5, деля каждую партицию","1 — только лидер группы","2 — Kafka удваивает про запас"],"correct":0,"explanation":"Партиция — атом параллелизма: одному инстансу группы — одна партиция. Резерв подхватит при падении."},{"type":"single","topic":"m4-lesson-03","question":"Продюсер с acks=1 записал событие, лидер упал до репликации. Что произошло?","options":["Событие может быть потеряно: подтверждения от реплик не было","Ничего: реплики догонят из воздуха","Продюсер обязан повторить по закону","Брокер откатит партицию"],"correct":0,"explanation":"acks=1 подтверждает только лидера. Для ценных событий — acks=all: подтверждение кворумом реплик."},{"type":"single","topic":"m4-lesson-03","codeLang":"java","code":"@Transactional\npublic void register(User user) {\n    userRepository.save(user);\n    kafkaTemplate.send(\"users.registered\", new UserEvent(user.getId()));\n}\n","question":"Коммит БД упал после send. Что получил подписчик?","options":["Событие о несуществующем пользователе — dual-write","Ничего: атомарность общая","Событие и пользователя","Ошибку сериализации"],"correct":0,"explanation":"БД и Kafka не имеют общей транзакции. Лечение — outbox: user + outbox_event в одной транзакции, публикация релеем.","codeHtml":"\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">register\u003c/span>\u003cspan class=\"hljs-params\">(User user)\u003c/span> {\n    userRepository.save(user);\n    kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;users.registered&quot;\u003c/span>, \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">UserEvent\u003c/span>(user.getId()));\n}\n"},{"type":"blank","topic":"m4-lesson-05","question":"Как называется таблица-«исходящий ящик» для атомарной публикации событий из БД-транзакции? (одно слово)","answers":["outbox","аутбокс"],"explanation":"Outbox: бизнес-запись и событие — одна транзакция; релей публикует и помечает."},{"type":"single","topic":"m4-lesson-05","question":"Консюмер дважды получил payments.succeeded для заказа 42. Какой обработчик безопасен?","options":["UPDATE orders SET status='PAID' WHERE id=42 AND status\u003c>'PAID' — второй раз эффекта ноль","Баланс += 500 — дважды начислено, ну и ладно","INSERT INTO bonuses VALUES (42, 500) — дубль строки","Отправить письмо повторно и надеяться"],"correct":0,"explanation":"Естественная идемпотентность через условие UPDATE. Начисления/INSERT без ключа уникальности — источник задвоенных денег."},{"type":"match","topic":"m4-lesson-04","question":"Сопоставьте понятие и его роль.","pairs":[{"left":"Rebalance","right":"Перераспределение партиций при смене состава группы"},{"left":"DLT","right":"Кладбище необработанных сообщений с ретраями"},{"left":"Лаг группы","right":"Отставание консюмеров от хвоста лога"},{"left":"max.poll.interval.ms","right":"Дедлайн обработки батча до выпадения из группы"}]},{"type":"single","topic":"m4-lesson-04","question":"Битое событие крутится в листенере, партиция стоит. Что должен сделать контур?","options":["После N попыток увести событие в DLT и продолжить с партицией","Крутить вечно: вдруг починится","Пропустить молча и закоммитить","Пересоздать topic"],"correct":0,"explanation":"DLT + алерт + разбор: партиция живёт, инцидент виден. Вечный
