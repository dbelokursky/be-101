е список, а число:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name, \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-keyword\">AS\u003c/span> open_tasks\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks t\n\u003cspan class=\"hljs-keyword\">JOIN\u003c/span> projects p \u003cspan class=\"hljs-keyword\">ON\u003c/span> p.id \u003cspan class=\"hljs-operator\">=\u003c/span> t.project_id\n\u003cspan class=\"hljs-keyword\">WHERE\u003c/span> t.done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>\n\u003cspan class=\"hljs-keyword\">GROUP\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> p.name\n\u003cspan class=\"hljs-keyword\">HAVING\u003c/span> \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-operator\">&gt;\u003c/span> \u003cspan class=\"hljs-number\">5\u003c/span>\n\u003cspan class=\"hljs-keyword\">ORDER\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> open_tasks \u003cspan class=\"hljs-keyword\">DESC\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003ch2>Индексы: почему одни запросы быстрые, а другие — вечные\u003c/h2>\n\u003cp>Без индекса \u003ccode>WHERE title = '...'\u003c/code> — \u003cstrong>полный перебор\u003c/strong> всех строк (full scan). Индекс — отсортированная структура (B-дерево) по колонке: поиск по ней — логарифмический, как в оглавлении книги.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">CREATE\u003c/span> INDEX idx_tasks_project \u003cspan class=\"hljs-keyword\">ON\u003c/span> tasks (project_id);\n\u003c/code>\u003c/pre>\n\u003cp>Правила выживания:\u003c/p>\n\u003cul>\n\u003cli>PK и FK индексируются (FK не всегда автоматически — зависит от БД, проверяйте)\u003c/li>\n\u003cli>Индекс ускоряет \u003ccode>WHERE\u003c/code>, \u003ccode>JOIN\u003c/code>, \u003ccode>ORDER BY\u003c/code> по этой колонке\u003c/li>\n\u003cli>Индекс не бесплатен: каждый INSERT/UPDATE чуть медленнее, индексы занимают место\u003c/li>\n\u003cli>«Запрос внезапно стал медленным» — почти всегда «данные выросли, а индекса нет»\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> если фича «тормозит на проде, а локально мгновенно» — классика: локально 100 строк (перебор незаметен), на проде 10 миллионов. Спросите про индекс и план запроса (EXPLAIN) — звучите как король багрэйтов.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Из Java это видно как…\u003c/h2>\n\u003cp>Всё, что вы узнали, напрямую отражается в коде:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>В базе\u003c/th>\n\u003cth>В Java (Spring)\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Таблица \u003ccode>tasks\u003c/code>\u003c/td>\n\u003ctd>entity-класс \u003ccode>Task\u003c/code> с \u003ccode>@Entity\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Колонка \u003ccode>title\u003c/code>\u003c/td>\n\u003ctd>поле \u003ccode>title\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>PK \u003ccode>id\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>@Id @GeneratedValue\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FK \u003ccode>project_id\u003c/code>\u003c/td>\n\u003ctd>поле связи \u003ccode>@ManyToOne Project project\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>SELECT ... WHERE done=false\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>findByDone(false)\u003c/code> репозитория\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Индекс\u003c/td>\n\u003ctd>\u003ccode>@Table(indexes = @Index(...))\u003c/code> или миграция\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Подробно это соответствие — урок 2. А пока зафиксируем язык.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Таблицы + строки/колонки; PK — идентичность строки, FK — связь и ссылочная целостность\u003c/li>\n\u003cli>Связи: один-ко-многим через FK у «многих», многие-ко-многим — через таблицу-связку\u003c/li>\n\u003cli>SQL: SELECT/INSERT/UPDATE/DELETE + JOIN + GROUP BY\u003c/li>\n\u003cli>Индексы ускоряют поиск по колонке, но стоят при записи; full scan на больших данных — источник «внезапных» тормозов\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Почему внешний ключ (FOREIGN KEY) — это защита, а не просто договорённость?","options":["База сама отклонит запись со значением project_id, которого нет в projects","Он автоматически создаёт индекс во всех СУБД","Он шифрует связь между таблицами","Он ускоряет все запросы к обеим таблицам"],"correct":0,"explanation":"Ссылочная целостность — гарантия СУБД: «задача из несуществующего проекта» не может существовать, какой бы баг ни был в Java. Индекс по FK создаётся не всегда — это отдельная забота."},{"type":"single","codeLang":"sql","code":"SELECT p.name, COUNT(*) AS cnt\nFROM tasks t\nJOIN projects p ON p.id = t.project_id\nGROUP BY p.name\nHAVING COUNT(*) > 5;\n","question":"Что вернёт этот запрос?","options":["Проекты, у которых больше пяти задач (всех), с количеством","Все проекты с их задачами построчно","Только пять задач на каждый проект","Проекты с более чем пятью невыполненными задачами"],"correct":0,"explanation":"JOIN соединяет, GROUP BY сворачивает по проекту, HAVING фильтрует уже агрегированные группы. Фильтра по done нет — считаются все задачи. Отфильтровать до агрегации мог бы WHERE.","codeHtml":"\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name, \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-keyword\">AS\u003c/span> cnt\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> tasks t\n\u003cspan class=\"hljs-keyword\">JOIN\u003c/span> projects p \u003cspan class=\"hljs-keyword\">ON\u003c/span> p.id \u003cspan class=\"hljs-operator\">=\u003c/span> t.project_id\n\u003cspan class=\"hljs-keyword\">GROUP\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> p.name\n\u003cspan class=\"hljs-keyword\">HAVING\u003c/span> \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(\u003cspan class=\"hljs-operator\">*\u003c/span>) \u003cspan class=\"hljs-operator\">&gt;\u003c/span> \u003cspan class=\"hljs-number\">5\u003c/span>;\n"},{"type":"multi","question":"Какие утверждения об индексах верны? (несколько ответов)","options":["Индекс ускоряет поиск и сортировку по проиндексированной колонке","Каждый индекс замедляет вставку и обновление строк","Индексы бесплатны и их надо ставить на все колонки","Запрос по непроиндексированной колонке на большой таблице — полный перебор"],"correct":[0,1,3],"explanation":"Индекс — компромисс: быстрые чтения ценой медленной записи и места. «Индексов много» — тоже антипаттерн: пишите только то, по чему ищут."},{"type":"match","question":"Сопоставь концепцию базы и её отражение в Java/Spring.","pairs":[{"left":"Таблица tasks","right":"@Entity класс Task"},{"left":"Колонка title","right":"Поле title"},{"left":"Внешний ключ project_id","right":"Поле @ManyToOne Project project"},{"left":"WHERE done = false","right":"findByDone(false) репозитория"}]},{"type":"blank","question":"Какой оператор SQL соединяет строки двух таблиц по условию связи? (одно слово, большими буквами)","answers":["JOIN"],"explanation":"JOIN ... ON условие. В Spring Data он прячется внутри связей entity и @Query, но под каждым — JOIN."},{"type":"single","question":"Фича на проде отвечает 30 секунд, локально — мгновенно. Первая гипотеза бэкендера?","options":["На проде данных на порядки больше и запрос идёт полным перебором без индекса","Прод-сервер слабее ноутбука","Java на проде другой версии","Сеть медленная между сервисами"],"correct":0,"explanation":"Классика масштабирования: full scan на 10 млн строк заметен, на 100 строках — нет. EXPLAIN и индекс — штатное лечение."},{"type":"single","question":"Задачи и исполнители: у задачи много исполнителей, у исполнителя много задач. Какая схема верна?","options":["Отдельная таблица task_assignees(task_id, user_id) с двумя FK","Колонка assignees в tasks со списком через запятую","Внешний ключ user_id прямо в tasks","Дублировать задачи для каждого исполнителя"],"correct":0,"explanation":"Многие-ко-многим — таблица-связка с FK на обе стороны. Список в колонке ломает целостность и поиск; FK в tasks дал бы только одного исполнителя."}]],"cases":[]},{"id":"m3-order-data","title":"Отмена заказа в данных","module":3,"moduleTitle":"Данные","order":1.5,"baseOrder":7,"lab":null,"html":"\u003ch1>Отмена заказа в данных\u003c/h1>\n\u003cp>По \u003ca href=\"#/m2-order-cancellation-review\">контракту отмены\u003c/a> заказ \u003ccode>42\u003c/code> должен перейти в \u003ccode>CANCELLED\u003c/code>, а покупателю полагается один возврат бонусов. Сверь обе части правила по данным учебного сервиса.\u003c/p>\n\u003ch2>Срез после отмены\u003c/h2>\n\u003cp>Срез сделан 16 января в \u003ccode>11:59:53Z\u003c/code>. В \u003ccode>orders\u003c/code> строку определяет поле \u003ccode>id\u003c/code>. В журнале бонусов поле \u003ccode>order_id\u003c/code> связывает операцию с заказом.\u003c/p>\n\u003cp>\u003cstrong>Таблица \u003ccode>orders\u003c/code>\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>id\u003c/th>\n\u003cth>status\u003c/th>\n\u003cth>cancelled_at\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>42\u003c/td>\n\u003ctd>CANCELLED\u003c/td>\n\u003ctd>2026-01-16T11:59:52.180Z\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>77\u003c/td>\n\u003ctd>CANCELLED\u003c/td>\n\u003ctd>2026-01-16T10:12:04.600Z\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Таблица \u003ccode>bonus_transactions\u003c/code>\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>id\u003c/th>\n\u003cth>order_id\u003c/th>\n\u003cth>reason\u003c/th>\n\u003cth>amount\u003c/th>\n\u003cth>created_at\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>refund-77\u003c/td>\n\u003ctd>77\u003c/td>\n\u003ctd>ORDER_CANCELLED\u003c/td>\n\u003ctd>+80\u003c/td>\n\u003ctd>2026-01-16T10:12:04.600Z\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>adjustment-42\u003c/td>\n\u003ctd>42\u003c/td>\n\u003ctd>SUPPORT_ADJUSTMENT\u003c/td>\n\u003ctd>+15\u003c/td>\n\u003ctd>2026-01-16T10:30:00Z\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>refund-42\u003c/td>\n\u003ctd>42\u003c/td>\n\u003ctd>ORDER_CANCELLED\u003c/td>\n\u003ctd>+120\u003c/td>\n\u003ctd>2026-01-16T11:59:52.180Z\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Положительная сумма означает зачисление. Чтобы проверить именно возврат при отмене, отбери строки по заказу и причине операции.\u003c/p>\n\u003cpre>\u003ccode class=\"language-sql\">\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> id, status, cancelled_at\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> orders\n\u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span>;\n\n\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> id, amount, created_at\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> bonus_transactions\n\u003cspan class=\"hljs-keyword\">WHERE\u003c/span> order_id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span> \u003cspan class=\"hljs-keyword\">AND\u003c/span> reason \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-string\">&#x27;ORDER_CANCELLED&#x27;\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003ch2>Два параллельных запроса\u003c/h2>\n\u003cp>Для отдельной проверки QA восстановил исходное состояние заказа \u003ccode>42\u003c/code>. Анна отправила два запроса из разных вкладок с действительным токеном. Оба пришли до истечения 24 часов.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Время 16 января\u003c/th>\n\u003cth>Запрос\u003c/th>\n\u003cth>Idempotency-Key\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>11:59:52.010Z\u003c/td>\n\u003ctd>\u003ccode>POST /api/orders/42/cancel\u003c/code>\u003c/td>\n\u003ctd>test-tab-a\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11:59:52.015Z\u003c/td>\n\u003ctd>\u003ccode>POST /api/orders/42/cancel\u003c/code>\u003c/td>\n\u003ctd>test-tab-b\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>","quizzes":[],"cases":[{"title":"Проверь состояние заказа и число возвратов","task":"По срезу назови статус заказа 42 и укажи запись, которая подтверждает возврат. Для параллельного прогона сформулируй правило, которое должно выполняться при любой очередности запросов. Назови ожидаемые ответы API и то, что нужно проверить в обеих таблицах после завершения запросов.\n","placeholder":"Статус и строка возврата\nПравило для двух вкладок\nОжидаемые ответы\nПроверка в БД","referenceHtml":"\u003cp>Заказ \u003ccode>42\u003c/code> отменён. Возврат — строка \u003ccode>refund-42\u003c/code> с \u003ccode>order_id = 42\u003c/code>, причиной \u003ccode>ORDER_CANCELLED\u003c/code> и суммой \u003ccode>+120\u003c/code>. Корректировка поддержки относится к другой операции. Возврат по заказу \u003ccode>77\u003c/code> проверяется отдельно.\u003c/p>\n\u003cp>В параллельном прогоне кто-то первым переводит заказ из \u003ccode>NEW\u003c/code> в \u003ccode>CANCELLED\u003c/code> и получает \u003ccode>204\u003c/code>. Второй запрос с другим ключом получает \u003ccode>409 ORDER_ALREADY_CANCELLED\u003c/code>. Кто именно получит \u003ccode>204\u003c/code>, зависит от очередности выполнения.\u003c/p>\n\u003cp>Инвариант для любого порядка — один переход в \u003ccode>CANCELLED\u003c/code> и одна строка возврата с суммой \u003ccode>+120\u003c/code>. Проверка состояния и запись возврата должны быть атомарны. Например, сервис блокирует строку заказа в транзакции и повторно проверяет статус после получения блокировки. Параллельный запрос увидит сохранённую отмену перед тем, как попытаться начислить бонусы.\u003c/p>\n\u003cp>Срез подтверждает итог операции. Два конкурентных запроса в тесте проверяют, сохранится ли тот же итог при гонке.\u003c/p>\n"}]},{"id":"m3-lesson-02","title":"JPA и Hibernate: объекты и таблицы","module":3,"moduleTitle":"Данные","order":2,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 2. JPA и Hibernate: объекты и таблицы\u003c/h1>\n\u003cp>В пилоте entity была одной таблицей без связей. Реальные сущности связаны: у проекта — задачи, у задачи — комментарии. Разберём, как связи живут в Java, кто и когда ходит в базу, и почему «ленивость» — не оскорбление, а способ выжить.\u003c/p>\n\u003ch2>Entity со связью\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Entity\u003c/span>\n\u003cspan class=\"hljs-meta\">@Table(name = &quot;projects&quot;)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Setter\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Project\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Id\u003c/span>\n    \u003cspan class=\"hljs-meta\">@GeneratedValue(strategy = GenerationType.IDENTITY)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long id;\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String name;\n\n    \u003cspan class=\"hljs-comment\">// один проект — много задач\u003c/span>\n    \u003cspan class=\"hljs-meta\">@OneToMany(mappedBy = &quot;project&quot;, cascade = CascadeType.ALL, orphanRemoval = true)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-variable\">tasks\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ArrayList\u003c/span>&lt;&gt;();\n}\n\n\u003cspan class=\"hljs-meta\">@Entity\u003c/span>\n\u003cspan class=\"hljs-meta\">@Table(name = &quot;tasks&quot;)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Getter\u003c/span> \u003cspan class=\"hljs-meta\">@Setter\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">Task\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Id\u003c/span>\n    \u003cspan class=\"hljs-meta\">@GeneratedValue(strategy = GenerationType.IDENTITY)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Long id;\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> String title;\n\n    \u003cspan class=\"hljs-comment\">// много задач — один проект: ВЛАДЕЛЕЦ связи (колонка project_id в tasks)\u003c/span>\n    \u003cspan class=\"hljs-meta\">@ManyToOne(fetch = FetchType.LAZY)\u003c/span>\n    \u003cspan class=\"hljs-meta\">@JoinColumn(name = &quot;project_id&quot;)\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> Project project;\n}\n\u003c/code>\u003c/pre>\n\u003cp>Правило запоминания: \u003cstrong>владелец связи — сторона с внешним ключом\u003c/strong>. У нас FK в \u003ccode>tasks\u003c/code>, значит владелец — \u003ccode>Task.project\u003c/code>, а \u003ccode>Project.tasks\u003c/code> — «зеркальная» сторона (\u003ccode>mappedBy\u003c/code> говорит: «смотри колонцию на той стороне»).\u003c/p>\n\u003cp>Что даёт связь в коде:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>).orElseThrow();\n\u003cspan class=\"hljs-type\">String\u003c/span> \u003cspan class=\"hljs-variable\">projectName\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> task.getProject().getName();   \u003cspan class=\"hljs-comment\">// без ручного JOIN!\u003c/span>\n\u003c/code>\u003c/pre>\n\u003ch2>CascadeType: кто за кем тянет\u003c/h2>\n\u003cp>\u003ccode>cascade = ALL\u003c/code> на \u003ccode>Project.tasks\u003c/code> — операции передаются вниз по связи:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>persist(project)\u003c/code> — сохранился и проект, и его новые задачи\u003c/li>\n\u003cli>\u003ccode>remove(project)\u003c/code> — удалился проект \u003cstrong>и его задачи\u003c/strong> (плюс \u003ccode>orphanRemoval\u003c/code>: убрал задачу из списка — она удалилась)\u003c/li>\n\u003c/ul>\n\u003cp>Опасно и удобно одновременно: каскад \u003ccode>ALL\u003c/code> с \u003ccode>remove\u003c/code> может снести больше, чем хотелось. В командных проектах часто ставят точечно: \u003ccode>cascade = {PERSIST, MERGE}\u003c/code>.\u003c/p>\n\u003ch2>Lazy: не тянуть лишнее\u003c/h2>\n\u003cp>\u003ccode>@ManyToOne(fetch = LAZY)\u003c/code> — при загрузке задачи её проект \u003cstrong>не загружается\u003c/strong>: вместо объекта Hibernate кладёт прокси-заглушку. Настоящий SELECT за проектом случится только при первом обращении:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>).orElseThrow();  \u003cspan class=\"hljs-comment\">// SELECT из tasks\u003c/span>\ntask.getProject().getName();                              \u003cspan class=\"hljs-comment\">// SELECT из projects — вот сейчас\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>@OneToMany\u003c/code> по умолчанию ленив (и оставляйте так). \u003ccode>@ManyToOne\u003c/code>/\u003ccode>@OneToOne\u003c/code> по умолчанию жадные (\u003cstrong>EAGER\u003c/strong>) — и это худшее значение по умолчанию в JPA: кладёте \u003ccode>LAZY\u003c/code> руками почти всегда.\u003c/p>\n\u003cp>Почему ленивость важна: без неё чтение одной задачи тянуло бы проект, проект — все его задачи, каждая задача — комментарии… «Взял один объект — загрузил полбазы».\u003c/p>\n\u003ch2>Ловушка LazyInitializationException\u003c/h2>\n\u003cp>Ленивость работает, только пока открыт \u003cstrong>контекст персистентности\u003c/strong> (Hibernate-сессия). Классика Spring:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">business\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n    \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>).orElseThrow();\n    \u003cspan class=\"hljs-keyword\">return\u003c/span> task.getProject().getName();  \u003cspan class=\"hljs-comment\">// ок: сессия открыта\u003c/span>\n}\n\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">broken\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n    \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>).orElseThrow();\n    task.getProject().getName();  \u003cspan class=\"hljs-comment\">// LazyInitializationException!\u003c/span>\n                                     \u003cspan class=\"hljs-comment\">// транзакции нет, сессия закрыта\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Лечение — не «сделать EAGER», а загрузить нужное внутри транзакции (следующий урок — как, через JOIN FETCH).\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> \u003ccode>LazyInitializationException\u003c/code> в логах = код обратился к ленивой связи за пределами транзакции. Это не «база сломалась», это бордер-эффект слоёв: репозиторий отдал объект, а хвостик догрузить некому.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Hibernate генерирует SQL\u003c/h2>\n\u003cp>Что видит база под кодом (включите \u003ccode>spring.jpa.show-sql: true\u003c/code> в деве — и смотрите):\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Код\u003c/th>\n\u003cth>SQL\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>findById(42)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>SELECT ... FROM tasks WHERE id = 42\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>task.getProject().getName()\u003c/code> (lazy)\u003c/td>\n\u003ctd>\u003ccode>SELECT ... FROM projects WHERE id = ?\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>save(newTask)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>INSERT INTO tasks ...\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>изменение managed-entity внутри транзакции\u003c/td>\n\u003ctd>\u003ccode>UPDATE tasks SET ... WHERE id = ?\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Последняя строка — самое неочевидное: в транзакции Hibernate сам сравнивает снимок entity с текущим состоянием (\u003cstrong>dirty checking\u003c/strong>) и сам генерирует UPDATE. Изменил поле — не вызывай \u003ccode>save()\u003c/code>, коммит транзакции всё сохранит.\u003c/p>\n\u003ch2>Идентичность: equals/hashCode\u003c/h2>\n\u003cp>Две загрузки \u003ccode>findById(42)\u003c/code> внутри одной транзакции — \u003cstrong>один и тот же объект\u003c/strong> (кэш первого уровня — сессии). \u003ccode>new Task(42)\u003c/code> и \u003ccode>findById(42)\u003c/code> — разные объекты по Java, но одна строка в базе. Поэтому у entity \u003ccode>equals/hashCode\u003c/code> строят по бизнес-ключу или id, а не по всем полям; в лабах мы этим займёмся.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Связи: владелец — сторона с FK (\u003ccode>@ManyToOne\u003c/code> + \u003ccode>@JoinColumn\u003c/code>), зеркальная — \u003ccode>mappedBy\u003c/code>\u003c/li>\n\u003cli>Каскады передают операции по связи — удобно, но с \u003ccode>remove\u003c/code> осторожно\u003c/li>\n\u003cli>\u003ccode>LAZY\u003c/code> по умолчанию для коллекций, руками — для \u003ccode>@ManyToOne\u003c/code>; иначе «загрузил одно — получил полбазы»\u003c/li>\n\u003cli>Ленивое догружается только в открытой сессии: вне транзакции — \u003ccode>LazyInitializationException\u003c/code>\u003c/li>\n\u003cli>Dirty checking: изменение managed-entity внутри транзакции само становится UPDATE\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — про производительность: знаменитая проблема N+1 и как её лечить.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"У Task есть @ManyToOne @JoinColumn(name = \"project_id\") Project project, а у Project — @OneToMany(mappedBy = \"project\"). Кто владелец связи?","options":["Task: владелец — сторона, где колонка внешнего ключа","Project: у него список","Обе стороны владеют поровну","Никто: связью управляет база"],"correct":0,"explanation":"Владение — про колонку FK: она в tasks, значит владелец Task.project. mappedBy на Project лишь отражает связь, записи в неё не влияют на базу."},{"type":"single","codeLang":"java","code":"@Transactional\npublic String projectName(Long taskId) {\n    Task task = taskRepository.findById(taskId).orElseThrow();\n    return task.getProject().getName();\n}\n","question":"Сколько SELECT-запросов выполнит этот код (связь LAZY, проект не кэширован)?","options":["Два: сначала задача, потом проект при обращении к getName()","Один: Hibernate догрузит всё сразу","Ни одного: вернётся прокси","Три: задача, проект и имя отдельно"],"correct":0,"explanation":"findById — SELECT из tasks. getName() на ленивом прокси — второй SELECT из projects. Внутри транзакции это работает; вне её было бы LazyInitializationException.","codeHtml":"\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">String\u003c/span> \u003cspan class=\"hljs-title function_\">projectName\u003c/span>\u003cspan class=\"hljs-params\">(Long taskId)\u003c/span> {\n    \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(taskId).orElseThrow();\n    \u003cspan class=\"hljs-keyword\">return\u003c/span> task.getProject().getName();\n}\n"},{"type":"multi","question":"Почему @ManyToOne стоит помечать LAZY руками? (несколько ответов)","options":["По умолчанию он EAGER и грузит связанную сущность всегда, даже когда она не нужна","Жадные связи расцветают цепочкой: задача → проект → все его задачи → их комментарии","LAZY ускоряет запись в базу","EAGER ломает схему таблиц"],"correct":[0,1],"explanation":"Проблема EAGER — чтение: тянутся объекты, которые не просили, и каскадом ещё объекты. На запись fetch не влияет."},{"type":"single","question":"В логах продакшена LazyInitializationException. Что произошло?","options":["К коде обратились к ленивой связи после закрытия транзакции/сессии","База данных недоступна","Не хватило памяти под объект","Пароль от базы истёк"],"correct":0,"explanation":"Ленивый прокси умеет догрузиться только пока открыта сессия. Вне транзакции (например, в маппере после выхода из @Transactional-метода) обращение падает с этим исключением."},{"type":"blank","question":"Как называется механизм, при котором Hibernate сам сравнивает состояние entity в сессии с исходным снимком и генерирует UPDATE без явного вызова save()? (два слова: ___ checking)","answers":["dirty checking","dirty"],"explanation":"Dirty checking: «грязное» (изменённое) поле найдено — при коммите транзакции Hibernate сам выполнит UPDATE."},{"type":"single","codeLang":"java","code":"@OneToMany(mappedBy = \"project\", cascade = CascadeType.ALL, orphanRemoval = true)\nprivate List\u003cTask> tasks = new ArrayList\u003c>();\n","question":"Что сделает удаление проекта с такой настройкой?","options":["Удалит проект и все его задачи из базы","Удалит только проект, задачи останутся без проекта (если база позволит)","Удалит только задачи","Ничего: каскад запрещает удаление"],"correct":0,"explanation":"CascadeType.ALL передаёт remove вниз, orphanRemoval добивает «осиротевшие» задачи. Мощно — и опасно: проверяйте, действительно ли вы хотите снести всё поддерево.","codeHtml":"\u003cspan class=\"hljs-meta\">@OneToMany(mappedBy = &quot;project&quot;, cascade = CascadeType.ALL, orphanRemoval = true)\u003c/span>\n\u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Task&gt; \u003cspan class=\"hljs-variable\">tasks\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">ArrayList\u003c/span>&lt;&gt;();\n"},{"type":"match","question":"Сопоставь код и SQL, который сгенерирует Hibernate.","pairs":[{"left":"findById(42L)","right":"SELECT ... WHERE id = 42"},{"left":"repository.save(newTask)","right":"INSERT INTO tasks ..."},{"left":"изменение поля managed-entity в транзакции","right":"UPDATE tasks SET ... при коммите"},{"left":"обращение к ленивому task.getProject()","right":"SELECT ... FROM projects WHERE id = ?"}]}]],"cases":[]},{"id":"m3-lesson-03","title":"N+1 и производительность запросов","module":3,"moduleTitle":"Данные","order":3,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 3. N+1 и производительность запросов\u003c/h1>\n\u003cp>Этот урок — про самую знаменитую производительную болезнь Spring-приложений. Она не видна на локале с десятью строками и выстреливает на проде с десятью тысячами. Умеете видеть N+1 — умеете читать чужие «почему так медленно».\u003c/p>\n\u003ch2>Проблема\u003c/h2>\n\u003cp>Задача: список проектов, у каждого — количество задач. Наивный код:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">List\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-variable\">projects\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> projectRepository.findAll();      \u003cspan class=\"hljs-comment\">// 1 запрос\u003c/span>\n\u003cspan class=\"hljs-keyword\">for\u003c/span> (Project p : projects) {\n    \u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-variable\">n\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> p.getTasks().size();                            \u003cspan class=\"hljs-comment\">// N запросов!\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Что происходит в базе:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">SELECT * FROM projects;                      -- 1 раз\nSELECT * FROM tasks WHERE project_id = 1;    -- для первого проекта\nSELECT * FROM tasks WHERE project_id = 2;    -- для второго\n...\nSELECT * FROM tasks WHERE project_id = N;    -- для N-го\n\u003c/code>\u003c/pre>\n\u003cp>\u003cstrong>1 + N запросов\u003c/strong> — отсюда имя. 50 проектов = 51 поездка в базу. Каждая поездка — сеть, парсинг, план запроса. Локально всё мгновенно, на проде — секунды.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> симптом N+1 — «эндпоинт линейно замедляется с ростом данных» и лес одинаковых SELECT'ов в логах. Включите \u003ccode>spring.jpa.properties.hibernate.generate_statistics=true\u003c/code> на стенде: в логе будет «JDBC statements» — и их количество скажет всё.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Лечение 1: JOIN FETCH\u003c/h2>\n\u003cp>Сказать Hibernate: «грузи задачи сразу вместе с проектами, одним запросом»:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">ProjectRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Project, Long&gt; {\n\n    \u003cspan class=\"hljs-meta\">@Query(&quot;select distinct p from Project p left join fetch p.tasks&quot;)\u003c/span>\n    \u003cspan class=\"hljs-type\">List\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-title function_\">findAllWithTasks\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span>;\n}\n\u003c/code>\u003c/pre>\n\u003cp>Сгенерированный SQL — один: \u003ccode>SELECT ... FROM projects p LEFT JOIN tasks t ON ...\u003c/code>. Прокси не нужны, сессия закрывается — данные уже на месте (заодно решает LazyInitializationException из прошлого урока).\u003c/p>\n\u003cp>\u003ccode>distinct\u003c/code> в JPQL — важная деталь: JOIN размножает строки проектов (проект × каждая задача), Hibernate дедуплицирует.\u003c/p>\n\u003ch2>Лечение 2: @EntityGraph\u003c/h2>\n\u003cp>То же самое без JPQL, декларативно:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">interface\u003c/span> \u003cspan class=\"hljs-title class_\">ProjectRepository\u003c/span> \u003cspan class=\"hljs-keyword\">extends\u003c/span> \u003cspan class=\"hljs-title class_\">JpaRepository\u003c/span>&lt;Project, Long&gt; {\n\n    \u003cspan class=\"hljs-meta\">@EntityGraph(attributePaths = &quot;tasks&quot;)\u003c/span>\n    \u003cspan class=\"hljs-meta\">@Query(&quot;select p from Project p&quot;)\u003c/span>\n    List&lt;Project.findAllWithTasks();   \u003cspan class=\"hljs-comment\">// или совсем без @Query — на derived-методах\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>attributePaths\u003c/code> перечисляет, какие ленивые связи догрузить сразу. Идеально, когда граф фиксированный.\u003c/p>\n\u003ch2>Когда лечить не надо\u003c/h2>\n\u003cp>Если бы нужно только \u003cstrong>количество\u003c/strong> задач — тащить сами задачи расточительно. Правильнее считать в базе:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Query(&quot;select p.name, count(t) from Project p left join p.tasks t group by p.name&quot;)\u003c/span>\n\u003cspan class=\"hljs-type\">List\u003c/span>&lt;Object[]&gt; \u003cspan class=\"hljs-title function_\">projectNameToTaskCount\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span>;   \u003cspan class=\"hljs-comment\">// или сразу в DTO-проекцию\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Правило: \u003cstrong>не тяните в Java то, что база посчитает дешевле\u003c/strong>. COUNT, SUM, сортировка, первая страница — это работа СУБД.\u003c/p>\n\u003ch2>Пагинация на уровне базы\u003c/h2>\n\u003cp>\u003ccode>findAll()\u003c/code> на большой таблице — вернуть миллион строк в память приложения. Пагинация обязательна, и она должна быть \u003cstrong>в SQL\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">Page\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-variable\">page\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> projectRepository.findAll(PageRequest.of(\u003cspan class=\"hljs-number\">0\u003c/span>, \u003cspan class=\"hljs-number\">20\u003c/span>));  \u003cspan class=\"hljs-comment\">// LIMIT 20 OFFSET 0\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Spring Data добавит \u003ccode>LIMIT/OFFSET\u003c/code> и отдельно посчитает тотал. Пагинация стрим-ом в Java (\u003ccode>list.stream().skip(...).limit(...)\u003c/code>) — антипаттерн: все строки уже в памяти.\u003c/p>\n\u003cp>Осторожно с \u003ccode>Page\u003c/code> + \u003ccode>JOIN FETCH\u003c/code> на коллекции: LIMIT в SQL размноженном JOIN'ом режет не проекты, а строки — Hibernate честно предупредит (HHH000104). Для «страница с подтянутой коллекцией» используют два запроса или \u003ccode>@BatchSize\u003c/code>.\u003c/p>\n\u003ch2>@BatchSize: золотая середина\u003c/h2>\n\u003cpre>\u003ccode class=\"language-properties\">\u003cspan class=\"hljs-attr\">spring.jpa.properties.hibernate.default_batch_fetch_size\u003c/span>=\u003cspan class=\"hljs-string\">16\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Вместо N запросов по одному Hibernate соберёт их в пачки \u003ccode>IN (...)\u003c/code>: \u003ccode>SELECT ... WHERE project_id IN (1,2,...,16)\u003c/code>. Из 51 запроса станет ~4. Не идеал одного JOIN'а, но решает проблему массово и без правок каждого запроса.\u003c/p>\n\u003ch2>Как заметить N+1 до прода\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Логи SQL в деве\u003c/strong>: \u003ccode>spring.jpa.show-sql=true\u003c/code> — лес одинаковых SELECT'ов виден глазами\u003c/li>\n\u003cli>\u003cstrong>Статистика Hibernate\u003c/strong> на тестовом стенде: количество statements на запрос\u003c/li>\n\u003cli>\u003cstrong>Тесты данных\u003c/strong>: в лабе этого модуля тест сам посчитает запросы к базе и покраснеет, если их слишком много\u003c/li>\n\u003cli>\u003cstrong>Прод-метрики\u003c/strong>: время ответа растёт с данными — включайте точечный лог медленных запросов\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> если бэкенд отдаёт список медленно — попросите включить SQL-логи. N+1 часто лечится одной аннотацией на репозитории, а «оптимизация фронта» тут бессильна. Теперь вы знаете, как назвать болезнь 🙂\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>N+1: 1 запрос за списком + N за ленивыми связями каждого элемента; локально незаметно, на проде больно\u003c/li>\n\u003cli>Лечение: \u003ccode>JOIN FETCH\u003c/code> в @Query или \u003ccode>@EntityGraph(attributePaths=...)\u003c/code> — один SQL со связью\u003c/li>\n\u003cli>Считать (count/sum/первые N) — в базе, проекциями и агрегатами, не в Java\u003c/li>\n\u003cli>Пагинация — только через \u003ccode>Pageable\u003c/code> (LIMIT/OFFSET в SQL)\u003c/li>\n\u003cli>\u003ccode>default_batch_fetch_size\u003c/code> — массовая полумера: пачки \u003ccode>IN (...)\u003c/code> вместо одиночек\u003c/li>\n\u003cli>Показатель здоровья: количество SQL-запросов на операцию — логи, статистика, тесты\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","codeLang":"java","code":"List\u003cProject> projects = projectRepository.findAll();   // 1\nfor (Project p : projects) {\n    report.add(p.getName() + \": \" + p.getTasks().size()); // связь LAZY\n}\n","question":"В базе 40 проектов. Сколько SQL-запросов сделает этот код?","options":["41: один за проектами и по одному за задачи каждого","1: задачи подгрузятся в том же запросе","40: только запросы за задачами","2: проекты и все задачи одним списком"],"correct":0,"explanation":"Классический 1+N. Обращение к ленивой коллекции каждого проекта — отдельный SELECT. 40 проектов → 1 + 40 = 41 запрос.","codeHtml":"\u003cspan class=\"hljs-type\">List\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-variable\">projects\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> projectRepository.findAll();   \u003cspan class=\"hljs-comment\">// 1\u003c/span>\n\u003cspan class=\"hljs-keyword\">for\u003c/span> (Project p : projects) {\n    report.add(p.getName() + \u003cspan class=\"hljs-string\">&quot;: &quot;\u003c/span> + p.getTasks().size()); \u003cspan class=\"hljs-comment\">// связь LAZY\u003c/span>\n}\n"},{"type":"single","question":"Чем @EntityGraph(attributePaths = \"tasks\") на методе репозитория отличается от JOIN FETCH в @Query?","options":["По сути не отличаются: оба дают одну поездку в базу с LEFT JOIN; EntityGraph — декларативнее, без JPQL","EntityGraph работает только на findAll","JOIN FETCH грузит данные в память приложения, а EntityGraph — в базу","EntityGraph быстрее в 10 раз"],"correct":0,"explanation":"Оба механизма превращают ленивую связь в жадную для конкретного запроса одним SQL. Выбор — стиль команды: аннотация против JPQL."},{"type":"multi","question":"Какие приёмы уменьшат число запросов или нагрузку? (несколько ответов)","options":["hibernate.default_batch_fetch_size=16 — ленивые загрузки пачками IN (...)","Количество задач считать агрегатом в базе, а не getSize() по загруженным задачам","Постранично отдавать через Pageable вместо findAll()","Поставить @ManyToOne обратно EAGER — пусть грузится всегда"],"correct":[0,1,2],"explanation":"EAGER не лечит N+1, а делает его постоянным и неуправляемым: грузит связь даже там, где не просили."},{"type":"single","codeLang":"java","code":"@Query(\"select distinct p from Project p left join fetch p.tasks\")\nList\u003cProject> findAllWithTasks();\n","question":"Зачем здесь distinct?","options":["JOIN размножает строки (проект × задача); distinct просит Hibernate дедуплицировать проекты в памяти","Он добавляет DISTINCT в SQL — иначе не скомпилируется","Он включает пагинацию","Он ускоряет базу за счёт индекса"],"correct":0,"explanation":"В SQL строк действительно больше (это нормально), а distinct — сигнал Hibernate собрать из них уникальные entity. Без него проектов в списке было бы по числу задач.","codeHtml":"\u003cspan class=\"hljs-meta\">@Query(&quot;select distinct p from Project p left join fetch p.tasks&quot;)\u003c/span>\n\u003cspan class=\"hljs-type\">List\u003c/span>&lt;Project&gt; \u003cspan class=\"hljs-title function_\">findAllWithTasks\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span>;\n"},{"type":"single","question":"Нужна страница проектов: 20 штук, у каждого — задачи. Что НЕ так с page + JOIN FETCH на коллекции?","options":["LIMIT/OFFSET режет размноженные JOIN'ом строки: 20 «строк» ≠ 20 проектов — Hibernate предупредит HHH000104","Ничего: это штатная комбинация","JOIN FETCH не работает с Pageable","Страницы нельзя отдавать со связями"],"correct":0,"explanation":"Пагинация с fetch-коллекцией применяется к строкам JOIN, а не к сущностям. Решения: @BatchSize + обычная пагинация, два запроса (страница id → fetch по id) или проекция."},{"type":"blank","question":"Каким словом называется паттерн «1 запрос за списком + N запросов за связями»? (формат: N+1)","answers":["N+1","n+1"],"explanation":"N+1. Первое, что ищут в логах, когда «работало быстро и стало медленно»."},{"type":"single","question":"Эндпоинт «отчёт по проектам» грузит все проекты в память, стримом считает суммы по задачам и сортирует. База — миллион строк. С чего начать?","options":["Перенести агрегацию и сортировку в SQL-проекцию и добавить пагинацию","Поднять памяти под JVM","Добавить кэш на весь отчёт и не трогать код","Разбить отчёт на несколько эндпоинтов"],"correct":0,"explanation":"Миллион строк в память приложения — всегда проигрыш: сеть, GC, время. COUNT/SUM/GROUP BY и LIMIT — работа СУБД; Java получает готовые маленькие цифры."}]],"cases":[]},{"id":"m3-lesson-04","title":"Транзакции и изоляция","module":3,"moduleTitle":"Данные","order":4,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 4. Транзакции и изоляция\u003c/h1>\n\u003cp>\u003ccode>@Transactional\u003c/code> в пилоте был заклинанием «всё или ничего». Теперь — что это значит на самом деле: ACID, уровни изоляции, аномалии гонок и блокировки. Это урок про то, что происходит, когда два пользователя жмут кнопку одновременно.\u003c/p>\n\u003ch2>ACID: четыре обещания транзакции\u003c/h2>\n\u003cp>\u003cstrong>Атомарность\u003c/strong> — всё или ничего: упало на середине — откат целиком.\n\u003cstrong>Согласованность\u003c/strong> — данные переходят из одного корректного состояния в другое: инварианты (сумма списания = сумме зачисления) не нарушаются.\n\u003cstrong>Изоляция\u003c/strong> — параллельные транзакции не видят чужие полусырые изменения.\n\u003cstrong>Долговечность\u003c/strong> — commit записан — переживёт перезагрузку сервера.\u003c/p>\n\u003cp>Spring-разработчик чаще всего сталкивается с А (откат) и I (гонки). Ими и займёмся.\u003c/p>\n\u003ch2>@Transactional: границы — это и есть смысл\u003c/h2>\n\u003cp>Транзакцию открывает \u003cstrong>первый\u003c/strong> запрос к базе внутри метода и закрывает коммит/откат на выходе:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">transfer\u003c/span>\u003cspan class=\"hljs-params\">(Long from, Long to, BigDecimal amount)\u003c/span> {\n    accountRepository.withdraw(from, amount);   \u003cspan class=\"hljs-comment\">// BEGIN\u003c/span>\n    \u003cspan class=\"hljs-keyword\">if\u003c/span> (кредитный лимит нарушен) {\n        \u003cspan class=\"hljs-keyword\">throw\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">IllegalStateException\u003c/span>(...);   \u003cspan class=\"hljs-comment\">// ROLLBACK: списание отменено\u003c/span>\n    }\n    accountRepository.deposit(to, amount);      \u003cspan class=\"hljs-comment\">// COMMIT на выходе\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Правила, которые экономят часы дебага:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Только публичные методы\u003c/strong> через прокси — вызов \u003ccode>this.transfer(...)\u003c/code> из другого метода того же класса транзакции \u003cstrong>не откроет\u003c/strong> (вызов мимо прокси)\u003c/li>\n\u003cli>Исключение \u003cstrong>unchecked\u003c/strong> (RuntimeException) → откат; \u003cstrong>checked\u003c/strong> → по умолчанию коммит (сюрприз! настраивается \u003ccode>rollbackFor\u003c/code>)\u003c/li>\n\u003cli>\u003ccode>readOnly = true\u003c/code> — «только чтение»: БД и Hibernate могут оптимизировать; вешайте на выборки\u003c/li>\n\u003cli>Транзакция должна быть \u003cstrong>короткой\u003c/strong>: внутри не делают HTTP-вызовы и не спят — соединение с базой занято\u003c/li>\n\u003c/ul>\n\u003ch2>Гонки: два одинаковых запроса одновременно\u003c/h2>\n\u003cp>Изоляция по умолчанию в PostgreSQL — READ COMMITTED: транзакция видит закоммиченные чужие изменения. Это быстро, но порождает гонки:\u003c/p>\n\u003cp>\u003cstrong>Потерянный подсчёт.\u003c/strong> Остаток товара = 1. Два покупателя жмут «купить» одновременно:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">T1: читает остаток = 1      T2: читает остаток = 1\nT1: остаток = 0, commit     T2: остаток = 0, commit\n\u003c/code>\u003c/pre>\n\u003cp>Обе транзакции прошли, продан один товар — а купили два. READ COMMITTED не спас: каждая видела согласованную картину.\u003c/p>\n\u003cp>\u003cstrong>Решение 1 — пессимистичная блокировка\u003c/strong>: «захватить строку себе»:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Lock(LockModeType.PESSIMISTIC_WRITE)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Query(&quot;select i from Item i where i.id = :id&quot;)\u003c/span>\n\u003cspan class=\"hljs-type\">Optional\u003c/span>&lt;Item&gt; \u003cspan class=\"hljs-title function_\">findByIdForUpdate\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Param(&quot;id&quot;)\u003c/span> Long id)\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cp>Первый читатель блокирует строку: второй ждёт. \u003ccode>SELECT ... FOR UPDATE\u003c/code> — надёжно, но очередь при горячих строках.\u003c/p>\n\u003cp>\u003cstrong>Решение 2 — оптимистичная блокировка\u003c/strong>: версия вместо блокировки:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Version\u003c/span>\n\u003cspan class=\"hljs-keyword\">private\u003c/span> Long version;   \u003cspan class=\"hljs-comment\">// Hibernate: UPDATE ... WHERE id=? AND version=?\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Обе транзакции читают версию 5; первая коммитит (версия → 6); вторая при UPDATE «не нашла» свою версию → \u003ccode>OptimisticLockException\u003c/code> → повторить. Не держит блокировки, идеальна для UI-конфликтов («данные изменил другой пользователь»).\u003c/p>\n\u003cp>\u003cstrong>Решение 3 — атомарный UPDATE\u003c/strong>, когда результат не зависит от прочитанного:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Modifying\u003c/span> \u003cspan class=\"hljs-meta\">@Query(&quot;update Item i set i.qty = i.qty - 1 where i.id = :id and i.qty &gt; 0&quot;)\u003c/span>\n\u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-title function_\">tryDecrement\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Param(&quot;id&quot;)\u003c/span> Long id)\u003c/span>;   \u003cspan class=\"hljs-comment\">// вернёт 0, если не вышло\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>База сама гарантирует: ровно одна параллельная транзакция успеет. Часто это самый простой и честный путь.\u003c/p>\n\u003ch2>Уровни изоляции (шпаргалка)\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Уровень\u003c/th>\n\u003cth>Аномалии\u003c/th>\n\u003cth>Комментарий\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>READ UNCOMMITTED\u003c/td>\n\u003ctd>грязное чтение\u003c/td>\n\u003ctd>почти не используется\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>READ COMMITTED\u003c/td>\n\u003ctd>неповторяемое чтение, фантомы\u003c/td>\n\u003ctd>\u003cstrong>дефолто Postgres\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REPEATABLE READ\u003c/td>\n\u003ctd>фантомы\u003c/td>\n\u003ctd>дефолт MySQL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SERIALIZABLE\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>как последовательное выполнение; медленно\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Аномалии: \u003cstrong>грязное чтение\u003c/strong> — чужие незакоммиченные данные; \u003cstrong>неповторяемое чтение\u003c/strong> — два чтения одной строки дают разное; \u003cstrong>фантомы\u003c/strong> — повторный запрос возвращает другой набор строк.\u003c/p>\n\u003cp>Поднимать уровень изоляции «на всякий случай» — антипаттерн: каждый уровень дороже. Правильный инструмент под конкретную гонку: блокировка, версия или атомарный UPDATE.\u003c/p>\n\u003ch2>Распространённые ошибки\u003c/h2>\n\u003cul>\n\u003cli>Транзакция ради транзакции на каждом методе — пул соединений кончается\u003c/li>\n\u003cli>HTTP-вызов внутри транзакции — соединение занято на секунды\u003c/li>\n\u003cli>\u003ccode>@Transactional\u003c/code> на private методе или внутреннем вызове — молча не работает\u003c/li>\n\u003cli>Решение гонок сном (\u003ccode>Thread.sleep(100)\u003c/code>) — «иногда помогает» — нет\u003c/li>\n\u003cli>Долгая транзакция на «импорт файла на 100к строк» — держит блокировки; батчами и короткими транзакциями\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> гонки не ловятся одиночным тестом — ловятся параллельными: два потока одновременно на один остаток, повторные отправки формы, двойной клик по кнопке. «Задвоение данных при двойном клике» — самый частый прод-тикет из этой серии.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>ACID; на практике ломаются А (откат) и I (гонки)\u003c/li>\n\u003cli>\u003ccode>@Transactional\u003c/code>: границы = метод, публичный вызов через прокси, unchecked → откат, короткая жизнь\u003c/li>\n\u003cli>READ COMMITTED (дефолт PG) не защищает от гонок чтение-запись\u003c/li>\n\u003cli>Инструменты: пессимистичная блокировка (ждать), \u003ccode>@Version\u003c/code> (повторить), атомарный UPDATE (база сама)\u003c/li>\n\u003cli>Уровни изоляции не «на всякий случай», а под конкретную аномалию\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Метод @Transactional выбросил IOException (checked). Что произойдёт с изменениями по умолчанию?","options":["Закоммитится: откат по умолчанию только для RuntimeException","Откатится: любое исключение = откат","Транзакция зависнет навсегда","Зависит от фазы луны"],"correct":0,"explanation":"Сюрприз JPA по умолчанию: откат — на unchecked. Для checked добавляют rollbackFor = IOException.class. Проверяется тестом за две минуты."},{"type":"single","codeLang":"java","code":"@Service\npublic class OrderService {\n    public void handle(Long id) {\n        this.cancelIfNeeded(id);   // вызов изнутри класса\n    }\n\n    @Transactional\n    public void cancelIfNeeded(Long id) { ... }\n}\n","question":"Почему транзакция в cancelIfNeeded НЕ откроется при вызове handle извне?","options":["@Transactional работает через прокси; внутренний вызов this идёт мимо прокси","Метод слишком длинный","Нужен параметр rollbackFor","Транзакции не работают в Service-слое"],"correct":0,"explanation":"Spring оборачивает бин прокси-обёрткой; аннотацию видит только вызов через бин. this.cancelIfNeeded — обычный Java-вызов, мимо обёртки. Классика code review.","codeHtml":"\u003cspan class=\"hljs-meta\">@Service\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">handle\u003c/span>\u003cspan class=\"hljs-params\">(Long id)\u003c/span> {\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.cancelIfNeeded(id);   \u003cspan class=\"hljs-comment\">// вызов изнутри класса\u003c/span>\n    }\n\n    \u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">cancelIfNeeded\u003c/span>\u003cspan class=\"hljs-params\">(Long id)\u003c/span> { ... }\n}\n"},{"type":"single","question":"Остаток = 1, два покупателя покупают одновременно в READ COMMITTED. Почему обе транзакции проходят?","options":["Каждая видит согласованную (закоммиченную) картину «остаток = 1» — конфликта на чтении нет, а UPDATE обе делают из своего видения","READ COMMITTED не пишет в базу","Postgres не поддерживает параллелизм","Транзакции слишком короткие для проверки"],"correct":0,"explanation":"READ COMMITTED изолирует от грязных данных, но не от гонки «прочитал-проверил-записал». Нужны блокировка, @Version или атомарный UPDATE с условием qty > 0."},{"type":"multi","question":"Какие способы честно разрулить гонку на один остаток? (несколько ответов)","options":["PESSIMISTIC_WRITE: SELECT FOR UPDATE — второй покупатель ждёт","@Version и OptimisticLockException с повтором при конфликте","Атомарный UPDATE ... SET qty = qty - 1 WHERE qty > 0 — по числу обновлённых строк","Thread.sleep(200) перед покупкой"],"correct":[0,1,2],"explanation":"Сон не устраняет гонку — только сдвигает её. Остальные три — стандартный арсенал; выбор зависит от контенции: горячая строка — версия/атомарный апдейт, сложная логика — блокировка."},{"type":"blank","question":"Какая буква ACID означает «транзакция выполняется целиком или никак»? (одна буква)","answers":["A","а"],"explanation":"Atomicity — атомарность. I (Isolation) — про параллельность, D (Durability) — про выживание после перезагрузки."},{"type":"match","question":"Сопоставь аномалию изоляции и её описание.","pairs":[{"left":"Грязное чтение","right":"Видны незакоммиченные чужие изменения"},{"left":"Неповторяемое чтение","right":"Два чтения одной строки дают разные значения"},{"left":"Фантомы","right":"Повторный запрос возвращает другой набор строк"},{"left":"Потерянное обновление","right":"Две транзакции перезаписали одно значение, одна правка исчезла"}]},{"type":"single","question":"Внутри @Transactional-метода дёргается внешний HTTP-API, отвечающий 3 секунды. В чём проблема?","options":["Транзакция (и соединение из пула) держится 3+ секунды впустую — под нагрузкой пул иссякнет","HTTP нельзя вызывать из Java","Нарушается атомарность немедленно","Проблем нет: соединение ничего не делает"],"correct":0,"explanation":"Правило: транзакция короткая, внешние вызовы — за её границами. Сначала HTTP, потом короткая транзакция с записью результата."}]],"cases":[]},{"id":"m3-lesson-05","title":"Миграции и прод: Liquibase","module":3,"moduleTitle":"Данные","order":5,"baseOrder":null,"lab":{"title":"Лаба 5. Связи и миграции","description":"Написать changeset v2 (таблица tasks с FK) и связать entity двусторонней связью с каскадами. Проверка — 4 теста: схема, FK, связи, каскад.","branch":"lab-5","branchSolution":"lab-5-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 5. Миграции и прод: Liquibase\u003c/h1>\n\u003cp>В лабах мы использовали \u003ccode>ddl-auto: create-drop\u003c/code>: Hibernate сам создавал схему и сам её убивал. Это удобно для песочницы и недопустимо в проде: там схема — не побочный эффект кода, а управляемая история изменений. Этим занимается \u003cstrong>Liquibase\u003c/strong>.\u003c/p>\n\u003ch2>Почему не ddl-auto\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003ccode>ddl-auto: create/update\u003c/code>\u003c/th>\n\u003cth>Миграции\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Что происходит\u003c/td>\n\u003ctd>Hibernate создаёт/дописывает схему при старте по entity\u003c/td>\n\u003ctd>Схема изменяется явно перечисленными шагами\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Контроль\u003c/td>\n\u003ctd>«Как получится»: переименовал поле — Hibernate создаст новое, старое останется\u003c/td>\n\u003ctd>Каждый шаг описан и прошел ревью\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Откаты\u003c/td>\n\u003ctd>Нет\u003c/td>\n\u003ctd>У changeset'ов есть rollback-стратегия\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>История\u003c/td>\n\u003ctd>Отсутствует\u003c/td>\n\u003ctd>Кто, когда, что и зачем — в таблице changelog\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Прод\u003c/td>\n\u003ctd>Запрещён\u003c/td>\n\u003ctd>Стандарт\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Главный риск \u003ccode>update\u003c/code>: он умеет \u003cstrong>добавлять\u003c/strong>, но не умеет переименовывать и удалять. Переименовали \u003ccode>name\u003c/code> в \u003ccode>full_name\u003c/code> — получили обе колонки: старая с данными, новая пустая. И никто не узнает, когда это случилось.\u003c/p>\n\u003ch2>Liquibase: changelog и changeset\u003c/h2>\n\u003cp>История изменений — XML/YAML/SQL-файл, \u003cstrong>changeset — один атомарный шаг\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-comment\"># src/main/resources/db/changelog/db.changelog-master.yaml\u003c/span>\n\u003cspan class=\"hljs-attr\">databaseChangeLog:\u003c/span>\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">include:\u003c/span>\n      \u003cspan class=\"hljs-attr\">file:\u003c/span> \u003cspan class=\"hljs-string\">db/changelog/v1-init-schema.yaml\u003c/span>\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">include:\u003c/span>\n      \u003cspan class=\"hljs-attr\">file:\u003c/span> \u003cspan class=\"hljs-string\">db/changelog/v2-add-deadline-index.yaml\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-comment\"># v1-init-schema.yaml\u003c/span>\n\u003cspan class=\"hljs-attr\">databaseChangeLog:\u003c/span>\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">changeSet:\u003c/span>\n      \u003cspan class=\"hljs-attr\">id:\u003c/span> \u003cspan class=\"hljs-string\">create-projects\u003c/span>\n      \u003cspan class=\"hljs-attr\">author:\u003c/span> \u003cspan class=\"hljs-string\">dbelokursky\u003c/span>\n      \u003cspan class=\"hljs-attr\">changes:\u003c/span>\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">createTable:\u003c/span>\n            \u003cspan class=\"hljs-attr\">tableName:\u003c/span> \u003cspan class=\"hljs-string\">projects\u003c/span>\n            \u003cspan class=\"hljs-attr\">columns:\u003c/span>\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">id\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">bigint\u003c/span>, \u003cspan class=\"hljs-attr\">autoIncrement:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">primaryKey:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span> } }\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">name\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">varchar(100)\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> } }\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">changeSet:\u003c/span>\n      \u003cspan class=\"hljs-attr\">id:\u003c/span> \u003cspan class=\"hljs-string\">create-tasks\u003c/span>\n      \u003cspan class=\"hljs-attr\">author:\u003c/span> \u003cspan class=\"hljs-string\">dbelokursky\u003c/span>\n      \u003cspan class=\"hljs-attr\">changes:\u003c/span>\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">createTable:\u003c/span>\n            \u003cspan class=\"hljs-attr\">tableName:\u003c/span> \u003cspan class=\"hljs-string\">tasks\u003c/span>\n            \u003cspan class=\"hljs-attr\">columns:\u003c/span>\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">id\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">bigint\u003c/span>, \u003cspan class=\"hljs-attr\">autoIncrement:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">primaryKey:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span> } }\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">project_id\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">bigint\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>, \u003cspan class=\"hljs-attr\">referencedTableName:\u003c/span> \u003cspan class=\"hljs-string\">projects\u003c/span>, \u003cspan class=\"hljs-attr\">referencedColumnNames:\u003c/span> \u003cspan class=\"hljs-string\">id\u003c/span>, \u003cspan class=\"hljs-attr\">foreignKeyName:\u003c/span> \u003cspan class=\"hljs-string\">fk_tasks_project\u003c/span> } }\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">title\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">varchar(200)\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> } }\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">done\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">boolean\u003c/span>, \u003cspan class=\"hljs-attr\">defaultValueBoolean:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> } }\n\u003c/code>\u003c/pre>\n\u003cp>При старте приложения Liquibase:\u003c/p>\n\u003col>\n\u003cli>Смотрит в служебную таблицу \u003ccode>DATABASECHANGELOG\u003c/code>: какие changeset'ы уже применены\u003c/li>\n\u003cli>Применяет \u003cstrong>только новые\u003c/strong>, по порядку, каждый в транзакции\u003c/li>\n\u003cli>Записывает, кто/когда/чек-сумма\u003c/li>\n\u003c/ol>\n\u003cp>Изменения кода review'ятся, изменения схемы — тоже: PR в changelog = ревью миграции до прода.\u003c/p>\n\u003ch2>Правила боевых миграций\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Changeset неизменен после применения.\u003c/strong> Поправил уже применённый changeset — чек-сумма не совпадёт, Liquibase откажется стартовать. Новое изменение = новый changeset.\u003c/li>\n\u003cli>\u003cstrong>Один changeset — одно изменение.\u003c/strong> Откатить/повторить точечно проще.\u003c/li>\n\u003cli>\u003cstrong>Expand → contract\u003c/strong> для опасных изменений. Убрать колонку, пока её читает старая версия приложения:\n\u003cul>\n\u003cli>v102 (expand): добавить новую колонку, начать писать в обе\u003c/li>\n\u003cli>выкатить код, который читает только новую; подождать, пока старые инстансы уйдут\u003c/li>\n\u003cli>v107 (contract): удалить старую колонку\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Данные мигрируем кодом миграций\u003c/strong>, не «руками в базе»: \u003ccode>sql\u003c/code>-changeset с UPDATE — нормально.\u003c/li>\n\u003cli>Индексы на больших таблицах — с оговорками СУБД (\u003ccode>CREATE INDEX CONCURRENTLY\u003c/code> в Postgres).\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> миграции — тестируемый артефакт: если changelog применяется на чистой базе в CI (Testcontainers), то и на стейджинге применится. Проверяйте миграции на копии прод-данных: «схема применилась, а данные не влезли в NOT NULL» — классика.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитики:\u003c/strong> changeset'ы — это история схемы с авторами и датами. Требование «поле обязательно» (= NOT NULL) — это не комментарий в коде, а миграция, которая на глазах изменила правила игры: после неё пустых значений не будет. Участвуйте в ревью таких миграций.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Подключение в Spring Boot\u003c/h2>\n\u003cpre>\u003ccode class=\"language-xml\">\u003cspan class=\"hljs-tag\">&lt;\u003cspan class=\"hljs-name\">dependency\u003c/span>&gt;\u003c/span>\n    \u003cspan class=\"hljs-tag\">&lt;\u003cspan class=\"hljs-name\">groupId\u003c/span>&gt;\u003c/span>org.springframework.boot\u003cspan class=\"hljs-tag\">&lt;/\u003cspan class=\"hljs-name\">groupId\u003c/span>&gt;\u003c/span>\n    \u003cspan class=\"hljs-tag\">&lt;\u003cspan class=\"hljs-name\">artifactId\u003c/span>&gt;\u003c/span>spring-boot-starter-liquibase\u003cspan class=\"hljs-tag\">&lt;/\u003cspan class=\"hljs-name\">artifactId\u003c/span>&gt;\u003c/span>\n\u003cspan class=\"hljs-tag\">&lt;/\u003cspan class=\"hljs-name\">dependency\u003c/span>&gt;\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>В Boot 4 автоконфигурация Liquibase живёт в отдельном стартере: голый\n\u003ccode>org.liquibase:liquibase-core\u003c/code> на classpath ничего не запустит — база останется пустой.\u003c/p>\n\u003c/blockquote>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">spring:\u003c/span>\n  \u003cspan class=\"hljs-attr\">jpa:\u003c/span>\n    \u003cspan class=\"hljs-attr\">hibernate:\u003c/span>\n      \u003cspan class=\"hljs-attr\">ddl-auto:\u003c/span> \u003cspan class=\"hljs-string\">validate\u003c/span>   \u003cspan class=\"hljs-comment\"># schema создаёт Liquibase; Hibernate только ПРОВЕРЯЕТ соответствие\u003c/span>\n  \u003cspan class=\"hljs-attr\">liquibase:\u003c/span>\n    \u003cspan class=\"hljs-attr\">change-log:\u003c/span> \u003cspan class=\"hljs-string\">classpath:db/changelog/db.changelog-master.yaml\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Золотая пара: \u003cstrong>Liquibase создаёт схему, \u003ccode>ddl-auto: validate\u003c/code> сверяет entity со схемой\u003c/strong> при старте. Расхождение — приложение не стартует: ошибка найдена на деплое, а не в рантайме.\u003c/p>\n\u003ch2>Тесты с базой: Testcontainers за одну строку\u003c/h2>\n\u003cp>Модуль закрывает логика: лабы используют H2 — быстро и без инфраструктуры. Но H2 — не PostgreSQL: диалекты различаются. Честные интеграционные тесты поднимают \u003cstrong>настоящую\u003c/strong> базу в Docker через \u003cstrong>Testcontainers\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Testcontainers\u003c/span>\n\u003cspan class=\"hljs-meta\">@SpringBootTest\u003c/span>\n\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">TaskRepositoryIT\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Container\u003c/span>\n    \u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-type\">PostgreSQLContainer\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-variable\">postgres\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">PostgreSQLContainer\u003c/span>&lt;&gt;(\u003cspan class=\"hljs-string\">&quot;postgres:17&quot;\u003c/span>);\n}\n\u003c/code>\u003c/pre>\n\u003cp>Контейнер стартует на время тестов, Liquibase накатывает миграции, тесты гоняются на настоящем PostgreSQL. Медленнее H2, зато диалект, индексы и блокировки — настоящие. В командной практике: юнит-логика на H2/моках, репозитории и миграции — на Testcontainers.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Схема прода управляется миграциями, не \u003ccode>ddl-auto\u003c/code>: история, ревью, откаты\u003c/li>\n\u003cli>Changeset — атомарный шаг; применённый changeset не редактируют — добавляют новый\u003c/li>\n\u003cli>Опасные изменения — по схеме expand → contract\u003c/li>\n\u003cli>\u003ccode>ddl-auto: validate\u003c/code> + Liquibase: расхождение entity и схемы валит старт — так и задумано\u003c/li>\n\u003cli>H2 — для быстрых лаб; Testcontainers — для честных тестов на настоящем PostgreSQL\u003c/li>\n\u003c/ul>\n\u003cp>Модуль «Данные» пройден: SQL-фундамент, entity-связи, N+1, транзакции, миграции. Экзамен и кейс — впереди.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Разработчик переименовал колонку name в full_name и задеплоил с ddl-auto: update. Что случится с базой?","options":["Появится новая пустая колонка full_name, старая name останется с данными: update не умеет переименовывать","Колонка аккуратно переименуется","База откатится к прошлой версии","Hibernate спросит подтверждение у разработчика"],"correct":0,"explanation":"Update только добавляет. «Переименование» превращается в новую пустую колонку при живой старой — данные и код молча расходятся. Поэтому в проде — миграции."},{"type":"multi","question":"Что даёт таблица DATABASECHANGELOG? (несколько ответов)","options":["Знает, какие changeset'ы уже применены — повторного применения не будет","Хранит автора и время каждого изменения","Хранит чек-сумму: правка уже применённого changeset'а будет замечена","Автоматически откатывает любые изменения"],"correct":[0,1,2],"explanation":"Это журнал применённых изменений и детектор вмешательства. Откат — отдельная история (rollback у changeset'а или обратная миграция), автоматически «любые» не откатываются."},{"type":"single","question":"Нужно переименовать колонку, которую читает работающая версия приложения. Какой порядок безопасен?","options":["Expand: добавить новую и писать в обе → выкатить код на новую → подождать ухода старых инстансов → contract: удалить старую","Сразу переименовать в одной миграции и перезапустить приложение","Удалить старую колонку, потом добавить новую","Ничего не делать: колонки нельзя переименовывать"],"correct":0,"explanation":"Expand-contract сводит окно несовместимости к нулю: в любой момент есть схема, с которой живёт и старый, и новый код."},{"type":"single","question":" ddl-auto: validate + Liquibase. Разработчик добавил в entity поле, но забыл миграцию. Что произойдёт?","options":["Приложение не стартует: Hibernate не найдёт колонку в схеме — ошибка обнаружена сразу","Приложение стартует, поле всегда null","Liquibase автоматически создаст колонку по entity","Ничего: validate ни на что не влияет"],"correct":0,"explanation":"Validate сверяет entity со схемой и валирует старт при расхождении. Это переносит ошибку из «тихого рантайм-бага» в громкий отказ на деплое."},{"type":"blank","question":"Как называется атомарный единичный шаг изменения схемы в Liquibase? (одно слово)","answers":["changeset","changeSet","чейнджсет"],"explanation":"ChangeSet: id + author + изменения. Применяется один раз, транзакционно, неизменен после применения."},{"type":"match","question":"Сопоставь инструмент и его роль.","pairs":[{"left":"ddl-auto: create-drop","right":"Песочница: схема создаётся и умирает с приложением"},{"left":"Liquibase","right":"Управляемая история изменений схемы"},{"left":"ddl-auto: validate","right":"Страховка: entity должен совпадать со схемой"},{"left":"Testcontainers","right":"Настоящий PostgreSQL в тестах через Docker"}]},{"type":"single","question":"Чем тесты на Testcontainers принципиально лучше тестов на H2 для репозиториев?","options":["Тестируется настоящий PostgreSQL: диалект SQL, индексы, блокировки, миграции — как в проде","Они быстрее H2","Они не требуют Docker","H2 не поддерживает SQL"],"correct":0,"explanation":"H2 быстро и удобно для логики, но это другая СУБД: SQL-диалект и поведение блокировок отличаются. Testcontainers медленнее и требует Docker — зато честно."}]],"cases":[]},{"id":"m3-exam","title":"Экзамен модуля и кейс","module":3,"moduleTitle":"Данные","order":6,"baseOrder":null,"lab":null,"html":"\u003ch1>Экзамен модуля «Данные»\u003c/h1>\n\u003cp>Пять уроков: SQL-фундамент, entity-связи, N+1, транзакции, миграции. Схема финала та же: сначала кейс своими словами, потом 15 вопросов, порог 80%.\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","topic":"m3-lesson-01","question":"Колонка tasks.project_id ссылается на projects.id. Что защищает FOREIGN KEY?","options":["Нельзя вставить задачу с project_id, которого нет в projects","Нельзя удалить проект — никогда и ни при каких условиях","Запросы по project_id всегда быстрые","Таблицы шифруются"],"correct":0,"explanation":"FK — ссылочная целостность на вставку/обновление. Удаление проекта с задачами СУБД запретит или каскадно обработает — по правилу ON DELETE, которое задаётся отдельно."},{"type":"single","topic":"m3-lesson-01","codeLang":"sql","code":"SELECT p.name, COUNT(t.id) AS open_cnt\nFROM projects p\nLEFT JOIN tasks t ON t.project_id = p.id AND t.done = false\nGROUP BY p.name;\n","question":"Чем этот запрос отличается от INNER JOIN с тем же условием?","options":["LEFT JOIN вернёт и проекты без открытых задач (со значением 0), INNER — только проекты, где они есть","Ничем: JOIN всегда одинаковый","LEFT JOIN не поддерживает условие в ON","INNER JOIN быстрее всегда"],"correct":0,"explanation":"LEFT JOIN сохраняет левую сторону: проектов без пары COUNT(t.id) посчитает 0. INNER JOIN выкинет их. «Отчёт, где исчезли пустые проекты» — типичный баг замены JOIN'а.","codeHtml":"\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name, \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(t.id) \u003cspan class=\"hljs-keyword\">AS\u003c/span> open_cnt\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> projects p\n\u003cspan class=\"hljs-keyword\">LEFT\u003c/span> \u003cspan class=\"hljs-keyword\">JOIN\u003c/span> tasks t \u003cspan class=\"hljs-keyword\">ON\u003c/span> t.project_id \u003cspan class=\"hljs-operator\">=\u003c/span> p.id \u003cspan class=\"hljs-keyword\">AND\u003c/span> t.done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>\n\u003cspan class=\"hljs-keyword\">GROUP\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> p.name;\n"},{"type":"multi","topic":"m3-lesson-03","question":"Признаки N+1 в приложении? (несколько ответов)","options":["В SQL-логах лес однотипных SELECT ... WHERE id = ? / project_id = ?","Эндпоинт замедляется пропорционально числу записей","Локально быстро, на проде с большими данными — медленно","База занимает мало места"],"correct":[0,1,2],"explanation":"N+1 — линейная зависимость числа запросов от данных. Три симптома вместе — почти диагноз; подтверждается статистикой Hibernate или счётчиком запросов."},{"type":"single","topic":"m3-lesson-03","question":"Какой запрос решит «проекты с количеством задач» за одну поездку в базу, не грузя задачи?","options":["Проекция: select p.name, count(t) from Project p left join p.tasks t group by p.name","findAll() проектов + getSize() по задачам с JOIN FETCH","findAll() и цикл с getTasks().size()","Кэш всех задач в памяти приложения"],"correct":0,"explanation":"Считать должна база: агрегат с GROUP BY вернёт готовые цифры. JOIN FETCH здесь даже вреден — он тащит все задачи, чтобы их посчитать в Java."},{"type":"single","topic":"m3-lesson-02","codeLang":"java","code":"@Transactional\npublic void complete(Long id) {\n    Task task = taskRepository.findById(id).orElseThrow();\n    task.setDone(true);\n    // save() не вызывается\n}\n","question":"Сохранится ли done = true в базе после завершения метода?","options":["Да: dirty checking внутри транзакции сам сгенерирует UPDATE при коммите","Нет: без save() изменения потеряются","Только если task был загружен в другом методе","Зависит от версии Hibernate"],"correct":0,"explanation":"Managed-entity в открытой сессии сравнивается со снимком; изменённое поле даёт UPDATE при коммите. Явный save() для управляемых сущностей не нужен.","codeHtml":"\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">complete\u003c/span>\u003cspan class=\"hljs-params\">(Long id)\u003c/span> {\n    \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(id).orElseThrow();\n    task.setDone(\u003cspan class=\"hljs-literal\">true\u003c/span>);\n    \u003cspan class=\"hljs-comment\">// save() не вызывается\u003c/span>\n}\n"},{"type":"single","topic":"m3-lesson-02","question":"@ManyToOne со значением EAGER: чем опасно?","options":["Связанная сущность грузится всегда и везде, раздувая каждый запрос и цепляясь каскадом дальше","EAGER ломает компиляцию","EAGER отключает индексы","Ничем: это значение по умолчанию, значит безопасно"],"correct":0,"explanation":"Дефолт — не синоним «правильно». EAGR тянет связь даже там, где не просят; ставьте LAZY и догружайте точечно (FETCH/EntityGraph)."},{"type":"blank","topic":"m3-lesson-02","question":"Какое исключение получит код, обратившийся к ленивой связи ПОСЛЕ закрытия транзакции? (три слова, Latent... нет — просто назовите: LazyInitialization...)","answers":["LazyInitializationException","lazyinitializationexception"],"explanation":"LazyInitializationException: прокси не может догрузить данные в закрытой сессии. Лечение — загрузить связь внутри транзакции."},{"type":"single","topic":"m3-lesson-04","question":"Две транзакции параллельно уменьшают остаток (qty=1) обычным «прочитал-проверил-записал». Сколько товара будет продано?","options":["Два — каждая транзакция видела остаток 1 и прошла успешно: классическая гонка","Один: Postgres не позволит вторую","Ноль: о
