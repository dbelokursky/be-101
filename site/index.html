ervice в одной группе читают topic из 4 партиций. Сколько событий получит каждый?","options":["Примерно по половине: партиции делятся внутри группы, каждое событие — ровно одному инстансу группы","Оба получат все события","Зависит от ключей: один — все, второй — ничего","Поровну по 4 каждому"],"correct":0,"explanation":"Внутри группы topic — очередь: партиции распределены, события не дублируются. Все события — только у консюмеров РАЗНЫХ групп."},{"type":"single","question":"Обработчик батча работает дольше max.poll.interval.ms. Что происходит?","options":["Консюмер считается умершим: ребаланс, партиции уходят другим, а потом возвращаются — вечный цикл отставания","Ничего: интервал продлевается автоматически","Батч обрезается","Kafka ускоряет обработчик"],"correct":0,"explanation":"max.poll.interval.ms — это «сердцебиение» обработки. Медленный обработчик роняет членство → ребалансы → стоп-эффект. Лечение: меньше батчи/быстрее обработка/тяжёлое наружу."},{"type":"multi","question":"Что может завести событие в DLT? (несколько ответов)","options":["Невалидный JSON события","Неожожданное состояние: событие ссылается на несуществующую сущность","Долгая, но успешная обработка","Исключение в обработчике, не прошедшее за N попыток"],"correct":[0,1,3],"explanation":"DLT — для событий, которые нельзя обработать после ретраев. Медленная успешная обработка — про производительность, а не про яд."},{"type":"match","question":"Сопоставьте термин консюмера и смысл.","pairs":[{"left":"Consumer group","right":"Набор инстансов, делящих партиции topic'а"},{"left":"Offset commit","right":"Фиксация «дочитал досюда» за группой"},{"left":"Rebalance","right":"Перераспределение партиций при смене состава группы"},{"left":"Лаг (lag)","right":"Отставание группы от хвоста лога"}]},{"type":"single","question":"Листенер закоммитил offset ДО обработки, обработка упала. Что стало с событием?","options":["Потеряно: после рестарта чтение продолжится со следующего","Ничего: вернётся при следующем poll","Уедет в DLT","Задублируется"],"correct":0,"explanation":"Именно поэтому Spring коммитит после успешного метода: ценой возможного дубля исключается потеря. Дубль лечится идемпотентностью, потеря — ничем."},{"type":"blank","question":"Как называется topic-кладбище для событий, не поддавшихся обработке после всех ретраев? (аббревиатура)","answers":["DLT","dead letter topic","длт"],"explanation":"Dead Letter Topic. С суффиксом .DLT, с алертами на глубину и регулярным разбором — рабочий инструмент, а не мусорка."},{"type":"single","question":"Метрика здоровья консюмера, которую смотрят первыми: что и почему?","options":["Лаг группы: отставание от хвоста лога — растёт, значит не успеваем за потоком","Число продюсеров","Размер topic'а в гигабайтах","Количество партиций"],"correct":0,"explanation":"Лаг = хвост лога − коммит группы. Растущий лаг — «не справляемся»: алерт, скейлинг группы, профиль обработки."}]],"cases":[]},{"id":"m4-lesson-05","title":"Надёжность: паттерны доставки","module":4,"moduleTitle":"Kafka вглубь","order":5,"lab":{"title":"Лаба 6. Продюсер и консюмер","description":"Простой цикл своими руками: опубликовать событие OrderCreated через KafkaTemplate и принять его @KafkaListener'ом. Проверка — тесты на встроенном Kafka-брокере, Docker не нужен.","branch":"lab-6","branchSolution":"lab-6-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 5. Надёжность: паттерны доставки\u003c/h1>\n\u003cp>Финальный урок собирает модуль в целостную картину: что значит «надёжная асинхронность», какие паттерны закрывают дыры доставки и где проходит граница цены надёжности.\u003c/p>\n\u003ch2>Семантики доставки: три слова, которые надо различать\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Семантика\u003c/th>\n\u003cth>Гарантия\u003c/th>\n\u003cth>Чем достигается\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>At-most-once\u003c/strong>\u003c/td>\n\u003ctd>Не больше одного раза: могут быть потери\u003c/td>\n\u003ctd>Коммит до обработки, acks низкие\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>At-least-once\u003c/strong>\u003c/td>\n\u003ctd>Хотя бы один раз: возможны дубли\u003c/td>\n\u003ctd>Коммит после обработки, acks=all\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Effectively-once\u003c/strong>\u003c/td>\n\u003ctd>Итоговый эффект ровно один\u003c/td>\n\u003ctd>At-least-once + \u003cstrong>идемпотентный\u003c/strong> обработчик\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Kafka не даёт exactly-once «бесплатно» между произвольными системами. Реальность инженерии: \u003cstrong>at-least-once + идемпотентность = effectively-once\u003c/strong>. Поэтому центральный паттерн модуля — не настройка брокера, а дисциплина обработчика.\u003c/p>\n\u003ch2>Идемпотентный консюмер: как именно\u003c/h2>\n\u003cp>Событие пришло повторно — эффект обязан быть тем же. Приёмы по нарастанию сложности:\u003c/p>\n\u003cp>\u003cstrong>1. Естественная идемпотентность.\u003c/strong> \u003ccode>SET status = 'CONFIRMED' WHERE id = 42\u003c/code> — повтор меняет ничего. Если операция так выглядит — вы уже защищены.\u003c/p>\n\u003cp>\u003cstrong>2. Проверка по id события.\u003c/strong> У события есть уникальный \u003ccode>eventId\u003c/code> (UUID). Обработчик в той же транзакции: записал \u003ccode>processed_events(eventId)\u003c/code> + выполнил эффект. Повтор видит «уже обработано» — выход.\u003c/p>\n\u003cp>\u003cstrong>3. Версии/дедупликация по бизнес-ключу.\u003c/strong> \u003ccode>user.version = 5\u003c/code> пришёл после \u003ccode>version = 7\u003c/code>? Устаревшее — игнор.\u003c/p>\n\u003cp>Бонус прагматика: «письмо о заказе» — идемпотентно само по себе (два письма — терпимо, но лучше не надо); «начисление бонуса» — требует строгой схемы 2.\u003c/p>\n\u003ch2>Transactional Outbox: атомарность БД + Kafka\u003c/h2>\n\u003cp>Проблема dual-write из урока 3 — «сохранил в БД, не донёс до Kafka» — решается \u003cstrong>таблицей-исходящим ящиком\u003c/strong>:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    A[&quot;@Transactional:&lt;br/&gt;order + outbox_event&lt;br/&gt;одна транзакция&quot;] --&gt; DB[(&quot;БД&quot;)]\n    DB --&gt; R[&quot;Outbox-релей&lt;br/&gt;читает outbox, публикует&lt;br/&gt;в Kafka, помечает отправлено&quot;]\n    R --&gt; K[&quot;topic orders.created&quot;]\u003c/div>\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest r)\u003c/span> {\n    \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> orderRepository.save(newOrder(r));\n    outboxRepository.save(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OutboxEvent\u003c/span>(\n            \u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>,\n            String.valueOf(order.getId()),          \u003cspan class=\"hljs-comment\">// ключ\u003c/span>\n            toJson(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(order.getId()))));\n}\n\u003c/code>\u003c/pre>\n\u003cp>Релей (отдельный поток/библиотека/Debezium) поллит таблицу, публикует и помечает. Свойства: заказ без события — невозможен (одна транзакция); событие без заказа — невозможно; дубль публикации — возможен, глушится идемпотентным консюмером. Outbox — обязательный паттерн там, где событие обязано случиться.\u003c/p>\n\u003ch2>Порядок vs параллелизм: саги и версии\u003c/h2>\n\u003cp>Партиция даёт порядок событий одной сущности. Но потребители могли обработать с разной скоростью (ретраи, DLT) — эффект «e₃ применился раньше e₂». Защита:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Версии событий\u003c/strong>: событие несёт \u003ccode>version\u003c/code>/\u003ccode>occurredAt\u003c/code>; обработчик применяет только более новое\u003c/li>\n\u003cli>\u003cstrong>Коммуникативные ассоциации\u003c/strong>: обработка «заказ отменён» должна учитывать, что «заказ создан» мог ещё не дойти → обработчик ждёт/подтягивает состояние\u003c/li>\n\u003c/ul>\n\u003cp>Развязка длинных процессов — \u003cstrong>сага\u003c/strong>: цепочка локальных транзакций + компенсации («заказ создан → платёж прошёл → …; платёж не прошёл → заказ отменить»). Это ортогонально Kafka (саги бывают и на HTTP), но с событиями сага становится естественной формой.\u003c/p>\n\u003ch2>Сколько надёжности нужно?\u003c/h2>\n\u003cp>Надёжность — не бесплатна: outbox — таблица и релей; strict-идемпотентность — хранение обработанных id; effectively-once — тесты тройных сценариев. Зрелая команда соизмеряет:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Событие\u003c/th>\n\u003cth>Стоимость потери\u003c/th>\n\u003cth>Решение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Клики, метрики\u003c/td>\n\u003ctd>Мала\u003c/td>\n\u003ctd>at-most/at-least, без церемоний\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>«Заказ создан», «платёж прошёл»\u003c/td>\n\u003ctd>Велика\u003c/td>\n\u003ctd>acks=all + outbox + идемпотентный консюмер\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Деньги, бухгалтерия\u003c/td>\n\u003ctd>Критична\u003c/td>\n\u003ctd>+ строгая идемпотентность, сверки, possibly саги\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> таблица выше — почти готовый вопрос к требованиям: «что будет, если это событие потеряется/задвоится?» Ответ определяет бюджет надёжности фичи. Это самое дешёвое архитектурное решение, которое вы можете принять.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> матрица тестов зрелого асинхронного контура: дубль, потеря (kill -9 консюмера), яд в DLT, порядок событий одной сущности, ребаланс. Пять сценариев, полчаса тестов, и асинхронность перестаёт быть «магией, которая иногда ломается».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Effectively-once = at-least-once + идемпотентный обработчик; «бесплатного» exactly-once нет\u003c/li>\n\u003cli>Идемпотентность: естественная (SET) → eventId-таблица → версии\u003c/li>\n\u003cli>Outbox делает «БД-изменение + событие» атомарными; релей и идемпотентный консюмер закрывают остальное\u003c/li>\n\u003cli>Порядок при ретраях защищают версии событий; длинные процессы развязываются сагами\u003c/li>\n\u003cli>Уровень надёжности выбирают по цене потери события — это продуктовое решение\u003c/li>\n\u003c/ul>\n\u003cp>Модуль пройден. Дальше — экзамен, кейс и лаба: настоящий продюсер и консюмер на встроенном Kafka-брокере.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"«Effectively-once» в асинхронных системах достигается как…","options":["At-least-once доставка + идемпотентный обработчик: дубли приходят, эффект один","Включением галочки exactly-once в брокере","Запретом ретраев","Одной партицией на всё"],"correct":0,"explanation":"Доставка может дублировать — эффект обязана убирать сторона обработки. Пара at-least-once + идемпотентность и есть инженерный exactly-once."},{"type":"multi","question":"Что даёт transactional outbox? (несколько ответов)","options":["Заказ без события невозможен: одна транзакция БД","Событие без заказа невозможно","Полностью исключает дубли публикации","Релей публикует из таблицы и помечает отправленное"],"correct":[0,1,3],"explanation":"Дубль публикации релеем возможен (крэш после send, до пометки) — и это нормально: его съест идемпотентный консюмер. Outbox решает атомарность, а не дубли."},{"type":"single","codeLang":"sql","code":"UPDATE orders SET status = 'CANCELLED' WHERE id = 42 AND status \u003c> 'CANCELLED';\n","question":"Обработчик события отмены выполняет такой UPDATE. Какой вид идемпотентности работает?","options":["Естественная: повторное выполнение ничего не меняет","Проверка по eventId","Версии событий","Никакая: нужен outbox"],"correct":0,"explanation":"Повтор события даёт тот же результат (обновление 0 строк). Самый дешёвый вид идемпотентности — писать эффекты так, чтобы они были «перевыполняемы».","codeHtml":"\u003cspan class=\"hljs-keyword\">UPDATE\u003c/span> orders \u003cspan class=\"hljs-keyword\">SET\u003c/span> status \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-string\">&#x27;CANCELLED&#x27;\u003c/span> \u003cspan class=\"hljs-keyword\">WHERE\u003c/span> id \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-number\">42\u003c/span> \u003cspan class=\"hljs-keyword\">AND\u003c/span> status \u003cspan class=\"hljs-operator\">&lt;&gt;\u003c/span> \u003cspan class=\"hljs-string\">&#x27;CANCELLED&#x27;\u003c/span>;\n"},{"type":"single","question":"События заказа 42: created (v1) и cancelled (v2), консюмер обработал их в обратном порядке из-за ретрая. Что защищает?","options":["Версии событий: обработчик игнорирует v1 после применённой v2","Ничего: порядок в партиции гарантирует порядок обработки","DLT: отменит устаревшее","acks=all"],"correct":0,"explanation":"Порядок в партиции — порядок доставки, но не порядок эффектов (ретраи/DLT ломают его). Версия в событии — защита обработчика."},{"type":"blank","question":"Как называется таблица, в которую событие атомарно пишется в транзакции с бизнес-данными, а отдельный релей публикует его в Kafka? (одним словом)","answers":["outbox","аутбокс"],"explanation":"Outbox. Лечит dual-write: запись и «обязательство опубликовать» — одна транзакция."},{"type":"match","question":"Сопоставьте событие и разумный уровень надёжности.","pairs":[{"left":"Просмотр карточки товара","right":"At-most-once: потеря терпима"},{"left":"Заказ создан","right":"acks=all + outbox + идемпотентность"},{"left":"Платёж проведён","right":"Строгая идемпотентность, сверки"},{"left":"Клик по баннеру","right":"Дёшево и сердито: потери в пределах статистики"}]},{"type":"single","question":"Итог модуля. Что делает асинхронный контур production-ready?","options":["Acks=all, outbox для обязательных событий, идемпотентные обработчики, DLT с алертами, мониторинг лага","Одна большая партиция и молитва","Отключение ретраев везде","Синхронные HTTP-вызовы из каждого листенера"],"correct":0,"explanation":"Четыре кита надёжности: доставка подтверждена, публикация атомарна, обработка идемпотентна, сбои видны (DLT + лаг). Синхронные вызовы из листенера возвращают связанность, от которой уходили."}]],"cases":[]}]};
</script>
<script>
/* BE-101 course engine: роутинг, прогресс, квиз-движок. Ванильный JS, без зависимостей. */
(function () {
  'use strict';

  var LESSONS = (window.BE101 && window.BE101.lessons) || [];
  var STORE_KEY = 'be101.progress.v1';
  var PASS_RATIO = 0.8; // порог сдачи квиза: 80%+

  // ---------- утилиты ----------

  function el(tag, cls, html) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html !== undefined) node.innerHTML = html;
    return node;
  }
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function normalizeText(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ');
  }

  // ---------- прогресс (localStorage) ----------
  // { lessonId: { quizPassed: {slotIndex: true}, labDone: bool } }

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var p = raw ? JSON.parse(raw) : {};
      return p && typeof p === 'object' ? p : {};
    } catch (_) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (_) {}
  }
  function getLessonProgress(id) {
    var p = loadProgress();
    var lp = p[id];
    if (!lp || typeof lp !== 'object') lp = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!lp.quizPassed) lp.quizPassed = {};
    if (!lp.caseDone) lp.caseDone = {};
    return lp;
  }
  function setQuizPassed(lessonId, slot, passed) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!p[lessonId].quizPassed) p[lessonId].quizPassed = {};
    p[lessonId].quizPassed[slot] = passed;
    saveProgress(p);
  }
  function setCaseDone(lessonId, slot, done) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!p[lessonId].caseDone) p[lessonId].caseDone = {};
    p[lessonId].caseDone[slot] = done;
    saveProgress(p);
  }
  function setLabDone(lessonId, done) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    p[lessonId].labDone = done;
    saveProgress(p);
  }

  function lessonUnits(l) { return l.quizzes.length + l.cases.length + (l.lab ? 1 : 0); }
  function lessonDoneUnits(l) {
    var lp = getLessonProgress(l.id);
    var q = 0, i;
    for (i = 0; i < l.quizzes.length; i++) if (lp.quizPassed[i]) q++;
    for (i = 0; i < l.cases.length; i++) if (lp.caseDone[i]) q++;
    return q + (l.lab && lp.labDone ? 1 : 0);
  }
  function moduleProgress() {
    var done = 0, total = 0;
    for (var i = 0; i < LESSONS.length; i++) {
      done += lessonDoneUnits(LESSONS[i]);
      total += lessonUnits(LESSONS[i]);
    }
    return total ? done / total : 0;
  }
  // moduleProgress оставлен для будущих сводных экранов; сайдбар считает прогресс по каждому модулю отдельно

  // ---------- роутинг ----------

  function currentLessonId() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    for (var i = 0; i < LESSONS.length; i++) {
      if (LESSONS[i].id === h) return h;
    }
    return LESSONS.length ? LESSONS[0].id : '';
  }

  // ---------- сайдбар ----------

  function renderSidebar(container, activeId) {
    var wrap = el('aside', 'sidebar');

    var brand = el('div', 'brand');
    brand.appendChild(el('div', 'brand-title', 'BE‑101'));
    brand.appendChild(el('div', 'brand-sub', 'Бэкенд для смежных специальностей'));
    wrap.appendChild(brand);

    // группировка уроков по модулям (module — номер, moduleTitle — название)
    var modules = [];
    var byNum = {};
    LESSONS.forEach(function (l) {
      if (!byNum[l.module]) {
        byNum[l.module] = {
          title: l.moduleTitle || ('Модуль ' + l.module),
          lessons: [],
        };
        modules.push(byNum[l.module]);
      }
      byNum[l.module].lessons.push(l);
    });

    modules.forEach(function (m) {
      var done = 0, total = 0;
      m.lessons.forEach(function (l) {
        done += lessonDoneUnits(l);
        total += lessonUnits(l);
      });
      var pct = total ? Math.round((done / total) * 100) : 0;

      var head = el('div', 'module-head');
      head.appendChild(el('div', 'module-title', esc(m.title)));
      head.appendChild(el('div', 'module-progress-label', pct + '%'));
      wrap.appendChild(head);

      var bar = el('div', 'module-progress-bar');
      var fill = el('div', 'module-progress-fill');
      fill.style.width = pct + '%';
      bar.appendChild(fill);
      wrap.appendChild(bar);

      var list = el('nav', 'lesson-list');
      m.lessons.forEach(function (l) {
        var lessonDone = lessonUnits(l) > 0 && lessonDoneUnits(l) === lessonUnits(l);
        var item = el('a',
          'lesson-item' + (l.id === activeId ? ' active' : ''),
          '<span class="lesson-status ' + (lessonDone ? 'done' : '') + '">' + (lessonDone ? '✓' : '') + '</span>' +
          '<span class="lesson-title">' + esc(l.order + '. ' + l.title) + '</span>');
        item.href = '#/' + l.id;
        list.appendChild(item);
      });
      wrap.appendChild(list);
    });

    var footer = el('div', 'sidebar-footer',
      'Прогресс хранится только в твоём браузере');
    wrap.appendChild(footer);

    container.appendChild(wrap);
  }

  // обновить только сайдбар (галочки/прогресс), не трогая контент урока:
  // полный render() пересоздал бы DOM и сбрасывал незакрытую попытку квиза
  function updateSidebar(activeId) {
    var appEl = document.getElementById('app');
    var old = appEl && appEl.querySelector('.sidebar');
    if (!old) return;
    var holder = el('div');
    renderSidebar(holder, activeId || currentLessonId());
    old.parentNode.replaceChild(holder.firstChild, old);
  }

  // ---------- квиз-движок ----------

  var TYPE_LABELS = {
    single: 'один ответ',
    multi: 'несколько ответов',
    blank: 'впиши ответ',
    match: 'сопоставь',
  };

  function mountQuiz(slotEl, lesson, slotIndex) {
    var questions = lesson.quizzes[slotIndex];
    var lp = getLessonProgress(lesson.id);
    var alreadyPassed = !!lp.quizPassed[slotIndex];

    var root = el('div', 'quiz');
    root.appendChild(el('div', 'quiz-head',
      '<span class="quiz-badge">Квиз</span>' +
      '<span class="quiz-hint">Порог сдачи — ' + Math.round(PASS_RATIO * 100) + '%. Пересдача не ограничена.</span>' +
      (alreadyPassed ? '<span class="quiz-passed-badge">✓ уже сдан</span>' : '')));

    var body = el('div', 'quiz-body');
    root.appendChild(body);

    var result = el('div', 'quiz-result');
    root.appendChild(result);

    var order; // порядок вопросов текущей попытки

    function startAttempt() {
      body.innerHTML = '';
      result.innerHTML = '';
      result.className = 'quiz-result';
      order = shuffle(questions.map(function (_, i) { return i; }));
      var correctCount = 0;
      var answeredCount = 0;

      order.forEach(function (qi, pos) {
        var q = questions[qi];
        var qEl = el('div', 'question');
        qEl.appendChild(el('div', 'question-head',
          '<span class="question-num">' + (pos + 1) + '</span>' +
          '<span class="question-type">' + TYPE_LABELS[q.type] + '</span>'));
        qEl.appendChild(el('div', 'question-text', esc(q.question)));
        if (q.codeHtml) {
          qEl.appendChild(el('pre', 'question-code', '<code>' + q.codeHtml + '</code>'));
        }
        var area = el('div', 'question-area');
        qEl.appendChild(area);

        function finish(ok, detailsHtml) {
          correctCount += ok ? 1 : 0;
          answeredCount++;
          qEl.classList.add(ok ? 'ok' : 'fail');
          area.classList.add('locked');
          var fb = el('div', 'question-feedback ' + (ok ? 'ok' : 'fail'),
            '<b>' + (ok ? '✓ Верно' : '✗ Неверно') + '</b>' +
            (q.explanation ? '<div class="question-expl">' + esc(q.explanation) + '</div>' : '') +
            (detailsHtml || ''));
          qEl.appendChild(fb);
          if (answeredCount === questions.length) finishAttempt(correctCount);
        }

        if (q.type === 'single') {
          q.options.forEach(function (opt, oi) {
            var b = el('button', 'option', esc(opt));
            b.type = 'button';
            b.addEventListener('click', function () {
              if (area.classList.contains('locked')) return;
              var ok = oi === q.correct;
              area.querySelectorAll('.option').forEach(function (o, idx) {
                o.disabled = true;
                if (idx === q.correct) o.classList.add('correct');
              });
              if (!ok) b.classList.add('wrong');
              finish(ok);
            });
            area.appendChild(b);
          });
        }

        if (q.type === 'multi') {
          var boxes = [];
          q.options.forEach(function (opt, oi) {
            var lab = el('label', 'option check',
              '<input type="checkbox" data-i="' + oi + '"> <span>' + esc(opt) + '</span>');
            area.appendChild(lab);
            boxes.push(lab);
          });
          var submit = el('button', 'btn small', 'Ответить');
          submit.type = 'button';
          submit.addEventListener('click', function () {
            if (area.classList.contains('locked')) return;
            var chosen = [];
            boxes.forEach(function (l) {
              var cb = l.querySelector('input');
              if (cb.checked) chosen.push(Number(cb.dataset.i));
            });
            if (!chosen.length) return;
            var need = q.correct.slice().sort(function (a, b) { return a - b; });
            var got = chosen.slice().sort(function (a, b) { return a - b; });
            var ok = need.length === got.length && need.every(function (v, i) { return v === got[i]; });
            boxes.forEach(function (l) {
              var cb = l.querySelector('input');
              cb.disabled = true;
              var i = Number(cb.dataset.i);
              if (need.indexOf(i) >= 0) l.classList.add('correct');
              else if (cb.checked) l.classList.add('wrong');
            });
            finish(ok);
          });
          area.appendChild(submit);
        }

        if (q.type === 'blank') {
          var row = el('div', 'blank-row');
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'blank-input';
          input.placeholder = 'Твой ответ…';
          input.autocomplete = 'off';
          input.spellcheck = false;
          var b = el('button', 'btn small', 'Ответить');
          b.type = 'button';
          row.appendChild(input);
          row.appendChild(b);
          area.appendChild(row);
          function submitBlank() {
            if (area.classList.contains('locked')) return;
            var v = normalizeText(input.value);
            if (!v) return;
            var ok = q.answers.some(function (a) { return normalizeText(a) === v; });
            input.disabled = true;
            b.disabled = true;
            input.classList.add(ok ? 'correct' : 'wrong');
            finish(ok, ok ? '' : '<div class="correct-answer">Правильный ответ: <b>' +
              esc(q.answers[0]) + '</b></div>');
          }
          b.addEventListener('click', submitBlank);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') submitBlank();
          });
        }

        if (q.type === 'match') {
          var rights = shuffle(q.pairs.map(function (p) { return p.right; }));
          var selects = [];
          q.pairs.forEach(function (p) {
            var rowM = el('div', 'match-row');
            rowM.appendChild(el('div', 'match-left', esc(p.left)));
            var sel = document.createElement('select');
            sel.className = 'match-select';
            sel.appendChild(el('option', '', '— выбери —'));
            rights.forEach(function (r) {
              var o = el('option', '', esc(r));
              o.value = r;
              sel.appendChild(o);
            });
            rowM.appendChild(sel);
            area.appendChild(rowM);
            selects.push({ select: sel, right: p.right });
          });
          var submitM = el('button', 'btn small', 'Ответить');
          submitM.type = 'button';
          submitM.addEventListener('click', function () {
            if (area.classList.contains('locked')) return;
            if (selects.some(function (s) { return !s.select.value; })) return;
            var allOk = true;
            selects.forEach(function (s) {
              s.select.disabled = true;
              var ok = s.select.value === s.right;
              if (!ok) allOk = false;
              s.select.classList.add(ok ? 'correct' : 'wrong');
            });
            finish(allOk);
          });
          area.appendChild(submitM);
        }

        body.appendChild(qEl);
      });
    }

    function finishAttempt(correctCount) {
      var pct = Math.round((correctCount / questions.length) * 100);
      var passed = correctCount / questions.length >= PASS_RATIO;
      setQuizPassed(lesson.id, slotIndex, passed || getLessonProgress(lesson.id).quizPassed[slotIndex]);

      result.className = 'quiz-result show ' + (passed ? 'ok' : 'fail');
      result.innerHTML =
        '<div class="quiz-score">' +
        (passed ? '🎉 Квиз сдан!' : 'Пока не сдан') +
        ' — верно ' + correctCount + ' из ' + questions.length +
        ' (' + pct + '%)' +
        '</div>' +
        (passed
          ? '<div class="quiz-note">Урок отмечен пройденным ✓</div>'
          : '<div class="quiz-note">Нужно ' + Math.round(PASS_RATIO * 100) +
            '%+. Перечитай пояснения выше и попробуй ещё раз — вопросы перемешаются.</div>');

      var retake = el('button', 'btn small', 'Пройти заново');
      retake.type = 'button';
      retake.addEventListener('click', function () {
        startAttempt();
      });
      result.appendChild(retake);
      updateSidebar();
    }

    slotEl.innerHTML = '';
    slotEl.appendChild(root);
    startAttempt();
  }

  // ---------- кейс (textarea + эталонный разбор) ----------

  function mountCase(slotEl, lesson, caseIndex) {
    var c = lesson.cases[caseIndex];
    var lp = getLessonProgress(lesson.id);
    var done = !!lp.caseDone[caseIndex];

    var root = el('div', 'case');
    root.appendChild(el('div', 'case-head',
      '<span class="case-badge">Кейс</span>' +
      '<span class="case-title">' + esc(c.title) + '</span>' +
      (done ? '<span class="case-done-badge">✓ разобран</span>' : '')));
    root.appendChild(el('div', 'case-task', esc(c.task)));

    var area = document.createElement('textarea');
    area.className = 'case-input';
    area.placeholder = c.placeholder || 'Свой ответ…';
    area.spellcheck = false;
    root.appendChild(area);

    var btn = el('button', 'btn small', 'Показать эталонный разбор');
    btn.type = 'button';
    btn.disabled = true;
    area.addEventListener('input', function () {
      btn.disabled = !area.value.trim();
    });
    root.appendChild(btn);

    var ref = el('div', 'case-reference' + (done ? ' show' : ''), c.referenceHtml);
    root.appendChild(ref);

    var note = el('div', 'case-note',
      'Эталон — для самопроверки: сначала своё решение, потом сверка. Ответ никуда не отправляется.');
    root.appendChild(note);

    btn.addEventListener('click', function () {
      if (!area.value.trim()) return;
      setCaseDone(lesson.id, caseIndex, true);
      ref.classList.add('show');
      root.querySelector('.case-head').appendChild(
        el('span', 'case-done-badge', '✓ разобран'));
      btn.disabled = true;
      updateSidebar();
    });

    slotEl.innerHTML = '';
    slotEl.appendChild(root);
  }

  // ---------- карточка лабы ----------

  function mountLab(article, lesson) {
    var lab = lesson.lab;
    if (!lab) return;
    var card = el('div', 'lab-card');
    card.appendChild(el('div', 'lab-head', '<span class="lab-badge">Лабораторная</span> ' + esc(lab.title)));
    if (lab.description) card.appendChild(el('p', 'lab-desc', esc(lab.description)));
    if (lab.branch) {
      card.appendChild(el('div', 'lab-branches',
        'Ветка задания: <code>' + esc(lab.branch) + '</code>' +
        (lab.branchSolution ? ' · решение: <code>' + esc(lab.branchSolution) + '</code>' : '') +
        (lab.hasTests
          ? ' · проверка: <code>' + esc(lab.testCommand || 'mvn test') + '</code>'
          : (lab.branchSolution ? ' · сверяешься с решением' : ''))
      ));
    }
    var lp = getLessonProgress(lesson.id);
    var label = el('label', 'lab-check',
      '<input type="checkbox"' + (lp.labDone ? ' checked' : '') + '> Я сделал эту лабу');
    label.querySelector('input').addEventListener('change', function (e) {
      setLabDone(lesson.id, e.target.checked);
      updateSidebar(); // только галочки/прогресс, без сброса квиза
    });
    card.appendChild(label);
    article.appendChild(card);
  }

  // ---------- страница ----------

  var app;

  function render() {
    if (!app) app = document.getElementById('app');
    var id = currentLessonId();
    var lesson = LESSONS.filter(function (l) { return l.id === id; })[0];

    app.innerHTML = '';
    if (!lesson) {
      app.appendChild(el('div', 'empty', 'Уроки не найдены — запусти сборку (tools/generator)'));
      return;
    }

    renderSidebar(app, lesson.id);

    var main = el('main', 'content');
    var article = el('article', 'lesson');
    article.innerHTML = lesson.html;
    main.appendChild(article);
    app.appendChild(main);

    // лаба — в конец урока
    mountLab(article, lesson);

    // монтируем квизы и кейсы в слоты из markdown
    article.querySelectorAll('.quiz-slot').forEach(function (slot) {
      var idx = Number(slot.dataset.quiz);
      if (lesson.quizzes[idx]) mountQuiz(slot, lesson, idx);
    });
    article.querySelectorAll('.case-slot').forEach(function (slot) {
      var idx = Number(slot.dataset.case);
      if (lesson.cases[idx]) mountCase(slot, lesson, idx);
    });

    // mermaid-диаграммы
    if (window.mermaid) {
      try {
        window.mermaid.initialize({ startOnLoad: false, theme: 'neutral', locale: 'ru' });
        var nodes = article.querySelectorAll('.mermaid');
        if (nodes.length) window.mermaid.run({ nodes: nodes });
      } catch (_) { /* диаграммы не критичны */ }
    }

    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', render);
  if (document.readyState !== 'loading') render();
})();

</script>
</body>
