оды\u003c/strong> через прокси — вызов \u003ccode>this.transfer(...)\u003c/code> из другого метода того же класса транзакции \u003cstrong>не откроет\u003c/strong> (вызов мимо прокси)\u003c/li>\n\u003cli>Исключение \u003cstrong>unchecked\u003c/strong> (RuntimeException) → откат; \u003cstrong>checked\u003c/strong> → по умолчанию коммит (сюрприз! настраивается \u003ccode>rollbackFor\u003c/code>)\u003c/li>\n\u003cli>\u003ccode>readOnly = true\u003c/code> — «только чтение»: БД и Hibernate могут оптимизировать; вешайте на выборки\u003c/li>\n\u003cli>Транзакция должна быть \u003cstrong>короткой\u003c/strong>: внутри не делают HTTP-вызовы и не спят — соединение с базой занято\u003c/li>\n\u003c/ul>\n\u003ch2>Гонки: два одинаковых запроса одновременно\u003c/h2>\n\u003cp>Изоляция по умолчанию в PostgreSQL — READ COMMITTED: транзакция видит закоммиченные чужие изменения. Это быстро, но порождает гонки:\u003c/p>\n\u003cp>\u003cstrong>Потерянный подсчёт.\u003c/strong> Остаток товара = 1. Два покупателя жмут «купить» одновременно:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">T1: читает остаток = 1      T2: читает остаток = 1\nT1: остаток = 0, commit     T2: остаток = 0, commit\n\u003c/code>\u003c/pre>\n\u003cp>Обе транзакции прошли, продан один товар — а купили два. READ COMMITTED не спас: каждая видела согласованную картину.\u003c/p>\n\u003cp>\u003cstrong>Решение 1 — пессимистичная блокировка\u003c/strong>: «захватить строку себе»:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Lock(LockModeType.PESSIMISTIC_WRITE)\u003c/span>\n\u003cspan class=\"hljs-meta\">@Query(&quot;select i from Item i where i.id = :id&quot;)\u003c/span>\n\u003cspan class=\"hljs-type\">Optional\u003c/span>&lt;Item&gt; \u003cspan class=\"hljs-title function_\">findByIdForUpdate\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Param(&quot;id&quot;)\u003c/span> Long id)\u003c/span>;\n\u003c/code>\u003c/pre>\n\u003cp>Первый читатель блокирует строку: второй ждёт. \u003ccode>SELECT ... FOR UPDATE\u003c/code> — надёжно, но очередь при горячих строках.\u003c/p>\n\u003cp>\u003cstrong>Решение 2 — оптимистичная блокировка\u003c/strong>: версия вместо блокировки:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Version\u003c/span>\n\u003cspan class=\"hljs-keyword\">private\u003c/span> Long version;   \u003cspan class=\"hljs-comment\">// Hibernate: UPDATE ... WHERE id=? AND version=?\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Обе транзакции читают версию 5; первая коммитит (версия → 6); вторая при UPDATE «не нашла» свою версию → \u003ccode>OptimisticLockException\u003c/code> → повторить. Не держит блокировки, идеальна для UI-конфликтов («данные изменил другой пользователь»).\u003c/p>\n\u003cp>\u003cstrong>Решение 3 — атомарный UPDATE\u003c/strong>, когда результат не зависит от прочитанного:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Modifying\u003c/span> \u003cspan class=\"hljs-meta\">@Query(&quot;update Item i set i.qty = i.qty - 1 where i.id = :id and i.qty &gt; 0&quot;)\u003c/span>\n\u003cspan class=\"hljs-type\">int\u003c/span> \u003cspan class=\"hljs-title function_\">tryDecrement\u003c/span>\u003cspan class=\"hljs-params\">(\u003cspan class=\"hljs-meta\">@Param(&quot;id&quot;)\u003c/span> Long id)\u003c/span>;   \u003cspan class=\"hljs-comment\">// вернёт 0, если не вышло\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>База сама гарантирует: ровно одна параллельная транзакция успеет. Часто это самый простой и честный путь.\u003c/p>\n\u003ch2>Уровни изоляции (шпаргалка)\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Уровень\u003c/th>\n\u003cth>Аномалии\u003c/th>\n\u003cth>Комментарий\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>READ UNCOMMITTED\u003c/td>\n\u003ctd>грязное чтение\u003c/td>\n\u003ctd>почти не используется\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>READ COMMITTED\u003c/td>\n\u003ctd>неповторяемое чтение, фантомы\u003c/td>\n\u003ctd>\u003cstrong>дефолто Postgres\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REPEATABLE READ\u003c/td>\n\u003ctd>фантомы\u003c/td>\n\u003ctd>дефолт MySQL\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SERIALIZABLE\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>как последовательное выполнение; медленно\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Аномалии: \u003cstrong>грязное чтение\u003c/strong> — чужие незакоммиченные данные; \u003cstrong>неповторяемое чтение\u003c/strong> — два чтения одной строки дают разное; \u003cstrong>фантомы\u003c/strong> — повторный запрос возвращает другой набор строк.\u003c/p>\n\u003cp>Поднимать уровень изоляции «на всякий случай» — антипаттерн: каждый уровень дороже. Правильный инструмент под конкретную гонку: блокировка, версия или атомарный UPDATE.\u003c/p>\n\u003ch2>Распространённые ошибки\u003c/h2>\n\u003cul>\n\u003cli>Транзакция ради транзакции на каждом методе — пул соединений кончается\u003c/li>\n\u003cli>HTTP-вызов внутри транзакции — соединение занято на секунды\u003c/li>\n\u003cli>\u003ccode>@Transactional\u003c/code> на private методе или внутреннем вызове — молча не работает\u003c/li>\n\u003cli>Решение гонок сном (\u003ccode>Thread.sleep(100)\u003c/code>) — «иногда помогает» — нет\u003c/li>\n\u003cli>Долгая транзакция на «импорт файла на 100к строк» — держит блокировки; батчами и короткими транзакциями\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> гонки не ловятся одиночным тестом — ловятся параллельными: два потока одновременно на один остаток, повторные отправки формы, двойной клик по кнопке. «Задвоение данных при двойном клике» — самый частый прод-тикет из этой серии.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>ACID; на практике ломаются А (откат) и I (гонки)\u003c/li>\n\u003cli>\u003ccode>@Transactional\u003c/code>: границы = метод, публичный вызов через прокси, unchecked → откат, короткая жизнь\u003c/li>\n\u003cli>READ COMMITTED (дефолт PG) не защищает от гонок чтение-запись\u003c/li>\n\u003cli>Инструменты: пессимистичная блокировка (ждать), \u003ccode>@Version\u003c/code> (повторить), атомарный UPDATE (база сама)\u003c/li>\n\u003cli>Уровни изоляции не «на всякий случай», а под конкретную аномалию\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Метод @Transactional выбросил IOException (checked). Что произойдёт с изменениями по умолчанию?","options":["Закоммитится: откат по умолчанию только для RuntimeException","Откатится: любое исключение = откат","Транзакция зависнет навсегда","Зависит от фазы луны"],"correct":0,"explanation":"Сюрприз JPA по умолчанию: откат — на unchecked. Для checked добавляют rollbackFor = IOException.class. Проверяется тестом за две минуты."},{"type":"single","codeLang":"java","code":"@Service\npublic class OrderService {\n    public void handle(Long id) {\n        this.cancelIfNeeded(id);   // вызов изнутри класса\n    }\n\n    @Transactional\n    public void cancelIfNeeded(Long id) { ... }\n}\n","question":"Почему транзакция в cancelIfNeeded НЕ откроется при вызове handle извне?","options":["@Transactional работает через прокси; внутренний вызов this идёт мимо прокси","Метод слишком длинный","Нужен параметр rollbackFor","Транзакции не работают в Service-слое"],"correct":0,"explanation":"Spring оборачивает бин прокси-обёрткой; аннотацию видит только вызов через бин. this.cancelIfNeeded — обычный Java-вызов, мимо обёртки. Классика code review.","codeHtml":"\u003cspan class=\"hljs-meta\">@Service\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">handle\u003c/span>\u003cspan class=\"hljs-params\">(Long id)\u003c/span> {\n        \u003cspan class=\"hljs-built_in\">this\u003c/span>.cancelIfNeeded(id);   \u003cspan class=\"hljs-comment\">// вызов изнутри класса\u003c/span>\n    }\n\n    \u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">cancelIfNeeded\u003c/span>\u003cspan class=\"hljs-params\">(Long id)\u003c/span> { ... }\n}\n"},{"type":"single","question":"Остаток = 1, два покупателя покупают одновременно в READ COMMITTED. Почему обе транзакции проходят?","options":["Каждая видит согласованную (закоммиченную) картину «остаток = 1» — конфликта на чтении нет, а UPDATE обе делают из своего видения","READ COMMITTED не пишет в базу","Postgres не поддерживает параллелизм","Транзакции слишком короткие для проверки"],"correct":0,"explanation":"READ COMMITTED изолирует от грязных данных, но не от гонки «прочитал-проверил-записал». Нужны блокировка, @Version или атомарный UPDATE с условием qty > 0."},{"type":"multi","question":"Какие способы честно разрулить гонку на один остаток? (несколько ответов)","options":["PESSIMISTIC_WRITE: SELECT FOR UPDATE — второй покупатель ждёт","@Version и OptimisticLockException с повтором при конфликте","Атомарный UPDATE ... SET qty = qty - 1 WHERE qty > 0 — по числу обновлённых строк","Thread.sleep(200) перед покупкой"],"correct":[0,1,2],"explanation":"Сон не устраняет гонку — только сдвигает её. Остальные три — стандартный арсенал; выбор зависит от контенции: горячая строка — версия/атомарный апдейт, сложная логика — блокировка."},{"type":"blank","question":"Какая буква ACID означает «транзакция выполняется целиком или никак»? (одна буква)","answers":["A","а"],"explanation":"Atomicity — атомарность. I (Isolation) — про параллельность, D (Durability) — про выживание после перезагрузки."},{"type":"match","question":"Сопоставь аномалию изоляции и её описание.","pairs":[{"left":"Грязное чтение","right":"Видны незакоммиченные чужие изменения"},{"left":"Неповторяемое чтение","right":"Два чтения одной строки дают разные значения"},{"left":"Фантомы","right":"Повторный запрос возвращает другой набор строк"},{"left":"Потерянное обновление","right":"Две транзакции перезаписали одно значение, одна правка исчезла"}]},{"type":"single","question":"Внутри @Transactional-метода дёргается внешний HTTP-API, отвечающий 3 секунды. В чём проблема?","options":["Транзакция (и соединение из пула) держится 3+ секунды впустую — под нагрузкой пул иссякнет","HTTP нельзя вызывать из Java","Нарушается атомарность немедленно","Проблем нет: соединение ничего не делает"],"correct":0,"explanation":"Правило: транзакция короткая, внешние вызовы — за её границами. Сначала HTTP, потом короткая транзакция с записью результата."}]],"cases":[]},{"id":"m3-lesson-05","title":"Миграции и прод: Liquibase","module":3,"moduleTitle":"Данные","order":5,"lab":{"title":"Лаба 5. Связи и миграции","description":"Написать changeset v2 (таблица tasks с FK) и связать entity двусторонней связью с каскадами. Проверка — 4 теста: схема, FK, связи, каскад.","branch":"lab-5","branchSolution":"lab-5-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 5. Миграции и прод: Liquibase\u003c/h1>\n\u003cp>В лабах мы использовали \u003ccode>ddl-auto: create-drop\u003c/code>: Hibernate сам создавал схему и сам её убивал. Это удобно для песочницы и недопустимо в проде: там схема — не побочный эффект кода, а управляемая история изменений. Этим занимается \u003cstrong>Liquibase\u003c/strong>.\u003c/p>\n\u003ch2>Почему не ddl-auto\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>\u003ccode>ddl-auto: create/update\u003c/code>\u003c/th>\n\u003cth>Миграции\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Что происходит\u003c/td>\n\u003ctd>Hibernate создаёт/дописывает схему при старте по entity\u003c/td>\n\u003ctd>Схема изменяется явно перечисленными шагами\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Контроль\u003c/td>\n\u003ctd>«Как получится»: переименовал поле — Hibernate создаст новое, старое останется\u003c/td>\n\u003ctd>Каждый шаг описан и прошел ревью\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Откаты\u003c/td>\n\u003ctd>Нет\u003c/td>\n\u003ctd>У changeset'ов есть rollback-стратегия\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>История\u003c/td>\n\u003ctd>Отсутствует\u003c/td>\n\u003ctd>Кто, когда, что и зачем — в таблице changelog\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Прод\u003c/td>\n\u003ctd>Запрещён\u003c/td>\n\u003ctd>Стандарт\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Главный риск \u003ccode>update\u003c/code>: он умеет \u003cstrong>добавлять\u003c/strong>, но не умеет переименовывать и удалять. Переименовали \u003ccode>name\u003c/code> в \u003ccode>full_name\u003c/code> — получили обе колонки: старая с данными, новая пустая. И никто не узнает, когда это случилось.\u003c/p>\n\u003ch2>Liquibase: changelog и changeset\u003c/h2>\n\u003cp>История изменений — XML/YAML/SQL-файл, \u003cstrong>changeset — один атомарный шаг\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-comment\"># src/main/resources/db/changelog/db.changelog-master.yaml\u003c/span>\n\u003cspan class=\"hljs-attr\">databaseChangeLog:\u003c/span>\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">include:\u003c/span>\n      \u003cspan class=\"hljs-attr\">file:\u003c/span> \u003cspan class=\"hljs-string\">db/changelog/v1-init-schema.yaml\u003c/span>\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">include:\u003c/span>\n      \u003cspan class=\"hljs-attr\">file:\u003c/span> \u003cspan class=\"hljs-string\">db/changelog/v2-add-deadline-index.yaml\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-comment\"># v1-init-schema.yaml\u003c/span>\n\u003cspan class=\"hljs-attr\">databaseChangeLog:\u003c/span>\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">changeSet:\u003c/span>\n      \u003cspan class=\"hljs-attr\">id:\u003c/span> \u003cspan class=\"hljs-string\">create-projects\u003c/span>\n      \u003cspan class=\"hljs-attr\">author:\u003c/span> \u003cspan class=\"hljs-string\">dbelokursky\u003c/span>\n      \u003cspan class=\"hljs-attr\">changes:\u003c/span>\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">createTable:\u003c/span>\n            \u003cspan class=\"hljs-attr\">tableName:\u003c/span> \u003cspan class=\"hljs-string\">projects\u003c/span>\n            \u003cspan class=\"hljs-attr\">columns:\u003c/span>\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">id\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">bigint\u003c/span>, \u003cspan class=\"hljs-attr\">autoIncrement:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">primaryKey:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span> } }\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">name\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">varchar(100)\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> } }\n  \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">changeSet:\u003c/span>\n      \u003cspan class=\"hljs-attr\">id:\u003c/span> \u003cspan class=\"hljs-string\">create-tasks\u003c/span>\n      \u003cspan class=\"hljs-attr\">author:\u003c/span> \u003cspan class=\"hljs-string\">dbelokursky\u003c/span>\n      \u003cspan class=\"hljs-attr\">changes:\u003c/span>\n        \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">createTable:\u003c/span>\n            \u003cspan class=\"hljs-attr\">tableName:\u003c/span> \u003cspan class=\"hljs-string\">tasks\u003c/span>\n            \u003cspan class=\"hljs-attr\">columns:\u003c/span>\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">id\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">bigint\u003c/span>, \u003cspan class=\"hljs-attr\">autoIncrement:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">primaryKey:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span> } }\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">project_id\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">bigint\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>, \u003cspan class=\"hljs-attr\">referencedTableName:\u003c/span> \u003cspan class=\"hljs-string\">projects\u003c/span>, \u003cspan class=\"hljs-attr\">referencedColumnNames:\u003c/span> \u003cspan class=\"hljs-string\">id\u003c/span>, \u003cspan class=\"hljs-attr\">foreignKeyName:\u003c/span> \u003cspan class=\"hljs-string\">fk_tasks_project\u003c/span> } }\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">title\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">varchar(200)\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> } }\n              \u003cspan class=\"hljs-bullet\">-\u003c/span> \u003cspan class=\"hljs-attr\">column:\u003c/span> { \u003cspan class=\"hljs-attr\">name:\u003c/span> \u003cspan class=\"hljs-string\">done\u003c/span>, \u003cspan class=\"hljs-attr\">type:\u003c/span> \u003cspan class=\"hljs-string\">boolean\u003c/span>, \u003cspan class=\"hljs-attr\">defaultValueBoolean:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>, \u003cspan class=\"hljs-attr\">constraints:\u003c/span> { \u003cspan class=\"hljs-attr\">nullable:\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span> } }\n\u003c/code>\u003c/pre>\n\u003cp>При старте приложения Liquibase:\u003c/p>\n\u003col>\n\u003cli>Смотрит в служебную таблицу \u003ccode>DATABASECHANGELOG\u003c/code>: какие changeset'ы уже применены\u003c/li>\n\u003cli>Применяет \u003cstrong>только новые\u003c/strong>, по порядку, каждый в транзакции\u003c/li>\n\u003cli>Записывает, кто/когда/чек-сумма\u003c/li>\n\u003c/ol>\n\u003cp>Изменения кода review'ятся, изменения схемы — тоже: PR в changelog = ревью миграции до прода.\u003c/p>\n\u003ch2>Правила боевых миграций\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Changeset неизменен после применения.\u003c/strong> Поправил уже применённый changeset — чек-сумма не совпадёт, Liquibase откажется стартовать. Новое изменение = новый changeset.\u003c/li>\n\u003cli>\u003cstrong>Один changeset — одно изменение.\u003c/strong> Откатить/повторить точечно проще.\u003c/li>\n\u003cli>\u003cstrong>Expand → contract\u003c/strong> для опасных изменений. Убрать колонку, пока её читает старая версия приложения:\n\u003cul>\n\u003cli>v102 (expand): добавить новую колонку, начать писать в обе\u003c/li>\n\u003cli>выкатить код, который читает только новую; подождать, пока старые инстансы уйдут\u003c/li>\n\u003cli>v107 (contract): удалить старую колонку\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Данные мигрируем кодом миграций\u003c/strong>, не «руками в базе»: \u003ccode>sql\u003c/code>-changeset с UPDATE — нормально.\u003c/li>\n\u003cli>Индексы на больших таблицах — с оговорками СУБД (\u003ccode>CREATE INDEX CONCURRENTLY\u003c/code> в Postgres).\u003c/li>\n\u003c/ol>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> миграции — тестируемый артефакт: если changelog применяется на чистой базе в CI (Testcontainers), то и на стейджинге применится. Проверяйте миграции на копии прод-данных: «схема применилась, а данные не влезли в NOT NULL» — классика.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитики:\u003c/strong> changeset'ы — это история схемы с авторами и датами. Требование «поле обязательно» (= NOT NULL) — это не комментарий в коде, а миграция, которая на глазах изменила правила игры: после неё пустых значений не будет. Участвуйте в ревью таких миграций.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Подключение в Spring Boot\u003c/h2>\n\u003cpre>\u003ccode class=\"language-xml\">\u003cspan class=\"hljs-tag\">&lt;\u003cspan class=\"hljs-name\">dependency\u003c/span>&gt;\u003c/span>\n    \u003cspan class=\"hljs-tag\">&lt;\u003cspan class=\"hljs-name\">groupId\u003c/span>&gt;\u003c/span>org.springframework.boot\u003cspan class=\"hljs-tag\">&lt;/\u003cspan class=\"hljs-name\">groupId\u003c/span>&gt;\u003c/span>\n    \u003cspan class=\"hljs-tag\">&lt;\u003cspan class=\"hljs-name\">artifactId\u003c/span>&gt;\u003c/span>spring-boot-starter-liquibase\u003cspan class=\"hljs-tag\">&lt;/\u003cspan class=\"hljs-name\">artifactId\u003c/span>&gt;\u003c/span>\n\u003cspan class=\"hljs-tag\">&lt;/\u003cspan class=\"hljs-name\">dependency\u003c/span>&gt;\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>В Boot 4 автоконфигурация Liquibase живёт в отдельном стартере: голый\n\u003ccode>org.liquibase:liquibase-core\u003c/code> на classpath ничего не запустит — база останется пустой.\u003c/p>\n\u003c/blockquote>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">spring:\u003c/span>\n  \u003cspan class=\"hljs-attr\">jpa:\u003c/span>\n    \u003cspan class=\"hljs-attr\">hibernate:\u003c/span>\n      \u003cspan class=\"hljs-attr\">ddl-auto:\u003c/span> \u003cspan class=\"hljs-string\">validate\u003c/span>   \u003cspan class=\"hljs-comment\"># schema создаёт Liquibase; Hibernate только ПРОВЕРЯЕТ соответствие\u003c/span>\n  \u003cspan class=\"hljs-attr\">liquibase:\u003c/span>\n    \u003cspan class=\"hljs-attr\">change-log:\u003c/span> \u003cspan class=\"hljs-string\">classpath:db/changelog/db.changelog-master.yaml\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Золотая пара: \u003cstrong>Liquibase создаёт схему, \u003ccode>ddl-auto: validate\u003c/code> сверяет entity со схемой\u003c/strong> при старте. Расхождение — приложение не стартует: ошибка найдена на деплое, а не в рантайме.\u003c/p>\n\u003ch2>Тесты с базой: Testvironments за одну строку\u003c/h2>\n\u003cp>Модуль закрывает логика: лабы используют H2 — быстро и без инфраструктуры. Но H2 — не PostgreSQL: диалекты различаются. Честные интеграционные тесты поднимают \u003cstrong>настоящую\u003c/strong> базу в Docker через \u003cstrong>Testcontainers\u003c/strong>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Testcontainers\u003c/span>\n\u003cspan class=\"hljs-meta\">@SpringBootTest\u003c/span>\n\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">TaskRepositoryIT\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Container\u003c/span>\n    \u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-type\">PostgreSQLContainer\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-variable\">postgres\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">PostgreSQLContainer\u003c/span>&lt;&gt;(\u003cspan class=\"hljs-string\">&quot;postgres:17&quot;\u003c/span>);\n}\n\u003c/code>\u003c/pre>\n\u003cp>Контейнер стартует на время тестов, Liquibase накатывает миграции, тесты гоняются на настоящем PostgreSQL. Медленнее H2, зато диалект, индексы и блокировки — настоящие. В командной практике: юнит-логика на H2/моках, репозитории и миграции — на Testcontainers.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Схема прода управляется миграциями, не \u003ccode>ddl-auto\u003c/code>: история, ревью, откаты\u003c/li>\n\u003cli>Changeset — атомарный шаг; применённый changeset не редактируют — добавляют новый\u003c/li>\n\u003cli>Опасные изменения — по схеме expand → contract\u003c/li>\n\u003cli>\u003ccode>ddl-auto: validate\u003c/code> + Liquibase: расхождение entity и схемы валит старт — так и задумано\u003c/li>\n\u003cli>H2 — для быстрых лаб; Testcontainers — для честных тестов на настоящем PostgreSQL\u003c/li>\n\u003c/ul>\n\u003cp>Модуль «Данные» пройден: SQL-фундамент, entity-связи, N+1, транзакции, миграции. Экзамен и кейс — впереди.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Разработчик переименовал колонку name в full_name и задеплоил с ddl-auto: update. Что случится с базой?","options":["Появится новая пустая колонка full_name, старая name останется с данными: update не умеет переименовывать","Колонка аккуратно переименуется","База откатится к прошлой версии","Hibernate спросит подтверждение у разработчика"],"correct":0,"explanation":"Update только добавляет. «Переименование» превращается в новую пустую колонку при живой старой — данные и код молча расходятся. Поэтому в проде — миграции."},{"type":"multi","question":"Что даёт таблица DATABASECHANGELOG? (несколько ответов)","options":["Знает, какие changeset'ы уже применены — повторного применения не будет","Хранит автора и время каждого изменения","Хранит чек-сумму: правка уже применённого changeset'а будет замечена","Автоматически откатывает любые изменения"],"correct":[0,1,2],"explanation":"Это журнал применённых изменений и детектор вмешательства. Откат — отдельная история (rollback у changeset'а или обратная миграция), автоматически «любые» не откатываются."},{"type":"single","question":"Нужно переименовать колонку, которую читает работающая версия приложения. Какой порядок безопасен?","options":["Expand: добавить новую и писать в обе → выкатить код на новую → подождать ухода старых инстансов → contract: удалить старую","Сразу переименовать в одной миграции и перезапустить приложение","Удалить старую колонку, потом добавить новую","Ничего не делать: колонки нельзя переименовывать"],"correct":0,"explanation":"Expand-contract сводит окно несовместимости к нулю: в любой момент есть схема, с которой живёт и старый, и новый код."},{"type":"single","question":" ddl-auto: validate + Liquibase. Разработчик добавил в entity поле, но забыл миграцию. Что произойдёт?","options":["Приложение не стартует: Hibernate не найдёт колонку в схеме — ошибка обнаружена сразу","Приложение стартует, поле всегда null","Liquibase автоматически создаст колонку по entity","Ничего: validate ни на что не влияет"],"correct":0,"explanation":"Validate сверяет entity со схемой и валирует старт при расхождении. Это переносит ошибку из «тихого рантайм-бага» в громкий отказ на деплое."},{"type":"blank","question":"Как называется атомарный единичный шаг изменения схемы в Liquibase? (одно слово)","answers":["changeset","changeSet","чейнджсет"],"explanation":"ChangeSet: id + author + изменения. Применяется один раз, транзакционно, неизменен после применения."},{"type":"match","question":"Сопоставь инструмент и его роль.","pairs":[{"left":"ddl-auto: create-drop","right":"Песочница: схема создаётся и умирает с приложением"},{"left":"Liquibase","right":"Управляемая история изменений схемы"},{"left":"ddl-auto: validate","right":"Страховка: entity должен совпадать со схемой"},{"left":"Testcontainers","right":"Настоящий PostgreSQL в тестах через Docker"}]},{"type":"single","question":"Чем тесты на Testcontainers принципиально лучше тестов на H2 для репозиториев?","options":["Тестируется настоящий PostgreSQL: диалект SQL, индексы, блокировки, миграции — как в проде","Они быстрее H2","Они не требуют Docker","H2 не поддерживает SQL"],"correct":0,"explanation":"H2 быстро и удобно для логики, но это другая СУБД: SQL-диалект и поведение блокировок отличаются. Testcontainers медленнее и требует Docker — зато честно."}]],"cases":[]},{"id":"m3-exam","title":"Экзамен модуля и кейс","module":3,"moduleTitle":"Данные","order":6,"lab":null,"html":"\u003ch1>Экзамен модуля «Данные»\u003c/h1>\n\u003cp>Пять уроков: SQL-фундамент, entity-связи, N+1, транзакции, миграции. Схема финала та же: сначала кейс своими словами, потом 15 вопросов, порог 80%.\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Колонка tasks.project_id ссылается на projects.id. Что защищает FOREIGN KEY?","options":["Нельзя вставить задачу с project_id, которого нет в projects","Нельзя удалить проект — никогда и ни при каких условиях","Запросы по project_id всегда быстрые","Таблицы шифруются"],"correct":0,"explanation":"FK — ссылочная целостность на вставку/обновление. Удаление проекта с задачами СУБД запретит или каскадно обработает — по правилу ON DELETE, которое задаётся отдельно."},{"type":"single","codeLang":"sql","code":"SELECT p.name, COUNT(t.id) AS open_cnt\nFROM projects p\nLEFT JOIN tasks t ON t.project_id = p.id AND t.done = false\nGROUP BY p.name;\n","question":"Чем этот запрос отличается от INNER JOIN с тем же условием?","options":["LEFT JOIN вернёт и проекты без открытых задач (со значением 0), INNER — только проекты, где они есть","Ничем: JOIN всегда одинаковый","LEFT JOIN не поддерживает условие в ON","INNER JOIN быстрее всегда"],"correct":0,"explanation":"LEFT JOIN сохраняет левую сторону: проектов без пары COUNT(t.id) посчитает 0. INNER JOIN выкинет их. «Отчёт, где исчезли пустые проекты» — типичный баг замены JOIN'а.","codeHtml":"\u003cspan class=\"hljs-keyword\">SELECT\u003c/span> p.name, \u003cspan class=\"hljs-built_in\">COUNT\u003c/span>(t.id) \u003cspan class=\"hljs-keyword\">AS\u003c/span> open_cnt\n\u003cspan class=\"hljs-keyword\">FROM\u003c/span> projects p\n\u003cspan class=\"hljs-keyword\">LEFT\u003c/span> \u003cspan class=\"hljs-keyword\">JOIN\u003c/span> tasks t \u003cspan class=\"hljs-keyword\">ON\u003c/span> t.project_id \u003cspan class=\"hljs-operator\">=\u003c/span> p.id \u003cspan class=\"hljs-keyword\">AND\u003c/span> t.done \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-literal\">false\u003c/span>\n\u003cspan class=\"hljs-keyword\">GROUP\u003c/span> \u003cspan class=\"hljs-keyword\">BY\u003c/span> p.name;\n"},{"type":"multi","question":"Признаки N+1 в приложении? (несколько ответов)","options":["В SQL-логах лес однотипных SELECT ... WHERE id = ? / project_id = ?","Эндпоинт замедляется пропорционально числу записей","Локально быстро, на проде с большими данными — медленно","База занимает мало места"],"correct":[0,1,2],"explanation":"N+1 — линейная зависимость числа запросов от данных. Три симптома вместе — почти диагноз; подтверждается статистикой Hibernate или счётчиком запросов."},{"type":"single","question":"Какой запрос решит «проекты с количеством задач» за одну поездку в базу, не грузя задачи?","options":["Проекция: select p.name, count(t) from Project p left join p.tasks t group by p.name","findAll() проектов + getSize() по задачам с JOIN FETCH","findAll() и цикл с getTasks().size()","Кэш всех задач в памяти приложения"],"correct":0,"explanation":"Считать должна база: агрегат с GROUP BY вернёт готовые цифры. JOIN FETCH здесь даже вреден — он тащит все задачи, чтобы их посчитать в Java."},{"type":"single","codeLang":"java","code":"@Transactional\npublic void complete(Long id) {\n    Task task = taskRepository.findById(id).orElseThrow();\n    task.setDone(true);\n    // save() не вызывается\n}\n","question":"Сохранится ли done = true в базе после завершения метода?","options":["Да: dirty checking внутри транзакции сам сгенерирует UPDATE при коммите","Нет: без save() изменения потеряются","Только если task был загружен в другом методе","Зависит от версии Hibernate"],"correct":0,"explanation":"Managed-entity в открытой сессии сравнивается со снимком; изменённое поле даёт UPDATE при коммите. Явный save() для управляемых сущностей не нужен.","codeHtml":"\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">complete\u003c/span>\u003cspan class=\"hljs-params\">(Long id)\u003c/span> {\n    \u003cspan class=\"hljs-type\">Task\u003c/span> \u003cspan class=\"hljs-variable\">task\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> taskRepository.findById(id).orElseThrow();\n    task.setDone(\u003cspan class=\"hljs-literal\">true\u003c/span>);\n    \u003cspan class=\"hljs-comment\">// save() не вызывается\u003c/span>\n}\n"},{"type":"single","question":"@ManyToOne со значением EAGER: чем опасно?","options":["Связанная сущность грузится всегда и везде, раздувая каждый запрос и цепляясь каскадом дальше","EAGER ломает компиляцию","EAGER отключает индексы","Ничем: это значение по умолчанию, значит безопасно"],"correct":0,"explanation":"Дефолт — не синоним «правильно». EAGR тянет связь даже там, где не просят; ставьте LAZY и догружайте точечно (FETCH/EntityGraph)."},{"type":"blank","question":"Какое исключение получит код, обратившийся к ленивой связи ПОСЛЕ закрытия транзакции? (три слова, Latent... нет — просто назовите: LazyInitialization...)","answers":["LazyInitializationException","lazyinitializationexception"],"explanation":"LazyInitializationException: прокси не может догрузить данные в закрытой сессии. Лечение — загрузить связь внутри транзакции."},{"type":"single","question":"Две транзакции параллельно уменьшают остаток (qty=1) обычным «прочитал-проверил-записал». Сколько товара будет продано?","options":["Два — каждая транзакция видела остаток 1 и прошла успешно: классическая гонка","Один: Postgres не позволит вторую","Ноль: обе откатятся","Зависит от уровня READ UNCOMMITTED"],"correct":0,"explanation":"READ COMMITTED не сериализует «прочитал-проверил-записал». Нужны SELECT FOR UPDATE, @Version или атомарный UPDATE с WHERE qty > 0."},{"type":"match","question":"Сопоставьте инструмент борьбы с гонкой и его поведение.","pairs":[{"left":"PESSIMISTIC_WRITE","right":"Строка блокируется: конкурент ждёт освобождения"},{"left":"@Version (оптимистичная)","right":"Конфликт ловится при UPDATE: исключение и повтор"},{"left":"Атомарный UPDATE с условием","right":"База сама решает: обновилось 0 строк — не вышло"},{"left":"Thread.sleep перед записью","right":"Не решение: гонка остаётся"}]},{"type":"single","question":"Метод @Transactional сделал UPDATE и выбросил NullPointerException. Что в базе?","options":["Ничего: RuntimeException → откат транзакции","UPDATE останется: коммит уже прошёл","UPDATE останется наполовину","База заблокируется"],"correct":0,"explanation":"Атомарность: unchecked-исключение откатывает всё, что сделано в методе. Для checked по умолчанию — коммит (вопрос из урока 4)."},{"type":"multi","question":"Что верно про changeset'ы Liquibase? (несколько ответов)","options":["Применённый changeset нельзя редактировать: чек-сумма в DATABASECHANGELOG не совпадёт","Новое изменение схемы = новый changeset","Changeset можно безопасно править сколько угодно после применения","Changeset применяется один раз — это гарантирует таблица changelog"],"correct":[0,1,3],"explanation":"Редактирование применённого changeset'а — способ уронить старт приложения на проде. История неизменна, изменения только добавляются."},{"type":"single","question":"Безопасный способ убрать колонку, которую ещё читает работающий код?","options":["Expand-contract: сначала новый вариант схемы и запись в оба места, потом выкатка кода без старой колонки, потом удаление","Удалить сразу: если упадёт — вернём откатом","Переименовать колонку: rename безопаснее delete","Отключить приложение на время удаления"],"correct":0,"explanation":"Окно несовместимости должно быть пустым. «Упадёт — откатим» на проде с данными — не стратегия, а инцидент."},{"type":"single","question":"Что делает ddl-auto: validate в связке с Liquibase?","options":["Проверяет соответствие entity схеме при старте: расхождение — приложение не поднимется","Создаёт схему по entity","Удаляет схему перед стартом","Ничего: это синоним для none"],"correct":0,"explanation":"Схемой управляет Liquibase, а validate ловит расхождение между кодом и базой на старте — ранняя, громкая ошибка вместо тихого рантайма."},{"type":"blank","question":"Как называется подход к интеграционным тестам, поднимающий настоящую PostgreSQL в Docker? (одно слово, имя инструмента)","answers":["Testcontainers","testcontainers"],"explanation":"Testcontainers: контейнер с реальной СУБД на время теста. Диалект, индексы, блокировки и миграции — как в проде."},{"type":"single","question":"Итог модуля. Отчёт «проекты с числом открытых задач» на проде тормозит, в логах сотни SELECT'ов по project_id. Ваш первый шаг?","options":["Посчитать в базе: агрегат-проекция с GROUP BY вместо загрузки задач в Java; при загрузке списков — EntityGraph/JOIN FETCH","Добавить памяти приложению","Поднять пул соединений с базой","Вынести отчёт в отдельный микросервис"],"correct":0,"explanation":"Сотни однотипных SELECT'ов = N+1. Лечение — из урока 3: агрегация в базе или догрузка связей одним запросом. Инфраструктурные костыли проблему не убирают."}]],"cases":[{"title":"Спроектируйте схему данных для бронирования переговорок","task":"Та же предметная область, что в кейсе модуля 2, но теперь — изнутри: спроектируйте СХЕМУ БАЗЫ. Известно: переговорки (номер/имя, вместимость, проектор), сотрудники (логин), брони (комната, кто, интервал времени, статус). Подумайте: какие таблицы и связи (один-ко-многим/многие-ко-многим)? Где первичные и внешние ключи? Какой индекс поставите под запрос «свободные слоты комнаты на день»? Как на уровне БД не дать двойного бронирования? Опишите таблицами: имя → колонки (имя, тип, ограничения) → связи. Форма свободная.","placeholder":"Например:\nrooms: id PK, name, capacity...\nbookings: id PK, room_id FK, ...","referenceHtml":"\u003cp>Один из возможных ответов.\u003c/p>\n\u003ch2>Таблицы\u003c/h2>\n\u003cp>\u003cstrong>rooms\u003c/strong>: \u003ccode>id BIGINT PK\u003c/code>, \u003ccode>name VARCHAR(100) NOT NULL\u003c/code>, \u003ccode>capacity INT NOT NULL CHECK (capacity &gt; 0)\u003c/code>, \u003ccode>projector BOOLEAN NOT NULL DEFAULT false\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>employees\u003c/strong>: \u003ccode>id BIGINT PK\u003c/code>, \u003ccode>login VARCHAR(50) NOT NULL UNIQUE\u003c/code>\u003c/p>\n\u003cp>\u003cstrong>bookings\u003c/strong>: \u003ccode>id BIGINT PK\u003c/code>, \u003ccode>room_id BIGINT NOT NULL FK → rooms.id\u003c/code>,\n\u003ccode>employee_id BIGINT NOT NULL FK → employees.id\u003c/code>,\n\u003ccode>starts_at TIMESTAMP NOT NULL\u003c/code>, \u003ccode>ends_at TIMESTAMP NOT NULL\u003c/code>,\n\u003ccode>status VARCHAR(20) NOT NULL DEFAULT 'ACTIVE'\u003c/code> (ACTIVE/CANCELLED),\n\u003ccode>CHECK (starts_at &lt; ends_at)\u003c/code>\u003c/p>\n\u003ch2>Связи\u003c/h2>\n\u003cul>\n\u003cli>rooms → bookings: один-ко-многим (FK на стороне броней — их много на комнату)\u003c/li>\n\u003cli>employees → bookings: один-ко-многим (FK у броней)\u003c/li>\n\u003cli>Многие-ко-многим (участники встречи): при необходимости \u003ccode>booking_attendees(booking_id FK, employee_id FK)\u003c/code> с составным PK\u003c/li>\n\u003c/ul>\n\u003ch2>Индексы\u003c/h2>\n\u003cpre>\u003ccode>CREATE INDEX idx_bookings_room_time ON bookings (room_id, starts_at);\n-- запрос «слоты комнаты на день» = WHERE room_id = ? AND starts_at &lt; конец дня AND ends_at &gt; начало дня\n\u003c/code>\u003c/pre>\n\u003cp>Индекс по паре (room_id, starts_at) закрывает горячий запрос поиска пересечений.\u003c/p>\n\u003ch2>Защита от двойного бронирования\u003c/h2>\n\u003cp>Вариант 1 — исключающее ограничение (PostgreSQL):\u003c/p>\n\u003cpre>\u003ccode>ALTER TABLE bookings ADD CONSTRAINT excl_no_overlap\n  EXCLUDE USING gist (\n    room_id WITH =, tsrange(starts_at, ends_at) WITH &amp;&amp;\n  ) WHERE (status = 'ACTIVE');\n\u003c/code>\u003c/pre>\n\u003cp>База сама отклонит пересекающиеся активные брони → приложению остаётся отдать 409.\u003c/p>\n\u003cp>Вариант 2 — без EXCLUDE: \u003ccode>SELECT ... FOR UPDATE\u003c/code> по комнате в транзакции + проверка пересечений перед INSERT (пессимистичная блокировка из урока 4).\u003c/p>\n\u003ch2>Связь с контрактом API\u003c/h2>\n\u003cp>Схема — не копия DTO из кейса модуля 2: API отдаёт Booking с bookedBy (логин), а в базе — employee_id FK. Маппинг между ними — MapStruct-маппер. Контракт — для потребителей, схема — для целостности.\u003c/p>\n"}]},{"id":"m4-lesson-01","title":"Зачем брокер: асинхронный мир","module":4,"moduleTitle":"Kafka вглубь","order":1,"lab":null,"html":"\u003ch1>Урок 1. Зачем брокер: асинхронный мир\u003c/h1>\n\u003cp>В пилоте Kafka мелькнула одной картинкой: «сделал дело — опубликовал событие». Теперь — вглубь: как брокер устроен, кто такие партиции и офсеты, почему сообщения не теряются (и когда теряются), и какие паттерны делают асинхронность надёжной. Начнём с мотивации.\u003c/p>\n\u003ch2>Что не так с прямыми вызовами\u003c/h2>\n\u003cp>Сервис заказов должен уведомить о новом заказе: письма, аналитику, поиск. Прямое решение — вызвать всех по HTTP из транзакции создания заказа:\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart TD\n    O[&quot;order-service&quot;] --&gt;|&quot;HTTP&quot;| M[&quot;mail-service&quot;]\n    O --&gt;|&quot;HTTP&quot;| A[&quot;analytics&quot;]\n    O --&gt;|&quot;HTTP&quot;| S[&quot;search-indexer&quot;]\n    M -.-&gt;|&quot;упал — заказ не создался?&quot;| O\n    A -.-&gt;|&quot;медленный — заказ создаётся 5 секунд&quot;| O\u003c/div>\u003cp>Проблемы нарастают как снежный ком:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Связанность\u003c/strong>: заказ знает про всех потребителей и их адреса; новый подписчик = правка заказa\u003c/li>\n\u003cli>\u003cstrong>Каскадные сбои\u003c/strong>: почтовый лежит — заказы не оформляются\u003c/li>\n\u003cli>\u003cstrong>Задержка\u003c/strong>: клиент ждёт самого медленного\u003c/li>\n\u003cli>\u003cstrong>Потеряные события\u003c/strong>: сервис analytics перезапускают — что случилось в этот момент, никто не узнает\u003c/li>\n\u003c/ul>\n\u003ch2>Событие и брокер\u003c/h2>\n\u003cp>Меняем модель: заказ-сервис \u003cstrong>публикует факт\u003c/strong> — «заказ создан» — в именованный канал (\u003cstrong>topic\u003c/strong>), не зная, кто читает. Потребители \u003cstrong>подписаны\u003c/strong> и читают в своём темпе. Между ними — \u003cstrong>брокер\u003c/strong> (Kafka): принимает, хранит, раздаёт.\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    O[&quot;order-service&lt;br/&gt;(продюсер)&quot;] --&gt; T[&quot;topic: orders.created&quot;]\n    T --&gt; M[&quot;mail-service&quot;]\n    T --&gt; A[&quot;analytics&quot;]\n    T --&gt; S[&quot;search-indexer&quot;]\u003c/div>\u003cp>Что это меняет по сравнению с прямым вызовом:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>\u003c/th>\n\u003cth>Прямые HTTP-вызовы\u003c/th>\n\u003cth>Через брокер\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Кто кого знает\u003c/td>\n\u003ctd>Заказ знает всех\u003c/td>\n\u003ctd>Никто никого не знает, только topic\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Потребитель лежит\u003c/td>\n\u003ctd>Отравитель звонков страдает\u003c/td>\n\u003ctd>События копятся, догонит после старта\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Добавить потребителя\u003c/td>\n\u003ctd>Правка кода заказa\u003c/td>\n\u003ctd>Подписаться на topic — код не меняется\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Темп\u003c/td>\n\u003ctd>Синхронно, ждём всех\u003c/td>\n\u003ctd>Каждый читает со своей скоростью\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>История\u003c/td>\n\u003ctd>Нет (мимо = потеряно)\u003c/td>\n\u003ctd>Kafka хранит события: можно перечитать\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Важно понимать смену смысла: HTTP-вызов — это \u003cstrong>команда\u003c/strong> («отправь письмо»), событие — это \u003cstrong>факт\u003c/strong> («заказ создан»). Событие уже случилось и не может «не отправиться» из-за чьего-то сбоя.\u003c/p>\n\u003ch2>Доставка: at-least-once и последствия\u003c/h2>\n\u003cp>Сетей без потерь не бывает, поэтому Kafka по умолчанию гарантирует \u003cstrong>at-least-once\u003c/strong>: сообщение доставится \u003cstrong>хотя бы один раз\u003c/strong> — а значит, иногда \u003cstrong>дважды\u003c/strong> (ретрай после неуверенного таймаута).\u003c/p>\n\u003cp>Следствие — главное правило асинхронного мира:\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Консюмер должен быть идемпотентным\u003c/strong>: повторная обработка того же события не должна создавать дубль.\u003c/p>\n\u003c/blockquote>\n\u003cp>«Отправить письмо повторно» — терпимо. «Начислить бонус повторно» — нет: обработчик проверяет, не обработал ли он уже это событие (по id), прежде чем действовать. Это тема урока 5, но помните о ней с первой минуты.\u003c/p>\n\u003ch2>События в коде: как это выглядит\u003c/h2>\n\u003cp>Публикация в Spring — одна строка (продюсер):\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Service\u003c/span>\n\u003cspan class=\"hljs-meta\">@RequiredArgsConstructor\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">OrderService\u003c/span> {\n\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> \u003cspan class=\"hljs-keyword\">final\u003c/span> KafkaTemplate&lt;String, OrderCreatedEvent&gt; kafkaTemplate;\n\n    \u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n    \u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">OrderResponse\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest request)\u003c/span> {\n        \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-comment\">/* создать и сохранить */\u003c/span>;\n        kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>,\n                String.valueOf(order.getId()),\n                \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(order.getId(), order.getAmount()));\n        \u003cspan class=\"hljs-keyword\">return\u003c/span> toResponse(order);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Чтение — листенер (консюмер), его напишет подписчик:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@KafkaListener(topics = &quot;orders.created&quot;, groupId = &quot;mail-service&quot;)\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">onOrderCreated\u003c/span>\u003cspan class=\"hljs-params\">(OrderCreatedEvent event)\u003c/span> {\n    mailService.sendOrderConfirmation(event.orderId());\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>groupId\u003c/code> — «кто я такой»: все инстансы mail-service в одной группе делят работу между собой. Как именно — урок 3.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> pub/sub вы видели в шинах событий (EventBus, Redux). Kafka — то же, но события персистентны: подписчик может «перемыть» историю. \u003ccode>groupId\u003c/code> ≈ имя подписчика: один и тот же обработчик в нескольких вкладках не должен получать копию события.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> асинхронность меняет тестирование: проверка «нажал кнопку — пришло письмо» больше не транзакция, а цепочка с задержкой. Тестируйте событие как отдельный контракт: опубликовали \u003ccode>orders.created\u003c/code> — слушатели обязаны отработать; и обязательно — повторную доставку (at-least-once!).\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> событие — первичный факт предметной области: «заказ создан», «платёж прошёл». Продуктовая аналитика в реальном времени строится именно на потоке событий, а не на ночных выгрузках таблиц. Вы помогаете называть события так, чтобы они были понятны через год.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Прямые вызовы связывают сервисы и каскадируют сбои; брокер развязывает их по времени и знанию\u003c/li>\n\u003cli>Событие — факт, уже случившийся; команда — просьба что-то сделать; Kafka про факты\u003c/li>\n\u003cli>Kafka хранит события: потребители читают в своём темпе, могут перечитать\u003c/li>\n\u003cli>Гарантия доставки — at-least-once: повторы возможны, консюмер обязан быть идемпотентным\u003c/li>\n\u003cli>В Spring: \u003ccode>kafkaTemplate.send(topic, key, event)\u003c/code> и \u003ccode>@KafkaListener(topics, groupId)\u003c/code>\u003c/li>\n\u003c/ul>\n\u003cp>Дальше — внутрь брокера: топики, партиции и почему порядок сообщений связан с ключами.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Заказ-сервис синхронно вызывает почтовый, аналитику и индексатор поиска. Почтовый упал. Что происходит с оформлением заказов?","options":["Зависит от обработки ошибок: либо заказ падает вместе с почтой, либо письмо теряется — обе стороны плохи","Ничего: вызовы независимы","Kafka доставит письмо позже","Заказ всегда создаётся, письма накапливаются в базе"],"correct":0,"explanation":"Синхронная цепочка без запасного пути: либо транзакция падает (клиент страдает), либо событие теряется (молча). Брокер разрубает эту развилку: событие фиксируется и ждёт подписчика."},{"type":"single","question":"Чем событие «orders.created» принципиально отличается от команды «sendOrderEmail»?","options":["Событие — уже случившийся факт, издатель не знает и не ждёт обработчиков; команда — просьба что-то сделать конкретному исполнителю","Ничем: это синонимы","События пишутся только в базу","Команды нельзя отправлять в Kafka"],"correct":0,"explanation":"Факт не может «не удаться» и не адресован никому. Из этого растёт вся развязка: новые подписчики без правок издателя, независимые темпы, перечитывание."},{"type":"multi","question":"Что даёт переход на брокер? (несколько ответов)","options":["Новый потребитель подписывается без правок издателя","Упавший потребитель догоняет пропущенное после перезапуска","Гарантия exactly-once из коробки без усилий","Издатель не ждёт самых медленных подписчиков"],"correct":[0,1,3],"explanation":"Exactly-once из коробки не бывает: at-least-once + идемпотентность обработчика — вот реальный контракт."},{"type":"blank","question":"Как называется гарантия доставки «хотя бы один раз, возможны повторы»? (формат: at-…-once)","answers":["at-least-once","at least once"],"explanation":"At-least-once. Повторы — норма, поэтому консюмер проектируют идемпотентным."},{"type":"match","question":"Сопоставьте понятие и роль.","pairs":[{"left":"Topic","right":"Именованный канал событий"},{"left":"Продюсер","right":"Публикует события в topic"},{"left":"Консюмер","right":"Подписан и читает события"},{"left":"groupId","right":"Имя группы: её инстансы делят чтение между собой"}]},{"type":"single","question":"Консюмер начисляет бонус за регистрацию, слушая user.registered. Событие пришло дважды (at-least-once). Что нужно в обработчике?","options":["Идемпотентность: проверить по id события, не начислен ли уже бонус, и только тогда действовать","Ничего: повторы игнорируются брокером автоматически","Переключить Kafka на exactly-once","Отправить письмо дважды — так задумано"],"correct":0,"explanation":"Повторы — свойство доставки, а не чья-то ошибка. Обработчик обязан быть безопасным к повтору: уникальный ключ, проверка «уже сделано», транзакция с идемпотентной записью."},{"type":"single","question":"Продакт хочет новое событие «заказ доставлен» для пуш-уведомлений и обновления аналитики. Что меняется в сервисе заказов?","options":["Ничего: заказ уже публикует orders.delivered — подписчики просто слушают новый для них topic","Заказ-сервис получает адреса всех подписчиков","Нужны отдельные HTTP-ручки для пушей и аналитики","Заказы перестают создавать события"],"correct":0,"explanation":"Смысл развязки: издатель публикует факты, потребители приходят и уходят сами. Правка — только если самого факта ещё нет."}]],"cases":[]},{"id":"m4-lesson-02","title":"Топики, партиции, офсеты","module":4,"moduleTitle":"Kafka вглубь","order":2,"lab":null,"html":"\u003ch1>Урок 2. Топики, партиции, офсеты\u003c/h1>\n\u003cp>Kafka часто называют «большим логом» — и это самое точное описание. Разберём физическое устройство: во что пишутся события, как брокер хранит годы истории и почему порядок сообщений — не то, чем кажется.\u003c/p>\n\u003ch2>Topic: лог с именем\u003c/h2>\n\u003cp>\u003cstrong>Topic\u003c/strong> — не «очередь», а \u003cstrong>журнал (лог)\u003c/strong>: события дописываются в конец и хранятся, а не удаляются после прочтения. Прочитали — просто запомнили, докуда.\u003c/p>\n\u003cdiv class=\"mermaid\">flowchart LR\n    P[&quot;продюсеры&quot;] --&gt; T\n    subgraph T[&quot;topic: orders.created&quot;]\n        direction LR\n        L[&quot;e₁ e₂ e₃ e₄ e₅ …дописывается в конец&quot;]\n    end\n    T --&gt; C1[&quot;консюмер A&lt;br/&gt;(читает с 3)&quot;]\n    T --&gt; C2[&quot;консюмер B&lt;br/&gt;(перечитывает с 1)&quot;]\u003c/div>\u003cp>Отсюда суперсила Kafka: два консюмера читают \u003cstrong>один и тот же\u003c/strong> topic с разных позиций и в разном темпе — данные не исчезают после первого прочтения. \u003cstrong>Retention\u003c/strong> (сколько хранить) настраивается на topic: часы, дни, годы — или «пока не кончится место».\u003c/p>\n\u003ch2>Partition: параллельный лог\u003c/h2>\n\u003cp>Topic разбит на \u003cstrong>партиции\u003c/strong> — независимые логи на разных брокерах:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">topic: orders.created\n├── partition 0:  e₁  e₄  e₅  e₈   ← ключ K1\n├── partition 1:  e₂  e₃  e₆       ← ключ K2\n└── partition 2:  e₇  e₉           ← ключ K3\n\u003c/code>\u003c/pre>\n\u003cp>Партиции дают две вещи:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Масштаб записи и чтения\u003c/strong>: разные партиции живут на разных брокерах; разные консюмеры группы читают разные партиции параллельно\u003c/li>\n\u003cli>\u003cstrong>Порядок внутри партиции\u003c/strong>: события одного ключа — всегда в порядке записи\u003c/li>\n\u003c/ol>\n\u003ch2>Ключ и правило порядка\u003c/h2>\n\u003cp>Сообщение может иметь \u003cstrong>ключ\u003c/strong>. Одинаковый ключ → всегда одна и та же партиция (хэш ключа). Отсюда главное правило порядка в Kafka:\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Гарантия порядка — только внутри партиции.\u003c/strong> Хотите «события заказа 42 идут по порядку» — публикуйте их с ключом \u003ccode>&quot;42&quot;\u003c/code>, и они лягут в одну партицию друг за другом.\u003c/p>\n\u003c/blockquote>\n\u003cp>Без ключа события_ROUND_ROBIN'ятся по партициям — глобального порядка нет вовсе. Это не баг: для независимых событий порядок и не нужен.\u003c/p>\n\u003cp>Практика именования: \u003ccode>topic\u003c/code> — множественное число фактов (\u003ccode>orders.created\u003c/code>), ключ — идентичность сущности (\u003ccode>orderId\u003c/code>). Один заказ = один ключ = строгий порядок его событий.\u003c/p>\n\u003ch2>Offset: закладка читателя\u003c/h2>\n\u003cp>\u003cstrong>Offset\u003c/strong> — номер события в партиции (0, 1, 2…). Позиция консюмера — это offset, и он принадлежит \u003cstrong>группе\u003c/strong> (groupId), а не отдельному процессу:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">partition 0:  e₁  e₂  e₃  [e₄]  e₅  e₆\n                             ↑\n        группа mail-service зафиксировала offset = 4\n        (e₄ обработана, но коммит ещё не прошёл?)\n\u003c/code>\u003c/pre>\n\u003cp>Кто что читает — хранит сам Kafka (offsets topic). Поэтому:\u003c/p>\n\u003cul>\n\u003cli>инстанс упал → поднялся → продолжает с зафиксированного offset'а своей группы;\u003c/li>\n\u003cli>новая группа с нуля → прочитает \u003cstrong>всю историю\u003c/strong> topic'а (или с \u003ccode>earliest/latest\u003c/code> — как настроите);\u003c/li>\n\u003cli>группу удалили → её offsets потеряны → новая с тем же именем начнёт по правилам «старта».\u003c/li>\n\u003c/ul>\n\u003cp>Коммит offset'а — момент истины: \u003cstrong>закомитили после обработки\u003c/strong> — потеряете при сбое минимум; закомитили до — рискуете потерять само событие. Подробно — в уроке 4.\u003c/p>\n\u003ch2>Сколько партиций нужно\u003c/h2>\n\u003cp>Партиции — единица параллелизма: в группе не больше активных консюмеров, чем партиций topic'а (лишние сидят без работы). Мало партиций — узкое место чтения; много — дольше старт, больше файлов и запросов у брокера. Стартуют обычно с запасом (например, 6–12 для горячего topic'а), потому что \u003cstrong>увеличить можно, а уменьшить — нельзя\u003c/strong> (только пересозданием topic'а).\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> «дубликаты» и «пропуски» в асинхронных фичах почти всегда про offset'ы: закомитили до обработки — пропуск при сбое; после — дубль при ретрае. Тест с убийством консюмера на середине батча — высшая лига вашего ремесла.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> «источник правды по событиям» = topic с retention. Спрашивая «а можно выгрузить всё за прошлый квартал ещё раз», вы просите перечитать лог с offset'а начала квартала — это штатная операция, а не «сложно, нельзя».\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Topic — лог: события дописываются в конец и хранятся по retention; читатели не удаляют данные\u003c/li>\n\u003cli>Партиции — параллелизм и единица порядка; гарантия порядка — внутри партиции\u003c/li>\n\u003cli>Ключ сообщения маршрутизирует в партицию: \u003ccode>orderId\u003c/code> ключом = порядок событий заказа\u003c/li>\n\u003cli>Offset — закладка группы; коммит после обработки — меньшая из бед (дубль), до — потеря\u003c/li>\n\u003cli>Партиции наращивают, но не сокращают: закладывайте запас сразу\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Чем topic Kafka принципиально отличается от очереди (queue)?","options":["События не удаляются после чтения: несколько групп могут читать один topic каждая со своей позиции","В topic нельзя писать больше одного продюсера","Очередь хранит данные дольше","Ничем не отличается"],"correct":0,"explanation":"Очередь: взял — исчезло. Лог: дописал в конец — храни retention, читатели ходят с закладками-offset'ами. Отсюда перечитывание истории и независимость потребителей."},{"type":"single","question":"Продакт требует: «статусы заказа 42 должны обрабатываться строго по порядку». Что гарантирует это?","options":["Публиковать события заказа с ключом \"42\": одинаковый ключ → одна партиция → порядок внутри неё","Включить сортировку в брокере","Сделать topic с одной партицией для всех заказов","Ничего: Kafka всегда сохраняет глобальный порядок"],"correct":0,"explanation":"Порядок — только внутри партиции, партиция выбирается хэшем ключа. Ключ = orderId даёт порядок событий каждого заказа и параллельность между заказами. Одна партиция для всех тоже дала бы порядок, но убила бы масштабирование."},{"type":"multi","question":"Что верно про партиции? (несколько ответов)","options":["Активных консюмеров в группе не может быть больше, чем партиций у topic'а","Партиции одного topic'а могут жить на разных брокерах","Партиции можно уменьшить командой на лету","Партиций можно добавить позже"],"correct":[0,1,3],"explanation":"Уменьшение — только пересозданием topic'а. Поэтому параллелизм закладывают с запасом."},{"type":"blank","question":"Как называется номер позиции события внутри партиции, который группа фиксирует как закладку чтения? (одно слово)","answers":["offset","офсет"],"explanation":"Offset. Хранится у Kafka на группу+партицию; правила коммита определяют повторы/потери при сбоях."},{"type":"match","question":"Сопоставьте понятие и смысл.","pairs":[{"left":"Retention","right":"Сколько времени topic хранит события"},{"left":"Ключ сообщения","right":"Определяет партицию и группирует порядок"},{"left":"Consumer group","right":"Владеет offset'ами и делит партиции между инстансами"},{"left":"Брокер","right":"Сервер Kafka, хранит партиции"}]},{"type":"single","question":"Группа analytics перечитывает topic с самого начала. Где лежит информация, с какого offset'а ей продолжать после рестарта?","options":["В самой Kafka: offsets фиксируются на группу и партицию","В базе данных каждого консюмера — вручную","Нигде: каждый старт читает всё заново","В заголовке сообщения"],"correct":0,"explanation":"Kafka хранит коммиты offset'ов по группам. Это и делает потребителей stateless-ми: упал-поднялся — продолжил с закладки."},{"type":"single","question":"Команда создала topic с 3 партициями, а консюмеров в группе — 6. Что будет?","options":["Активны только 3 консюмера — по числу партиций; остальные — горячий резерв","Все 6 будут читать каждую партицию","Kafka автоматически разрежет партиции","Ничего плохого: 6 > 3 — так и надо"],"correct":0,"explanation":"Партиция — атом параллелизма: её нельзя делить внутри группы. Лишние инстансы ждут (резерв при падении). Хотите 6 рабочих — закладывайте ≥6 партиций."}]],"cases":[]},{"id":"m4-lesson-03","title":"Продюсер","module":4,"moduleTitle":"Kafka вглубь","order":3,"lab":null,"html":"\u003ch1>Урок 3. Продюсер: публикация без потерь\u003c/h1>\n\u003cp>Продюсер выглядит как одна строка \u003ccode>kafkaTemplate.send(...)\u003c/code> — пока всё хорошо. Урок о том, что за этой строкой: сериализация, ключи, подтверждения и что отличает «отправил» от «не потерял».\u003c/p>\n\u003ch2>Анатомия send()\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, \u003cspan class=\"hljs-string\">&quot;42&quot;\u003c/span>, \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">OrderCreatedEvent\u003c/span>(\u003cspan class=\"hljs-number\">42L\u003c/span>, amount));\n\u003cspan class=\"hljs-comment\">//              topic               ключ      значение (payload)\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Путь сообщения внутри продюсера:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Сериализация\u003c/strong>: ключ и значение превращаются в байты — \u003ccode>StringSerializer\u003c/code>, \u003ccode>JsonSerializer\u003c/code> (вес события — обычный JSON)\u003c/li>\n\u003cli>\u003cstrong>Партиционирование\u003c/strong>: хэш ключа → номер партиции; без ключа — round-robin/sticky\u003c/li>\n\u003cli>\u003cstrong>Батчер\u003c/strong>: сообщения копятся микробатчами (за счёт этого Kafka такая быстрая)\u003c/li>\n\u003cli>\u003cstrong>Отправка + ожидание подтверждения\u003c/strong> — по настройке \u003ccode>acks\u003c/code>\u003c/li>\n\u003c/ol>\n\u003ch2>acks: кто и перед кем отчитывается\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>acks\u003c/th>\n\u003cth>Подтверждение\u003c/th>\n\u003cth>Риск\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>0\u003c/code>\u003c/td>\n\u003ctd>Не ждём никого\u003c/td>\n\u003ctd>Пожар: могло не дойти вообще\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>1\u003c/code>\u003c/td>\n\u003ctd>Лидер партиции записал\u003c/td>\n\u003ctd>Лидер упал до репликации — событие потеряно\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>all\u003c/code>\u003c/td>\n\u003ctd>Все ISR-реплики записали\u003c/td>\n\u003ctd>Надёжно; стандарт для ценных данных\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>acks=all\u003c/code> — правильный дефолт для доменных событий. Дешевле всего терять логи метрик (\u003ccode>acks=1\u003c/code>), дороже всего — деньги.\u003c/p>\n\u003cp>Идемпотентный продюсер (\u003ccode>enable.idempotence=true\u003c/code>, в свежих версиях включён по умолчанию): брокер помнит «продюсер №X уже писал с seq №Y» и отбрасывает повтор — ретраи сети не плодят дубли \u003cstrong>на стороне записи\u003c/strong>.\u003c/p>\n\u003ch2>Ретраи и таймауты\u003c/h2>\n\u003cp>Сеть мигает — продюсер ретраит сам (\u003ccode>delivery.timeout.ms\u003c/code>, \u003ccode>retries\u003c/code>). Правило: \u003cstrong>ретраи без идемпотентности = дубли\u003c/strong>, поэтому идемпотентность и ретраи ходят парой. Исчерпал попытки — \u003ccode>send\u003c/code> завершится исключением: ловите и решайте, что важнее — потерять событие или уронить операцию.\u003c/p>\n\u003ch2>Отправка из транзакции: проблема dual-write\u003c/h2>\n\u003cp>Классическая ловушка (мы её почти вырыли в уроке 1):\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(...)\u003c/span> {\n    orderRepository.save(order);                    \u003cspan class=\"hljs-comment\">// ① запись в БД\u003c/span>\n    kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, event);    \u003cspan class=\"hljs-comment\">// ② отправка в Kafka\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Коммит БД происходит \u003cstrong>после\u003c/strong> выхода из метода. Упало между ② и коммитом? Событие о \u003cstrong>несуществующем\u003c/strong> заказе. Упало после коммита, но ① без ② (брокер недоступен)? Заказ есть — события нет, аналитика никогда не узнает. Это \u003cstrong>dual-write problem\u003c/strong>: две независимые системы записи без общей транзакции.\u003c/p>\n\u003cp>Штатное решение — \u003cstrong>transactional outbox\u003c/strong> (детали в уроке 5): в той же БД-транзакции пишем событие в таблицу \u003ccode>outbox\u003c/code>, отдельный релей читает её и публикует в Kafka. Запись заказа и «намерение опубликовать» становятся атомарными.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> dual-write — старый знакомый: «сохрани на сервере и отправь аналитику» в двух вызовах из браузера роняется точно так же. Outbox — «сначала записал в один источник, потом разнёс» — тот же паттерн, что оптимистичные обновления UI.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Практика конфигурации\u003c/h2>\n\u003cpre>\u003ccode class=\"language-yaml\">\u003cspan class=\"hljs-attr\">spring:\u003c/span>\n  \u003cspan class=\"hljs-attr\">kafka:\u003c/span>\n    \u003cspan class=\"hljs-attr\">producer:\u003c/span>\n      \u003cspan class=\"hljs-attr\">acks:\u003c/span> \u003cspan class=\"hljs-string\">all\u003c/span>\n      \u003cspan class=\"hljs-attr\">properties:\u003c/span>\n        \u003cspan class=\"hljs-attr\">enable.idempotence:\u003c/span> \u003cspan class=\"hljs-literal\">true\u003c/span>\n      \u003cspan class=\"hljs-attr\">key-serializer:\u003c/span> \u003cspan class=\"hljs-string\">org.apache.kafka.common.serialization.StringSerializer\u003c/span>\n      \u003cspan class=\"hljs-attr\">value-serializer:\u003c/span> \u003cspan class=\"hljs-string\">org.springframework.kafka.support.serializer.JsonSerializer\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cp>Именование topic'ов — контракт: \u003ccode>домен.факт\u003c/code> (\u003ccode>orders.created\u003c/code>, \u003ccode>payments.succeeded\u003c/code>). Не \u003ccode>events\u003c/code>, не \u003ccode>topic1\u003c/code>: по имени должно быть понятно, что случилось.\u003c/p>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Путь события: сериализация → партиция по ключу → батч → подтверждение\u003c/li>\n\u003cli>\u003ccode>acks=all\u003c/code> + идемпотентный продюсер — норма для доменных событий; acks=0/1 — осознанный риск\u003c/li>\n\u003cli>Ретраи безопасны только с идемпотентностью записи\u003c/li>\n\u003cli>Dual-write (БД + Kafka в одном методе) — источник потерянных/фантомных событий; лечится outbox-паттерном\u003c/li>\n\u003cli>Имя topic'а — часть контракта: \u003ccode>домен.факт\u003c/code>, ключ — идентичность сущности\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — вторая сторона: консюмеры, группы и что происходит при сбоях чтения.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Чем acks=all принципиально отличается от acks=1?","options":["Ждём подтверждения не только лидера, но и реплик партиции — лидер упал, событие не потерялось","all быстрее, потому что параллельно","1 надёжнее all","all включает сжатие"],"correct":0,"explanation":"1 рискует потерять запись при падении лидера до репликации. all требует кворума ISR-реплик — событие переживёт отказ одного брокера."},{"type":"single","question":"Продюсер шлёт события без ключа. Что можно сказать о порядке?","options":["Никакого глобального порядка нет: сообщения распределяются по партициям","Порядок строгий: Kafka сортирует по времени","Порядок есть, но только по вторникам","Сообщения без ключа отклоняются"],"correct":0,"explanation":"Без ключа партиция выбирается round-robin — соседние события уезжают в разные партиции. Порядок нужен? Ставьте ключ сущности."},{"type":"multi","question":"Что даёт enable.idempotence у продюсера? (несколько ответов)","options":["Брокер отличает ретрай от новой записи по seq-номерам — дублей записи нет","Ретраи сети становятся безопасными","Консюмеры автоматически становятся идемпотентными","Сообщения получают ключ автоматически"],"correct":[0,1],"explanation":"Идемпотентность — только про запись продюсером. Дубли на чтении (at-least-once доставке) остаются заботой консюмера."},{"type":"single","codeLang":"java","code":"@Transactional\npublic void create(CreateOrderRequest r) {\n    orderRepository.save(order);                   // ①\n    kafkaTemplate.send(\"orders.created\", event);   // ②\n}   // коммит БД — здесь, после метода\n","question":"Брокер доступен, БД упала на коммите. Что получил подписчик?","options":["Событие о заказе, которого нет в базе: dual-write во всей красе","Ничего: всё откатилось атомарно","Событие и заказ: транзакция всё согласовало","Ошибку в topic"],"correct":0,"explanation":"Kafka не участник БД-транзакции: send прошёл, коммит — нет. Обратный сценарий (коммит есть, send упал) теряет событие. Лечение — outbox.","codeHtml":"\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">create\u003c/span>\u003cspan class=\"hljs-params\">(CreateOrderRequest r)\u003c/span> {\n    orderRepository.save(order);                   \u003cspan class=\"hljs-comment\">// ①\u003c/span>\n    kafkaTemplate.send(\u003cspan class=\"hljs-string\">&quot;orders.created&quot;\u003c/span>, event);   \u003cspan class=\"hljs-comment\">// ②\u003c/span>\n}   \u003cspan class=\"hljs-comment\">// коммит БД — здесь, после метода\u003c/span>\n"},{"type":"blank","question":"Как называется паттерн, при котором событие сначала атомарно пишется в таблицу базы рядом с бизнес-данными, а отдельный процесс публикует его в Kafka? (английское слово)","answers":["outbox","transactional outbox","аутбокс"],"explanation":"Transactional outbox: одна транзакция на заказ+событие, релей гарантирует публикацию. Единственный честный ответ на dual-write."},{"type":"match","question":"Сопоставьте настройку/понятие и её эффект.","pairs":[{"left":"acks=all","right":"Подтверждение после записи репликами"},{"left":"enable.idempotence","right":"Ретраи продюсера не создают дублей записи"},{"left":"ключ сообщения","right":"Партиция и порядок событий одной сущности"},{"left":"JsonSerializer","right":"Событие сериализуется как JSON"}]},{"type":"single","question":"В ревью PR видите topic с именем \"events\" для всех событий компании. Ваш комментарий?","options":["Имя topic'а — контракт: разбить на домен.факт (orders.created, payments.succeeded), иначе подписчики фильтруют шум и связаны чужими изменениями","Отлично: один topic — меньше настройки","Имя ни на что не влияет","Нужно назвать topic1"],"correct":0,"explanation":"Тематическое имя разводит потребителей по потокам фактов: каждый слушает своё, retention и партиции настраиваются под нагрузку конкретного домена."}]],"cases":[]},{"id":"m4-lesson-04","title":"Консюмер и группы","module":4,"moduleTitle":"Kafka вглубь","order":4,"lab":null,"html":"\u003ch1>Урок 4. Консюмер и группы\u003c/h1>\n\u003cp>Вторая сторона диалога: кто и как читает лог. Разберём группы и ребалансировку — механику, которая раскидывает партиции по инстансам, — и главное: где живут повторы, пропуски и мёртвые сообщения.\u003c/p>\n\u003ch2>Consumer group: очередь внутри pub/sub\u003c/h2>\n\u003cp>Группа превращает topic в очередь \u003cstrong>для себя\u003c/strong>: партиции topic'а делятся между инстансами группы, каждое событие достаётся ровно одному инстансу группы. Разные группы друг другу не мешают — каждая читает всё.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">topic (3 партиции), группа mail-service из 3 инстансов:\n\n  partition 0 → инстанс-1\n  partition 1 → инстанс-2\n  partition 2 → инстанс-3\n\nгруппа analytics читает те же партиции СВОИМИ силами и со своими offset&#x27;ами\n\u003c/code>\u003c/pre>\n\u003cp>Масштабирование: медленно обрабатываете — добавляете инстансы (до числа партиций). Отказоустойчивость: инстанс умер — его партиции перераспределятся.\u003c/p>\n\u003ch2>Rebalance: перетасовка партиций\u003c/h2>\n\u003cp>Изменение состава группы (упал/поднялся инстанс, деплой) → \u003cstrong>rebalance\u003c/strong>: партиции заново делят между выжившими. На время ребаланса группа стоит: не паникуйте, это секунды. Тонкость — что считать «умершим»: \u003ccode>max.poll.interval.ms\u003c/code> — если обработка батча дольше, консюмер выкидывается из группы, инициируя ребаланс. Медленный обработчик → вечные ребалансы → группа буксует. Лечение: батчи меньше, обработка быстрее, тяжёлое — наружу из листенера.\u003c/p>\n\u003ch2>Обработка, потом коммит\u003c/h2>\n\u003cp>Цикл консюмера: прочитать батч → обработать → \u003cstrong>заккоммитить offset'ы\u003c/strong>. Момент коммита определяет семантику сбоя:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Коммит\u003c/th>\n\u003cth>Сбой после\u003c/th>\n\u003cth>Последствие\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>После обработки\u003c/td>\n\u003ctd>Коммита\u003c/td>\n\u003ctd>Событие обработается повторно (\u003cstrong>дубль\u003c/strong>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>До обработки\u003c/td>\n\u003ctd>Коммита\u003c/td>\n\u003ctd>Событие потеряно (\u003cstrong>пропуск\u003c/strong>)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Spring-листенер коммитит после успешного вызова метода: потерь не получится, дубли — могут (норма at-least-once, урок 1). Отсюда железное требование идемпотентности обработчика.\u003c/p>\n\u003ch2>Ошибки обработки: DLT\u003c/h2>\n\u003cp>Обработчик упал на «ядовитом» сообщении (битый JSON, неожиданное состояние). Без стратегии — бесконечный цикл: партиция стоит, событие возвращается после рестарта. Штатное решение — \u003cstrong>Dead Letter Topic (DLT)\u003c/strong>: после N безуспешных попыток событие уезжает в \u003ccode>topic.DLT\u003c/code>, партиция продолжает жить:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@KafkaListener(\n        topics = &quot;orders.created&quot;,\n        groupId = &quot;mail-service&quot;,\n        properties = {&quot;default.deserialization.value...&quot;}, // опустим\n        ...)\u003c/span>\n\u003cspan class=\"hljs-meta\">@RetryableTopic(attempts = &quot;4&quot;, dltTopicSuffix = &quot;.DLT&quot;)\u003c/span>   \u003cspan class=\"hljs-comment\">// 3 попытки, потом .DLT\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">onOrderCreated\u003c/span>\u003cspan class=\"hljs-params\">(OrderCreatedEvent event)\u003c/span> {\n    mailService.sendOrderConfirmation(event.orderId());\n}\n\n\u003cspan class=\"hljs-meta\">@DltHandler\u003c/span>\n\u003cspan class=\"hljs-keyword\">public\u003c/span> \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">toDlt\u003c/span>\u003cspan class=\"hljs-params\">(OrderCreatedEvent event)\u003c/span> {\n    log.error(\u003cspan class=\"hljs-string\">&quot;Событие ушло в DLT после ретраев: {}&quot;\u003c/span>, event);\n    \u003cspan class=\"hljs-comment\">// алерт, разбор руками, починка и переигровка\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>DLT — не мусорка, а рабочий инструмент: алерт на его глубину, регулярный разбор, переигрывание после починки.\u003c/p>\n\u003ch2>@KafkaListener: что ещё в хозяйстве\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Фильтры\u003c/strong>: пропускать нецелевые события до обработчика\u003c/li>\n\u003cli>\u003cstrong>Батчи\u003c/strong>: слушать \u003ccode>List&lt;Message&lt;?&gt;&gt;\u003c/code> — для высоких потоков\u003c/li>\n\u003cli>\u003cstrong>Заголовки\u003c/strong>: трейсинг-id, версия схемы — читаются как метаданные\u003c/li>\n\u003cli>\u003cstrong>Ручной Ack\u003c/strong>: точный контроль коммита для «обработал пачку — закоммитил разом»\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> три обязательных кейса по консюмерам: (1) дубль — событие пришло дважды, эффект один; (2) яд — битое сообщение не подвешивает партицию, а уезжает в DLT; (3) ребаланс — убийство инстанса не теряет события. Если фича проходит все три — она переживёт пятничный деплой.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> «событие не обработалось» — теперь измеримый процесс: N попыток → DLT → алерт. Требование «все заказы получают письма» превращается в метрику «глубина DLT = 0 и лаг группы = 0». Это ваш язык с инженерами.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Группа делит партиции между инстансами: каждая группа читает всё своими темпами\u003c/li>\n\u003cli>Rebalance перетасовывает партиции при изменении состава; долгая обработка → выпадение из группы\u003c/li>\n\u003cli>Коммит после обработки: терять нельзя, дубли можно (идемпотентность!)\u003c/li>\n\u003cli>Ядовитые события — в DLT после N попыток: партиция живёт, инцидент виден\u003c/li>\n\u003cli>Лаг группы (отставание от хвоста лога) — главная метрика здоровья консюмера\u003c/li>\n\u003c/ul>\n\u003cp>Последний урок модуля собирает надёжность в целые паттерны: outbox, идемпотентный консюмер и порядок vs параллелизм.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Два инстанса mail-s
