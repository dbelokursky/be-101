cy=payment elapsedMs=1930 traceId=a1f0\n14:22:01 orders  WARN dependency=db elapsedMs=1870 traceId=b2c9\n"},{"type":"single","topic":"m5-lesson-01","question":"Итог курса. «Система наблюдаемая», если…","options":["По её сигналам можно расследовать неизвестную проблему: метрики скажут «что и сколько», логи — «что именно», трейсы — «где», алерты позовут вовремя","У неё есть health-check","Логи пишутся в файл на сервере","Grafana установлена"],"correct":0,"explanation":"Наблюдаемость — свойство отвечать на вопросы, которых не предвидели. Инструменты — средства; дисциплина метрик-логов-трейсов-алертов — суть. Курс пройден! 🎓"}]],"cases":[{"title":"Наблюдаемость фичи «оформление заказа» на прод","task":"Команда выпускает новый заказ-сервис. Опишите план наблюдаемости: (1) какие метрики заложите (технические и бизнес, с именами и тегами); (2) какие алерты поставите ДО релиза (условие + время горения + кому); (3) как организуете логи и корреляцию (что в MDC, как traceId едет в Kafka-события); (4) что попадёт на дашборд дежурного, а что — на дашборд продакта; (5) инцидент: заказы «висят» — ваши первые три хода расследования. Форма свободная.","placeholder":"Метрики: orders.created.total{country=...}, http p99...\nАлерты: error_rate>1% 10m → дежурному...\nЛоги: JSON, traceId...","referenceHtml":"\u003cp>Один из возможных ответов.\u003c/p>\n\u003ch2>Метрики\u003c/h2>\n\u003cp>Технические (почти все автоматические):\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>http.server.requests\u003c/code> p50/p99 {uri, method, status} — авто из Boot\u003c/li>\n\u003cli>\u003ccode>hikaricp.connections.pending\u003c/code> — пул БД\u003c/li>\n\u003cli>лаг консюмер-групп, глубина DLT (если сервис и слушает, и публикует)\u003c/li>\n\u003c/ul>\n\u003cp>Бизнес (пишем рядом с кодом):\u003c/p>\n\u003cul>\n\u003cli>Counter \u003ccode>orders.created.total{country, channel}\u003c/code> — конечные теги\u003c/li>\n\u003cli>Counter \u003ccode>payments.failed.total{reason}\u003c/code> — reason из enum: insufficient_funds/gateway_timeout\u003c/li>\n\u003cli>Timer \u003ccode>orders.create.time\u003c/code> — таймер всей операции\u003c/li>\n\u003c/ul>\n\u003ch2>Алерты до релиза\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Условие\u003c/th>\n\u003cth>Время\u003c/th>\n\u003cth>Кому\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>error_rate &gt; 1%\u003c/td>\n\u003ctd>10 мин\u003c/td>\n\u003ctd>дежурный orders\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>p99 POST /api/orders &gt; 2s\u003c/td>\n\u003ctd>10 мин\u003c/td>\n\u003ctd>дежурный orders\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>orders.created.total растёт = 0 при трафике &gt; X\u003c/td>\n\u003ctd>15 мин\u003c/td>\n\u003ctd>дежурный + продакт\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>lag группы &gt; 100k\u003c/td>\n\u003ctd>15 мин\u003c/td>\n\u003ctd>дежурный\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Каждый алерт — со ссылкой на runbook.\u003c/p>\n\u003ch2>Логи и корреляция\u003c/h2>\n\u003cul>\n\u003cli>JSON-логи; MDC: traceId, orderId (после создания)\u003c/li>\n\u003cli>traceId: с фронта через шлюз → фильтр кладёт в MDC → в ответе заголовком\u003c/li>\n\u003cli>В Kafka: продюсер пишет traceId в заголовок события; консюмер кладёт в MDC\u003c/li>\n\u003cli>WARN на бизнес-отказах (с кодом), ERROR — только «нужен человек»\u003c/li>\n\u003c/ul>\n\u003ch2>Дашборды\u003c/h2>\n\u003cp>Дежурный: RPS, p99, error rate, лаг, DLT — один экран, drill-down по URI.\nПродакт: orders.created.total по странам/каналам, payments.failed по причинам, воронка корзина→заказ→оплата.\u003c/p>\n\u003ch2>«Заказы висят»: три хода\u003c/h2>\n\u003col>\n\u003cli>Дашборд здоровья: p99/error rate/пул БД — локализовать слой (вход? база? внешний вызов?)\u003c/li>\n\u003cli>По traceId зависшего заказа — трейс: какой span длинный/ошибочный\u003c/li>\n\u003cli>Лог с этим traceId: конкретная причина (таймаут шлюза? блокировка?) → runbook/фикс\u003c/li>\n\u003c/ol>\n"}]},{"id":"m5-cheatsheet","title":"Шпаргалка модуля","module":5,"moduleTitle":"Наблюдаемость","order":7,"baseOrder":null,"lab":null,"html":"\u003ch1>Шпаргалка: Наблюдаемость\u003c/h1>\n\u003ch2>Три столпа\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Столп\u003c/th>\n\u003cth>Вопрос\u003c/th>\n\u003cth>Инструмент\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Метрики\u003c/td>\n\u003ctd>Сколько / как быстро / как часто падает\u003c/td>\n\u003ctd>Micrometer → Prometheus → Grafana\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Логи\u003c/td>\n\u003ctd>Что именно случилось\u003c/td>\n\u003ctd>JSON-логи, уровни\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Трейсы\u003c/td>\n\u003ctd>Где в цепочке\u003c/td>\n\u003ctd>traceId, OpenTelemetry, span'ы\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Micrometer\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">Counter.builder(\u003cspan class=\"hljs-string\">&quot;orders.created.total&quot;\u003c/span>).tag(\u003cspan class=\"hljs-string\">&quot;service&quot;\u003c/span>,\u003cspan class=\"hljs-string\">&quot;orders&quot;\u003c/span>).register(registry);  \u003cspan class=\"hljs-comment\">// сколько раз\u003c/span>\nGauge.builder(\u003cspan class=\"hljs-string\">&quot;orders.pending&quot;\u003c/span>, store, s -&gt; s.count()).register(registry);           \u003cspan class=\"hljs-comment\">// сколько сейчас\u003c/span>\nTimer.builder(\u003cspan class=\"hljs-string\">&quot;orders.create.time&quot;\u003c/span>).register(registry);                              \u003cspan class=\"hljs-comment\">// как долго → p99\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>Теги — конечные оси (method, status); \u003ccode>userId\u003c/code> в тегах = кардинальность убьёт Prometheus\u003c/li>\n\u003cli>Доли (error rate) считаются на дашборде из счётчиков, не в коде\u003c/li>\n\u003cli>Путь: код → \u003ccode>/actuator/metrics\u003c/code> → Prometheus (pull) → Grafana\u003c/li>\n\u003c/ul>\n\u003ch2>Золотые сигналы дашборда дежурного\u003c/h2>\n\u003cp>\u003cstrong>Traffic\u003c/strong> (RPS) · \u003cstrong>Latency\u003c/strong> (p99, не среднее!) · \u003cstrong>Errors\u003c/strong> (5xx) · \u003cstrong>Saturation\u003c/strong> (пулы, \u003cstrong>лаг групп\u003c/strong>, \u003cstrong>глубина DLT\u003c/strong>)\u003c/p>\n\u003ch2>Логи\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Уровень\u003c/th>\n\u003cth>Смысл\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>ERROR\u003c/td>\n\u003ctd>Нужен человек (шум = смерть алертов)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>WARN\u003c/td>\n\u003ctd>Странно, но обработано\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>INFO\u003c/td>\n\u003ctd>Факты жизни\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEBUG\u003c/td>\n\u003ctd>Детали (off в проде)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cul>\n\u003cli>JSON-структура: поля читает машина (\u003ccode>orderId=42 AND level=ERROR\u003c/code>)\u003c/li>\n\u003cli>\u003cstrong>MDC + traceId\u003c/strong>: фильтр на входе HTTP, заголовок в Kafka-событии, MDC в листенере\u003c/li>\n\u003cli>Никогда: пароли, токены, карты, «тела целиком»\u003c/li>\n\u003c/ul>\n\u003ch2>Алерты и SLO\u003c/h2>\n\u003cul>\n\u003cli>Алерт = \u003cstrong>симптом\u003c/strong> + время горения + адресат + runbook («error_rate &gt; 1% 10 мин», не «CPU 80%»)\u003c/li>\n\u003cli>SLO: «99.9% успешны за 30 дней» → бюджет ошибок → алерты по темпу сгорания\u003c/li>\n\u003cli>Сработал алерт — есть действие; «привыкли» — переделать алерт\u003c/li>\n\u003c/ul>\n\u003ch2>Чек-лист production-ready\u003c/h2>\n\u003cul>\n\u003cli>[ ] Контракт: OpenAPI, версии, deprecation\u003c/li>\n\u003cli>[ ] Данные: Liquibase, индексы, идемпотентность\u003c/li>\n\u003cli>[ ] Асинхронность: ключи, outbox, DLT, лаг под контролем\u003c/li>\n\u003cli>[ ] Наблюдаемость: сигналы + бизнес-метрики + traceId + алерты по симптомам\u003c/li>\n\u003c/ul>\n","quizzes":[],"cases":[]},{"id":"m6-lesson-01","title":"Зачем тесты и их уровни","module":6,"moduleTitle":"Тесты на бэкенде","order":1,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 1. Зачем тесты и их уровни\u003c/h1>\n\u003cp>Вы уже весь курс живёте с тестами: каждая лаба принималась тестами-приёмниками. Этот модуль — про другую сторону: \u003cstrong>тесты пишете вы\u003c/strong>. Для QA это перевод вашего опыта на Java-рельсы; для фронтендеров и аналитиков — способ думать о правильности кода до продакшена.\u003c/p>\n\u003ch2>Что вообще защищает тест\u003c/h2>\n\u003cp>Тест — это \u003cstrong>исполняемая спецификация\u003c/strong>: «при таких входах поведение должно быть таким». Пока правило живёт в голове или в ТЗ — оно мнение; записанное в тест — оно автоматически проверяется каждым билдом.\u003c/p>\n\u003cp>Ценности по убыванию:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Регрессия\u003c/strong>: изменение сломало старое — тест покраснел через минуту, а не через неделю на проде\u003c/li>\n\u003cli>\u003cstrong>Дизайн кода\u003c/strong>: код, который неудобно тестировать, обычно перегружен связями — тесты проявляют это болью\u003c/li>\n\u003cli>\u003cstrong>Документация\u003c/strong>: тест \u003ccode>cancelOrder_whenAlreadyShipped_throws\u003c/code> читается как ТЗ без открытия ТЗ\u003c/li>\n\u003cli>\u003cstrong>Смелость рефакторить\u003c/strong>: зелёная полоса после переезда на новую библиотеку стоит дороже её написания\u003c/li>\n\u003c/ol>\n\u003cp>Чего тесты НЕ делают: не доказывают отсутствие багов (только покрытие проверенных случаев), не заменяют ревью и прод-наблюдаемость.\u003c/p>\n\u003ch2>Пирамида: три уровня\u003c/h2>\n\u003cdiv class=\"mermaid\">flowchart BT\n    U[&quot;Юнит-тесты&lt;br/&gt;сотни, миллисекунды&lt;br/&gt;класс в изоляции&quot;] --&gt; I[&quot;Интеграционные&lt;br/&gt;десятки, секунды&lt;br/&gt;слои вместе + база&quot;]\n    I --&gt; E[&quot;E2E / приёмочные&lt;br/&gt;единицы, минуты&lt;br/&gt;сценарий целиком&quot;]\u003c/div>\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Уровень\u003c/th>\n\u003cth>Что проверяет\u003c/th>\n\u003cth>Скорость\u003c/th>\n\u003cth>Пример из курса\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Юнит\u003c/strong>\u003c/td>\n\u003ctd>Один класс: сервис с моком репозитория\u003c/td>\n\u003ctd>мс\u003c/td>\n\u003ctd>«скидка считается по правилу»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Интеграционный\u003c/strong>\u003c/td>\n\u003ctd>Слои вместе: контроллер → сервис → БД (H2/Testcontainers)\u003c/td>\n\u003ctd>секунды\u003c/td>\n\u003ctd>Лаба 2: \u003ccode>TaskApiTest\u003c/code> через MockMvc\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>E2E / приёмочный\u003c/strong>\u003c/td>\n\u003ctd>Сценарий пользователя через настоящий интерфейс\u003c/td>\n\u003ctd>минуты\u003c/td>\n\u003ctd>«оформил заказ — пришло письмо»\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Смысл пирамиды — \u003cstrong>экономика\u003c/strong>: юниты дешёвые и точные (упал юнит — сразу знаешь где), верх дорогой и «грязный» (упал E2E — ищи где угодно). Поэтому: много юнитов, меньше интеграционных, мало E2E. Перевёрнутая пирамида («всё через UI») = медленный и хрупкий набор.\u003c/p>\n\u003cp>В курсе и реальных проектах правило прилегания простое: \u003cstrong>логика — юниты, границы (HTTP, БД, Kafka) — интеграционные\u003c/strong>, пользовательские сценарии — E2E.\u003c/p>\n\u003ch2>Быстрый взгляд: как выглядит юнит-тест\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Test\u003c/span>\n\u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">cancelOrder_whenNotShipped_setsStatusCancelled\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n    \u003cspan class=\"hljs-comment\">// Arrange: подготовили данные и заглушки\u003c/span>\n    \u003cspan class=\"hljs-type\">Order\u003c/span> \u003cspan class=\"hljs-variable\">order\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Order\u003c/span>(\u003cspan class=\"hljs-number\">42L\u003c/span>, OrderStatus.NEW);\n    given(orderRepository.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>)).willReturn(Optional.of(order));\n\n    \u003cspan class=\"hljs-comment\">// Act: выполнили действие\u003c/span>\n    orderService.cancel(\u003cspan class=\"hljs-number\">42L\u003c/span>);\n\n    \u003cspan class=\"hljs-comment\">// Assert: проверили результат\u003c/span>\n    assertThat(order.getStatus()).isEqualTo(OrderStatus.CANCELLED);\n}\n\u003c/code>\u003c/pre>\n\u003cp>Три фазы — \u003cstrong>Arrange–Act–Assert (AAA)\u003c/strong>: подготовка, действие, проверка. Имя теста — история: \u003ccode>метод_когда_условие_результат\u003c/code>. Подробности — следующий урок.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> модуль переводит ваш навык на код: тест-дизайн (границы, негативы, комбинации) тот же, носитель другой. Ваши кейсы из TestRail становятся @Test-методами; параметризация — это data-driven, который вы знаете.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> вы писали Jest/Vitest — это оно же: AAA, моки, describe. Отличие бэкенда — интеграционные с настоящей базой: фронт мокает fetch, бэк «мокать SQL» не спешит — честнее проверить контейнер с PostgreSQL.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> тесты — исполняемая версия ваших требований. Читая список тест-методов сервиса, вы видите, какие правила действительно закодированы, а какие остались только в ТЗ. Разрыв между ними — карта рисков.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Порядок вместо хаоса: что тестировать в первую очередь\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Бизнес-правила\u003c/strong> (сервисный слой): скидки, статусы, лимиты — здесь ошибки дороже всего\u003c/li>\n\u003cli>\u003cstrong>Границы\u003c/strong>: валидация входов, ошибки (400/404/409), статус-коды\u003c/li>\n\u003cli>\u003cstrong>Данные\u003c/strong>: миграции, запросы с фильтрами и пагинацией\u003c/li>\n\u003cli>Прочее (геттеры, конфигурация) — не тестируют: их проверяет компилятор и контекст старта\u003c/li>\n\u003c/ul>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Тест = исполняемая спецификация; главная ценность — быстрая регрессия и смелость менять\u003c/li>\n\u003cli>Пирамида: много юнитов (мс), меньше интеграционных (с), единицы E2E (мин)\u003c/li>\n\u003cli>Логика — юнитами; границы (HTTP/БД/Kafka) — интеграционными; сценарии — E2E\u003c/li>\n\u003cli>Тесты не заменяют ревью и мониторинг — они третья линия обороны, а не единственная\u003c/li>\n\u003cli>В первую очередь тестируют бизнес-правила и границы, а не геттеры\u003c/li>\n\u003c/ul>\n\u003cp>В следующем уроке — JUnit и Mockito в руках: структура теста, ассерты, моки.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Что значит «тест — исполняемая спецификация»?","options":["Правило записано кодом и автоматически проверяется каждым билдом, а не живёт только в ТЗ или голове","Тест заменяет техническое задание","Тесты пишет аналитик, а не разработчик","Спецификация компилируется вместе с кодом"],"correct":0,"explanation":"Пока правило в голове — оно мнение. В тесте — автоматически проверяемый факт, который кричит при нарушении на каждом запуске CI."},{"type":"match","question":"Сопоставьте уровень теста и проверяемое.","pairs":[{"left":"Юнит","right":"Сервис с моком репозитория: правило скидки"},{"left":"Интеграционный","right":"Контроллер → сервис → H2: POST отдаёт 201 и строку в базе"},{"left":"E2E","right":"Оформил заказ в интерфейсе — пришло письмо"},{"left":"Контрактный (тизер урока 5)","right":"Живой API не разошёлся со OpenAPI-спекой"}]},{"type":"single","question":"Почему пирамида — много юнитов и мало E2E?","options":["Экономика: юниты быстрые и указывают на место ошибки точно, E2E медленные и падение ничего не говорит о месте","E2E запрещены стандартом","Юниты пишутся автоматически","E2E не находят баги"],"correct":0,"explanation":"Красный юнит = «вот класс», красный E2E = «где-то в цепочке из десяти сервисов». Пирамида балансирует цену запуска и точность диагностики."},{"type":"multi","question":"Что дают тесты? (несколько ответов)","options":["Быструю регрессию: изменение сломало старое — красный билд","Смелость рефакторить под зелёный набор","Доказательство отсутствия багов","Исполняемую документацию поведения"],"correct":[0,1,3],"explanation":"«Нет багов» тесты не доказывают: они проверяют только вошедшие в них случаи. Ревью и наблюдаемость никто не отменял."},{"type":"single","question":"Сервис считает скидку по пяти правилам. Что тестировать в первую очередь?","options":["Сервисный слой юнит-тестами: бизнес-правила — самое дорогое место для ошибки","Геттеры полей скидки","Только E2E через интерфейс","Файл конфигурации"],"correct":0,"explanation":"Приоритет — там, где живёт бизнес-логика и деньги. Геттеры проверяет компилятор, конфигурацию — старт контекста."},{"type":"blank","question":"Как называется трёхфазная структура теста «подготовка → действие → проверка»? (три слова через дефис)","answers":["arrange-act-assert","arrange act assert","aaa"],"explanation":"Arrange–Act–Assert (AAA). Читается сверху вниз как сценарий; если фазы перемешаны — тест трудно понимать и чинить."},{"type":"single","question":"Фронтендер пишет мок fetch, бэкендер «мокает SQL» и удивляется расхождению с продом. Какой уровень закрыл бы проблему честно?","options":["Интеграционный с настоящей базой: H2 в лабах, Testcontainers (настоящий PostgreSQL) для серьёзных случаев","Больше юнитов с моками репозитория","Только E2E на проде","Ручная проверка перед релизом"],"correct":0,"explanation":"SQL-диалект, транзакции и блокировки мок не воспроизведёт. Границу с базой проверяют настоящей базой — в памяти или в контейнере (урок 4)."}]],"cases":[]},{"id":"m6-lesson-02","title":"JUnit и Mockito: юнит-тесты","module":6,"moduleTitle":"Тесты на бэкенде","order":2,"baseOrder":null,"lab":{"title":"Лаба 8. Юнит-тесты","description":"Написать юнит-тесты готового сервиса скидок на все ветки. Приёмник — правило JaCoCo: mvn test не пройдёт при покрытии ниже 80%.","branch":"lab-8","branchSolution":"lab-8-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 2. JUnit и Mockito: юнит-тесты\u003c/h1>\n\u003cp>Юнит-тест — это обычный Java-метод, который зовёт ваш код и сравнивает результат с ожиданием. Фреймворк \u003cstrong>JUnit\u003c/strong> находит такие методы и запускает; \u003cstrong>Mockito\u003c/strong> подменяет соседей (репозитории, клиенты), чтобы тестировался один класс в изоляции.\u003c/p>\n\u003ch2>Анатомия теста\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@ExtendWith(MockitoExtension.class)\u003c/span>          \u003cspan class=\"hljs-comment\">// включить Mockito\u003c/span>\n\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">DiscountServiceTest\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Mock\u003c/span>                                     \u003cspan class=\"hljs-comment\">// заглушка соседа\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> OrderRepository orderRepository;\n\n    \u003cspan class=\"hljs-meta\">@InjectMocks\u003c/span>                              \u003cspan class=\"hljs-comment\">// тестируемый объект с моками внутрь\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> DiscountService discountService;\n\n    \u003cspan class=\"hljs-meta\">@Test\u003c/span>                                     \u003cspan class=\"hljs-comment\">// = тест, его найдёт JUnit\u003c/span>\n    \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">calculatesTenPercentDiscount_whenCustomerIsVip\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n        \u003cspan class=\"hljs-comment\">// Arrange\u003c/span>\n        \u003cspan class=\"hljs-type\">Customer\u003c/span> \u003cspan class=\"hljs-variable\">vip\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Customer\u003c/span>(\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>, CustomerTier.VIP);\n        given(orderRepository.ordersCount(\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>)).willReturn(\u003cspan class=\"hljs-number\">25\u003c/span>);\n        \u003cspan class=\"hljs-type\">BigDecimal\u003c/span> \u003cspan class=\"hljs-variable\">price\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;1000&quot;\u003c/span>);\n\n        \u003cspan class=\"hljs-comment\">// Act\u003c/span>\n        \u003cspan class=\"hljs-type\">BigDecimal\u003c/span> \u003cspan class=\"hljs-variable\">discount\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> discountService.discountFor(vip, price);\n\n        \u003cspan class=\"hljs-comment\">// Assert\u003c/span>\n        assertThat(discount).isEqualByComparingTo(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;100&quot;\u003c/span>));\n    }\n\n    \u003cspan class=\"hljs-meta\">@Test\u003c/span>\n    \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">throws_whenPriceIsNegative\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n        assertThatThrownBy(() -&gt;\n                discountService.discountFor(vip(), \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;-1&quot;\u003c/span>)))\n            .isInstanceOf(IllegalArgumentException.class);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Читать сверху вниз: подготовили клиента и мок (\u003ccode>given…willReturn\u003c/code>), вызвали метод, сравнили. Имя метода — мини-ТЗ: \u003ccode>что_при_условии_результат\u003c/code>.\u003c/p>\n\u003cp>\u003cstrong>AssertJ\u003c/strong> (\u003ccode>assertThat\u003c/code>) — стандарт де-факто для ассертов: \u003ccode>isEqualByComparingTo\u003c/code> для денег (не \u003ccode>equals\u003c/code>!), \u003ccode>contains\u003c/code>, \u003ccode>hasSize\u003c/code>, \u003ccode>extracting\u003c/code>. Подсказки по цепочке даёт IDE.\u003c/p>\n\u003ch2>Mockito: три команды, которых хватает\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">given(repo.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>)).willReturn(Optional.of(order));  \u003cspan class=\"hljs-comment\">// на входе\u003c/span>\ngiven(repo.save(any())).willAnswer(inv -&gt; inv.getArgument(\u003cspan class=\"hljs-number\">0\u003c/span>));\n\nverify(repo).deleteById(\u003cspan class=\"hljs-number\">42L\u003c/span>);                               \u003cspan class=\"hljs-comment\">// взаимодействие\u003c/span>\nverify(mailClient, never()).send(any());                    \u003cspan class=\"hljs-comment\">// чего НЕ было\u003c/span>\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>given/willReturn\u003c/code> — «когда позовут так — ответь вот так»\u003c/li>\n\u003cli>\u003ccode>any()\u003c/code>, \u003ccode>eq(42L)\u003c/code> — матчеры аргументов\u003c/li>\n\u003cli>\u003ccode>verify\u003c/code> — проверка взаимодействия: «должен был сохранить ровно один раз»\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Не переусердствуйте\u003c/strong>: \u003ccode>verify\u003c/code> на каждый чих делает тест хрупким (поменяли порядок вызовов — тест красный, хотя поведение то же). Проверяйте состояние и результат; \u003ccode>verify\u003c/code> — для случаев, когда сам вызов и есть суть («письмо отправлено ровно один раз»).\u003c/p>\n\u003ch2>Данные: @BeforeEach и параметризация\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@BeforeEach\u003c/span>\n\u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">setUp\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n    service = \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">DiscountService\u003c/span>();          \u003cspan class=\"hljs-comment\">// свежий для каждого теста\u003c/span>\n}\n\n\u003cspan class=\"hljs-meta\">@ParameterizedTest\u003c/span>\n\u003cspan class=\"hljs-meta\">@ValueSource(strings = {&quot;&quot;, &quot; &quot;, &quot;   &quot;})\u003c/span>       \u003cspan class=\"hljs-comment\">// один тест — три кейса\u003c/span>\n\u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">rejectsBlankTitles\u003c/span>\u003cspan class=\"hljs-params\">(String title)\u003c/span> {\n    assertThatThrownBy(() -&gt; service.validate(title))\n        .isInstanceOf(ValidationException.class);\n}\n\u003c/code>\u003c/pre>\n\u003cp>Правила здорового набора:\u003c/p>\n\u003cul>\n\u003cli>тесты \u003cstrong>не зависят друг от друга\u003c/strong>: порядок запуска не важен, каждый готовит себя сам\u003c/li>\n\u003cli>\u003ccode>@BeforeEach\u003c/code> — общая подготовка; состояние между тестами не таскают\u003c/li>\n\u003cli>параметризация вместо копипасты: граничные значения (\u003ccode>0\u003c/code>, \u003ccode>1\u003c/code>, \u003ccode>MAX\u003c/code>), негативы, пустые строки\u003c/li>\n\u003c/ul>\n\u003ch2>Что мокать, а что нет\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Мокаем\u003c/th>\n\u003cth>Не мокаем\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Репозитории/шлюзы в юнит-тестах сервиса\u003c/td>\n\u003ctd>Сам тестируемый класс\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Внешние API (платёжный шлюз)\u003c/td>\n\u003ctd>value-объекты и мапперы (проверяются как есть)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Часы/генераторы случайности\u003c/td>\n\u003ctd>То, что уже мок (мок мока)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Хрупкий признак: тест падает от любого чиха — вы замокали слишком много и тестируете моки. Отходите на интеграционный уровень (урок 3).\u003c/p>\n\u003ch2>Тесты ловят: практический пример\u003c/h2>\n\u003cp>Баг в \u003ccode>discountFor\u003c/code>: сравнение \u003ccode>BigDecimal\u003c/code> через \u003ccode>==\u003c/code> или \u003ccode>equals\u003c/code> вместо \u003ccode>compareTo\u003c/code> — классика (\u003ccode>new BigDecimal(&quot;100&quot;)\u003c/code> не \u003ccode>equals\u003c/code> \u003ccode>new BigDecimal(&quot;100.00&quot;)\u003c/code>). Тест с \u003ccode>isEqualByComparingTo\u003c/code> ловит на первой же итерации — это дешевле, чем расчёт скидки в чеке клиента.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> негативные кейсы, которые вы заносите в TestRail, здесь выглядят так: \u003ccode>assertThatThrownBy\u003c/code> + \u003ccode>@ParameterizedTest\u003c/code> с невалидными значениями. Data-driven — буквально: таблица кейсов над одним методом.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>💡 Фронтендерам:\u003c/strong> \u003ccode>@Test\u003c/code> ≈ \u003ccode>it()\u003c/code>, \u003ccode>given/willReturn\u003c/code> ≈ \u003ccode>vi.mock\u003c/code>/\u003ccode>jest.mock\u003c/code>, \u003ccode>@ExtendWith\u003c/code> ≈ конфиг теста. AssertJ — как expect + chai вместе, только с флюент-цепочками.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Юнит = AAA: \u003ccode>given\u003c/code> подготовка → вызов → \u003ccode>assertThat\u003c/code> проверка; имя = мини-ТЗ\u003c/li>\n\u003cli>Mockito: \u003ccode>given/willReturn\u003c/code> на вход, \u003ccode>verify\u003c/code> — точечно, для сущностных взаимодействий\u003c/li>\n\u003cli>Тесты независимы: \u003ccode>@BeforeEach\u003c/code>, никакого общего состояния; \u003ccode>@ParameterizedTest\u003c/code> против копипасты\u003c/li>\n\u003cli>Мокают соседей и внешние границы; value-объекты и сам класс — никогда\u003c/li>\n\u003cli>Хрупкость = симптом: слишком много моков → спускайтесь уровнем ниже\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — интеграционные тесты: Spring поднимает ваши слои по-настоящему.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","codeLang":"java","code":"@Test\nvoid calculatesDiscount() {\n  given(repo.ordersCount(\"ann\")).willReturn(25);\n  BigDecimal d = service.discountFor(vip(\"ann\"), new BigDecimal(\"1000\"));\n  assertThat(d).isEqualByComparingTo(new BigDecimal(\"100\"));\n}\n","question":"Что здесь фаза Act?","options":["Строка с `service.discountFor(...)`: собственно вызов тестируемого поведения","Строка с `given(...)`","Строка с `assertThat(...)`","Аннотация @Test"],"correct":0,"explanation":"AAA: given — Arrange, вызов discountFor — Act, assertThat — Assert. Одна фаза — одна строка обычно; если Act разрастается, тестируемое поведение не атомарно.","codeHtml":"\u003cspan class=\"hljs-meta\">@Test\u003c/span>\n\u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">calculatesDiscount\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n  given(repo.ordersCount(\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>)).willReturn(\u003cspan class=\"hljs-number\">25\u003c/span>);\n  \u003cspan class=\"hljs-type\">BigDecimal\u003c/span> \u003cspan class=\"hljs-variable\">d\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> service.discountFor(vip(\u003cspan class=\"hljs-string\">&quot;ann&quot;\u003c/span>), \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;1000&quot;\u003c/span>));\n  assertThat(d).isEqualByComparingTo(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">BigDecimal\u003c/span>(\u003cspan class=\"hljs-string\">&quot;100&quot;\u003c/span>));\n}\n"},{"type":"single","question":"Почему для BigDecimal в ассертах используют isEqualByComparingTo, а не equals?","options":["equals учитывает масштаб: 100 и 100.00 не равны, а по деньгам — одинаковы; сравнивать нужно числовое значение","equals не существует у BigDecimal","Так быстрее","equals проверяет ссылки"],"correct":0,"explanation":"Классика Java: new BigDecimal(\"100\").equals(new BigDecimal(\"100.00\")) == false. Тест с equals падал бы на валидном коде — или, хуже, пропускал бы денежный баг с масштабом."},{"type":"multi","question":"Признаки здорового юнит-набора: (несколько ответов)","options":["Тесты не зависят от порядка запуска","Общая подготовка в @BeforeEach, состояния между тестами нет","Один тест проверяет одно поведение","Каждый вызов каждого мока проверен verify"],"correct":[0,1,2],"explanation":"Verify на каждый вызов — антипаттерн хрупкости: тест прилипает к реализации, а не поведению. Verify — для взаимодействий, которые и есть суть (одно письмо, один платёж)."},{"type":"match","question":"Сопоставьте инструмент и роль.","pairs":[{"left":"@Test","right":"Метод, который находит и запускает JUnit"},{"left":"given/willReturn","right":"Мок отвечает заданным значением на заданный вызов"},{"left":"verify","right":"«Взаимодействие было/не было» — точечно"},{"left":"@ParameterizedTest","right":"Один тест — таблица кейсов"}]},{"type":"single","question":"Тест сервиса падает от любого рефакторинга, хотя поведение не менялось. Диагноз?","options":["Замокано слишком много и verify прилип к деталям реализации — спуститься на интеграционный уровень","Тесты слишком независимые","Нужен ещё один мок","Переименовать тесты"],"correct":0,"explanation":"Хрупкость (fragile test) — сигнал перебора с моками. Тест должен держать поведение, а не последовательность вызовов внутри."},{"type":"blank","question":"Какой фреймворк-библиотека даёт флюент-ассерты вида assertThat(x).contains(\"...\")? (одно слово)","answers":["assertj","AssertJ"],"explanation":"AssertJ — стандарт ассертов в Spring-мире: цепочки, понятные сообщения об ошибке, isEqualByComparingTo для денег."},{"type":"single","question":"Что из перечисленного мокать в юнит-тесте НЕ нужно?","options":["Тестируемый сервис и его value-объекты (record-DTO)","Репозиторий","HTTP-клиент внешнего API","Часы (Clock)"],"correct":0,"explanation":"Мок тестируемого класса = тест мока. Соседей и внешние границы — да; сам объект и его данные — нет."}]],"cases":[]},{"id":"m6-lesson-03","title":"Интеграционные: Spring и MockMvc","module":6,"moduleTitle":"Тесты на бэкенде","order":3,"baseOrder":null,"lab":{"title":"Лаба 9. Спаси прод","description":"Два инцидента в API задач: понять по красным приёмным тестам, починить контроллер и закрыть баги собственными регрессионными тестами.","branch":"lab-9","branchSolution":"lab-9-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Урок 3. Интеграционные тесты: Spring и MockMvc\u003c/h1>\n\u003cp>Юнит проверяет правило. Но заказы падают не на правилах, а на швах: JSON не тот, колонка переименована, валидация не включилась. Интеграционный тест поднимает \u003cstrong>настоящие слои вместе\u003c/strong> — вы это уже видели в лабах 2 и 5; теперь разложим по полочкам.\u003c/p>\n\u003ch2>@SpringBootTest: поднять приложение\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@SpringBootTest\u003c/span>\n\u003cspan class=\"hljs-meta\">@AutoConfigureMockMvc\u003c/span>\n\u003cspan class=\"hljs-meta\">@Transactional\u003c/span>\n\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">TaskApiTest\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Autowired\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> MockMvc mockMvc;\n\n    \u003cspan class=\"hljs-meta\">@Autowired\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> TaskRepository taskRepository;\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003ccode>@SpringBootTest\u003c/code> — поднимает весь контекст: контроллеры, сервисы, репозитории, конфиг\u003c/li>\n\u003cli>\u003ccode>@AutoConfigureMockMvc\u003c/code> — даёт \u003ccode>MockMvc\u003c/code>: вызовы HTTP \u003cstrong>без сети\u003c/strong> — запрос идёт через диспетчер прямо в контроллер\u003c/li>\n\u003cli>\u003ccode>@Transactional\u003c/code> на тест-классе — каждый тест откатывается: база чистая, тесты независимы\u003c/li>\n\u003c/ul>\n\u003cp>В Boot 4 не забудьте стартер \u003ccode>spring-boot-starter-webmvc-test\u003c/code> — MockMvc живёт в нём (модульные тесты разделили, как это было с Liquibase и Kafka).\u003c/p>\n\u003ch2>MockMvc: HTTP по-честному, сеть по-дешёвому\u003c/h2>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Test\u003c/span>\n\u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">createTask_returns201AndLocation\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> \u003cspan class=\"hljs-keyword\">throws\u003c/span> Exception {\n    mockMvc.perform(post(\u003cspan class=\"hljs-string\">&quot;/api/projects/7/tasks&quot;\u003c/span>)\n                    .contentType(MediaType.APPLICATION_JSON)\n                    .content(\u003cspan class=\"hljs-string\">&quot;&quot;&quot;\n                        {&quot;title&quot;:&quot;Купить молоко&quot;}\n                        &quot;&quot;&quot;\u003c/span>))\n            .andExpect(status().isCreated())\n            .andExpect(header().string(\u003cspan class=\"hljs-string\">&quot;Location&quot;\u003c/span>, containsString(\u003cspan class=\"hljs-string\">&quot;/api/tasks/&quot;\u003c/span>)))\n            .andExpect(jsonPath(\u003cspan class=\"hljs-string\">&quot;$.done&quot;\u003c/span>).value(\u003cspan class=\"hljs-literal\">false\u003c/span>));\n\n    assertThat(taskRepository.count()).isEqualTo(\u003cspan class=\"hljs-number\">1\u003c/span>);   \u003cspan class=\"hljs-comment\">// и в базе правда лежит\u003c/span>\n}\n\u003c/code>\u003c/pre>\n\u003cp>Что здесь честного: JSON-сериализация, валидация (\u003ccode>@Valid\u003c/code>), маппинги, статусы, заголовки, INSERT в базу. Нечестного — только сеть и порт: MockMvc вызывает DispatcherServlet напрямую.\u003c/p>\n\u003cp>Проверка содержимого ответа — \u003ccode>jsonPath\u003c/code> (\u003ccode>$.done\u003c/code>), типов и заголовков — как в курсе с первого квиза про статусы.\u003c/p>\n\u003ch2>База в тестах: H2 и @Transactional\u003c/h2>\n\u003cp>Схема в тестах та же, что в рантайме: \u003cstrong>Liquibase накатывает миграции\u003c/strong> при старте контекста (вы это делали в лабе 5). H2 in-memory — быстро и без Docker; оговорки диалекта — в уроке 4.\u003c/p>\n\u003cp>\u003ccode>@Transactional\u003c/code> на тесте оборачивает его в транзакцию с откатом: вставки не протекают в соседние тесты. Тонкость: после отката данные исчезают — если тест проверяет «коммитится ли», откат мешает; для таких случаев тест без \u003ccode>@Transactional\u003c/code> + ручная чистка (\u003ccode>@BeforeEach deleteAll()\u003c/code>).\u003c/p>\n\u003ch2>Срезы: когда весь контекст не нужен\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Аннотация\u003c/th>\n\u003cth>Поднимает\u003c/th>\n\u003cth>Для\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003ccode>@SpringBootTest\u003c/code>\u003c/td>\n\u003ctd>всё\u003c/td>\n\u003ctd>сквозные проверки API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@DataJpaTest\u003c/code>\u003c/td>\n\u003ctd>только JPA+базу\u003c/td>\n\u003ctd>репозитории и запросы\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>@SpringBootTest\u003c/code> + \u003ccode>MockMvc\u003c/code>\u003c/td>\n\u003ctd>всё кроме сети\u003c/td>\n\u003ctd>HTTP-границы\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003ccode>@DataJpaTest\u003c/code> — срез: контекст в разы меньше и быстрее; для «правильно ли генерируется SQL фильтра» полный контекст не нужен.\u003c/p>\n\u003ch2>Стоимость контекста и кэш\u003c/h2>\n\u003cp>Контекст стартует секунды. Spring кэширует его между тестами \u003cstrong>одинаковой конфигурации\u003c/strong>: меняете \u003ccode>@MockBean\u003c/code>, свойства или профили в одном тесте — получите второй контекст. Правило: не плодить миксы конфигураций без нужды; общий дефолт — быстро, каждый «особый» тест замедляет набор.\u003c/p>\n\u003cp>\u003ccode>@MockBean\u003c/code> (в 3.4+ — \u003ccode>@MockitoBean\u003c/code>) — подмена бина в поднятом контексте: «внешний шлюз в тестах платежей отвечает ошибкой». Мощно для сценариев сбоев, но каждый такой тест = новый контекст.\u003c/p>\n\u003ch2>Что проверять интеграционно\u003c/h2>\n\u003cul>\n\u003cli>Контракт эндпоинтов: статусы, заголовки, JSON — то, чем API отвечает потребителю\u003c/li>\n\u003cli>Валидацию: невалидный JSON → 400; пустое поле → 400 с указанием\u003c/li>\n\u003cli>Бизнес-цепочку: POST создал → GET видит → DELETE убрал\u003c/li>\n\u003cli>Ошибки: 404 на несуществующее, 409 на конфликт\u003c/li>\n\u003c/ul>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> MockMvc-тесты — это ваши API-автотесты, живущие рядом с кодом: падение краснит билд автора, а не отдельную джобу. Пограничные кейсы из ваших чек-листов (400/404/409) — ровно то, что сюда ложится.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>\u003ccode>@SpringBootTest\u003c/code> + \u003ccode>@AutoConfigureMockMvc\u003c/code> + \u003ccode>@Transactional\u003c/code>: всё по-настоящему, кроме сети\u003c/li>\n\u003cli>MockMvc: статусы/заголовки/jsonPath;assert на базе закрывает «действительно сохранилось»\u003c/li>\n\u003cli>Схему в тестах создаёт Liquibase; H2 для скорости, Testcontainers для честности (урок 4)\u003c/li>\n\u003cli>Срезы (\u003ccode>@DataJpaTest\u003c/code>) для репозиториев; контекст кэшируется — не плодите вариации\u003c/li>\n\u003cli>Проверяйте контракт эндпоинта и цепочку, а не каждую строчку\u003c/li>\n\u003c/ul>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Чем MockMvc отличается от настоящего HTTP-вызова?","options":["Запрос идёт в DispatcherServlet напрямую, минуя сеть и порт: сериализация, валидация, контроллер и база — настоящие","Он не вызывает контроллер вообще","Он быстрее, потому что пропускает валидацию","Он работает только с GET"],"correct":0,"explanation":"Минус только сеть. Всё, за что отвечает приложение — JSON, маппинги, статусы, транзакции, SQL — проверяется честно."},{"type":"multi","question":"Что даёт @Transactional на тест-классе? (несколько ответов)","options":["Каждый тест выполняется в транзакции","После теста изменения откатываются — тесты не влияют друг на друга","Тесты запускаются параллельно","Гарантируется коммит данных в базу"],"correct":[0,1],"explanation":"Откат ради изоляции. Если тестируется сама фиксация (репликация, отдельные транзакции) — аннотацию снимают и чистят данные вручную."},{"type":"single","codeLang":"java","code":"mockMvc.perform(get(\"/api/tasks/999999\"))\n       .andExpect(status().isNotFound());\n","question":"Такой тест зеленый. Что он гарантирует?","options":["Отсутствующий ресурс отдаёт 404 — часть контракта работает","Таблица задач пуста","Приложение не имеет багов","База недоступна"],"correct":0,"explanation":"Тест проверяет ровно одну строку контракта. «Отсутствие багов» не гарантирует ни один набор тестов — только вошедшие случаи.","codeHtml":"mockMvc.perform(get(\u003cspan class=\"hljs-string\">&quot;/api/tasks/999999&quot;\u003c/span>))\n       .andExpect(status().isNotFound());\n"},{"type":"match","question":"Сопоставьте инструмент и уровень.","pairs":[{"left":"@DataJpaTest","right":"Срез: только JPA и база, быстро"},{"left":"@SpringBootTest + MockMvc","right":"Весь контекст без сети"},{"left":"@MockitoBean","right":"Подмена одного бина в поднятом контексте"},{"left":"Liquibase в тестах","right":"Схема базы — та же, что в проде"}]},{"type":"single","question":"В команде тесты замедлились: у каждого теста свой микс @MockitoBean и свойств. Почему это замедлило набор?","options":["Каждая уникальная конфигурация = новый контекст Spring: стартует секунды, кэш не помогает","Mockito работает медленно","База выросла","JVM не хватает памяти на тесты"],"correct":0,"explanation":"Кэш контекста ключуется конфигурацией. Одна общая конфигурация + точечные подмены в немногих тестах — правило скорости."},{"type":"blank","question":"Каким выражением (jsonPath) проверить поле done первого элемента массива в ответе?","answers":["$.data.tasks[0].done","$[0].done","$.tasks[0].done"],"explanation":"Формат jsonPath: $ — корень ответа, [0] — первый элемент массива. В GraphQL-ответах путь начинается с $.data (модуль 2, лаба 4)."},{"type":"single","question":"H2 в интеграционных тестах: когда этого достаточно?","options":["Логика CRUD, маппинги, статусы — пока не проверяется диалект/блокировки/миграции конкретной СУБД","Всегда: H2 совместим с PostgreSQL полностью","Никогда","Только для юнит-тестов"],"correct":0,"explanation":"H2 быстрая и покрывает логику, но это ДРУГАЯ СУБД. Диалект SQL, блокировки, EXCLUDE-ограничения и миграции проверяют настоящим PostgreSQL через Testcontainers — урок 4."}]],"cases":[]},{"id":"m6-lesson-04","title":"Testcontainers: честная база","module":6,"moduleTitle":"Тесты на бэкенде","order":4,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 4. Testcontainers: честная база\u003c/h1>\n\u003cp>H2 хороша, пока не наступает момент, когда «тесты зелёные, прод красный». Диалекты SQL, блокировки, EXCLUDE-ограничения из кейса модуля 3, поведение миграций — всё это H2 не воспроизводит: это \u003cstrong>другая СУБД\u003c/strong>. Честное решение — поднимать настоящую базу в Docker на время теста.\u003c/p>\n\u003ch2>Идея одной строкой\u003c/h2>\n\u003cp>\u003cstrong>Testcontainers\u003c/strong> стартует Docker-контейнер (PostgreSQL, Kafka, Redis…) из JUnit-теста, приложение подключается к нему как к обычной базе, контейнер умирает вместе с тестом. В CI — тот же Docker, те же тесты.\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-meta\">@Testcontainers\u003c/span>\n\u003cspan class=\"hljs-meta\">@SpringBootTest\u003c/span>\n\u003cspan class=\"hljs-keyword\">class\u003c/span> \u003cspan class=\"hljs-title class_\">TaskRepositoryIT\u003c/span> {\n\n    \u003cspan class=\"hljs-meta\">@Container\u003c/span>\n    \u003cspan class=\"hljs-meta\">@ServiceConnection\u003c/span>\n    \u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-type\">PostgreSQLContainer\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-variable\">postgres\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">PostgreSQLContainer\u003c/span>&lt;&gt;(\u003cspan class=\"hljs-string\">&quot;postgres:17&quot;\u003c/span>);\n\n    \u003cspan class=\"hljs-meta\">@Autowired\u003c/span>\n    \u003cspan class=\"hljs-keyword\">private\u003c/span> TaskRepository taskRepository;\n\n    \u003cspan class=\"hljs-meta\">@Test\u003c/span>\n    \u003cspan class=\"hljs-type\">void\u003c/span> \u003cspan class=\"hljs-title function_\">uniqueConstraintWorks\u003c/span>\u003cspan class=\"hljs-params\">()\u003c/span> {\n        taskRepository.save(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Task\u003c/span>(\u003cspan class=\"hljs-string\">&quot;dup&quot;\u003c/span>, \u003cspan class=\"hljs-number\">7L\u003c/span>));\n        assertThatThrownBy(() -&gt; taskRepository.save(\u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">Task\u003c/span>(\u003cspan class=\"hljs-string\">&quot;dup&quot;\u003c/span>, \u003cspan class=\"hljs-number\">7L\u003c/span>)))\n            .isInstanceOf(DataIntegrityViolationException.class);\n    }\n}\n\u003c/code>\u003c/pre>\n\u003cp>Разбор:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>@Container\u003c/code> + \u003ccode>static\u003c/code> — контейнер \u003cstrong>один на класс\u003c/strong> (не на тест!): стартует секунды — бережём их\u003c/li>\n\u003cli>\u003ccode>@ServiceConnection\u003c/code> — Spring Boot сам подставляет host/port/логин контейнера в \u003ccode>spring.datasource\u003c/code> (без ручных \u003ccode>@DynamicPropertySource\u003c/code>)\u003c/li>\n\u003cli>При старте контекста Liquibase накатит миграции \u003cstrong>на настоящий PostgreSQL\u003c/strong> — заодно проверяются миграции\u003c/li>\n\u003c/ul>\n\u003ch2>Что это ловит, а H2 — нет\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Проверка\u003c/th>\n\u003cth>H2\u003c/th>\n\u003cth>Postgres-контейнер\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>CRUD, маппинги, статусы\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Диалект SQL (\u003ccode>ON CONFLICT\u003c/code>, \u003ccode>tsrange\u003c/code> из кейса М3)\u003c/td>\n\u003ctd>✗\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Уникальность/FK/EXCLUDE-ограничения по-настоящему\u003c/td>\n\u003ctd>частично\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Блокировки и уровни изоляции в гонках\u003c/td>\n\u003ctd>✗\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Миграции Liquibase на целевой СУБД\u003c/td>\n\u003ctd>~\u003c/td>\n\u003ctd>✓\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>Правило выбора простое: \u003cstrong>H2 — быстрая петля разработки; Testcontainers — то, что обязательно в CI\u003c/strong> для репозиториев, миграций и всего, где поведение зависит от СУБД.\u003c/p>\n\u003ch2>Kafka и брокеры — тоже контейнеры\u003c/h2>\n\u003cp>Асинхронные тесты на живом брокере без Docker-церемоний:\u003c/p>\n\u003cpre>\u003ccode class=\"language-java\">\u003cspan class=\"hljs-type\">KafkaContainer\u003c/span> \u003cspan class=\"hljs-variable\">kafka\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">KafkaContainer\u003c/span>(DockerImageName.parse(\u003cspan class=\"hljs-string\">&quot;apache/kafka:3.9.0&quot;\u003c/span>));\n\u003c/code>\u003c/pre>\n\u003cp>Правда, для юнит-цикла «продюсер-листенер» часто хватает и \u003ccode>@EmbeddedKafka\u003c/code> (как в лабе 6: брокер прямо в JVM). Баланс: embedded — быстрее и без Docker; контейнер — тот же Kafka, что в проде.\u003c/p>\n\u003ch2>Цена и гигиена\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Скорость\u003c/strong>: контейнер стартует секунды → один статический контейнер на класс/модуль, никаких «на каждый тест»\u003c/li>\n\u003cli>\u003cstrong>Docker обязателен\u003c/strong> на машине разработчика и в CI — главный организационный нюанс\u003c/li>\n\u003cli>\u003cstrong>Именование\u003c/strong>: \u003ccode>*IT\u003c/code> (Integration Test) вместо \u003ccode>*Test\u003c/code> — часто выделяют в отдельную фазу Maven (failsafe): юниты — на каждый коммит, IT — перед мержем\u003c/li>\n\u003cli>Пул соединений на старте: контейнер должен быть готов (\u003ccode>wait strategy\u003c/code>) — Testcontainers делает это сам по healthcheck\u003c/li>\n\u003c/ul>\n\u003ch2>Итог\u003c/h2>\n\u003cul>\n\u003cli>Testcontainers = настоящий PostgreSQL/Kafka/… в Docker на время теста; CI — тот же Docker\u003c/li>\n\u003cli>\u003ccode>@Container\u003c/code> + \u003ccode>static\u003c/code> + \u003ccode>@ServiceConnection\u003c/code>: один контейнер на класс, автоподключение\u003c/li>\n\u003cli>Ловит то, что H2 не может: диалект, ограничения, блокировки, миграции целевой СУБД\u003c/li>\n\u003cli>H2 — быстрая петля; Testcontainers — обязателен в CI для данных\u003c/li>\n\u003cli>EmbeddedKafka vs Kafka-контейнер: скорость против «как в проде»\u003c/li>\n\u003c/ul>\n\u003cp>Следующий урок — контрактные тесты и как всё это собирается в CI-конвейер.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Тест на EXCLUDE-ограничение (запрет пересечения брони) зелёный на H2 и пропускает баг на проде. Почему?","options":["H2 — другая СУБД: она не поддерживает EXCLUDE-конструкцию PostgreSQL так, как прод; проверять надо настоящим PostgreSQL","Тест написан на Java","Прод-база больше","Liquibase не работает с H2"],"correct":0,"explanation":"Диалектные особенности — зона H2-слепоты. Контейнер с той же версией PostgreSQL воспроизводит поведение прода."},{"type":"multi","question":"Зачем контейнер объявляют static и один на класс? (несколько ответов)","options":["Старт контейнера — секунды: один на всех тестов класса экономит время","Статический контейнер живёт всю фазу тестов класса, а не клонируется на каждый метод","Без static Docker не запустится","Это ускоряет сам PostgreSQL"],"correct":[0,1],"explanation":"Гигиена скорости. Перс-тестовый контейнер умножил бы минуты на количество методов."},{"type":"single","codeLang":"java","code":"@Container\n@ServiceConnection\nstatic PostgreSQLContainer\u003c?> postgres = new PostgreSQLContainer\u003c>(\"postgres:17\");\n","question":"Что делает @ServiceConnection?","options":["Spring подставляет host/port/учётку контейнера в spring.datasource — без ручной настройки свойств","Создаёт схему Liquibase","Включает транзакции в тестах","Подключает Kafka"],"correct":0,"explanation":"Раньше писали @DynamicPropertySource руками; теперь Boot связывает контейнер с конфигурацией приложения автоматически.","codeHtml":"\u003cspan class=\"hljs-meta\">@Container\u003c/span>\n\u003cspan class=\"hljs-meta\">@ServiceConnection\u003c/span>\n\u003cspan class=\"hljs-keyword\">static\u003c/span> \u003cspan class=\"hljs-type\">PostgreSQLContainer\u003c/span>&lt;?&gt; \u003cspan class=\"hljs-variable\">postgres\u003c/span> \u003cspan class=\"hljs-operator\">=\u003c/span> \u003cspan class=\"hljs-keyword\">new\u003c/span> \u003cspan class=\"hljs-title class_\">PostgreSQLContainer\u003c/span>&lt;&gt;(\u003cspan class=\"hljs-string\">&quot;postgres:17&quot;\u003c/span>);\n"},{"type":"match","question":"Сопоставьте задачу и инструмент.","pairs":[{"left":"Быстрая петля разработки CRUD","right":"H2 in-memory"},{"left":"Проверка миграций на целевой СУБД","right":"Testcontainers: PostgreSQL"},{"left":"Цикл продюсер→листенер без Docker","right":"@EmbeddedKafka"},{"left":"«Тот же Kafka, что в проде»","right":"Kafka-контейнер"}]},{"type":"single","question":"В командном CI юниты гоняют на каждый коммит, а Testcontainers-тесты — перед мержем. Почему это разумно?","options":["Стоимость/ценность: контейнеры медленнее — их вес оправдан на более поздней, редкой фазе; юнит-петля остаётся мгновенной","Testcontainers не работают на каждый коммит","Юниты важнее","Docker запускается только по расписанию"],"correct":0,"explanation":"Классическая лестница CI: мгновенные проверки каждому коммиту, тяжёлые интеграционные — перед мержем. Разделение часто оформляют failsafe-плагином (*IT)."},{"type":"blank","question":"Каким суффиксом принято помечать интеграционные тесты, чтобы отделить их от юнит-прогона? (две латинские буквы)","answers":["IT","it"],"explanation":"*IT (Integration Test): Maven surefire гоняет *Test, failsafe — *IT. Конвенция, по которой CI разделяет фазы."},{"type":"single","question":"У разработчика нет Docker локально. Что он теряет?","options":["Локальный запуск Testcontainers-тестов (упадут на старте контейнера) — их поймает CI; H2-петля и юниты остаются рабочими","Все тесты перестают компилироваться","Ничего: Docker нужен только в проде","Возможность писать юнит-тесты"],"correct":0,"explanation":"Юниты и MockMvc+H2 не требуют Docker. Контейнерные проверки сместятся в CI — осознанный компромисс команды."}]],"cases":[]},{"id":"m6-lesson-05","title":"Контрактные тесты и CI","module":6,"moduleTitle":"Тесты на бэкенде","order":5,"baseOrder":null,"lab":null,"html":"\u003ch1>Урок 5. Контрактные тесты и CI\u003c/h1>\n\u003cp>Последний урок модуля отвечает на два вопроса: «как тесты удерживают договор с потребителями» и «как всё это собрать в конвейер, который работает на команду, а не наоборот».\u003c/p>\n\u003ch2>Контрактный тест: API не разошёлся со спекой\u003c/h2>\n\u003cp>В модуле 2 договор описан в OpenAPI. Контрактный тест сверяет \u003cstrong>живой API со спекой\u003c/strong>: каждый путь, статус, схему ответа.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">1. Подняли приложение (те же @SpringBootTest)\n2. Прогнали запросы по всем путям спеки\n3. Сверили: статус из спеки = фактический, поля ответа = схеме\n4. Расхождение → красный билд\n\u003c/code>\u003c/pre>\n\u003cp>Инструменты: Schemathesis (генерирует проверки прямо из спеки, находит и 500-е), springdoc + тесты OpenAPI-валидации. Что ловится: поле удалили из ответа, а в спеке осталось; новый эндпоинт не описали; статус поменялся с 200 на 204 молча.\u003c/p>\n\u003cp>Связь с командой (модуль 2): PR со спекой ревьится потребителями; контрактный тест в CI — это \u003cstrong>ревью, которое не устаёт\u003c/strong>. Именно так тесты-приёмники ваших лаб и «тесты по спеке» из уроков про API становятся одной системой.\u003c/p>\n\u003ch2>Пирамида в CI: лестница скорости\u003c/h2>\n\u003cdiv class=\"mermaid\">flowchart TD\n    C[&quot;Коммит / PR&quot;] --&gt; U[&quot;1. Юниты + H2-интеграционные&lt;br/&gt;секунды — каждый пуш&quot;]\n    U --&gt; I[&quot;2. Testcontainers (*IT)&lt;br/&gt;минуты — перед мержем&quot;]\n    I --&gt; K[&quot;3. Контрактные тесты&lt;br/&gt;минуты — перед мержем&quot;]\n    K --&gt; D[&quot;Деплой → прод-наблюдаемость&lt;br/&gt;(модуль 5)&quot;]\u003c/div>\u003cp>Правила конвейера:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Красный билд = приоритет №1\u003c/strong>: всё останавливается до зелёного (сломанный конвейер metastазирует в «никто не смотрит на CI»)\u003c/li>\n\u003cli>Лестница скорости: мгновенное — каждому пуши; тяжёлое — реже\u003c/li>\n\u003cli>Тесты \u003cstrong>должны быть детерминированными\u003c/strong>: flaky-тест (падает через раз) чинят или удаляют немедленно — он разрушает доверие ко всему набору\u003c/li>\n\u003c/ul>\n\u003ch2>Flaky: главный враг доверия\u003c/h2>\n\u003cp>Причины типовых «через раз»:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Время и порядок\u003c/strong>: sleep вместо ожидания условия; тесты зависят друг от друга\u003c/li>\n\u003cli>\u003cstrong>Данные\u003c/strong>: тест рассчитан на пустую базу, а что-то осталось\u003c/li>\n\u003cli>\u003cstrong>Параллельность\u003c/strong>: тесты бегут одновременно и делят состояние\u003c/li>\n\u003cli>\u003cstrong>Внешний мир\u003c/strong>: реальный вызов внешнего API в тесте\u003c/li>\n\u003c/ul>\n\u003cp>Лечение: Awaitility-стиль «ждать условие, а не секунды»; изоляция через \u003ccode>@Transactional\u003c/code>/чистку; внешние границы — мок или контейнер. Flaky принято помечать (assumeTrue/quarantine) и чинить в приоритете — не «перезапустить и забыть».\u003c/p>\n\u003ch2>TDD: тест до кода\u003c/h2>\n\u003cp>\u003cstrong>TDD (Test-Driven Development)\u003c/strong>: красный тест → минимальный код до зелёного → рефакторинг. Самая чистая форма «тест как спецификация»: сначала формулируешь поведение, потом реализуешь. Полный TDD — привычка не всех команд, но его элементы вы уже видели: тесты-приёмники лаб пишутся ДО кода; исправить красноту — и есть цикл TDD в миниатюре.\u003c/p>\n\u003ch2>Coverage: термометр, а не цель\u003c/h2>\n\u003cp>Покрытие (\u003ccode>mvn verify\u003c/code> + JaCoCo) показывает, какие строки выполнялись тестами. Здоровое использование: \u003cstrong>найти дыры\u003c/strong> — «класс X не покрыт вообще» — сигнал. Больное: гнаться за цифрой тестами без ассертов (строка «выполнилась» ≠ «проверилась»). Команды ставят нижнюю планку на改动 (например, новый код ≥ 60–80%) — но планка без культуры ассертов рождает мусорные тесты.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>🔧 QA:\u003c/strong> карта ваших возможностей в этом модуле: API-тесты → MockMvc-классы рядом с кодом; data-driven → @ParameterizedTest; пограничные кейсы → контрактные проверки; flaky-репорты — ваша зона в CI-дашборде наравне с разработчиками.\u003c/p>\n\u003c/blockquote>\n\u003cblockquote>\n\u003cp>\u003cstrong>📐 Аналитикам:\u003c/strong> список тест-методов сервиса — исполняемая версия требований. Ревью «что закодировано» = сравнение вашего ТЗ с тестами; разрывы — backlog рисков приоритетно.\u003c/p>\n\u003c/blockquote>\n\u003ch2>Итог — и модуль, и курс\u003c/h2>\n\u003cul>\n\u003cli>Контрактный тест = живой API ↔ OpenAPI-спека; расхождение — красный билд, а не тихий бой фронтенда\u003c/li>\n\u003cli>CI — лестница скорости: юниты каждому пушу, контейнеры и контракты — перед мержем; красный билд — стоп-сигнал\u003c/li>\n\u003cli>Flaky чинят немедленно: доверие к конвейеру дороже любого теста\u003c/li>\n\u003cli>TDD: спецификация до кода; тесты-приёмники курса — его миниатюра\u003c/li>\n\u003cli>Coverage — термометр для поиска дыр, а не KPI\u003c/li>\n\u003c/ul>\n\u003cp>Модуль «Тесты» закрыт: вы умеете читать и писать юниты, поднимать слои интеграционно, проверять границы честными контейнерами и держать контракт в CI. Экзамен — впереди.\u003c/p>\n\u003ch2>Квиз\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Что именно проверяет контрактный тест?","options":["Живой API соответствует OpenAPI-спеке: пути, статусы, схемы ответов","Что код скомпилировался","Что UI красивый","Скорость базы"],"correct":0,"explanation":"Это ревью договора, работающее круглосуточно: добавили поле в код и забыли спеку — билд красный до того, как заметит фронтенд."},{"type":"multi","question":"Признаки здорового CI-конвейера: (несколько ответов)","options":["Быстрые проверки на каждый пуш, тяжёлые — перед мержем","Красный билд — приоритет №1 для команды","Flaky-тесты перезапускают до зелёного и забывают","Тесты детерминированы: одинаковый результат при каждом запуске"],"correct":[0,1,3],"explanation":"«Перезапустить и забыть» — как раз разрушение доверия: flaky чинят или помещают в карантин с тикетом."},{"type":"single","question":"Тест падает «через раз» в CI и всегда зелёный локально. Первая гипотеза?","options":["Недетерминированность: параллельность, порядок, данные или реальное время — локально условия мягче","CI-сервер сломан","Тест правильный, прод неправильный","Нужно отключить тест"],"correct":0,"explanation":"Классика flaky: гонки и утечки состояния. ЛечитсяAwaitility-ожиданиями, изоляцией данных, моками внешних вызовов."},{"type":"blank","question":"Как называется практика «сначала красный тест, затем минимальный код до зелёного, затем рефакторинг»? (аббревиатура)","answers":["TDD","tdd"],"explanation":"Test-Driven Development. Тесты-приёмники лаб курса — его миниатюра: контракт существует до реализации."},{"type":"match","question":"Сопоставьте уровень проверки и фазу CI.","pairs":[{"left":"Юниты + MockMvc + H2","right":"Каждый пуш, секунды"},{"left":"Testcontainers (*IT)","right":"Перед мержем, минуты"},{"left":"Контрактные тесты","right":"Перед мержем: API ↔ спека"},{"left":"Прод-метрики и алерты","right":"После деплоя (модуль 5)"}]},{"type":"single","question":"Команда ввела планку coverage 90% и через квартал получила 91% и кучу падающих прод-багов. Что пошло не так?","options":["Цифра стала целью: тесты ради покрытия (без ассертов, на моках всего) — строки «выполнялись», поведение не проверялось","90% слишком мало, нужно 95%","Coverage вообще не работает","Виноваты тестировщики"],"correct":0,"explanation":"Гудхарт: метрика перестаёт быть полезной, став целью. Coverage — термометр для поиска дыр; качество определяется ассертами и уровнем тестов."},{"type":"single","question":"Итог модуля. Фича «отмена заказа»: где какие проверки?","options":["Правила отмены — юниты сервиса; POST /cancel → 409/204 — MockMvc; отменённый не отображается — контейнерный тест с настоящей БД; API ↔ спека — контрактный в CI","Всё проверить одним E2E-тестом","Только юниты: остальное дорого","Проверит прод-мониторинг после релиза"],"correct":0,"explanation":"Пирамида в действии: каждому риску — свой уровень, от миллисекундных правил до контракта в конвейере. Именно это вы соберёте сами в лабах модуля."}]],"cases":[]},{"id":"m6-order-release","title":"Проверка релиза на стенде","module":6,"moduleTitle":"Тесты на бэкенде","order":5.5,"baseOrder":10,"lab":null,"html":"\u003ch1>Проверка релиза на стенде\u003c/h1>\n\u003cp>Команда выпускает отмену заказа. Твоя задача — сверить, какая сборка отвечает на стенде, найти результат миграции и проверить фичу по \u003ca href=\"#/m2-order-cancellation-review\">контракту\u003c/a>. В журналах используются учебные версии и время UTC.\u003c/p>\n\u003ch2>Сборка прошла проверки\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">16 января 11:32:00Z CI commit=31dc8a2\n  unit              passed\n  integration       passed\n  openapi-contract  passed\n  image             orders:31dc8a2\n\u003c/code>\u003c/pre>\n\u003cp>На стенде сначала получаем такой ответ.\u003c/p>\n\u003cpre>\u003ccode class=\"language-http\">GET /version\n\n\u003cspan class=\"hljs-meta\">HTTP/1.1\u003c/span> \u003cspan class=\"hljs-number\">200\u003c/span> OK\n\u003cspan class=\"hljs-attribute\">Content-Type\u003c/span>\u003cspan class=\"hljs-punctuation\">: \u003c/span>application/json\n\n\u003cspan class=\"language-json\">\u003cspan class=\"hljs-punctuation\">{\u003c/span>\u003cspan class=\"hljs-attr\">&quot;environment&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-string\">&quot;staging&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">,\u003c/span>\u003cspan class=\"hljs-attr\">&quot;commit&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">:\u003c/span>\u003cspan class=\"hljs-string\">&quot;7be40f1&quot;\u003c/span>\u003cspan class=\"hljs-punctuation\">}\u003c/span>\n\u003c/span>\u003c/code>\u003c/pre>\n\u003cp>Запрос владельца к \u003ccode>POST /api/orders/42/cancel\u003c/code> в этот момент вернул \u003ccode>404 ROUTE_NOT_FOUND\u003c/code>. Сохрани оба наблюдения перед тем, как открывать баг.\u003c/p>\n\u003ch2>Стенд после выкладки\u003c/h2>\n\u003cpre>\u003ccode class=\"language-text\">11:37:12Z deploy   target=staging image=orders:31dc8a2\n11:37:20Z migrate  changeset=2026-01-add-order-cancelled-at result=APPLIED\n11:37:36Z rollout  ready=2/2\n11:37:40Z version  environment=staging commit=31dc8a2\n\u003c/code>\u003c/pre>\n\u003cp>Последняя строка показывает результат повторного \u003ccode>GET /version\u003c/code>. Миграция добавила nullable-колонку \u003ccode>orders.cancelled_at\u003c/code>. Отмена записывает в неё время и меняет статус заказа на \u003ccode>CANCELLED\u003c/code>.\u003c/p>\n\u003cp>Команда отдельно запустила проверку старого образа на копии данных после миграции.\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">compatibility image=orders:7be40f1 changeset=2026-01-add-order-cancelled-at\n  startup                  PASS\n  read order status=NEW    PASS\n  read order status=CANCELLED FAIL unknown OrderStatus CANCELLED\n\u003c/code>\u003c/pre>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>","quizzes":[],"cases":[{"title":"Проверь выкладку и подготовь решение об откате","task":"Назови версию на стенде до и после выкладки. По какой строке видно, что миграция применилась? Как проверишь отмену после выкладки? Составь краткий план для прав, границы 24 часов, двух видов повтора и записей в БД. Оцени возможность вернуть старый образ по результатам проверки совместимости.\n","placeholder":"Версии и миграция\nЗапрос после выкладки\nПроверки контракта\nРешение об откате","referenceHtml":"\u003cp>В CI собран образ \u003ccode>31dc8a2\u003c/code>. Первый ответ стенда показывает \u003ccode>7be40f1\u003c/code>, где маршрут отмены ещё отсутствует. После выкладки запрос версии показывает \u003ccode>31dc8a2\u003c/code>, а журнал отмечает \u003ccode>2026-01-add-order-cancelled-at\u003c/code> как \u003ccode>APPLIED\u003c/code>. Эти свидетельства дают версия и журнал окружения.\u003c/p>\n\u003cp>Для быстрой проверки подготовь исходный заказ \u003ccode>42\u003c/code> в тестовой копии данных. Отправь \u003ccode>POST /api/orders/42/cancel\u003c/code> как владелец в пределах окна, с новым \u003ccode>Idempotency-Key\u003c/code>. Ожидай \u003ccode>204\u003c/code>. Потом прочитай заказ через \u003ccode>GET /api/orders/42\u003c/code> и проверь статус \u003ccode>CANCELLED\u003c/code> и единственный возврат в журнале бонусов.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Проверка\u003c/th>\n\u003cth>Ожидаемый результат\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>Анна, Борис и запрос без токена\u003c/td>\n\u003ctd>Владелец может отменить свой заказ. У Бориса \u003ccode>403\u003c/code>, без токена \u003ccode>401\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Три исходных заказа на отметках \u003ccode>11:59:59Z\u003c/code>, \u003ccode>12:00:00Z\u003c/code> и \u003ccode>12:00:01Z\u003c/code>\u003c/td>\n\u003ctd>Перед границей \u003ccode>204\u003c/code>. На границе и после неё \u003ccode>409 CANCELLATION_WINDOW_EXPIRED\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Тот же ключ после успешной отмены\u003c/td>\n\u003ctd>\u003ccode>204\u003c/code> и одна строка возврата\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Другой ключ после успешной отмены\u003c/td>\n\u003ctd>\u003ccode>409 ORDER_ALREADY_CANCELLED\u003c/code> и та же строка возврата\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Проверка данных после успеха\u003c/td>\n\u003ctd>\u003ccode>CANCELLED\u003c/code>, заполненный \u003ccode>cancelled_at\u003c/code> и возврат по \u003ccode>order_id\u003c/code> с причиной \u003ccode>ORDER_CANCELLED\u003c/code>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003cp>\u003cstrong>Откат.\u003c/strong> Старый образ запускается на новой схеме и читает \u003ccode>NEW\u003c/code>. Проверка строки с \u003ccode>CANCELLED\u003c/code> падает. Это конкретный блокер для возврата старого образа поверх этих данных. Перед откатом нужен образ, который читает все уже записанные состояния, и проверка чтения и записи на копии с применённой миграцией.\u003c/p>\n"}]},{"id":"m6-exam","title":"Экзамен модуля и кейс","module":6,"moduleTitle":"Тесты на бэкенде","order":6,"baseOrder":null,"lab":null,"html":"\u003ch1>Экзамен модуля «Тесты на бэкенде»\u003c/h1>\n\u003cp>Финальный экзамен курса: кейс, затем 15 вопросов. Порог прежний — 80%, ссылки «Перечитать» подскажут, куда возвращаться.\u003c/p>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>\u003ch2>Экзамен\u003c/h2>\n\u003cdiv class=\"quiz-slot\" data-quiz=\"0\">\u003c/div>","quizzes":[[{"type":"single","question":"Что защищает тест в первую очередь?","topic":"m6-lesson-01","options":["От регрессий: изменение, сломавшее старое поведение, краснит билд за минуты","От багов будущего","От плохого код-ревью","От падений инфраструктуры"],"correct":0,"explanation":"Регрессия — главная ценность; бонусом — документация и смелость рефакторить. «Отсутствие багов» не гарантируется никаким набором."},{"type":"single","question":"Почему юнитов много, а E2E мало?","topic":"m6-lesson-01","options":["Экономика: юнит быстрый и указывает на место ошибки, E2E медленный и падение не локализует","E2E сложнее писать","Юниты находят больше багов всегда","Стандарт требует 70/20/10"],"correct":0,"explanation":"Пирамида — про цену запуска и точность диагностики, а не про моду."},{"type":"single","codeLang":"java","code":"given(repo.findById(42L)).willReturn(Optional.of(order));\nservice.cancel(42L);\nassertThat(order.getStatus()).isEqualTo(CANCELLED);\n","question":"Где здесь Arrange?","topic":"m6-lesson-02","options":["Строка given(...): подготовка данных и заглушек","service.cancel(42L)","assertThat(...)","Нигде: это Assert-тест"],"correct":0,"explanation":"AAA: given — Arrange, вызов cancel — Act, assertThat — Assert. Читается как сценарий одной колонкой.","codeHtml":"given(repo.findById(\u003cspan class=\"hljs-number\">42L\u003c/span>)).willReturn(Optional.of(order));\nservice.cancel(\u003cspan class=\"hljs-number\">42L\u003c/span>);\nassertThat(order.getStatus()).isEqualTo(CANCELLED);\n"},{"type":"multi","question":"Что мокаем в юнит-тесте сервиса отмены заказа? (несколько ответов)","topic":"m6-lesson-02","options":["OrderRepository","KafkaTemplate (отправка события)","Clock (время)","Сам OrderService"],"correct":[0,1,2],"explanation":"Соседи и внешние границы — да; сам тестируемый класс — никогда (тест мока не проверяет ничего)."},{"type":"single","question":"Тест с assertThat(new BigDecimal(\"100\")).isEqualTo(new BigDecimal(\"100.00\")) падает. Почему и что делать?","topic":"m6-lesson-02","options":["equals учитывает масштаб — для денег нужен isEqualByComparingTo","Нужно использовать ==","BigDecimal нельзя сравнивать в тестах","Перевести в double"],"correct":0,"explanation":"100 и 100.00 — разные BigDecimal для equals. isEqualByComparingTo сравнивает числовое значение — правильно для денег."},{"type":"single","question":"Что даёт @Transactional на интеграционном тест-классе?","topic":"m6-lesson-03","options":["Каждый тест в транзакции с откатом: данные не протекают между тестами","Тесты бегут параллельно","База становится H2","Контекст стартует быстрее"],"correct":0,"explanation":"Изоляция через откат. Если проверяется сама фиксация — снимают аннотацию и чистят данные руками."},{"type":"single","codeLang":"java","code":"mockMvc.perform(post(\"/api/orders/42/cancel\"))\n       .andExpect(status().isConflict());\n","question":"Что этот тест гарантирует команде?","topic":"m6-lesson-03","options":["Повторная/запрещённая отмена отдаёт 409 — строка контракта API работает","Отмена всегда успешна","Заказа 42 не существует","База пуста"],"correct":0,"explanation":"Интеграционный тест фиксирует контракт границы: статус-код для конкретного сценария. Плюс-минус ничего — ровно заявленное.","codeHtml":"mockMvc.perform(post(\u003cspan class=\"hljs-string\">&quot;/api/orders/42/cancel&quot;\u003c/span>))\n       .andExpect(status().isConflict());\n"},{"type":"blank","question":"Какой аннотацией в Boot 4 подключается MockMvc в тесте? (@AutoConfigure…)","topic":"m6-lesson-03","answers":["@AutoConfigureMockMvc","AutoConfigureMockMvc"],"explanation":"@AutoConfigureMockMvc — из стартера spring-boot-starter-webmvc-test (модульный сплит Boot 4)."},{"type":"single","question":"H2-тест пропустил баг с EXCLUDE-ограничением, прод поймал. Что нужно было в наборе?","topic":"m6-lesson-04","options":["Testcontainers с настоящим PostgreSQL: диалект и ограничения целевой СУБД воспроизводятся честно","Больше H2-тестов","Только ручная проверка","Юнит-тест на ограничение с моком базы"],"correct":0,"explanation":"Мок/другая СУБД не проверяет диалект. Контейнер с версией прода — единственный честный ответ для таких случаев."},{"type":"single","question":"Зачем контейнер объявляют static на тест-классе?","topic":"m6-lesson-04","options":["Один контейнер на весь класс: старт занимает секунды — не множить его на каждый тест","static быстрее создаёт таблицы","Без static Liquibase не накатит миграции","Это требование Docker"],"correct":0,"explanation":"Скорость: контейнер — тяжёлая общая инфраструктура теста, а не атрибут метода."},{"type":"single","question":"Что сверяет контрактный тест?","topic":"m6-lesson-05","options":["Живой API с OpenAPI-спекой: пути, статусы, схемы — расхождение краснит билд","Скорость ответов","Нагрузочную стойкость","UI с макетом дизайнера"],"correct":0,"explanation":"Это ревью договора 24/7: «поле удалили, а в спеке осталось» ловится до фронта."},{"type":"multi","question":"Как обращаться с flaky-тестом? (несколько ответов)","topic":"m6-lesson-05","options":["Найти причину недетерминизма и починить","Если не чинится сразу — карантин/тикет с видимостью, не молчаливый ретрай","Перезапускать до зелёного и не думать","Удалить всё тесты этого класса"],"correct":[0,1],"explanation":"Доверие к конвейеру — главный актив. «Перезапустить и забыть» приучает команду не верить красному — и настоящий сбой пройдёт."},{"type":"single","question":"Coverage 95%, но прод-баги растут. Диагноз по Гудхарту?","topic":"m6-lesson-05","options":["Метрика стала целью: тесты ради строк (без ассертов, всё на моках) — покрытие есть, проверки нет","95% — мало, нужно 100%","Coverage всегда бесполезен","Баги — вина QA"],"correct":0,"explanation":"Покрытие показывает выполнение строк, не проверку поведения. Термометр хорош для поиска дыр, плох как KPI."},{"type":"blank","question":"Как называется практика «красный тест → минимальная реализация → рефакторинг»? (аббревиатура)","topic":"m6-lesson-05","answers":["TDD","tdd"],"explanation":"Test-Driven Development — спецификация до кода. Тесты-приёмники лаб курса — его миниатюра."},{"type":"single","question":"Финальный. Фиче «отмена заказа» нужен план тестов. Правильный скелет?","topic":"m6-lesson-01","options":["Правила окна 24ч — юниты; 204/409/403 — MockMvc; резерв под параллельными отменами — Testcontainers; API↔спека — контрактный в CI","Один E2E-тест на всё","Только юниты: остальное медленно","Тесты не нужны: прод-алерты сообщат"],"correct":0,"explanation":"Пирамида на одной фиче: каждому риску — свой уровень по цене/скорости. Именно это вы делали в лабах курса, теперь и своими руками — в лабах 8–9."}]],"cases":[{"title":"Составьте план тестирования фичи «отмена заказа»","task":"Фича: клиент может отменить заказ в течение 24 часов после оформления; после — только через поддержку. Правила: отменённый заказ освобождает резерв товара, покупателю возвращаются бонусы, событие orders.cancelled уходит в Kafka. Опишите план тестирования по уровням: (1) какие ПРАВИЛА закроете юнит-тестами (перечислите тест-кейсы именами методов); (2) что проверите интеграционно (MockMvc/H2) и что потребует Testcontainers; (3) что проверит контрактный тест; (4) что уйдёт в flaky-риски и как их предупредите. Форма свободная — как писали бы в тест-плане команды.","placeholder":"Юниты: cancelWithin24h_setsStatusCancelled...\nMockMvc: POST /api/orders/{id}/cancel → 409...\nTestcontainers: резерв/блокировки...\nFlaky-риски: ...","referenceHtml":"\u003cp>Один из возможных ответов.\u003c/p>\n\u003ch2>Юнит-тесты сервиса (правила, мок репозитория)\u003c/h2>\n\u003cpre>\u003ccode>cancelOrder_within24h_setsStatusCancelled()\ncancelOrder_after24h_throwsCancellationNotAllowedException()\ncancelOrder_alreadyCancelled_throwsOrderAlreadyCancelledException()\ncancelOrder_recalculatesAndReturnsBonuses()\ncancelOrder_unknownOrder_throwsNotFound()\n\u003c/code>\u003c/pre>\n\u003cp>Имена читаются как ТЗ: правило, условие, результат. Проверяются без HTTP и базы — быстро и точно.\u003c/p>\n\u003ch2>Интеграционные (MockMvc + H2)\u003c/h2>\n\u003cpre>\u003ccode>POST /api/orders/{id}/cancel → 204 (в течение 24ч)\nPOST /api/orders/{id}/cancel → 409 ORDER_ALREADY_CANCELLED\nPOST /api/orders/{id}/cancel → 409 CANCELLATION_WINDOW_EXPIRED\nPOST /api/orders/{id}/cancel на чужой заказ → 403\nGET /api/orders/{id} после отмены: status=CANCELLED, bonuses возвращены\n\u003c/code>\u003c/pre>\n\u003ch2>Testcontainers (PostgreSQL)\u003c/h2>\n\u003cpre>\u003ccode>Резерв товара: атомарный инкремент stock при отмене под параллельными отменами одного заказа\nFK/ограничения схемы: заказ со ссылками на несуществующий товар невозможен (миграции честные)\n\u003c/code>\u003c/pre>\n\u003ch2>Контрактный тест\u003c/h2>\n\u003cp>В OpenAPI описаны 204/409/403 на /cancel — тест сверяет живой ответ со схемой; добавили поле cancelledAt в ответ — спека обязана была обновиться в том же PR.\u003c/p>\n\u003ch2>Flaky-риски и профилактика\u003c/h2>\n\u003cul>\n\u003cli>«24 часа истекли»: тест завязан на текущее время → inject Clock (мок времени), никаких sleep\u003c/li>\n\u003cli>Событие в Kafka: асинхронное ожидание — Awaitility-цикл с дедлайном, не Thread.sleep\u003c/li>\n\u003cli>Параллельные отмены одного заказа: изоляция данных (уникальные orderId на тест), @Transactional-откат\u003c/li>\n\u003c/ul>\n\u003ch2>Итог\u003c/h2>\n\u003cp>Пирамида на одной фиче: ~5 юнитов (мс), ~5 интеграционных (с), пара контейнерных (диалект/гонки), контракт в CI — и никаких «проверим на проде».\u003c/p>\n"}]},{"id":"course-trainer","title":"Тренажёр повторения","module":7,"moduleTitle":"Повторение и финал","order":1,"baseOrder":null,"lab":null,"html":"\u003ch1>Тренажёр повторения\u003c/h1>\n\u003cp>Тренажёр собирает \u003cstrong>до 10 вопросов из выбранного маршрута\u003c/strong>. Вопросы из уже сданных квизов попадают в набор первыми. Если их меньше десяти, набор дополняется вопросами из других уроков маршрута.\u003c/p>\n\u003ch2>Как пользоваться\u003c/h2>\n\u003cul>\n\u003cli>Собирай новый набор раз в неделю.\u003c/li>\n\u003cli>Если ошибся, перейди по ссылке «Перечитать» в результатах.\u003c/li>\n\u003cli>Для вопросов по таймауту сверяй вывод со строками трейса и срезом данных.\u003c/li>\n\u003c/ul>\n\u003ch2>Кейс\u003c/h2>\n\u003cdiv class=\"case-slot\" data-case=\"0\">\u003c/div>","quizzes":[],"cases":[{"title":"Зачем этот экран?","task":"Напишите себе два предложения: какие три темы курса вы уже чувствуете уверенно и какую одну — совсем нет. На следующей неделе проверьте себя тренажёром и посмотрите, изменился ли список.","placeholder":"Уверен: HTTP-статусы, слои, …\nСовсем нет: …","referenceHtml":"\u003cp>Это упражнение — метапамятка: называние пробелов ускоряет их закрытие сильнее,\nчем простое «пройти ещё раз всё подряд». Осознанный список из четырёх тем —\nплан повторения на неделю: три для поддержки, одна — в работу.\u003c/p>\n"}]},{"id":"course-glossary","title":"Глоссарий курса","module":7,"moduleTitle":"Повторение и финал","order":2,"baseOrder":null,"lab":null,"html":"\u003ch1>Глоссарий курса\u003c/h1>\n\u003cp>Все термины курса в одном месте — по модулям, внутри в алфавите. Ищите через Ctrl+F / ⌘F.\u003c/p>\n\u003ch2>Модуль 1. Spring Boot с нуля\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>
