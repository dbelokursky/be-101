Термин\u003c/th>\n\u003cth>Определение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>DTO\u003c/strong> (Data Transfer Object)\u003c/td>\n\u003ctd>Класс, описывающий формат данных на границе API: стабилизирует контракт, не пускает внутренности наружу\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>DI\u003c/strong> (Dependency Injection)\u003c/td>\n\u003ctd>Механика Spring: фреймворк сам подставляет реализации в поля/конструкторы по интерфейсам\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Entity\u003c/strong>\u003c/td>\n\u003ctd>Java-класс, отображённый на таблицу БД (\u003ccode>@Entity\u003c/code>); «таблица, живущая как объект»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>HTTP\u003c/strong>\u003c/td>\n\u003ctd>Протокол диалога клиента и сервера: метод + путь + заголовки + тело → статус + тело\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>JVM\u003c/strong>\u003c/td>\n\u003ctd>Виртуальная машина Java — «движок», на котором запускаются Java-программы\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Lombok\u003c/strong>\u003c/td>\n\u003ctd>Генератор бойлерплейта на этапе компиляции: \u003ccode>@Getter\u003c/code>, \u003ccode>@Builder\u003c/code>, \u003ccode>@Data\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>MapStruct\u003c/strong>\u003c/td>\n\u003ctd>Генератор мапперов между объектами (entity ↔ DTO) на этапе компиляции\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Optional\u003c/strong>\u003c/td>\n\u003ctd>Обёртка «значения может не быть»: честный null без NullPointerException-рулетки\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Порт\u003c/strong>\u003c/td>\n\u003ctd>«Окно» с номером, через которое процесс принимает соединения; дефолт Spring Boot — 8080\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Профили\u003c/strong> (dev/prod)\u003c/td>\n\u003ctd>Наборы настроек для окружений: один код, разные базы/уровни логов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Репозиторий\u003c/strong>\u003c/td>\n\u003ctd>Слой доступа к данным: \u003ccode>JpaRepository\u003c/code>, SQL по имени метода\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Сервисный слой\u003c/strong>\u003c/td>\n\u003ctd>Бизнес-логика: правила «что можно и почём», не знает про HTTP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Статус-код\u003c/strong>\u003c/td>\n\u003ctd>Трёхзначный код ответа: 2xx успех, 4xx вина клиента, 5xx вина сервера\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Транзакция\u003c/strong> (@Transactional)\u003c/td>\n\u003ctd>«Всё или ничего»: упало на середине — изменения откатываются\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Модуль 2. Проектирование API\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Термин\u003c/th>\n\u003cth>Определение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>API-First\u003c/strong>\u003c/td>\n\u003ctd>Подход «сначала контракт»: спека OpenAPI → ревью → код и клиенты генерятся из неё\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Backward compatibility\u003c/strong>\u003c/td>\n\u003ctd>Обратная совместимость: старые клиенты продолжают работать после изменения\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Breaking change\u003c/strong>\u003c/td>\n\u003ctd>Изменение, ломающее клиентов (удалить/переименовать поле, сменить тип) — только через версию\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>GraphQL\u003c/strong>\u003c/td>\n\u003ctd>Стиль API, где клиент сам заказывает поля одним запросом; схема = контракт\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Идемпотентность\u003c/strong>\u003c/td>\n\u003ctd>Повтор запроса не меняет результат сверх первого раза (GET/PUT/DELETE — да, POST — нет)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Мок-сервер\u003c/strong>\u003c/td>\n\u003ctd>Фейковый API, отвечающий по спеке: фронт работает до готовности бэкенда\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>OpenAPI\u003c/strong>\u003c/td>\n\u003ctd>Стандарт машиночитаемого описания REST API в YAML/JSON\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Problem Details\u003c/strong>\u003c/td>\n\u003ctd>RFC 7807: единый формат ошибок JSON — машина по \u003ccode>status\u003c/code>+\u003ccode>code\u003c/code>, человек по \u003ccode>title/detail\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>$ref\u003c/strong>\u003c/td>\n\u003ctd>Ссылка на переиспользуемую схему в \u003ccode>components/schemas\u003c/code> спеки\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Deprecation / Sunset\u003c/strong>\u003c/td>\n\u003ctd>Заголовки объявления устаревания и даты выключения версии API\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Схема (GraphQL)\u003c/strong>\u003c/td>\n\u003ctd>Описание типов и полей, которые сервер умеет отдавать (\u003ccode>schema.graphqls\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Swagger UI\u003c/strong>\u003c/td>\n\u003ctd>Интерактивная документация из OpenAPI: читать и пробовать запросы\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Модуль 3. Данные\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Термин\u003c/th>\n\u003cth>Определение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Dirty checking\u003c/strong>\u003c/td>\n\u003ctd>Hibernate сам сравнивает entity с снимком и генерирует UPDATE при коммите\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>DLT\u003c/strong>\u003c/td>\n\u003ctd>Топик для «необрабатываемых» сообщений (подробнее в модуле 4)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>FK\u003c/strong> (внешний ключ)\u003c/td>\n\u003ctd>Колонка, указывающая на PK другой таблицы; база охраняет связь\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Full scan\u003c/strong>\u003c/td>\n\u003ctd>Поиск полным перебором строк без индекса — «внезапные» тормозы на проде\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Индекс\u003c/strong>\u003c/td>\n\u003ctd>Отсортированная структура по колонке: быстрый поиск ценой замедления записи\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>JOIN\u003c/strong>\u003c/td>\n\u003ctd>Соединение таблиц по условию связи в одном SQL-запросе\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Lazy / EAGER\u003c/strong>\u003c/td>\n\u003ctd>Отложенная/жадная загрузка связи: LAZY — при первом обращении, EAGER — сразу всегда\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>LazyInitializationException\u003c/strong>\u003c/td>\n\u003ctd>Обращение к ленивой связи вне открытой сессии/транзакции\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>N+1\u003c/strong>\u003c/td>\n\u003ctd>1 запрос за списком + N за связями каждого элемента\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Offset / Pageable\u003c/strong>\u003c/td>\n\u003ctd>Пагинация в SQL (LIMIT/OFFSET) вместо вытаскивания всего в память\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>@Version\u003c/strong>\u003c/td>\n\u003ctd>Оптимистичная блокировка: конфликт ловится при UPDATE → исключение и повтор\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Outbox\u003c/strong>\u003c/td>\n\u003ctd>Паттерн атомарной публикации событий из БД-транзакции (подробнее в модуле 4)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>PK\u003c/strong> (первичный ключ)\u003c/td>\n\u003ctd>Значение, однозначно идентифицирующее строку таблицы\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Testcontainers\u003c/strong>\u003c/td>\n\u003ctd>Настоящие СУБД (и не только) в Docker на время интеграционных тестов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Уровни изоляции\u003c/strong>\u003c/td>\n\u003ctd>READ COMMITTED / REPEATABLE READ / SERIALIZABLE — что видят параллельные транзакции\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Changeset\u003c/strong>\u003c/td>\n\u003ctd>Атомарный шаг миграции Liquibase; применённый — неизменен (чек-сумма)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Модуль 4. Kafka вглубь\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Термин\u003c/th>\n\u003cth>Определение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>At-least-once\u003c/strong>\u003c/td>\n\u003ctd>«Хотя бы один раз»: повторы доставки возможны → обработчик идемпотентен\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Брокер\u003c/strong>\u003c/td>\n\u003ctd>Сервер Kafka: принимает, хранит, раздаёт события\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>DLT\u003c/strong> (Dead Letter Topic)\u003c/td>\n\u003ctd>Топик-кладбище событий, не обработанных за N попыток; алерт на глубину\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Консюмер\u003c/strong>\u003c/td>\n\u003ctd>Подписчик: читает топик в своём темпе, группа делит партиции\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Ключ сообщения\u003c/strong>\u003c/td>\n\u003ctd>Маршрутизатор в партицию; события одного ключа — строго по порядку\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Лаг\u003c/strong> (lag)\u003c/td>\n\u003ctd>Отставание группы от хвоста лога — главная метрика консюмера\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Offset\u003c/strong>\u003c/td>\n\u003ctd>Номер события в партиции; закладка группы, хранится в Kafka\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Outbox\u003c/strong>\u003c/td>\n\u003ctd>Таблица-«исходящий ящик»: событие атомарно с бизнес-записью, релей публикует\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Партиция\u003c/strong>\u003c/td>\n\u003ctd>Параллельный лог; единица порядка и масштабирования\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Продюсер\u003c/strong>\u003c/td>\n\u003ctd>Издатель событий: сериализация → партиция по ключу → батч → acks\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Rebalance\u003c/strong>\u003c/td>\n\u003ctd>Перераспределение партиций между инстансами группы при смене состава\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Retention\u003c/strong>\u003c/td>\n\u003ctd>Время хранения событий в топике: можно перечитать\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Сага\u003c/strong>\u003c/td>\n\u003ctd>Цепочка локальных транзакций с компенсациями для длинных процессов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Топик\u003c/strong>\u003c/td>\n\u003ctd>Именованный лог событий; именование \u003ccode>домен.факт\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>TraceId\u003c/strong>\u003c/td>\n\u003ctd>Идентификатор, связывающий все логи и span'ы одного запроса (подробнее в модуле 5)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n\u003ch2>Модуль 5. Наблюдаемость\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Термин\u003c/th>\n\u003cth>Определение\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\n\u003ctr>\n\u003ctd>\u003cstrong>Burn rate\u003c/strong>\u003c/td>\n\u003ctd>Темп сгорания бюджета ошибок SLO — основа «умных» алертов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Gauge\u003c/strong>\u003c/td>\n\u003ctd>Метрика «сколько сейчас»: снимается в момент опроса\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Counter\u003c/strong>\u003c/td>\n\u003ctd>Метрика «сколько раз»: только растёт\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Золотые сигналы\u003c/strong>\u003c/td>\n\u003ctd>Traffic / Latency (p99) / Errors / Saturation — основа дашборда дежурного\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Кардинальность\u003c/strong>\u003c/td>\n\u003ctd>Число уникальных значений тега; уникальные id в тегах убивают Prometheus\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>MDC\u003c/strong>\u003c/td>\n\u003ctd>Поток-локальный контекст логгера: кладёшь traceId — он в каждой строке\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Micrometer\u003c/strong>\u003c/td>\n\u003ctd>«SLF4J для метрик»: один API, много бэкендов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Перцентиль\u003c/strong> (p99)\u003c/td>\n\u003ctd>Значение, ниже которого лежит 99% измерений; хвост важнее среднего\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Постмортем\u003c/strong>\u003c/td>\n\u003ctd>Разбор инцидента без поиска виноватых: что/почему/действия\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Runbook\u003c/strong>\u003c/td>\n\u003ctd>Инструкция «что делать» к алерту: первый шаг дежурного\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>SLO\u003c/strong>\u003c/td>\n\u003ctd>Договор о допустимом несовершенстве: «99.9% успешны за 30 дней»\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Span\u003c/strong>\u003c/td>\n\u003ctd>Отрезок работы в трейсе: контроллер → SQL → внешний вызов\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>Трейс\u003c/strong>\u003c/td>\n\u003ctd>Путь запроса через сервисы, связанный одним traceId\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003cstrong>p50 / p95 / p99\u003c/strong>\u003c/td>\n\u003ctd>Перцентили задержек: медиана / «почти все» / «хвост»\u003c/td>\n\u003c/tr>\n\u003c/tbody>\n\u003c/table>\n","quizzes":[],"cases":[]},{"id":"course-changelog","title":"Что нового в курсе","module":7,"moduleTitle":"Повторение и финал","order":3,"baseOrder":null,"lab":null,"html":"\u003ch1>Что нового в курсе\u003c/h1>\n\u003cp>Курс живёт и обновляется. Здесь — история изменений; свежее — сверху.\u003c/p>\n\u003ch2>v3 — модуль «Тесты на бэкенде» и полировка UX\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Новый модуль «Тесты на бэкенде»\u003c/strong>: уровни, JUnit/Mockito, MockMvc+H2, Testcontainers, контрактные тесты и CI (5 уроков + экзамен с кейсом «план тестирования»)\u003c/li>\n\u003cli>Онбординг первого входа: правила игры теперь показываются в курсе\u003c/li>\n\u003cli>Тёмная тема целиком: все карточки, кейсы и поля адаптированы\u003c/li>\n\u003cli>Шпаргалки всех модулей + печать/PDF без лишнего\u003c/li>\n\u003cli>Глоссарий: ~70 терминов курса в одном месте\u003c/li>\n\u003cli>Оглавление внутри уроков, вкладки «Кейс/Экзамен», переигрывание кейса\u003c/li>\n\u003cli>Навигация «Предыдущий/Следующий», «Продолжить с места», favicon\u003c/li>\n\u003cli>Тренажёр повторения: 10 случайных вопросов из пройденного\u003c/li>\n\u003cli>Экзамен связан с уроками: провалы → ссылки «Перечитать»\u003c/li>\n\u003cli>Финальный экран с прогрессом по модулям и чек-листом навыков\u003c/li>\n\u003c/ul>\n\u003ch2>v2 — полный курс и публикация\u003c/h2>\n\u003cul>\n\u003cli>Модули «Проектирование API» (OpenAPI, REST-практики, GraphQL, контракт в команде), «Данные» (SQL, JPA, N+1, транзакции, Liquibase), «Kafka вглубь», «Наблюдаемость» (метрики, логи, трейсы, алерты)\u003c/li>\n\u003cli>Лабы 1–7: от первого контроллера до собственных метрик Micrometer\u003c/li>\n\u003cli>Курс опубликован на GitHub Pages\u003c/li>\n\u003c/ul>\n\u003ch2>v1 — пилот\u003c/h2>\n\u003cul>\n\u003cli>Модуль «Spring Boot с нуля»: 5 уроков + экзамен + кейс\u003c/li>\n\u003cli>Платформа: генератор статики из markdown, квиз-движок (5 типов вопросов), прогресс в localStorage\u003c/li>\n\u003cli>Лабы 0–2 с ветками заданий и решений\u003c/li>\n\u003c/ul>\n","quizzes":[],"cases":[]},{"id":"course-finish","title":"Финал курса","module":7,"moduleTitle":"Повторение и финал","order":4,"baseOrder":null,"lab":{"title":"Лаба 10. Capstone — сервис заказов целиком","description":"Выпускной проект: REST + валидация + Liquibase + Kafka-событие + бизнес-метрика в одном сервисе. Обвязка и приёмные тесты на весь курс — Java-слой ваш. Проверка: mvn test 6/6.","branch":"lab-10","branchSolution":"lab-10-solution","hasTests":true,"testCommand":"mvn test"},"html":"\u003ch1>Финал курса BE-101\u003c/h1>\n\u003cp>Вы прошли путь от «что происходит, когда я открываю страницу» до сервиса, за которым видно здоровье бизнеса. Сводный прогресс — в шапке выше: каждый модуль — отдельная грань одного навыка.\u003c/p>\n\u003ch2>Запись заказа и событие в выпускной лабе\u003c/h2>\n\u003cp>В учебном решении сервис отправляет событие в Kafka внутри метода с \u003ccode>@Transactional\u003c/code>. База и Kafka фиксируют изменения независимо. Событие может попасть в Kafka до отката БД. Заказ также может сохраниться, если асинхронная отправка завершится ошибкой. Приёмочная проверка Kafka покрывает успешную публикацию.\u003c/p>\n\u003cp>Разберите эти два случая по \u003ca href=\"#/m4-lesson-03\">уроку про dual-write\u003c/a>. В \u003ca href=\"#/m4-lesson-05\">уроке про надёжную доставку\u003c/a> transactional outbox сохраняет заказ и запись для публикации в одной транзакции БД. Отдельный обработчик отправляет событие в Kafka после коммита.\u003c/p>\n\u003ch2>Что теперь вы умеете\u003c/h2>\n\u003cp>\u003cstrong>Модуль 1 — Spring Boot с нуля\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Читать HTTP-диалог клиента и сервера: методы, статусы, заголовки, JSON\u003c/li>\n\u003cli>Видеть слои сервиса: контроллер → сервис → репозиторий → база\u003c/li>\n\u003cli>Читать Java/Spring-код: аннотации, Lombok, Optional, интерфейсы\u003c/li>\n\u003cli>Написать REST-контроллер с DTO и MapStruct-маппером\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Модуль 2 — Проектирование API\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Относиться к API как к договору: версии, deprecation, обратная совместимость\u003c/li>\n\u003cli>Читать и писать OpenAPI-спеку; знать, что такое Swagger UI и мок-сервер\u003c/li>\n\u003cli>Проектировать ресурсы, ошибки и пагинацию по правилам хорошего тона\u003c/li>\n\u003cli>Понимать GraphQL и выбирать между ним и REST осознанно\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Модуль 3 — Данные\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Читать схему БД: ключи, связи, индексы; понимать цену полного перебора\u003c/li>\n\u003cli>Работать со связями entity: LAZY, каскады, dirty checking\u003c/li>\n\u003cli>Видеть и лечить N+1; знать транзакции, изоляцию и блокировки\u003c/li>\n\u003cli>Управлять схемой миграциями Liquibase, а не «руками»\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Модуль 4 — Kafka вглубь\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Отличать событие от команды и понимать, когда нужен брокер\u003c/li>\n\u003cli>Знать устройство: топики, партиции, ключи, offset'ы, группы\u003c/li>\n\u003cli>Публиковать надёжно: acks, идемпотентность, outbox, DLT\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Модуль 5 — Наблюдаемость\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Читать систему по трём столпам: метрики, логи, трейсы\u003c/li>\n\u003cli>Добавлять бизнес-метрики Micrometer и понимать кардинальность\u003c/li>\n\u003cli>Строить дашборды и алерты по симптомам, а не по причинам\u003c/li>\n\u003c/ul>\n\u003ch2>Что дальше\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Возьмите первую настоящую таску\u003c/strong> в бэкенд-репо своей команды — маленькую, с ментором. Курс дал словарь и карту; скорость придёт с практикой.\u003c/li>\n\u003cli>\u003cstrong>Держите шпаргалки под рукой\u003c/strong> и возвращайтесь к урокам по ссылке «Перечитать» из экзаменов и тренажёра.\u003c/li>\n\u003cli>\u003cstrong>Читайте чужой код как учебник\u003c/strong>: алгоритм из урока 3.1 (аннотации → поля → публичные методы) работает на любом проекте.\u003c/li>\n\u003cli>И да: \u003ca href=\"#/course-trainer\">тренажёр повторения\u003c/a> — раз в неделю, пять минут.\u003c/li>\n\u003c/ol>\n\u003cp>Спасибо, что дошли сюда. 🎓\u003c/p>\n","quizzes":[],"cases":[]}]};
</script>
<script>
/* Учебные данные первого упражнения. Токены относятся только к этой модели. */
const be101OrderDemo = (() => {
  const owner = 'demo-anna';
  const buyer = 'demo-boris';
  const order = { id: 42, status: 'NEW', createdAt: '2026-01-15T12:00:00Z' };
  const orderIdPattern = /^[0-9]{1,12}$/;

  function response(status, statusText, body, extraHeaders) {
    const headers = {
      'Content-Type': status === 200 ? 'application/json' : 'application/problem+json',
      'Cache-Control': 'no-store',
      ...extraHeaders,
    };
    return { status, statusText, body, headers };
  }

  function readOrder(id, authorization) {
    const credential = /^Bearer +(\S+)$/i.exec(authorization || '');
    const token = credential && credential[1];
    if (token !== owner && token !== buyer) {
      return response(401, 'Unauthorized', { title: 'Unauthorized', status: 401 }, {
        'WWW-Authenticate': 'Bearer realm="be101"',
      });
    }
    if (id !== String(order.id)) {
      return response(404, 'Not Found', { title: 'Not Found', status: 404 });
    }
    if (token !== owner) {
      return response(403, 'Forbidden', { title: 'Forbidden', status: 403 });
    }
    return response(200, 'OK', order);
  }

  return { owner, buyer, order, orderIdPattern, readOrder };
})();

const be101OrderExercise = (() => {
  function controlOrderRequests() {
    if (!window.isSecureContext || location.protocol === 'file:' || !navigator.serviceWorker) {
      return Promise.resolve(false);
    }

    const workers = navigator.serviceWorker;
    const script = new URL('order-worker.js', document.baseURI).href;
    const controlsPage = () => workers.controller?.scriptURL === script;
    if (controlsPage()) return Promise.resolve(true);

    return new Promise(resolve => {
      const timer = setTimeout(() => finish(false), 2500);
      function finish(ready) {
        clearTimeout(timer);
        workers.removeEventListener('controllerchange', onControllerChange);
        resolve(ready);
      }
      function onControllerChange() {
        if (controlsPage()) finish(true);
      }
      workers.addEventListener('controllerchange', onControllerChange);
      workers.register(script).then(onControllerChange, () => finish(false));
    });
  }

  async function exchange(id, authorization) {
    const url = new URL('api/orders/' + id, document.baseURI);
    const request = [
      'GET ' + url.pathname,
      ...(authorization ? ['Authorization: ' + authorization] : []),
    ].join('\n');

    try {
      if (await controlOrderRequests()) {
        const response = await fetch(url, {
          headers: authorization ? { Authorization: authorization } : {},
          cache: 'no-store',
        });
        if (response.headers.get('X-BE101-Practice') === 'orders') {
          const headers = {};
          for (const name of ['Content-Type', 'Cache-Control', 'WWW-Authenticate']) {
            if (response.headers.has(name)) headers[name] = response.headers.get(name);
          }
          return {
            request,
            status: response.status,
            statusText: response.statusText,
            headers,
            body: await response.text(),
            source: 'Учебный запрос доступен в DevTools → Network.',
          };
        }
      }
    } catch (_) {
      // Сохранённый пример доступен без сетевого обмена.
    }

    const sample = be101OrderDemo.readOrder(id, authorization);
    return {
      ...sample,
      request: 'GET /api/orders/' + id +
        (authorization ? '\nAuthorization: ' + authorization : ''),
      body: JSON.stringify(sample.body, null, 2),
      source: 'Сохранённый пример обмена.',
    };
  }

  function element(tag, className, value) {
    const node = document.createElement(tag);
    node.className = className;
    if (value) node.textContent = value;
    return node;
  }

  function mount(slot) {
    const showIdentity = slot.dataset.orderExercise === 'access';
    const form = element('form', 'order-request');
    const label = element('label', 'order-field', 'Номер заказа');
    const number = element('input', '');
    number.inputMode = 'numeric';
    number.pattern = '[0-9]{1,12}';
    number.required = true;
    number.maxLength = 12;
    number.value = String(be101OrderDemo.order.id);
    label.appendChild(number);
    form.appendChild(label);

    const identity = element('select', '');
    if (showIdentity) {
      const identityLabel = element('label', 'order-field', 'Учебный пользователь');
      const entries = [
        ['Анна, владелец', be101OrderDemo.owner],
        ['Борис, другой покупатель', be101OrderDemo.buyer],
        ['Без токена', ''],
      ];
      for (const [name, token] of entries) {
        const option = element('option', '', name);
        option.value = token;
        identity.appendChild(option);
      }
      identityLabel.appendChild(identity);
      form.appendChild(identityLabel);
    }

    const send = element('button', 'btn', 'Отправить GET');
    send.type = 'submit';
    form.appendChild(send);
    const notice = element('p', 'order-notice');
    notice.setAttribute('role', 'status');
    const transcript = element('pre', 'order-transcript');
    transcript.hidden = true;
    slot.append(form, notice, transcript);

    form.addEventListener('submit', async event => {
      event.preventDefault();
      const id = number.value;
      if (!be101OrderDemo.orderIdPattern.test(id)) return;
      const token = showIdentity ? identity.value : be101OrderDemo.owner;
      send.disabled = true;
      notice.textContent = 'Отправляю запрос…';
      const result = await exchange(id, token ? 'Bearer ' + token : '');
      transcript.textContent = [
        result.request,
        '',
        result.status + ' ' + result.statusText,
        ...Object.entries(result.headers).map(([name, value]) => name + ': ' + value),
        '',
        result.body,
      ].join('\n');
      transcript.hidden = false;
      notice.textContent = result.status + ' ' + result.statusText + '. ' + result.source;
      send.disabled = false;
    });
  }

  return { mount };
})();

/* Черновики остаются в браузере. Учебный прогресс хранится отдельно. */
const be101CaseWork = (() => {
  const unsaved = new Map();

  function keyFor(lessonId, caseIndex, part) {
    return `be101.case-draft.v1.${lessonId}.${caseIndex}.${part}`;
  }

  function load(lessonId, caseIndex, part) {
    const key = keyFor(lessonId, caseIndex, part);
    if (unsaved.has(key)) return { text: unsaved.get(key), saved: false };
    try {
      return { text: localStorage.getItem(key) ?? '', saved: true };
    } catch (_) {
      return { text: '', saved: false };
    }
  }

  function save(lessonId, caseIndex, part, text) {
    const key = keyFor(lessonId, caseIndex, part);
    try {
      if (text === '') localStorage.removeItem(key);
      else localStorage.setItem(key, text);
      unsaved.delete(key);
      return true;
    } catch (_) {
      unsaved.set(key, text);
      return false;
    }
  }

  function markdown(lesson, caseIndex, answer, review) {
    const exercise = lesson.cases[caseIndex];
    const sections = [
      `# ${exercise.title}`,
      `Урок «${lesson.title}»`,
      '## Задание',
      exercise.task,
      '## Решение',
      answer.trimEnd(),
    ];
    if (review.trim()) sections.push('## Самооценка по разбору', review.trimEnd());
    return sections.join('\n\n') + '\n';
  }

  return { load, save, markdown };
})();

/* BE-101 course engine: роутинг, прогресс, квиз-движок. Ванильный JS, без зависимостей. */
(function () {
  'use strict';

  var LESSONS = (window.BE101 && window.BE101.lessons) || [];
  var BASIC_LESSONS = LESSONS.filter(function (lesson) { return lesson.baseOrder > 0; })
    .sort(function (left, right) { return left.baseOrder - right.baseOrder; });
  var STORE_KEY = 'be101.progress.v1';
  var ROUTE_KEY = 'be101.route';
  var THEME_KEY = 'be101.theme';
  var PASS_RATIO = 0.8; // порог сдачи квиза: 80%+
  var LAB_REPO = 'https://github.com/dbelokursky/be-101';
  var currentRoute = loadRoute();
  rememberRoute(currentRoute);

  // ---------- тема (светлая/тёмная) ----------

  function currentTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem(THEME_KEY, t); } catch (_) { /* приватный режим */ }
  }
  (function initTheme() {
    var t = null;
    try { t = localStorage.getItem(THEME_KEY); } catch (_) { /* ignore */ }
    if (!t) {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();

  function el(tag, cls, html) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (html !== undefined) node.innerHTML = html;
    return node;
  }
  function esc(s) {
    return String(s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function shuffledIndices(items) {
    return shuffle(items.map(function (_, index) { return index; }));
  }
  function normalizeText(s) {
    return String(s).trim().toLowerCase().replace(/\s+/g, ' ');
  }

  // { lessonId: { quizPassed: {slotIndex: true}, labDone: bool } }

  function loadProgress() {
    try {
      var raw = localStorage.getItem(STORE_KEY);
      var p = raw ? JSON.parse(raw) : {};
      return p && typeof p === 'object' ? p : {};
    } catch (_) { return {}; }
  }
  function saveProgress(p) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(p)); } catch (_) {}
  }
  function getLessonProgress(id) {
    var p = loadProgress();
    var lp = p[id];
    if (!lp || typeof lp !== 'object') lp = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!lp.quizPassed) lp.quizPassed = {};
    if (!lp.caseDone) lp.caseDone = {};
    return lp;
  }
  function setQuizPassed(lessonId, slot, passed) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!p[lessonId].quizPassed) p[lessonId].quizPassed = {};
    p[lessonId].quizPassed[slot] = passed;
    saveProgress(p);
  }
  function setCaseDone(lessonId, slot, done) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    if (!p[lessonId].caseDone) p[lessonId].caseDone = {};
    p[lessonId].caseDone[slot] = done;
    saveProgress(p);
  }
  function setLabDone(lessonId, done) {
    var p = loadProgress();
    if (!p[lessonId]) p[lessonId] = { quizPassed: {}, caseDone: {}, labDone: false };
    p[lessonId].labDone = done;
    saveProgress(p);
  }

  function lessonUnits(l, includeLabs = true) {
    return l.quizzes.length + l.cases.length + (includeLabs && l.lab ? 1 : 0);
  }
  function lessonDoneUnits(l, includeLabs = true) {
    var lp = getLessonProgress(l.id);
    var q = 0, i;
    for (i = 0; i < l.quizzes.length; i++) if (lp.quizPassed[i]) q++;
    for (i = 0; i < l.cases.length; i++) if (lp.caseDone[i]) q++;
    return q + (includeLabs && l.lab && lp.labDone ? 1 : 0);
  }
  function moduleProgress() {
    var done = 0, total = 0;
    for (var i = 0; i < LESSONS.length; i++) {
      done += lessonDoneUnits(LESSONS[i]);
      total += lessonUnits(LESSONS[i]);
    }
    return total ? done / total : 0;
  }
  // moduleProgress оставлен для будущих сводных экранов; сайдбар считает прогресс по каждому модулю отдельно

  // ---------- роутинг ----------

  function currentLessonId() {
    var h = (location.hash || '').replace(/^#\/?/, '');
    for (var i = 0; i < LESSONS.length; i++) {
      if (LESSONS[i].id === h) return h;

    return LESSONS.length ? LESSONS[0].id : '';
  }

  function loadRoute() {
    try {
      var saved = localStorage.getItem(ROUTE_KEY);

  }

  function rememberRoute(route) {

  function isBasicRoute() { return currentRoute === 'basic' && BASIC_LESSONS.length > 0; }
  function routeLessons() { return isBasicRoute() ? BASIC_LESSONS : LESSONS; }

  function nextIncompleteLesson() {
    var includeLabs = !isBasicRoute();

  function selectRoute(route) {

    rememberRoute(route);
    var lessons = routeLessons();
    var active = currentLessonId();
    if (active === 'course-trainer' || lessons.some(function (lesson) { return lesson.id === active; })) {

      ['full', 'Полный курс и Spring', 'Пройди все модули и собери сервис на Java в лабораторных.'],
    ].forEach(function (entry) {

      button.addEventListener('click', function () { selectRoute(route); });
      choices.appendChild(button);
    });
    return choices;
  }

  function updateContinueLink() {
    var link = document.querySelector('.continue-banner');
    if (!link) return;
    var next = nextIncompleteLesson();
    link.hidden = !next || next.id === currentLessonId();
    if (link.hidden) return;

    link.textContent = 'Продолжить с урока «' + next.title + '»';
  }

  function mountRouteIntro(article) {
    var intro = el('section', 'route-intro');
    intro.appendChild(routeChoices(true));
    intro.appendChild(el('a', 'continue-banner'));
    article.insertBefore(intro, article.firstChild);

  // ---------- сайдбар ----------

  function renderSidebar(container, activeId) {
    var wrap = el('aside', 'sidebar');

    var brand = el('div', 'brand');
    var brandRow = el('div', 'brand-row');
    brandRow.appendChild(el('div', 'brand-title', 'BE‑101'));
    var themeBtn = el('button', 'theme-toggle', currentTheme() === 'dark' ? '☀️' : '🌙');
    themeBtn.type = 'button';
    themeBtn.title = 'Переключить тему';
    themeBtn.addEventListener('click', function () {
      applyTheme(currentTheme() === 'dark' ? 'light' : 'dark');
      render(); // перекрасить mermaid и иконку
    });
    brandRow.appendChild(themeBtn);
    brand.appendChild(brandRow);
    brand.appendChild(el('div', 'brand-sub', 'Бэкенд для смежных специальностей'));
    wrap.appendChild(brand);
    if (BASIC_LESSONS.length) wrap.appendChild(routeChoices(false));

    // группировка уроков по модулям (module — номер, moduleTitle — название)
    var includeLabs = !isBasicRoute();

    var byNum = {};
    routeLessons().forEach(function (l) {
      var group = includeLabs ? l.module : 'basic';
      if (!byNum[group]) {

        };

      }
      byNum[group].lessons.push(l);

    modules.forEach(function (m) {
      var done = 0, total = 0;
      m.lessons.forEach(function (l) {
        done += lessonDoneUnits(l, includeLabs);

      head.appendChild(el('div', 'module-title', esc(m.title)));
      head.appendChild(el('div', 'module-progress-label', pct + '%'));

      var bar = el('div', 'module-progress-bar');
      var fill = el('div', 'module-progress-fill');
      fill.style.width = pct + '%';
      bar.appendChild(fill);
      wrap.appendChild(bar);

      var list = el('nav', 'lesson-list');
      m.lessons.forEach(function (l) {

        var lessonDone = units > 0 && lessonDoneUnits(l, includeLabs) === units;
        var item = el('a',
          'lesson-item' + (l.id === activeId ? ' active' : ''),
          '<span class="lesson-status ' + (lessonDone ? 'done' : '') + '">' + (lessonDone ? '✓' : '') + '</span>' +
          '<span class="lesson-title">' + esc(includeLabs ? lessonLabel(l) : l.title) + '</span>');

    });

    if (isBasicRoute() && LESSONS.some(function (lesson) { return lesson.id === 'course-trainer'; })) {
      var trainerLink = el('a', 'lesson-item route-trainer' +
        (activeId === 'course-trainer' ? ' active' : ''), 'Тренажёр повторения');

  // обновить только сайдбар (галочки/прогресс), не трогая контент урока:
  // полный render() пересоздал бы DOM и сбрасывал незакрытую попытку квиза
  function updateSidebar(activeId) {

    var old = appEl && appEl.querySelector('.sidebar');
    if (!old) return;
    var holder = el('div');
    renderSidebar(holder, activeId || currentLessonId());

  // ---------- квиз-движок ----------

  var TYPE_LABELS = {
    single: 'один ответ',
    multi: 'несколько ответов',
    blank: 'впиши ответ',
    match: 'сопоставь',
  };

  function mountQuiz(slotEl, lesson, slotIndex) {
    var questions = lesson.quizzes[slotIndex];
    var lp = getLessonProgress(lesson.id);
    var alreadyPassed = !!lp.quizPassed[slotIndex];

    var root = el('div', 'quiz');
    root.appendChild(el('div', 'quiz-head',
      '<span class="quiz-badge">Квиз</span>' +
      '<span class="quiz-hint">Порог сдачи — ' + Math.round(PASS_RATIO * 100) + '%. Пересдача не ограничена.</span>' +
      (alreadyPassed ? '<span class="quiz-passed-badge">✓ уже сдан</span>' : '')));

    var body = el('div', 'quiz-body');
    root.appendChild(body);

    var result = el('div', 'quiz-result');
    root.appendChild(result);

    var order; // порядок вопросов текущей попытки

    function startAttempt() {
      body.innerHTML = '';
      result.innerHTML = '';
      result.className = 'quiz-result';
      order = shuffledIndices(questions);
      var correctCount = 0;
      var answeredCount = 0;
      var okByIndex = {};

      order.forEach(function (qi, pos) {
        var q = questions[qi];
        var qEl = el('div', 'question');
        qEl.appendChild(el('div', 'question-head',
          '<span class="question-num">' + (pos + 1) + '</span>' +
          '<span class="question-type">' + TYPE_LABELS[q.type] + '</span>'));
        qEl.appendChild(el('div', 'question-text', esc(q.question)));
        if (q.codeHtml) {
          qEl.appendChild(el('pre', 'question-code', '<code>' + q.codeHtml + '</code>'));
        }
        var area = el('div', 'question-area');
        qEl.appendChild(area);

        function finish(ok, detailsHtml) {
          correctCount += ok ? 1 : 0;
          okByIndex[qi] = ok;
          answeredCount++;
          qEl.classList.add(ok ? 'ok' : 'fail');
          area.classList.add('locked');
          var fb = el('div', 'question-feedback ' + (ok ? 'ok' : 'fail'),
            '<b>' + (ok ? '✓ Верно' : '✗ Неверно') + '</b>' +
            (q.explanation ? '<div class="question-expl">' + esc(q.explanation) + '</div>' : '') +
            (detailsHtml || ''));
          qEl.appendChild(fb);
          if (answeredCount === questions.length) finishAttempt(correctCount, okByIndex);
        }

        if (q.type === 'single') {
          var optionOrder = shuffledIndices(q.options);
          optionOrder.forEach(function (oi) {
            var b = el('button', 'option', esc(q.options[oi]));
            b.type = 'button';
            b.addEventListener('click', function () {
              if (area.classList.contains('locked')) return;
              var ok = oi === q.correct;
              area.querySelectorAll('.option').forEach(function (o, idx) {
                o.disabled = true;
                if (optionOrder[idx] === q.correct) o.classList.add('correct');
              });
              if (!ok) b.classList.add('wrong');
              finish(ok);
            });
            area.appendChild(b);
          });
        }

        if (q.type === 'multi') {
          var boxes = [];
          shuffledIndices(q.options).forEach(function (oi) {
            var lab = el('label', 'option check',
              '<input type="checkbox" data-i="' + oi + '"> <span>' + esc(q.options[oi]) + '</span>');
            area.appendChild(lab);
            boxes.push(lab);
          });
          var submit = el('button', 'btn small', 'Ответить');
          submit.type = 'button';
          submit.addEventListener('click', function () {
            if (area.classList.contains('locked')) return;
            var chosen = [];
            boxes.forEach(function (l) {
              var cb = l.querySelector('input');
              if (cb.checked) chosen.push(Number(cb.dataset.i));
            });
            if (!chosen.length) return;
            var need = q.correct.slice().sort(function (a, b) { return a - b; });
            var got = chosen.slice().sort(function (a, b) { return a - b; });
            var ok = need.length === got.length && need.every(function (v, i) { return v === got[i]; });
            boxes.forEach(function (l) {
              var cb = l.querySelector('input');
              cb.disabled = true;
              var i = Number(cb.dataset.i);
              if (need.indexOf(i) >= 0) l.classList.add('correct');
              else if (cb.checked) l.classList.add('wrong');
            });
            finish(ok);
          });
          area.appendChild(submit);
        }

        if (q.type === 'blank') {
          var row = el('div', 'blank-row');
          var input = document.createElement('input');
          input.type = 'text';
          input.className = 'blank-input';
          input.placeholder = 'Твой ответ…';
          input.autocomplete = 'off';
          input.spellcheck = false;
          var b = el('button', 'btn small', 'Ответить');
          b.type = 'button';
          row.appendChild(input);
          row.appendChild(b);
          area.appendChild(row);
          function submitBlank() {
            if (area.classList.contains('locked')) return;
            var v = normalizeText(input.value);
            if (!v) return;
            var ok = q.answers.some(function (a) { return normalizeText(a) === v; });
            input.disabled = true;
            b.disabled = true;
            input.classList.add(ok ? 'correct' : 'wrong');
            finish(ok, ok ? '' : '<div class="correct-answer">Правильный ответ: <b>' +
              esc(q.answers[0]) + '</b></div>');
          }
          b.addEventListener('click', submitBlank);
          input.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') submitBlank();
          });
        }

        if (q.type === 'match') {
          var rights = shuffle(q.pairs.map(function (p) { return p.right; }));
          var selects = [];
          q.pairs.forEach(function (p) {
            var rowM = el('div', 'match-row');
            rowM.appendChild(el('div', 'match-left', esc(p.left)));
            var sel = document.createElement('select');
            sel.className = 'match-select';
            sel.appendChild(el('option', '', '— выбери —'));
            rights.forEach(function (r) {
              var o = el('option', '', esc(r));
              o.value = r;
              sel.appendChild(o);
            });
            rowM.appendChild(sel);
            area.appendChild(rowM);
            selects.push({ select: sel, right: p.right });
          });
          var submitM = el('button', 'btn small', 'Ответить');
          submitM.type = 'button';
          submitM.addEventListener('click', function () {
            if (area.classList.contains('locked')) return;
            if (selects.some(function (s) { return !s.select.value; })) return;
            var allOk = true;
            selects.forEach(function (s) {
              s.select.disabled = true;
              var ok = s.select.value === s.right;
              if (!ok) allOk = false;
              s.select.classList.add(ok ? 'correct' : 'wrong');
            });
            finish(allOk);
          });
          area.appendChild(submitM);
        }

        body.appendChild(qEl);
      });
    }

    function finishAttempt(correctCount, okByIndex) {
      var pct = Math.round((correctCount / questions.length) * 100);
      var passed = correctCount / questions.length >= PASS_RATIO;
      setQuizPassed(lesson.id, slotIndex, passed || getLessonProgress(lesson.id).quizPassed[slotIndex]);

      result.className = 'quiz-result show ' + (passed ? 'ok' : 'fail');
      result.innerHTML =
        '<div class="quiz-score">' +
        (passed ? '🎉 Квиз сдан!' : 'Пока не сдан') +
        ' — верно ' + correctCount + ' из ' + questions.length +
        ' (' + pct + '%)' +
        '</div>' +
        (passed
          ? '<div class="quiz-note">Урок отмечен пройденным ✓</div>'
          : '<div class="quiz-note">Нужно ' + Math.round(PASS_RATIO * 100) +
            '%+. Перечитай пояснения выше и попробуй ещё раз — вопросы и варианты перемешаются.</div>');

      // «что перечитать»: темы проваленных вопросов (кроме собственных уроков)
      var wrongTopics = {};
      questions.forEach(function (q, qi) {
        if (!okByIndex[qi] && q.topic && q.topic !== lesson.id) wrongTopics[q.topic] = true;
      });
      var topicIds = Object.keys(wrongTopics);
      if (topicIds.length) {
        var links = [];
        topicIds.forEach(function (tid) {
          for (var i = 0; i < LESSONS.length; i++) {
            if (LESSONS[i].id === tid) {
              links.push('<a href="#/' + tid + '">' +

      }

      var retake = el('button', 'btn small', 'Пройти заново');
      retake.type = 'button';
      retake.addEventListener('click', function () {
        startAttempt();
      });
      result.appendChild(retake);
      updateSidebar();
    }

    slotEl.innerHTML = '';
    slotEl.appendChild(root);
    startAttempt();
  }

                                             : el('span', 'lesson-nav-spacer'));

  // финальный экран: сводный прогресс по всем модулям (динамическая шапка)
  function mountFinishHero(article) {
    var hero = el('div', 'finish-hero');

    var total = 0, done = 0;
    var modules = [];
    var byNum = {};
    LESSONS.forEach(function (l) {
      if (!byNum[l.module]) {
        byNum[l.module] = { title: l.moduleTitle || ('Модуль ' + l.module), lessons: [] };
        modules.push(byNum[l.module]);
      }
      byNum[l.module].lessons.push(l);
      total += lessonUnits(l);
      done += lessonDoneUnits(l);
    });
    var pct = total ? Math.round((done / total) * 100) : 0;

    hero.appendChild(el('div', 'finish-emoji', pct >= 100 ? '🏆' : '🎓'));
    hero.appendChild(el('div', 'finish-heading',
      pct >= 100 ? 'Курс пройден полностью!' : 'Твой прогресс по курсу'));
    hero.appendChild(el('div', 'finish-subline',
      'Пройдено <b>' + done + '</b> из <b>' + total + '</b> юнитов (' + pct + '%)' +
      (pct >= 100 ? '' : ' — возвращайся к незакрытым квизам, лабам и кейсам')));

    var rows = el('div', 'finish-rows');
    modules.forEach(function (m) {
      var t = 0, d = 0;
      m.lessons.forEach(function (l) { t += lessonUnits(l); d += lessonDoneUnits(l); });
      var p = t ? Math.round((d / t) * 100) : 0;
      var row = el('div', 'finish-row');
      row.appendChild(el('div', 'finish-row-title', esc(m.title)));
      var bar = el('div', 'module-progress-bar');
      var fill = el('div', 'module-progress-fill');
      fill.style.width = p + '%';
      bar.appendChild(fill);
      row.appendChild(bar);
      row.appendChild(el('div', 'finish-row-pct', p + '%'));
      rows.appendChild(row);
    });
    hero.appendChild(rows);
    article.insertBefore(hero, article.firstChild);
  }

  function collectQuestions(lessons) {
    return lessons.flatMap(function (lesson) { return lesson.quizzes.flat(); });
  }

  // тренажёр выбирает вопросы внутри активного маршрута
  function mountTrainer(article) {
    var wrap = el('div', 'trainer');
    var btn = el('button', 'btn', 'Собрать сет из 10 вопросов');
    btn.type = 'button';
    wrap.appendChild(btn);
    var note = el('div', 'trainer-note',
      'Вопросы из сданных квизов идут в набор первыми. Остальные берём из выбранного маршрута.');
    wrap.appendChild(note);
    var holder = el('div', 'trainer-holder');
    wrap.appendChild(holder);
    article.appendChild(wrap);

    btn.addEventListener('click', function () {
      var available = routeLessons();
      var passed = available.filter(function (l) {
        var lp = getLessonProgress(l.id);
        for (var i = 0; i < l.quizzes.length; i++) {
          if (lp.quizPassed[i]) return true;
        }
        return false;
      });
      var picked = shuffle(collectQuestions(passed)).slice(0, 10);
      if (picked.length < 10) {
        var remaining = available.filter(function (l) { return !passed.includes(l); });
        picked = picked.concat(shuffle(collectQuestions(remaining)).slice(0, 10 - picked.length));
      }
      holder.innerHTML = '';
      mountQuiz(holder, {
        id: 'trainer-session',
        title: 'Тренажёр',
        module: 0,
        moduleTitle: null,
        order: 0,
        lab: null,
        html: '',
        quizzes: [picked],
        cases: [],
      }, 0);
      holder.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  // ---------- кейс (решение + эталонный разбор) ----------

  function mountCase(slotEl, lesson, caseIndex) {
    var c = lesson.cases[caseIndex];
    var lp = getLessonProgress(lesson.id);
    var done = !!lp.caseDone[caseIndex];
    var answerDraft = be101CaseWork.load(lesson.id, caseIndex, 'answer');
    var reviewDraft = be101CaseWork.load(lesson.id, caseIndex, 'review');
    var answerSaved = answerDraft.saved;
    var reviewSaved = reviewDraft.saved;

    var root = el('div', 'case');
    var head = el('div', 'case-head',
      '<span class="case-badge">Кейс</span>' +
      '<span class="case-title">' + esc(c.title) + '</span>');
    var badge = el('span', 'case-done-badge', '✓ разобран');
    head.appendChild(badge);
    root.appendChild(head);
    root.appendChild(el('div', 'case-task', esc(c.task)));

    var answer = el('textarea', 'case-input');
    answer.setAttribute('aria-label', 'Решение кейса «' + c.title + '»');
    answer.placeholder = c.placeholder || 'Свой ответ…';
    answer.spellcheck = false;
    answer.value = answerDraft.text;
    root.appendChild(answer);

    var actions = el('div', 'case-actions');
    var toggle = el('button', 'btn small');
    toggle.type = 'button';
    var download = el('button', 'btn small case-download', 'Скачать решение (.md)');
    download.type = 'button';
    actions.append(toggle, download);
    root.appendChild(actions);

    var note = el('p', 'case-note');
    note.setAttribute('role', 'status');
    root.appendChild(note);

    var ref = el('div', 'case-reference', c.referenceHtml);
    ref.id = 'case-reference-' + lesson.id + '-' + caseIndex;
    toggle.setAttribute('aria-controls', ref.id);
    var reviewLabel = el('label', 'case-review', 'Самооценка по разбору');
    var review = el('textarea', 'case-input');
    review.placeholder = 'Какие критерии выполнены? Что стоит доработать?';
    review.value = reviewDraft.text;
    reviewLabel.appendChild(review);
    ref.appendChild(reviewLabel);
    root.appendChild(ref);

    function updateStorageNote() {
      var message = answerSaved && reviewSaved
        ? 'Черновик и самооценка сохраняются в этом браузере.'
        : 'Сохранение в браузере недоступно. Скачай решение перед закрытием страницы.';
      if (note.textContent !== message) note.textContent = message;
    }

    function updateButtons() {
      var hasAnswer = !!answer.value.trim();
      toggle.disabled = !done && !hasAnswer;
      download.disabled = !hasAnswer;
    }

    function updateReview() {
      badge.hidden = !done;
      ref.classList.toggle('show', done);
      toggle.textContent = done ? 'Скрыть эталон' : 'Показать эталонный разбор';
      toggle.setAttribute('aria-expanded', String(done));
      updateButtons();
    }

    answer.addEventListener('input', function () {
      answerSaved = be101CaseWork.save(lesson.id, caseIndex, 'answer', answer.value);
      updateButtons();
      updateStorageNote();
    });
    review.addEventListener('input', function () {
      reviewSaved = be101CaseWork.save(lesson.id, caseIndex, 'review', review.value);
      updateStorageNote();
    });

    toggle.addEventListener('click', function () {
      done = !done;
      setCaseDone(lesson.id, caseIndex, done);
      updateReview();
      updateSidebar();
    });

    download.addEventListener('click', function () {
      var markdown = be101CaseWork.markdown(lesson, caseIndex, answer.value, review.value);
      var url = URL.createObjectURL(new Blob([markdown], { type: 'text/markdown;charset=utf-8' }));
      var link = el('a');
      link.href = url;
      link.download = 'be101-' + lesson.id + '-case-' + (caseIndex + 1) + '.md';
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    });

    updateStorageNote();
    updateReview();
    slotEl.innerHTML = '';
    slotEl.appendChild(root);
  }

  // ---------- карточка лабы ----------

  function mountLab(article, lesson) {
    var lab = lesson.lab;
    if (!lab) return;
    var card = el('div', 'lab-card');
    card.appendChild(el('div', 'lab-head', '<span class="lab-badge">' +
      (isBasicRoute() ? 'Дополнительная практика' : 'Лабораторная') + '</span> ' + esc(lab.title)));
    if (lab.description) card.appendChild(el('p', 'lab-desc', esc(lab.description)));
    if (lab.branch) {
      var links = 'JDK 21 и Maven · Инструкция в <a href="' +
        LAB_REPO + '/blob/' + encodeURIComponent(lab.branch) + '/README.md"><code>' +
        esc(lab.branch) + '</code></a>';
      if (lab.branchSolution) {
        links += ' · Эталон в <a href="' + LAB_REPO + '/tree/' +
          encodeURIComponent(lab.branchSolution) + '"><code>' + esc(lab.branchSolution) + '</code></a>';
      }
      card.appendChild(el('div', 'lab-branches', links));
      if (lab.hasTests) {
        card.appendChild(el('p', 'lab-branches',
          'В заготовке есть падающие проверки. Запусти <code>' +
          esc(lab.testCommand || 'mvn test') + '</code> после выполнения.'));
      }
    }
    var lp = getLessonProgress(lesson.id);
    var label = el('label', 'lab-check',
      '<input type="checkbox"' + (lp.labDone ? ' checked' : '') + '> Я сделал эту лабу');
    label.querySelector('input').addEventListener('change', function (e) {
      setLabDone(lesson.id, e.target.checked);
      updateSidebar(); // только галочки/прогресс, без сброса квиза
    });
    card.appendChild(label);
    article.appendChild(card);
  }

  // ---------- страница ----------

  var app;

  function render() {
    if (!app) app = document.getElementById('app');
    var id = currentLessonId();
    var lesson = LESSONS.filter(function (l) { return l.id === id; })[0];

    app.innerHTML = '';
    if (!lesson) {
      app.appendChild(el('div', 'empty', 'Уроки не найдены — запусти сборку (tools/generator)'));
      return;
    }
    if (isBasicRoute() && lesson.id !== 'course-trainer' && !BASIC_LESSONS.includes(lesson)) {
      rememberRoute('full');
    }

    renderSidebar(app, lesson.id);

    var main = el('main', 'content');
    var article = el('article', 'lesson');
    article.innerHTML = lesson.html;
    main.appendChild(article);
    app.appendChild(main);
    if (BASIC_LESSONS.length && lesson === LESSONS[0]) mountRouteIntro(article);
    article.querySelectorAll('.order-exercise').forEach(be101OrderExercise.mount);

    // лаба — в конец урока
    mountLab(article, lesson);

    // монтируем квизы и кейсы в слоты из markdown
    article.querySelectorAll('.quiz-slot').forEach(function (slot) {
      var idx = Number(slot.dataset.quiz);
      if (lesson.quizzes[idx]) mountQuiz(slot, lesson, idx);
    });
    article.querySelectorAll('.case-slot').forEach(function (slot) {
      var idx = Number(slot.dataset.case);
      if (lesson.cases[idx]) mountCase(slot, lesson, idx);
    });

    // экзамен с одним кейсом и одним квизом → вкладки «Кейс / Экзамен»
    var caseSlot = article.querySelector('.case-slot');
    var quizSlot = article.querySelector('.quiz-slot');
    if (caseSlot && quizSlot && lesson.cases.length === 1 && lesson.quizzes.length === 1) {
      var tabs = el('div', 'exam-tabs');
      var tabRow = el('div', 'exam-tab-row');
      var paneCase = el('div', 'exam-pane');
      var paneExam = el('div', 'exam-pane');
      var btnCase = el('button', 'exam-tab', 'Кейс');
      var btnExam = el('button', 'exam-tab', 'Экзамен');
      btnCase.type = 'button';
      btnExam.type = 'button';
      function showTab(which) {
        btnCase.classList.toggle('active', which === 'case');
        btnExam.classList.toggle('active', which === 'exam');
        paneCase.classList.toggle('show', which === 'case');
        paneExam.classList.toggle('show', which === 'exam');
      }
      btnCase.addEventListener('click', function () { showTab('case'); });
      btnExam.addEventListener('click', function () { showTab('exam'); });
      tabRow.appendChild(btnCase);
      tabRow.appendChild(btnExam);
      tabs.appendChild(tabRow);
      caseSlot.parentNode.insertBefore(tabs, caseSlot);
      paneCase.appendChild(caseSlot);
      paneExam.appendChild(quizSlot);
      tabs.appendChild(paneCase);
      tabs.appendChild(paneExam);
      var lp = getLessonProgress(lesson.id);
      showTab(lp.caseDone && lp.caseDone[0] ? 'exam' : 'case');
    }

    // оглавление урока по разделам (h2), если их много
    var heads = article.querySelectorAll('.lesson h2');
    if (heads.length >= 4) {
      var toc = el('div', 'lesson-toc');
      toc.appendChild(el('div', 'lesson-toc-title', 'В этом уроке'));
      var tocList = el('div', 'lesson-toc-list');
      heads.forEach(function (h, i) {
        var link = el('button', 'lesson-toc-link', esc(h.textContent));
        link.type = 'button';
        link.addEventListener('click', function () {
          h.scrollIntoView({ behavior: 'smooth', block: 'start' });
        });
        tocList.appendChild(link);
      });
      toc.appendChild(tocList);
      var h1 = article.querySelector('h1');
      if (lesson === LESSONS[0] && article.querySelector('[data-order-exercise="read"]')) {
        article.insertBefore(toc, heads[1]);
      } else if (h1 && h1.nextSibling) {
        article.insertBefore(toc, h1.nextSibling);
      } else {
        article.insertBefore(toc, article.firstChild);
      }
    }

    // спец-страницы и навигация
    if (lesson.id === 'course-finish') mountFinishHero(article);
    if (lesson.id === 'course-trainer') mountTrainer(article);
    appendLessonNav(article, lesson);

    // mermaid-диаграммы
    if (window.mermaid) {
      try {
        window.mermaid.initialize({
          startOnLoad: false,
          theme: currentTheme() === 'dark' ? 'dark' : 'neutral',
          locale: 'ru',
        });
        var nodes = article.querySelectorAll('.mermaid');
        if (nodes.length) window.mermaid.run({ nodes: nodes });
      } catch (_) { /* диаграммы не критичны */ }
    }

    window.scrollTo(0, 0);
  }

  window.addEventListener('hashchange', render);
  document.addEventListener('DOMContentLoaded', render);
  if (document.readyState !== 'loading') render();
})();

</script>
</body>
</html>
