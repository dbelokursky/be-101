# GitHub загружает workflow из ветки события. Копия файла нужна в каждой
# ветке с автопроверкой. Инструкция для студентов находится в README курса.
name: Lab check

on:
  pull_request:
    branches:
      - 'lab-10'
      - 'lab-10-solution'
  push:
    branches:
      - 'lab-[2-9]'
      - 'lab-10'
      - 'lab-[2-9]-solution'
      - 'lab-10-solution'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: mvn test (приёмник лабы этой ветки)
        run: mvn -B test
