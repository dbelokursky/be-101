openapi: 3.1.0
info:
  title: Booking API
  version: 0.1.0
  description: >
    Контракт API бронирования переговорок (лаба 3, модуль «Проектирование API»).
    Часть про комнаты (rooms) готова — используйте её как образец.
    Часть про брони (bookings) — ваша задача: см. TODO и README.
servers:
  - url: https://booking.example.com
paths:
  # ---------- ГОТОВО: образец ----------
  /api/rooms:
    get:
      summary: Список переговорок
      parameters:
        - name: capacity
          in: query
          description: Минимальная вместимость
          schema:
            type: integer
      responses:
        "200":
          description: Список комнат
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
              example:
                - id: "7"
                  name: "Красная"
                  capacity: 12
                  projector: true

  # ---------- TODO 1-3: опишите бронирования ----------
  # POST   /api/bookings        — создать бронь (201/400/409)
  # GET    /api/bookings?mine   — список своих броней (200)
  # DELETE /api/bookings/{id}   — отменить бронь (204/404)
  #
  # Требования — в README; проверка — BookingContractTest (mvn test).

components:
  schemas:
    # ---------- ГОТОВО ----------
    Room:
      type: object
      required: [id, name, capacity]
      properties:
        id:
          type: string
        name:
          type: string
          example: Красная
        capacity:
          type: integer
          minimum: 1
        projector:
          type: boolean
          default: false

    Error:
      type: object
      required: [code, title]
      properties:
        code:
          type: string
          example: SLOT_TAKEN
        title:
          type: string
          example: Слот уже занят

    # ---------- TODO 4: схемы броней ----------
    # CreateBookingRequest: roomId, startsAt, endsAt — все required
    # Booking: id, roomId, startsAt, endsAt, status (ACTIVE/CANCELLED),
    #          bookedBy; required: [id, roomId, startsAt, endsAt, status]
