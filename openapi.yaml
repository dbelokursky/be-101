openapi: 3.1.0
info:
  title: Booking API
  version: 0.1.0
  description: >
    Контракт API бронирования переговорок (лаба 3, модуль «Проектирование API»).
    Часть про комнаты (rooms) готова — используйте её как образец.
    Часть про брони (bookings) — ваша задача: см. TODO и README.
servers:
  - url: https://booking.example.com
paths:
  # ---------- ГОТОВО: образец ----------
  /api/rooms:
    get:
      summary: Список переговорок
      parameters:
        - name: capacity
          in: query
          description: Минимальная вместимость
          schema:
            type: integer
      responses:
        "200":
          description: Список комнат
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
              example:
                - id: "7"
                  name: "Красная"
                  capacity: 12
                  projector: true

  # ---------- БРОНИ ----------
  /api/bookings:
    post:
      summary: Создать бронь
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
            example:
              roomId: "7"
              startsAt: "2026-12-01T14:00:00Z"
              endsAt: "2026-12-01T15:00:00Z"
      responses:
        "201":
          description: Бронь создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Ошибки валидации (пустая комната, endsAt раньше startsAt)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_ERROR
                title: Запрос не прошёл валидацию
        "409":
          description: Слот уже занят
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: SLOT_TAKEN
                title: Слот уже занят
    get:
      summary: Список броней
      parameters:
        - name: mine
          in: query
          description: Только мои брони
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Список броней
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /api/bookings/{id}:
    delete:
      summary: Отменить бронь
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Бронь отменена (без тела)
        "404":
          description: Бронь не найдена
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: BOOKING_NOT_FOUND
                title: Бронь не найдена

components:
  schemas:
    # ---------- ГОТОВО ----------
    Room:
      type: object
      required: [id, name, capacity]
      properties:
        id:
          type: string
        name:
          type: string
          example: Красная
        capacity:
          type: integer
          minimum: 1
        projector:
          type: boolean
          default: false

    Error:
      type: object
      required: [code, title]
      properties:
        code:
          type: string
          example: SLOT_TAKEN
        title:
          type: string
          example: Слот уже занят

    # ---------- БРОНИ ----------
    CreateBookingRequest:
      type: object
      required: [roomId, startsAt, endsAt]
      properties:
        roomId:
          type: string
          example: "7"
        startsAt:
          type: string
          format: date-time
          example: "2026-12-01T14:00:00Z"
        endsAt:
          type: string
          format: date-time
          example: "2026-12-01T15:00:00Z"

    Booking:
      type: object
      required: [id, roomId, startsAt, endsAt, status]
      properties:
        id:
          type: string
          example: "b-1042"
        roomId:
          type: string
          example: "7"
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [ACTIVE, CANCELLED]
          example: ACTIVE
        bookedBy:
          type: string
          description: Логин сотрудника, создавшего бронь
          example: ann
